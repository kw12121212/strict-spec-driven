# Distribute dsh-plugin-strict-spec publicly.
#
# Publication discipline (see the dsh-plugin-host standard, rule
# plugin-publishes-only-from-ci-tag): a public release ships only from this
# workflow run on a pushed commit of main, and only when an existing
# plugin-v<version> tag names exactly the version committed in
# plugins/dsh-strict-spec/package.json and points at that same commit. The
# ancestry, tag, and version checks run first and fail closed, so a stale or
# mistyped tag can never ship wrong bits, and a merge that carries no new
# version ends green with a skip notice instead of a red run.
#
# Both public channels publish from that one run:
#   - release: builds the plugin, packs the npm-shaped tarball, and attaches it
#     to the tag's GitHub Release — the release-asset channel, needing nothing
#     but this repository.
#   - publish-npm: publishes the same build to the registry over OIDC trusted
#     publishing. No registry credential lives in repository secrets: the npm
#     side trusts this repository and workflow filename, and npm generates the
#     provenance statement for the publish.
name: publish-npm

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-plugin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gate.outputs.version }}
      skip: ${{ steps.gate.outputs.skip }}
      dist_tag: ${{ steps.gate.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Decide whether this commit publishes
        id: gate
        run: |
          set -euo pipefail
          version="$(node -p "require('./plugins/dsh-strict-spec/package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "dist_tag=next" >> "$GITHUB_OUTPUT" ;;
            *) echo "dist_tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac
          if npm view "dsh-plugin-strict-spec@${version}" version >/dev/null 2>&1; then
            echo "::notice::the registry already carries ${version}; nothing to publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          git fetch -q origin main --tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "the published commit $GITHUB_SHA is not on main" >&2
            exit 1
          fi
          tag="plugin-v${version}"
          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "no ${tag} tag names the committed plugin version ${version}" >&2
            exit 1
          fi
          if [ "$(git rev-list -n 1 "refs/tags/${tag}")" != "$GITHUB_SHA" ]; then
            echo "${tag} does not point at the published commit $GITHUB_SHA" >&2
            exit 1
          fi
          echo "publishing dsh-plugin-strict-spec@${version} from ${GITHUB_SHA} on main"

  release:
    needs: resolve
    if: needs.resolve.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install repository dependencies
        run: bun install

      - name: Build and pack the plugin
        working-directory: plugins/dsh-strict-spec
        run: |
          bun install
          bun run lint
          bun run build
          npm pack --silent

      - name: Attach the tarball to the tag's GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          tag="plugin-v${VERSION}"
          file="plugins/dsh-strict-spec/dsh-plugin-strict-spec-${VERSION}.tgz"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "dsh-plugin-strict-spec ${VERSION}" \
                 --notes "Plugin release ${VERSION}. Install paths are documented in plugins/dsh-strict-spec/README.md."
          gh release upload "$tag" "$file" --clobber

  publish-npm:
    needs: [resolve, release]
    if: needs.resolve.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Install repository dependencies
        run: bun install

      - name: Build the plugin bundle
        working-directory: plugins/dsh-strict-spec
        run: |
          bun install
          bun run lint
          bun run build

      - name: Publish to the registry
        working-directory: plugins/dsh-strict-spec
        env:
          DIST_TAG: ${{ needs.resolve.outputs.dist_tag }}
        run: npm publish --access public --tag "$DIST_TAG"

      - name: Report the published version
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          curl -s "https://registry.npmjs.org/dsh-plugin-strict-spec/${VERSION}" > published.json
          node -e '
            const d = require("./published.json");
            const repo = (d.repository && d.repository.url) || "no repository";
            const attest = (d.dist && d.dist.attestations && d.dist.attestations.url) || "no provenance";
            console.log(`${d.name}@${d.version} | ${repo} | ${attest}`);
          '

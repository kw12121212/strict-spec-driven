schema: strict-spec-driven/debug-session/v1
schema_version: 1
artifact_type: debug_session
schema_file: ../../templates/strict-spec-driven/schemas/debug-session.yaml
debug_session:
  id: checkout-cdp-target
  status: proposed
issue:
  summary: Checkout button does not submit inside the Electron shell.
  observed_behavior: The button appears enabled, but clicking it does not create a network request.
  expected_behavior: Clicking the button sends the checkout request or surfaces a visible validation error.
scope:
  layers:
    - frontend
    - electron
    - cdp_access
  out_of_scope:
    - Production tracing backends are not part of this local investigation.
targets:
  app-window:
    layer: electron
    kind: electron_app
    label: Checkout Electron window.
    command: "npm run electron:dev"
    notes:
      - Use the visible checkout window target, not the background process.
  checkout-page:
    layer: frontend
    kind: browser_page
    label: Checkout route.
    url: "http://127.0.0.1:3000/checkout"
    notes:
      - Inspect console, DOM state, and network requests after the click.
  cdp:
    layer: cdp_access
    kind: cdp_target
    label: Electron CDP endpoint.
    cdp_endpoint: "http://127.0.0.1:9222"
    notes:
      - Record selected target type and URL before drawing conclusions.
reproduction:
  preconditions:
    - Dependencies are installed and the Electron app is running with CDP enabled.
  steps:
    - id: open-checkout
      target: checkout-page
      action: Open the checkout route in the Electron window.
      expected: The checkout form is visible.
    - id: click-submit
      target: checkout-page
      action: Click the checkout button.
      expected: A checkout request is sent or an inline validation error appears.
  expected_failure: The click produces no network request and no visible validation error.
evidence:
  directory: evidence/
  entries:
    - id: before-click
      type: screenshot
      path: evidence/before-click.png
      layer: frontend
      target: checkout-page
      description: Checkout form before the submit click.
      redacted: true
    - id: dev-session-plan
      type: text_log
      path: evidence/dev-session-plan.json
      layer: cdp_access
      description: Dry lifecycle plan for declared checkout services.
      redacted: true
    - id: dev-session-start
      type: text_log
      path: evidence/dev-session-start.json
      layer: cdp_access
      description: Startup result for declared checkout services.
      redacted: true
    - id: dev-session-status
      type: text_log
      path: evidence/dev-session-status.json
      layer: cdp_access
      description: Service status during checkout debugging.
      redacted: true
    - id: web-log
      type: text_log
      path: evidence/web.log
      layer: web_api
      description: Redacted web service log captured during the failing click.
      redacted: true
hypotheses:
  - id: renderer-handler-missing
    statement: The renderer click handler is not attached in the Electron window.
    layer: frontend
    status: open
    evidence:
      - before-click
findings: []
human_checkpoints:
  - id: signed-in-session
    reason: The checkout route requires an authenticated session.
    requested_action: Human signs in directly in the prepared Electron window.
    sensitive: true
    status: pending
    resume_condition: The checkout form is visible after sign-in.
    evidence_before:
      - before-click
    evidence_after: []
manual_actions:
  - id: human-sign-in
    checkpoint: signed-in-session
    actor: human
    summary: Human will enter credentials directly; credential values are not recorded.
    secrets_recorded: false
    status: completed
    evidence: []
cdp_health:
  required: true
  checks:
    - id: cdp-target-selected
      target: cdp
      status: not_checked
      notes:
        - Confirm the selected target URL matches the checkout window before capturing evidence.
dev_session:
  declaration: .strict-spec-driven/dev-session.yaml
  session_id: checkout-electron
  services:
    - web
    - electron
  lifecycle:
    plan:
      command: strict-spec-driven dev-session-plan
      status: passed
      evidence:
        - dev-session-plan
    start:
      command: strict-spec-driven dev-session-start
      status: passed
      evidence:
        - dev-session-start
    status:
      command: strict-spec-driven dev-session-status
      status: passed
      evidence:
        - dev-session-status
    logs:
      - service: web
        command: strict-spec-driven dev-session-logs web
        evidence:
          - web-log
    stop:
      command: strict-spec-driven dev-session-stop
      status: not_run
      evidence: []
      notes:
        - Run stop before ending the investigation if this session started services.
    cleanup_status: pending
  unavailable_conditions: []
replay:
  commands:
    - id: frontend-test
      command: "npm test -- checkout"
      working_directory: "."
      layer: frontend
      target: checkout-page
      expected_result: Reproduces or verifies the checkout click behavior.
verification:
  status: not_started
  steps:
    - id: repeat-click
      action: Repeat the checkout click after the suspected fix.
      expected: A checkout request or visible validation error appears.
      status: pending
  evidence: []

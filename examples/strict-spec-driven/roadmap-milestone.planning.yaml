schema: strict-spec-driven/roadmap-milestone/v2
schema_version: 2
artifact_type: roadmap_milestone
schema_file: ../../templates/strict-spec-driven/schemas/roadmap-milestone.yaml
milestone:
  0002-roadmap-workflow:
    title: Roadmap Workflow
goal: Define strict roadmap workflow behavior.
scope:
  in:
    - Strict roadmap validation and recommendation behavior.
    - Structured roadmap proposal handoff behavior.
  out:
    - Migration of legacy Markdown roadmap artifacts.
done_criteria:
  - The roadmap contract is implemented and verified.
  - Roadmap validation can inspect milestone and planned change structure.
intake_questions:
  - id: objective
    question: What observable outcome should this milestone deliver?
    context: Roadmap behavior spans validation, recommendation, and proposal handoff, so the milestone needs one testable outcome.
    impact: Unclear objective affects milestone scope and every roadmap-backed planned change.
    recommendation: Treat valid roadmap status plus deterministic recommendation behavior as the observable milestone outcome.
  - id: work-decomposition
    question: What standalone planned changes are needed to deliver this milestone?
    context: Roadmap recommendation consumes planned-change artifacts rather than hidden milestone prose.
    impact: Missing decomposition blocks roadmap-backed proposal generation.
    recommendation: Keep validation and recommendation work as separate planned changes with explicit dependency order.
  - id: verification-evidence
    question: How will milestone work be verified across implementation, tests, docs, and workflow artifacts?
    context: Roadmap behavior must stay aligned with the strict YAML schema contract.
    impact: Missing verification affects archive confidence for roadmap-backed changes.
    recommendation: Use roadmap-and-migration regression tests plus schema validation checks as milestone evidence.
planned_changes:
  validate-roadmap-contract:
    status: planned
    summary: Validate roadmap milestone and planned change structure.
    details: |
      The roadmap validator checks milestone fields, inline planned change fields,
      and dependency references before roadmap-backed changes are proposed.
    depends_on: []
  recommend-roadmap-change:
    status: planned
    summary: Recommend the next roadmap-backed strict change.
    details: |
      The recommendation flow selects a planned change and prepares it for strict
      proposal handoff while preserving roadmap dependency order.
    depends_on:
      - validate-roadmap-contract
dependencies:
  - 0001-foundation
risks:
  - Roadmap behavior could drift from the schema contract if validation is incomplete.
status: active
notes:
  - Roadmap skills should consume the same structured artifact contract as CLI validation.
details: |
  The roadmap workflow must enforce the same schema contract that CLI validation
  checks, so that skill-driven proposal handoff and programmatic validation stay
  consistent. Any divergence between skill behavior and CLI validation is a bug.

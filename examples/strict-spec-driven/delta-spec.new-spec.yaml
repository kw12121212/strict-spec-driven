schema_file: ../../templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: example-new-spec
spec:
  title: Example New Spec
  path: .strict-spec-driven/specs/example/new-spec.yaml
mapping:
  implementation: []
  tests: []
operations:

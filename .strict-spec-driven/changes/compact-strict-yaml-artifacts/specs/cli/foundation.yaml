schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: cli-foundation
mapping:
  implementation:
    - src/scaffold.ts
    - src/validation.ts
    - src/verify.ts
    - src/archive.ts
    - src/review.ts
    - src/roadmap/load.ts
    - src/roadmap/validate.ts
    - src/roadmap/sync.ts
    - src/converters/roadmap.ts
    - src/migrate/converters/specs.ts
    - src/migrate/converters/changes.ts
    - templates/strict-spec-driven/scaffold/config.yaml
    - templates/strict-spec-driven/scaffold/specs/INDEX.yaml
    - templates/strict-spec-driven/scaffold/roadmap/INDEX.yaml
    - templates/strict-spec-driven/scaffold/changes/proposal.yaml
    - templates/strict-spec-driven/scaffold/changes/design.yaml
    - templates/strict-spec-driven/scaffold/changes/tasks.yaml
    - templates/strict-spec-driven/scaffold/changes/questions.yaml
  tests:
    - test/run.ts
    - test/suites/foundation-and-fixtures.ts
    - test/suites/change-lifecycle.ts
    - test/suites/roadmap-and-migration.ts
operations:
  ADDED:
    - requirement:
        id: cli-self-hosted-compact-yaml-alignment
        strength: MUST
        statement: >-
          The system MUST keep bundled strict workflow templates and checked-in
          `.strict-spec-driven/` workflow artifacts aligned to one current compact YAML contract so
          self-hosted repository workflows do not depend on mixed artifact generations.
        scenarios:
          - id: bundled-and-self-hosted-artifacts-share-one-contract
            steps:
              - kind: GIVEN
                text: the repository's bundled strict templates and checked-in strict workflow state are reviewed
              - kind: WHEN
                text: artifact shape generation is compared across those surfaces
              - kind: THEN
                text: both surfaces follow the same current compact artifact contract
              - kind: AND
                text: checked-in strict workflow artifacts do not depend on removed verbose envelope fields
  MODIFIED:
    - target_requirement: cli-shared-yaml-validation-layer
      replacement:
        id: cli-shared-yaml-validation-layer
        strength: MUST
        statement: >-
          The system MUST provide shared strict-CLI validation utilities for YAML parse/stringify,
          compact schema compilation, artifact-role-based schema resolution, and deterministic
          diagnostics so multiple commands can validate compact artifacts through one consistent
          pipeline.
        scenarios:
          - id: bundled-schemas-are-loadable-for-command-validation
            steps:
              - kind: GIVEN
                text: a strict CLI command needs to validate a compact artifact
              - kind: WHEN
                text: it requests a schema through the shared validation utilities
              - kind: THEN
                text: the schema is resolved from bundled strict schema assets under `templates/strict-spec-driven/schemas/`
              - kind: AND
                text: artifact role, registry data, or artifact path can select the schema without repeated instance headers
          - id: validation-diagnostics-are-deterministic
            steps:
              - kind: GIVEN
                text: the same invalid compact artifact is validated multiple times against the same schema
              - kind: WHEN
                text: diagnostics are emitted by the shared validation utilities
              - kind: THEN
                text: diagnostic entries are stable in structure and ordering
              - kind: AND
                text: each diagnostic includes artifact path and field-path context
    - target_requirement: cli-propose-creates-strict-change-scaffold
      replacement:
        id: cli-propose-creates-strict-change-scaffold
        strength: MUST
        statement: >-
          The system MUST provide a `propose` subcommand that creates compact strict change
          planning artifacts under `.strict-spec-driven/changes/<name>/`.
        scenarios:
          - id: propose-scaffolds-strict-yaml-artifacts
            steps:
              - kind: GIVEN
                text: a valid kebab-case change name that does not already exist
              - kind: WHEN
                text: '`strict-spec-driven propose <name>` is executed'
              - kind: THEN
                text: the change directory is created under `.strict-spec-driven/changes/`
              - kind: AND
                text: >-
                  `proposal.yaml`, `design.yaml`, `tasks.yaml`, and `questions.yaml` are created
                  from compact strict templates
              - kind: AND
                text: a `specs/` directory is created for compact delta specs
    - target_requirement: cli-verify-validates-artifacts-against-schemas
      replacement:
        id: cli-verify-validates-artifacts-against-schemas
        strength: MUST
        statement: >-
          The system MUST validate each change planning artifact against the compact strict YAML
          schema resolved for that artifact role and include any schema violations in the
          verification diagnostics.
        scenarios:
          - id: valid-artifacts-produce-no-schema-diagnostics
            steps:
              - kind: GIVEN
                text: >-
                  a strict change has valid compact `proposal.yaml`, `design.yaml`, `tasks.yaml`,
                  and `questions.yaml`
              - kind: WHEN
                text: '`strict-spec-driven verify <name>` is executed'
              - kind: THEN
                text: no schema validation diagnostics are emitted for those artifacts
          - id: invalid-artifact-produces-schema-diagnostics
            steps:
              - kind: GIVEN
                text: 'a strict change has a compact `tasks.yaml` missing a required field'
              - kind: WHEN
                text: '`strict-spec-driven verify <name>` is executed'
              - kind: THEN
                text: a schema validation diagnostic is emitted identifying the artifact path and field path
              - kind: AND
                text: validation does not require removed instance-level envelope fields to select the schema
  REMOVED: []

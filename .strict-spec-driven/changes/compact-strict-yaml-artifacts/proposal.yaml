schema: strict-spec-driven/change-proposal/v1
schema_version: 1
artifact_type: change_proposal
schema_file: templates/strict-spec-driven/schemas/change-proposal.yaml
change:
  id: compact-strict-yaml-artifacts
  status: proposed
summary:
  what:
    - >-
      Replace the current verbose strict YAML artifact envelopes with a compact v2 shape across
      bundled templates, bundled examples, bundled schemas, and repository-owned
      `.strict-spec-driven/` artifacts.
    - >-
      Make strict CLI validation, scaffold, verify, archive, roadmap, review, and migration flows
      resolve compact artifact contracts without repeated per-document identity headers.
  why:
    - >-
      Current strict YAML artifacts repeat schema metadata on nearly every document, making
      templates, schemas, and self-hosted workflow state larger and noisier than the behavior they
      describe.
    - >-
      The repository already mixes a verbose embedded `json_schema` style with a more compact
      declarative schema style; converging on one compact contract reduces duplication and drift.
scope:
  in:
    - Define compact v2 artifact shapes for the required strict workflow YAML families.
    - Update bundled schemas, examples, and scaffold templates under `templates/strict-spec-driven/`.
    - Update strict CLI code paths to read, validate, emit, and rewrite compact v2 artifacts only.
    - Rewrite checked-in `.strict-spec-driven/` specs, roadmap artifacts, active changes, and archived changes to the compact v2 layout.
  out:
    - Preserve v1 strict YAML artifact readers alongside the compact v2 contract.
    - Change strict command names, repository root directories, or legacy Markdown input policy.
    - Redesign roadmap semantics, requirement matching rules, or task lifecycle semantics beyond YAML shape compaction.
unchanged_behavior:
  - Stable spec, requirement, and scenario identifiers remain the semantic identity model.
  - The workflow continues to use `.strict-spec-driven/` and `templates/strict-spec-driven/` as the strict YAML roots.
  - Commands such as `init`, `propose`, `verify`, `archive`, and roadmap sync keep their current responsibilities apart from the compacted artifact shapes they process.

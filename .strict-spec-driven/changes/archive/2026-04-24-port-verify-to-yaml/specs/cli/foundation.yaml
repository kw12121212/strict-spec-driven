schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: cli-foundation
mapping:
  implementation:
    - src/verify.ts
    - src/strict-spec-cli.ts
  tests:
    - test/run.ts
operations:
  ADDED:
    - requirement:
        id: cli-verify-reads-active-change-artifacts
        strength: MUST
        statement: >-
          The system MUST provide a `verify` subcommand that reads all planning artifacts
          (proposal.yaml, design.yaml, tasks.yaml, questions.yaml) and any delta spec files under
          `specs/` from a named active strict change directory under
          `.strict-spec-driven/changes/<name>/`.
        scenarios:
          - id: verify-locates-artifacts-for-an-existing-change
            steps:
              - kind: GIVEN
                text: '`.strict-spec-driven/changes/<name>/` exists with planning artifacts'
              - kind: WHEN
                text: '`strict-spec-driven verify <name>` is executed'
              - kind: THEN
                text: the command reads and parses each planning artifact from the change directory
          - id: verify-rejects-missing-change
            steps:
              - kind: GIVEN
                text: '`.strict-spec-driven/changes/<name>/` does not exist'
              - kind: WHEN
                text: '`strict-spec-driven verify <name>` is executed'
              - kind: THEN
                text: the command exits non-zero
              - kind: AND
                text: an error message is written to stderr indicating the change was not found
    - requirement:
        id: cli-verify-validates-artifacts-against-schemas
        strength: MUST
        statement: >-
          The system MUST validate each change planning artifact against its registered strict YAML
          schema and include any schema violations in the verification diagnostics.
        scenarios:
          - id: valid-artifacts-produce-no-schema-diagnostics
            steps:
              - kind: GIVEN
                text: >-
                  a strict change has valid proposal.yaml, design.yaml, tasks.yaml, and
                  questions.yaml
              - kind: WHEN
                text: '`strict-spec-driven verify <name>` is executed'
              - kind: THEN
                text: no schema validation diagnostics are emitted for those artifacts
          - id: invalid-artifact-produces-schema-diagnostics
            steps:
              - kind: GIVEN
                text: a strict change has a tasks.yaml missing a required field
              - kind: WHEN
                text: '`strict-spec-driven verify <name>` is executed'
              - kind: THEN
                text: >-
                  a schema validation diagnostic is emitted identifying the artifact path and field
                  path
    - requirement:
        id: cli-verify-checks-task-completion
        strength: MUST
        statement: >-
          The system MUST report a verification diagnostic when any task in the change has a status
          other than `complete`.
        scenarios:
          - id: all-tasks-complete-produces-no-task-diagnostics
            steps:
              - kind: GIVEN
                text: 'a strict change has tasks.yaml with all tasks having `status: complete`'
              - kind: WHEN
                text: '`strict-spec-driven verify <name>` is executed'
              - kind: THEN
                text: no task-completion diagnostics are emitted
          - id: pending-task-produces-diagnostic
            steps:
              - kind: GIVEN
                text: 'a strict change has tasks.yaml with at least one task having `status: pending`'
              - kind: WHEN
                text: '`strict-spec-driven verify <name>` is executed'
              - kind: THEN
                text: a diagnostic is emitted identifying the incomplete task
    - requirement:
        id: cli-verify-checks-open-questions
        strength: MUST
        statement: >-
          The system MUST report a verification diagnostic when the questions artifact contains any
          open questions.
        scenarios:
          - id: no-open-questions-produces-no-question-diagnostics
            steps:
              - kind: GIVEN
                text: a strict change has questions.yaml with an empty `open` list
              - kind: WHEN
                text: '`strict-spec-driven verify <name>` is executed'
              - kind: THEN
                text: no open-question diagnostics are emitted
          - id: open-questions-produce-diagnostics
            steps:
              - kind: GIVEN
                text: a strict change has questions.yaml with at least one entry in the `open` list
              - kind: WHEN
                text: '`strict-spec-driven verify <name>` is executed'
              - kind: THEN
                text: a diagnostic is emitted for each open question
    - requirement:
        id: cli-verify-validates-testing-gates
        strength: MUST
        statement: >-
          The system MUST validate that `tasks.yaml` testing gates reference existing task IDs
          within the Testing section and report a diagnostic when a referenced task ID is missing or
          outside the Testing section.
        scenarios:
          - id: valid-testing-gates-produce-no-diagnostics
            steps:
              - kind: GIVEN
                text: >-
                  a strict change has tasks.yaml where `testing_gates.validation_task` and
                  `testing_gates.unit_test_task` reference existing task IDs in the Testing section
              - kind: WHEN
                text: '`strict-spec-driven verify <name>` is executed'
              - kind: THEN
                text: no testing-gate diagnostics are emitted
          - id: missing-testing-gate-target-produces-diagnostic
            steps:
              - kind: GIVEN
                text: >-
                  a strict change has tasks.yaml where `testing_gates.validation_task` references a
                  task ID that does not exist in the Testing section
              - kind: WHEN
                text: '`strict-spec-driven verify <name>` is executed'
              - kind: THEN
                text: a diagnostic is emitted identifying the invalid testing gate reference
    - requirement:
        id: cli-verify-validates-delta-specs
        strength: MUST
        statement: >-
          The system MUST validate each YAML file under the change `specs/` directory against the
          registered delta-spec schema and include any violations in the verification diagnostics.
        scenarios:
          - id: valid-delta-specs-produce-no-diagnostics
            steps:
              - kind: GIVEN
                text: >-
                  a strict change has delta spec files under `specs/` that conform to the delta-spec
                  schema
              - kind: WHEN
                text: '`strict-spec-driven verify <name>` is executed'
              - kind: THEN
                text: no delta-spec diagnostics are emitted
          - id: malformed-delta-spec-produces-diagnostics
            steps:
              - kind: GIVEN
                text: >-
                  a strict change has a delta spec file under `specs/` that violates the delta-spec
                  schema
              - kind: WHEN
                text: '`strict-spec-driven verify <name>` is executed'
              - kind: THEN
                text: a diagnostic is emitted identifying the delta spec path and violation
    - requirement:
        id: cli-verify-enforces-exclusive-active-targets
        strength: MUST
        statement: >-
          The system MUST report a verification diagnostic when two or more active changes have
          delta specs that target the same requirement ID with MODIFIED or REMOVED operations.
        scenarios:
          - id: no-target-overlap-produces-no-conflict-diagnostics
            steps:
              - kind: GIVEN
                text: >-
                  active changes have delta specs with disjoint MODIFIED and REMOVED
                  target_requirement values
              - kind: WHEN
                text: '`strict-spec-driven verify <name>` is executed'
              - kind: THEN
                text: no exclusive-active-target diagnostics are emitted
          - id: overlapping-targets-produce-conflict-diagnostics
            steps:
              - kind: GIVEN
                text: >-
                  two active changes each have a delta spec with a MODIFIED entry targeting the same
                  requirement ID
              - kind: WHEN
                text: '`strict-spec-driven verify <name>` is executed'
              - kind: THEN
                text: >-
                  a diagnostic is emitted identifying the conflicting requirement ID and the
                  competing change names
    - requirement:
        id: cli-verify-emits-deterministic-json-output
        strength: MUST
        statement: >-
          The system MUST emit a deterministic JSON object to stdout containing `valid`,
          `diagnostics`, `changeName`, `totalTasks`, `completeTasks`, `remainingPending`, and
          `openQuestionCount`.
        scenarios:
          - id: verify-output-is-parseable-json
            steps:
              - kind: GIVEN
                text: '`strict-spec-driven verify <name>` completes'
              - kind: WHEN
                text: command stdout is parsed as JSON
              - kind: THEN
                text: the JSON includes `valid` as a boolean
              - kind: AND
                text: the JSON includes `diagnostics` as an array
              - kind: AND
                text: >-
                  the JSON includes `changeName`, `totalTasks`, `completeTasks`, `remainingPending`,
                  and `openQuestionCount`
          - id: verify-exits-non-zero-when-invalid
            steps:
              - kind: GIVEN
                text: a strict change has verification diagnostics
              - kind: WHEN
                text: '`strict-spec-driven verify <name>` is executed'
              - kind: THEN
                text: the command exits with a non-zero exit code
          - id: verify-exits-zero-when-valid
            steps:
              - kind: GIVEN
                text: a strict change has no verification diagnostics
              - kind: WHEN
                text: '`strict-spec-driven verify <name>` is executed'
              - kind: THEN
                text: the command exits with exit code zero
    - requirement:
        id: cli-verify-works-from-dist-only
        strength: MUST
        statement: >-
          The system MUST allow `strict-spec-driven verify` to validate change artifacts correctly
          when run from the compiled `dist/` output without the source tree present.
        scenarios:
          - id: verify-succeeds-from-dist-only-environment
            steps:
              - kind: GIVEN
                text: only the `dist/` directory exists with compiled JS and bundled templates
              - kind: WHEN
                text: '`strict-spec-driven verify <name>` is executed against an active change'
              - kind: THEN
                text: it validates the change and emits correct diagnostics
  MODIFIED: []
  REMOVED: []

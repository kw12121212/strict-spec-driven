schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: port-spec-mapping-validation-commands
approach:
  - >-
    Add a dedicated mapping-audit command path that can run independently from change-level
    verification:
  - Extend CLI command routing with `verify-spec-mappings` and deterministic usage/error handling.
  - >-
    Implement a mapping audit module that: discovers main specs under `.spec-driven/specs/` parses
    mapping frontmatter normalizes referenced paths runs mapping coverage checks per spec runs
    unmapped evidence checks for repository implementation and test files
  - >-
    Return deterministic JSON with `valid`, `diagnostics`, and summary counts suitable for CI or
    scripted checks.
  - >-
    Add tests for valid mapping state, missing mapping coverage, unmapped files, and command exit
    semantics.
decisions:
  - id: >-
      keep-mapping-audits-as-a-standalone-command-rather-than-coupling-them-into-verify-change-so-spec-level-audits-remain-runnable-without-change-context
    decision: >-
      Keep mapping audits as a standalone command rather than coupling them into `verify <change>`
      so spec-level audits remain runnable without change context.
    rationale: >-
      Keep mapping audits as a standalone command rather than coupling them into `verify <change>`
      so spec-level audits remain runnable without change context.
  - id: >-
      reuse-existing-yaml-frontmatter-parsing-helpers-where-possible-to-keep-diagnostics-style-consistent-with-existing-verify-behavior
    decision: >-
      Reuse existing YAML/frontmatter parsing helpers where possible to keep diagnostics style
      consistent with existing verify behavior.
    rationale: >-
      Reuse existing YAML/frontmatter parsing helpers where possible to keep diagnostics style
      consistent with existing verify behavior.
  - id: keep-diagnostics-path-aware-and-deterministic-to-preserve-machine-readable-automation-use
    decision: Keep diagnostics path-aware and deterministic to preserve machine-readable automation use.
    rationale: Keep diagnostics path-aware and deterministic to preserve machine-readable automation use.
alternatives:
  - option: Extend `verify <change>` to include mapping audits.
    reason: Rejected because mapping coverage spans repository spec state, not only one active change.
  - option: Only check mapping field shape without auditing unmapped evidence.
    reason: >-
      Rejected because this would miss the core drift signal where code or tests exist but no spec
      mapping references them.

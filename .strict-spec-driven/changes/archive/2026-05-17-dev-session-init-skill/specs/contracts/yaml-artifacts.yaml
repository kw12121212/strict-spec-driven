schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: contracts-yaml-artifacts
mapping:
  implementation:
    - skills/strict-spec-dev-session-init/SKILL.md
    - skills/marketplace.json
    - DEV_SESSIONS.md
  tests:
    - test/suites/entrypoint-and-skills.ts
    - test/suites/foundation-and-fixtures.ts
operations:
  ADDED:
    dev-session-init-skill-command-contract:
      strength: MUST
      statement: >-
        The system MUST provide a standalone strict dev-session initialization skill package whose
        SKILL.md declares explicit command mappings for the bundled init and dev-session-plan
        commands and instructs agents to refine existing dev-session.yaml content in place instead
        of overwriting it.
      scenarios:
        init-skill-exposes-bootstrap-and-validation-commands:
          - GIVEN: the dev-session initialization SKILL.md is reviewed
          - WHEN: its command mapping and workflow steps are inspected
          - THEN: >-
              the skill declares concrete init and dev-session-plan command usage for bootstrapping
              and validation
          - AND: >-
              the guidance tells agents to update an existing declaration in place rather than
              silently replacing it
  MODIFIED: {}
  REMOVED: {}

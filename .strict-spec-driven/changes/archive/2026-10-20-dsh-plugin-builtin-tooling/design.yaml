schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: dsh-plugin-builtin-tooling
approach:
  - 'The plugin''s host entry stops being empty: behind a single boolean configuration switch it injects the dsh skills service and registers one bundled skill provider on ctx.skills. The provider serves the strict skill packages from assets inside the plugin''s own dist directory, so the strict skills appear in every session''s catalog on a machine where nothing was installed, and the switch turns the whole provision on and off without reinstalling the plugin.'
  - 'The plugin build extends dist from a code-only bundle directory into the plugin''s shipped asset set: it copies every skills/<name>/SKILL.md from the repository into dist/skills/<name>/SKILL.md unchanged, and bundles the strict-spec-cli from src/strict-spec-cli.ts into dist/cli/strict-spec-cli.js with the same node ESM bundling the repository build uses. The host entry locates these assets relative to its own module URL, and the packed-tarball files allowlist keeps naming dist, so every shipped byte stays inside the existing allowlist without touching the packed-tarball-allowlist standard.'
  - At serve time the provider parses each SKILL.md frontmatter for its name and description, strips the frontmatter, and rewrites every bare strict-spec-cli token in the body into a direct invocation of the bundled CLI through the running host's node executable (process.execPath plus the absolute bundled CLI path, quoted only when the path requires it). The repository skills/ packages stay the single authored source — the shipped copies are byte-identical to them, and the rewrite happens only when a body is served, so no second authored variant exists.
  - 'The provider registers its candidates at a rank below every filesystem skill root so the built-in copies win same-name resolution while the switch is enabled: an explicitly installed copy under ~/.agents/skills or a project root loses to the built-in skill, and because winning bodies invoke the bundled CLI, sessions run the built-in CLI too. Disabling the switch unregisters the provider, so external installations take over again exactly as before.'
  - The plugin package declares @deepseek-ai/dsh-skill and @deepseek-ai/schemastery as runtime dependencies pinned to the same patch line as the other dsh packages, keeps them external in the host build alongside cordis, and mirrors them as devDependencies for type checking; both plugin READMEs gain a built-in tooling section documenting the default-on switch, the built-in precedence over external copies, and the profile-patch config that flips it. A new plugin host test suite covers provider listing, frontmatter parsing, CLI rewriting, the precedence rank, and the host-entry wiring, and the release suite's packlist and README checks learn the new assets and docs.
decisions:
  skills-provider-registration:
    decision: Register one bundled skill provider through ctx.skills.registerProvider from the host entry, injecting the skills service, instead of ctx.skills.register runtime skills or a filesystem-root contribution.
    rationale: 'The provider path is the pattern the pinned dsh host uses for its own bundled skills (dsh-skill-badge), gives full control of candidate rank (the runtime register path fixes RUNTIME_RANK at 250, which loses to project roots and cannot satisfy the built-in-wins requirement), and keeps the provision teardown-safe: disposing the fiber unregisters the provider and invalidates catalogs when the switch flips or the plugin unloads.'
  builtin-outranks-external-copies:
    decision: Serve built-in candidates at rank 50, below every filesystem root rank (project 100 through bundled 600), so same-name external skills lose while the switch is enabled.
    rationale: The requester explicitly required on 2026-10-20 that external same-name skills and CLI lose to the built-in copies. Within one registry layer dsh resolves duplicate names by lowest rank, and the filesystem provider's roots occupy 100 through 600, so a rank below 100 is the only value band that wins against every external root. The source field stays 'bundled' because it is origin metadata, not precedence.
  serve-time-cli-rewrite:
    decision: Rewrite every bare strict-spec-cli token in a served skill body into a quoted process.execPath plus bundled-CLI-path invocation when the body is served, instead of authoring a plugin-specific skill variant or relying on the model to substitute a base directory.
    rationale: All 400 occurrences of the token in skills/ are the bare word, so a boundary-guarded literal replacement is total and deterministic; the skills/ packages remain the single authored source (the no-restatement and static-surface standards keep governing one authored copy), and the model is never asked to perform 400 substitutions itself. Quoting only when a path contains shell- or YAML-sensitive characters keeps the rewritten YAML command blocks valid plain scalars on ordinary installs.
  tooling-assets-under-dist:
    decision: Ship the skill bodies and the CLI bundle under the plugin's existing dist directory and resolve them at runtime relative to the host entry's module URL.
    rationale: The packed-tarball-allowlist standard names exactly the built bundle directory, the bundle patch, and the per-locale READMEs; putting tooling assets inside dist keeps the allowlist and the standard unchanged while the tarball still ships no source, build script, or test support. import.meta.url resolution is how the pinned host's own bundled-skill package locates its assets, so it is the pinned-line convention.
  single-config-switch:
    decision: Expose one schemastery boolean config field builtinTooling defaulting to true; when it is false the host entry applies nothing and the plugin is exactly the current viewer-only plugin.
    rationale: 'The requester chose a single master switch controlling skills and CLI together (they are one provision: skills without the rewritten CLI are broken, the CLI without the skills has no session entry point), defaulting to on so the tooling is usable the moment the plugin is installed. The plugin row''s config in the dsh profile patch is the pinned line''s native switch surface.'
  host-side-dependencies-external:
    decision: Consume @deepseek-ai/schemastery as a runtime dependency pinned to ~3.18.5 (external in the host build beside cordis, mirrored as a devDependency) for the Config schema, and @deepseek-ai/dsh-skill as a type-only devDependency whose imports the build erases, so the host bundle gains exactly one runtime import beyond cordis.
    rationale: The provider hands plain objects to the host-owned ctx.skills service, so nothing from dsh-skill is needed at runtime — only its SkillProvider and SkillCandidate types type-check the module — while the Config schema must be a real schemastery object, and shipping the plugin's own schemastery copy as a dependency is the pinned line's own plugin convention (dsh-skill-filesystem declares the same dependency). Declaring dsh-skill as a runtime dependency would add an install-time cost and a second registry-class identity in the dependency graph for no runtime use; the type-only-dependency-type-closure rule keeps it a devDependency with no runtime require, which the bundle-shape suite asserts.
  minimal-frontmatter-reader:
    decision: Parse SKILL.md frontmatter with a small strict reader for the single-line name and description fields rather than inlining a YAML parser into the host bundle.
    rationale: The frontmatter every shipped skill declares is two single-line string fields plus an ignored metadata block, a dedicated suite case covers the reader against every shipped file, and a skill whose frontmatter does not parse is skipped from the catalog rather than guessed at, so the reader's failure mode is omission, not corruption. This keeps the host bundle free of a second YAML implementation.
  real-host-evidence:
    decision: 'Recorded evidence from an isolated real-host leg on 2026-10-20 (DSH_HOME=/tmp/dsh-builtin-evidence/home, pinned dsh 0.2.1-rc.2): npm pack of the built plugin produced exactly 32 tarball entries — dist/client.js, dist/host.js, dist/cli/strict-spec-cli.js, 25 dist/skills/<name>/SKILL.md bodies, cordis.patch.yml, README.md, README.zh.md, package.json — with no source, script, or lockfile entry; ''dsh plugin --profile web add <tarball>'' installed the plugin into the isolated profile with pnpm resolving the new @deepseek-ai/schemastery dependency; ''dsh --profile web --dump-config'' composed the ui-strict-spec row; a probe booting the pinned line''s real SkillRegistry and dsh-skill-filesystem provider and applying the INSTALLED dist host entry observed, with the switch enabled and a planted external strict-spec-auto copy at the project .agents/skills root, 25 built-in skills offered, the strict-spec-auto winner being provider strict-spec-plugin (source bundled, repository description) so the built-in copy beat the external project-root copy, the served body carrying the bundled invocation with the host executable''s absolute path and the installed CLI asset''s absolute path, no bare strict-spec-cli token, and the yaml-authoring-protocol pointer intact; the exact served invocation form (<host executable> <installed dist CLI asset> check-workflow-state) executed and printed ''strict workflow state exists: .strict-spec-driven/''; and the same composition with config builtinTooling:false resolved strict-spec-auto to provider filesystem with the planted external copy''s marker description, so the switch hands precedence back. The probe composed the real registry, providers, and installed plugin dist directly rather than booting the whole web application, and this development machine does carry a global strict-spec-cli on PATH from an earlier install — neither affects the leg, because the served invocation uses absolute paths for both the executable and the CLI asset and performs no PATH lookup.'
    rationale: 'The manual-checks standard requires each leg''s observed evidence inside the change''s own artifacts: the recorded legs cover the shipped-tarball, install, composition, catalog-offering, precedence, served-body, execution, and switch-off behaviors the new requirements state, and name the two environmental boundaries honestly so review verifies recorded evidence rather than trusting task status.'
  rank-literal-guarded-by-pin:
    decision: Keep the suite's filesystem-root rank bound as the literal 100 (the pinned dsh 0.2.1-rc.2 line's project-dsh root rank) rather than deriving it from an installed dsh package at suite time.
    rationale: The filesystem root ranks are internal constants of dsh-skill-filesystem, which the plugin does not depend on, so deriving them would add a dependency whose only use is a test constant; the engines.dsh pin (>=0.2.1-rc.2 <0.2.2) bounds the line the literal names, widening the pin is its own planned change per the narrow-engines-dsh-pin standard, and the change's real-host evidence leg observed the built-in copy winning a same-name resolution against a planted project-root copy through the pinned line's real registry, so the precedence itself is proven behaviorally, not just constant-wise.
alternatives:
  - option: Write a strict-spec-cli shim into a user bin directory on PATH so the CLI works in terminals too
    reason: 'Rejected by the requester on 2026-10-20: the built-in CLI is for agent sessions, and a viewer plugin silently writing into bin directories is an invasive side effect the pinned host''s plugin model does not sanction.'
  - option: Register the skills as ctx.skills.register runtime contributions
    reason: 'Rejected: the runtime path pins RUNTIME_RANK 250, which loses to project-root copies (100, 200) and cannot deliver the required built-in-wins precedence; the provider path owns its rank.'
  - option: Generate plugin-specific SKILL.md variants at build time with the CLI invocation baked in
    reason: 'Rejected: it forks the authored skill text into a second variant that drifts from skills/, violating the single-authored-source convention; serve-time rewriting keeps the shipped copies byte-identical.'
  - option: Two independent switches for skills and CLI
    reason: 'Rejected by the requester on 2026-10-20: one provision, one switch; the skills-without-CLI combination is a broken state, not a feature.'
risks:
  - 'Precedence depends on the dsh-skill registry rank semantics of the pinned 0.2.1-rc.2 line; a future dsh release could change root ranks. Mitigation: the engines.dsh pin stays >=0.2.1-rc.2 <0.2.2, and the suite asserts the provider rank stays below the project-root rank the pinned line declares.'
  - 'Stub-based suites cannot prove the host fiber activates against a real dsh host — the recorded inject lesson shows undeclared context reads fail only at real boot. Mitigation: record an isolated-real-host leg in the change''s acceptance evidence naming what ran and what was observed, alongside the wiring static checks.'
  - 'The serve-time rewrite must not damage the protocol surfaces the skills standard mandates (the yaml-authoring-protocol pointer and validation commands). Mitigation: the host suite asserts every rewritten shipped body still names the protocol command and its artifact validation command and contains no surviving bare strict-spec-cli token.'
  - 'process.execPath or the plugin install path can contain characters that break an unquoted command on unusual hosts. Mitigation: quote a path exactly when it contains characters outside a safe set, and cover both branches in the suite.'

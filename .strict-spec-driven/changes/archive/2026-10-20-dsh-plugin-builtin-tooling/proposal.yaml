schema: strict-spec-driven/change-proposal/v1
schema_version: 1
artifact_type: change_proposal
schema_file: templates/strict-spec-driven/schemas/change-proposal.yaml
change:
  id: dsh-plugin-builtin-tooling
  status: proposed
summary:
  what:
    - 'Add a built-in tooling capability to the dsh strict-spec plugin: while a single host-side configuration switch is enabled (default on), the plugin registers the strict skill packages into the dsh skill registry from assets bundled inside the plugin package, at a precedence that outranks same-name skills from project and user roots, and serves skill bodies whose strict-spec-cli invocations run the plugin-bundled CLI through the running host''s node executable, so a machine needs nothing installed beyond the plugin itself; the plugin build copies the skill bodies from skills/ and bundles the CLI into the shipped dist assets, the plugin package declares the host-side runtime dependencies, and both plugin READMEs document the switch, the built-in precedence, and how to flip the switch through the dsh profile patch'
  why:
    - Using the strict workflow inside dsh today requires a separate install step — bun, an npm-global strict-spec-cli or native executable, and a global skills-CLI registration via install.sh — before any strict skill or CLI command works in a session; the plugin is already installed on machines that need the workflow, so it should carry the tooling itself, and when the same skills or CLI were installed externally the built-in copies must win so sessions always run the tooling version the plugin ships
scope:
  in:
    - 'plugins/dsh-strict-spec/src/host.ts (config schema, skills service injection, provider registration behind the switch); new plugins/dsh-strict-spec/src/host/ modules for asset discovery, skill frontmatter parsing, CLI token rewriting, and the skill provider; plugins/dsh-strict-spec/scripts/build-client.ts (copy skills/*/SKILL.md into dist assets, bundle the strict-spec-cli into dist assets, keep host-side dsh modules external); plugins/dsh-strict-spec/package.json (runtime dependencies @deepseek-ai/dsh-skill and @deepseek-ai/schemastery plus matching devDependencies; files allowlist unchanged at dist); plugins/dsh-strict-spec/README.md and README.zh.md (built-in tooling section: default on, profile-patch switch, built-in precedence over external copies, node requirement); test/suites/dsh-plugin.ts (packlist and README checks for the new assets and docs); a plugin host test suite covering provider listing, frontmatter parsing, CLI rewriting, precedence rank, and host-entry wiring'
    - 'plugins/dsh-strict-spec/src/host.ts (config schema, skills service injection, provider registration behind the switch); new plugins/dsh-strict-spec/src/host/ modules for asset discovery, skill frontmatter parsing, CLI token rewriting, and the skill provider; plugins/dsh-strict-spec/scripts/build-client.ts (copy skills/*/SKILL.md into dist assets, bundle the strict-spec-cli into dist assets, keep host-side dsh modules external); plugins/dsh-strict-spec/package.json (@deepseek-ai/schemastery as the one runtime dependency for the Config schema and @deepseek-ai/dsh-skill as a type-only devDependency; files allowlist unchanged at dist); plugins/dsh-strict-spec/README.md and README.zh.md (built-in tooling section: default on, profile-patch switch, built-in precedence over external copies, node requirement); test/suites/dsh-plugin.ts (README and dependency-shape checks for the new docs and manifest); test/suites/dsh-plugin-host.ts, a new plugin host test suite covering provider listing, frontmatter parsing, CLI rewriting, precedence rank, the build plan, and host-entry wiring'
  out:
    - 'No terminal PATH shim: the plugin never writes a command into any bin directory, and the bundled CLI is reachable only through served skill bodies inside agent sessions; install.sh, the npm-global strict-spec-cli install, and the skills-CLI registration path stay unchanged and keep working; the viewer surfaces and every dsh-viewer-behavior requirement stay unchanged; the plugin''s client bundle, slot registrations, cordis patch shape, engines.dsh pin, and dsh.client.inject list stay unchanged; the repository skills/ packages stay the single authored source and are not edited; no MCP server registration, no plugin-market publication, and no client-side settings UI for the switch'
unchanged_behavior:
  - 'Every dsh-viewer-behavior main spec requirement keeps holding unchanged: family order, labels, archived groups collapsed and unread, truncation markers, read-only viewing, declared values only, dedicated and generic renderers, parse-error and empty states, live refresh, right-sidebar tab, left page picker and restore, keyboard navigation, expand persistence, pointer activation, re-expansion, tree-follows-open, status conditions, and the host compatibility gate; the viewer client bundle keeps its exact bundle shape and inject list; install.sh and the global install path behave exactly as before; skills under skills/ keep their exact content; with the switch disabled the plugin''s host side applies nothing and behaves exactly as the current viewer-only plugin'

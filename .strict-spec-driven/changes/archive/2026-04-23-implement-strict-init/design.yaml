schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: implement-strict-init
approach:
- Add an `init` command implementation that resolves bundled scaffold template paths and materializes `.strict-spec-driven/` with the required directory structure and files.
- Reuse existing scaffold helper utilities for template discovery/loading so init behavior stays consistent with the shared scaffold asset layer.
- Make writes idempotent by checking for existing targets and skipping overwrite of existing strict workflow artifacts.
- Emit deterministic CLI messaging for created vs skipped files and for `.spec-driven/` coexistence warnings.
decisions:
  keep-init-responsibilities-limited-to-strict-scaffold:
    decision: Keep `init` responsibilities limited to strict scaffold filesystem behavior; do not couple fixture expansion or non-init command behavior into this change.
    rationale: Keep `init` responsibilities limited to strict scaffold filesystem behavior; do not couple fixture expansion or non-init command behavior into this change.
  treat-existing-strict-spec-driven-artifacts-as-user-owned:
    decision: Treat existing `.strict-spec-driven/` artifacts as user-owned state and avoid clobbering them on rerun to preserve manual edits and in-progress work.
    rationale: Treat existing `.strict-spec-driven/` artifacts as user-owned state and avoid clobbering them on rerun to preserve manual edits and in-progress work.
  keep-spec-driven-coexistence-as-warning-only-so-projects-can:
    decision: Keep `.spec-driven/` coexistence as warning-only so projects can bootstrap strict state before migration tooling lands.
    rationale: Keep `.spec-driven/` coexistence as warning-only so projects can bootstrap strict state before migration tooling lands.
  define-observable-command-behavior-in-cli-foundation-delta:
    decision: Define observable command behavior in `cli/foundation` delta spec now so later fixture/test work can validate against explicit requirements.
    rationale: Define observable command behavior in `cli/foundation` delta spec now so later fixture/test work can validate against explicit requirements.
alternatives:
- option: Overwrite existing strict scaffold files on every run
  reason: rejected because it is destructive and breaks idempotent bootstrap semantics.
- option: Fail hard when `.spec-driven/` is present
  reason: rejected because bootstrap/legacy coexistence is an expected intermediate state.
- option: Delay spec updates until fixture tests are added
  reason: rejected because it would decouple implementation from observable behavioral contract and reduce test traceability.

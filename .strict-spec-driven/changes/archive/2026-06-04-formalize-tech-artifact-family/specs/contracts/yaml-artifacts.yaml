schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: contracts-yaml-artifacts
mapping:
  implementation:
    - templates/strict-spec-driven/schemas/main-tech.yaml
    - templates/strict-spec-driven/schemas/delta-tech.yaml
    - templates/strict-spec-driven/schemas/tech-index.yaml
    - src/archive.ts
    - src/verify.ts
    - src/cli/tech-mapping.ts
    - src/propose-generation.ts
  tests:
    - test/suites/change-lifecycle.ts
    - test/suites/foundation-and-fixtures.ts
    - test/suites/operations.ts
operations:
  ADDED:
    yaml-tech-artifact-schema-coverage:
      strength: MUST
      statement: >-
        The system MUST define strict YAML schemas for technical standards (main_tech), delta tech
        standards (delta_tech), and tech standard indexes (tech_index).
      scenarios:
        tech-artifact-families-are-covered:
          - GIVEN: the strict workflow artifact contract is reviewed
          - WHEN: the technical-standard artifact families are checked
          - THEN: >-
              main_tech, delta_tech, and tech_index each have a registered strict YAML schema
              definition and a minimal valid example
    yaml-tech-standard-rule-model:
      strength: MUST
      statement: >-
        The system MUST represent each strict YAML technical standard rule with a stable identifier,
        an RFC 2119 strength enum, an enforceable statement, a rationale, and an enforcement
        contract with a method enum, plus optional examples and exceptions.
      scenarios:
        tech-rule-fields-are-structured:
          - GIVEN: a strict YAML technical standard rule is reviewed
          - WHEN: its rule data is inspected
          - THEN: >-
              the strength, statement, rationale, and enforcement method are available as structured
              fields and examples and exceptions are optional structured fields
    yaml-delta-tech-operation-model:
      strength: MUST
      statement: >-
        The system MUST represent strict YAML delta tech operations as ADDED, MODIFIED, and REMOVED
        maps keyed by rule identifier that target a named standard, where REMOVED entries carry a
        reason.
      scenarios:
        delta-tech-operations-are-structured:
          - GIVEN: a strict YAML delta tech artifact is reviewed
          - WHEN: its operations are inspected
          - THEN: >-
              the target standard, the ADDED, MODIFIED, and REMOVED rule maps, and each REMOVED
              reason are available as structured fields
    yaml-delta-tech-archive-merge:
      strength: MUST
      statement: >-
        The system MUST merge a change's delta tech operations into the targeted standard on archive
        and regenerate the tech index, applying the same active-target exclusivity,
        added-existing-target, modified-missing-target, and removed-missing-target rules used for
        delta specs.
      scenarios:
        delta-tech-merges-on-archive:
          - GIVEN: an active change contains delta tech operations targeting a standard
          - WHEN: the change is archived
          - THEN: >-
              the targeted standard rules reflect the ADDED, MODIFIED, and REMOVED operations and
              the tech index is regenerated from the merged state
    yaml-delta-tech-new-standard-creation:
      strength: MUST
      statement: >-
        The system MUST create a new technical standard on archive when a delta tech artifact
        targets a standard identifier that does not yet exist and supplies a standard block with
        title and category.
      scenarios:
        delta-tech-creates-new-standard:
          - GIVEN: >-
              a delta tech artifact targets a missing standard id and supplies a standard block with
              title and category
          - WHEN: the change is archived
          - THEN: >-
              a new strict YAML technical standard file is created from the standard block, mapping,
              and ADDED rules and is listed in the tech index
    tech-standards-consulted-in-lifecycle:
      strength: SHOULD
      statement: >-
        The change workflow SHOULD consult applicable technical standards during proposal,
        implementation, and review so that standard changes flow through delta tech rather than
        out-of-band edits.
      scenarios:
        lifecycle-consults-tech-standards:
          - GIVEN: a strict change is proposed, implemented, and reviewed
          - WHEN: applicable technical standards exist
          - THEN: >-
              the workflow treats applicable MUST rules as binding and SHOULD rules as defaults and
              carries any standard change as a delta tech artifact
  MODIFIED: {}
  REMOVED: {}

schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: formalize-tech-artifact-family
approach:
  - >-
    Add documentation-only requirements to the contracts-yaml-artifacts main spec via a delta-spec,
    and add a tech rules category to config.yaml. No runtime behavior changes.
decisions:
  use-delta-spec-on-contracts:
    decision: >-
      Record the tech contract as ADDED requirements on the existing contracts-yaml-artifacts spec
      rather than a new spec file.
    rationale: >-
      The tech family is part of the same YAML artifact-schema contract that
      contracts-yaml-artifacts already governs.
  config-tech-rules:
    decision: >-
      Add a tech rules category to config.yaml describing how technical standards are consulted and
      changed.
    rationale: >-
      config.yaml already records spec/change/code/test rules; tech standards deserve the same
      explicit guidance.
  retro-document:
    decision: >-
      Treat this as retro-documentation of already-built behavior; implementation tasks verify the
      contract matches the shipped tech family.
    rationale: >-
      The tech schemas, CLI, and skills already exist and pass tests; the gap was only the recorded
      contract.
alternatives: []
risks: []

schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: define-yaml-spec-and-delta-model
approach:
- Add contract-focused delta requirements under `specs/contracts/` that define the observable YAML shape of main specs and delta specs. The contract will stay at the behavior level. It will define which
  concepts must be represented as structured YAML fields, how stable identifiers are used for matching, which enum values validators must recognize, and which Markdown-era conventions are replaced by structured
  fields. It will not introduce source files, validators, parser code, or migration logic.
decisions:
  treat-requirement-identity-as-a-stable-yaml-field-rather:
    decision: Treat requirement identity as a stable YAML field rather than deriving it from a Markdown heading.
    rationale: Treat requirement identity as a stable YAML field rather than deriving it from a Markdown heading.
  treat-spec-identity-as-a-stable-yaml-field-so-archive-and:
    decision: Treat spec identity as a stable YAML field so archive and validation workflows do not need to infer spec identity from paths alone.
    rationale: Treat spec identity as a stable YAML field so archive and validation workflows do not need to infer spec identity from paths alone.
  treat-rfc-2119-strength-as-a-structured-enum-field-instead:
    decision: Treat RFC 2119 strength as a structured enum field instead of scanning prose for MUST, SHOULD, or MAY.
    rationale: Treat RFC 2119 strength as a structured enum field instead of scanning prose for MUST, SHOULD, or MAY.
  keep-observable-requirement-text-separate-from-identifier:
    decision: Keep observable requirement text separate from identifier and strength fields so validators can check both structure and behavior statements.
    rationale: Keep observable requirement text separate from identifier and strength fields so validators can check both structure and behavior statements.
  represent-scenario-steps-as-ordered-structured-entries-with:
    decision: Represent scenario steps as ordered structured entries with explicit step kinds, preserving GIVEN, WHEN, THEN, and AND semantics without depending on bullet formatting.
    rationale: Represent scenario steps as ordered structured entries with explicit step kinds, preserving GIVEN, WHEN, THEN, and AND semantics without depending on bullet formatting.
  keep-implementation-and-test-mappings-in-structured-file:
    decision: Keep implementation and test mappings in structured file-level fields using normalized repo-relative paths, preserving the reference project's mapping boundary.
    rationale: Keep implementation and test mappings in structured file-level fields using normalized repo-relative paths, preserving the reference project's mapping boundary.
  represent-delta-specs-as-explicit-added-modified-and-removed:
    decision: Represent delta specs as explicit ADDED, MODIFIED, and REMOVED collections so archive and verification commands can operate without Markdown section parsing.
    rationale: Represent delta specs as explicit ADDED, MODIFIED, and REMOVED collections so archive and verification commands can operate without Markdown section parsing.
  require-minimal-valid-examples-for-both-main-specs-and-delta:
    decision: Require minimal valid examples for both main specs and delta specs so later validators and migration tests have concrete target documents without this change selecting a parser or schema library.
    rationale: Require minimal valid examples for both main specs and delta specs so later validators and migration tests have concrete target documents without this change selecting a parser or schema
      library.
alternatives:
- option: Start with the Markdown exception policy
  reason: rejected for now because the spec/delta model is more directly blocking for validation, archive, migration, and CLI foundation work.
- option: Start with the migration compatibility contract
  reason: rejected because migration needs a target YAML spec and delta shape before source-to-target mapping can be defined safely.
- option: Allow requirement bodies to remain Markdown strings inside YAML
  reason: rejected because it would preserve the ambiguity this project is intended to remove.
- option: Use generated numeric identifiers for requirements and scenarios
  reason: rejected for the contract because human-authored stable IDs better preserve reviewability and archive matching across agent edits.

    tasks:
      - id: testing-1
        text: >-
          Run validation command `find . -maxdepth 2 -type f -name 'package.json' -o -name
          'pnpm-lock.yaml' -o -name 'package-lock.json' -o -name 'yarn.lock' -o -name 'deno.json' -o
          -name 'tsconfig.json'` to confirm no lint or validation runner exists for this spec-only
          change

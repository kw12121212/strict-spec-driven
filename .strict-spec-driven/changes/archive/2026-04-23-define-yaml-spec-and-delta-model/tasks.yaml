sections:
  - name: Implementation
    tasks:
      - id: implementation-1
        text: >-
          Add delta spec requirements for structured YAML main spec requirement, scenario, and
          mapping fields
        status: complete
      - id: implementation-2
        text: >-
          Add delta spec requirements for structured YAML delta spec ADDED, MODIFIED, and REMOVED

schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: add-split-roadmap-regression-coverage
approach:
  - >-
    Extend the existing roadmap regression surfaces instead of adding a separate suite. Use the
    copied-project harness where end-to-end behavior matters, and add or refine fixtures that
    exercise the split-file model: milestone metadata stays stable, each planned change can live in
    an independent YAML artifact, sync preserves ordering and metadata, and recommendation/proposal
    handoff selects exactly one eligible roadmap-backed work item. Keep assertions focused on
    observable CLI behavior and artifact output so the tests protect the low-conflict team workflow
    without introducing lock semantics or external tracker coupling.
decisions:
  extend-existing-roadmap-regression-surfaces:
    decision: >-
      Use the existing roadmap and copied-project test harnesses for split-file roadmap regression
      coverage.
    rationale: >-
      The milestone is a coverage milestone, not a new feature milestone. Existing suites already
      own roadmap status, sync, migration, validation, and copied-project scenarios, so extending
      them gives the regression signal without duplicating setup or changing product behavior.
alternatives: []
risks: []

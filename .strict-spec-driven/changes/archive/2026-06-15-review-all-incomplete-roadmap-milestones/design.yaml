schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: review-all-incomplete-roadmap-milestones
approach:
  - Retain the existing roadmap review mechanics but change the prompt contract from a target milestone workflow to a full active-roadmap review. The skill should load roadmap status once, identify every milestone whose declared status is not complete, review each one with its owned planned changes, apply YAML definition fixes across all affected files, and resync once after edits.
decisions:
  review-all-incomplete:
    decision: strict-roadmap-review reviews all incomplete milestones in roadmap order.
    rationale: A whole-roadmap active review matches the user's requested behavior and keeps completed milestones protected as historical record while avoiding repeated single-milestone invocations.
  validate-all-incomplete-guidance:
    decision: Skill validation requires all-incomplete scope wording and rejects stale single-target guidance.
    rationale: The packaging validator is the deterministic guard that prevents the distributed skill from drifting back to one-milestone review instructions.

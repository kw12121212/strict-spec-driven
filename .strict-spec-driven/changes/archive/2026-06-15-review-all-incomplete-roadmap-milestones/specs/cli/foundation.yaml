schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: cli-foundation
mapping:
  implementation:
    - skills/strict-roadmap-review/SKILL.md
    - src/skills/model.ts
  tests:
    - test/suites/entrypoint-and-skills.ts
operations:
  ADDED: {}
  MODIFIED:
    cli-roadmap-review-skill-packaging-validation:
      strength: MUST
      statement: The system MUST validate the strict-roadmap-review skill package through validate-skills, enforcing guidance that reviews every roadmap milestone whose status is not complete, applies direct YAML definition fixes, elaborates planned-change detail, keeps completed milestones out of scope as historical record, and reports deterministic path-specific diagnostics when the all-incomplete scope guidance is missing.
      scenarios:
        validate-skills-requires-all-incomplete-roadmap-review-scope:
          - GIVEN: the strict-roadmap-review package is inspected by validate-skills
          - WHEN: the package contains complete command mappings and direct-fix guidance
          - THEN: validation requires guidance that the skill reviews all milestones whose status is not complete
          - THEN: validation rejects stale guidance that limits review to a single requested milestone
        roadmap-review-skill-documents-all-incomplete-workflow:
          - GIVEN: an operator invokes strict-roadmap-review without naming a target milestone
          - WHEN: the skill prompt is followed
          - THEN: the prompt directs the agent to load roadmap status, identify every incomplete milestone, review owned planned-change files for each one, apply definition fixes directly, and run roadmap-sync after edits
  REMOVED: {}

schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: enforce-code-review-skill
approach:
  - >-
    Treat deterministic validation and code review as separate workflow responsibilities. Remove the
    CLI review command and all generated skill command mappings for it, then make strict-spec-review
    and strict-spec-auto perform evidence-based code review by reading changed implementation and
    test files directly.
decisions:
  remove-cli-review:
    decision: Remove the strict-spec-driven review subcommand instead of renaming or preserving it.
    rationale: >-
      The existing command name suggests completed code review while it only reports deterministic
      artifact hints; keeping it creates repeated AI misuse risk.
  skill-driven-review:
    decision: Move review-stage judgment into strict-spec-review and strict-spec-auto skill guidance.
    rationale: >-
      Code correctness, maintainability, security, performance, and test quality require repository
      evidence review and cannot be safely represented by the current deterministic script.
  no-compatibility-alias:
    decision: Do not keep a review compatibility alias.
    rationale: >-
      The requested change explicitly prioritizes removing the misleading workflow surface over
      backward compatibility.
alternatives: []
risks: []

resolved:
  - id: design-alternatives-generator-gap
    question: The change-design schema marks alternatives as a required field and also defines risks, but strict-spec-cli generate <change> design appeared to expose only --approach, --decision, --decision-text, and --rationale, so both fields seemed writable only as empty arrays. Four rejected alternatives and four risks were settled during this brainstorm and appeared to have nowhere to land. How should this be resolved?
    context: 'Impact as understood when the question was raised: design.yaml recorded decisions with rationale but alternatives: [] and risks: [], so the reasoning for rejecting the four considered approaches appeared lost from the artifact even though it is the exact class of knowledge this change exists to preserve. Options offered were (A) expand scope to add the missing generator flags, (B) fix it in a separate change first, or (C) accept the empty arrays and record the gap. The premise of all three options was wrong, and the correction is recorded in the answer.'
    answer: 'The user approved option A. Implementation then showed the premise was false: the design generator already accepted --alternative, --reason, and --risk, and the original invocation had simply guessed wrong argument names (--alternative-option, --alternative-reason). The unsupported-argument rejection was read as proof of a missing capability without reading the parser. The real defect was that those arguments — and every proposal-artifact argument — were absent from the command-metadata registry and the usage line, a standing violation of the cli-command-metadata rule requiring every accepted flag to be documented. The user was told the scope approval rested on a false premise and chose to retarget the work to the real defect. Delivered instead: the three design arguments and all nine proposal arguments documented with meaning and pairing/repeat semantics, a corrected usage line, a cli-foundation requirement that every accepted generate argument must be documented, and a regression test that fails naming any accepted-but-undocumented argument. That test immediately caught the nine undocumented proposal arguments, which are now fixed. This change''s own four alternatives and four risks were then recorded through the arguments that already existed. The misdiagnosis is recorded as the lessons store''s first entry.'
    status: resolved

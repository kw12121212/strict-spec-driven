schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: add-yaml-fixtures-and-tests
approach:
  - >-
    Use a fixture-first testing approach that keeps validation expectations deterministic and
    reviewable:
  - >-
    add fixtures for valid and invalid artifact shapes under `test/` so each case can be loaded
    without inline ad hoc YAML strings where possible
  - >-
    extend `test/run.ts` to assert both pass/fail outcomes and normalized diagnostic fields
    (`artifactPath`, `fieldPath`, and expected/actual payloads when available)
  - >-
    include explicit requirement traceability labels for M01 contract coverage so gaps are
    discoverable during review
decisions:
  - id: >-
      keep-the-test-harness-in-test-run-ts-and-extend-it-incrementally-instead-of-introducing-a-new-runner-preserving-existing-project-conventions
    decision: >-
      Keep the test harness in `test/run.ts` and extend it incrementally instead of introducing a
      new runner, preserving existing project conventions.
    rationale: >-
      Keep the test harness in `test/run.ts` and extend it incrementally instead of introducing a
      new runner, preserving existing project conventions.
  - id: >-
      prioritize-deterministic-output-assertions-over-snapshot-only-checks-so-diagnostics-stay-stable-across-runs
    decision: >-
      Prioritize deterministic output assertions over snapshot-only checks so diagnostics stay
      stable across runs.
    rationale: >-
      Prioritize deterministic output assertions over snapshot-only checks so diagnostics stay
      stable across runs.
  - id: >-
      focus-scope-on-coverage-expansion-for-existing-requirements-and-avoid-introducing-new-observable-cli-behavior-in-this-change
    decision: >-
      Focus scope on coverage expansion for existing requirements and avoid introducing new
      observable CLI behavior in this change.
    rationale: >-
      Focus scope on coverage expansion for existing requirements and avoid introducing new
      observable CLI behavior in this change.
  - id: >-
      reuse-current-bundled-schema-example-assets-from-templates-strict-spec-driven-to-keep-fixture-data-aligned-with-canonical-contracts
    decision: >-
      Reuse current bundled schema/example assets from `templates/strict-spec-driven/` to keep
      fixture data aligned with canonical contracts.
    rationale: >-
      Reuse current bundled schema/example assets from `templates/strict-spec-driven/` to keep
      fixture data aligned with canonical contracts.
alternatives:
  - option: Adding only inline test payloads without fixture files.
    reason: Rejected because it makes requirement traceability and case reuse harder.
  - option: Deferring M01 traceability until milestone 03.
    reason: Rejected because milestone 02 explicitly calls for this safety net before core command ports.
  - option: Expanding into propose/apply/verify command behavior now.
    reason: >-
      Rejected because this change is intentionally test-focused and should not absorb milestone 03
      scope.

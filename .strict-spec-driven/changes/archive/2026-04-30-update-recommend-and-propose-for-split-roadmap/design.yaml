schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: update-recommend-and-propose-for-split-roadmap
approach:
  - >-
    Update the strict roadmap recommend and propose skill guidance to read roadmap status, milestone
    metadata, and standalone planned-change artifacts as one roadmap source, with standalone
    artifacts treated as the preferred split-file representation. Keep deterministic validation,
    dependency readiness, active-change conflict detection, and scaffold generation delegated to
    existing strict CLI commands.
decisions:
  split-file-first-handoff:
    decision: >-
      Roadmap recommendation and proposal handoff should prefer standalone planned-change artifacts
      while preserving inline milestone compatibility.
    rationale: >-
      The milestone direction is to reduce shared-file churn through one planned-change file per
      work item, but existing projects can still contain inline planned_changes during migration. A
      split-file-first handoff supports the new team workflow without breaking valid roadmap state
      from the compatibility window.
alternatives: []
risks: []

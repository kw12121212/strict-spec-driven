schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: cli-foundation
mapping:
  implementation:
    - skills/strict-roadmap-recommend/SKILL.md
    - skills/strict-roadmap-propose/SKILL.md
    - src/skills/model.ts
  tests:
    - test/suites/roadmap-and-migration.ts
operations:
  ADDED:
    cli-roadmap-handoff-uses-split-planned-change-sources:
      strength: MUST
      statement: >-
        The system MUST make roadmap recommendation and roadmap-to-change proposal handoff treat
        standalone planned-change artifacts as eligible roadmap-backed work sources, using
        dependency readiness and active strict change conflicts when selecting or scaffolding
        exactly one planned change.
      scenarios:
        split-planned-change-is-selected-for-handoff:
          - GIVEN: >-
              a strict roadmap contains milestone metadata and standalone planned-change artifacts
              with complete dependencies
          - WHEN: strict roadmap recommendation or proposal handoff evaluates roadmap-backed work
          - THEN: >-
              one eligible standalone planned change can be selected and scaffolded as a normal
              strict change with its planned-change identity and owning milestone reference
  MODIFIED: {}
  REMOVED: {}

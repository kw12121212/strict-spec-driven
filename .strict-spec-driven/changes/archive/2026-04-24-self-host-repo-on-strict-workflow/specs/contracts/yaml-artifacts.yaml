schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: contracts-yaml-artifacts
mapping:
  implementation:
    - README.md
    - RTK.md
  tests:
    - test/run.ts
operations:
  ADDED:
    - requirement:
        id: self-hosted-repository-guidance-prefers-strict-surfaces
        strength: MUST
        statement: >-
          The system MUST require a self-hosted repository's guidance to describe
          `.strict-spec-driven/`, `strict-spec-*`, and `strict-roadmap-*` as the default workflow
          surfaces while limiting `.spec-driven/` and legacy names to bootstrap or migration
          context.
        scenarios:
          - id: repository-guidance-prefers-strict-workflow-state-after-self-hosting
            steps:
              - kind: GIVEN
                text: a repository has adopted `.strict-spec-driven/` workflow state
              - kind: WHEN
                text: its workflow guidance is reviewed
              - kind: THEN
                text: '`.strict-spec-driven/` is identified as the preferred active workflow directory'
              - kind: AND
                text: '`.spec-driven/` is identified only as preserved bootstrap or migration input'
              - kind: AND
                text: the two directories are not presented as equivalent active targets
          - id: repository-guidance-prefers-strict-command-families-after-self-hosting
            steps:
              - kind: GIVEN
                text: a repository has adopted self-hosted strict workflow state
              - kind: WHEN
                text: its workflow names are reviewed
              - kind: THEN
                text: >-
                  `strict-spec-*` and `strict-roadmap-*` are presented as the default skill and
                  slash-command families
              - kind: AND
                text: legacy names appear only in bootstrap, migration, or historical context
  MODIFIED: []
  REMOVED: []

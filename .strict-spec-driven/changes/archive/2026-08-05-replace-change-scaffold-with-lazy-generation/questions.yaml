schema_version: 1
artifact_type: question_list
schema_file: templates/strict-spec-driven/schemas/question-list.yaml
change: replace-change-scaffold-with-lazy-generation
open: []
resolved:
  - id: requirement-problem
    question: What is concretely going wrong today, and for whom?
    context: 'Why this is asked: the change is planned against a need, and the need lives only with the requester. A "problem" here means what someone does or suffers today — not a feature that is missing. If the answer names a button, a field, a page, or an endpoint, it is a solution, and the underlying problem is still unstated. What a sufficient answer contains: who is affected, what they do today instead, and how often. Worked example: "every Monday one person spends forty minutes copying order rows into a spreadsheet to send the weekly report". What it changes: this becomes the proposal''s why, and it decides whether the change is worth making.'
    answer: 'Anyone starting a strict change today gets four fabricated YAML documents before a single fact about the change is known. propose copies proposal.yaml, design.yaml, tasks.yaml, and questions.yaml from bundled templates (src/scaffold.ts:268), so the change begins in a state that is syntactically valid and semantically false. The people affected are the agents and humans authoring changes in this repository and in any project using the workflow: they must overwrite fake content rather than add real content, and reviewers cannot tell an unauthored artifact from an authored one without string-matching template literals. The cost is already visible in the codebase — verify carries three separate placeholder detectors added one at a time, each after placeholder content survived into a change, and summary.what and summary.why have no removal flag at all, so placeholder entries written there cannot be deleted through any supported command.'
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: requirement-outcome
    question: What observable difference proves the problem is solved?
    context: 'Why this is asked: without a success condition, nobody can tell afterwards whether the change worked. "Observable" means someone outside the system can check it without reading the code. What a sufficient answer contains: what a person will see, or no longer have to do, once this is done. Worked example: "the report is in the manager''s inbox on Monday morning without anyone assembling it". What it changes: this becomes the delta spec''s scenarios and the acceptance evidence at review time.'
    answer: Running propose creates the change directory and nothing else; proposal.yaml, design.yaml, tasks.yaml, and questions.yaml are absent until something authors them. A generate call for a change that does not exist yet creates the container and that one real artifact together, and when that call is rejected there is no change directory left behind at all. Running ready or verify on a change with artifacts missing prints a diagnostic naming each absent artifact and the generate command that would author it, instead of passing on placeholder text or failing on a matched template literal. No file under templates/strict-spec-driven/scaffold/changes/ remains in the repository.
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: requirement-trigger
    question: Why now — what forced this?
    context: 'Why this is asked: work that nothing forced is the work most often thrown away later. This question catches a request that sounds reasonable but has no real driver behind it. What a sufficient answer contains: the concrete event, deadline, incident, or cost that made this surface now, or an honest statement that nothing did. Worked example: "the report was missed last month and it was raised with the team". What it changes: a change with no trigger is a candidate for deferral, and the answer is weighed at review before archive.'
    answer: 'Two things forced it now. The change''s only dependency, expose-cli-yaml-mutation-surface, completed in commit 4d73816, so the shared validation and atomic-write boundary this work builds on now exists. And the repository is currently violating its own binding rule: yaml-first-artifacts states that a YAML creation operation MUST persist only real caller-supplied or workflow-required state and that blank documents and placeholder values MUST NOT be written, while src/scaffold.ts writes four placeholder documents on every propose. The milestone cannot report its done criteria met while that holds, and every remaining planned change in the milestone is blocked behind this one.'
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: requirement-non-goals
    question: What must explicitly not change?
    context: 'Why this is asked: the requester knows which nearby behavior other people depend on, and the agent does not. A "non-goal" is something the change must leave alone even though it sits close to the work. What a sufficient answer contains: the behavior, setting, or output that must survive untouched, and who relies on it. Worked example: "do not change the saved filters — several people rely on their own". What it changes: these become the proposal''s unchanged_behavior items, which review checks the finished result against.'
    answer: 'The planned change names these explicitly: roadmap links between a change and its milestone and planned change, archive behavior including delta merge and index reconciliation, the two-active-change limit, dist-only operation without the source tree, deterministic output, and existing change identity semantics all stay as they are. Beyond those, init keeps scaffolding .strict-spec-driven/ project state from bundled templates — that is workflow-required state, not change planning content, and is untouched. The canonical requirement questions stay enforceable workflow state and must not be dropped as part of removing placeholders; the milestone risk section calls this out directly.'
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: requirement-interpretation
    question: Which reading of the request is intended, where more than one is possible?
    context: 'Why this is asked: a short request usually admits several readings, and building the wrong one is indistinguishable from building nothing. What a sufficient answer contains: the reading that is meant, stated plainly enough to rule the others out — or a statement that only one reading exists and what it is. Worked example: "export means the version sent to the manager, not the one I read myself". What it changes: this fixes the scope boundary before any code is written, and settles disputes about what was asked for.'
    answer: 'Lazy generation means the artifact is created by the invocation that first has real content for it, not that propose defers writing until some later automatic moment. The reading that is meant: propose and generate are both authoring entry points, whichever runs first performs the atomic container creation, and every artifact after that is created on demand by the generate call that supplies its content. It does not mean removing propose, and it does not mean generate synthesizes content it was not given — a created artifact holds the typed defaults plus exactly the named arguments passed. Removing placeholders also does not mean removing the requirement-questions gate: those five entries are workflow-required state, which the rule permits, not placeholder values, which it forbids.'
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: empty-change-container-counts-toward-active-limit
    question: Does a change directory that exists but holds no planning artifacts count as an active change against the two-active-change limit, and may propose still succeed against one?
    context: 'Why this is asked: a container with no artifacts becomes a normal intermediate state for the first time under this change, and listActiveChangeNames in src/scaffold.ts counts any directory under .strict-spec-driven/changes/ regardless of contents. Today the spec requirement cli-propose-generation-preserves-scaffold-behavior explicitly allows propose to reuse an existing change directory whose tree contains no files, which was written when an empty tree could only be a leftover. What a sufficient answer contains: whether an artifact-free container is active state that blocks a third change, and whether re-running propose against one succeeds, is rejected as a collision, or is a no-op. Impact: this affects implementation and tests directly — it decides the shared first-authoring boundary''s collision and limit logic in src/scaffold.ts, whether the existing empty-change-directory-can-be-scaffolded scenario is kept, modified, or retired in the delta spec, and the regression case asserting the limit when generate rather than propose creates the third change. It does not affect proposal scope or technical standards. Recommendation: count an artifact-free container as active, since the two-active-change limit exists to bound concurrent work rather than concurrent files, and keep propose idempotent against one so an interrupted first authoring call can be retried. Option B is to treat an artifact-free container as abandoned state that neither counts nor collides, which is simpler but lets an unbounded number of half-started changes accumulate.'
    answer: A change directory that exists but holds no planning artifacts counts as an active change against the two-active-change limit, and propose is idempotent against one. The limit bounds concurrent work rather than concurrent files, so an artifact-free container blocks a third change; re-running propose against it succeeds as a no-op so an interrupted first authoring call can be retried. listActiveChangeNames therefore keeps counting every directory under .strict-spec-driven/changes/ regardless of contents, and the empty-change-directory-can-be-scaffolded scenario is retained in spirit through the propose idempotence rule rather than retired.
    status: resolved
    kind: technical
    answered_by: human
  - id: ready-blocks-on-absent-questions-artifact
    question: Must ready and verify block when questions.yaml is absent, so the requirement-interrogation gate cannot be skipped by never authoring the questions artifact?
    context: 'Why this is asked: today the five canonical requirement questions arrive with the scaffold, so every change carries the gate whether or not anyone touches questions.yaml. Under lazy creation they are written on first questions authoring, which means a change that never runs generate questions has no open requirement questions and nothing to block on. The milestone risk section warns that removing scaffolded questions must preserve the interrogation gate as real CLI-authored workflow state rather than silently dropping requirement evidence. What a sufficient answer contains: whether an absent questions.yaml is a blocking ready and verify diagnostic like any other missing required artifact, or whether the five entries are instead written by the first authoring invocation of any artifact so the gate exists from the start. Impact: this affects implementation, tests, and the delta spec — it decides whether seed-requirement-questions-from-typed-state hangs off the questions creation path or off the shared first-write boundary, and it decides the requirement statement covering missing-artifact diagnostics. Recommendation: make an absent questions.yaml a blocking ready and verify diagnostic and keep seeding on first questions authoring, because writing the gate from an unrelated artifact''s creation call reintroduces content written by an invocation that was not asked to write it. Option B is to seed the questions artifact from the shared boundary on whichever authoring call comes first, which guarantees the gate but writes an artifact the caller did not request.'
    answer: 'Yes. An absent questions.yaml is a blocking ready and verify diagnostic like any other missing required artifact, and the five canonical requirement questions are seeded on first questions authoring rather than from an unrelated artifact''s creation call. Writing the gate as a side effect of authoring a different artifact would reintroduce exactly the pattern this change removes: content written by an invocation that was not asked to write it. The gate is preserved because the change cannot reach ready without the questions artifact existing and its requirement questions answered.'
    status: resolved
    kind: technical
    answered_by: human

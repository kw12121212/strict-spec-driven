schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: replace-change-scaffold-with-lazy-generation
approach:
  - Introduce a single first-authoring boundary in src/scaffold.ts that both propose and generate call before any write. It resolves the change directory path, validates the kebab-case name, rejects a collision with a populated change directory, and enforces MAX_ACTIVE_CHANGE_COUNT. It returns a handle describing whether the change container already exists, so a caller can distinguish creation from an incremental edit without a second filesystem probe.
  - Route the container creation through the same staged commit path the artifact write already uses. The boundary records every directory it creates for a first write; when validation, schema checking, or the write itself fails, it unwinds exactly those recorded paths in reverse creation order, so a rejected first authoring call leaves no change directory, no specs/ directory, and no partial artifact. A write into a change container that already existed unwinds nothing, because the container was not this call's to create.
  - 'Give generate a typed default for each planning artifact — the minimal schema-valid document carrying only schema headers and the change id — and have it materialize that default when the target file is absent before merging the named arguments in. This makes creation and edit the same code path: the merge input is either the parsed existing artifact or the typed default, and the existing per-field merge, upsert, and removal semantics are unchanged.'
  - Replace verify's three placeholder-literal detectors with a required-artifact presence check. checkTaskCompleteness, checkDesignCompleteness, and checkProposalCompleteness in src/verify.ts exist only to notice placeholder content; once no command writes placeholders, missing content is literal absence. The replacement reports one diagnostic per absent required artifact naming the artifact and the generate invocation that authors it, and the same check backs ready.
  - Seed the five canonical requirement questions from typed workflow-required defaults inside the questions artifact's creation path rather than from a bundled template file. They are workflow-required state under the yaml-first-artifacts rule, not placeholder content, so they are written on first questions authoring and remain unremovable through --remove-question and --delete exactly as today.
  - 'Retire the change-template assets last, after nothing reads them: delete the four files under templates/strict-spec-driven/scaffold/changes/, drop REQUIRED_CHANGE_TEMPLATE_ASSETS and the three getScaffold*Placeholders helpers, remove the four paths from the cli-foundation mapping through delta-spec --remove-implementation, and update the command metadata registry and the bundled skill prompts that describe scaffold-then-populate ordering.'
  - 'An artifact-free change container counts as active state: listActiveChangeNames keeps counting every directory under .strict-spec-driven/changes/ regardless of contents, so the two-active-change limit bounds concurrent work rather than concurrent files. propose is idempotent against such a container, succeeding as a no-op, so an interrupted first authoring call can be retried rather than leaving a change that propose can no longer touch. The questions artifact is seeded on first questions authoring only, and its absence is a blocking ready and verify diagnostic, which is what preserves the requirement-interrogation gate without any artifact writing content its caller did not request.'
decisions:
  first-write-boundary-shared-by-propose-and-generate:
    decision: Put change-name validation, collision detection, and the two-active-change limit in one boundary that propose and generate both call, instead of leaving them in propose and adding a parallel copy to generate.
    rationale: Once generate can create a change, both commands become entry points to the same lifecycle transition, and two copies of the limit check would drift into two different answers to the question of whether a third active change may exist. A single boundary also makes the unwind list a property of the transition rather than of whichever command happened to start it.
  typed-defaults-instead-of-template-files:
    decision: Materialize a missing artifact from a typed in-code default rather than from a bundled minimal template file.
    rationale: 'A template file would reintroduce the exact failure this change removes: content that is written before it is known to be true, and that must be pattern-matched later to tell authored from unauthored. A typed default is constrained by the same schema types the merge already uses, so it cannot drift out of sync with the schema the way a checked-in YAML file did.'
  requirement-questions-are-workflow-required-not-placeholder:
    decision: Classify the five canonical requirement questions as workflow-required state written on first questions authoring, not as placeholder content to be removed with the rest of the scaffold.
    rationale: The yaml-first-artifacts rule bars blank documents and placeholder values but explicitly permits workflow-required state, and these five entries carry real content that a human must answer — they are the interrogation gate itself, which the milestone risks section calls out as something that must not be silently dropped. Deleting them would remove requirement evidence rather than remove a placeholder.
  absence-replaces-placeholder-detection:
    decision: Delete verify's three placeholder-literal detectors and report missing required artifacts as absence diagnostics instead.
    rationale: The detectors only work by exact-matching bundled template strings, which is why they were added one at a time as each artifact stopped being rebuilt on write. With nothing writing those strings the detectors can only produce false negatives on a hand-copied placeholder, while absence is decidable without any string matching.
  empty-container-is-active-and-propose-is-idempotent:
    decision: Count an artifact-free change container toward the two-active-change limit, and make propose succeed as a no-op when run against one.
    rationale: 'The limit exists to bound how much work is in flight, and a container created by an interrupted first authoring call represents in-flight work just as much as a populated one; excluding it would let unbounded half-started changes accumulate. Idempotent propose is the counterpart: if the container counts, rejecting it as a collision would strand a retryable interruption behind a command that can no longer be run.'
  absent-questions-artifact-blocks-readiness:
    decision: Seed the canonical requirement questions on first questions authoring only, and make an absent questions.yaml a blocking ready and verify diagnostic rather than seeding it from the shared first-write boundary.
    rationale: Seeding questions.yaml from an unrelated artifact's creation call would write content the invocation was not asked to write, which is the exact pattern this change removes; making absence blocking achieves the same gate through the missing-required-artifact diagnostic that every other planning artifact already needs, so the gate costs no additional mechanism.
alternatives:
  - option: Keep propose writing the full artifact set but populate it from the roadmap planned change instead of from templates.
    reason: It still writes proposal, design, and tasks content before the authoring agent has decided any of it, so a change created outside a roadmap context — bugfix, brainstorm, maintenance — gets fabricated content, and the milestone criterion that no supported command creates placeholder planning YAML remains unmet.
  - option: Leave propose as a pure directory creator and require generate for every artifact, without giving generate the ability to create the container.
    reason: 'It leaves an empty change directory behind whenever the first generate call is rejected, which is the failure mode the planned change and the yaml-first-artifacts rule both name explicitly: a failed first write must leave the target absent.'
  - option: Keep the placeholder templates but teach every generate path to recognize and strip placeholder values on first merge.
    reason: It makes correctness depend on every artifact's merge path knowing every placeholder literal, which is the maintenance burden verify already demonstrates — three detectors added in sequence, each after a placeholder survived into a change.
risks:
  - Removing the two-active-change check from propose's own body and relying on the shared boundary could weaken the limit if a generate path is added later that bypasses the boundary; the boundary is therefore the only exported creation entry point and the limit is asserted from a test that drives generate directly, not only propose.
  - Unwinding a failed first write must not delete a pre-existing change directory. The unwind list records only paths this invocation created, and a regression test authors into an existing change with deliberately invalid arguments to confirm the container and its other artifacts survive.
  - Deleting the change template assets while the cli-foundation mapping still lists them would fail mapping validation; the mapping entries are removed in the same change through delta-spec --remove-implementation rather than by editing the live spec.
  - Bundled skill prompts across the repository instruct agents to run propose and then populate the scaffold; missing one leaves guidance that assumes files exist that no longer do, so the skill-content checks in the entrypoint-and-skills suite must be extended rather than only updated.

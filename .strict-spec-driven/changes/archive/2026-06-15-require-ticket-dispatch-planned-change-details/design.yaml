schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: require-ticket-dispatch-planned-change-details
approach:
  - 'Make the prompt contract explicit rather than changing CLI mechanics: require the skill to write milestone details and standalone planned-change YAML with actionable details whenever a not_implemented ticket is promoted and sufficient evidence exists, and keep the existing user-deferral behavior for insufficient evidence.'
decisions:
  prompt-owned-handoff:
    decision: Keep promoted ticket handoff completeness in strict-ticket-dispatch prompt guidance.
    rationale: The CLI intentionally performs deterministic state transition only; the scope decomposition into details and planned changes is AI judgment grounded in ticket and repository evidence.
alternatives: []
risks: []

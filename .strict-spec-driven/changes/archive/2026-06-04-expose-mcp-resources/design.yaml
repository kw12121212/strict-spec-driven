schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: expose-mcp-resources
approach:
  - >-
    Represent MCP resources as explicit inventory entries with strict:// URI templates mapped to
    bounded strict workflow artifact paths or generated summaries.
  - >-
    Use safe identifier resolution that rejects parent-directory traversal and unknown ids before
    reading project files.
  - Register resources through the MCP SDK from the same inventory that tests inspect.
decisions:
  bounded-resource-surface:
    decision: >-
      MCP resources expose only known strict workflow artifacts and generated summaries, not
      arbitrary repository files.
    rationale: >-
      The milestone risk calls out overbroad context exposure, so resource URI templates must stay
      explicit and bounded.
  deterministic-text-content:
    decision: Resource reads return deterministic text content with stable URI ordering.
    rationale: >-
      MCP clients can display YAML artifacts and summaries without needing a new binary or streaming
      representation.
alternatives: []
risks: []

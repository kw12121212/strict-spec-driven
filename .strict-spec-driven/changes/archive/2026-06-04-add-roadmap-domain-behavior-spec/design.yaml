schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: add-roadmap-domain-behavior-spec
approach:
  - >-
    Add one observable-behavior main spec under .strict-spec-driven/specs/roadmap/ for
    roadmap-status, roadmap-overview, roadmap-sync, and roadmap-recommend.
  - Use current roadmap tests and command outputs as evidence for requirements and scenarios.
  - >-
    Re-point roadmap-specific mappings from cli-foundation to the new spec, then run
    verify-spec-mappings and the project regression suite.
decisions:
  domain-behavior-spec:
    decision: Represent roadmap coverage as one command-domain main spec.
    rationale: >-
      The roadmap commands share one artifact model and status derivation contract, so one behavior
      spec captures user-visible outcomes without mirroring loader modules.
alternatives: []
risks: []

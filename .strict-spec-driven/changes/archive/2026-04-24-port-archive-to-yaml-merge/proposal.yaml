schema: strict-spec-driven/change-proposal/v1
schema_version: 1
artifact_type: change_proposal
schema_file: templates/strict-spec-driven/schemas/change-proposal.yaml
change:
  id: port-archive-to-yaml-merge
  status: complete
summary:
  what:
    - >-
      Implement the strict `archive` lifecycle command so a verified active change can be merged
      into main strict YAML specs, moved into a date-prefixed archive directory, and reported
      deterministically.
  why:
    - >-
      Milestone 03 is currently blocked on archive behavior. `propose`, `apply`, and `verify` are
      already delivered, but the lifecycle cannot complete without deterministic merge and archive
      mechanics. Downstream roadmap, migration, and self-hosting changes depend on this command
      being stable.
scope:
  in: []
  out: []
unchanged_behavior:
  - Existing `init`, `propose`, `apply`, and `verify` command behavior remains unchanged
  - Strict artifact schema contracts remain unchanged; this change consumes them
  - Build and unit-test command surface remains `bun run build` and `bun test/run.ts`

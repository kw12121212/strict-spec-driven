schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: architecture-domain-behavior
mapping:
  implementation:
    - src/architecture-author.ts
    - src/architecture.ts
    - src/cli/cmd-architecture.ts
    - src/cli/command-metadata-entries.ts
    - src/cli/registry.ts
    - src/strict-spec-cli.ts
    - inventory/yaml-mutation-surfaces.yaml
    - skills/strict-spec-architecture/SKILL.md
    - src/mcp/inventory.ts
    - src/mcp/tools.ts
  tests:
    - test/suites/architecture-authoring.ts
    - test/suites/architecture-document.ts
    - test/run.ts
operations:
  ADDED:
    architecture-cli-authoring-contract:
      strength: MUST
      statement: The workflow MUST provide architecture-edit as an artifact-aware named-argument command for meaningful architecture creation, non-destructive overview, component, implementation mapping, data-flow, decision, and alternative updates, exact named removals, and explicit guarded deletion through the shared atomic mutation boundary, while keeping ARCHITECTURE.md generator-owned.
      scenarios:
        architecture-upsert-and-removal-preserve-siblings:
          - GIVEN: A valid architecture artifact declares multiple components, mappings, data flows, decisions, and alternatives
          - WHEN: The operator upserts one named entry or removes one exact named entry through architecture-edit
          - THEN: Only the named target changes, duplicate additions are idempotent, every sibling remains unchanged, and the result reports that architecture-generate must reconcile ARCHITECTURE.md
        architecture-create-requires-meaningful-state:
          - GIVEN: No architecture artifact exists
          - WHEN: The operator supplies insufficient, placeholder-only, or invalid architecture authoring arguments
          - THEN: The command rejects the request and leaves architecture.yaml absent; sufficient schema-valid semantic input creates it atomically
        architecture-delete-is-explicit-and-safe:
          - GIVEN: An architecture artifact and possibly a rendered ARCHITECTURE.md exist
          - WHEN: The operator requests whole-artifact deletion
          - THEN: The command accepts only isolated delete intent under the declared lifecycle constraints, never deletes the generated document implicitly, and leaves all files unchanged on rejection
  MODIFIED: {}
  REMOVED: {}

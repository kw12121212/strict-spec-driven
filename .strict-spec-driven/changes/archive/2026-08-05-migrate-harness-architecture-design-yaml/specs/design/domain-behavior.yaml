schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: design-domain-behavior
mapping:
  implementation:
    - src/design-system-author.ts
    - src/design-system.ts
    - src/cli/cmd-design.ts
    - src/cli/command-metadata-entries.ts
    - src/cli/registry.ts
    - src/strict-spec-cli.ts
    - inventory/yaml-mutation-surfaces.yaml
    - skills/strict-spec-design/SKILL.md
    - skills/strict-spec-design-sync/SKILL.md
    - src/mcp/inventory.ts
    - src/mcp/tools.ts
  tests:
    - test/suites/design-system-authoring.ts
    - test/suites/design-system-document.ts
    - test/run.ts
operations:
  ADDED:
    design-system-cli-authoring-contract:
      strength: MUST
      statement: The workflow MUST provide design-edit as an artifact-aware named-argument command for meaningful design-system creation, non-destructive identity, token, component mapping, visual snapshot, and guidance updates, exact named removals, and explicit guarded deletion through the shared atomic mutation boundary; design-init and design synchronization MUST use the same writer while DESIGN.md remains generator-owned.
      scenarios:
        design-upsert-and-removal-preserve-siblings:
          - GIVEN: A valid design-system artifact declares multiple token groups, tokens, components, mappings, snapshots, and guidance entries
          - WHEN: The operator upserts one named value or removes one exact named entry through design-edit
          - THEN: Only the named target changes, additive values remain duplicate-free, siblings remain unchanged, and the result reports that design-generate must reconcile DESIGN.md
        design-init-uses-shared-boundary:
          - GIVEN: Strict workflow state exists without a design-system artifact
          - WHEN: The operator runs design-init
          - THEN: The command creates the schema-valid bundled initial state through the shared mutation boundary, reports an existing artifact as unchanged, and leaves no file behind after validation or commit failure
        design-delete-is-explicit-and-safe:
          - GIVEN: A design-system artifact and possibly a rendered DESIGN.md exist
          - WHEN: The operator requests whole-artifact deletion
          - THEN: The command accepts only isolated delete intent under the declared lifecycle constraints, never deletes the generated document implicitly, and preserves all files on rejection
  MODIFIED: {}
  REMOVED: {}

schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: replace-inlined-protocol-with-cli-pointer
approach:
  - Rewrite each of the 34 protocol sections into a fixed short block under the unchanged heading. The block names the artifact kinds the skill writes, directs the agent to run strict-spec-cli yaml-authoring-protocol <artifact-kind> for the ordered steps and the bound owning, schema, example, and validation commands, names the skill's own artifact validation command, and restates the no-fallback boundary verbatim. The seven numbered step titles, the per-artifact schema-show and sample-show enumerations, and the four-item stop report are removed because the command renders all of them bound to the kind.
  - Relocate enforcement in the same change that removes the text it guards. In test/suites/entrypoint-and-skills.ts the loop over expectedProtocolSkills stops asserting every protocol step title and the stop-report items, and instead asserts the pointer command, a named artifact kind that yaml-surface-list registers, the skill's validation command, and the verbatim boundary. In src/skills/model.ts the per-skill required snippets gain the pointer form so validate-skills fails a skill that drops it, rather than losing a check when the copied prose disappears.
  - Carry the third enforcement surface the roadmap did not enumerate. The cli-command-metadata rule skill-packages-are-static-protocol-surfaces requires the step-title restatement and names a pointer-without-boundary skill as its bad example, so the rewrite would put the repository in violation of its own standard. A delta tech modifies that rule to require the pointer form plus the retained boundary, and records why the static restatement of the steps is no longer the enforceable unit.
  - Pin the classification equivalence with a test rather than an argument. The rewrite keeps the section heading, so bodyWithoutProtocolSection strips the same region and every owning command the classifier reads still comes from the untouched This Skill's Commands block. A test captures the mutation-capable set and asserts it against the expected 34 plus the strict-spec-migrate exception, so a future rewrite that accidentally reclassifies a skill fails instead of passing vacuously.
decisions:
  keep-the-boundary-statement-static:
    decision: The pointer block retains the verbatim no-fallback boundary statement and the four-item stop report is dropped, rather than deferring the boundary to the command as well.
    rationale: A skill is loaded as static text before any command runs, so an agent that never runs the pointer command would otherwise reach its first mutation with no prohibition in view. The boundary is the only part of the protocol that must be known before the agent decides whether to run anything, while the steps only matter once mutation has begun, which is exactly when the command is available. The existing standard already names a pointer-without-boundary skill as its bad example, so keeping the sentence preserves that judgment while removing the bulk it was bundled with.
  keep-the-existing-section-heading:
    decision: The rewritten block stays under the unchanged heading '## CLI-Only YAML Authoring Protocol' rather than being renamed to reflect its pointer form.
    rationale: bodyWithoutProtocolSection in src/cli-only-yaml-policy.ts and its copy in the test suite locate the region by that exact heading string before classifying a skill. Keeping the heading makes the classification equivalence hold by construction instead of depending on a matching edit in three places, and a rename would be a second behavioral change riding on a text reduction.
  assert-the-pointer-rather-than-drop-the-check:
    decision: Every assertion that covered removed protocol text is replaced by an assertion on the pointer form, and no assertion is deleted without a replacement.
    rationale: 'The milestone records that the per-skill assertions live in a large suite of literal expectations, where the cheapest way to make a mechanical edit pass is to weaken the assertion. Requiring a replacement for each removed assertion converts that risk into a reviewable one-to-one mapping, and it is the only reason the removal is safe at all: absent guidance fails nothing on its own.'
  amend-the-standard-in-this-change:
    decision: The cli-command-metadata rule is modified by a delta tech in this change rather than left for a later cleanup.
    rationale: The rule as written requires the exact text this change removes, so shipping the rewrite without it leaves the repository violating a MUST rule it enforces by review. Deferring the amendment would also mean the next change inherits a standard that contradicts the code it governs, which is the drift mode this milestone exists to remove.
alternatives:
  - option: Delete the protocol section entirely and rely on the yaml-authoring-protocol command being discoverable from RTK.md.
    reason: Rejected because a skill is static text an agent reads before running anything, so a skill with no protocol trace gives the agent nothing to point it at the command and gives validate-skills nothing to assert; the milestone records this as the silent-degradation risk of the whole approach.
  - option: Keep the step titles and remove only the per-artifact schema-show and sample-show enumerations.
    reason: Rejected because the enumerations are the smaller half of the section and the step titles are the part that duplicates the typed module verbatim, so it would leave most of the 1088 lines in place while still requiring the same three enforcement surfaces to be touched.
  - option: Generate the pointer block mechanically from the inventory at build time and commit the output.
    reason: Rejected because it adds a generation step and a generated-asset check to a change whose entire purpose is removing text, and the block is a fixed few lines per skill whose only varying part is the artifact kind the skill already declares.
risks:
  - Moving guidance from always-present text to a command the agent must choose to run means an agent that skips the pointer proceeds with no protocol in view. The retained boundary limits the blast radius to procedure rather than permission, but the exposure is real and is the milestone's recorded primary risk.
  - The per-skill assertions live in a large suite of literal expectations, so a mechanical edit across 34 skills can be made to pass by weakening an assertion rather than relocating it. The one-to-one replacement rule is the mitigation, and it is enforced by review rather than by a check.
  - Removing 1088 lines of skill text removes no src/** lines, but relocating expectation data in src/skills/model.ts changes the measured coverage denominator. If the coverage gate at threshold 78 moves, the milestone requires recording the measurement rather than tuning the threshold.

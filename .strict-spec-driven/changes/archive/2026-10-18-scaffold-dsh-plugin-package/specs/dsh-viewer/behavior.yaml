schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: dsh-viewer-behavior
operations:
  ADDED:
    placeholder-load-indicator:
      strength: MUST
      statement: When the plugin package is installed in a dsh release within its declared compatibility range, the plugin client registers a placeholder left-sidebar icon so the loaded plugin is observable, and the placeholder registers no document tree or document view.
      scenarios:
        web-client-placeholder:
          - GIVEN: The built plugin package is installed into a dsh release within its declared compatibility range
          - WHEN: the web client loads
          - THEN: the placeholder left-sidebar icon is registered and visible, and no document tree or document view is registered
        desktop-profile-placeholder:
          - GIVEN: The built plugin package is installed into a dsh release within its declared compatibility range
          - WHEN: the desktop profile loads
          - THEN: the placeholder left-sidebar icon is registered and visible, and no document tree or document view is registered
  MODIFIED: {}
  REMOVED: {}

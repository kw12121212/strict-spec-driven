schema: strict-spec-driven/change-proposal/v1
schema_version: 1
artifact_type: change_proposal
schema_file: templates/strict-spec-driven/schemas/change-proposal.yaml
change:
  id: build-document-discovery-model
  status: proposed
summary:
  what:
    - 'Implement the read-only discovery model for the dsh strict document viewer as pure React-free TypeScript modules inside plugins/dsh-strict-spec/: a traversal over remote.workspaceFiles list that recurses loaded directories by direct children, defers archive directories until requested, and records the truncated flag of any listing as a visible truncation node rather than retrying or paging.'
    - A classifier that maps each document's workspace path and declared artifact_type onto the viewer contract's fixed family taxonomy with an unknown-artifact fallback, and a label deriver that labels non-archived documents from milestone titles, change names, spec titles, scene names, and lesson titles with a filename fallback, while archived entries are labeled from their directory or file names without being read.
    - A document loader that reads a complete file through remote.workspaceFiles readBytes with no range decoded as UTF-8, falls back to read line pages until eof, parses the text with the plugin's bundled YAML parser, and returns either parsed data or a parse error located by line and column.
    - A refresh coordinator that opens one remote.workspaceFiles changes watch per loaded directory and one for the open document, closes a watch when its node collapses or the document closes, and invalidates only the affected node, because changes watches direct entries and is not recursive.
    - Expose the model through client stores built on the shared dsh-client-store module so later components receive data only through props and stores, register a model suite in test/run.ts covering fixture trees and a snapshot of this repository's real .strict-spec-driven/ directory — archive size, truncated listing, malformed file, missing workflow directory, removed open file, and unknown artifact_type — and add the bundled YAML parser as a plugin devDependency.
  why:
    - 'The milestone is ordered so the discovery model lands before the tree consumes it: the viewer contract and the loadable plugin scaffold are archived, and build-collapsible-document-tree, register-left-panel-page, and register-right-sidebar-tab all stay dependency-incomplete until this model exists, so building it now keeps every later change reviewable as pure UI work.'
    - The model encodes the viewer's observable guarantees — fixed family order, absent-family omission, unread collapsed archives, truncation markers, located parse errors, and live refresh — as deterministic, dsh-free testable logic before any component renders them, which is the only layer where those guarantees can fail cheaply.
scope:
  in:
    - The five React-free model modules under plugins/dsh-strict-spec/ — traversal, classifier, label deriver, document loader, and refresh coordinator — each bound to the sessionId-taking workspace-files port.
    - The narrow WorkspaceFilesPort interface (list, read, readBytes, changes, each taking the sessionId first) typed against the pinned dsh release so model code never imports dsh client modules directly and tests script the port.
    - The client-store exposure of the model through the shared dsh-client-store module, registering no UI.
    - The bundled YAML parser devDependency in the plugin package and its inlining into the built client bundle.
    - The model suite registered in test/run.ts with fixture trees and a snapshot test against this repository's real .strict-spec-driven/ directory.
  out:
    - Any document tree component, structured renderer, right-sidebar tab, or real left-sidebar panel page — owned by the build-collapsible-document-tree, register-right-sidebar-tab, and register-left-panel-page planned changes.
    - Dedicated per-artifact-type renderers, owned by the dsh-strict-spec-viewer-renderers milestone.
    - Any write, edit, or mutation of strict YAML; invoking strict-spec-cli or a custom host RPC namespace from the plugin; changes to strict artifact schemas, the strict CLI, the MCP server, or deepseek-harness itself.
    - Changes to the coverage gate scope, the config.yaml review evidence, the engines.dsh pin, or the shared-module externals list.
    - 'Delta specs, delta scenes, or delta tech: every viewer behavior this model implements is already specified in dsh-viewer-behavior and covered by the draft operator-browses-strict-documents scene, the change registers no UI so nothing observable changes, and it complies with the existing dsh-plugin-client standard without altering it.'
unchanged_behavior:
  - The plugin's user-visible registration stays exactly the scaffold's placeholder left-sidebar icon with no document tree or document view.
  - The strict CLI, strict artifact schemas, the MCP server, and generated workflow documents are unchanged.
  - The root build, the native CLI build, and every existing suite in bun test/run.ts keep passing, the client bundle keeps the ModuleLoader closure-factory wrapper with shared dsh modules external, and bun scripts/coverage-gate.ts --threshold 78 keeps passing with its scope unchanged.
roadmap:
  milestone: dsh-strict-spec-viewer-foundation
  planned_change: build-document-discovery-model

schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: allow-two-active-changes
approach:
  - 'Update the existing single-active contract first, then replace the three hard-coded single-active thresholds with a shared maximum of two semantics: scaffold creation rejects only when two other active changes exist, maintenance seeds while fewer than two exist, and migration reports overflow only above two. Add boundary tests for one, two, and three active changes, rebuild dist, and run the configured coverage gate.'
decisions:
  fixed-limit-two:
    decision: Keep the policy unconditional but raise the fixed maximum from one active change to two.
    rationale: The user requested exactly two to accommodate temporary inserted work; a configurable policy or force flag would widen the contract beyond the request.
  consistent-overflow-boundary:
    decision: Treat the third active change as the overflow boundary consistently across propose, maintenance, and migration reporting.
    rationale: Using the same boundary prevents commands from disagreeing about valid workflow state while migration still preserves all convertible inputs.
  prewrite-rejection:
    decision: Propose checks capacity before creating any directory or scaffold artifact and reports all active blockers when capacity is full.
    rationale: This preserves the existing no-partial-state guarantee and gives the operator enough information to archive or cancel one active change.
alternatives: []
risks: []

schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: migrate-domain-behavior
mapping:
  implementation:
    - src/migrate.ts
  tests:
    - test/suites/roadmap-and-migration.ts
operations:
  ADDED: {}
  MODIFIED:
    migrate-multiple-active-change-warning:
      strength: MUST
      statement: The system MUST keep converting every supported legacy active change during migration, and when the converted output contains more than two active changes the migration report MUST include a warning and a manual follow-up entry directing the operator to archive or cancel down to two active changes.
      scenarios:
        three-converted-active-changes-produce-warning-and-follow-up:
          - GIVEN: a legacy .spec-driven workflow contains more than two supported active changes
          - WHEN: strict-spec-driven migrate runs
          - THEN: every supported active change is converted, and the migration report includes a warning plus a manualFollowUp entry directing the operator to reduce the result to two active changes
        two-converted-active-changes-produce-no-warning:
          - GIVEN: a legacy .spec-driven workflow contains at most two supported active changes
          - WHEN: strict-spec-driven migrate runs
          - THEN: the migration report contains no active-change-limit warning and no related manual follow-up entry
  REMOVED: {}

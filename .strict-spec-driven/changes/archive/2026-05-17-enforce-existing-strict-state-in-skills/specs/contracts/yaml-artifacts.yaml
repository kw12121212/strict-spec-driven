schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: contracts-yaml-artifacts
mapping:
  implementation:
    - skills/strict-roadmap-milestone/SKILL.md
    - src/skills/model.ts
    - src/skills/content.ts
    - skills/strict-roadmap-propose/SKILL.md
    - skills/strict-roadmap-recommend/SKILL.md
    - skills/strict-roadmap-sync/SKILL.md
    - skills/strict-spec-apply/SKILL.md
    - skills/strict-spec-archive/SKILL.md
    - skills/strict-spec-auto/SKILL.md
    - skills/strict-spec-brainstorm/SKILL.md
    - skills/strict-spec-cancel/SKILL.md
    - skills/strict-spec-dev-session-scripts/SKILL.md
    - skills/strict-spec-maintenance/SKILL.md
    - skills/strict-spec-modify/SKILL.md
    - skills/strict-spec-propose/SKILL.md
    - skills/strict-spec-resync-code-mapping/SKILL.md
    - skills/strict-spec-review/SKILL.md
    - skills/strict-roadmap-plan/SKILL.md
    - skills/strict-spec-ship/SKILL.md
    - skills/strict-spec-simple-task/SKILL.md
    - skills/strict-spec-spec-edit/SKILL.md
    - skills/strict-spec-sync-specs/SKILL.md
    - skills/strict-spec-dev-session-init/SKILL.md
    - skills/strict-spec-verify/SKILL.md
  tests:
    - test/suites/entrypoint-and-skills.ts
operations:
  ADDED:
    non-init-strict-skills-require-existing-workflow-state:
      strength: MUST
      statement: >-
        The system MUST require every strict skill except strict-spec-init and strict-spec-migrate
        to verify that .strict-spec-driven/ already exists before any other workflow step, and when
        it is missing the skill MUST stop and direct the user to run /strict-spec-init instead of
        invoking init itself.
      scenarios:
        missing-workflow-state-blocks-non-init-skills:
          - GIVEN: >-
              a strict non-init skill that operates on .strict-spec-driven/ workflow state is
              reviewed
          - WHEN: its prerequisites, command mapping, and first workflow step are inspected
          - THEN: >-
              the skill requires an explicit .strict-spec-driven/ existence check before any other
              workflow work
          - AND: the missing-directory path stops with guidance to run /strict-spec-init
          - AND: the prompt does not tell the agent to run the bundled init command as a fallback
  MODIFIED:
    dev-session-init-skill-command-contract:
      strength: MUST
      statement: >-
        The system MUST provide a standalone strict dev-session initialization skill package whose
        SKILL.md declares explicit command mappings for the bundled dev-session-plan command,
        requires pre-existing .strict-spec-driven/ workflow state before any other workflow step,
        and instructs agents to refine existing dev-session.yaml content in place instead of
        overwriting it.
      scenarios:
        init-skill-requires-existing-strict-workflow-state:
          - GIVEN: the dev-session initialization SKILL.md is reviewed
          - WHEN: its command mapping and workflow steps are inspected
          - THEN: the skill requires .strict-spec-driven/ to exist before any other workflow step
          - AND: >-
              if the directory is missing the skill stops and directs the user to run
              /strict-spec-init
          - AND: >-
              the guidance tells agents to update an existing declaration in place rather than
              silently replacing it
  REMOVED: {}

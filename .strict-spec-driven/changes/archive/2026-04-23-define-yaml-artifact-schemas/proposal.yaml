schema: strict-spec-driven/change-proposal/v1
schema_version: 1
artifact_type: change_proposal
schema_file: templates/strict-spec-driven/schemas/change-proposal.yaml
change:
  id: define-yaml-artifact-schemas
  status: complete
summary:
  what:
    - >-
      Define the first strict YAML artifact schema contract for the strict spec-driven workflow.
      This change will document the observable schema requirements for:
    - main specs and delta specs
    - change proposals, designs, tasks, and questions
    - specs and roadmap indexes
    - roadmap milestones and planned change entries
    - schema examples and validation expectations
  why:
    - >-
      `strict-spec-driven` is intended to preserve the workflow semantics of `../auto-spec-driven`
      while replacing Markdown-centric workflow artifacts with strict YAML documents. The schema
      contract needs to exist before CLI commands, skills, migration tooling, and self-hosting can
      safely depend on the target artifact formats.
scope:
  in:
    - Add delta specs that define required YAML schema coverage for strict workflow artifacts.
    - >-
      Require schemas to identify required fields, optional fields, enum values, relationships, and
      minimal valid examples.
    - >-
      Require artifact semantics to live in structured YAML fields rather than Markdown headings,
      list indentation, or free-form prose conventions.
    - Require schemas to be precise enough for deterministic validation by scripts.
  out:
    - Implementing a CLI, parser, validator, or migration command.
    - Renaming directories, skills, slash commands, or CLI commands.
    - Defining every field-level detail of the spec/delta model beyond the shared schema contract.
    - Converting this repository's bootstrap `.spec-driven/` state to `.strict-spec-driven/`.
unchanged_behavior:
  - >-
    Existing bootstrap `.spec-driven/` Markdown artifacts remain the active planning workflow until
    strict migration tooling exists.
  - >-
    `SKILL.md`, `README.md`, `AGENTS.md`, and `RTK.md` remain allowed Markdown files because they
    are packaging or repository documentation, not strict workflow artifacts.
  - >-
    Reference workflow semantics from `../auto-spec-driven` remain the baseline unless a later
    accepted change deliberately alters them.

schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: define-yaml-artifact-schemas
approach:
  - >-
    Add a contract-focused delta spec under `specs/contracts/` that describes the required behavior
    of strict YAML artifact schemas. The spec will stay at the observable behavior level. It will
    require the system to define complete YAML schema coverage, field contracts, examples, and
    validation-ready rules without choosing implementation libraries or creating the CLI foundation
    in this change.
decisions:
  - id: treat-this-as-a-spec-only-planning-change
    decision: Treat this as a spec-only planning change.
    rationale: >-
      The repository has no source tree, package manifest, or test runner yet, so implementation
      mappings would be invented if added now.
  - id: >-
      keep-schema-coverage-broad-enough-to-unblock-later-work-while-leaving-directory-naming-command-naming-and-migration-compatibility-to-their-dedicated-roadmap-items
    decision: >-
      Keep schema coverage broad enough to unblock later work, while leaving directory naming,
      command naming, and migration compatibility to their dedicated roadmap items.
    rationale: >-
      Keep schema coverage broad enough to unblock later work, while leaving directory naming,
      command naming, and migration compatibility to their dedicated roadmap items.
  - id: require-structured-yaml-fields-for-workflow-meaning
    decision: Require structured YAML fields for workflow meaning.
    rationale: >-
      This prevents the strict variant from recreating Markdown heading/list parsing through YAML
      string blobs.
  - id: >-
      include-examples-as-part-of-the-schema-contract-so-future-validators-and-tests-have-concrete-valid-documents-to-target
    decision: >-
      Include examples as part of the schema contract so future validators and tests have concrete
      valid documents to target.
    rationale: >-
      Include examples as part of the schema contract so future validators and tests have concrete
      valid documents to target.
alternatives:
  - option: Start with `define-strict-directory-and-prefixes`
    reason: >-
      rejected for now because naming can be documented once the artifact contract has a stable
      target.
  - option: Start with `bootstrap-typescript-cli`
    reason: rejected because the CLI would need to guess schema shapes before the contract exists.
  - option: Define only the spec and delta schema first
    reason: >-
      rejected because proposals, tasks, questions, indexes, and roadmap artifacts also need shared
      structure before later workflows can be ported consistently.

schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: enforce-self-hosted-bun-coverage
approach:
  - Make the spike's proven mechanism the repository's own review gate. The configured complete project regression command becomes the coverage gate invocation (bun scripts/coverage-gate.ts --threshold 78), which builds, runs the full suite under subprocess V8 coverage, and exits non-zero below threshold; the config declares the matching structured coverage contract that the new schema validates. The policy is recorded as a delta tech rule on the existing workflow-regression-coverage standard rather than a new standard, and tests pin the declaration and command wiring so they cannot drift apart silently.
decisions:
  threshold-from-measured-baseline:
    decision: The initial threshold is 78, the spike's measured 78.14% src/** line coverage rounded down to a whole number.
    rationale: The milestone requires the gate to start as a ratchet against regression, not an aspiration; a threshold at the measured baseline blocks coverage loss immediately without inviting threshold exceptions or superficial tests.
  regression-command-is-coverage-gate:
    decision: review_evidence.project_regression.command becomes 'bun scripts/coverage-gate.ts --threshold 78', replacing 'bun run build && bun test/run.ts'.
    rationale: The gate script already runs bun run build and the complete suite before checking coverage, so the new command is a strict superset of the old regression evidence with the threshold check appended; one command keeps review evidence atomic.
  extend-existing-testing-standard:
    decision: The coverage policy lands as a new MUST rule on workflow-regression-coverage via a delta tech artifact instead of a new standard.
    rationale: The milestone dependencies require extending the closest existing testing policy surface rather than introducing overlapping standards, and delta tech merges on archive keep the live standard untouched during the change.
  pin-declaration-with-tests:
    decision: Regression tests assert the self-hosted config declares the coverage contract (numeric threshold, metric line, src/** scope) and that the configured command invokes the coverage gate with a matching threshold.
    rationale: The milestone's done criteria require that future workflow edits cannot silently remove the gate; pinning both the declaration and the command-to-threshold consistency makes removal or drift a test failure.
alternatives: []
risks: []

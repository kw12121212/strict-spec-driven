schema: strict-spec-driven/change-proposal/v1
schema_version: 1
artifact_type: change_proposal
schema_file: templates/strict-spec-driven/schemas/change-proposal.yaml
change:
  id: add-harness-infer-doctor
  status: proposed
summary:
  what:
    - Add AI-assisted harness generation support through deterministic CLI helpers.
  why:
    - >-
      Harness is AI-friendly only when projects have concrete declarations; agents need safe
      discovery and diagnostics instead of guessing local commands.
scope:
  in:
    - >-
      Add a harness-infer command that scans common project metadata and writes or prints a safe
      harness.yaml draft with manual defaults for uncertain or risky operations.
    - >-
      Add a harness-doctor command that validates harness declarations against project files,
      command availability, generated wrappers, environment variable declarations, ports, and
      working directories.
    - >-
      Update strict-spec-harness-init guidance to use inference and doctor checks before
      hand-editing harness.yaml.
  out:
    - Do not execute inferred lifecycle commands during inference or doctor checks.
    - Do not infer production mutating operations or stateful lifecycle permission automatically.
unchanged_behavior:
  - Existing harness-plan/start/stop/status/logs/session behavior remains unchanged.
  - >-
    Existing harness schema stays compatible unless new optional metadata is required for the new
    commands.

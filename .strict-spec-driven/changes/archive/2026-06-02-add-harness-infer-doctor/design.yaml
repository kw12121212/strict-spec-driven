schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: add-harness-infer-doctor
approach:
  - >-
    Implement inference and doctor as deterministic CLI functions in the harness module. Inference
    reads repository metadata such as package.json, docker-compose files, Procfile-like command
    files, .env.example, and README text, then emits a harness declaration draft with safe defaults.
    Doctor reuses schema validation and derived harness planning while adding repository-file checks
    and generated wrapper verification.
decisions:
  safe-draft-defaults:
    decision: Inference produces safe draft declarations rather than executable production automation.
    rationale: >-
      AI can help discover likely components and commands, but risky operations must remain
      explicit. Development scripts may be suggested; production and stateful lifecycle permissions
      stay manual or disabled unless a human edits them.
  deterministic-doctor-diagnostics:
    decision: Doctor reports machine-readable diagnostics without starting or stopping services.
    rationale: >-
      Agents need stable feedback loops for fixing harness.yaml. Running project commands during
      doctor checks would blur validation with lifecycle execution and could mutate state.
  skill-uses-cli-first:
    decision: >-
      The harness initialization skill should prefer harness-infer, harness-doctor, harness-plan,
      and harness-scripts over free-form reconstruction.
    rationale: >-
      AI-authored harness files are more reliable when generated and validated by deterministic
      repository-aware helpers before any hand edits.
alternatives: []
risks: []

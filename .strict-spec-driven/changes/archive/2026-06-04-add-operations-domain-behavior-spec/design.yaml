schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: add-operations-domain-behavior-spec
approach:
  - >-
    Add one observable-behavior main spec under .strict-spec-driven/specs/operations/ for
    maintenance, ship, list, modify, and cancel.
  - >-
    Use current operations tests and command implementations as evidence for behavior requirements
    and scenarios.
  - >-
    Re-point operations-specific mappings from cli-foundation to the new spec, then run
    verify-spec-mappings and the project regression suite.
decisions:
  domain-behavior-spec:
    decision: Represent operations coverage as one command-domain main spec.
    rationale: >-
      The commands share repository upkeep and lifecycle-edge responsibilities, and one spec keeps
      the contract behavior-focused without mirroring command handler internals.
alternatives: []
risks: []

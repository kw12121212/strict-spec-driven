schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: cli-foundation
operations:
  ADDED:
    skill-handoff-states-no-harness-mechanism:
      strength: MUST
      statement: Skill packaging validation MUST report a diagnostic when a bundled skill routes an agent to another skill through a named harness tool instead of stating a plain skill handoff, and the diagnostic MUST name the offending SKILL.md path, the line the phrasing appears on, and the named mechanism; the validation command MUST exit non-zero when any such phrasing is present, so a project that runs only the shipped command observes the failure without depending on this repository regression suite. Guidance that names a command-line program on a line that routes the reader to no skill MUST NOT be reported, because the rule governs how a handoff is worded rather than every mention of a program.
      scenarios:
        named-harness-mechanism-fails-validation:
          - GIVEN: a bundled skill whose guidance tells the agent to reach another skill through a named harness tool
          - WHEN: the shipped skill validation command runs over the skill set
          - THEN: the command exits non-zero and reports a diagnostic naming that SKILL.md path, the line the phrasing appears on, and the named mechanism
        plain-skill-handoff-passes-validation:
          - GIVEN: the same bundled skill with the handoff stated as a plain skill handoff that leaves loading to the running harness
          - WHEN: the shipped skill validation command runs over the skill set
          - THEN: the command exits zero and reports no harness-mechanism diagnostic for that skill
        naming-a-program-outside-a-handoff-is-not-reported:
          - GIVEN: bundled skill guidance that names a command-line program on a line that routes the reader to no skill
          - WHEN: the shipped skill validation command runs over the skill set
          - THEN: no harness-mechanism diagnostic is reported for that line
  MODIFIED: {}
  REMOVED: {}

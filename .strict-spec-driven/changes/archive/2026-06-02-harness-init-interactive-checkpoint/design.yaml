schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: harness-init-interactive-checkpoint
approach:
  - >-
    Rewrite SKILL.md Steps section to insert a confirmation checkpoint after harness-infer output.
    The checkpoint requires: (1) presenting the full draft to the user, (2) asking mandatory
    questions about development and production environments, (3) letting the agent ask additional
    project-specific questions, (4) requiring explicit user approval before writing harness.yaml or
    running doctor/plan/scripts.
decisions:
  human-checkpoint-after-infer:
    decision: >-
      Place the confirmation checkpoint after harness-infer and before any file writes, not inside
      the CLI
    rationale: >-
      CLI should remain non-interactive and scriptable. Interaction is an agent-layer responsibility
      defined by the skill prompt.
alternatives: []
risks: []

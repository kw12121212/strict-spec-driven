schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: proposal-bundle-templates-with-dist
approach:
  - >-
    ### 1. `import.meta.url`-relative template resolution Replace the `PROJECT_ROOT` pattern in both
    `scaffold.ts` and `validation.ts` with a helper that resolves the bundled template directory
    relative to the current module file. When the compiled JS lives in `dist/`, the helper walks up
    to `dist/` and then into `dist/templates/strict-spec-driven/...`. When running from source, it
    walks up to the project root and into `templates/strict-spec-driven/...`. The shared logic:
    ```ts function getBundledDir(...segments: string[]): string { const thisDir =
    path.dirname(fileURLToPath(import.meta.url)); const distPath = path.join(thisDir, "templates",
    ...segments); if (existsSync(distPath)) return distPath; return path.join(thisDir, "..",
    "templates", ...segments); } ``` `scaffold.ts` uses `getBundledDir("strict-spec-driven",
    "scaffold")` and `validation.ts` uses `getBundledDir("strict-spec-driven", "schemas")`. ### 2.
    Build step update Replace the current `tsc` build script with a compound command that compiles
    TypeScript then copies templates: ```json "build": "tsc && cp -r templates dist/templates" ```
    Using `cp -r` is sufficient because the project already targets Bun and Linux environments. No
    cross-platform file-copy library is needed. ### 3. Tests Add a new test section that:
  - >-
    Lists all required scaffold assets and verifies each exists under
    `dist/templates/strict-spec-driven/scaffold/`.
  - >-
    Lists all schema files and verifies each exists under
    `dist/templates/strict-spec-driven/schemas/`.
  - >-
    Runs `strict-spec-driven init` in a temp directory and confirms it succeeds using only compiled
    output.
  - >-
    Runs `strict-spec-driven propose test-change` in a temp directory and confirms it succeeds using
    only compiled output.
decisions:
  - id: fallback-resolution
    decision: The helper checks `dist/templates/` first, then falls back to `../templates/`.
    rationale: >-
      This lets tests still work during development (running from source) while preferring the
      bundled copy in production (running from dist). Both paths produce the same template files
      after a build.
  - id: cp-r-over-a-js-copy-script
    decision: The project uses Bun on Linux.
    rationale: >-
      A shell `cp -r` is simpler, has zero dependencies, and matches the project's existing approach
      of shell-based tooling.
  - id: symlink-creation-deferred
    decision: >-
      The planned change mentions skill-directory symlinks, but this repository has no skill
      directories.
    rationale: That work belongs in milestone 04 when skills are created.
alternatives:
  - option: Always resolve relative to `import.meta.url` without fallback
    reason: >-
      Would break `bun test/run.ts` during development because tests run against freshly compiled
      output but developers may not have run the copy step. The fallback keeps both workflows
      working.
  - option: Use a build plugin (e.g., `bun build --externals`)
    reason: Over-engineering for a single directory copy.
  - option: Bundle templates as inline JS constants
    reason: >-
      Would lose the readability and schema-reuse benefits that motivated external YAML template
      files in the first place.

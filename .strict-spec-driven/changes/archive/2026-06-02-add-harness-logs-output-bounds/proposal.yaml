schema: strict-spec-driven/change-proposal/v1
schema_version: 1
artifact_type: change_proposal
schema_file: templates/strict-spec-driven/schemas/change-proposal.yaml
change:
  id: add-harness-logs-output-bounds
  status: proposed
summary:
  what:
    - >-
      Default harness-logs to a conservative tail-line bound and expose --tail <n> plus --all for
      explicit full-log access.
  why:
    - >-
      Long-running captured harness logs currently print verbatim and can flood an agent context
      window in a single command.
scope:
  in:
    - >-
      Update the harness-logs command contract, usage text, and captured-log read behavior to
      enforce a documented default tail-line bound.
    - >-
      Support explicit --tail <n> selection and an --all override, document both in HARNESS.md, and
      cover oversized-log behavior with deterministic regression coverage.
  out:
    - >-
      Changing the separate status/logs operation-model reconciliation tracked by other milestone
      work.
    - Changing harness runtime-state ownership or the underlying captured-log file format.
unchanged_behavior:
  - >-
    harness-logs continues to read the captured runtime log for the selected declared component and
    leaves start, status, and stop behavior unchanged.
roadmap:
  milestone: 0013-harness-ai-friendliness-hardening
  planned_change: add-harness-logs-output-bounds

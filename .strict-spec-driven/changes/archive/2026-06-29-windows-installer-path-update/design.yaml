schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: windows-installer-path-update
approach:
  - Update the PowerShell installer to normalize the resolved bin directory, append it to the User PATH environment variable when missing, and remove it on uninstall unless explicitly told to leave PATH unchanged. Keep the native build helper as the source of executable installation behavior.
decisions:
  user-path-default:
    decision: The Windows installer updates the current user's PATH by default and exposes NoPathUpdate and KeepPathOnUninstall switches for operators that do not want environment mutation.
    rationale: User-level PATH avoids administrator privileges and matches the user-level default install directory while preserving opt-out controls for managed environments.
alternatives: []
risks: []

schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: create-strict-template-assets
approach:
  - >-
    Add a dedicated strict scaffold template location under `templates/strict-spec-driven/scaffold/`
    and create YAML/Markdown seed files that represent initial strict workflow state.
  - >-
    Keep template assets machine-parseable and deterministic so `init` and future tests can copy or
    validate them without ad hoc string assembly.
  - >-
    Keep this change artifact-focused; defer command wiring (`init`) and broader fixture matrices to
    subsequent planned changes.
decisions:
  - id: >-
      separate-scaffold-assets-from-templates-strict-spec-driven-schemas-and-templates-strict-spec-driven-examples-to-avoid-mixing-generated-state-templates-with-contract-and-example-files
    decision: >-
      Separate scaffold assets from `templates/strict-spec-driven/schemas/` and
      `templates/strict-spec-driven/examples/` to avoid mixing generated-state templates with
      contract and example files.
    rationale: >-
      Separate scaffold assets from `templates/strict-spec-driven/schemas/` and
      `templates/strict-spec-driven/examples/` to avoid mixing generated-state templates with
      contract and example files.
  - id: >-
      use-this-change-to-define-minimal-required-scaffold-files-only-so-downstream-implement-strict-init-can-focus-on-idempotent-filesystem-behavior
    decision: >-
      Use this change to define minimal required scaffold files only, so downstream
      `implement-strict-init` can focus on idempotent filesystem behavior.
    rationale: >-
      Use this change to define minimal required scaffold files only, so downstream
      `implement-strict-init` can focus on idempotent filesystem behavior.
  - id: >-
      record-template-asset-expectations-in-cli-foundation-delta-spec-so-downstream-implementation-and-tests-have-an-explicit-observable-contract
    decision: >-
      Record template-asset expectations in `cli/foundation` delta spec so downstream implementation
      and tests have an explicit observable contract.
    rationale: >-
      Record template-asset expectations in `cli/foundation` delta spec so downstream implementation
      and tests have an explicit observable contract.
alternatives:
  - option: Fold template creation directly into `implement-strict-init`
    reason: >-
      rejected because it couples asset definition and command semantics, making failures harder to
      isolate.
  - option: Reuse schema example files as init templates
    reason: >-
      rejected because examples are contract demonstrations, not necessarily complete scaffold state
      for generated project directories.

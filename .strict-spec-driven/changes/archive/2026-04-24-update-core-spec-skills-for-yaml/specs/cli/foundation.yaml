schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: cli-foundation
mapping:
  implementation:
    - src/skills.ts
  tests:
    - test/run.ts
operations:
  ADDED:
    - requirement:
        id: cli-core-skill-content-validation-smoke-coverage
        strength: MUST
        statement: >-
          The system MUST include automated checks that exercise strict core lifecycle skill content
          for both passing and failing states, not only package-shape validation.
        scenarios:
          - id: automated-checks-accept-aligned-core-skill-content
            steps:
              - kind: GIVEN
                text: >-
                  the strict core lifecycle skills contain explicit strict command mappings and
                  `.strict-spec-driven/` workflow guidance
              - kind: WHEN
                text: repository automated checks are executed
              - kind: THEN
                text: the core skill content checks pass
          - id: automated-checks-reject-placeholder-core-skill-content
            steps:
              - kind: GIVEN
                text: >-
                  a strict core lifecycle skill keeps a generic placeholder command block or omits
                  required strict workflow guidance
              - kind: WHEN
                text: repository automated checks are executed
              - kind: THEN
                text: the core skill content checks fail
              - kind: AND
                text: diagnostics identify the failing skill package deterministically
  MODIFIED: []
  REMOVED: []

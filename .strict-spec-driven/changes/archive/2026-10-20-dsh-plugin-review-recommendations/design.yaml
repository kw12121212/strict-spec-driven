schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: dsh-plugin-review-recommendations
approach:
  - 'Four independent edits inside the existing plugin surfaces. (1) refineLabels gains a bounded-concurrency walk: collect the leaf document nodes in tree order, run refineDocument over them with a fixed small concurrency limit through a shared worker-pool helper, and assemble results back into the input positions, so the tree state each call produces is identical to the serial walk while the reads overlap. (2) recomputeDocuments, which already collects the set of document paths the tree holds, prunes documentMeta and taskCompletionByFile entries whose path that set no longer holds, so a deleted file loses its recorded status and completion instead of badging a re-created file with the deleted version''s values. (3) refresh.ts reattaches the pump doc comment to pump, leaving code behavior untouched. (4) both plugin READMEs add a dsh-upgrade SOP section — bump the pin through its own planned change per the narrow-engines-dsh-pin standard, rebuild, reinstall or re-link, restart the host — and the install section''s first command block folds bun install and bun run build ahead of the documented dsh plugin add, so a fresh clone copies one block that works.'
decisions:
  bounded-concurrency-preserves-result-order:
    decision: Label refinement runs refineDocument calls concurrently up to a small fixed limit but writes every result into its input-ordered slot before any tree state is recomputed, so snapshots, badge values, and read outcomes are byte-identical to the serial walk.
    rationale: The model suites assert tree snapshots and per-file read patterns, not cross-document RPC interleaving; preserving assembly order keeps every existing assertion meaningful while cutting first-paint latency on label-rich workspaces.
  metadata-pruned-on-recompute:
    decision: documentMeta and taskCompletionByFile entries are pruned inside recomputeDocuments against the document paths the current tree holds, rather than only at loadWorkspace.
    rationale: recomputeDocuments already computes that path set on every tree mutation, so pruning there removes deleted-file metadata at the same mutation that stopped listing it, without a new code path; the observable effect is a re-created file no longer showing the deleted version's status or completion badge.
  no-scene-and-no-delta-artifacts:
    decision: 'The change records that no delta scene applies because it alters no actor flow: the operator-visible tree, views, and controls behave identically, and no dsh-viewer-behavior requirement changes, so specs/, scenes/, and tech/ stay absent.'
    rationale: Scene-first routing treats refactors, tooling, and documentation as scene-free technical changes; the only behavior-adjacent edit (metadata pruning) corrects an internal map to the values the spec already requires badges to present, adding no new observable behavior to specify.
  readme-commands-evidence-backed:
    decision: 'The upgrade SOP documents only commands verified against the pinned dsh 0.2.1-rc.2 host this session, and the change records each legs observed evidence: bun run build in plugins/dsh-strict-spec exited 0 and rewrote dist/client.js and dist/host.js; dsh plugin --profile web add with a link: target under an isolated DSH_HOME exited 0, added the dependency, and wrote dsh-plugin-strict-spec into the profiles dsh.profile.bundles; dsh web booted on a scratch port and served the plugin bundle under /plugins/ with HTTP 200 and a node --check-clean body; a real browser loaded both entry points (the left panel page with session picker, workspace tree, milestone view, and the right-sidebar session-bound tab) with the plugin style element injected exactly once; dsh --version printed 0.2.1-rc.2. The future-release leg of the SOP (bumping the pin and reinstalling against a host outside the pinned range) did not run and cannot run until a newer host release exists, and both READMEs say so plainly.'
    rationale: The run-a-planned-install-command-against-the-pinned-host lesson requires each documented install or setup command to run against the pinned release before it is written into operator documentation, and the manual-checks-record-observed-evidence standard requires each manual legs observed evidence to be recorded inside the changes own artifacts.
  upgrade-sop-defers-pin-widening:
    decision: The upgrade SOP names bumping the engines.dsh pin as its own planned change on the narrow-engines-dsh-pin standard instead of widening or version-gating anything in this change.
    rationale: The narrow-engines-dsh-pin MUST rule pins engines.dsh to the built-against patch line and makes widening a separate planned change; documenting the procedure satisfies the review finding without touching the pin.
  no-delta-spec:
    decision: 'The change is technical-only: no dsh-viewer-behavior main spec requirement is added, modified, or removed, so the specs/ directory stays empty.'
    rationale: The tree, views, entry points, and every observable behavior the dsh-viewer-behavior requirements govern are unchanged; the concurrency edit is an internal performance refactor with byte-identical tree output, the metadata pruning makes the store match the declared-values-only and tree-node-presentation requirements rather than changing them, and the README and comment edits touch no spec-governed behavior.
alternatives: []
risks:
  - Concurrent refineDocument calls interleave read RPCs, so a fake-port suite asserting a global cross-document read order would fail; mitigation is slot-ordered assembly plus suites that assert per-file outcomes, which the existing model suite already does.
  - Pruning inside recomputeDocuments runs on every tree mutation including collapse, so a collapsed group's completion badge disappears until re-expansion re-reads it; that matches the tree-node-presentation requirement, whose badge appears only once the tasks file was read, and collapse already drops the badge from the derived state today.
  - README SOP commands for a future host release cannot be executed now; mitigation is wording that separates the legs that ran against 0.2.1-rc.2 from the future-release leg, per the documentation lesson.

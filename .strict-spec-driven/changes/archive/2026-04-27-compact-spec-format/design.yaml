schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: compact-spec-format
approach:
  - "Change main-spec.json_schema: requirements from array to object (id-as-key), scenarios from array to object (id-as-key), steps to single-key format."
  - Apply the same step format change to the requirement definition in delta-spec.yaml.
  - Update all code that iterates requirements, scenarios, or steps to use Object.entries() on mappings instead of array iteration.
  - Reformat both existing spec files to the new format.
  - "Remove unique_by: id from the schema metadata since YAML keys enforce uniqueness naturally."
decisions:
  - "Requirements and scenarios both use id-as-key mapping format for consistency and maximum token savings."
  - "Steps use single-key objects (GIVEN: text) instead of two-field objects (kind+text) — valid YAML, valid JSON Schema, preserves all semantic information."
  - "Keep the same field names (requirements, scenarios, steps) so the schema structure is recognizable, only change the container type."
alternatives:
  - "Drop GIVEN/WHEN/THEN entirely and use a flat verifies: string — rejected because it loses the BDD step structure which is useful for test case generation."
  - "Keep arrays but inline id as a flow-style mapping key — rejected because it's less readable than the mapping approach."
risks:
  - "YAML parsers may reorder mapping keys — mitigated by JS YAML parsers preserving insertion order, and the original order is not semantically meaningful for requirements/scenarios."

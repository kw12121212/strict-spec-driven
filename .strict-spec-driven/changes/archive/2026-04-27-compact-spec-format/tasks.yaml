schema: strict-spec-driven/task-list/v2
schema_version: 2
artifact_type: task_list
schema_file: templates/strict-spec-driven/schemas/task-list.yaml
change: compact-spec-format
sections:
  Implementation:
    update-main-spec-schema:
      text: 'Update main-spec schema: requirements and scenarios to mapping, steps to single-key format.'
      status: complete
    update-delta-spec-schema:
      text: >-
        Update delta-spec schema requirement definition: scenarios as mapping, steps as single-key
        objects.
      status: complete
    update-type-definitions:
      text: >-
        Update StrictRequirement/StrictScenario/StrictScenarioStep types in
        src/migrate/parsers/shared.ts to use new mapping format.
      status: complete
    update-migrate-parser:
      text: >-
        Update src/migrate/parsers/specs.ts to output requirements and scenarios as mappings, steps
        as single-key objects.
      status: complete
    update-archive:
      text: >-
        Update src/archive.ts: requirements is now a mapping with key-based add/replace/delete
        instead of array operations.
      status: complete
    update-review:
      text: >-
        Update src/review.ts: iterate requirements and scenarios via Object.entries/values instead
        of array methods.
      status: complete
    update-validation-helpers:
      text: Update src/validation.ts duplicateIdChecks for mapping-based collections.
      status: complete
    update-tests:
      text: Update test files to use mapping-based requirements/scenarios and new step format.
      status: complete
    reformat-spec-files:
      text: Reformat existing spec files to the new compact format.
      status: complete
  Testing:
    run-build:
      text: Verify TypeScript compilation succeeds with no errors.
      status: complete
      command: bun run build
    run-tests:
      text: Run the full test suite and confirm all tests pass.
      status: complete
      command: bun test/run.ts
  Verification:
    verify-token-savings:
      text: Measure byte count of spec files before and after to confirm reduction.
      status: complete
    verify-compact-format-roundtrips:
      text: >-
        Verify that archive operations still work correctly with mapping-based requirements via the
        test suite.
      status: complete
testing_gates:
  validation_task: run-build
  unit_test_task: run-tests

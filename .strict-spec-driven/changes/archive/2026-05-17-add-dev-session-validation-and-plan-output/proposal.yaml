schema: strict-spec-driven/change-proposal/v1
schema_version: 1
artifact_type: change_proposal
schema_file: templates/strict-spec-driven/schemas/change-proposal.yaml
change:
  id: add-dev-session-validation-and-plan-output
  status: proposed
summary:
  what:
    - >-
      Add a dev-session-plan CLI command that validates the declared dev-session artifact and emits a
      deterministic machine-readable development-session plan without starting services.
  why:
    - >-
      Agents and users need a dry inspection path for declared local development sessions before
      running long-lived commands or opening browser targets.
scope:
  in:
    - >-
      Validate .strict-spec-driven/dev-session.yaml through the bundled schema pipeline and report
      deterministic diagnostics for missing or invalid metadata.
    - >-
      Render declared services, working directories, required environment variable names, readiness
      checks, browser targets, cleanup behavior, and unavailable conditions as a dry session plan.
  out:
    - >-
      Starting or stopping services, creating runtime state, streaming logs, or opening browser
      targets.
    - Generating helper scripts or browser-trial evidence workflows.
unchanged_behavior:
  - Existing non-dev-session CLI commands and strict workflow behavior remain unchanged.
roadmap:
  milestone: 0012-development-session-assistance
  planned_change: add-dev-session-validation-and-plan-output

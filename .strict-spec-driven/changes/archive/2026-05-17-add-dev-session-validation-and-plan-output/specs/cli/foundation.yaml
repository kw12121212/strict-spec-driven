schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: cli-foundation
mapping:
  implementation:
    - src/strict-spec-cli.ts
    - src/cli/registry.ts
    - src/cli/cmd-dev-session.ts
    - src/dev-session.ts
  tests:
    - test/run.ts
    - test/suites/entrypoint-and-skills.ts
    - test/suites/dev-session-plan.ts
operations:
  ADDED:
    cli-dev-session-plan-command:
      strength: MUST
      statement: >-
        The system MUST provide a dev-session-plan CLI command that validates
        .strict-spec-driven/dev-session.yaml and emits a deterministic machine-readable dry session
        plan covering declared services, readiness checks, browser targets, cleanup behavior,
        unavailable conditions, and required environment variable names without starting services or
        creating runtime state.
      scenarios:
        cli-prints-dev-session-plan:
          - GIVEN: a strict project contains a valid .strict-spec-driven/dev-session.yaml declaration
          - WHEN: the user runs strict-spec-driven dev-session-plan
          - THEN: >-
              the command emits deterministic machine-readable output describing the declared
              services, readiness metadata, browser targets, cleanup behavior, unavailable
              conditions, and required environment variable names
          - AND: the command does not start services, open browsers, or write runtime state
    cli-dev-session-plan-diagnostics:
      strength: MUST
      statement: >-
        The system MUST fail dev-session-plan with deterministic diagnostics when the dev-session
        declaration is missing or violates the bundled dev-session schema.
      scenarios:
        cli-reports-missing-or-invalid-dev-session:
          - GIVEN: >-
              a strict project is missing .strict-spec-driven/dev-session.yaml or the declaration
              does not satisfy the bundled dev-session schema
          - WHEN: the user runs strict-spec-driven dev-session-plan
          - THEN: >-
              the command exits without starting services and reports deterministic diagnostics that
              identify the blocking declaration problem
  MODIFIED: {}
  REMOVED: {}

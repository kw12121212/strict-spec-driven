schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: purge-mapping-from-skills-and-prove-removal
approach:
  - 'Work outward from the deleted capability to its remaining callers. The mapping field, the two audit commands, and their implementation files are already gone, so this change removes every artifact that still points at them: one whole skill, the mapping instructions embedded in fifteen other skills, the skill content expectations that require mapping prose, the inventory entries that name deleted commands as validation owners, the residual mapping prose in two bundled schema documents, two README table rows, and three main-spec requirements. Nothing new is built.'
  - Prove the removal rather than assert it. After the edits, run a repository-wide sweep for the mapping field names, the two deleted command names, and the deleted skill name across source, schemas, examples, skills, specs, standards, tests, generated documents, and README material. Every surviving hit is either removed or justified in writing as an unrelated use of the word mapping. Add a focused regression test that encodes the sweep so the removal cannot silently regress.
  - Route every YAML mutation through its owning strict CLI command. Bundled schema documents and the mutation inventory are CLI-owned assets, so their edits go through the bundled-asset mutation surface rather than direct file writes; the main-spec requirement changes go through a delta spec that archive merges. SKILL.md files, README material, and TypeScript sources are Markdown and code, not repository-owned YAML artifacts, so they are edited directly.
decisions:
  delete-skill-outright:
    decision: Delete skills/strict-spec-resync-code-mapping/ entirely and deregister it from marketplace.json, src/skills/model.ts, the mutation inventory, the embedded template copy, and the check-yaml-mutation-inventory guidance regex, rather than keeping a deprecated stub.
    rationale: The skill's entire workflow is running verify-spec-mappings, reading its stale-path report, and repairing mapping fields through spec-edit. All three of those surfaces are already deleted, so a retained stub would be a skill with no executable step — a worse failure mode than the skill simply being absent, which the marketplace resolves as an unknown skill name. This matches the milestone's removal-versus-deprecation intake recommendation to delete outright and let the diagnostic name the removal.
  strip-not-rewrite-skill-guidance:
    decision: In the remaining skills, delete the mapping command entries, mapping steps, and mapping rules outright instead of rewriting them to point at a substitute check.
    rationale: The milestone explicitly places any replacement traceability mechanism out of scope. Rewriting a mapping step into some other verification would smuggle a new capability into a removal change and would leave agents running a check nobody asked for. Where a step listed several validation commands, only the mapping entries are removed and the surviving commands keep their order.
  replace-inventory-validation-commands:
    decision: For the spec-state and tech-state families in inventory/yaml-mutation-surfaces.yaml, replace the deleted verify-spec-mappings and verify-tech-mappings validation_command values with the validation command that actually validates those artifacts today, and drop the mapping-synchronization reference_side_effects lines.
    rationale: The inventory is consumed by yaml-surface-show and by the CLI-only YAML policy to tell an agent which command validates a family. Leaving a deleted command there sends agents to a hard failure at exactly the moment they are trying to comply with the protocol, and the check-yaml-mutation-inventory script cross-checks the inventory against the implementation, so a dangling command name is a live inconsistency rather than stale prose.
  modify-three-spec-requirements:
    decision: 'Carry the main-spec changes as a delta spec against contracts-yaml-artifacts with three MODIFIED requirements: strict-planning-skill-command-contract, strict-planning-skill-guidance-contract, and proposal-generating-skills-run-proposal-checkpoint.'
    rationale: 'These three requirements are the only surviving main-spec text that names the deleted skill or mapping upkeep, and each states behavior that this change alters rather than retires: two still require a packaged planning skill set and an ownership split, and one still lists checkpoint criteria. MODIFIED preserves the requirement and its other scenarios while correcting the enumeration, where REMOVED would delete contracts that remain in force for the skills that survive.'
  measure-coverage-before-deciding-threshold:
    decision: Run the configured coverage gate at the declared threshold of 78 against the final state and record the measured value in the change, adjusting the threshold only if the measurement forces it.
    rationale: The milestone flags that deleting roughly 750 lines of well-covered implementation moves the measured ratio unpredictably, and its intake recommendation is to keep 78 and record the measurement as justification rather than tune the threshold to make the gate pass. Deciding from the measurement keeps the quality bar honest in either direction.
alternatives:
  - option: Keep verify-spec-mappings and verify-tech-mappings as deprecated no-op commands so external callers do not break, and leave the skill command entries pointing at them.
    reason: A no-op shim that always exits zero reports success for an audit that no longer happens, which is the specific failure mode the milestone identifies as worse than a clear unknown-command error, and it preserves exactly the maintenance burden the milestone exists to remove.
  - option: Leave the mapping prose in the remaining skills as harmless documentation and only delete the resync skill.
    reason: 'Skill prompts are executable instructions, not documentation: an agent following strict-spec-archive would run verify-spec-mappings as a validation step and hit a hard failure mid-archive, and the milestone done criteria explicitly require that no remaining skill instructs an agent to author, repair, or audit a mapping.'
risks:
  - Fifteen SKILL.md files are edited by hand, and skill content expectations enforce required snippets; an over-eager deletion can remove a neighboring required snippet and fail skill validation only at test time.
  - The word mapping is used legitimately across the repository for architecture component mappings, design-system token and snapshot mappings, roadmap paused mappings, skill command mappings, and YAML-mapping-the-datatype error text; the sweep can produce false positives that get removed by mistake.
  - src/embedded-templates.ts is generated from bundled assets; editing the source asset without regenerating the embedded copy leaves two divergent copies of the inventory and schemas that only the generated-doc or packaging checks would catch.
  - Deleting a skill changes the packaged skill inventory, so marketplace, packaging validation, install, and the mutation inventory must all agree or install produces a dangling entry.
  - Measured coverage may fall below 78 for reasons unrelated to this change's edits, forcing a threshold decision inside a change whose scope is a documentation and packaging sweep.

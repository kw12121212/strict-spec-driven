change: purge-mapping-from-skills-and-prove-removal
open: []
resolved:
  - id: requirement-problem
    question: What is concretely going wrong today, and for whom?
    context: 'Why this is asked: the change is planned against a need, and the need lives only with the requester. A "problem" here means what someone does or suffers today — not a feature that is missing. If the answer names a button, a field, a page, or an endpoint, it is a solution, and the underlying problem is still unstated. What a sufficient answer contains: who is affected, what they do today instead, and how often. Worked example: "every Monday one person spends forty minutes copying order rows into a spreadsheet to send the weekly report". What it changes: this becomes the proposal''s why, and it decides whether the change is worth making.'
    answer: The spec and technical-standard file mapping fields, their two audit commands, and their schema surface are already deleted by the earlier changes in milestone remove-artifact-file-mappings, but the skill layer still points at all of them. Fifteen SKILL.md files still declare verify-spec-mappings or verify-tech-mappings as validation commands, so an agent following strict-spec-archive, strict-spec-verify, or strict-spec-auto runs a command that no longer exists and hits an unknown-command failure mid-workflow. A whole skill, strict-spec-resync-code-mapping, exists only to repair mapping drift and is still packaged and registered in the marketplace manifest, so upgrading installs a skill with no executable step. The YAML mutation inventory still names both deleted commands as the validation_command for the spec-state and tech-state families, which sends protocol-following agents to the same failure. Two bundled schema documents and both READMEs still describe mapping behavior that no longer exists.
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: requirement-trigger
    question: Why now — what forced this?
    context: 'Why this is asked: work that nothing forced is the work most often thrown away later. This question catches a request that sounds reasonable but has no real driver behind it. What a sufficient answer contains: the concrete event, deadline, incident, or cost that made this surface now, or an honest statement that nothing did. Worked example: "the report was missed last month and it was raised with the team". What it changes: a change with no trigger is a candidate for deferral, and the answer is weighed at review before archive.'
    answer: Milestone remove-artifact-file-mappings sequenced this as its closing planned change, depending on delete-mapping-commands-and-code, which is now complete and archived. The commands and fields were deleted first, which is precisely what turns every remaining skill instruction into a live failure, so the skill purge and the proof sweep cannot be deferred past the deletion that created the breakage. roadmap-recommend reports this as the only eligible planned change.
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: requirement-outcome
    question: What observable difference proves the problem is solved?
    context: 'Why this is asked: without a success condition, nobody can tell afterwards whether the change worked. "Observable" means someone outside the system can check it without reading the code. What a sufficient answer contains: what a person will see, or no longer have to do, once this is done. Worked example: "the report is in the manager''s inbox on Monday morning without anyone assembling it". What it changes: this becomes the delta spec''s scenarios and the acceptance evidence at review time.'
    answer: 'The milestone done criteria supply the observable proof. The strict-spec-resync-code-mapping skill is absent from the repository and from skill packaging, and no remaining skill instructs an agent to author, repair, or audit a mapping. No artifact references a deleted mapping command: a repository-wide sweep across source, schemas, examples, skills, specs, standards, tests, generated documents, and README material returns no hit for the mapping field names, verify-spec-mappings, verify-tech-mappings, or strict-spec-resync-code-mapping outside archived change history, and each remaining use of the word mapping is justified as unrelated. ARCHITECTURE.md regenerates and matches its generated-doc check. The complete project regression passes with the coverage gate satisfied, with the measured coverage recorded.'
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: requirement-non-goals
    question: What must explicitly not change?
    context: 'Why this is asked: the requester knows which nearby behavior other people depend on, and the agent does not. A "non-goal" is something the change must leave alone even though it sits close to the work. What a sufficient answer contains: the behavior, setting, or output that must survive untouched, and who relies on it. Worked example: "do not change the saved filters — several people rely on their own". What it changes: these become the proposal''s unchanged_behavior items, which review checks the finished result against.'
    answer: 'The milestone''s out-of-scope list governs. No replacement traceability mechanism is introduced; the capability is removed and nothing is substituted. The architecture artifact component mapping and its drift reporting stay, because ARCHITECTURE.md renders them and they have a real consumer, as do the design-system implementation and snapshot mappings. Fields that use the word mapping for unrelated purposes are untouched: roadmap paused mappings, lesson enforcement, design-system tokens, registry role_mappings, skill command mappings, and YAML-mapping-the-datatype error text. Archived change history is not rewritten. The declared coverage threshold of 78 is not tuned to make the gate pass.'
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: requirement-interpretation
    question: Which reading of the request is intended, where more than one is possible?
    context: 'Why this is asked: a short request usually admits several readings, and building the wrong one is indistinguishable from building nothing. What a sufficient answer contains: the reading that is meant, stated plainly enough to rule the others out — or a statement that only one reading exists and what it is. Worked example: "export means the version sent to the manager, not the one I read myself". What it changes: this fixes the scope boundary before any code is written, and settles disputes about what was asked for.'
    answer: 'The planned change details fix the reading: delete the resync skill and deregister it so installed copies do not dangle; remove mapping command entries, upkeep steps, and rules from every remaining SKILL.md that references them; then sweep the whole repository for surviving references to spec or tech mapping fields, the deleted commands, and the deleted skill, and remove or justify each hit; then run the complete project regression with the coverage gate and record the measured coverage against the threshold decision. The milestone intake question removal-versus-deprecation settles the deletion style: delete outright rather than keeping deprecated no-op shims, letting the unknown-command diagnostic name the removal. Skill prompts are treated as executable instructions, not documentation, so mapping prose in them is removed rather than left in place.'
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: inventory-validation-command-replacement
    question: For the spec-state and tech-state families in the YAML mutation inventory, what should replace the deleted verify-spec-mappings and verify-tech-mappings validation_command values?
    context: 'inventory/yaml-mutation-surfaces.yaml declares one validation_command per artifact family, and yaml-surface-show reports it to agents as the command to run after mutating that family. Both spec-state and tech-state currently name commands that no longer exist, so an agent following the CLI-only YAML protocol is sent to an unknown-command failure. Impact: this affects the implementation of the update-mutation-inventory task and the mutation-inventory cross-check test, not the proposal scope or the spec delta. Recommendation: point both families at the command that actually validates those artifacts today, most likely the spec-edit and tech-edit validation path or check-workflow-state, chosen by reading what the surviving commands validate rather than by guessing. Options: (a) name the surviving per-artifact validation command for each family; (b) leave validation_command absent for these two families if the inventory schema permits an omission. A sufficient answer names the command per family, or confirms omission is schema-valid.'
    answer: 'Recovered from repository evidence rather than a human decision. Commit b92c457 (delete-mapping-commands-and-code) already recorded the intended replacements, but wrote them to a new top-level ''families:'' block that no consumer reads: src/yaml-mutation-surface.ts:263 and scripts/check-yaml-mutation-inventory.ts:203 both load ''artifact_families''. The intended values are spec-state -> ''verify <change-name>'' and tech-state -> ''tech-status'', the latter already used by the live tech surface. This change sets those values on artifact_families.spec-state.validation_command and artifact_families.tech-state.validation_command via inventory-edit --set, removes the dead top-level ''families:'' block with --remove-entry, and drops the mapping-synchronization reference_side_effects lines from both live families. The dead block''s malformed ''0''-keyed reference_side_effects mapping disappears with it.'
    status: resolved
    kind: technical
  - id: coverage-threshold-after-removal
    question: After this change lands, does the declared coverage threshold of 78 stay as it is, or should it move to the value actually measured against the final state?
    context: 'The milestone remove-artifact-file-mappings raised this as intake question coverage-threshold-after-removal and left it unanswered. Roughly 750 lines of well-covered implementation were deleted across the earlier changes in this milestone, and this change deletes one more skill and a block of skill text, so the measured src line coverage ratio has moved in a direction nobody has yet observed. Impact: this affects the Testing tasks and the review gate, not the proposal scope, the spec delta, or the implementation files - the configured review evidence command is ''bun scripts/coverage-gate.ts --threshold 78'', and it exits non-zero when measured coverage falls below the threshold, so an unexamined threshold either blocks this change on an artifact of the deletion or silently lowers the real quality bar. Recommendation: keep 78, run the gate against the final state, and record the measured value as the answer. Options: (a) keep 78 unchanged and record the measurement as justification; (b) raise the threshold to the measured value if the deletion pushed coverage well above 78; (c) lower it only if the measurement forces it, with the specific uncovered code named. A sufficient answer names one of these and, for (b) or (c), the numeric value.'
    answer: 'Answered by the milestone''s own intake recommendation for coverage-threshold-after-removal: keep the declared threshold at 78, run ''bun scripts/coverage-gate.ts --threshold 78'' against the final state, and record the measured src line coverage as the justification rather than tuning the threshold to make the gate pass. The technical standard workflow-regression-coverage rule enforce-minimum-coverage independently forbids silently lowering or removing the threshold. If the gate exits non-zero because measured coverage fell below 78, that blocks archive exactly like a failing test and is escalated to the operator with the measurement, rather than resolved by editing the threshold.'
    status: resolved
    kind: technical
    answered_by: roadmap

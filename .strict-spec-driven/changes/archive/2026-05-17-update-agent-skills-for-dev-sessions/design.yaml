schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: update-agent-skills-for-dev-sessions
approach:
  - >-
    Update SKILL.md files for the four core lifecycle skills with a new dev-session guidance
    section, then extend the existing skill content validation checks in src/skills/ to detect
    whether those sections are present, following the same diagnostic and test patterns used for the
    existing core skill content validation.
decisions:
  dev-session-guidance-placement:
    decision: Add dev-session guidance as a new named section in each lifecycle SKILL.md
    rationale: >-
      Keeps dev-session instructions co-located with the skill's own workflow steps so agents
      reading the skill file see when to use dev-session commands without consulting a separate
      document; mirrors how existing skills document their own workflow steps.
alternatives: []
risks: []

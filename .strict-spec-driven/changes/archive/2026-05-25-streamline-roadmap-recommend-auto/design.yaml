schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: streamline-roadmap-recommend-auto
approach:
  - >-
    Revise the two skill prompts to make the deterministic CLI output the first source of truth,
    then make strict-spec-auto resume existing populated scaffolds instead of regenerating them.
    Keep all hard gates intact by moving duplicate proposal checks to ready, preserving
    implementation-time verify and archive checks, and explicitly documenting when previously passed
    regression evidence may be reused.
decisions:
  scripted-recommendation-first:
    decision: >-
      strict-roadmap-recommend should run roadmap-recommend before broad manual context reads and
      only open files named by the recommendation result plus the targeted specs needed for the
      proposal.
    rationale: >-
      The command already loads roadmap status, active/archive state, dependencies, and mismatches,
      so targeted reads after a successful recommendation preserve correctness while avoiding
      redundant exploration.
  ready-only-proposal-handoff:
    decision: >-
      strict-roadmap-recommend should use ready as the proposal handoff validation and leave full
      verify to strict-spec-auto after implementation.
    rationale: >-
      ready calls the same verification pipeline but filters expected pending-task diagnostics,
      making it the correct gate for proposal shape without producing duplicate proposal-time noise.
  auto-resume-fast-path:
    decision: >-
      strict-spec-auto should treat an existing non-empty change created by roadmap recommend or
      roadmap propose as a populated scaffold to resume, not as a request to regenerate proposal
      artifacts.
    rationale: >-
      A clear resume path prevents accidental overwrites and repeated generation while still
      allowing ready or next to surface blockers before implementation.
  regression-evidence-reuse:
    decision: >-
      strict-spec-auto may reuse a passing Testing task command as complete project regression
      evidence when it exactly satisfies the configured project_regression command and no relevant
      files changed after it passed.
    rationale: >-
      This keeps the archive evidence requirement intact while avoiding a second identical
      regression run in unchanged states.
alternatives: []
risks: []

schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: add-mcp-server-entrypoint
approach:
  - >-
    Add a small MCP source area under src/mcp for inventory metadata, argument parsing, project
    validation, and stdio server startup.
  - >-
    Keep registration minimal in this change so later resource, tool, and prompt changes can extend
    the inventory without changing launch semantics.
  - >-
    Bundle the MCP entrypoint separately from the existing strict CLI bundle while preserving the
    existing build command as the single project regression path.
decisions:
  thin-entrypoint:
    decision: >-
      Implement the MCP entrypoint as a thin local stdio server launcher that validates project root
      and connects the SDK server transport.
    rationale: >-
      The roadmap requires the server to delegate workflow behavior later; the entrypoint should not
      duplicate CLI/domain rules before resources and tools are added.
  inventory-owned-metadata:
    decision: >-
      Place server name, version, safety-class vocabulary, and registration hooks in an MCP
      inventory module.
    rationale: >-
      A central inventory gives later resource, tool, and prompt changes one extension point and
      reduces drift between registration, docs, and tests.
  separate-bundle:
    decision: >-
      Emit a dedicated dist/scripts/strict-spec-driven-mcp.js bundle alongside the existing CLI
      bundle.
    rationale: >-
      MCP clients need a stable process entrypoint, while the existing strict-spec-driven CLI bundle
      must remain unchanged for current users.
alternatives:
  - option: Reuse src/strict-spec-cli.ts as the MCP process entrypoint.
    reason: >-
      The CLI command router writes command output for shell users and is not a stdio MCP server
      transport.
  - option: Register placeholder tools and resources in the entrypoint change.
    reason: >-
      That would overlap later roadmap changes and make the entrypoint harder to validate
      independently.
risks:
  - >-
    The selected SDK version is currently an alpha v2 package, so imports may need adjustment if the
    SDK changes before release.
  - >-
    Tests should avoid hanging on stdio server startup by validating factories and built output
    instead of starting an interactive MCP session.

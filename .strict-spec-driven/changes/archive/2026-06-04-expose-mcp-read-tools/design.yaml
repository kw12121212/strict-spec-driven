schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: expose-mcp-read-tools
approach:
  - >-
    Represent each read-only MCP tool as inventory metadata plus a handler that maps typed MCP
    arguments to an existing strict CLI command.
  - >-
    Register tools through the MCP SDK from the inventory so discovery, safety metadata, and tests
    share the same source.
  - >-
    Use an injectable command runner in tests to prove success, failure, and no-mutation behavior
    without needing a full MCP host.
decisions:
  cli-delegate:
    decision: >-
      Read-only MCP tool handlers delegate to the existing strict CLI command surface under the
      configured project root.
    rationale: >-
      This keeps strict diagnostics, validation rules, roadmap logic, and harness read behavior in
      one existing implementation path.
  read-safety-only:
    decision: Every tool in this change is classified as read and mutating commands remain out of scope.
    rationale: >-
      The roadmap separates read diagnostics from guarded mutating tools so safe discovery can ship
      before write operations.
  typed-tool-schemas:
    decision: >-
      MCP tools use explicit input schemas for change names, harness log options, and optional
      harness environment selection.
    rationale: >-
      Typed schemas make host-side invocation predictable and allow tests to verify JSON input
      handling without relying on prose descriptions.
alternatives:
  - option: Implement each diagnostic directly inside the MCP server.
    reason: Duplicating strict workflow logic would create drift from the CLI and domain modules.
  - option: Expose mutating tools together with read tools.
    reason: That would skip the planned safety step for host confirmation and lifecycle classification.
risks:
  - >-
    Some current strict CLI diagnostics are text rather than JSON, so the MCP wrapper must preserve
    status and stderr while returning a deterministic JSON envelope.

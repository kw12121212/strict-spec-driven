schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: cli-foundation
mapping:
  implementation:
    - test/fixtures/projects/todo-app/.strict-spec-driven/dev-session.yaml
  tests:
    - test/suites/dev-session-regression.ts
operations:
  ADDED:
    req-dev-session-real-project-fixture-regression:
      strength: MUST
      statement: >-
        The system MUST validate dev-session plan output, invalid metadata diagnostics, stale
        runtime state recovery, cleanup idempotency, and browser trial evidence derivation against a
        committed real-project fixture using the copied-project harness so regression scenarios are
        repeatable without external services or credentials.
      scenarios:
        scenario-valid-plan-against-fixture:
          - GIVEN: >-
              a strict project fixture with a valid dev-session.yaml copied into a temporary
              workspace
          - WHEN: dev-session-plan is run against the copied workspace
          - THEN: >-
              the command exits zero, reports valid=true, emits the declared session id and service
              details, and produces no diagnostics
  MODIFIED: {}
  REMOVED: {}

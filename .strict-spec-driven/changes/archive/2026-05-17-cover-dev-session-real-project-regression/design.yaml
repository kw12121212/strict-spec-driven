schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: cover-dev-session-real-project-regression
approach:
  - >-
    Add a dev-session.yaml to the todo-app fixture (declaring a simple local web service matching
    the fixture's profile), then add a dedicated dev-session regression test suite under
    test/suites/ that uses the copied-project harness to copy the todo-app fixture into a temp
    workspace, run dev-session-plan, dev-session-start, dev-session-status, dev-session-logs,
    dev-session-stop, and dev-session-trial commands against it, and assert deterministic results.
    Stale runtime state recovery and evidence separation checks use the same copied workspace
    without an active process.
decisions:
  use-todo-app-fixture-for-dev-session-regression:
    decision: Extend the todo-app fixture rather than creating a separate fixture
    rationale: >-
      The todo-app fixture is the established real-project host for copied-harness regressions
      (roadmap, migration, CLI). Adding dev-session.yaml there keeps fixture coverage centralized,
      avoids duplicate fixture maintenance, and means dev-session regression tests benefit from the
      same repeatable copy-reset harness all other project regressions use.
alternatives: []
risks: []

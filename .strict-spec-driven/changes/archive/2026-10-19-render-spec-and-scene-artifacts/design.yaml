schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: render-spec-and-scene-artifacts
approach:
  - Add specParts.ts and sceneParts.ts React-free view-model mappers beside the existing changeParts, roadmapParts, and contextParts modules, importing the shared recordFields readers and partitionDocument, and render SpecView, SpecIndexView, SceneView, and ScenesIndexView components in one SpecSceneViews.tsx registered for main_spec, spec_index, scene, and scenes_index in the document view's DEDICATED_VIEWS map, so the four types leave the generic fallback and every artifact type the classifier knows becomes dedicated.
  - Give the spec view a stable DOM anchor per requirement, an id derived from the spec id and requirement id, and extend the shared open action with an optional anchor recorded in the open-document state, so a scene step's coverage link resolves its spec through the tree's documents record and opens the spec at the covering requirement; both entry points bring the anchored requirement into view when the opened document carries one.
  - 'Extend the model''s read-side content pass the way the roadmap facts already work: a spec-facts reader records each non-archived main spec''s declared spec id and requirement ids onto its document record, recomputeDocuments carries them into tree state and the existing directory-watch reloads keep them fresh, and a pure resolver maps a (spec id, requirement id) coverage reference to a spec document path for the scene view''s navigator, following the roadmap navigator''s open-action-only contract with a visible unresolved marker for a reference that resolves to no document.'
  - 'Test the way the existing renderer suites do: component cases statically render the registered main-spec, spec-index, scene, and scenes-index examples plus this repository''s operator-browses-strict-documents scene with its real dsh-viewer-behavior coverage targets, model cases drive the requirement index and the coverage-target resolver over the scripted workspace fake, and the suite runs under bun test/run.ts with the project regression coverage gate.'
  - 'The uncovered-step flag lives in the shared FlowStepView layout, so the delta scene view presents it too: a delta reads the way the merged artifact will, and a step declaring neither coverage nor a reason is the same gap before and after merge — reachable in a delta only through a schema-invalid file, which verify gates at authoring time.'
  - The anchor reveal resolves by element id against the host document, so two simultaneously mounted entry points showing the same anchored document would reveal the first surface's copy; the surfaces share one open-document state and one anchored element id by design, and a per-surface reveal container is deliberately out of scope for this change.
decisions:
  spec-identity-from-declared-fields:
    decision: The spec view presents the spec's declared identity fields — the id and title the main-spec schema declares — and every requirement the requirements mapping holds; no purpose section is synthesized, because the main-spec schema declares no purpose field and the milestone keeps schema changes out of scope.
    rationale: The declared-values-only requirement is an existing MUST that forbids presenting any value not written in the file, and the milestone scope explicitly excludes changing strict artifact schemas so they render more easily; the planned change's title-and-purpose wording is therefore satisfied by the declared identity the artifact actually carries, and any future purpose field would flow through the additional-fields append unchanged.
  requirement-index-on-document-record:
    decision: 'The requirement index lives on the tree''s documents record: the same non-archived content pass that already derives labels, statuses, and roadmap facts also records each main spec''s declared spec id and requirement ids, and the scene view resolves coverage references against that record by pure function.'
    rationale: The content pass already reads every non-archived spec file while deriving labels, so recording spec facts there adds zero workspace reads; keeping resolution a pure function over the documents record keeps it assertable under bun test/run.ts with no host, matches the roadmap facts precedent exactly, and leaves archived entries unread, which the archive contract requires.
  anchor-through-open-action:
    decision: Coverage navigation flows only through the shared openDocument action, extended with an optional anchor recorded in the open-document state; the spec view renders the stable requirement anchors, and a coverage reference whose spec the loaded tree does not hold renders the shared unresolved marker instead of acting.
    rationale: The rendered-view-navigation-through-open-action rule is an existing MUST that names scene coverage links explicitly, so selection, live refresh, and watch behavior stay identical whether a document opens from a tree row or a rendered link; carrying the anchor in the open-document state rather than component-local navigation keeps the anchor observable to both entry points and statically assertable.
alternatives:
  - option: Read each referenced spec file on demand when a scene opens, resolving coverage against freshly loaded spec content.
    reason: The content pass already reads every non-archived spec while deriving labels, so on-demand reads duplicate workspace traffic and introduce a second resolution path that can disagree with the documents record the navigation rules mandate, while archived targets would still be unresolvable.
  - option: Store the requirement index in a dedicated store beside the ownership listing.
    reason: The ownership store exists for archived reads the tree cannot carry, but spec documents are non-archived and already read through the label pass, so a parallel store would duplicate recorded facts and grow a second invalidation path the directory-watch reload already covers.
risks:
  - The anchor mechanism touches the shared open action and open-document state, so a defect there could affect every document open, not only coverage links; the model and component cases must cover opening with and without an anchor.
  - Coverage resolution depends on spec ids declared in scene files matching spec ids declared in main specs; a mismatch presents the unresolved marker rather than an error, which is the milestone's recorded dead-link-not-error tradeoff and must be visibly marked, not logged.
  - Specs index grouping derives the area from declared paths, so an entry whose path names no area subdirectory needs a stable fallback group or it disappears from the grouped view.

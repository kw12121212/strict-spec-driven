schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: fix-family-reexpand-after-collapse
approach:
  - 'Fix the defect where a family is reloaded: loadGroupChildren in plugins/dsh-strict-spec/src/model/traversal.ts lists the workflow root and rebuilds a family node through loadFamilyTree, marking it loaded, so re-expanding any family produces exactly the children the initial load produced; group nodes keep walking their own directory path. A failing model regression case over every fixture family is written first and must pass after the fix.'
decisions:
  rebuild-family-from-sources:
    decision: Rebuild a family node from its canonical sources via loadFamilyTree on re-expansion instead of giving single-file families a real directory path or special-casing them in expandNode.
    rationale: Families are defined by FAMILY_SOURCES, not by a directory, and loadFamilyTree is the one function that already turns those sources into a family's children; reusing it for every family keeps re-expansion identical to the initial load, covers config, architecture, and design-system together, and leaves the store's expand and refresh flow untouched.
  no-delta-scene-step-change:
    decision: Modify only the expand-family-group step's coverage to add the new requirement, keeping its action text.
    rationale: The step already states that the operator expands a collapsed family group; the bug violates that step rather than changing what the operator does, so only its coverage gains the requirement that pins re-expansion.
alternatives:
  - option: Catch the not-found failure in expandNode and show an error condition.
    reason: It would surface a failure for an operation that should simply succeed, and the family's content is fully known from the workflow root listing.
risks:
  - Rebuilding a family re-reads the workflow root listing; for directory families this walks the same canonical directory as before, so only one extra root listing is spent per family expansion.

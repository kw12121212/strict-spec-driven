schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: bind-cli-refactors-to-real-todo-project-regression
approach:
- 'Add new named `createCopiedProjectWorkspace("todo-app")` workspace instances in three existing test suites. Each workspace is declared at suite scope and reused across scenario assertions within its
  section, consistent with the pattern already used in `change-lifecycle.ts`, `roadmap-and-migration.ts`, and `foundation-and-fixtures.ts`. For each command group:'
- '**change-lifecycle.ts**: add a section that runs `list`, `modify <name>`, `cancel <name>`, and `modify <archive-dir>` (archive-lookup) against a copied workspace that already has the todo-app''s active
  and archived change state'
- '**roadmap-and-migration.ts**: add a section that runs `roadmap-status` and `roadmap-sync` against a copied workspace and asserts JSON output validity and milestone reporting'
- '**operations.ts**: add a section that runs `verify-spec-mappings` against a copied workspace and asserts JSON output and exit code All assertions target observable behavior: exit codes, presence of required
  JSON fields, and key output strings. No assertions are made about internal module paths or call chains.'
decisions:
  add-to-existing-suites-not-a-new-file:
    decision: The scenario content is directly related to what each existing suite already covers; adding sections keeps the numbered section sequence intact and avoids a new orchestration entry.
    rationale: The scenario content is directly related to what each existing suite already covers; adding sections keeps the numbered section sequence intact and avoids a new orchestration entry.
  declare-workspace-at-suite-scope:
    decision: Consistent with existing `copiedProject*` workspace declarations, avoids repeated copy-and-cleanup overhead within a section.
    rationale: Consistent with existing `copiedProject*` workspace declarations, avoids repeated copy-and-cleanup overhead within a section.
  assert-observable-contracts-only:
    decision: Scenario assertions check exit code and JSON fields (e.g.
    rationale: '`valid`, `changes`, `milestones`), not internal implementation paths, so the tests remain stable as modules evolve.'
alternatives:
- option: New `cli-surface-regression.ts` suite
  reason: Would give the decomposition an explicit acceptance gate but adds suite orchestration overhead and splits logically related scenarios from their command families.
- option: Add to `foundation-and-fixtures.ts`
  reason: That suite already has some todo-app workspace scenarios but focuses on fixture shape validation, not command-surface behavior.

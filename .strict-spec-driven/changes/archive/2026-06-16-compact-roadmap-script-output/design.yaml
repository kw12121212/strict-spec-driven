schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: compact-roadmap-script-output
approach:
  - 'Introduce compact projection for default roadmap command output at the presentation boundary: keep full loaded roadmap artifacts and sync behavior unchanged, omit large summary fields from default status/overview/recommend output, and preserve full recommendation data behind roadmap-recommend --details.'
decisions:
  compact-roadmap-output:
    decision: Default roadmap CLI output should expose ids, paths, statuses, state, mismatches, counts, and diagnostics, but omit planned-change summary text and other bulky descriptive fields unless a command explicitly advertises details.
    rationale: This keeps automation output bounded as roadmap size grows while preserving deterministic machine fields and the existing detailed recommendation escape hatch.
alternatives: []
risks: []

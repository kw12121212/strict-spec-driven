schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: roadmap-domain-behavior
mapping:
  implementation:
    - src/cli/cmd-roadmap.ts
    - src/roadmap.ts
    - src/roadmap/model.ts
  tests:
    - test/suites/roadmap-and-migration.ts
operations:
  ADDED: {}
  MODIFIED:
    roadmap-status-contract:
      strength: MUST
      statement: The system MUST make roadmap-status validate roadmap artifacts, report compact declared and derived milestone and planned-change state, expose standalone planned-change source paths, omit bulky descriptive and redundant milestone or planned-change fields from default status output, and surface mismatches or diagnostics deterministically.
      scenarios:
        status-reports-compact-valid-roadmap-state:
          - GIVEN: a structurally valid roadmap exists with milestone goals and planned-change summaries
          - WHEN: strict-spec-driven roadmap-status runs
          - THEN: the command exits zero and reports valid=true, milestone order, declared status, derived status, planned changes, source paths, and state without emitting milestone goal, milestone file, or planned-change summary text
        status-reports-invalid-artifacts:
          - GIVEN: roadmap artifacts are malformed or contain cross-file conflicts
          - WHEN: strict-spec-driven roadmap-status runs
          - THEN: the command exits non-zero with deterministic diagnostics including artifact path and field path context
    roadmap-overview-contract:
      strength: MUST
      statement: The system MUST make roadmap-overview render a deterministic compact human-readable milestone and planned-change summary for valid roadmap state without emitting bulky milestone goal or planned-change summary text, and emit actionable diagnostics for invalid roadmap artifacts.
      scenarios:
        overview-renders-compact-valid-roadmap:
          - GIVEN: a valid roadmap has milestones and planned changes with goals and summaries
          - WHEN: strict-spec-driven roadmap-overview runs
          - THEN: the command exits zero and prints milestone table content plus compact planned-change detail in deterministic order without milestone goal or planned-change summary text
        overview-rejects-invalid-roadmap:
          - GIVEN: roadmap artifacts are invalid
          - WHEN: strict-spec-driven roadmap-overview runs
          - THEN: the command exits non-zero and prints actionable diagnostics
    roadmap-recommend-contract:
      strength: MUST
      statement: The system MUST make roadmap-recommend select the first eligible standalone planned change in roadmap order, return compact deterministic default output with skip reason summaries rather than full candidate or planned-change summary text, preserve full candidate detail behind --details, and report no-candidate or roadmap-error states without manual selection.
      scenarios:
        recommend-selects-first-eligible:
          - GIVEN: the roadmap contains eligible and ineligible standalone planned changes
          - WHEN: roadmap-recommend runs without --details
          - THEN: the command exits zero with status recommended and returns the first eligible planned change in roadmap order without planned-change summary text
        recommend-reports-no-candidate:
          - GIVEN: all roadmap candidates are complete, active, dependency-blocked, or otherwise ineligible
          - WHEN: roadmap-recommend runs without --details
          - THEN: the command reports status no-candidate with compact candidate counts and bounded actionable blockers
        recommend-details-preserves-full-data:
          - GIVEN: roadmap-recommend has candidate summary text and skip reasons
          - WHEN: roadmap-recommend runs with --details
          - THEN: the command returns the full recommendation, candidates, summaries, and skip reasons for inspection
  REMOVED: {}

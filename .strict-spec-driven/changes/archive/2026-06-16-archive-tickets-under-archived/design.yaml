change: archive-tickets-under-archived
approach:
  - Rename the ticket archive location constant to .strict-spec-driven/tickets/archived/ and route all ticket lookup, validation, idempotency, and CLI result paths through that canonical location. Update skill prompts and tests to assert the archived directory so the contract, deterministic mechanics, and agent guidance stay aligned.
decisions:
  ticket-archive-directory:
    decision: Resolved tickets use .strict-spec-driven/tickets/archived/ as their canonical archived artifact location.
    rationale: A single canonical directory avoids skill guidance that implies status-only archival or the older archive path, while preserving existing ticket lifecycle semantics and audit access.

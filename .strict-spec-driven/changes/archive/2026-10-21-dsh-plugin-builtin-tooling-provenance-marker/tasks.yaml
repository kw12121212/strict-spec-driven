    provenance-marker-module:
      text: 'In plugins/dsh-strict-spec/src/host/builtinTooling.ts, add a provenance marker: export buildProvenanceMarker(pluginVersion) returning an em-dash plus ''built-in (dsh plugin <version>)'', extend BuiltinToolingAssets with a provenanceMarker string, and append it to the description of every candidate in list() and every definition in get().'
      status: complete
    host-entry-version-wiring:
      text: In plugins/dsh-strict-spec/src/host.ts, read the plugin's own package.json beside dist once per apply and pass buildProvenanceMarker of its version into createBuiltinToolingProvider, so the marker names the version actually installed.
      status: complete
    readme-marker-note:
      text: 'Add one sentence to the built-in tooling section of plugins/dsh-strict-spec/README.md and README.zh.md: built-in catalog entries carry a trailing provenance marker naming the plugin and version, external entries carry none, so provenance is visible before loading a skill.'
      status: complete
    suite-marker-assertions:
      text: 'Extend test/suites/dsh-plugin-host.ts: fixture candidates and definitions carry the marker appended to the frontmatter description; every repository skill''s candidate description equals its declared description plus the marker and stays within the pinned host''s 500-character catalog limit; shipped bodies remain byte-identical; and negative probes cover a missing marker and an over-limit marked description.'
      status: complete
    rebuild-plugin-dist:
      text: Run bun install and bun run build inside plugins/dsh-strict-spec so dist reflects the edited sources, per the rebuild-after-source-edits standard, and confirm the CLI asset stays byte-identical to the repository build's CLI bundle.

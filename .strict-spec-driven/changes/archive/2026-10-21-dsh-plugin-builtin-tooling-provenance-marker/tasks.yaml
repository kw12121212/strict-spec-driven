    real-host-evidence:
      text: Re-run the isolated real-host probe with the marker expectations — every built-in catalog entry's description ends with the marker naming the installed plugin version, the external planted copy carries no marker, and the served fallback body still invokes the bundled CLI — and record the observed evidence as a design decision, per the manual-checks-record-observed-evidence standard.

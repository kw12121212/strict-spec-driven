schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: operations-domain-behavior
mapping:
  implementation:
    - src/maintenance.ts
    - src/cli/cmd-operations.ts
  tests:
    - test/suites/operations.ts
operations:
  ADDED: {}
  MODIFIED:
    operations-maintenance-contract:
      strength: MUST
      statement: The system MUST make maintenance run configured maintenance checks when present, report checksRun and findingsCount, seed a maintenance change only when findings exist and no active change is present, skip seeding with generatedChange null and an explicit skipped-seeding explanation when an active change exists, and return no generated change when no config or checks are configured.
      scenarios:
        maintenance-no-config-or-checks:
          - GIVEN: no maintenance config or no maintenance checks are configured
          - WHEN: strict-spec-driven maintenance runs
          - THEN: the command exits zero with checksRun 0, findingsCount 0, and generatedChange null
        maintenance-seeds-change-for-findings:
          - GIVEN: maintenance configuration has checks that produce roadmap drift findings and no active change exists under .strict-spec-driven/changes/
          - WHEN: strict-spec-driven maintenance runs
          - THEN: the command exits zero, reports findings, and creates a generated maintenance change under .strict-spec-driven/changes/
        maintenance-skips-seeding-when-active-change-exists:
          - GIVEN: maintenance checks produce findings while an active change already exists under .strict-spec-driven/changes/
          - WHEN: strict-spec-driven maintenance runs
          - THEN: the command exits zero, still reports checksRun and findingsCount, returns generatedChange null, and explains that seeding was skipped because an active change exists
  REMOVED: {}

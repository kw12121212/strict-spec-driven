schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: define-dev-session-artifact-contract
approach:
  - >-
    Add a dedicated dev-session artifact schema plus bundled registry, example, and scaffold assets,
    then wire shared validation and template-loading paths to recognize the new declaration without
    introducing lifecycle execution behavior in this change.
decisions:
  dev-session-contract-first:
    decision: >-
      Model dev-session support as a declaration contract and bundled assets before adding plan or
      lifecycle commands.
    rationale: >-
      Milestone 0012 sequences later plan, lifecycle, and browser-trial behavior on top of a stable
      contract, so keeping this change declaration-only reduces coupling and lets follow-on changes
      depend on one validated artifact shape.
alternatives: []
risks: []

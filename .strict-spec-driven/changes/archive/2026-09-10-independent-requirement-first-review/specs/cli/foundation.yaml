schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: cli-foundation
operations:
  ADDED:
    cli-review-independence-skill-content-validation:
      strength: MUST
      statement: The validate-skills command MUST reject a strict skill package for review or auto whose guidance omits the review-independence section, the planning artifacts and delta specs the requirement is reconstructed from, the rule that the reconstruction completes before any implementation file, diff, or test file is read, the duty to write down a numbered list of acceptance items during that reconstruction, the prohibition on deriving the requirement from the implementation, the outside-reviewer stance rule, the three verdict values satisfied, not satisfied, and unprovable from evidence, the duty to attach an implementation reference and a test reference to each verdict, the rule that a blanket claim of matching the proposal is not a substitute for per-item verdicts, or the rule that an unprovable verdict on a MUST-strength requirement is a MUST FIX finding that blocks the archive recommendation, reporting deterministic path-specific diagnostics that name the offending skill package and the missing element for each omission.
      scenarios:
        review-skill-missing-section-is-rejected:
          - GIVEN: a review-capable strict skill package whose guidance omits the review-independence section
          - WHEN: strict skill packaging validation runs
          - THEN: the command exits non-zero and a diagnostic names that skill package path and reports the missing review-independence section
        review-skill-missing-element-is-rejected:
          - GIVEN: a review-capable strict skill package that carries the review-independence section but omits the reconstruct-before-reading-implementation rule, the outside-reviewer stance rule, one of the three verdict values, the evidence-reference duty, or the archive-blocking rule for an unprovable MUST-strength requirement
          - WHEN: strict skill packaging validation runs
          - THEN: the command exits non-zero and one diagnostic per omission names the offending skill package path and the missing element
        aligned-review-skills-pass:
          - GIVEN: both review-capable strict skill packages document the review-independence section and every required element
          - WHEN: strict skill packaging validation runs
          - THEN: no review-independence diagnostic is reported and the existing skill content diagnostics are unchanged
  MODIFIED: {}
  REMOVED: {}

schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: independent-requirement-first-review
approach:
  - 'Split the review into two stances inside one agent and make the boundary between them a written artifact rather than an intention. A new ''## Review Independence'' section in strict-spec-review and strict-spec-auto defines stance one, requirement reconstruction, which reads only proposal.yaml, design.yaml, questions.yaml resolved answers, and the change''s delta specs, and writes down the problem, the expected observable outcome, the non-goals and unchanged behavior, and a numbered list of acceptance items - before any implementation file, diff, or test file is opened. Stance two then reads the changed files as an outside reviewer who did not write them, and answers each numbered acceptance item with one of three verdicts and its evidence. Writing the acceptance list before seeing the code is what makes the second stance falsifiable: the list cannot be quietly reshaped to match whatever the implementation happens to do.'
  - Make the verdict the unit of review output rather than the finding. Each acceptance item carries satisfied, not satisfied, or unprovable from evidence, plus a file:line implementation reference and a test reference, and the verdict table is reported before the MUST FIX, SHOULD FIX, and NITS groups. An unprovable verdict on a MUST-strength delta-spec requirement is a MUST FIX finding that blocks the archive recommendation; on any other acceptance item it is a SHOULD FIX finding. This is what turns 'no findings' from an assertion into a claim with per-item evidence attached, and it is what the operator reads to tell a real review from a rubber stamp.
  - Enforce the guidance the same way the parallel requirement-interrogation guidance is already enforced, rather than inventing a second mechanism. src/skills/model.ts gains REVIEW_INDEPENDENCE_SKILLS, REVIEW_INDEPENDENCE_HEADING, and REVIEW_INDEPENDENCE_SNIPPETS, and src/skills/content.ts gains validateReviewIndependenceGuidance, which normalizes whitespace before matching and emits one path-specific diagnostic per missing element. A cli-foundation delta-spec requirement states the behavior so the check is specified rather than incidental.
  - The bundled-skill per-skill line budget is raised rather than absorbed by compressing the guidance. strict-spec-auto measured 562 lines after gaining the review-independence section, two over the 560-line bound whose recorded basis is the largest measurement plus 45 lines of headroom. Trimming two lines of contract prose to sit under a threshold would be gaming the check rather than respecting it, so the bound is re-derived by the same formula against the new measurement.
decisions:
  reconstruct-before-reading-implementation:
    decision: The requirement reconstruction step is defined as reading only proposal.yaml, design.yaml, questions.yaml resolved answers, and the change's delta specs, and it completes - with the acceptance list written down - before any implementation file, diff, or test file is read. Deriving the requirement from the diff is explicitly prohibited.
    rationale: The rubber-stamp failure is not that the reviewer skips the requirement; it is that the requirement gets reconstructed from the implementation, so any implementation is self-consistent with it. Ordering the read is the only thing that makes the acceptance list independent of what was built, and an ordering that is not written down is not checkable.
  three-verdict-vocabulary:
    decision: Each acceptance item resolves to exactly one of satisfied, not satisfied, or unprovable from evidence, and a blanket statement that the implementation matches the proposal is explicitly not a substitute for per-item verdicts.
    rationale: Two verdicts force the reviewer to guess on items the evidence does not decide, and guessing under author bias resolves to satisfied. The third value gives the honest answer somewhere to go, which is what makes the other two mean something.
  unprovable-blocks-on-must-strength:
    decision: An unprovable-from-evidence verdict on a MUST-strength delta-spec requirement is a MUST FIX finding that blocks the archive recommendation until a test or an explicit human decision resolves it; the same verdict elsewhere is a SHOULD FIX finding that must be listed but does not block.
    rationale: Blocking on every unprovable item would stall the workflow on MAY-strength detail, and blocking on none would leave the honest verdict with no consequence, which reproduces the rubber stamp under a new label. MUST strength is the project's own declaration of what may not be taken on trust, so it is the natural line.
  acceptance-items-for-technical-only-changes:
    decision: When a change carries no delta spec, acceptance items are reconstructed from proposal summary.what, scope.in, unchanged_behavior, and the design decisions, so the verdict table is never empty; those items are treated as non-MUST strength for the blocking rule unless a delta spec says otherwise.
    rationale: Most changes in this repository are technical-only and would otherwise produce an empty verdict table, which would make the new stage a no-op exactly where review already runs loosest. Treating them as non-blocking keeps the hard gate tied to a strength the project explicitly declared.
  enforce-through-existing-validate-skills-check:
    decision: The guidance is enforced by a new validateReviewIndependenceGuidance check inside the existing validate-skills content validation, modeled directly on validateRequirementInterrogationGuidance, rather than by a new command, a new artifact, or a test-suite-only assertion.
    rationale: The repository has already established that per-skill guidance requirements live in src/skills/ and are proven through the shipped command; a suite-only assertion would leave the shipped validator blind, and a new command would add a surface the operator has to learn for a rule that belongs to skill packaging.
  archive-skill-left-unguarded:
    decision: strict-spec-archive is not modified, so the verdict gate applies only where strict-spec-review and strict-spec-auto recommend or perform archive; invoking /strict-spec-archive directly still archives without a verdict table.
    rationale: The requester set not touching other skills as an explicit non-goal, and widening the gate would put the same rule in a third place with no check that the three stay consistent. The gap is accepted and recorded rather than closed silently.
  raise-per-skill-line-budget-on-new-measurement:
    decision: Raise BUNDLED_SKILL_LINE_BUDGET_PER_SKILL in test/suites/entrypoint-and-skills.ts from 560 to 607, re-deriving it as the new largest measurement (strict-spec-auto at 562) plus the same 45-line headroom the previous bound recorded, and update the measurement comment to the new totals rather than leaving the stale ones in place.
    rationale: 'The budget''s own comment states that raising it is a deliberate decision carrying a new measurement rather than a silent drift upward, which is exactly this situation: the skill grew because a specified contract section was added to it, not through unmanaged sprawl. Compressing the section by two lines instead would leave the recorded formula describing a bound it no longer produces, and would make the threshold, rather than the reader, the author of the guidance.'
  explicit-governed-set-over-scan:
    decision: REVIEW_INDEPENDENCE_SKILLS is a hand-enumerated two-entry list rather than the scan that static-content-checks-prove-a-negative-case requires of a governed-file set. The deviation is recorded here as the justified exception that rule's enforcement allows, and it is bounded by a test asserting the list resolves entirely to packaged skills so a renamed or deleted skill fails rather than falling silently out of scope.
    rationale: 'The rule''s two clauses pull opposite ways for this check. Its first clause forbids deriving scope from content the same change inserts, and the only content that identifies a review-capable skill is the review-independence section this change writes: a scan would read what it put there, and deleting the section from a skill would drop that skill out of scope instead of failing it — the precise vacuity the rule exists to prevent. The scan clause targets a set that grows silently as skills are added; this set is defined by workflow role rather than by file discovery, has two members, and matches how REQUIREMENT_INTERROGATION_SKILLS already resolves the same conflict. The subset assertion covers the staleness direction a scan would have caught.'
alternatives:
  - option: Run the review in a freshly spawned subagent that receives only the planning artifacts and the diff, with no implementation-phase conversation context.
    reason: It removes author bias mechanically rather than by instruction, but it depends on a subagent capability the bundled skills cannot assume across harnesses, and the requester chose the same-agent stance change at proposal time.
  - option: State the independence guidance in the skills as prose without adding a validate-skills check.
    reason: Nothing would then detect the guidance being trimmed or drifting, which is precisely how the section would decay back to the current state; the repository's parallel requirement-interrogation guidance is enforced for that reason.
  - option: Persist the verdict table as a YAML review-record artifact under the change directory.
    reason: It would create a new artifact kind and a new CLI mutation surface, both named as non-goals, and the operator-visible benefit is already delivered by the table appearing in the report.
risks:
  - The check matches required snippets, so it proves the sentences are present, not that the reviewer obeyed them; a review can still carry the section and produce shallow verdicts. The verdict table and its evidence references are what make that visible to a human reader, and nothing enforces honesty.
  - Requiring a file:line reference per acceptance item lengthens every review report and makes review noticeably slower on changes with many requirements, which is a real cost accepted in exchange for the gate being checkable.
  - A snippet-removal probe can be defeated by a line-wrapped occurrence of the required phrase, because the shipped check collapses whitespace before matching; each probe must count occurrences in normalized text and the required phrases must be kept unwrapped in the skill files.
  - The new snippets are inserted into the same skills that other content checks scan, so a check deriving its scope from file content could read text this change inserted; scope for the new check is taken from an explicit skill list rather than from a content scan.

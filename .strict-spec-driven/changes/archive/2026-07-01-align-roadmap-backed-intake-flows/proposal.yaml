schema: strict-spec-driven/change-proposal/v1
schema_version: 1
artifact_type: change_proposal
schema_file: templates/strict-spec-driven/schemas/change-proposal.yaml
change:
  id: align-roadmap-backed-intake-flows
  status: proposed
summary:
  what:
    - Align roadmap-backed and ticket-promoted proposal guidance with the change-intake question gate.
  why:
    - Roadmap planned-change details and ticket provenance are valid evidence for the plain checklist and should prevent duplicate questions while still blocking implementation when important scope, mapping, spec, dependency, test, or technical-standard impact is missing.
scope:
  in:
    - Update strict-roadmap-recommend, strict-spec-propose-from-roadmap, strict-spec-auto roadmap-backed resume guidance, and strict-ticket-dispatch promotion guidance.
    - Add packaged-skill assertions for complete roadmap evidence, thin roadmap evidence, preferred_human_language question text, and no roadmap mutation outside existing roadmap workflows.
  out:
    - Do not restore or create a strict-roadmap-propose skill package.
    - Do not change roadmap-recommend candidate selection or CLI recommendation behavior.
    - Do not mutate roadmap planned-change files during strict change proposal creation except through existing roadmap workflows.
unchanged_behavior:
  - Roadmap recommendation continues to choose exactly one eligible planned change through the scripted roadmap-recommend command.
  - Open questions in questions.yaml.open continue to block implementation handoff.
roadmap:
  milestone: 0018-change-intake-question-gates
  planned_change: align-roadmap-backed-intake-flows

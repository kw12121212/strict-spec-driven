schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: add-team-metadata-to-planned-change-files
approach:
  - >-
    Extend the standalone planned-change artifact family with optional structured team metadata
    while preserving the existing low-conflict file layout and advisory ownership semantics. The
    change should keep metadata on each planned-change file, validate field shapes
    deterministically, and avoid promoting local YAML fields into hard locks or required workflow
    gates.
decisions:
  planned-change-team-metadata-is-optional:
    decision: >-
      Represent team coordination data as optional structured fields on standalone planned-change
      artifacts.
    rationale: >-
      Optional file-local metadata supports owner, reviewer, blocked-state, label, and
      external-reference workflows without increasing churn in milestone files or the roadmap index.
  ownership-is-advisory:
    decision: >-
      Treat owner and reviewer metadata as advisory coordination hints, not as exclusive claims or
      permission checks.
    rationale: >-
      The milestone guidance explicitly rejects local YAML metadata as a distributed lock because
      divergent Git branches can still edit the same work item.
alternatives: []
risks: []

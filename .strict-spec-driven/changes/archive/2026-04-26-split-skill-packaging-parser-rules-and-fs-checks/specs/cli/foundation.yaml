schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: cli-foundation
mapping:
  implementation:
    - src/skills.ts
    - src/skills/model.ts
    - src/skills/frontmatter.ts
    - src/skills/content.ts
    - src/skills/fs-checks.ts
    - src/skills/diagnostics.ts
  tests:
    - test/suites/entrypoint-and-skills.ts
operations:
  ADDED: []
  MODIFIED:
    - target_requirement: cli-skill-packaging-validation-smoke-coverage
      replacement:
        id: cli-skill-packaging-validation-smoke-coverage
        strength: MUST
        statement: >-
          The system MUST include automated checks that exercise strict skill packaging validation
          behavior for both passing and failing package states, with validation logic sourced from
          focused modules under `src/skills/` rather than a single monolithic file.
        scenarios: []
    - target_requirement: cli-domain-diagnostic-ordering-stability
      replacement:
        id: cli-domain-diagnostic-ordering-stability
        strength: MUST
        statement: >-
          The system MUST preserve deterministic ordering for roadmap, skill-validation, and
          migration diagnostics or report collections even when their implementation is distributed
          across focused modules under `src/skills/` and shared helpers in `src/diagnostics.ts`.
        scenarios: []
  REMOVED: []

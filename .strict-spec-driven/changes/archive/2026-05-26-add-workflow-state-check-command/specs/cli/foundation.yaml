schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: cli-foundation
mapping:
  implementation:
    - src/strict-spec-cli.ts
    - src/cli/usage.ts
    - src/cli/cmd-workflow.ts
  tests:
    - test/suites/entrypoint-and-skills.ts
    - test/suites/foundation-and-fixtures.ts
operations:
  ADDED:
    cli-workflow-state-check-command:
      strength: MUST
      statement: >-
        The system MUST provide a check-workflow-state subcommand that checks whether
        .strict-spec-driven/ exists as a directory in the current project root and reports the
        result deterministically without creating or validating workflow artifacts.
      scenarios:
        workflow-state-check-succeeds-when-directory-exists:
          - GIVEN: a repository contains a .strict-spec-driven/ directory
          - WHEN: strict-spec-driven check-workflow-state is executed from that repository root
          - THEN: the command exits with status 0
          - THEN: the command reports that strict workflow state exists
        workflow-state-check-fails-when-directory-is-missing:
          - GIVEN: a repository does not contain a .strict-spec-driven/ directory
          - WHEN: strict-spec-driven check-workflow-state is executed from that repository root
          - THEN: the command exits with a non-zero status
          - THEN: the command reports that strict workflow state is missing
          - THEN: the command directs the user to run /strict-spec-init
  MODIFIED: {}
  REMOVED: {}

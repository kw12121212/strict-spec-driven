    question: What CLI subcommand name should the maintenance command use?
    context: >-
      Existing strict subcommands use verb or verb-object naming; the milestone notes referenced
      `run-maintenance` but the pattern `maintenance` is more consistent with `ship`, `archive`.
    answer: '`maintenance` (confirmed by user)'
    status: resolved
  - id: which-configured-check-type-should-the-first-version-include
    question: Which configured check type should the first version include?
    context: >-
      Determines the maintenance config schema, the default template content, and what tests must
      cover.
    answer: '`roadmap-sync-check` only (confirmed by user)'
    status: resolved

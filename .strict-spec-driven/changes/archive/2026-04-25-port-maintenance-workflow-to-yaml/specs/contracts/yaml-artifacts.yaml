schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: contracts-yaml-artifacts
mapping:
  implementation:
    - skills/strict-spec-maintenance/SKILL.md
    - templates/strict-spec-driven/scaffold/config.yaml
    - src/skills.ts
  tests:
    - test/run.ts
operations:
  ADDED:
    - requirement:
        id: strict-maintenance-skill-command-contract
        strength: MUST
        statement: >-
          The system MUST provide a strict maintenance skill package for `maintenance` with an
          explicit command mapping that references `strict-spec-driven maintenance` as the primary
          command.
        scenarios:
          - id: maintenance-skill-exposes-concrete-strict-command
            steps:
              - kind: GIVEN
                text: the `strict-spec-maintenance/SKILL.md` file is reviewed
              - kind: WHEN
                text: its `## This Skill's Commands` section is inspected
              - kind: THEN
                text: >-
                  the command mapping identifies `node {{SKILL_DIR}}/scripts/strict-spec-driven.js
                  maintenance` as the primary maintenance command
              - kind: AND
                text: the command mapping is not limited to a generic placeholder command
    - requirement:
        id: strict-maintenance-config-section-contract
        strength: MUST
        statement: >-
          The system MUST allow `.strict-spec-driven/config.yaml` to include an optional
          `maintenance` section that lists configured checks, where each check entry exposes at
          minimum a structured `type` field.
        scenarios:
          - id: maintenance-config-section-is-optional-and-structured
            steps:
              - kind: GIVEN
                text: a `.strict-spec-driven/config.yaml` is reviewed
              - kind: WHEN
                text: the `maintenance` section is present
              - kind: THEN
                text: configured checks are available as a structured YAML sequence
              - kind: AND
                text: each check entry exposes a `type` field as structured data
          - id: absence-of-maintenance-section-does-not-invalidate-config
            steps:
              - kind: GIVEN
                text: a `.strict-spec-driven/config.yaml` has no `maintenance` section
              - kind: WHEN
                text: the config is validated
              - kind: THEN
                text: the config is considered valid
              - kind: AND
                text: maintenance behavior exits cleanly with zero checks run
    - requirement:
        id: strict-maintenance-skill-guidance-contract
        strength: MUST
        statement: >-
          The system MUST ensure the `strict-spec-maintenance` skill describes the `maintenance`
          subcommand as the entry point for seeding maintenance changes from configured checks, and
          describes `.strict-spec-driven/changes/` as the output location for generated maintenance
          changes.
        scenarios:
          - id: maintenance-skill-references-strict-maintenance-command-and-output
            steps:
              - kind: GIVEN
                text: the `strict-spec-maintenance/SKILL.md` skill prompt is reviewed
              - kind: WHEN
                text: its workflow guidance is inspected
              - kind: THEN
                text: the skill identifies the `maintenance` subcommand as the entry point
              - kind: AND
                text: >-
                  the skill describes `.strict-spec-driven/changes/` as the output location for
                  generated maintenance changes
  MODIFIED: []
  REMOVED: []

schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: remove-mapping-from-specs-and-schemas
approach:
  - Work top-down through the governing layer in one pass so no intermediate state has a requirement without a schema or a schema without a requirement. First settle the milestone intake questions as recorded decisions. Then express the spec removals as delta specs with explicit REMOVED and MODIFIED operations against cli-foundation and contracts-yaml-artifacts, and the rule removals as delta tech against workflow-scope-discipline and yaml-first-artifacts, so archive applies them atomically. Then remove the mapping property from the four bundled schemas through schema-edit and from the reference examples through sample-edit, regenerate the embedded template bundle, and strip the recorded mapping field from every live spec and standard through spec-edit and tech-edit. Cover the result with regression for schema validation, residual-field tolerance, and mapping-free scaffold output.
decisions:
  accept-and-ignore-residual-mapping:
    decision: Removing the mapping property from the main-spec, delta-spec, main-tech, and delta-tech schemas does not make a residual mapping field invalid. Validation accepts and ignores it, and any CLI write that rewrites the artifact strips it.
    rationale: The bundled schemas ship to external projects through init and migrate, and those projects hold specs and standards authored with mapping fields. Strict rejection would invalidate every such artifact on upgrade for no benefit, since the field is inert once nothing reads it. Acceptance plus strip-on-write makes the field disappear through normal use instead of through a forced migration. This is the roadmap intake recommendation for legacy-mapping-tolerance, adopted unchanged.
  requirements-removed-before-commands:
    decision: This change removes the requirements and rules that govern mapping, and leaves verify-spec-mappings, verify-tech-mappings, and the archive mapping union executable. The commands are deleted outright, without a deprecated no-op shim, in the following delete-mapping-commands-and-code change.
    rationale: 'The milestone sequences the governing layer first so the code deletion that follows has no orphaned contract to satisfy. Deleting outright rather than shimming is the roadmap intake recommendation for removal-versus-deprecation: a no-op shim that always reports success is a worse failure mode for external callers than an unknown-command diagnostic that names the removal, and a shim preserves the maintenance burden this milestone exists to remove.'
  delta-artifacts-carry-the-removals:
    decision: Spec and standard content changes are expressed as delta specs and delta tech under the change directory with REMOVED and MODIFIED operations, not as direct edits to live artifacts. Stripping the recorded top-level mapping field from live specs and standards is the one exception and runs through spec-edit and tech-edit, because that field is artifact metadata rather than keyed requirement content.
    rationale: Delta artifacts keep the requirement removals attributable to this change and let archive apply them atomically by stable identifier, which matters when touching two large specs where a careless edit could drop a neighboring requirement. The top-level mapping field has no delta operation that can remove it, so the artifact-aware edit commands are the correct owning surface under the CLI-only YAML authoring policy.
  no-coverage-threshold-change:
    decision: The declared coverage threshold of 78 is left unchanged by this change, and the coverage question is deferred to the change that actually deletes implementation code.
    rationale: This change deletes schema properties, requirements, rules, and artifact metadata, not measured src implementation. The roughly 750 lines of covered implementation that move the measured ratio are deleted in delete-mapping-commands-and-code, so that is where the coverage-threshold-after-removal intake question becomes answerable with a real measurement rather than a guess.
  mapping-becomes-a-deprecation-tombstone:
    decision: In each of the four schemas, mapping is removed from the required list and its structural sub-schema (object, additionalProperties false, required implementation/tests or implementation/enforcement, typed string arrays) is replaced by a bare permissive allowance carrying only a deprecation description. The key is accepted with any shape and never read; every other unknown key still fails.
    rationale: 'The strict YAML artifact schemas set additionalProperties: false at the top level and are evaluated by Ajv, so deleting the mapping property outright would turn a residual mapping field into a hard schema error — exactly the outcome accept-and-ignore-residual-mapping rejects. Widening additionalProperties to true would instead accept every typo and lose the strictness the whole artifact model depends on. A bare permissive tombstone is the only option that keeps unknown-key rejection intact while letting an external project''s existing specs and standards validate unchanged after upgrade, and it satisfies the milestone criterion in substance: the schema no longer defines a mapping contract, only tolerates a dead key.'
alternatives:
  - option: Delete the mapping capability in one change spanning requirements, schemas, commands, code, and skills.
    reason: The removal spans two large specs with more than one hundred referencing lines, five standards, four schemas, the embedded bundle, the examples, roughly 750 lines of implementation, and a packaged skill; a single change makes the delta specs unreviewable and gives a failed regression no smaller unit to bisect to.
  - option: Make a residual mapping field a hard validation error once the schemas drop the property.
    reason: It would invalidate the specs and standards of every external project on schema upgrade, turning a cleanup into a forced migration with no gain, since an ignored field costs nothing once no command reads it.
  - option: Rebuild mapping at requirement granularity instead of removing it.
    reason: This was evaluated during roadmap planning and rejected by the user as still not good enough to justify its cost, which is the decision that produced this milestone.
risks:
  - 'Removal is irreversible traceability loss: the recorded path evidence in the current mappings is gone, and a spec-to-code lookup wanted later must be rebuilt from nothing.'
  - Mapping is referenced across two large specs, so a REMOVED or MODIFIED operation that names the wrong identifier could drop a neighboring requirement or leave a dangling reference in another spec, standard, or skill.
  - Stripping mapping from every live spec and standard while verify-spec-mappings and verify-tech-mappings still run makes both commands report the whole repository as uncovered until the next planned change deletes them.
  - The embedded template bundle is generated from the templates tree; leaving it unregenerated would ship a schema that still declares mapping while the source schema does not.

change: remove-mapping-from-specs-and-schemas
open: []
resolved:
  - id: requirement-problem
    question: What is concretely going wrong today, and for whom?
    context: 'Why this is asked: the change is planned against a need, and the need lives only with the requester. A "problem" here means what someone does or suffers today — not a feature that is missing. If the answer names a button, a field, a page, or an endpoint, it is a solution, and the underlying problem is still unstated. What a sufficient answer contains: who is affected, what they do today instead, and how often. Worked example: "every Monday one person spends forty minutes copying order rows into a spreadsheet to send the weekly report". What it changes: this becomes the proposal''s why, and it decides whether the change is worth making.'
    answer: 'The spec and technical-standard mapping field is write-only bookkeeping. Propose, apply, and archive write it, and verify-spec-mappings and verify-tech-mappings audit it, but no CLI command or skill step reads a mapping to decide which code to open, which requirements a changed file threatens, or which tests to rerun. Its upkeep falls on maintainers of this repository: archive''s additive merge never removes an entry so every rename leaves permanent drift, a dedicated repair skill exists solely to fix that drift, a technical-standard rule was written to manage the rot, and cli/foundation.yaml maps 189 requirements onto one flat 87-file list that tells a reader nothing.'
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: requirement-trigger
    question: Why now — what forced this?
    context: 'Why this is asked: work that nothing forced is the work most often thrown away later. This question catches a request that sounds reasonable but has no real driver behind it. What a sufficient answer contains: the concrete event, deadline, incident, or cost that made this surface now, or an honest statement that nothing did. Worked example: "the report was missed last month and it was raised with the team". What it changes: a change with no trigger is a candidate for deferral, and the answer is weighed at review before archive.'
    answer: 'The user reviewed a requirement-level mapping rebuild that would have made the field genuinely useful, judged it still not worth its cost, and chose outright removal instead. That decision produced the remove-artifact-file-mappings milestone, and this planned change is its dependency root: delete-mapping-commands-and-code and purge-mapping-from-skills-and-prove-removal are both blocked until the governing requirements, rules, and schemas are gone.'
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: requirement-outcome
    question: What observable difference proves the problem is solved?
    context: 'Why this is asked: without a success condition, nobody can tell afterwards whether the change worked. "Observable" means someone outside the system can check it without reading the code. What a sufficient answer contains: what a person will see, or no longer have to do, once this is done. Worked example: "the report is in the manager''s inbox on Monday morning without anyone assembling it". What it changes: this becomes the delta spec''s scenarios and the acceptance evidence at review time.'
    answer: No main spec, delta spec, technical standard, or delta tech artifact in this repository carries a file mapping field; the bundled and embedded main-spec, delta-spec, main-tech, and delta-tech schemas no longer define one; the reference examples no longer demonstrate one; the four cli-verify-spec-mappings-* requirements, yaml-spec-file-mapping-model, relocated-mappings-declare-their-cleanup, and structured-fields-over-prose are gone; an external artifact that still carries a residual mapping field validates rather than failing; and the complete project regression passes with the coverage gate satisfied.
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: requirement-interpretation
    question: Which reading of the request is intended, where more than one is possible?
    context: 'Why this is asked: a short request usually admits several readings, and building the wrong one is indistinguishable from building nothing. What a sufficient answer contains: the reading that is meant, stated plainly enough to rule the others out — or a statement that only one reading exists and what it is. Worked example: "export means the version sent to the manager, not the one I read myself". What it changes: this fixes the scope boundary before any code is written, and settles disputes about what was asked for.'
    answer: 'Removal means deletion of the capability with nothing substituted, not replacement by a lighter traceability mechanism. It covers both spec mapping and technical-standard mapping. This change removes only the governing artifact layer: requirements, rules, schemas, reference examples, and the recorded mapping field on live specs and standards. The commands, implementation files, archive union, skill deletion, and ARCHITECTURE.md column removal are sequenced into the two following planned changes and are out of scope here.'
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: requirement-non-goals
    question: What must explicitly not change?
    context: 'Why this is asked: the requester knows which nearby behavior other people depend on, and the agent does not. A "non-goal" is something the change must leave alone even though it sits close to the work. What a sufficient answer contains: the behavior, setting, or output that must survive untouched, and who relies on it. Worked example: "do not change the saved filters — several people rely on their own". What it changes: these become the proposal''s unchanged_behavior items, which review checks the finished result against.'
    answer: 'The architecture artifact component mapping and its drift reporting stay, because ARCHITECTURE.md renders them and they therefore have a real reader. Every unrelated use of the word mapping is untouched: design-system, lesson, roadmap, and registry structures, migration role mappings, and skill command mappings. No replacement traceability mechanism is introduced. verify-spec-mappings and verify-tech-mappings remain executable through this change. The coverage threshold of 78 is not adjusted here.'
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: mapping-audits-fail-repo-wide-mid-milestone
    question: While verify-spec-mappings and verify-tech-mappings still exist, stripping the mapping field from every live spec and standard makes both commands report the entire repository as uncovered. Should this change accept those two commands failing until the next planned change deletes them, or must it also neutralize them here?
    context: 'Impact: this affects implementation files and the validation task list, not proposal scope or the spec delta. The design decision requirements-removed-before-commands deliberately leaves src/cli/spec-mapping.ts and src/cli/tech-mapping.ts executable in this change, but task strip-mapping-from-live-specs removes the data they audit, so both commands will report every spec and standard as missing coverage from the moment that task completes until delete-mapping-commands-and-code lands. Whether that is a blocking regression depends on whether either command runs inside the project regression command or any maintenance check. Recommendation: accept the temporary failure and do not neutralize the commands here, because neutralizing them means editing code this change declares out of scope, and the milestone already sequences their deletion next. Options: (a) accept the temporary failure, verifying first that neither command is invoked by bun scripts/coverage-gate.ts or by a configured maintenance check; (b) if either command is wired into the regression or maintenance path, move its deletion forward into this change and record the scope expansion through strict-spec-modify; (c) leave the live specs and standards untouched here and strip their mapping fields in the next change instead, which contradicts this planned change''s stated scope.'
    answer: 'Accept the temporary failure and do not neutralize the audit commands in this change. Evidence confirms the project regression is unaffected: verify-spec-mappings and verify-tech-mappings are exercised only against temp-dir fixtures created with mkdtempSync in test/suites/change-lifecycle.ts and test/suites/operations.ts, never against this repository''s live state, and neither command is invoked by bun scripts/coverage-gate.ts or by any configured maintenance check. The one real consequence is that the strict-spec-verify and strict-spec-auto step-8 live-repository verify-spec-mappings check will report the repository as uncovered from the moment the live mapping fields are stripped until delete-mapping-commands-and-code deletes both commands; that result is expected for this change and must not be treated as a blocker.'
    status: resolved
    answered_by: human
  - id: generate-flags-for-removed-mapping-property
    question: Once the delta-spec and delta-tech schemas no longer declare mapping, what should generate do with the existing --implementation, --test, --enforcement, and --remove-implementation/--remove-test flags?
    context: 'Impact: this affects implementation files, tests, and the CLI help surface. Task keep-generate-and-ready-consistent must decide between removing the flags outright, which is a CLI surface change that arguably belongs with delete-mapping-commands-and-code, and accepting them as no-ops, which contradicts the accept-and-ignore decision applying only to already-authored artifacts. The delta-spec mapping arguments are also named in the cli-propose-generation-uses-named-arguments requirement this change modifies. Recommendation: keep the flags accepted but stop writing a mapping property, and delete the flags together with the audit commands in the next change, so the CLI surface changes once rather than twice. Options: (a) accept and ignore the flags now, delete them next; (b) delete the flags in this change and expand the modified requirement accordingly; (c) reject the flags with a diagnostic naming the removal, which breaks any external caller mid-milestone.'
    answer: Keep --implementation, --test, --enforcement, --remove-implementation, and --remove-test parsing and exiting zero, but stop the delta-spec and delta-tech normalizers from copying a mapping property into the generated artifact. The flags are deleted together with the audit commands in delete-mapping-commands-and-code, so the CLI surface changes once rather than twice and no external caller breaks mid-milestone. This matches the accept-and-ignore-residual-mapping decision already recorded in design.yaml.
    status: resolved
    answered_by: human

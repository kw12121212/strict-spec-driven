schema_version: 1
artifact_type: delta_tech
schema_file: templates/strict-spec-driven/schemas/delta-tech.yaml
target_standard: cli-command-metadata
operations:
  ADDED: {}
  MODIFIED:
    guidance-names-only-packaged-skills:
      strength: MUST
      statement: Guidance that ships to an agent or operator MUST NOT name a skill package that does not exist under skills/. In the routing surfaces — bundled skills and operator documentation — the reference MUST be recognized whether it is written as a slash command, a backticked name, or a bare prose mention, because all three read to the reader as a command they can type. In source files the prefixed forms are the governed ones, since a comment naming a deleted skill while explaining that it was deleted states a fact rather than routing anyone. The bundled-skill portion of that scope MUST be enforced by the shipped skill validation command so a consuming project observes the failure, and the wider scope of operator documentation and source MUST additionally be scanned by an automated check that fails naming both the offending file and the missing skill. Text whose purpose is to state that a name is retired — a removal sweep test, or a marked retirement section of an upgrade note — MUST be placed outside the scanned scope rather than excused inside it, and the banned name MUST NOT be added to the check's allowlist, because an allowlist entry is global and silences the real routing reference as well as the fixture.
      rationale: 'A skill name that resolves to nothing fails no check on its own: the slash command is simply missing when someone types it, so the reference rots silently. Enforcing it only from this repository''s regression suite leaves every consuming project unprotected, which is the same gap the preferred-human-language guidance was in, and it conflicts with policy-enforcement-proven-through-shipped-entry-point, which states that a module-level scan is supporting evidence only for a policy that blocks a class of authored guidance. Requiring the bare-mention form in the routing surfaces closes the second half of the gap, and confining it there keeps the rule aimed at misdirection rather than at prose: the same sentence that would mislead a reader inside a skill is ordinary technical commentary inside a source comment. The retirement carve-out is a scope rule rather than an allowlist for the same reason the rule already prefers scope: it is placed deliberately, reaches only to the next heading, and cannot silence the name anywhere else in the document.'
      enforcement:
        method: test
        detail: The shipped skill validation command derives the valid skill-name set from the package directories it already discovers under skills/ and reports one diagnostic per reference to a name absent from that set, carrying the SKILL.md path, the reference line, and the missing name; a committed negative fixture package under test/fixtures/guidance-skills/ is driven through that shipped command, alongside the seeded bundled set, and observed to exit non-zero, with the paired control run attributing the failure to the one offending line. A regression test additionally walks skills/, root-level operator documentation, and src/ with the matcher form each surface declares, proves both forms fire on synthetic input assembled at runtime before trusting a clean scan, asserts the source form still matches a diagnostic string that routes a reader, proves the retirement marker silences its own section and nothing past the next heading, and asserts that no allowlist entry has outlived the reference that earned it.
      examples:
        good:
          - skills/strict-roadmap-plan/SKILL.md routing a reader to `/strict-roadmap-transition` with the `reorder` operation, a skill package that exists under skills/.
        bad:
          - A bundled skill sentence naming strict-roadmap-reorder without a backtick or slash, which reads to an operator as a live slash command while no such package exists.
      exceptions:
        - Source comments that name a deleted skill while stating that it was deleted, test suites that assert a deleted skill's absence, marked retirement sections of operator upgrade notes, and .strict-spec-driven/ workflow state recording which skills existed when a change was archived, all name retired skills as statements of fact rather than routing instructions.
    skill-guidance-states-each-shared-instruction-once:
      strength: MUST
      statement: 'An instruction that every bundled skill must carry MUST appear at most once per skill file and MUST NOT be restated in a second section of the same file, whichever two sections those are; when one of the copies is the section a shipped check reads, that copy is the one retained and the other MUST be removed rather than shortened, and an automated check MUST fail naming the offending skill when a skill restates it. The rule constrains repetition, not placement: a skill stating the instruction in exactly one section complies regardless of which section that is, and the section that declares the skill''s commands is a reference rather than a statement.'
      rationale: 'A second copy of an instruction in the same file is not redundancy that costs only lines: it is a copy no check reads, which is the state the workflow-state precondition was in across 35 of 37 skills while validateStrictWorkflowStateGuidance enforced only the Steps form. An unenforced copy can drift from the enforced one without failing anything, and a reader who trusts the wrong copy gets the stale instruction, the same failure mode that left strict-spec-bugfix pointing at a skill that does not exist. Keying the check to one section name reproduces the defect one level up: it enforces a narrower rule than the one recorded, so a duplicate between any other pair of sections is exactly as invisible as the original duplicate was.'
      enforcement:
        method: test
        detail: src/skills/content.ts splits a skill file into its level-two sections, excludes the declared commands block, and reports one diagnostic per shared instruction stated in more than one of the remaining sections, matching on the distinctive prose of the instruction rather than on a command name that the governed text also references for unrelated reasons; test/suites/entrypoint-and-skills.ts drives the shipped validate-skills command through a committed negative fixture that restates the instruction outside Prerequisites and observes the failure naming the offending skill path, through a positive fixture carrying a skill-specific precondition that must pass, and through the existing policy fixtures to confirm each still reports its seeded violation and nothing else.
  REMOVED: {}

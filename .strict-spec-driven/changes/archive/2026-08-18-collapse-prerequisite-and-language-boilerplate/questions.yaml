change: collapse-prerequisite-and-language-boilerplate
open: []
resolved:
  - id: requirement-problem
    question: What is concretely going wrong today, and for whom?
    context: 'Why this is asked: the change is planned against a need, and the need lives only with the requester. A "problem" here means what someone does or suffers today — not a feature that is missing. If the answer names a button, a field, a page, or an endpoint, it is a solution, and the underlying problem is still unstated. What a sufficient answer contains: who is affected, what they do today instead, and how often. Worked example: "every Monday one person spends forty minutes copying order rows into a spreadsheet to send the weekly report". What it changes: this becomes the proposal''s why, and it decides whether the change is worth making.'
    answer: 'Bundled skill text is 29 percent duplicated guidance, and these two sections are 606 lines of it across 37 skills: 262 for Prerequisites and 344 for Preferred Human Language. The concrete failure is not the line count but that the duplication is unenforced. 35 of the 37 skills state the strict workflow state check twice in one file, under ## Prerequisites and again as the first ## Steps line, and validateStrictWorkflowStateGuidance in src/skills/content.ts reads only the Steps form, so the Prerequisites copy can drift without failing anything. The Preferred Human Language paragraph has the mirror-image defect: the cli-foundation scenario every-skill-names-file-and-field claims skill packaging validation inspects each SKILL.md for it, but the only check is a test assertion in this repository''s suite, so an external project running validate-skills gets no check at all. This hurts the agent reading a skill, who may act on the stale copy, and the maintainer, who has no signal when the copies diverge.'
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: requirement-outcome
    question: What observable difference proves the problem is solved?
    context: 'Why this is asked: without a success condition, nobody can tell afterwards whether the change worked. "Observable" means someone outside the system can check it without reading the code. What a sufficient answer contains: what a person will see, or no longer have to do, once this is done. Worked example: "the report is in the manager''s inbox on Monday morning without anyone assembling it". What it changes: this becomes the delta spec''s scenarios and the acceptance evidence at review time.'
    answer: Three observable differences. First, no bundled skill states the strict workflow state precondition twice, and validate-skills fails naming the offending skill path if one does. Second, every bundled skill's Preferred Human Language guidance is one sentence, and validate-skills — not a repository test — fails naming the offending skill and the missing element when any of its four required elements is absent. Third, the measured line total of skills/*/SKILL.md drops by the collapsed sections while validate-skills still reports skillCount 37, marketplaceCount 37, and zero diagnostics, so the reduction is attributable to the collapse and not to any deleted skill. Each new check is proven by a negative case in which the text is removed or reintroduced and the shipped command is observed to fail.
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: requirement-trigger
    question: Why now — what forced this?
    context: 'Why this is asked: work that nothing forced is the work most often thrown away later. This question catches a request that sounds reasonable but has no real driver behind it. What a sufficient answer contains: the concrete event, deadline, incident, or cost that made this surface now, or an honest statement that nothing did. Worked example: "the report was missed last month and it was raised with the team". What it changes: a change with no trigger is a candidate for deferral, and the answer is weighed at review before archive.'
    answer: 'The roadmap forced the sequencing. This is the only eligible planned change in the skill-surface-consolidation milestone: 22 candidates are archived and the remaining one, remove-merged-roadmap-skills-and-prove-reduction, is skipped with dependency-incomplete because it depends on this collapse. Its own dependency, replace-inlined-protocol-with-cli-pointer, is archived, so the rewritten section layout this change edits is already in place and the two edits no longer conflict over it. If nothing is done, the milestone stalls: the final planned change must report bundled skill text under skills/ below 5600 lines, and that target is not reachable while these 606 lines stand.'
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: requirement-non-goals
    question: What must explicitly not change?
    context: 'Why this is asked: the requester knows which nearby behavior other people depend on, and the agent does not. A "non-goal" is something the change must leave alone even though it sits close to the work. What a sufficient answer contains: the behavior, setting, or output that must survive untouched, and who relies on it. Worked example: "do not change the saved filters — several people rely on their own". What it changes: these become the proposal''s unchanged_behavior items, which review checks the finished result against.'
    answer: No skill is deleted and no marketplace entry changes; validate-skills must still report skillCount 37 and marketplaceCount 37, because the skillCount 28 target belongs to remove-merged-roadmap-skills-and-prove-reduction and is sequenced after this change so the two reductions can be measured separately. The This Skill's Commands lookup block stays intact in every skill. The CLI-Only YAML Authoring Protocol pointer section, installed by the archived replace-inlined-protocol-with-cli-pointer change, is not touched. No CLI command name, argument, or behavior changes, including making check-workflow-state report preferred_human_language. isMutationCapableSkill must classify the same set of skills before and after. Every non-init strict skill must still satisfy validateStrictWorkflowStateGuidance, and every skill must still carry all four preferred_human_language elements — the guidance is relocated and shortened, never weakened.
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: requirement-interpretation
    question: Which reading of the request is intended, where more than one is possible?
    context: 'Why this is asked: a short request usually admits several readings, and building the wrong one is indistinguishable from building nothing. What a sufficient answer contains: the reading that is meant, stated plainly enough to rule the others out — or a statement that only one reading exists and what it is. Worked example: "export means the version sent to the manager, not the one I read myself". What it changes: this fixes the scope boundary before any code is written, and settles disputes about what was asked for.'
    answer: 'Delete the section where it is only a restatement. In the 33 skills whose ## Prerequisites section contains nothing but the workflow-state check, the section is removed outright and the ## Steps opening line — the copy validateStrictWorkflowStateGuidance already enforces and the one an agent reads first — becomes the single statement. A one-sentence ## Prerequisites section is retained only in the four skills carrying a genuine skill-specific precondition: strict-spec-ship (the change must already be archived), strict-spec-migrate (legacy .spec-driven/ must exist as input), strict-spec-init (the target project directory must exist), and strict-spec-maintenance (config.yaml needs a maintenance section). Shortening rather than deleting was rejected because it saves at most two lines per skill while leaving the same instruction stated twice in one file, preserving exactly the drift surface this milestone exists to close. Deleting from all 37 was rejected because it buries the four real preconditions in prose rather than under a heading.'
    status: resolved
    kind: requirement
    answered_by: human
  - id: prerequisite-collapse-shape
    question: 'Where a skill''s ## Prerequisites section only restates the strict workflow state check, should the section be deleted outright, or reduced to a one-sentence section that is kept?'
    context: 'The planned change asks for a single enforceable sentence per skill, but 35 of the 37 skills already carry that exact sentence as the first line of their ## Steps section, and validateStrictWorkflowStateGuidance in src/skills/content.ts enforces only the Steps form. Impact: this decides implementation files, because deletion removes roughly 190 lines across 33 skills while a kept one-sentence section saves at most 2 lines each and leaves the same instruction stated twice in one file. It also decides the shape of the new validate-skills check and of the synthetic skill fixtures in test/suites/entrypoint-and-skills.ts and test/suites/roadmap-and-migration.ts, and it decides whether the delta spec requires the workflow-state precondition to be stated exactly once or merely at least once. It does not affect the Preferred Human Language collapse. Recommendation: delete outright where the section is only a restatement, retaining a one-sentence ## Prerequisites section only in strict-spec-init, strict-spec-migrate, strict-spec-ship, and strict-spec-maintenance, which carry a genuine skill-specific precondition. Option B is to keep a one-sentence section in every skill, which preserves the visual uniformity of the skill layout at the cost of leaving the duplication the milestone exists to remove.'
    answer: 'Delete the section where it is only a restatement. In the 33 skills whose ## Prerequisites section contains nothing but the workflow-state check, the section is removed outright and the ## Steps opening line — the copy validateStrictWorkflowStateGuidance already enforces and the one an agent reads first — becomes the single statement. A one-sentence ## Prerequisites section is retained only in the four skills carrying a genuine skill-specific precondition: strict-spec-ship (the change must already be archived), strict-spec-migrate (legacy .spec-driven/ must exist as input), strict-spec-init (the target project directory must exist), and strict-spec-maintenance (config.yaml needs a maintenance section). Shortening rather than deleting was rejected because it saves at most two lines per skill while leaving the same instruction stated twice in one file, preserving exactly the drift surface this milestone exists to close. Deleting from all 37 was rejected because it buries the four real preconditions in prose rather than under a heading.'
    status: resolved
    answered_by: human

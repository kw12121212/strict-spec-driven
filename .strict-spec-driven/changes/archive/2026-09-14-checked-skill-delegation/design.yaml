schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: checked-skill-delegation
approach:
  - 'The blocker is contractual, not technical. Twelve MUST requirements bind strict-spec-auto''s guidance content and validate-skills declares 24 required snippets and three required headings for auto, so a measurement of duplicated prose overstates what can be removed: only the Spec and Technical Artifact Routing section, about 279 tokens, is delegatable without amending a requirement. The approach therefore amends the pinning requirements first, changing them from ''auto MUST state X'' to ''auto MUST state X, or declare a delegation to the skill that owns X'', and pairs that amendment with a new validate-skills check that resolves each declared delegation and fails when the target skill does not carry the delegated content. Enforcement moves from the inline copy to the delegation edge; it is not withdrawn.'
  - auto's remaining body splits into three kinds, and each is handled differently. Verbatim duplication - the generate tasks CLI usage block in Steps step 3 and the gitignore hygiene block in step 7 - is deleted and delegated, because the two texts are already identical and no behavior can be lost. Semantically diverged duplication - steps 4, 5, 6, 8, 9, 10, 11, 12, and 13, which share zero normalized lines with their owning skills despite covering the same procedure - is deleted only per item and only after the owning skill is shown to cover that item. auto-only content - resetting context from targeted files, resuming a populated scaffold without regenerating artifacts, and carrying roadmap planned-change provenance forward - is retained, because no owning skill carries it at all.
  - The delegation is written in harness-neutral prose that names the owning skill and states that its procedure is authoritative, without prescribing an invocation mechanism, because the project targets claude-code, codex, opencode, and copilot through mcp-install and only one of those has a skill-invocation tool. The existing MUST rule guidance-names-only-packaged-skills already recognizes a bare prose mention as a governed reference and already fails when the named skill is absent from skills/, so this form is an existing checked surface rather than a new unchecked one.
  - 'Equivalence audit result, run against the real required-element lists in src/skills/model.ts rather than against paraphrases. Requirement Interrogation: all 11 required elements are present in strict-spec-propose, so the section is fully delegatable. Review Independence: all 9 required elements are present in strict-spec-review, so the section is fully delegatable. The diverged Steps are all covered by their owners: steps 4, 5, and 6 by strict-spec-apply including the positional-apply rule, step 8 by strict-spec-verify, steps 9, 10, and 11 by strict-spec-review including the coverage-gate statement, and steps 12 and 13 by strict-spec-archive. No diverged step required retention for lack of owner coverage.'
  - 'Four pieces of auto content are carried by no owning skill and are retained as increments: resetting context from targeted files, resuming an existing populated scaffold without regenerating planning artifacts, the rule that a prior Testing command satisfies the archive gate only when it exactly matches the configured complete regression command, and the strict-spec-ship recommendation. Three further auto obligations are covered by an owner but are pinned by requirements this change does not amend, so they also stay inline: the proposal-checkpoint elements, the shared schema cache lookups in YAML Writing Rules, and the Harness Guidance heading. The projected result is roughly 5500 tokens, about 43 percent below the current 9783.'
decisions:
  delegate-to-propose-not-brainstorm:
    decision: auto's proposal phase delegates to strict-spec-propose, not strict-spec-brainstorm.
    rationale: brainstorm's Rules forbid scaffolding until the user explicitly confirms the summary and change name, which would import an interactive gate auto is designed not to have. propose's Rules state the opposite - 'Do not pause for user confirmation or question resolution during proposal' - so propose is the non-interactive scaffolder that already matches auto's needs.
  conserve-force-by-checking-the-target:
    decision: Every amended requirement gains a delegation alternative only together with a validate-skills check that the delegation target carries the delegated content.
    rationale: 'Without the target check the amendment would be a genuine relaxation: a skill could declare a delegation to a skill that does not carry the content and pass validation while the guidance is lost. Checking the edge keeps the number of enforced statements the same and only moves where the statement lives.'
  retain-rather-than-merge-on-audit-miss:
    decision: When the equivalence audit finds auto states a requirement its owning skill does not, that item is retained in auto; it is never merged into the owning skill.
    rationale: Merging it into the owner would change what the owner enforces when invoked directly, which the proposal lists as out of scope and which the requester set as a non-goal. Retention costs size but keeps every skill's standalone behavior byte-identical, and size is the negotiable axis here while behavior is not.
  scope-rule-to-delegating-skills:
    decision: The new technical rule governs only a skill that delegates a lifecycle phase, forbidding it from also restating that phase's procedure; it does not govern skills that own and state a procedure.
    rationale: 'Six skills currently carry shared procedure sections: auto with five, brainstorm, propose, and bugfix with three each, review with two, and roadmap-recommend with one. A rule phrased as ''a skill must not restate shared procedure'' would make the five owners violations at introduction and force either merging entry points or rewriting them, both of which are out of scope. Narrowing the subject to the delegating skill makes auto the only governed instance.'
  measure-duplication-by-normalized-line:
    decision: Duplication between auto and an owning skill is measured on whitespace-normalized lines, not on sentences.
    rationale: A sentence-splitting measurement reported step 3 as 10 of 41 duplicated and missed that its generate tasks block is verbatim shared with propose, brainstorm, and bugfix, because that block is a bullet list whose items carry no sentence-ending punctuation. The normalized-line measurement found 34 of 86 duplicated in the same step. The checker that ships must use the same normalization the measurement used.
  delegation-checks-the-owner-contract-not-the-literal:
    decision: The delegation-target check confirms the owning skill satisfies its own required-content expectations for the delegated obligation, rather than confirming the owning skill contains the delegating skill's literal string.
    rationale: 'The audit found the two skills state the same archive obligation in different grammatical person: auto carries ''explicitly classify the pattern as not reusable'' while strict-spec-archive carries ''explicitly classifies the pattern as not reusable''. A literal-containment check would reject that delegation even though the obligation is fully covered, and forcing the two wordings to converge would edit an owning skill, which the proposal excludes. Checking the owner against its own registry entry is also the only form that stays correct when an owner rewords its guidance later.'
  audit-probes-use-the-registry-strings:
    decision: The equivalence audit compares against the snippet strings declared in src/skills/model.ts, not against paraphrases written for the audit.
    rationale: 'Two audit probes written by hand produced false gaps: one for ''Reconstruct first'', which is auto prose rather than a required element, and one for the positional-apply rule, which the probe missed only because it dropped the backticks the registry string carries. Both would have caused content to be retained for no reason. The registry is the same source the shipped check reads, so using it removes the class of error rather than one instance.'
alternatives:
  - option: Merge brainstorm, propose, and bugfix into one parameterized change-intake skill, following the precedent that merged eight roadmap skills into strict-roadmap-transition.
    reason: It attacks cumulative duplication rather than per-invocation context. Only one skill body loads per invocation, so the merged skill would be larger than any of the three it replaces and would make the stated problem worse, and it also breaks the requester's non-goal of keeping the entry-point count.
  - option: Move the shared conditional sections into new on-demand CLI commands, following the yaml-authoring-protocol precedent.
    reason: The precedent only pays when the moved content is conditional. Requirement Interrogation runs on every path that starts from a human request, so rendering it from a command still lands the same text in context and saves nothing against the stated problem.
  - option: Add a SKILL.md size budget enforced by validate-skills.
    reason: A MUST budget makes every skill already over it a violation at introduction, and seven skills currently exceed any threshold that would bind auto, so the rule would force compressing all seven inside this change. The lesson promoting-a-repeated-fix-to-a-must-rule-makes-every-existing-instance-a-violation records this outcome three times in this repository.
  - option: Compress auto's prose without delegating, leaving every contract untouched.
    reason: It reaches roughly minus 27 percent and leaves the diverged copies in place, so the drift that produced four uncoordinated wordings of the same intake gate survives and the requester's stated goal of functional consistency is not met.
risks:
  - The equivalence audit is the load-bearing step and it is judgement work, not a measurement. Steps 4, 5, 6, 8, 9, 10, 11, 12, and 13 share zero normalized lines with their owning skills, so each item must be read on both sides and matched by meaning. A missed item silently removes an auto requirement, and the failure is invisible to validate-skills because the delegation itself will still resolve.
  - Amending five MUST requirements that were each added deliberately to force auto to carry its gates standalone. If the delegation-target check is weaker than the inline requirement in any case not anticipated here, the amendment relaxes the contract rather than relocating it.
  - The new validate-skills check is a static content check over text this change also edits, so it can pass vacuously. The tech rule static-content-checks-prove-a-negative-case requires a negative case that removes the content and observes the failure, and the lesson a-snippet-removal-probe-is-defeated-by-a-line-wrapped-occurrence requires counting occurrences in normalized text, because a literal removal probe cannot reach a phrase the author line-wrapped.
  - The four committed fixtures under test/fixtures/policy-skills/ assert their seeded violation and nothing else. Two prior changes introduced a per-skill check and put those fixtures in violation. They do not delegate, so the narrow rule should not reach them, but that must be verified rather than assumed.
  - The size outcome is an audit result, not a commitment. Verbatim duplication accounts for roughly 2600 tokens and semantically diverged content for roughly 2300 more, so the result lands between minus 27 percent and minus 50 percent depending on how much the owning skills actually cover.
  - 'The change''s trigger is weak: the requester reported no forcing event, only available time. If the audit proves more expensive than estimated, there is no external deadline justifying pushing through it rather than reducing scope.'
  - The audit found full owner coverage for every diverged step, which is a stronger result than the proposal assumed and therefore deserves more scepticism, not less. Coverage was established by presence of the owner's required elements; an obligation auto states that its owner never declared as a required element would not appear as a gap in this method. The review stage must re-derive the acceptance items from the planning artifacts rather than from this audit.

schema: strict-spec-driven/change-proposal/v1
schema_version: 1
artifact_type: change_proposal
schema_file: templates/strict-spec-driven/schemas/change-proposal.yaml
change:
  id: archive-current-change-tech-sync
  status: proposed
summary:
  what:
    - Require archive workflow guidance to run a current-change-scoped technical-standard synchronization before moving an active strict change into archive, capture confirmed reusable convention gaps as delta-tech in that same change, and revalidate affected evidence before archive continues.
  why:
    - The existing review reflection is explicitly non-blocking and allows deferral to a later standalone tech sync, so a change can be archived while reusable engineering conventions introduced by that change remain absent from the strict technical standards and its historical delta-tech record.
scope:
  in:
    - Add an archive-time current-change tech-sync checkpoint to strict-spec-archive, strict-spec-auto, strict-spec-review handoff guidance, and the strict archive MCP prompt.
    - Extend strict-tech-sync with an active-change mode that scopes evidence to the selected change and writes confirmed standard changes as delta-tech under the active change instead of editing live standards.
    - Strengthen skill packaging expectations and regression tests for the mandatory checkpoint, current-change scope, confirmation boundary, delta-tech routing, and post-edit verification and regression reruns.
    - Modify the cli-foundation workflow contract to replace post-archive deferral with a final pre-archive synchronization gate.
  out:
    - Do not add an AI-judgment receipt, new artifact schema, or hard current-change-tech-sync precondition to the raw strict-spec-cli archive command.
    - Do not change deterministic archive merge mechanics in src/archive.ts, perform a repository-wide drift scan during archive, or directly edit live technical standards while a change is active.
    - Do not capture implementation patterns that the operator explicitly classifies as non-reusable engineering standards.
unchanged_behavior:
  - strict-spec-cli archive remains the sole deterministic mechanism that verifies the active change, merges delta specs and delta tech, regenerates indexes, reconciles roadmap state, and moves the change directory.
  - Standalone repository-wide strict-tech-sync continues to require confirmation before directly editing live technical standards when no active-change synchronization mode is selected.
  - The earlier review reflection remains useful for early discovery, and archive proceeds without extra edits when the final scoped scan finds no uncaptured reusable convention or existing delta-tech already covers it.
  - An operator may explicitly classify a surfaced pattern as not reusable and continue, but may not defer a confirmed reusable convention until after the change is archived.

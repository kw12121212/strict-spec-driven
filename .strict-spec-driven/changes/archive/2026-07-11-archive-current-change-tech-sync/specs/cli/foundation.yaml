schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: cli-foundation
mapping:
  implementation:
    - skills/strict-spec-archive/SKILL.md
    - skills/strict-spec-auto/SKILL.md
    - skills/strict-spec-review/SKILL.md
    - skills/strict-tech-sync/SKILL.md
    - src/mcp/prompts.ts
    - src/skills/model.ts
  tests:
    - test/suites/entrypoint-and-skills.ts
    - test/suites/mcp-server.ts
operations:
  ADDED:
    cli-tech-sync-supports-active-change-mode:
      strength: MUST
      statement: The system MUST require strict-tech-sync guidance to support an active-change mode that scopes evidence to the selected change artifacts, structured mappings, attributable tracked and untracked files, and applicable technical standards; requires explicit operator confirmation of normative rule content and strength; writes confirmed changes as delta-tech under the active change; and preserves direct live-standard editing only for standalone synchronization outside that mode.
      scenarios:
        active-change-sync-uses-bounded-evidence:
          - GIVEN: an active strict change is selected for current-change tech sync
          - WHEN: the AI determines the scan scope
          - THEN: the scope is derived from that change's planning artifacts, delta artifacts, structured mappings, task evidence, attributable repository changes, and applicable standards without absorbing unrelated repository drift
        active-change-sync-routes-through-delta-tech:
          - GIVEN: the bounded scan finds a reusable convention gap and the operator confirms its target standard, rule content, strength, rationale, enforcement, and mappings
          - WHEN: the synchronization applies the confirmed finding
          - THEN: the finding is generated or updated as delta-tech under the selected active change and no live main tech standard is directly edited
        standalone-sync-keeps-live-edit-mode:
          - GIVEN: strict-tech-sync is run as standalone repository or component maintenance rather than for an active change archive
          - WHEN: the operator confirms the proposed standard edits
          - THEN: the existing direct live-standard synchronization behavior remains available
    cli-archive-runs-current-change-tech-sync:
      strength: MUST
      statement: The system MUST require every supported AI-guided strict change archive surface, including strict-spec-archive, strict-spec-auto, and the strict archive MCP prompt, to complete a final current-change-scoped tech sync before invoking the raw archive command; continue immediately when existing standards and delta-tech cover the change; pause unresolved reusable convention findings for confirmed delta-tech capture or explicit non-reusable classification; forbid post-archive deferral of a convention confirmed as reusable; and rerun strict verification, delta-tech review, and invalidated complete regression evidence after archive-time delta-tech edits.
      scenarios:
        archive-continues-when-tech-state-is-covered:
          - GIVEN: a verified active change reaches final AI-guided archive preparation and its bounded scan finds no uncaptured reusable convention or confirms that existing delta-tech already covers each finding
          - WHEN: the current-change tech sync checkpoint completes
          - THEN: archive preparation continues without creating unnecessary tech artifacts
        archive-pauses-for-reusable-convention-gap:
          - GIVEN: the final bounded scan finds a possible reusable convention absent from the applicable main standards and current delta-tech
          - WHEN: archive preparation evaluates the finding
          - THEN: archive does not invoke strict-spec-cli archive until the operator confirms delta-tech capture or explicitly classifies the pattern as not reusable
          - AND: a convention the operator confirms as reusable cannot be deferred until after archive
        archive-revalidates-after-delta-tech-capture:
          - GIVEN: the operator confirms a reusable convention and archive preparation generates or updates current-change delta-tech
          - WHEN: the active change artifacts have changed
          - THEN: strict verification and delta-tech review are rerun and any complete regression evidence invalidated by the edit is rerun before archive
        raw-archive-remains-deterministic-merge-primitive:
          - GIVEN: the final sync checkpoint is complete under an AI-guided archive surface
          - WHEN: that surface invokes strict-spec-cli archive for the selected change
          - THEN: the raw command retains its deterministic verification, delta merge, index regeneration, roadmap reconciliation, and change-move responsibilities without requiring an AI sync receipt
  MODIFIED:
    cli-review-surfaces-uncaptured-tech-conventions:
      strength: MUST
      statement: The system MUST require strict review workflow guidance in both strict-spec-review and strict-spec-auto to perform an early non-blocking reflection on whether the reviewed change established a reusable engineering convention absent from .strict-spec-driven/tech/, offer immediate delta-tech capture or deferral only to the mandatory final current-change tech sync before archive, and prevent a convention confirmed as reusable from being deferred until after the change is archived.
      scenarios:
        review-prompts-early-tech-convention-reflection:
          - GIVEN: a completed strict change has passed strict verification and enters standalone or automatic review guidance
          - WHEN: the AI reviews the changed implementation, tests, strict artifacts, and applicable technical standards
          - THEN: the guidance requires an early reflection on uncaptured reusable engineering conventions and offers current-change delta-tech capture before archive
        review-deferral-reaches-final-archive-gate:
          - GIVEN: the review reflection surfaces a possible reusable convention that is not captured during review
          - WHEN: review otherwise completes successfully
          - THEN: review may continue without treating the reflection itself as a correctness blocker, but the convention decision is deferred only to the mandatory final current-change tech sync before archive rather than to a post-archive standalone sync
        review-no-finding-remains-non-blocking:
          - GIVEN: the early review reflection finds no uncaptured reusable convention
          - WHEN: review concludes
          - THEN: the reflection adds no review blocker and the final archive workflow still performs its bounded current-change sync checkpoint
  REMOVED: {}

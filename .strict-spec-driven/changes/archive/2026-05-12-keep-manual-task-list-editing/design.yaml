schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: keep-manual-task-list-editing
approach:
  - >-
    Revert the task-list portion of deterministic artifact generation while preserving the rest of
    the deterministic workflow helpers introduced by the previous change.
  - >-
    Keep tasks.yaml direct editing explicitly documented in skills and let schema validation plus
    verify enforce structure after editing.
decisions:
  manual-task-list-editing:
    decision: tasks.yaml remains outside generate artifact support.
    rationale: >-
      Task breakdown and testing-gate selection are planning decisions that should stay visible in
      agent-authored structured YAML rather than becoming another scripted population path.
  keep-question-resolution-scripted:
    decision: Retain scripted question resolution and workflow-state helpers.
    rationale: >-
      Those operations are deterministic state transitions and reporting surfaces, unlike authoring
      a full task plan.
alternatives:
  - option: Keep generate tasks and only update skill wording
    reason: That would leave an available script path the user explicitly asked not to use for tasks.yaml.
  - option: Remove all deterministic workflow helpers from the previous change
    reason: >-
      The request is specific to tasks.yaml and does not object to ready, next, or question
      resolution.
risks:
  - >-
    Tests and skill validation expectations must stay aligned so tasks is not advertised as a
    generated artifact.

schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: add-human-language-config
approach:
  - Represent the preference as a structured top-level config field named preferred_human_language with a string value, default scaffolded and example configs to English, and update the init skill to draft or preserve that value while reminding future AI agents that it is a human language preference, not a programming language. Keep the field optional for compatibility with existing projects.
decisions:
  top-level-preferred-human-language:
    decision: Use an optional top-level preferred_human_language string instead of deriving language from context prose or overloading tech-stack language wording.
    rationale: A top-level field is easy for skills and MCP resources to read, survives project-specific context rewrites, and avoids confusion with computer programming languages described elsewhere in the config.
alternatives: []
risks: []

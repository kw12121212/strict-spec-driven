schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: cli-foundation
mapping:
  implementation:
    - src/skills.ts
  tests:
    - test/run.ts
operations:
  ADDED:
    - requirement:
        id: cli-migration-skill-content-validation-smoke-coverage
        strength: MUST
        statement: >-
          The system MUST include automated checks that exercise strict migration skill content for
          both passing and failing states, not only generic package-shape validation.
        scenarios:
          - id: automated-checks-accept-aligned-migration-skill-content
            steps:
              - kind: GIVEN
                text: >-
                  the strict migration skill contains explicit strict command mappings and
                  `.strict-spec-driven/` migration guidance
              - kind: WHEN
                text: repository automated checks are executed
              - kind: THEN
                text: the migration skill content checks pass
          - id: automated-checks-reject-placeholder-migration-skill-content
            steps:
              - kind: GIVEN
                text: >-
                  the strict migration skill keeps a generic placeholder command block or omits
                  required migration guidance
              - kind: WHEN
                text: repository automated checks are executed
              - kind: THEN
                text: the migration skill content checks fail
              - kind: AND
                text: diagnostics identify the failing skill package deterministically
  MODIFIED: []
  REMOVED: []

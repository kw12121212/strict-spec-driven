schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: add-debug-session-archive
approach:
  - >-
    Add archive mechanics beside the existing debug-session create and validate module: resolve
    session IDs or session.yaml paths, validate the artifact through the existing validation path,
    create a date-prefixed archive destination under .strict-spec-driven/debug-sessions/archive/,
    move the entire session directory there, and return deterministic JSON. Register a matching CLI
    command and add a dedicated skill that validates, reviews completion evidence, archives, and
    reports the archived path.
decisions:
  debug-session-archive-command:
    decision: >-
      Use a dedicated debug-session-archive subcommand and strict-spec-debug-session-archive skill
      instead of overloading validate or the investigation skill.
    rationale: >-
      Archiving is a lifecycle transition with filesystem mutation, so it needs an explicit command
      and focused skill guidance distinct from investigation capture.
alternatives: []
risks: []

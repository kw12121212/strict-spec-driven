schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: cli-foundation
mapping:
  implementation:
    - src/roadmap.ts
    - src/strict-spec-cli.ts
    - src/skills.ts
  tests:
    - test/run.ts
operations:
  ADDED:
    - requirement:
        id: cli-roadmap-status-reports-strict-roadmap-state
        strength: MUST
        statement: >-
          The system MUST provide a `roadmap-status` subcommand that validates
          `.strict-spec-driven/roadmap/` artifacts and reports milestone and planned change state
          using strict roadmap declared-status rules and derived completion semantics.
        scenarios:
          - id: roadmap-status-reports-ordered-milestone-state
            steps:
              - kind: GIVEN
                text: a valid strict roadmap exists under `.strict-spec-driven/roadmap/`
              - kind: WHEN
                text: '`strict-spec-driven roadmap-status` is executed'
              - kind: THEN
                text: the output includes milestone entries in roadmap order
              - kind: AND
                text: each milestone reports its declared status and derived status
              - kind: AND
                text: each planned change reports its declared roadmap status and workflow-backed state
          - id: roadmap-status-rejects-invalid-roadmap-artifacts
            steps:
              - kind: GIVEN
                text: a strict roadmap artifact violates the roadmap contract
              - kind: WHEN
                text: '`strict-spec-driven roadmap-status` is executed'
              - kind: THEN
                text: the command exits non-zero
              - kind: AND
                text: the diagnostics identify the invalid artifact and field context
    - requirement:
        id: cli-roadmap-sync-reconciles-strict-roadmap-state
        strength: MUST
        statement: >-
          The system MUST provide a `roadmap-sync` subcommand that regenerates or repairs strict
          roadmap index state and reconciles milestone and planned change completion against active
          and archived strict changes without inventing new roadmap items.
        scenarios:
          - id: roadmap-sync-regenerates-canonical-roadmap-index-state
            steps:
              - kind: GIVEN
                text: >-
                  strict roadmap milestone files exist under
                  `.strict-spec-driven/roadmap/milestones/`
              - kind: WHEN
                text: '`strict-spec-driven roadmap-sync` is executed'
              - kind: THEN
                text: the roadmap index reflects the canonical milestone ordering and file paths
              - kind: AND
                text: >-
                  milestone entries keep their declared status values within the strict roadmap
                  enums
          - id: roadmap-sync-reconciles-planned-change-completion-from-workflow-state
            steps:
              - kind: GIVEN
                text: a roadmap planned change has moved into archived strict change state
              - kind: WHEN
                text: '`strict-spec-driven roadmap-sync` is executed'
              - kind: THEN
                text: the planned change is reconciled as complete in roadmap state
              - kind: AND
                text: no duplicate planned change entry is created
              - kind: AND
                text: unrelated milestone notes and scope content remain unchanged
    - requirement:
        id: cli-roadmap-validation-and-skill-smoke-coverage
        strength: MUST
        statement: >-
          The system MUST include automated checks that exercise strict roadmap command behavior and
          strict roadmap skill content for both aligned and failing states.
        scenarios:
          - id: automated-checks-accept-aligned-roadmap-workflow-surfaces
            steps:
              - kind: GIVEN
                text: >-
                  strict roadmap commands and `strict-roadmap-*` skill packages are aligned with
                  `.strict-spec-driven/roadmap/`
              - kind: WHEN
                text: repository automated checks are executed
              - kind: THEN
                text: the roadmap workflow checks pass
          - id: automated-checks-reject-placeholder-or-stale-roadmap-surfaces
            steps:
              - kind: GIVEN
                text: >-
                  a strict roadmap skill keeps a generic placeholder command block or a roadmap
                  command ignores strict roadmap status rules
              - kind: WHEN
                text: repository automated checks are executed
              - kind: THEN
                text: the roadmap workflow checks fail
              - kind: AND
                text: diagnostics identify the failing skill or roadmap surface deterministically
  MODIFIED: []
  REMOVED: []

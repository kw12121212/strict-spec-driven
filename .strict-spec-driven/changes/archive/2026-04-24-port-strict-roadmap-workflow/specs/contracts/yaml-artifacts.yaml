schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: contracts-yaml-artifacts
mapping:
  implementation:
    - src/skills.ts
    - skills/strict-roadmap-plan/SKILL.md
    - skills/strict-roadmap-milestone/SKILL.md
    - skills/strict-roadmap-recommend/SKILL.md
    - skills/strict-roadmap-propose/SKILL.md
    - skills/strict-roadmap-sync/SKILL.md
  tests:
    - test/run.ts
operations:
  ADDED:
    - requirement:
        id: strict-roadmap-skill-command-contract
        strength: MUST
        statement: >-
          The system MUST provide strict roadmap skill packages for `plan`, `milestone`,
          `recommend`, `propose`, and `sync` with explicit command mappings that reference the
          strict roadmap command(s) and shared strict change commands those skills depend on.
        scenarios:
          - id: roadmap-skills-expose-concrete-strict-commands
            steps:
              - kind: GIVEN
                text: a strict roadmap `SKILL.md` file is reviewed
              - kind: WHEN
                text: its `## This Skill's Commands` section is inspected
              - kind: THEN
                text: >-
                  the command mapping identifies the specific strict command entry or entries the
                  skill uses
              - kind: AND
                text: the command mapping is not limited to generic placeholder commands
    - requirement:
        id: strict-roadmap-skill-guidance-contract
        strength: MUST
        statement: >-
          The system MUST ensure strict roadmap skill packages describe
          `.strict-spec-driven/roadmap/` YAML artifacts, canonical milestone ordering, declared and
          derived roadmap status rules, and the prompt-vs-script split used by the strict workflow.
        scenarios:
          - id: roadmap-skills-reference-strict-roadmap-artifacts
            steps:
              - kind: GIVEN
                text: a strict roadmap skill prompt is reviewed
              - kind: WHEN
                text: its prerequisites and workflow guidance are inspected
              - kind: THEN
                text: >-
                  the skill describes `.strict-spec-driven/roadmap/` YAML artifacts and the roadmap
                  files it reads or writes
              - kind: AND
                text: >-
                  the skill does not fall back to generic or legacy roadmap instructions where
                  strict behavior is required
          - id: roadmap-skills-preserve-deterministic-mechanics-in-scripts
            steps:
              - kind: GIVEN
                text: a strict roadmap skill prompt is reviewed
              - kind: WHEN
                text: its workflow steps are inspected
              - kind: THEN
                text: >-
                  deterministic validation, status derivation, index regeneration, and proposal
                  scaffolding remain delegated to strict CLI commands
              - kind: AND
                text: >-
                  the prompt guidance remains focused on recommendation, planning judgment, editing,
                  and user checkpoints
    - requirement:
        id: strict-roadmap-proposal-handoff-contract
        strength: MUST
        statement: >-
          The system MUST ensure roadmap recommendation and roadmap proposal-handoff behavior
          convert exactly one planned change into a normal strict change scaffold without
          duplicating roadmap-only planning metadata inside the change artifacts.
        scenarios:
          - id: roadmap-recommendation-hands-off-one-planned-change-to-strict-propose
            steps:
              - kind: GIVEN
                text: a roadmap milestone includes a planned change entry
              - kind: WHEN
                text: the strict roadmap recommendation flow is accepted and the proposal handoff runs
              - kind: THEN
                text: a normal strict change scaffold is created for that planned change
              - kind: AND
                text: >-
                  the change artifacts describe proposal scope for that one change rather than
                  copying the full milestone plan
          - id: roadmap-proposal-handoff-preserves-canonical-planned-change-identity
            steps:
              - kind: GIVEN
                text: a planned change already exists as a single roadmap item under one milestone
              - kind: WHEN
                text: the roadmap proposal handoff creates the strict change scaffold
              - kind: THEN
                text: the resulting change uses the planned change name as its change identity
              - kind: AND
                text: >-
                  the roadmap artifact remains the canonical home of milestone-level planning
                  metadata
  MODIFIED: []
  REMOVED: []

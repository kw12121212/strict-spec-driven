schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: accept-roadmap-recommend-skill-parameters
approach:
  - Document parameter normalization in the skill prompts rather than adding another CLI fuzzy parser. The skills should treat a user-provided hint as a milestone selector when it resolves exactly to a milestone id, or when a numeric shorthand resolves uniquely by numeric milestone prefix after reading roadmap status or the roadmap index. After resolution, the skill runs roadmap-recommend --milestone <resolved-id>; ambiguous or missing hints become a clear blocker instead of manual planned-change selection.
decisions:
  fuzzy-hints-live-in-skill-guidance:
    decision: Keep fuzzy milestone shorthand at the skill/prompt layer and pass only exact milestone ids to the deterministic CLI.
    rationale: The CLI already supports exact milestone scoping; fuzzy natural-language interpretation is agent guidance, while deterministic recommendation remains owned by roadmap-recommend.
alternatives: []
risks: []

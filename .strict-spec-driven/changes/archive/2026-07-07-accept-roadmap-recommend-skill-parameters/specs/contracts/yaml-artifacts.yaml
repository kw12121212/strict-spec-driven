schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: contracts-yaml-artifacts
mapping:
  implementation:
    - skills/strict-roadmap-recommend/SKILL.md
    - skills/strict-spec-propose-from-roadmap/SKILL.md
    - src/mcp/prompts.ts
    - src/mcp/inventory.ts
  tests:
    - test/suites/entrypoint-and-skills.ts
    - test/suites/mcp-server.ts
operations:
  ADDED: {}
  MODIFIED:
    strict-roadmap-scripted-selection:
      strength: MUST
      statement: The strict-roadmap-recommend and strict-spec-propose-from-roadmap skills MUST obtain the planned-change recommendation from the scripted roadmap-recommend command before scaffolding a strict change, and when a user provides a roadmap hint they MUST resolve exact milestone ids or unambiguous numeric milestone-prefix shorthand to an exact milestone id before passing it to roadmap-recommend with --milestone.
      scenarios:
        skill-resolves-fuzzy-milestone-hint:
          - GIVEN: A user invokes a roadmap-backed recommendation or proposal skill with a milestone hint such as an exact milestone id or a standalone number.
          - WHEN: The skill obtains the scripted recommendation.
          - THEN: The skill resolves the hint to exactly one milestone id, runs roadmap-recommend --milestone with the resolved id, treats the returned recommendation as authoritative, and stops with a clear blocker if the hint matches no milestone or multiple milestones instead of manually selecting a planned change.
  REMOVED: {}

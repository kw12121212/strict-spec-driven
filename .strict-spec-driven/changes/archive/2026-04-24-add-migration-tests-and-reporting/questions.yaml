change: add-migration-tests-and-reporting
open: []
resolved:
  - id: does-the-migration-command-support-a-force-overwrite-flag-for-idempotent-rerun-testing
    question: Does the migration command support a `--force` / overwrite flag for idempotent rerun testing?
    context: >-
      The planned change requires testing idempotent reruns, but the current `migrate` command
      blocks on a non-empty target. A rerun test requires either a `--force` flag or unit-level-only
      coverage.
    answer: >-
      Add a `--force` flag to the migrate command as part of this change and test rerun behavior
      end-to-end.
    status: resolved
  - id: should-report-snapshots-be-committed-json-fixture-files-or-structural-assertions
    question: Should "report snapshots" be committed JSON fixture files or structural assertions?
    context: >-
      "Report snapshots" can mean either disk-committed fixtures the test diffs against, or in-test
      structural assertions. The choice affects whether new fixture files are needed.
    answer: >-
      Stay consistent with the existing pattern — structural assertions in `test/run.ts`. No
      committed snapshot files.
    status: resolved

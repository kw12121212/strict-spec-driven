schema: strict-spec-driven/change-proposal/v1
schema_version: 1
artifact_type: change_proposal
schema_file: templates/strict-spec-driven/schemas/change-proposal.yaml
change:
  id: extract-cli-command-handlers-by-domain
  status: complete
summary:
  what:
    - >-
      Move all inline command handler functions from `src/strict-spec-cli.ts` into five
      domain-oriented modules under `src/cli/`: `cmd-scaffold.ts`, `cmd-change.ts`,
      `cmd-roadmap.ts`, `cmd-migration.ts`, and `cmd-operations.ts`. Leave `src/strict-spec-cli.ts`
      as a thin orchestration layer that only imports handlers, builds the command table, exports
      the public API, and owns the process entry guard.
  why:
    - >-
      The four prior CLI decomposition changes extracted all support infrastructure — entrypoint
      wiring, command registry, change discovery helpers, and spec-mapping audit logic — into
      focused modules. Despite that work, `src/strict-spec-cli.ts` still contains every command
      handler function inline (init, propose, apply, verify, review, archive, list, modify, cancel,
      roadmap-status, roadmap-sync, migrate, maintenance, ship, validate-skills,
      verify-spec-mappings), keeping the file at 528 lines. Extracting these handlers into domain
      groups is the remaining structural work the infrastructure was preparing for.
scope:
  in:
    - Create `src/cli/cmd-scaffold.ts` — `runInit` and `runPropose` handlers
    - >-
      Create `src/cli/cmd-change.ts` — `runApply`, `runVerify`, `runReview`, `runArchive`,
      `runList`, `runModify`, `runCancel` handlers, and the `printChangeArtifacts` helper used by
      modify
    - Create `src/cli/cmd-roadmap.ts` — `runRoadmapStatus` and `runRoadmapSync` handlers
    - Create `src/cli/cmd-migration.ts` — `runMigrate` and `runMaintenanceCommand` handlers
    - >-
      Create `src/cli/cmd-operations.ts` — `runShip`, `runValidateSkills`, and
      `runVerifySpecMappings` handlers, and the `ShipResult` type
    - >-
      Export `CHANGE_NAME_PATTERN` from `src/cli/argv.ts` so scaffold and change modules share it
      without duplication
    - >-
      Reduce `src/strict-spec-cli.ts` to imports, re-exports, command table construction, `run()`,
      and the process entry guard
    - Update `cli/foundation.md` spec mapping frontmatter to list the new cmd-*.ts files
  out:
    - Changing any command name, flag, exit code, stdout text, stderr text, or JSON output field
    - >-
      Refactoring the domain modules that handlers delegate to (scaffold.ts, apply.ts, verify.ts,
      etc.)
    - Centralizing output shaping (that is `stabilize-cli-output-contracts`)
    - >-
      Adding regression coverage against a real project fixture (that is
      `bind-cli-refactors-to-real-todo-project-regression`)
unchanged_behavior:
  - All command names, aliases, and subcommand routing
  - Exit codes for every command path (success, validation error, runtime error)
  - All stdout text output including human-readable messages and JSON shapes
  - All stderr usage lines and error messages
  - The public re-exports surface of `src/strict-spec-cli.ts`

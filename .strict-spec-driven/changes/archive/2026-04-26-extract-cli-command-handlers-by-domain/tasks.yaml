schema: strict-spec-driven/task-list/v1
schema_version: 1
artifact_type: task_list
schema_file: templates/strict-spec-driven/schemas/task-list.yaml
change: extract-cli-command-handlers-by-domain
sections:
  - name: Implementation
    tasks:
      - id: implementation-1
        text: Export `CHANGE_NAME_PATTERN` from `src/cli/argv.ts` so it can be shared by handler modules
        status: complete
      - id: implementation-2
        text: >-
          Create `src/cli/cmd-scaffold.ts` with `runInit` and `runPropose` handler functions,
          importing `CHANGE_NAME_PATTERN` from `./argv.js` and domain functions from
          `../scaffold.js`
        status: complete
      - id: implementation-3
        text: >-
          Create `src/cli/cmd-change.ts` with `printChangeArtifacts`, `runApply`, `runVerify`,
          `runReview`, `runArchive`, `runList`, `runModify`, and `runCancel` handler functions,
          importing `CHANGE_NAME_PATTERN` from `./argv.js` and domain functions from their
          respective `src/` modules
        status: complete
      - id: implementation-4
        text: >-
          Create `src/cli/cmd-roadmap.ts` with `runRoadmapStatus` and `runRoadmapSync` handler
          functions, importing domain functions from `../roadmap.js`
        status: complete
      - id: implementation-5
        text: >-
          Create `src/cli/cmd-migration.ts` with `runMigrate` and `runMaintenanceCommand` handler
          functions, importing domain functions from `../migrate.js` and `../maintenance.js`
        status: complete
      - id: implementation-6
        text: >-
          Create `src/cli/cmd-operations.ts` with `runShip`, `runValidateSkills`, and
          `runVerifySpecMappings` handler functions and the `ShipResult` type, importing domain
          functions from their respective `src/` modules
        status: complete
      - id: implementation-7
        text: >-
          Replace each inline handler function body in `src/strict-spec-cli.ts` with an import from
          its new domain module; keep all existing re-exports and the command table unchanged
        status: complete
      - id: implementation-8
        text: >-
          Update mapping frontmatter in `.spec-driven/specs/cli/foundation.md` to include the five
          new `src/cli/cmd-*.ts` implementation paths
        status: complete
  - name: Testing
    tasks:
      - id: testing-1
        text: >-
          Run `bun run build` — typecheck that all new modules compile without errors and no import
          paths are broken
        status: complete
        command: bun run build
      - id: testing-2
        text: >-
          Run `bun test/run.ts` — unit tests confirm all commands still produce identical output and
          exit codes after the handler move
        status: complete
        command: bun test/run.ts
  - name: Verification
    tasks:
      - id: verification-1
        text: >-
          Verify `src/strict-spec-cli.ts` contains no inline handler function bodies — only imports,
          re-exports, the command table, `run()`, and the process entry guard
        status: complete
      - id: verification-2
        text: Verify implementation matches proposal scope
        status: complete
testing_gates:
  validation_task: testing-1
  unit_test_task: testing-2

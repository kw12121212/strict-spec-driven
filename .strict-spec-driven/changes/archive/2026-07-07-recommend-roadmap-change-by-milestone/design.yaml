schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: recommend-roadmap-change-by-milestone
approach:
  - Thread an optional milestone id through the roadmap recommendation API and CLI. The selector filters milestone iteration before candidate construction so summaries, blockers, details output, and no-candidate status all describe the selected milestone only; an unknown milestone is treated as a valid roadmap with no candidates rather than a roadmap validation error.
decisions:
  milestone-selector-flag:
    decision: Use a named CLI option, --milestone <milestone-id>, alongside --details.
    rationale: A named option is explicit, composes cleanly with --details in either order, avoids ambiguity with existing no-positional usage, and keeps the roadmap recommendation script authoritative for both global and milestone-scoped selection.
alternatives: []
risks: []

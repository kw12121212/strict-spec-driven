schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: contracts-yaml-artifacts
mapping:
  implementation:
    - skills/marketplace.json
    - skills/strict-roadmap-recommend/SKILL.md
    - skills/strict-spec-propose-from-roadmap/SKILL.md
    - skills/strict-spec-auto/SKILL.md
  tests:
    - test/suites/entrypoint-and-skills.ts
operations:
  ADDED: {}
  MODIFIED:
    strict-skill-packaging-layout-contract:
      strength: MUST
      statement: The system MUST provide strict skill packaging surfaces for the `strict-spec-*`, `strict-roadmap-*`, and `strict-tech-*` families with installer-facing metadata that uses strict namespace names in non-migration contexts.
      scenarios:
        strict-skill-families-are-packaged-with-strict-naming:
          - GIVEN: strict workflow skill packaging metadata is reviewed
          - WHEN: spec, roadmap, and tech workflow skill entries are checked
          - THEN: skill package names use the `strict-spec-*`, `strict-roadmap-*`, and `strict-tech-*` families, legacy names are not defaults outside migration compatibility, and marketplace entries match skill directory names
    roadmap-backed-intake-question-gate:
      strength: MUST
      statement: Roadmap-backed proposal guidance MUST treat selected standalone planned-change summary, details, dependencies, labels, and milestone details as valid change-intake evidence, carry answered checklist items into generated proposal artifacts instead of re-asking, create preferred_human_language questions.yaml.open blockers when affected scope, spec delta, implementation, test, dependency, or technical-standard impact remains unknown, and preserve existing roadmap selection and mutation boundaries.
      scenarios:
        complete-roadmap-detail-avoids-open-questions:
          - GIVEN: a roadmap-backed planned change includes enough summary, details, dependency, label, milestone, spec, code, and test evidence to answer the intake checklist
          - WHEN: a roadmap-backed proposal skill creates strict change artifacts
          - THEN: the guidance carries that evidence into proposal, design, task, question, and delta artifacts without re-asking the human
        thin-roadmap-detail-creates-blocking-questions:
          - GIVEN: a roadmap-backed item lacks implementation, test, spec, dependency, or technical-standard impact after focused discovery
          - WHEN: the proposal handoff reaches the question gate
          - THEN: the guidance writes questions.yaml.open entries whose impact identifies the affected proposal scope, spec delta, implementation files, tests, dependencies, or technical standards before implementation
  REMOVED:
    strict-ticket-command-prefix:
      reason: Ticket workflow skills and commands are removed.
    yaml-ticket-artifact-family:
      reason: Ticket artifacts are removed.
    yaml-ticket-conflict-resistant-ids-and-index:
      reason: Ticket storage and indexes are removed.
    yaml-ticket-schema-assets:
      reason: Ticket schema and example assets are removed.
    yaml-milestone-source-ticket-backreference:
      reason: Ticket-to-roadmap provenance is removed with tickets.
    strict-ticket-dispatch-completes-milestones-when-sufficient:
      reason: The ticket dispatch skill is removed.
    strict-ticket-archive-uses-resolve-command:
      reason: The ticket archive skill is removed.
    yaml-ticket-lifecycle-timestamp-contract:
      reason: The ticket schema is removed.

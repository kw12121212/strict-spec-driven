schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: cli-foundation
mapping:
  implementation:
    - skills/strict-spec-auto/SKILL.md
    - skills/strict-spec-propose/SKILL.md
    - skills/strict-roadmap-review/SKILL.md
  tests:
    - test/suites/entrypoint-and-skills.ts
operations:
  ADDED: {}
  MODIFIED:
    cli-change-intake-question-gate-contract:
      strength: MUST
      statement: Strict proposal creation guidance MUST answer a short evidence-backed change-intake checklist from the active request and available project context before implementation, ask only required unanswered checklist items in preferred_human_language, record unresolved required answers in questions.yaml.open with impact and recommended answers or options, stop implementation handoff while required open questions remain, and keep stable technical identifiers distinct from localized human-facing question, context, recommendation, and summary text.
      scenarios:
        change-intake-uses-evidence-before-asking:
          - GIVEN: a strict proposal workflow has an active request, optional roadmap planned-change provenance, main specs, technical standards, existing change artifacts, repository search results, and deterministic CLI output available for discovery
          - WHEN: the workflow prepares a strict change proposal
          - THEN: the workflow answers the checklist from available evidence, asks only for missing answers, and records still-missing required answers with impact and recommendations in the configured language
        open-required-questions-block-implementation:
          - GIVEN: a generated strict change has unresolved required checklist answers in questions.yaml.open
          - WHEN: implementation handoff or automatic implementation is considered
          - THEN: the workflow stops until required open questions are resolved while preserving stable technical identifiers
    cli-roadmap-review-skill-packaging-validation:
      strength: MUST
      statement: The system MUST validate the strict-roadmap-review skill package through validate-skills, enforcing guidance that reviews every roadmap milestone whose status is not complete, applies direct YAML definition fixes, elaborates planned-change detail, checks milestone intake_questions for answer evidence in milestone fields and owned planned-change details, keeps completed milestones out of scope as historical record, and reports deterministic path-specific diagnostics when required review guidance is missing.
      scenarios:
        validate-skills-requires-roadmap-review-intake-answer-guidance:
          - GIVEN: the strict-roadmap-review package is inspected by validate-skills
          - WHEN: the package omits guidance to check milestone intake_questions for answer evidence
          - THEN: validation rejects the package with a deterministic required-snippet diagnostic
        roadmap-review-skill-documents-intake-answer-review:
          - GIVEN: an operator invokes strict-roadmap-review and at least one milestone is incomplete
          - WHEN: the skill prompt is followed
          - THEN: the agent inspects intake questions, uses milestone planning fields and owned planned-change details as evidence, applies safe fixes, and surfaces unresolved human decisions
  REMOVED: {}

        status: complete
      - id: implementation-3
        text: >-
          Extract `parseLegacyProposal`, `parseLegacyDesign`, `parseLegacyTasks`, and
          `parseLegacyQuestions` from `src/migrate.ts` into
          `src/migrate/parsers/change-artifacts.ts`, importing shared helpers from the new shared

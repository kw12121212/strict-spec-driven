        status: complete
      - id: implementation-4
        text: >-
          Update `src/migrate.ts` to import from the new parser modules and re-export the
          previously-exported parser functions so the public module surface is unchanged
        status: complete
  - name: Testing
    tasks:
      - id: testing-1
        text: >-
          Run `bun run build` — build and typecheck the refactored migration parser modules
          end-to-end
        status: complete
        command: bun run build
      - id: testing-2
        text: >-
          Run `bun test/run.ts` — run unit tests covering migration conversion behavior after the

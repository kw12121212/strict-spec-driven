schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: contracts-yaml-artifacts
operations:
  ADDED: {}
  MODIFIED:
    strict-roadmap-skill-command-contract:
      strength: MUST
      statement: The system MUST provide strict roadmap skill packages for planning, recommendation, review, state transition, and reorder with explicit command mappings that reference the strict roadmap command(s) and shared strict change commands those skills depend on, and MUST NOT package a separate strict-roadmap-propose or strict-spec-propose-from-roadmap skill. Roadmap-backed proposal scaffolding MUST remain owned by the strict-roadmap-recommend skill when work is selected across the whole roadmap and by the strict-spec-propose skill when the request names one milestone, and both MUST obtain the selected planned change from the roadmap-recommend command rather than by manual selection.
      scenarios:
        roadmap-skills-expose-concrete-strict-commands:
          - GIVEN: a strict roadmap SKILL.md file is reviewed
          - WHEN: its command mapping section is inspected
          - THEN: the command mapping identifies the specific strict command entry or entries the skill uses and is not limited to generic placeholder commands
        no-separate-roadmap-proposal-skill-is-packaged:
          - GIVEN: the repository skill packaging surfaces are reviewed
          - WHEN: the skills directory and marketplace metadata are inspected
          - THEN: no strict-roadmap-propose and no strict-spec-propose-from-roadmap skill package or marketplace entry exists, and roadmap-backed scaffolding is reached through the strict-roadmap-recommend skill for whole-roadmap selection and through the strict-spec-propose skill for a named milestone
  REMOVED: {}

schema: strict-spec-driven/delta-tech/v1
schema_version: 1
artifact_type: delta_tech
schema_file: templates/strict-spec-driven/schemas/delta-tech.yaml
target_standard: yaml-first-artifacts
mapping:
  implementation:
    - src/cli/cmd-generation.ts
    - src/roadmap/author.ts
  enforcement:
    - test/suites/foundation-and-fixtures.ts
operations:
  ADDED:
    artifact-writes-are-non-destructive:
      strength: MUST
      statement: 'An artifact-authoring command MUST confine its effect to the fields named in that invocation: restating a scalar or keyed item overwrites only that item, repeated list values append, and discarding a recorded entry MUST require a flag naming that entry. No flag may replace or clear a collection the invocation did not name, and whole-artifact rebuild MUST be a separate isolated operation rather than a mode of an editing command.'
      rationale: A single flag that both permitted a scalar edit and flipped supplied lists from append to replace destroyed recorded roadmap content, because the destructive behavior was reached by an argument combination the caller did not intend and could not see. Binding a write's effect to what the caller named removes that whole class of loss instead of renaming it, and keeps every authoring command safe to run without first reasoning about which other fields it might touch.
      enforcement:
        method: test
  MODIFIED: {}
  REMOVED: {}

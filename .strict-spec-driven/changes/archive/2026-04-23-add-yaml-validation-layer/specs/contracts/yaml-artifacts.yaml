schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: contracts-yaml-artifacts
mapping:
  implementation:
    - src/index.ts
    - src/validation.ts
    - src/yaml.ts
  tests:
    - test/run.ts
operations:
  ADDED: []
  MODIFIED:
    - target_requirement: deterministic-schema-validation
      replacement:
        id: deterministic-schema-validation
        strength: MUST
        statement: >-
          The system MUST define strict YAML artifact schemas and validation diagnostics precisely
          enough for scripts to report missing required fields, invalid enum values, invalid
          references, malformed YAML, duplicate stable identifiers, and unsupported artifact shapes
          with artifact-path and field-path context.
        scenarios:
          - id: invalid-artifacts-can-be-rejected
            steps:
              - kind: GIVEN
                text: a strict YAML workflow artifact with a schema violation
              - kind: WHEN
                text: validation is run against the artifact contract
              - kind: THEN
                text: the violation can be reported as a deterministic validation failure
          - id: duplicate-identifiers-can-be-rejected
            steps:
              - kind: GIVEN
                text: >-
                  a strict YAML workflow artifact repeats a stable identifier where uniqueness is
                  required
              - kind: WHEN
                text: validation is run against the artifact contract
              - kind: THEN
                text: the duplicate identifier can be reported as a deterministic validation failure
          - id: diagnostics-include-actionable-location-context
            steps:
              - kind: GIVEN
                text: validation reports an artifact contract failure
              - kind: WHEN
                text: diagnostics are emitted
              - kind: THEN
                text: each diagnostic identifies the artifact path and field path
              - kind: AND
                text: >-
                  each diagnostic includes expected-versus-actual details when validator data
                  provides those values
  REMOVED: []

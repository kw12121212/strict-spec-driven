schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: add-yaml-validation-layer
approach:
  - >-
    Create a reusable validation layer in source modules and keep the command entrypoint thin. The
    layer will own YAML parsing/serialization, schema compilation, bundled schema loading, and
    validation diagnostics so future commands can call one consistent API. Validation diagnostics
    will normalize errors into a stable structure that includes artifact path and field path, with
    expected-versus-actual details when the validator provides them. Duplicate identifier and
    reference checks will run as explicit post-schema validation passes so semantic checks remain
    deterministic.
decisions:
  - id: >-
      centralize-validation-helpers-instead-of-embedding-logic-in-individual-subcommands-to-avoid-drift-across-command-implementations
    decision: >-
      Centralize validation helpers instead of embedding logic in individual subcommands to avoid
      drift across command implementations.
    rationale: >-
      Centralize validation helpers instead of embedding logic in individual subcommands to avoid
      drift across command implementations.
  - id: >-
      keep-ajv-ajv-formats-as-the-schema-engine-selected-in-milestone-02-and-avoid-introducing-additional-validation-libraries
    decision: >-
      Keep `ajv` + `ajv-formats` as the schema engine selected in milestone 02 and avoid introducing
      additional validation libraries.
    rationale: >-
      Keep `ajv` + `ajv-formats` as the schema engine selected in milestone 02 and avoid introducing
      additional validation libraries.
  - id: >-
      treat-bundled-schema-files-under-templates-strict-spec-driven-schemas-as-the-canonical-validation-source-for-this-layer
    decision: >-
      Treat bundled schema files under `templates/strict-spec-driven/schemas/` as the canonical
      validation source for this layer.
    rationale: >-
      Treat bundled schema files under `templates/strict-spec-driven/schemas/` as the canonical
      validation source for this layer.
  - id: normalize-diagnostics-into-one-shape-so-tests-can-assert-deterministic-error-output
    decision: Normalize diagnostics into one shape so tests can assert deterministic error output.
    rationale: Normalize diagnostics into one shape so tests can assert deterministic error output.
alternatives:
  - option: Implement schema validation independently inside each future subcommand.
    reason: Rejected because this duplicates parsing and diagnostics logic.
  - option: Defer duplicate-ID/reference checks until `verify` command implementation.
    reason: >-
      Rejected because milestone 02 explicitly requires reusable validation capabilities before
      command-port work.
  - option: Introduce a new schema DSL or validator abstraction.
    reason: >-
      Rejected to keep milestone scope focused on foundational behavior using the existing
      dependency choices.

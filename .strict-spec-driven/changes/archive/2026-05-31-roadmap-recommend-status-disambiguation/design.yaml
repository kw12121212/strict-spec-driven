schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: roadmap-recommend-status-disambiguation
approach:
  - >-
    Add a RoadmapRecommendStatus union type (recommended | no-candidate | roadmap-error) to the
    model, populate it in recommendRoadmapChange based on existing control flow, and update the CLI
    handler and skill to branch on status instead of inferring from valid+recommendation.
decisions:
  status-field-values:
    decision: >-
      Use recommended, no-candidate, roadmap-error as the three status values rather than reusing
      valid boolean or exit codes
    rationale: >-
      String enum values are self-documenting in JSON output and eliminate ambiguity for consumers
      without requiring exit code parsing
alternatives: []
risks: []

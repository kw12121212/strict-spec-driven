schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: update-planning-and-spec-content-skills-for-yaml
approach:
  - 'Implement the change in three passes:'
  - >-
    Replace placeholder planning-skill prompts with strict YAML workflow guidance author concrete
    `SKILL.md` content for `strict-spec-brainstorm`, `strict-spec-simple-task`,
    `strict-spec-spec-edit`, `strict-spec-sync-specs`, and `strict-spec-resync-code-mapping` give
    each skill an explicit command table that points at the strict bundled CLI subcommands it
    actually uses update prompt prose so these skills talk about `.strict-spec-driven/` YAML
    artifacts rather than generic or packaging-only placeholders
  - >-
    Extend validation for the planning/documentation skill family add a dedicated expectation set in
    `src/skills.ts` for the planning skills that are still scaffolds today require explicit command
    mappings, strict workflow directory references, and the core headings or guidance snippets
    needed for each skill's role keep the checks deterministic so `validate-skills` produces clear
    diagnostics when a planning skill regresses to a stub
  - >-
    Keep the strict planning surface aligned with the current reference workflow do not add a
    separate `strict-spec-spec-content` package preserve the split where `strict-spec-modify`
    handles delta-spec edits inside changes and `strict-spec-spec-edit` handles direct main-spec
    edits add or update automated tests so the planning-skill surface is protected by validation and
    smoke coverage instead of prompt review alone
decisions:
  - id: >-
      align-with-the-current-reference-workflow-and-keep-spec-content-out-of-the-strict-skill-surface-instead-of-reintroducing-a-separate-strict-package
    decision: >-
      Align with the current reference workflow and keep `spec-content` out of the strict skill
      surface instead of reintroducing a separate strict package.
    rationale: >-
      Align with the current reference workflow and keep `spec-content` out of the strict skill
      surface instead of reintroducing a separate strict package.
  - id: >-
      limit-this-change-to-planning-documentation-skills-rather-than-mixing-in-roadmap-maintenance-or-ship-workflows
    decision: >-
      Limit this change to planning/documentation skills rather than mixing in roadmap, maintenance,
      or ship workflows.
    rationale: >-
      Limit this change to planning/documentation skills rather than mixing in roadmap, maintenance,
      or ship workflows.
  - id: >-
      treat-planning-skill-content-validation-as-part-of-the-observable-contract-so-placeholder-stubs-cannot-pass-as-complete-simply-because-package-metadata-and-symlinks-are-valid
    decision: >-
      Treat planning-skill content validation as part of the observable contract so placeholder
      stubs cannot pass as complete simply because package metadata and symlinks are valid.
    rationale: >-
      Treat planning-skill content validation as part of the observable contract so placeholder
      stubs cannot pass as complete simply because package metadata and symlinks are valid.
alternatives:
  - option: Follow the roadmap item literally and add a new `strict-spec-spec-content` skill.
    reason: >-
      Rejected because the current reference workflow removed that dedicated skill and now covers
      its responsibilities through `modify` and `spec-edit`.
  - option: Rewrite all remaining strict skills in one change.
    reason: >-
      Rejected because the roadmap intentionally separates planning/documentation skills from
      roadmap and operations work.
  - option: Update the `SKILL.md` files only and leave validation unchanged.
    reason: >-
      Rejected because milestone 04's done criteria require automated validation or smoke coverage,
      not trust in prompt text alone.

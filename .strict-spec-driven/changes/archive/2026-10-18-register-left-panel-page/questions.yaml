schema_file: templates/strict-spec-driven/schemas/question-list.yaml
change: register-left-panel-page
open: []
resolved:
  - id: requirement-problem
    question: What is concretely going wrong today, and for whom?
    context: 'Why this is asked: the change is planned against a need, and the need lives only with the requester. A "problem" here means what someone does or suffers today — not a feature that is missing. If the answer names a button, a field, a page, or an endpoint, it is a solution, and the underlying problem is still unstated. What a sufficient answer contains: who is affected, what they do today instead, and how often. Worked example: "every Monday one person spends forty minutes copying order rows into a spreadsheet to send the weekly report". What it changes: this becomes the proposal''s why, and it decides whether the change is worth making.'
    answer: 'Operators still cannot read strict workflow state at width inside DeepSeek Harness: the left global panel shows only the scaffold placeholder, the archived shared tree and generic renderer are mounted by no entry point, and there is no way to choose which Session workspace to read, because the main keyed slot receives no Session binding while every remote.workspaceFiles call needs a sessionId.'
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: requirement-outcome
    question: What observable difference proves the problem is solved?
    context: 'Why this is asked: without a success condition, nobody can tell afterwards whether the change worked. "Observable" means someone outside the system can check it without reading the code. What a sufficient answer contains: what a person will see, or no longer have to do, once this is done. Worked example: "the report is in the manager''s inbox on Monday morning without anyone assembling it". What it changes: this becomes the delta spec''s scenarios and the acceptance evidence at review time.'
    answer: 'The placeholder panel is replaced by a real strict documents page: the left-sidebar icon opens a two-pane page whose Session picker groups Sessions by workspace and remembers the last choice; picking a Session shows that workspace through the shared tree and renderer; a workspace with no Session shows a prompt to open one; reopening the page restores the chosen Session and the selected document; zh and en labels render throughout; and the recorded manual check shows the page working in the pinned dsh web client and desktop profile.'
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: requirement-trigger
    question: Why now — what forced this?
    context: 'Why this is asked: work that nothing forced is the work most often thrown away later. This question catches a request that sounds reasonable but has no real driver behind it. What a sufficient answer contains: the concrete event, deadline, incident, or cost that made this surface now, or an honest statement that nothing did. Worked example: "the report was missed last month and it was raised with the team". What it changes: a change with no trigger is a candidate for deferral, and the answer is weighed at review before archive.'
    answer: The milestone orders both entry points after the archived shared tree change and the roadmap-recommend gate reports this planned change eligible now because its only dependency build-collapsible-document-tree is archived, while the renderers milestone's changes stay dependency-incomplete.
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: requirement-non-goals
    question: What must explicitly not change?
    context: 'Why this is asked: the requester knows which nearby behavior other people depend on, and the agent does not. A "non-goal" is something the change must leave alone even though it sits close to the work. What a sufficient answer contains: the behavior, setting, or output that must survive untouched, and who relies on it. Worked example: "do not change the saved filters — several people rely on their own". What it changes: these become the proposal''s unchanged_behavior items, which review checks the finished result against.'
    answer: No right-sidebar tab or guide entry ships here, it stays with the register-right-sidebar-tab planned change; dedicated renderers stay in the next milestone; the plugin stays read-only and invokes neither strict-spec-cli nor a custom host RPC namespace; strict artifact schemas, the strict CLI, the MCP server, deepseek-harness, the engines.dsh pin, the coverage gate scope, and config.yaml review evidence stay unchanged; and the archived discovery model, tree, and renderer behaviors keep their guarantees.
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: requirement-interpretation
    question: Which reading of the request is intended, where more than one is possible?
    context: 'Why this is asked: a short request usually admits several readings, and building the wrong one is indistinguishable from building nothing. What a sufficient answer contains: the reading that is meant, stated plainly enough to rule the others out — or a statement that only one reading exists and what it is. Worked example: "export means the version sent to the manager, not the one I read myself". What it changes: this fixes the scope boundary before any code is written, and settles disputes about what was asked.'
    answer: 'Only one reading is in play: the existing strict-spec panel id keeps its sidebar.panellist row and main keyed page, the placeholder components retire, the Session picker is built on the pinned dsh session and workspace service faces with Sessions grouped by workspace and the last choice remembered, page state restores the chosen Session and selected document on reopening, and the page shares the archived tree and generic renderer with the later right-sidebar tab rather than forking them.'
    status: resolved
    kind: requirement
    answered_by: roadmap

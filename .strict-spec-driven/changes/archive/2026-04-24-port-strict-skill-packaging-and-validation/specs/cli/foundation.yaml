schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: cli-foundation
mapping:
  implementation:
    - package.json
    - src/strict-spec-cli.ts
    - src/skills.ts
  tests:
    - test/run.ts
operations:
  ADDED:
    - requirement:
        id: cli-skill-packaging-validation-smoke-coverage
        strength: MUST
        statement: >-
          The system MUST include automated checks that exercise strict skill packaging validation
          behavior for both passing and failing package states.
        scenarios:
          - id: packaging-checks-confirm-valid-strict-package-state
            steps:
              - kind: GIVEN
                text: strict skill packages satisfy metadata, command reference, and symlink assumptions
              - kind: WHEN
                text: repository automated checks are executed
              - kind: THEN
                text: strict skill packaging checks pass
          - id: packaging-checks-report-deterministic-diagnostics-for-invalid-state
            steps:
              - kind: GIVEN
                text: >-
                  a strict skill package has stale naming, missing required metadata, or broken
                  symlink assumptions
              - kind: WHEN
                text: repository automated checks are executed
              - kind: THEN
                text: strict skill packaging checks fail
              - kind: AND
                text: diagnostics remain machine-readable and path-specific
          - id: validate-skills-command-emits-machine-readable-results
            steps:
              - kind: GIVEN
                text: strict skill packaging validation is executed through CLI
              - kind: WHEN
                text: '`strict-spec-driven validate-skills` runs'
              - kind: THEN
                text: command output is parseable JSON
              - kind: AND
                text: output includes validity, deterministic diagnostics, and summary counts
  MODIFIED: []
  REMOVED: []

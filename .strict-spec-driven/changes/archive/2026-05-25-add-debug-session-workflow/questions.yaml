schema: strict-spec-driven/question-list/v1
schema_version: 1
artifact_type: question_list
schema_file: templates/strict-spec-driven/schemas/question-list.yaml
change: add-debug-session-workflow
open: []
resolved:
  - id: human-sensitive-input-boundary
    question: >-
      Should the debug-session workflow ever collect passwords, one-time codes, private keys,
      payment confirmations, or production credentials from the human operator?
    context: >-
      The workflow needs to support manual login, OAuth, 2FA, and other sensitive steps during
      debugging.
    answer: >-
      No. The agent may prepare the browser or Electron session and start evidence capture, but
      humans must enter sensitive values directly. The debug-session artifact records only the
      semantic manual action, redacted evidence references, and post-action observable state.
    status: resolved
  - id: debug-layer-scope
    question: Which runtime surfaces are in scope for the first debug-session workflow?
    context: The requested boundary is limited to Web API, frontend, Electron desktop, and CDP access.
    answer: >-
      The first workflow is limited to Web API, browser frontend, Electron desktop applications
      reachable through CDP, and CDP access/debugging itself. Native mobile, non-Electron desktop
      automation, production tracing backends, and credential vaulting are out of scope.
    status: resolved

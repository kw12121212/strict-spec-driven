schema: strict-spec-driven/change-proposal/v1
schema_version: 1
artifact_type: change_proposal
schema_file: templates/strict-spec-driven/schemas/change-proposal.yaml
change:
  id: expose-embedded-template-assets
  status: proposed
summary:
  what:
    - >-
      Expose embedded strict schema and scaffold template assets through read-only CLI commands for
      agent inspection.
    - Restore roadmap example fixtures expected by the existing roadmap schema coverage tests.
  why:
    - >-
      Skills can drop per-skill templates symlinks while still letting agents inspect artifact
      contracts on demand.
    - >-
      The test suite must keep roadmap v2 inline planned-change compatibility examples aligned with
      the current schema contract.
scope:
  in:
    - >-
      Add commands that list bundled template assets and print a selected embedded template or
      schema asset.
    - Relax skill packaging validation so templates symlinks are optional instead of required.
    - Update documentation and tests for the embedded-template inspection workflow.
    - >-
      Repair roadmap milestone examples so existing coverage tests demonstrate inline planned-change
      compatibility.
  out:
    - >-
      Change strict YAML artifact schema fields unrelated to template discovery or roadmap example
      coverage.
    - Remove source templates from the repository.
unchanged_behavior:
  - >-
    Existing init, propose, validation, migration, archive, and roadmap behavior continues to use
    bundled templates and schemas.
  - Standalone planned-change files remain the preferred roadmap collaboration surface.

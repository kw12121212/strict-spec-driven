schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: add-dev-session-lifecycle-commands
approach:
  - >-
    Extend the existing dev-session parser and plan derivation so explicit lifecycle subcommands can
    reuse validated declaration data, start declared service commands, persist managed runtime
    bookkeeping in an ignored location, poll readiness checks, and render deterministic status and
    log output.
  - >-
    Keep cleanup conservative by acting only on process records created by dev-session-start and by
    surfacing readiness failures, stale records, and missing runtime state as explicit lifecycle
    results instead of guessing or silently recovering.
decisions:
  explicit-lifecycle-subcommands:
    decision: >-
      Implement start, status, logs, and stop as explicit CLI subcommands backed by the existing
      dev-session declaration.
    rationale: >-
      Reusing the validated declaration keeps lifecycle behavior deterministic and prevents the CLI
      from guessing undocumented development setup.
  managed-runtime-bookkeeping:
    decision: >-
      Persist only strict-managed process identifiers, service ids, start metadata, and log paths in
      an ignored runtime location that status, logs, and stop can re-read.
    rationale: >-
      Shared runtime bookkeeping is required to make cleanup idempotent, distinguish stale records
      from live processes, and avoid touching unrelated processes.
alternatives: []
risks: []

schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: contracts-yaml-artifacts
mapping:
  implementation: []
  tests: []
operations:
  ADDED:
    - requirement:
        id: command-surface-boundaries
        strength: MUST
        statement: >-
          The system MUST distinguish skill names, slash commands, CLI entrypoints, CLI subcommands,
          and installer-facing names as separate command naming surfaces.
        scenarios:
          - id: command-naming-surfaces-are-reviewable
            steps:
              - kind: GIVEN
                text: the strict workflow naming contract is reviewed
              - kind: WHEN
                text: public command names are categorized
              - kind: THEN
                text: >-
                  skill names, slash commands, CLI entrypoints, CLI subcommands, and
                  installer-facing names are each identifiable as separate naming surfaces
    - requirement:
        id: strict-cli-entrypoint
        strength: MUST
        statement: >-
          The system MUST define `strict-spec-driven` as the CLI entrypoint for strict YAML workflow
          commands.
        scenarios:
          - id: strict-cli-entrypoint-is-explicit
            steps:
              - kind: GIVEN
                text: the strict workflow naming contract is reviewed
              - kind: WHEN
                text: the CLI entrypoint for strict YAML workflow commands is checked
              - kind: THEN
                text: '`strict-spec-driven` is identified as the strict CLI entrypoint'
    - requirement:
        id: cli-subcommand-naming-model
        strength: MUST
        statement: >-
          The system MUST define CLI subcommands as stable workflow verb or verb-object names under
          the `strict-spec-driven` entrypoint rather than as `strict-spec-*` or `strict-roadmap-*`
          prefixed skill names.
        scenarios:
          - id: cli-subcommands-do-not-duplicate-skill-prefixes
            steps:
              - kind: GIVEN
                text: a strict CLI command name is reviewed
              - kind: WHEN
                text: its subcommand is checked
              - kind: THEN
                text: the subcommand is a workflow verb or verb-object name
              - kind: AND
                text: >-
                  the subcommand does not rely on the `strict-spec-*` or `strict-roadmap-*` skill
                  naming families for its strict namespace
    - requirement:
        id: installer-facing-strict-names
        strength: MUST
        statement: >-
          The system MUST require installer-facing package, skill, or command names for strict
          workflows to identify the strict workflow namespace explicitly and avoid silent legacy
          aliases outside migration-defined compatibility behavior.
        scenarios:
          - id: installer-names-preserve-the-strict-namespace
            steps:
              - kind: GIVEN
                text: strict workflow installation metadata is reviewed
              - kind: WHEN
                text: package, skill, or command names are exposed for installation
              - kind: THEN
                text: the names identify the strict workflow namespace
              - kind: AND
                text: >-
                  legacy `spec-driven` or `spec-driven-*` names are not treated as strict workflow
                  aliases unless a migration compatibility contract defines that behavior
  MODIFIED:
    - target_requirement: cli-naming-remains-separate
      replacement:
        id: cli-naming-remains-separate
        strength: MUST
        statement: >-
          The system MUST distinguish skill and slash-command prefix rules from CLI entrypoint, CLI
          subcommand, and installer-facing naming rules, and MUST apply each rule only to its own
          naming surface.
        scenarios:
          - id: cli-naming-is-not-implied-by-skill-prefixes
            steps:
              - kind: GIVEN
                text: the strict workflow naming contract is reviewed
              - kind: WHEN
                text: CLI entrypoint, CLI subcommand, or installer-facing names are considered
              - kind: THEN
                text: >-
                  they are not treated as automatically defined by the `strict-spec-*` or
                  `strict-roadmap-*` skill and slash-command prefixes
              - kind: AND
                text: each naming surface is checked against its own strict naming rule
  REMOVED: []

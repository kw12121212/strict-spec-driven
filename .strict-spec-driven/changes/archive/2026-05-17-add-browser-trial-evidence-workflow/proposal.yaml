schema: strict-spec-driven/change-proposal/v1
schema_version: 1
artifact_type: change_proposal
schema_file: templates/strict-spec-driven/schemas/change-proposal.yaml
change:
  id: add-browser-trial-evidence-workflow
  status: proposed
summary:
  what:
    - >-
      Add a browser-trial evidence workflow that derives local trial guidance from the declared
      dev-session plan and records supplemental evidence expectations for strict implementation,
      verification, and review.
  why:
    - >-
      The dev-session contract and lifecycle commands already describe browser targets, but agents
      still need a deterministic way to know which local URLs to open, which smoke paths to
      exercise, and how to report reproducible browser evidence without guessing.
scope:
  in:
    - >-
      Derive browser-trial guidance from dev-session-plan output, including target URLs, smoke
      paths, evidence labels, and whether services were already running or started by strict
      lifecycle commands.
    - >-
      Define how strict implementation, verification, and review workflows record supplemental
      browser evidence without replacing the required project regression command.
  out:
    - >-
      Updating agent-facing skills to consult the new workflow guidance automatically; that
      follow-on belongs to the separate roadmap change update-agent-skills-for-dev-sessions.
    - >-
      Generating manual helper scripts or changing the dev-session declaration contract beyond the
      existing browser target and evidence label fields.
unchanged_behavior:
  - >-
    The project regression command configured in .strict-spec-driven/config.yaml remains the
    required archive gate, and browser evidence stays supplemental.
  - >-
    Existing dev-session plan and lifecycle commands remain the source of truth for declared
    services and browser targets.
roadmap:
  milestone: 0012-development-session-assistance
  planned_change: add-browser-trial-evidence-workflow

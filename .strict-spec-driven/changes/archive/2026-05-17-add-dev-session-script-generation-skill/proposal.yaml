schema: strict-spec-driven/change-proposal/v1
schema_version: 1
artifact_type: change_proposal
schema_file: templates/strict-spec-driven/schemas/change-proposal.yaml
change:
  id: add-dev-session-script-generation-skill
  status: proposed
summary:
  what:
    - >-
      Add an agent skill that reads .strict-spec-driven/dev-session.yaml and generates standard
      project-local helper scripts (dev-start, dev-stop, dev-status, dev-logs) from declared
      development-session metadata.
  why:
    - >-
      Manual dev workflow management requires remembering strict CLI subcommands. A dedicated skill
      lets agents generate human-friendly, executable helper scripts so developers can use familiar
      shell commands without knowing the underlying strict commands.
scope:
  in:
    - >-
      A new agent skill (strict-dev-session-scripts or similar) that reads the declared dev-session
      metadata, runs the dry session plan, and writes project-local scripts. Scripts include
      provenance comments, avoid embedding secrets, use managed sections to preserve user content,
      and refuse to overwrite unmanaged files without confirmation. Scripts either wrap strict
      lifecycle commands or directly execute declared project commands.
  out:
    - >-
      Changes to dev-session.yaml schema, changes to the strict lifecycle commands themselves,
      secrets or credential values in generated scripts, replacing project-owned package scripts or
      framework CLIs.
unchanged_behavior:
  - >-
    dev-session.yaml schema, dev-session-plan and lifecycle CLI commands, test runner and build
    commands, existing strict workflow artifacts.
roadmap:
  milestone: 0012-development-session-assistance
  planned_change: add-dev-session-script-generation-skill

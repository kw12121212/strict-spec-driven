schema: strict-spec-driven/task-list/v2
schema_version: 2
artifact_type: task_list
schema_file: templates/strict-spec-driven/schemas/task-list.yaml
change: add-dev-session-script-generation-skill
sections:
  Implementation:
    read-existing-skill-patterns:
      text: >-
        Read existing agent skill files to understand the SKILL.md and script structure conventions
        used in the project.
      status: complete
    read-dev-session-schema:
      text: >-
        Read the dev-session.yaml schema and example files to understand all fields the skill must
        consume.
      status: complete
    implement-script-generator-core:
      text: >-
        Implement the core script-generation logic that reads dev-session.yaml, resolves declared
        service commands and lifecycle behavior, and writes managed-section scripts for dev-start,
        dev-stop, dev-status, and dev-logs.
      status: complete
    implement-managed-section-guard:
      text: >-
        Implement the managed-section guard logic that detects existing unmanaged scripts and
        prompts the user before overwriting, and regenerates managed sections without clobbering
        surrounding user content.
      status: complete
    implement-provenance-comments:
      text: >-
        Add provenance comment generation so each output script clearly states it was generated from
        .strict-spec-driven/dev-session.yaml and can be regenerated by the skill.
      status: complete
    write-skill-md:
      text: >-
        Write the SKILL.md instruction document that tells agents when and how to invoke the
        script-generation skill, including trigger conditions, non-trigger conditions, and expected
        outputs.
      status: complete
    register-skill-assets:
      text: >-
        Register the new skill assets (SKILL.md and any supporting scripts or templates) in the
        project in the standard skill location.
      status: complete
  Testing:
    run-build:
      text: Run build validation.
      status: complete
      command: bun run build
    run-tests:
      text: Run unit tests.
      status: complete
      command: bun test/run.ts
    verify-managed-section-behavior:
      text: >-
        Manually verify that running the skill twice does not overwrite user-authored content
        outside the managed section, and that regeneration updates the managed block correctly.
      status: complete
    verify-no-secrets:
      text: >-
        Inspect generated scripts to confirm no secret values are embedded — only environment
        variable names are referenced.
      status: complete
  Verification:
    verify-scope:
      text: >-
        Verify implementation matches proposal scope — skill reads dev-session.yaml, generates
        executable helper scripts, preserves user content, avoids secrets, and includes provenance
        comments.
      status: complete
testing_gates:
  validation_task: run-build
  unit_test_task: run-tests

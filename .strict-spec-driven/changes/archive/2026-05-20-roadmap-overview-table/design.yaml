schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: roadmap-overview-table
approach:
  - >-
    Add a dedicated roadmap-overview CLI entrypoint that loads the same roadmap status result used
    by roadmap-status and formats it into deterministic plain-text sections for humans.
  - >-
    Render one milestone summary row per roadmap milestone, then emit grouped planned-change detail
    rows beneath each milestone so the command stays overview-first while preserving drill-down
    context.
decisions:
  separate-overview-command:
    decision: Introduce roadmap-overview as a separate command instead of changing roadmap-status output.
    rationale: >-
      The existing roadmap-status JSON output is already part of the CLI contract and should remain
      stable for tooling and tests.
  overview-first-layout:
    decision: Use a milestone summary table followed by per-milestone planned-change detail sections.
    rationale: >-
      This keeps the first screen focused on full-roadmap progress while still exposing actionable
      detail without flattening everything into one unreadable table.
  semantic-reuse:
    decision: >-
      Reuse existing roadmap validation, ordering, and status derivation before formatting
      human-readable output.
    rationale: >-
      One status source of truth avoids drift between machine-readable and human-readable roadmap
      reporting.
alternatives:
  - option: Add a --table flag to roadmap-status.
    reason: >-
      The user chose a separate command and keeping one command per output contract avoids
      mixed-mode parsing expectations.
  - option: Replace roadmap-status JSON with text output.
    reason: That would break existing machine-readable workflows and the current CLI requirement coverage.
risks:
  - >-
    Wide roadmap tables can become hard to scan in narrow terminals, so the command should keep
    milestone columns concise and move detail into grouped sub-sections.

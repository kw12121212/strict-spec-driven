schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: cli-foundation
mapping:
  implementation:
    - src/migrate.ts
    - src/scaffold.ts
    - src/strict-spec-cli.ts
  tests:
    - test/run.ts
operations:
  ADDED:
    - requirement:
        id: cli-migrate-converts-bootstrap-workflow-state
        strength: MUST
        statement: >-
          The system MUST provide a `migrate` subcommand that reads legacy `.spec-driven/` workflow
          state, migrates the supported bootstrap config into strict YAML output, initializes the
          remaining strict scaffold assets under `.strict-spec-driven/`, and reports deferred legacy
          artifacts that still need dedicated converters.
        scenarios:
          - id: migrate-converts-bootstrap-config-and-initializes-strict-scaffold
            steps:
              - kind: GIVEN
                text: legacy bootstrap workflow state exists under `.spec-driven/`
              - kind: AND
                text: no unsafe strict target conflict blocks execution
              - kind: WHEN
                text: '`strict-spec-driven migrate` is executed'
              - kind: THEN
                text: >-
                  the command writes a migrated strict config artifact under
                  `.strict-spec-driven/config.yaml`
              - kind: AND
                text: >-
                  the command initializes the remaining required strict scaffold assets under
                  `.strict-spec-driven/`
              - kind: AND
                text: the source `.spec-driven/` artifacts remain unchanged
              - kind: AND
                text: the command reports which artifacts were converted and which were skipped
          - id: migrate-reports-deferred-legacy-artifacts-without-guessing
            steps:
              - kind: GIVEN
                text: legacy Markdown workflow artifacts exist under `.spec-driven/`
              - kind: AND
                text: dedicated converters for those artifacts are not implemented yet
              - kind: WHEN
                text: '`strict-spec-driven migrate` is executed'
              - kind: THEN
                text: those legacy artifacts are reported as skipped
              - kind: AND
                text: >-
                  the command records manual follow-up items instead of inventing strict YAML
                  content for them
    - requirement:
        id: cli-migrate-enforces-preflight-and-overwrite-protection
        strength: MUST
        statement: >-
          The system MUST reject migration runs that cannot proceed safely and report the blocking
          preflight or overwrite-protection reason deterministically.
        scenarios:
          - id: migrate-rejects-unsafe-strict-target-overwrite
            steps:
              - kind: GIVEN
                text: '`.strict-spec-driven/` already contains conflicting workflow state'
              - kind: AND
                text: no explicit safe rerun policy allows overwriting that state
              - kind: WHEN
                text: '`strict-spec-driven migrate` is executed'
              - kind: THEN
                text: the command exits non-zero
              - kind: AND
                text: the result identifies the overwrite-protection conflict
              - kind: AND
                text: existing strict target files are left unchanged
          - id: migrate-rejects-missing-legacy-source-state
            steps:
              - kind: GIVEN
                text: supported legacy workflow artifacts are not present under `.spec-driven/`
              - kind: WHEN
                text: '`strict-spec-driven migrate` is executed'
              - kind: THEN
                text: the command exits non-zero
              - kind: AND
                text: the result identifies the missing bootstrap source state
    - requirement:
        id: cli-migrate-emits-structured-report-output
        strength: MUST
        statement: >-
          The system MUST emit a structured migration report for each migration run so the operator
          can review successes, failures, warnings, and manual follow-up items.
        scenarios:
          - id: migrate-report-includes-actionable-outcome-categories
            steps:
              - kind: GIVEN
                text: '`strict-spec-driven migrate` completes a migration attempt'
              - kind: WHEN
                text: the migration result is inspected
              - kind: THEN
                text: the report includes converted artifacts, skipped artifacts, warnings, and errors
              - kind: AND
                text: >-
                  any unsupported or ambiguous legacy shapes are recorded as manual follow-up items
                  with source references
  MODIFIED: []
  REMOVED: []

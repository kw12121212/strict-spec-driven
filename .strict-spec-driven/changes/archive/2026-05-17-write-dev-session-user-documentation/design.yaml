schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: write-dev-session-user-documentation
approach:
  - >-
    Write DEV_SESSIONS.md as a self-contained reference guide for project authors and agents. Update
    README.md with a brief Development Sessions section that links to the guide. Extend
    QUICKSTART.md with a short dev-session onboarding step. Add new requirements to
    contracts-yaml-artifacts covering dev-session documentation coverage. Add a smoke-coverage
    requirement to cli-foundation for the new documentation surface.
decisions:
  design-001:
    decision: DEV_SESSIONS.md is the dedicated guide rather than inline README prose
    rationale: >-
      The dev-session surface has enough commands, schema fields, lifecycle rules, and
      secret-handling guidance to warrant its own guide rather than bloating README.md; README and
      QUICKSTART reference it as pointers
alternatives: []
risks: []

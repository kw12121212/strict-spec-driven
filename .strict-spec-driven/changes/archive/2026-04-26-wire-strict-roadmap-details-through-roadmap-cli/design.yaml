schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: wire-strict-roadmap-details-through-roadmap-cli
approach:
- 'The core fix is a one-line addition in `sync.ts` to propagate the optional `details` field through the canonical artifact builder. The converter type gets a matching optional field for future-proofing.
  Unit tests confirm the field survives sync when present and does not appear when absent. ### Files to modify'
- '`src/roadmap/sync.ts` — add `details` propagation in `buildCanonicalMilestoneArtifact()`'
- '`src/converters/roadmap.ts` — add `details?: string` to `StrictRoadmapMilestoneArtifact`'
- Test file — add sync round-trip tests for `details` presence and absence
decisions:
  copy-don-t-transform:
    decision: '`details` passes through as-is.'
    rationale: The sync layer is a canonicalization step, not a content transformation step.
  omit-when-undefined:
    decision: When the source milestone has no `details`, the canonical output also omits it (no empty string fallback).
    rationale: This keeps the artifact minimal.
  converter-type-alignment-only:
    decision: The converter's `StrictRoadmapMilestoneArtifact` gets the field so its type stays aligned with the canonical model, but `convertRoadmapMilestone()` does not attempt to parse a `## Details`
      section from legacy Markdown.
    rationale: That work is scoped to the later `preserve-strict-roadmap-details-during-conversion` change.
alternatives:
- option: '**Always include `details` key with empty string**'
  reason: ruled out because the schema defines `details` as optional; emitting an empty string would be noisy and semantically different from absent.
- option: '**Parse legacy `## Details` from Markdown now** — ruled out because the milestone plan assigns that to `preserve-strict-roadmap-details-during-conversion`.'
  reason: This change focuses strictly on the pipeline wiring.

schema: strict-spec-driven/change-proposal/v1
schema_version: 1
artifact_type: change_proposal
schema_file: templates/strict-spec-driven/schemas/change-proposal.yaml
change:
  id: define-concrete-yaml-schema-files
  status: complete
summary:
  what:
    - >-
      Define the concrete schema and example file contract for strict YAML workflow artifacts. This
      change will document that the strict workflow must provide versioned, parseable schema files
      and minimal valid example files for every required artifact family:
    - main specs and delta specs
    - change proposals, designs, tasks, and questions
    - spec indexes and roadmap indexes
    - roadmap milestones and planned change entries
  why:
    - >-
      The existing YAML artifact contract defines the schema families and field-level expectations,
      but later validators, generators, skills, and migration tooling need concrete files to target.
      File-based schemas and examples make the format contract reviewable, testable, and stable
      before CLI implementation begins.
scope:
  in:
    - Require concrete schema files for all strict workflow artifact families.
    - Require minimal valid example files for all strict workflow artifact families.
    - Require each schema file to declare its artifact type and schema version.
    - >-
      Require schema and example files to be parseable as YAML without depending on Markdown
      headings, frontmatter, or prose-only conventions.
    - Require examples to be associated with the schema they demonstrate.
    - >-
      Require the schema and example file set to be complete enough for later validation commands to
      detect missing artifact families.
  out:
    - Implementing schema validation commands, parsers, or generators.
    - Choosing a final validation library or schema dialect.
    - Migrating this repository's bootstrap `.spec-driven/` state into `.strict-spec-driven/`.
    - Creating production source code or tests.
    - >-
      Defining schema registry IDs, compatibility policy, or version migration behavior beyond
      requiring files to expose schema versions.
unchanged_behavior:
  - >-
    Existing bootstrap `.spec-driven/` Markdown artifacts remain the active planning workflow until
    strict migration tooling exists.
  - The reference workflow in `../auto-spec-driven` remains the semantic baseline.
  - >-
    `SKILL.md`, `README.md`, `AGENTS.md`, and `RTK.md` remain Markdown exceptions for packaging and
    repository documentation.

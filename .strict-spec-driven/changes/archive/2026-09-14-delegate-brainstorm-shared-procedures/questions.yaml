    status: resolved
    kind: requirement
    answered_by: human
  - id: requirement-non-goals
    question: What must explicitly not change?
    context: Bounds the deletion so the audit has a fixed protected set.
    answer: brainstorm's conversational loop, scope convergence, change-name suggestion, and the explicit user confirmation before any file is scaffolded stay exactly as they are, as do its ten steps and their numbering. The owner skills are not edited. No skill is added, removed, or renamed and no CLI surface changes. The task-order check keeps behaving identically for every skill that declares no task-list-authoring delegation, and the requirement keeps its scan-discovered governed set and its missing-guidance failure.

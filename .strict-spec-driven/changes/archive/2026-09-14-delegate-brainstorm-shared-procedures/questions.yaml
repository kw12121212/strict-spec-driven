    kind: requirement
    answered_by: human
  - id: requirement-outcome
    question: What observable difference proves it is solved?
    context: Fixes the depth and whether the blocking asymmetry is corrected or worked around.
    answer: brainstorm drops from 331 to roughly 200 lines through five checked delegations, and the task-order guidance check gains the delegation escape every sibling check already has, so the reduction is achieved by correcting the asymmetry rather than by routing around it. The requester chose this over the four-delegation variant that needs no code change.
    status: resolved
    kind: requirement
    answered_by: human
  - id: requirement-trigger
    question: Why now, what forced this?
    context: Separates an opportunistic cleanup from directed work.

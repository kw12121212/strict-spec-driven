schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: remove-specs-readme
approach:
  - Pure deletion — remove every trace of specs/README.md from the source, templates, and the live project file.
  - No replacement needed; the YAML schema examples and INDEX.yaml sample entry already convey the same format guidance.
  - After deleting the migrate special-case handler, the migrate command will no longer need to know about this file.
  - Align the live CLI foundation spec and Quickstart docs with the README-free scaffold so current-state artifacts stay truthful before archive.
  - Drop obsolete migration test assertions that still exercise removed `migrate --force` CLI flags, while keeping the non-empty-target protection coverage intact.
decisions:
  no-replacement:
    decision: Do not create any Markdown or YAML replacement for the README content.
    rationale: The spec format is fully documented in the YAML schema files (main-spec.yaml schema) and the INDEX.yaml sample entry. A separate guidance file would immediately become stale and re-introduce a non-YAML file.
  remove-migrate-handler:
    decision: Remove the legacy specs/README.md special-case from the migrate converter.
    rationale: Once the README no longer exists in the scaffold, it will not appear in any new strict project. The legacy handler for .spec-driven/specs/README.md can also be removed because the migrate command's purpose is to convert to a README-free layout.
alternatives:
  - option: Convert the README content into a YAML comment block inside INDEX.yaml.
    reason: Rejected — YAML comments are not schema-validated and would clutter the operational file. The schema file is the correct location for format guidance.
  - option: Keep README.md but rename it to something outside specs/.
    reason: Rejected — the user explicitly wants .strict-spec-driven/ to be YAML-only; moving the file elsewhere defeats that goal.
risks:
  - Projects that already ran init and have a specs/README.md will keep it. This change does not auto-delete existing files in user projects — acceptable because the file is inert and users can delete it manually.

schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: disable-yaml-scalar-line-folding
approach:
  - >-
    Change the single dump call in stringifyYamlDocument from lineWidth 100 to lineWidth -1, which
    disables js-yaml scalar line folding so long values serialize on one physical line. All callers
    share this writer, so the fix applies uniformly without per-command changes.
decisions:
  use-linewidth-negative-one:
    decision: Set lineWidth to -1 (unlimited) rather than a larger finite width.
    rationale: >-
      A finite width only raises the wrap threshold and still folds sufficiently long scalars; -1
      deterministically guarantees no scalar is ever folded, which is the behavior agents need for
      stable reading and diffing.
alternatives: []
risks: []

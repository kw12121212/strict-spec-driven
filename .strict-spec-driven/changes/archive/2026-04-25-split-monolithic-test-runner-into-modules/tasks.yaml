change: split-monolithic-test-runner-into-modules
sections:
  Implementation:
    implementation-1:
      text: >-
        Extract shared test-support helpers from `test/run.ts` for command execution, fixture
        access, copied-workspace setup, and result reporting.
      status: complete
    implementation-2:
      text: >-
        Split the current monolithic runner coverage into smaller domain-oriented test modules while
        preserving the existing scenario order and assertions.
      status: complete

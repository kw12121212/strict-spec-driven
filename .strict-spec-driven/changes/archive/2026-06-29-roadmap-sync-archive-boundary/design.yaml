schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: roadmap-sync-archive-boundary
approach:
  - Treat roadmap/archive/ as immutable historical roadmap state that active roadmap-sync loads only as excluded filesystem content. The implementation should first add a regression test for archive followed by sync; code changes are limited to roadmap load/sync boundaries if that test exposes archived artifacts leaking back into active reconciliation.
decisions:
  archive-boundary-is-active-roadmap-only:
    decision: roadmap-sync canonicalization operates on active roadmap milestones and active standalone planned-change files only; archived roadmap milestone and planned-change YAML under roadmap/archive/ remain historical output and are not reindexed.
    rationale: roadmap-archive rewrites the active index without archived milestones, so subsequent sync must preserve that boundary instead of treating archive files as missing active milestones or standalone planned changes.
alternatives: []
risks: []

schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: cli-foundation
operations:
  ADDED:
    skill-guidance-names-no-ai-product:
      strength: MUST
      statement: Skill packaging validation MUST report a diagnostic when bundled skill guidance names a specific AI product or casts a named product as the actor the guidance addresses, and the diagnostic MUST name the offending SKILL.md path, the line the text appears on, and the matched text; the validation command MUST exit non-zero when any such text is present, so a project that runs only the shipped command observes the failure without depending on this repository regression suite. The scan MUST read the whole SKILL.md including its frontmatter, because a skill description is the routing text a reader consults first and sits outside the checks that read the body.
      scenarios:
        product-named-in-a-skill-description-fails-validation:
          - GIVEN: a bundled skill whose frontmatter description names a specific AI product as the actor the skill is for
          - WHEN: the shipped skill validation command runs over the skill set
          - THEN: the command exits non-zero and reports a diagnostic naming that SKILL.md path, the line the text appears on, and the matched text
        agent-less-description-passes-validation:
          - GIVEN: the same bundled skill with its description stating the same routing conditions without an agent subject
          - WHEN: the shipped skill validation command runs over the skill set
          - THEN: the command exits zero and reports no product-name diagnostic for that skill
        unnamed-actor-in-a-use-when-clause-is-not-reported:
          - GIVEN: bundled skill guidance whose use-when clause names a condition rather than a capitalised actor
          - WHEN: the shipped skill validation command runs over the skill set
          - THEN: no product-name diagnostic is reported for that clause
  MODIFIED: {}
  REMOVED: {}

schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: expose-scene-cli-surface
approach:
  - Follow the shape already established by spec-edit and tech-edit for the live-artifact writer, and by tech-status and lesson-status for the read-only reporter. scene-edit owns every mutation of .strict-spec-driven/scenes/ through named semantic arguments, reconciling .strict-spec-driven/scenes/INDEX.yaml inside the same transaction as the scene file write, so the index group and the canonical nested path can never disagree with the scene artifact stored beneath them. scene-status reads the index and the scene files and reports without mutating anything.
  - Because the scene schema keys main_flow and exception_flows by stable step id and the index groups by a free-form area key that is also the subdirectory name, the command's argument surface addresses steps and scenes by id rather than by position. Every write merges field by field against the recorded artifact, so editing a step's action leaves its covered_by entries and its position untouched, and adding a covered_by entry leaves the step's other coverage references in place.
  - A delta scene gets its own registered schema rather than reusing scene/v1, because a delta must be able to express less than a whole scene and must be able to retire a step. That schema lands before the generator code that validates against it, and change-level delta scene authoring is then added to the existing generate command as a new artifact selector, so a change carries scene operations under .strict-spec-driven/changes/<change>/scenes/ the way it already carries specs/ and tech/ and reuses generate's existing container-creation, rollback, and structured-result behavior.
  - The scene-state inventory family already exists and declares every operation not-applicable with a recorded reference side effect naming this planned change as the one that flips it. This change revises that entry to declare create, update, named_remove, and delete as cli-owned with scene-edit as the owner, adds the change-level delta scene path pattern, and regenerates src/embedded-templates.ts in the same transaction, which is what makes yaml-surface-list, yaml-surface-show, and yaml-authoring-protocol report the family without any per-surface code change.
  - 'MCP exposure is declarative: src/mcp/inventory.ts maps a CLI command name to a tool entry with a safety class, and the tool description is derived from the shared command-metadata registry. scene-edit is registered as a write-class tool and scene-status as a read-class tool, so the MCP mutation coverage follows from the command metadata rather than from hand-written tool text. Because the metadata registry derives an authoring command''s artifact assets from the inventory''s declared CLI owners rather than restating them per command, the inventory edit lands before the metadata entries.'
  - Dogfooding runs last among the implementation tasks, after the command and the surface projections work, because CLI-only authoring forbids hand-writing the scene and because the point of the exercise is to let a real end-to-end workflow scene expose contract gaps the minimal example cannot. The scene describes a strict change moving from propose through archive, which necessarily names covering requirements in more than one spec area.
decisions:
  two-commands-not-one:
    decision: Ship exactly two commands, scene-edit for every mutation and scene-status for read-only reporting, rather than a create/list/show/edit/obsolete command family.
    rationale: The planned change details name one authoring command and one read-only status command, and spec-edit and tech-edit already prove a single-writer command carries create, incremental update, named removal, and deletion without splintering. A five-command family would widen the surface this change is scoped to deliver and add four more command-metadata entries and MCP cells with no behavior the two commands do not already own.
  address-by-id-not-position:
    decision: Address flow steps and scene entries by their stable ids in every argument, and never by ordinal position.
    rationale: The scene schema makes the step key the merge identity a delta scene resolves against, so a positional argument would let a reordering silently retarget a later delta scene write at a different step. Id addressing also makes each write idempotent, which is the property the CLI-only protocol relies on when an agent restates a partially applied edit.
  index-reconciled-in-same-transaction:
    decision: Reconcile .strict-spec-driven/scenes/INDEX.yaml inside the same transaction as every scene file write, and create the scenes directory and its index on the first scene rather than at init.
    rationale: The scenes-index schema requires at least one area holding at least one scene, so an index written ahead of a scene is invalid by its own contract, and init scaffolding one would create the empty container the artifact-creation-persists-meaningful-state-only rule forbids. Writing both in one transaction is also the only way a failed write cannot leave an index entry pointing at a scene file that does not exist.
  delta-scene-has-its-own-schema:
    decision: Register templates/strict-spec-driven/schemas/delta-scene.yaml with ADDED, MODIFIED, and REMOVED operation groups mirroring delta-spec, and land it before the generator code that validates against it.
    rationale: 'A delta needs to express less than a whole scene and needs to express step retirement, and scene/v1 can do neither: it makes every scene section required, and its recorded merge rule leaves a main-scene-only step untouched, which is precisely the absence of removal semantics. Landing the schema first is required by the contract-first-scope-changes MUST rule, which forbids implementation code widening a workflow contract ahead of the artifact it depends on.'
  delta-scene-on-generate:
    decision: Add delta scene authoring as a new artifact selector on the existing generate command instead of a separate change-level scene command.
    rationale: generate already owns change-planning-state and change-delta-state, including the atomic first-write container creation and the rollback that leaves no change behind after a rejected call. A second change-artifact writer would have to reimplement that behavior and would split the change-delta-state family across two owning commands, which the mutation inventory records per family.
  status-narrows-by-area-and-scene:
    decision: scene-status narrows with an --area selector and a --scene selector, defaulting to the full index when neither is supplied.
    rationale: The area key is already the index group and the subdirectory name, so it is the one grouping the artifact family itself guarantees exists, and lesson-list proves a category-style selector is the usable narrowing axis at volume. A scene selector is needed separately because the step-level coverage detail is only readable one scene at a time without flooding the output.
  status-reports-unresolved-coverage-without-blocking:
    decision: scene-status reports an unresolvable covered_by reference as a distinct per-step state alongside covered and waived, and exits zero.
    rationale: The coverage-gap diagnostics that block ready and verify are the merge-and-gate-scene-coverage planned change's declared scope, so a blocking exit code here would decide that change's contract from outside it. Exiting zero also keeps scene-status usable as a survey command while a scene is still being authored, which is when an unresolved reference is most likely to be present legitimately.
  verify-validates-delta-scenes-without-gating-coverage:
    decision: verify schema-validates every delta scene a change carries, but does not gate on whether a scene step names a covering requirement.
    rationale: Without validation a delta scene would be checked only by the command that wrote it, so a hand-damaged artifact would reach archive unchecked - the same exposure delta specs and delta tech are already validated against. Coverage-gap gating is a different check and is the declared scope of merge-and-gate-scene-coverage, so validating the artifact here does not pre-empt that change while still making the delta a real lifecycle participant.
alternatives:
  - option: Reuse strict-spec-driven/scene/v1 unchanged as the delta scene contract, on the grounds that the shipped scene schema already states the delta merge rule in its own description.
    reason: Rejected on two counts. scene/v1 requires area, status, actors, preconditions, a non-empty main_flow, and a non-empty exception_flows, so a delta adding one covering reference to one step would restate every required section it does not intend to change. And the merge rule already recorded in scene.yaml leaves a step id present only in the main scene untouched, so a delta reusing scene/v1 could never retire a step at all.
  - option: Let scene-status exit non-zero when a step's covered_by names a spec or requirement that does not resolve.
    reason: Rejected because the coverage-gap diagnostics that block ready and verify are the merge-and-gate-scene-coverage planned change's declared scope, so a blocking exit code here would pin that change's contract from outside it. It also makes scene-status unusable as a survey command while a scene is still being authored, which is exactly when an unresolved reference is most likely to be legitimately present.
  - option: Have scene-edit rewrite the whole scene file from the supplied arguments on every call.
    reason: A whole-file rewrite makes every edit destructive to any field the caller did not name, which is exactly the non-destructive write semantics the planned change requires tests for, and it would make a partially applied agent edit unrecoverable rather than idempotent.
risks:
  - A new artifact family must be registered on every agent-facing surface, and a missed registration fails a shipped MUST check rather than degrading quietly.
  - The blocking coverage gate measures src line coverage against a fixed threshold of 78, and this change adds a large amount of new src code at once, so thin tests fail the gate as a coverage number rather than as a located test failure.
  - The first real scene is expected to reveal contract gaps, and a revealed gap in the shipped scene schema forces a decision between widening this change's scope and deferring the gap to a sibling planned change.
  - Flipping the scene-state inventory family to cli-owned makes the dedicated inventory check assert that every named owner is a registered command, so the inventory edit and the command registration must land together or the check fails.
  - A registered delta-scene schema is not live until the artifact generator's normalizer copies its fields, which this project has hit before, so schema registration alone is not evidence the delta scene selector works.

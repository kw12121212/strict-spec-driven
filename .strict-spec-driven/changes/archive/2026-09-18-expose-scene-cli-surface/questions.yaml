change: expose-scene-cli-surface
open: []
resolved:
  - id: requirement-problem
    question: What is concretely going wrong today, and for whom?
    context: 'Why this is asked: the change is planned against a need, and the need lives only with the requester. A "problem" here means what someone does or suffers today — not a feature that is missing. If the answer names a button, a field, a page, or an endpoint, it is a solution, and the underlying problem is still unstated. What a sufficient answer contains: who is affected, what they do today instead, and how often. Worked example: "every Monday one person spends forty minutes copying order rows into a spreadsheet to send the weekly report". What it changes: this becomes the proposal''s why, and it decides whether the change is worth making.'
    answer: The scene contract shipped by define-scene-contract is currently unreachable. CLI-only YAML authoring forbids an AI workflow from hand-writing a scene, and no command owns a scene write, so no project - including this one - can author a scene at all. The author of a new project's specs is still asked for requirements immediately, still skips describing who acts, under what preconditions, and what happens when the main flow fails, and the requirement set still ends up with systematic holes that depend on a human noticing them. Every reader downstream of those specs is affected. Replayed from the scene-driven-requirements milestone goal and details and from the planned change details.
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: requirement-outcome
    question: What observable difference proves the problem is solved?
    context: 'Why this is asked: without a success condition, nobody can tell afterwards whether the change worked. "Observable" means someone outside the system can check it without reading the code. What a sufficient answer contains: what a person will see, or no longer have to do, once this is done. Worked example: "the report is in the manager''s inbox on Monday morning without anyone assembling it". What it changes: this becomes the delta spec''s scenarios and the acceptance evidence at review time.'
    answer: 'A project can author a scene through the strict CLI, and scene status reports every scene step as covered or as a named gap. Concretely for this change: scene-edit creates, incrementally updates, removes a named step or index entry, and deletes a whole scene; scene-status reports scenes, steps, and coverage state and narrows its output; generate writes a change-level delta scene; yaml-surface-list, yaml-surface-show, yaml-authoring-protocol, the MCP tool inventory, and inventory/yaml-mutation-surfaces.yaml all report the scene family with real mutation coverage; and this repository has authored its own first real scene through the new command, crossing more than one spec area, with scene-status reporting its step coverage. The archive merge and the ready/verify coverage gate are delivered by merge-and-gate-scene-coverage. Replayed from the milestone done_criteria and the planned change details.'
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: requirement-trigger
    question: Why now — what forced this?
    context: 'Why this is asked: work that nothing forced is the work most often thrown away later. This question catches a request that sounds reasonable but has no real driver behind it. What a sufficient answer contains: the concrete event, deadline, incident, or cost that made this surface now, or an honest statement that nothing did. Worked example: "the report was missed last month and it was raised with the team". What it changes: a change with no trigger is a candidate for deferral, and the answer is weighed at review before archive.'
    answer: define-scene-contract completed, which makes this the earliest point in the milestone where a command can be built on a registered contract and the earliest point where a real scene can exist. The milestone is ordered contract-first precisely so the command surface lands before archive merge and coverage gating consume it and before skill routing names it. roadmap-recommend reports the two sibling planned changes merge-and-gate-scene-coverage and route-requirements-through-scenes as skipped with dependency-incomplete, so this is the only eligible work in the roadmap and nothing else in the milestone can start until it ships. Replayed from the milestone details and the roadmap-recommend output.
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: requirement-non-goals
    question: What must explicitly not change?
    context: 'Why this is asked: the requester knows which nearby behavior other people depend on, and the agent does not. A "non-goal" is something the change must leave alone even though it sits close to the work. What a sufficient answer contains: the behavior, setting, or output that must survive untouched, and who relies on it. Worked example: "do not change the saved filters — several people rely on their own". What it changes: these become the proposal''s unchanged_behavior items, which review checks the finished result against.'
    answer: No archive merge of delta scenes into main scenes and no coverage-gap diagnostics blocking ready or verify - both belong to merge-and-gate-scene-coverage, so ready and verify exit codes must remain unaffected by scene coverage state. No scene-first routing in bundled skills or operator documentation, which belongs to route-requirements-through-scenes. No change to main-spec.yaml or to the shape of an existing main spec requirement, and no existing spec, standard, or change artifact may become invalid. Existing specs, this repository, and existing external projects are not required to author scenes, and a repository holding no scene artifact must observe no new diagnostic and no new required field. No workflow config switch turning scene coverage checking on or off. No generated human-readable scene document. init must scaffold the same files as before, with no scenes directory and no empty scene index. Every existing CLI command keeps its flags, output keys, and exit-code meaning. Replayed from the milestone scope.out and notes and the planned change details.
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: requirement-interpretation
    question: Which reading of the request is intended, where more than one is possible?
    context: 'Why this is asked: a short request usually admits several readings, and building the wrong one is indistinguishable from building nothing. What a sufficient answer contains: the reading that is meant, stated plainly enough to rule the others out — or a statement that only one reading exists and what it is. Worked example: "export means the version sent to the manager, not the one I read myself". What it changes: this fixes the scope boundary before any code is written, and settles disputes about what was asked for.'
    answer: 'The intended reading is command-surface-only. This change ships a scene authoring command, a read-only scene status command with output narrowing, change-level delta scene generation, the command-metadata documentation for each, the scene-state inventory family flipped to cli-owned with named owners, the matching MCP tool inventory cells, a delta spec against cli-foundation, and this repository''s own first real scene as dogfooding evidence. It does not ship archive merge, coverage gating, or skill and documentation routing, each of which is a named sibling planned change. Two narrower readings were rejected: shipping only scene-edit and deferring scene-status, which would leave the authored scene unreadable and nothing for the gating change to build on; and deferring the dogfooding scene, which the planned change names explicitly as the first point where a real scene can exist and expects to reveal contract gaps the minimal example cannot. Replayed from the planned change details and the milestone scope.'
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: delta-scene-artifact-contract
    question: Does a change-level delta scene validate against the existing strict-spec-driven/scene/v1 schema, or does it need its own registered delta-scene schema the way delta-spec sits beside main-spec?
    context: 'Impact: this decides which schema the new generate delta scene selector validates against, whether templates/strict-spec-driven/schemas/ gains a third scene-family schema plus a minimal example, which path patterns the inventory records, and what the later merge-and-gate-scene-coverage change merges. It does not affect scene-edit, scene-status, or the live scene contract already shipped. Evidence for reuse: the shipped templates/strict-spec-driven/schemas/scene.yaml states the delta merge rule inside its own description - covered_by entries merge as a set keyed by the spec_id and requirement_id pair, a step id present in both replaces the main scene step content and its position, and a step id present only in the main scene is left untouched - and the completed define-scene-contract change registered exactly two scene-family schemas, while the milestone scope names only the scene and scenes-index families. Evidence against reuse: scene/v1 requires area, status, actors, preconditions, a non-empty main_flow, and a non-empty exception_flows, so a delta scene that only adds one covering reference to one existing step would have to restate all of those required sections, which the delta-spec contract avoids by giving deltas their own shape with ADDED, MODIFIED, and REMOVED operation groups. Recommendation: register a delta-scene schema with operation groups mirroring delta-spec, plus one minimal example, and record it as part of this change''s in-scope work. Options: (a) register a delta-scene schema - recommended, because reusing scene/v1 forces every delta to restate required sections it does not intend to change, which is exactly the destructive whole-artifact restatement this change''s non-destructive write semantics exist to prevent; (b) reuse scene/v1 unchanged - smallest surface and consistent with the merge rule already living in scene.yaml, but makes a one-step delta carry a full scene body; (c) defer delta scene generation entirely to merge-and-gate-scene-coverage - contradicts this planned change''s stated scope, which names change-level delta scene generation explicitly.'
    answer: 'Register a dedicated delta-scene schema with ADDED, MODIFIED, and REMOVED operation groups mirroring delta-spec, plus one minimal valid example, and regenerate the embedded bundle in the same transaction as the schema and sample writes. Reusing scene/v1 is rejected for two reasons: it requires area, status, actors, preconditions, a non-empty main_flow, and a non-empty exception_flows, so a delta adding one covering reference to one existing step would have to restate every required section it does not intend to change; and the merge rule already recorded in scene.yaml leaves a step id present only in the main scene untouched, so a delta reusing scene/v1 could never retire a step at all. Deferring delta scene generation entirely was rejected because this planned change names it in scope, so deferring it would require editing the roadmap planned change first. Because the delta-scene schema is a workflow contract, contract-first-scope-changes requires it to land before the generator code that depends on it.'
    status: resolved
    kind: technical
    answered_by: human
  - id: scene-status-unresolved-coverage-exit-code
    question: When a flow step's covered_by entry names a spec id or requirement id that does not resolve against the recorded main specs, should scene-status report it and exit zero, or exit non-zero?
    context: 'Impact: this decides scene-status''s exit-code contract and its command-metadata exit-code documentation, and it constrains the later merge-and-gate-scene-coverage planned change, which owns the coverage-gap diagnostics that block ready and verify. It does not affect scene-edit, the scene schema, or the delta scene contract. Evidence: inventory/yaml-mutation-surfaces.yaml records as a scene-state reference side effect that every covered_by entry names a spec id and a requirement id which must resolve against the recorded main specs, so an unresolvable reference is already declared a defect rather than a tolerated state. But the milestone done_criteria assign the blocking behavior to a different sentence - ready and verify exit non-zero with a coverage-gap diagnostic naming the runnable remedy command - and that criterion belongs to merge-and-gate-scene-coverage, not to this change. tech-status and lesson-status are the read-only precedents in this repository and should be consulted for whether a reporting command in this codebase exits non-zero on a reported defect. Recommendation: scene-status reports an unresolvable reference as a distinct per-step state alongside covered and waived and exits zero, leaving every blocking exit code to the gating change that owns it, so this change cannot pre-decide that change''s behavior from outside it. Options: (a) report and exit zero - recommended, keeps the read-only command purely diagnostic and keeps the gate in one place; (b) exit non-zero immediately - surfaces the defect sooner but pins the gating contract before the change that owns it is proposed, and makes scene-status unusable as a survey command while a scene is mid-authoring; (c) add an opt-in strict flag that exits non-zero - adds a flag whose only consumer would be the later gating change, which is a speculative feature under the YAGNI code rule.'
    answer: scene-status reports an unresolvable covered_by reference as a distinct per-step state alongside covered and waived, and exits zero. Every blocking exit code stays with merge-and-gate-scene-coverage, which owns the coverage-gap diagnostics that block ready and verify, so this change does not pre-decide that change's behavior from outside it, and scene-status remains usable as a survey command while a scene is still being authored. Exiting non-zero immediately was rejected because it pins the gating contract before the owning change is proposed. An opt-in strict flag was rejected because its only consumer would be that later change, which the YAGNI code rule forbids as a speculative feature.
    status: resolved
    kind: technical
    answered_by: human
  - id: dogfooding-exception-flow-branch-point
    question: Should an exception flow declare which main-flow step it branches from?
    context: 'Impact: this would change the scene schema shape, which this change''s scope explicitly excludes, and it affects no CLI command, delta artifact, or surface projection shipped here. Evidence: authoring this repository''s first real scene revealed the gap. The scene has a ten-step main flow and four exception flows, and each trigger implies a branch point - regression-or-coverage-fails branches from run-regression, verification-refuses-archive from verify - but the contract records only the trigger text, so the branch point is inferable by a reader rather than stated. The minimal valid example could not reveal this, because it carries a single main-flow step where the branch point is unambiguous. This is exactly the class of finding the planned change expected dogfooding to surface.'
    answer: 'Recorded as a finding and deliberately not fixed here. Widening the scene schema is listed out of scope for this change, and the contract-first ordering the milestone follows means a scene schema change belongs in its own change against contracts-yaml-artifacts rather than riding along on the command surface. The gap is not blocking: every step is still addressable and coverage still reports correctly, and a reader can infer the branch point from the trigger text. It should be raised as a follow-up planned change in the scene-driven-requirements milestone or after it.'
    status: resolved
    kind: technical
    answered_by: assumption
  - id: cli-owners-should-name-only-mutating-commands
    question: Should the inventory's cli_owners field be pinned to naming only commands that mutate the family, given that some existing families list their read-only reporters there?
    context: 'Impact: this would change inventory/yaml-mutation-surfaces.yaml entries for families this change does not touch, and it changes what yaml-surface-show and yaml-authoring-protocol report as the owning command of each operation. It does not affect any command, schema, or delta artifact shipped here. Evidence: this change declares scene-state''s cli_owners as scene-edit and generate only, deliberately excluding the read-only scene-status, because the per-operation projection would otherwise report that scene-status owns delete. The existing lessons-state family lists lesson-list, lesson-show, and lesson-status among its cli_owners, so the two families now follow different conventions. Options: (a) leave the inconsistency and report it - recommended; (b) promote the narrow reading to a MUST rule in this change; (c) widen scene-state to match lessons-state, which would make the scene family''s own projection misreport its delete owner.'
    answer: Left as a reported finding rather than promoted to a rule in this change. The recorded lesson 'Promoting a repeated fix to a MUST rule makes every existing instance a violation' has three occurrences in this project, and pinning the narrow reading now would immediately make lessons-state a violation of a standard this change introduced, dragging unrelated families into its scope. scene-state keeps the accurate narrow declaration because a projection that names a read-only reporter as the owner of delete is wrong on its face. Reconciling the other families belongs in its own change.
    status: resolved
    kind: technical
    answered_by: assumption

    Add one concise rule to existing YAML Writing Rules sections in core skills that directly create
    or edit strict change YAML.
decisions:
  lightweight-yaml-rule:
    decision: >-
      Use a single YAML Writing Rules bullet instead of adding Schema Lookup sections or
      command-block entries.
    rationale: >-
      The user requested the lightweight form, and the existing schema lookup CLI is already
      documented elsewhere; the skill prompt only needs to nudge agents away from missing templates
      directories when fields are unclear.

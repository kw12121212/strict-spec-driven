schema: strict-spec-driven/delta-tech/v1
schema_version: 1
artifact_type: delta_tech
schema_file: templates/strict-spec-driven/schemas/delta-tech.yaml
target_standard: yaml-first-artifacts
operations:
  ADDED:
    contract-first-families-declare-no-unshipped-operation:
      strength: MUST
      statement: A repository-owned artifact family whose registered schema ships in a change that ships no command writing it MUST declare every mutation operation as not-applicable, MUST name no CLI owner and no direct-write path, and MUST record a reference side effect naming the later change that will flip the operations a command comes to own.
      rationale: 'Every other classification asserts something the repository has not delivered: cli-owned with no named owner is refused by the inventory check as an unfalsifiable claim, direct-write names code that does not exist, and human-only reads as a deliberate policy that the family''s YAML is hand-edited, which the very next planned change contradicts. The inventory check can refuse the first two but cannot tell a truthful not-applicable from an abandoned one, so naming the change that will flip the state is what stops the classification from outliving the reason for it.'
      enforcement:
        method: review
        detail: bun run check:yaml-inventory already refuses a cli-owned operation with no registered owner and a direct-write path with no owner, and test/suites/yaml-operation-matrix.ts already requires every inventoried family to declare a reason for each not-applicable dimension; what review adds is confirming the reference side effect names the change that will flip the operations.
      examples:
        good:
          - scene-state declares create, update, named_remove, and delete as not-applicable with cli_owners and direct_write_paths empty, and records a reference side effect naming expose-scene-cli-surface as the change that flips create and update to cli-owned.
        bad:
          - A family declaring create as human-only while a named follow-up change is about to make a command own it, which reads to every later reader as a decision that the family's YAML is hand-edited.
  MODIFIED: {}
  REMOVED: {}

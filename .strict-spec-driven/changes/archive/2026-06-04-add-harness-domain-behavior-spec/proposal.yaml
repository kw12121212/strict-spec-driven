schema: strict-spec-driven/change-proposal/v1
schema_version: 1
artifact_type: change_proposal
schema_file: templates/strict-spec-driven/schemas/change-proposal.yaml
change:
  id: add-harness-domain-behavior-spec
  status: proposed
summary:
  what:
    - >-
      Add a registered harness command-domain behavior spec that captures existing harness
      observable behavior.
  why:
    - >-
      Milestone 0014 backfills self-hosted spec coverage so harness behavior from milestone 0013 is
      durable instead of living only in tests and HARNESS documentation.
scope:
  in:
    - >-
      Create .strict-spec-driven/specs/harness/domain-behavior.yaml for harness-infer,
      harness-doctor, harness-plan, harness-start, harness-stop, harness-status, harness-logs,
      harness-scripts, and harness-session observable behavior.
    - Register the new harness domain spec in .strict-spec-driven/specs/INDEX.yaml.
    - >-
      Move harness implementation, scripts, skills, examples, and tests mapping entries from
      cli-foundation to the harness domain spec without changing command behavior.
  out:
    - Changing CLI behavior, schemas, command names, skill prompts, or harness runtime semantics.
    - >-
      Rewriting unrelated cli-foundation requirements beyond removing mapping entries that move to
      the harness domain spec.
unchanged_behavior:
  - >-
    All strict CLI and harness command behavior remains unchanged; this change only adds and
    re-points spec coverage.
roadmap:
  milestone: 0014-self-hosted-spec-coverage-backfill
  planned_change: add-harness-domain-behavior-spec

schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: expose-mcp-mutating-tools
approach:
  - >-
    Extend the MCP inventory so tools can carry read, write, lifecycle, release, and destructive
    safety classes plus explicit mutation metadata.
  - >-
    Represent mutating tools as table-driven definitions that share the existing command runner and
    output envelope with read-only tools.
  - >-
    Use zod input schemas at MCP registration time so invalid inputs are rejected before invoking
    the CLI.
  - >-
    Keep safety by delegation: failed strict preconditions, archive gates, and harness lifecycle
    checks come from existing CLI behavior.
decisions:
  mutating-cli-delegate:
    decision: >-
      Mutating MCP tool handlers delegate to the existing strict CLI command surface under the
      configured project root.
    rationale: >-
      Delegation prevents a second mutation engine from drifting away from strict YAML validation,
      roadmap sync, archive, and harness guardrails.
  safety-class-inventory:
    decision: >-
      Every mutating tool records a conservative safety class and mutates=true in the server-owned
      inventory and SDK metadata.
    rationale: >-
      MCP hosts need stable metadata to present confirmation boundaries before project state
      changes.
  apply-wording:
    decision: >-
      The apply-backed MCP tool is named mark_next_task_complete and described as task-state
      mutation, not implementation work.
    rationale: >-
      The existing apply command only advances tasks.yaml status, so the MCP surface must not imply
      that code was written or verified.
alternatives: []
risks: []

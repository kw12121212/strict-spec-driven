schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: port-ship-workflow-to-strict
approach:
- 'The `ship` subcommand accepts a change name, expands it to an archived directory under `.strict-spec-driven/changes/archive/` (using `*-<name>` glob if the bare name is not found directly), reads `proposal.yaml`
  from that directory for the change summary, calls the existing roadmap-status logic to snapshot milestone state, and emits a single deterministic JSON object to stdout. The `strict-spec-ship/SKILL.md`
  is rewritten with step-by-step workflow instructions: (1) run `ship <name>` to get verification JSON, (2) use `changeName` and `proposalSummary` to construct a conventional commit message, (3) run `git
  add` for the change''s implementation files, (4) run `git commit -m "<message>"`, (5) display the `git push` command and confirm with the operator before executing. The automated skill content check in
  `src/skills.ts` follows the existing pattern for core, planning, and migration skills: it reads `strict-spec-ship/SKILL.md` and validates that the command block references `strict-spec-driven.js ship`
  and that the body includes `.strict-spec-driven/` workflow guidance.'
decisions:
  '1':
    decision: '1.'
    rationale: '**CLI produces verification JSON; skill prompt handles git**: The `ship` subcommand stays deterministic and testable. Git operations (add, commit, push) remain in the skill prompt where
      the operator can review staged files and the commit message before execution. This avoids bypassing the repository hook system. 2. **Archive lookup with date-prefix expansion**: `ship <name>` first
      checks for an exact match under `archive/<name>`, then searches `archive/*-<name>`. If multiple date-prefixed matches exist, the command exits non-zero with an ambiguity error. This is consistent
      with how `modify` handles archived targets. 3. **Roadmap snapshot in ship JSON**: Including the roadmap status snapshot in the ship JSON output allows the skill prompt to include milestone context
      in the commit message without requiring a separate `roadmap-status` call.'
alternatives:
- option: Full git automation in the CLI
  reason: Rejected — git commits require operator review of staged files and the commit message. Keeping git in the skill prompt preserves that checkpoint without bypassing the hook system or creating surprises.
- option: Reuse archived change output for ship JSON
  reason: Rejected — the archive command output is written at archive time; roadmap state may have changed since then. The `ship` subcommand fetches current roadmap state at ship time rather than replaying
    stale archived output.

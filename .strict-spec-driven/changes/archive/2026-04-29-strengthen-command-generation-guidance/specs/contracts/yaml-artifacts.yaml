schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: contracts-yaml-artifacts
mapping:
  implementation:
    - skills/strict-spec-propose/SKILL.md
    - skills/strict-spec-brainstorm/SKILL.md
    - skills/strict-spec-auto/SKILL.md
    - skills/strict-roadmap-propose/SKILL.md
    - skills/strict-roadmap-recommend/SKILL.md
  tests:
    - test/suites/foundation-and-fixtures.ts
operations:
  ADDED: {}
  MODIFIED:
    skill-proposal-generation-uses-parameterized-cli:
      strength: MUST
      statement: >-
        The system MUST guide proposal-generating skills to create strict change artifacts by
        generating and executing parameterized strict CLI commands directly; those skills MUST NOT
        instruct agents to hand-author change YAML artifacts or preferred-path JSON payload files,
        and SHOULD show one full-artifact invocation per artifact or per target delta spec when the
        CLI supports grouped named arguments.
      scenarios:
        proposal-skill-requires-cli-generation:
          - GIVEN: a strict proposal skill needs to populate change artifacts
          - WHEN: the skill instructions describe the artifact generation workflow
          - THEN: >-
              the instructions require agents to generate and run strict CLI invocations with named
              arguments
          - AND: >-
              the instructions prohibit hand-authored change YAML artifacts and preferred-path JSON
              payload files
          - AND: the examples prefer full-artifact commands for tasks, questions, and delta specs
  REMOVED: {}

schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: cli-foundation
mapping:
  implementation:
    - src/cli/cmd-generation.ts
    - src/scaffold.ts
  tests:
    - test/suites/foundation-and-fixtures.ts
operations:
  ADDED: {}
  MODIFIED:
    cli-propose-generation-uses-named-arguments:
      strength: MUST
      statement: >-
        The system MUST provide proposal population commands that accept artifact content through
        named CLI arguments, including repeated grouped task, question, mapping, scenario, and
        requirement arguments in a single invocation for artifacts that contain keyed collections,
        instead of requiring a JSON payload file for the preferred agent workflow.
      scenarios:
        proposal-flags-populate-proposal-artifact:
          - GIVEN: a strict change scaffold already exists
          - AND: >-
              an agent supplies proposal summary, scope, and unchanged behavior through named CLI
              flags
          - WHEN: the proposal population command is executed
          - THEN: the target proposal.yaml is written under the change directory
          - AND: the written artifact validates against the strict change proposal schema
        repeatable-flags-populate-lists:
          - GIVEN: an artifact field accepts multiple values
          - WHEN: the corresponding named flag is repeated in one command invocation
          - THEN: the generated strict YAML artifact preserves each supplied value in order
        grouped-named-arguments-populate-full-artifacts:
          - GIVEN: a strict change scaffold already exists
          - AND: >-
              an agent supplies multiple task, question, mapping, scenario, or delta requirement
              groups through named CLI flags in one command
          - WHEN: the artifact population command is executed
          - THEN: the target strict YAML artifact includes all supplied grouped entries
          - AND: repeated equivalent keyed content remains idempotent
    cli-propose-generation-preserves-scaffold-behavior:
      strength: MUST
      statement: >-
        The system MUST preserve the existing propose scaffold behavior while adding scripted
        artifact population as a follow-up workflow step and may reuse an existing change directory
        tree only when that tree contains no files.
      scenarios:
        existing-propose-command-still-scaffolds:
          - GIVEN: a valid kebab-case change name that does not already exist
          - WHEN: strict-spec-driven propose is executed without a generation input
          - THEN: the command creates the standard strict change scaffold
          - AND: no artifact-specific population input is required
        empty-change-directory-can-be-scaffolded:
          - GIVEN: >-
              a valid kebab-case change name whose change directory already exists with only empty
              subdirectories
          - WHEN: strict-spec-driven propose is executed for that name
          - THEN: the command writes the standard strict change scaffold into that directory
          - AND: pre-existing empty subdirectories remain in place
        populated-change-directory-still-fails:
          - GIVEN: a valid kebab-case change name whose change directory already contains a file
          - WHEN: strict-spec-driven propose is executed for that name
          - THEN: the command exits non-zero with an existing-change collision
          - AND: existing artifacts remain unchanged
  REMOVED: {}

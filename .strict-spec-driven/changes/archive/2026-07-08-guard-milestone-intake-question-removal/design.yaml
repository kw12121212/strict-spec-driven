change: guard-milestone-intake-question-removal
approach:
  - Scope destructive intake-question replacement behind a dedicated flag inside the existing milestone authoring command. RoadmapMilestoneAuthorInput gains a resetIntakeQuestions boolean parsed from a new --reset-intake-questions CLI flag; mergeIntakeQuestions keys replacement off that flag instead of the global reset flag, so global --reset combined with --intake-question merges additively with the existing same-id conflict diagnostics. --reset-intake-questions with zero --intake-question arguments is a blocking diagnostic because intake_questions must stay non-empty. Usage text and the roadmap skill prompts describe the split so agents stop reaching for global --reset to touch intake questions.
decisions:
  scoped-reset-flag:
    decision: Introduce --reset-intake-questions as the only way to replace a milestone's intake_questions list; global --reset no longer affects intake questions.
    rationale: The global --reset is one switch across all list fields, so agents resetting scope or goal while adding one intake question silently wiped the rest; a field-scoped destructive flag makes intake-question removal an explicit, auditable operation while keeping scripts the owner of deterministic enforcement per the scripts-own-mechanics MUST rule.
  additive-merge-default:
    decision: Without --reset-intake-questions, --intake-question entries always merge additively; same-id content conflicts keep producing blocking diagnostics instead of being resolved by global --reset.
    rationale: Additive merge is the existing safe default; letting global --reset silently resolve intake-question conflicts by replacement was the deletion vector, so conflicts now always surface for explicit resolution.
  no-per-id-removal:
    decision: Do not add a per-id --remove-intake-question flag in this change.
    rationale: Explicit full-list replacement via --reset-intake-questions already expresses removal with the operator seeing the complete final list; per-id removal widens the command surface without new safety and can be proposed later if real usage needs it.
alternatives: []
risks: []

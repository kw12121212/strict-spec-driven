schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: ship-strict-installation-and-packaging
approach:
- 'Implement the change in three passes:'
- Expose strict installer entrypoints add explicit package scripts around `install.sh` for install, uninstall, and project-local variants keep installer-facing entrypoints aligned with the strict namespace
  instead of inheriting generic or legacy-facing names
- Harden the repository installer keep default and `--project` target selection deterministic preserve in-place registration from the source repository so packaged skills continue using their relative `scripts`
  and `templates` symlinks reject or surface legacy-name assumptions clearly instead of silently treating them as strict aliases
- Add install and packaging smoke coverage extend automated checks to exercise install and uninstall flows in addition to existing packaging validation verify bundled script and template links continue
  to resolve through the source-repo packaging layout cover deterministic failure diagnostics for broken symlinks or stale legacy install assumptions
decisions:
  build-on-the-existing-install-sh-surface-instead-of:
    decision: Build on the existing `install.sh` surface instead of replacing it with a new installer entrypoint, because the repository already has the right baseline shape for install and uninstall flow
      control.
    rationale: Build on the existing `install.sh` surface instead of replacing it with a new installer entrypoint, because the repository already has the right baseline shape for install and uninstall flow
      control.
  keep-package-script-entrypoints-strict-namespaced-so:
    decision: Keep package-script entrypoints strict-namespaced so installer-facing names remain distinguishable from legacy workflow names.
    rationale: Keep package-script entrypoints strict-namespaced so installer-facing names remain distinguishable from legacy workflow names.
  treat-install-and-uninstall-smoke-checks-as-repository-tests:
    decision: Treat install and uninstall smoke checks as repository tests rather than documentation-only manual steps, because later docs should describe already verified behavior.
    rationale: Treat install and uninstall smoke checks as repository tests rather than documentation-only manual steps, because later docs should describe already verified behavior.
alternatives:
- option: Document the existing `install.sh` flow without adding package-script wiring.
  reason: Rejected because the milestone explicitly calls for install and uninstall scripts and smoke-tested packaging behavior.
- option: Delay installer work until public docs are written.
  reason: Rejected because docs would then freeze unverified setup behavior.
- option: Copy skill files during installation instead of registering the source repository in place.
  reason: Rejected because the milestone notes require relative symlink expectations that stay valid without copying or dereferencing bundled assets.

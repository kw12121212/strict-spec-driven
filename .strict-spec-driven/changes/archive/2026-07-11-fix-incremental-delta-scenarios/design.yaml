schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: fix-incremental-delta-scenarios
approach:
  - Replace whole-requirement equality checks in delta-spec argument generation with a deterministic compatibility merge for non-removed requirements.
  - Treat strength and statement as immutable metadata; merge scenarios by stable id, preserve existing order, append new ids in command order, and reject conflicting same-id steps.
  - Add concise delta-spec generation guidance to agent-facing skills so reset remains an explicit whole-artifact rebuild operation rather than an append workaround.
decisions:
  merge-compatible-nested-scenarios:
    decision: Merge compatible nested scenarios while preserving conflicts for requirement metadata and same-id scenario content.
    rationale: This matches the keyed YAML structure, makes repeated CLI generation composable, and preserves non-destructive conflict safety.
alternatives: []
risks:
  - An overly permissive merge could hide real edits; exact metadata and same-id scenario comparisons keep those edits blocking.

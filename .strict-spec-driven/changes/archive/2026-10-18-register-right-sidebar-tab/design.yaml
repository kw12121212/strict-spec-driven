schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: register-right-sidebar-tab
approach:
  - 'Register the strict documents tab through the pinned dsh sidebar-right contract inside plugins/dsh-strict-spec/: the client entry declares the sidebarRightTabs service, registers the tab type — the plugin''s package id as implementation identity, a strict-spec-documents page kind, a thunked title, and one guide entry — inside ctx.effect, and registers the body in the sidebar.right.pane.tab keyed slot through the declaration-aware ctx.slots.inject path. The body registration carries a per-Session sources factory: each Session surface''s tab receives its own sessionId, a viewer stores instance, and an effect-free tab controller that loads that Session''s workspace and is disposed on unmount, so switching the active Session closes the previous Session''s watches exactly as the planned change requires. The body itself stacks the archived shared DocumentTree and shared DocumentView within the pane width, the empty state and live refresh come from the discovery model the tree already consumes, and every new string lands in both the zh and en catalogs.'
decisions:
  two-stage-tab-registration:
    decision: 'The tab registers in the pinned host''s two stages: ctx.sidebarRightTabs.register inside ctx.effect declares the static type — id dsh-plugin-strict-spec, kind strict-spec-documents, no resource patterns, the default extension band, a thunked title, and one guide entry — and the body registers under the same id key in the sidebar.right.pane.tab keyed slot through ctx.slots.inject.'
    rationale: 'The pinned release''s shipped tabs register exactly this way (the session inspector and the plan preview are the precedents): stage one owns discoverability and addressing while stage two supplies the body per Session surface, and the declaration-aware inject path survives a fiber activating before the sidebar-right entry commits its slot declarations, which the dsh-plugin-client standard already requires.'
  session-bound-through-seat-factory:
    decision: The body's registration passes an inject factory that receives the sessionId of the Session surface rendering the tab and returns per-Session sources — a viewer stores instance and tab controller cached by sessionId in a plugin-owned map that the registration disposer clears.
    rationale: The right sidebar holds one docking surface per Session, so the Session binding arrives from the seat rather than a host service read; per-Session stores keep two mounted surfaces from coupling their loads, and clearing the cache on registration disposal stops ended fibers from leaking stores or watches.
  watch-teardown-through-default-unmount:
    decision: keepMounted stays unset so visited bodies unmount on Session switch and hide; the body's unmount effect disposes its tab controller, which closes that Session's directory and open-document watches, and live refresh continues through the discovery model's refresh coordinator while the body stays mounted.
    rationale: The planned change requires closing the previous Session's watches on switch; the host's default unmount-on-hide behavior delivers the teardown without plugin bookkeeping, while keepMounted true would hold the previous Session's watches open, violating the requirement the tab exists to satisfy.
  pane-width-stacked-body:
    decision: The tab body stacks the shared DocumentTree above the shared DocumentView in one vertical column sized to the pane width, the tree keeping its own loading, empty, and error conditions and the document view taking the remaining height.
    rationale: The right-sidebar pane is a narrow column beside the conversation, so the left page's side-by-side two-pane layout cannot fit; the shared components already render their own status conditions, so the body is layout only, and reusing them keeps one tree and one renderer across both entry points as the milestone decides.
  sidebar-right-type-only-dependency:
    decision: Add @deepseek-ai/dsh-client-ui-sidebar-right at the pinned 0.2.1-rc.2 release as a devDependency consumed only through type-only imports, declare sidebarRightTabs in the entry's inject export, and add the module to the manifest's dsh.client.inject list.
    rationale: ctx.sidebarRightTabs is a cordis service face the sidebar-right entry provides, so the fiber must declare it before reading or activation fails; the package's types are published at the pinned release, type-only imports erase from the bundle, and the manifest entry orders the plugin's load after the fibers providing the declared service, mirroring the api controller precedent the left page set.
  type-only-type-closure-dev-dependencies:
    decision: 'The change also adds @deepseek-ai/dsh-client-shortcuts at the pinned release as a second type-only devDependency: the sidebar-right package''s published .d.ts files import dsh-client-shortcuts/client for the guide entry''s commandId type, and tsc resolves that transitive type import from the plugin''s own node_modules, so the type-only contract dependency must declare the type closure of its published declarations alongside it.'
    rationale: The bundle gains no runtime require for either package (the bundle-shape suite asserts both in the type-only require list), but without the transitive declaration dependency the entry's contextual type-check against SidebarRightTabDefinition cannot resolve; declaring the closure keeps the pinned-contract verification the registration depends on working, and the rule is captured as delta tech so later type-only additions repeat it deliberately.
alternatives:
  - option: Auto-open the tab in every Session the operator switches to by calling ctx.sidebarRight.openTab on mounted changes
    reason: Opening always expands the right sidebar in the host's contract, so a plugin-driven auto-open would force the column open in every visited Session and override the per-Session layouts the host persists, while the planned change asks only for a guide entry that makes the tab discoverable.
risks:
  - 'The pinned rc''s sidebar-right contract is pre-stable: if the registry''s registration shape or the keyed slot''s inject factory signature drift from the published 0.2.1-rc.2 types, the registration must be re-verified against the installed release before the manual check passes.'
  - The desktop-profile leg of the manual check may not run in this environment; then review blocks on the missing evidence rather than passing silently, mirroring the accepted stance of the scaffold change.
  - Per-Session stores must be cleared when the registration disposes, or ended fibers would leak watches across plugin reloads.

schema: strict-spec-driven/change-proposal/v1
schema_version: 1
artifact_type: change_proposal
schema_file: templates/strict-spec-driven/schemas/change-proposal.yaml
change:
  id: enrich-scaffold-samples
  status: proposed
summary:
  what:
    - Add guiding sample entries to scaffold YAML templates so AI agents can understand expected content shapes and generate correct artifacts.
  why:
    - Current scaffold templates use empty arrays and minimal placeholder text, giving AI insufficient context about what each field should contain.
scope:
  in:
    - Add sample entries to proposal.yaml scaffold (scope.in, scope.out)
    - Add sample entries to design.yaml scaffold (alternatives, risks)
    - Add sample entries to questions.yaml scaffold (open, resolved)
    - Add sample entries to roadmap/INDEX.yaml scaffold (milestones)
    - Add sample entries to specs/INDEX.yaml scaffold (specs)
  out:
    - Modifying the examples/ directory
    - Modifying schema files
    - Modifying scaffold.ts logic
    - Adding more than 1-2 samples per field
unchanged_behavior:
  - Scaffold template schema identity fields remain unchanged.
  - The scaffold.ts copy-and-replace mechanism continues to work identically.
  - Existing examples/ reference files remain the authoritative minimal examples.

schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: add-roadmap-recommend-command
approach:
  - >-
    Introduce a deterministic roadmap recommendation layer in the CLI that reuses the existing
    roadmap loading and status derivation pipeline, filters status output to eligible standalone
    missing planned changes, reports explicit skip reasons for ineligible entries, and returns the
    first eligible candidate in canonical roadmap order. Keep the command output as JSON so skills
    can consume it without reparsing human-readable tables. Update strict-roadmap-recommend to
    execute the command first and treat its selected candidate as authoritative for the recommend
    step.
decisions:
  deterministic-cli-selection:
    decision: >-
      The next roadmap recommendation is selected by a CLI subcommand instead of by skill prompt
      traversal.
    rationale: >-
      Candidate eligibility depends on existing roadmap validation, workflow state, dependency
      completion, split-file ownership, and active conflict rules. These are deterministic mechanics
      already modeled by the CLI, so centralizing them reduces prompt surface area and makes
      recommendation behavior testable.
alternatives: []
risks: []

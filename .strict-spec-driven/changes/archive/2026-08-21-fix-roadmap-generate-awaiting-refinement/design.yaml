schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: fix-roadmap-generate-awaiting-refinement
approach:
  - Extend the roadmap milestone authoring candidate to carry forward the validated existing awaiting_refinement mapping when present.
  - Exercise the compiled CLI end to end by deferring a milestone, editing only its goal, and comparing the complete awaiting_refinement mapping before and after.
decisions:
  preserve-at-author-boundary:
    decision: Preserve awaiting_refinement in buildArtifact, where roadmap-generate reconstructs the milestone candidate.
    rationale: That reconstruction is the first layer that drops the field; preserving it there keeps validation and atomic synchronization unchanged and avoids widening defer/refine semantics.
alternatives:
  - option: Teach roadmap synchronization to recover a missing awaiting_refinement mapping after roadmap-generate drops it.
    reason: The staged candidate has already discarded the data, so synchronization has no authoritative value to recover and should not infer workflow state.
risks:
  - A future optional milestone field could be omitted by the same explicit reconstruction pattern unless regression coverage exercises non-list metadata.

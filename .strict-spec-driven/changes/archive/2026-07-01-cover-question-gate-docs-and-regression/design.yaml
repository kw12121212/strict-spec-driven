change: cover-question-gate-docs-and-regression
approach:
  - Treat the already-added question-gate behavior as the product surface, then close documentation and regression gaps without changing schemas or candidate selection.
decisions:
  docs-and-regression-only:
    decision: Implement this change through user documentation, localized counterparts, and regression assertions over existing CLI and skill behavior.
    rationale: The prior changes established the workflow contract, deterministic readiness checks, and skill prompts; this roadmap item asks for proof and user-facing explanation, not new runtime behavior.
  fixture-plus-self-hosted-coverage:
    decision: Exercise both repository self-hosted artifacts and a copied real-project fixture.
    rationale: Self-hosted checks prove bundled docs, skills, and specs are current; copied fixture checks prove generated artifacts and ready/resolve behavior work outside the repository's active workflow state.
alternatives: []
risks: []

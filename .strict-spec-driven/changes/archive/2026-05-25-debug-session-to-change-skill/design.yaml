schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: debug-session-to-change-skill
approach:
  - >-
    Implement the feature as a new strict skill that orchestrates existing debug-session inspection
    and change-generation commands instead of adding a new CLI subcommand.
  - >-
    When no session name is supplied, inspect .strict-spec-driven/debug-sessions/, ignore archive/,
    auto-select a unique active candidate, and otherwise ask the human to choose from session id,
    status, and summary metadata.
  - >-
    Read the selected session.yaml, derive a change name and proposal content from structured issue,
    findings, replay, and verification data, and write unresolved gaps into questions.yaml before
    stopping.
  - >-
    Finish with an advisory handoff that recommends strict-spec-auto or strict-spec-apply without
    mutating the source debug-session.
decisions:
  skill-over-command:
    decision: >-
      Implement debug-session to change conversion as a skill workflow instead of a new CLI
      subcommand.
    rationale: >-
      The requested behavior is agent-guided orchestration over existing artifacts and proposal
      generators, so a skill preserves flexibility without expanding the deterministic CLI surface.
  active-session-selection:
    decision: >-
      Resolve unnamed sources only from active debug-sessions, auto-select a unique candidate, and
      otherwise ask the human to choose from concise session metadata.
    rationale: >-
      This keeps the default flow focused on current investigations while still making source
      selection deterministic and reviewable.
  full-artifact-generation:
    decision: >-
      Generate complete change artifacts from the selected debug-session rather than leaving most
      documents as placeholders.
    rationale: >-
      The goal is to convert investigation evidence into an implementation-ready spec change
      handoff, not merely scaffold an empty directory.
  advisory-handoff:
    decision: >-
      Stop after proposal creation and recommend strict-spec-auto or strict-spec-apply without
      invoking either workflow.
    rationale: >-
      The user wants a deliberate handoff point after artifact generation so implementation choice
      remains explicit.
  active-status-allowed:
    decision: >-
      Allow conversion from any active debug-session status instead of requiring resolved or blocked
      sessions.
    rationale: >-
      In-progress investigations may already contain enough evidence to shape a valid change
      proposal, and the user explicitly prefers not to gate conversion on closeout status.
alternatives:
  - option: Add a new CLI subcommand that converts debug-sessions into changes.
    reason: >-
      Rejected because the desired flow is primarily skill guidance layered on existing
      deterministic commands.
  - option: Restrict conversion to resolved or blocked debug-sessions only.
    reason: >-
      Rejected because the user wants any active session to be convertible when it carries enough
      evidence.
  - option: Scaffold only proposal and design artifacts, leaving tasks and delta specs mostly empty.
    reason: Rejected because the user wants a full change document handoff.
risks:
  - >-
    Selected debug-session evidence may be too sparse to derive confident tasks or delta specs; the
    mitigation is to write blocking open questions instead of inferring missing scope.
  - >-
    Multiple similar active sessions may increase the chance of picking the wrong source; the
    mitigation is to show session id, status, and summary during human selection.
  - >-
    An auto-derived change name may collide with an existing active change; the mitigation is to
    surface the collision and require a revised name before overwriting artifacts.

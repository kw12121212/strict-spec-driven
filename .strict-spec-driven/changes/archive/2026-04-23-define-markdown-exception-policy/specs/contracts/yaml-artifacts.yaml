schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: contracts-yaml-artifacts
mapping:
  implementation: []
  tests: []
operations:
  ADDED:
    - requirement:
        id: markdown-exception-categories
        strength: MUST
        statement: >-
          The system MUST define the Markdown file categories that remain allowed in a strict YAML
          workflow repository because they are not strict workflow artifacts.
        scenarios:
          - id: packaging-markdown-remains-allowed
            steps:
              - kind: GIVEN
                text: the strict YAML artifact contract is reviewed
              - kind: WHEN
                text: Agent Skills packaging files are checked
              - kind: THEN
                text: '`SKILL.md` is identified as an allowed Markdown exception'
              - kind: AND
                text: >-
                  the exception is limited to the skill packaging container rather than generated or
                  consumed strict workflow state
          - id: repository-documentation-remains-allowed
            steps:
              - kind: GIVEN
                text: the strict YAML artifact contract is reviewed
              - kind: WHEN
                text: repository documentation files are checked
              - kind: THEN
                text: >-
                  `README.md`, `AGENTS.md`, `RTK.md`, and similar non-workflow documentation are
                  allowed to remain Markdown
              - kind: AND
                text: >-
                  repository documentation is not treated as strict workflow state unless a later
                  schema explicitly classifies it that way
    - requirement:
        id: workflow-artifacts-use-yaml
        strength: MUST
        statement: >-
          The system MUST require generated or consumed strict workflow artifacts to use YAML
          formats rather than Markdown formats.
        scenarios:
          - id: strict-workflow-state-is-yaml
            steps:
              - kind: GIVEN
                text: strict workflow artifacts under `.strict-spec-driven/` are reviewed
              - kind: WHEN
                text: >-
                  specs, delta specs, proposals, designs, tasks, questions, indexes, roadmap
                  indexes, roadmap milestones, and planned change entries are checked
              - kind: THEN
                text: each artifact family is required to use YAML structure
              - kind: AND
                text: >-
                  Markdown headings, list formatting, or frontmatter are not accepted as the
                  authoritative structure for those artifact families
          - id: strict-generated-filenames-are-yaml
            steps:
              - kind: GIVEN
                text: a strict workflow command or skill generates workflow artifacts
              - kind: WHEN
                text: artifact filenames are selected
              - kind: THEN
                text: >-
                  generated proposal, design, task, question, spec, delta, index, roadmap, and
                  milestone artifacts use YAML filenames
              - kind: AND
                text: legacy Markdown artifact filenames are not generated as strict workflow targets
    - requirement:
        id: bootstrap-markdown-is-legacy-input
        strength: MUST
        statement: >-
          The system MUST treat bootstrap or legacy `.spec-driven/` Markdown artifacts as migration
          input rather than valid target artifacts for strict workflows.
        scenarios:
          - id: bootstrap-artifacts-are-not-strict-targets
            steps:
              - kind: GIVEN
                text: a repository still contains `.spec-driven/` Markdown workflow artifacts
              - kind: WHEN
                text: the strict Markdown exception policy is reviewed
              - kind: THEN
                text: those artifacts are identified as bootstrap or legacy workflow state
              - kind: AND
                text: they are not treated as valid `.strict-spec-driven/` target artifacts
          - id: migration-can-read-legacy-markdown
            steps:
              - kind: GIVEN
                text: migration tooling reads supported `.spec-driven/` Markdown artifacts
              - kind: WHEN
                text: the Markdown exception policy is applied
              - kind: THEN
                text: reading those legacy artifacts for conversion remains allowed
              - kind: AND
                text: the generated strict workflow output is still required to use YAML artifacts
    - requirement:
        id: markdown-exception-validation-boundary
        strength: MUST
        statement: >-
          The system MUST require validation and migration behavior to distinguish Markdown
          exceptions from strict workflow artifacts by artifact role.
        scenarios:
          - id: validators-do-not-reject-packaging-documentation
            steps:
              - kind: GIVEN
                text: validation checks strict workflow artifact formats
              - kind: WHEN
                text: >-
                  an allowed Markdown exception such as `SKILL.md`, `README.md`, `AGENTS.md`, or
                  `RTK.md` is encountered outside strict workflow state
              - kind: THEN
                text: the file is not rejected merely because it is Markdown
          - id: validators-reject-strict-workflow-markdown-targets
            steps:
              - kind: GIVEN
                text: validation checks strict workflow artifact formats
              - kind: WHEN
                text: a generated or consumed strict workflow artifact is represented only as Markdown
              - kind: THEN
                text: the artifact can be reported as a deterministic validation failure
  MODIFIED: []
  REMOVED: []

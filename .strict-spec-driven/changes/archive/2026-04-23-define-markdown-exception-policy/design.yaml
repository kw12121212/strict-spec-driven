schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: define-markdown-exception-policy
approach:
  - >-
    Add contract-focused requirements under `specs/contracts/` that define the observable Markdown
    boundary for strict YAML workflow artifacts. The proposal will stay at the artifact-contract
    level. It will identify which Markdown files remain valid because they are packaging or
    repository documentation, and it will require generated or consumed strict workflow state to use
    YAML artifacts. It will not introduce validator code, parser behavior, or migration logic.
decisions:
  - id: >-
      treat-skill-md-as-a-packaging-exception-rather-than-as-workflow-state-because-the-agent-skills-format-owns-that-markdown-container
    decision: >-
      Treat `SKILL.md` as a packaging exception rather than as workflow state, because the Agent
      Skills format owns that Markdown container.
    rationale: >-
      Treat `SKILL.md` as a packaging exception rather than as workflow state, because the Agent
      Skills format owns that Markdown container.
  - id: >-
      treat-readme-md-agents-md-rtk-md-and-similar-repository-documentation-as-non-workflow-documentation-unless-a-later-schema-explicitly-classifies-a-file-as-workflow-state
    decision: >-
      Treat `README.md`, `AGENTS.md`, `RTK.md`, and similar repository documentation as non-workflow
      documentation unless a later schema explicitly classifies a file as workflow state.
    rationale: >-
      Treat `README.md`, `AGENTS.md`, `RTK.md`, and similar repository documentation as non-workflow
      documentation unless a later schema explicitly classifies a file as workflow state.
  - id: >-
      require-strict-workflow-artifacts-under-strict-spec-driven-to-use-yaml-names-such-as-proposal-yaml-design-yaml-tasks-yaml-questions-yaml-specs-deltas-indexes-roadmap-indexes-and-roadmap-milestones
    decision: >-
      Require strict workflow artifacts under `.strict-spec-driven/` to use YAML names such as
      `proposal.yaml`, `design.yaml`, `tasks.yaml`, `questions.yaml`, specs, deltas, indexes,
      roadmap indexes, and roadmap milestones.
    rationale: >-
      Require strict workflow artifacts under `.strict-spec-driven/` to use YAML names such as
      `proposal.yaml`, `design.yaml`, `tasks.yaml`, `questions.yaml`, specs, deltas, indexes,
      roadmap indexes, and roadmap milestones.
  - id: >-
      treat-spec-driven-markdown-artifacts-as-bootstrap-or-legacy-source-artifacts-for-migration-not-as-acceptable-target-artifacts-for-strict-workflows
    decision: >-
      Treat `.spec-driven/` Markdown artifacts as bootstrap or legacy source artifacts for
      migration, not as acceptable target artifacts for strict workflows.
    rationale: >-
      Treat `.spec-driven/` Markdown artifacts as bootstrap or legacy source artifacts for
      migration, not as acceptable target artifacts for strict workflows.
  - id: >-
      require-future-validation-and-migration-behavior-to-make-the-workflow-artifact-versus-markdown-exception-decision-by-artifact-role-not-by-a-broad-file-extension-rule
    decision: >-
      Require future validation and migration behavior to make the workflow artifact versus Markdown
      exception decision by artifact role, not by a broad file extension rule.
    rationale: >-
      Require future validation and migration behavior to make the workflow artifact versus Markdown
      exception decision by artifact role, not by a broad file extension rule.
alternatives:
  - option: Ban all Markdown in strict projects
    reason: >-
      rejected because `SKILL.md` is a required Agent Skills packaging file and repository docs are
      not workflow state.
  - option: Allow Markdown anywhere outside specs
    reason: >-
      rejected because strict workflow artifacts also include proposals, designs, tasks, questions,
      indexes, and roadmap files.
  - option: Define detailed migration mappings now
    reason: >-
      rejected because this change only closes the Markdown boundary; migration compatibility has a
      dedicated planned roadmap item.
  - option: Leave the policy implicit in README prose
    reason: >-
      rejected because later validators and skills need observable requirements in the spec
      contract.

schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: align-harness-status-logs-operation-model
approach:
  - >-
    Update the harness schema and normalization logic so start and stop remain the only executable
    lifecycle operations while status and logs become optional descriptive metadata, then align the
    example, docs, inferred drafts, plan/doctor behavior, and deterministic tests with that runtime
    model.
decisions:
  status-logs-are-declarative:
    decision: >-
      Treat operations.status and operations.logs as optional descriptive declarations that are
      never executed by the lifecycle; only start and stop participate in executable harness safety
      checks.
    rationale: >-
      Runtime already derives status from process state and logs from captured files, so keeping
      executable requirements for status/logs misleads agents and creates false repair expectations.
      Preserving readonly as a descriptive mode keeps existing declarations valid while removing the
      dead execution path.
alternatives: []
risks: []

schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: roadmap-status-detail-fields
approach:
  - Add summary and dependsOn to RoadmapPlannedChangeStatus, then project entry.summary and a copied entry.depends_on array inside buildMilestoneStatus. Update the existing roadmap-status contract and its real CLI fixture assertions while leaving all human-readable and recommendation renderers untouched.
decisions:
  camel-case-status-fields:
    decision: The JSON projection uses summary and dependsOn, preserving summary text and translating the YAML depends_on field to the existing camelCase status-output convention.
    rationale: roadmap-status already exposes plannedChanges, declaredStatus, and derivedStatus in camelCase; matching that wire vocabulary avoids leaking artifact naming conventions into consumers.
  bounded-detail-projection:
    decision: Expose only summary and dependency ids; continue omitting details, team metadata, milestone goals, and redundant file fields.
    rationale: Consumers need enough data to explain and relate planned work, while the default status command remains bounded and avoids turning into a raw artifact dump.
  copy-dependency-array:
    decision: Return a fresh dependsOn array for every projected planned change.
    rationale: The status object must remain a read-only projection and must not share mutable array identity with loaded roadmap artifacts.
alternatives:
  - option: Have downstream consumers open standalone planned-change YAML files by path.
    reason: That creates a second parsing and validation path outside roadmap-status and cannot cover inline compatibility entries consistently.
  - option: Add a new detail flag or endpoint instead of extending default roadmap-status.
    reason: The downstream daemon invokes one fixed roadmap-status command and needs these small bounded fields in the authoritative default projection.
risks:
  - Existing tests explicitly assert that planned-change summaries are omitted, so the spec and regression assertion must change together before implementation.
  - Any accidental inclusion of details or team metadata would widen the compact status contract beyond the confirmed downstream need.

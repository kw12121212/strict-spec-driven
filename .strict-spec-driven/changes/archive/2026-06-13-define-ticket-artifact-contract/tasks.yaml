schema: strict-spec-driven/task-list/v2
schema_version: 2
artifact_type: task_list
schema_file: templates/strict-spec-driven/schemas/task-list.yaml
change: define-ticket-artifact-contract
sections:
  Implementation:
    add-ticket-schema:
      text: Add templates/strict-spec-driven/schemas/ticket.yaml defining the ticket artifact (id, title, pure-requirement fields problem/desired_outcome/intent, status enum open|needs_input|promoted|implemented|rejected, created_at, optional labels and external_tracker, provenance promoted_to/implemented_by, embedded triage_decision record outcome/evidence/rationale/decided_at) in the nested-field schema dialect.
      status: complete
    add-tickets-index-schema:
      text: Add templates/strict-spec-driven/schemas/tickets-index.yaml defining the tickets index artifact (keyed ticket entries with id, title, status, path).
      status: complete
    add-registry-entries:
      text: Register strict-spec-driven/ticket/v1 and strict-spec-driven/tickets-index/v1 in templates/strict-spec-driven/schemas/registry.yaml with schema_file and primary_example.
      status: complete
    add-examples:
      text: Add minimal valid examples examples/strict-spec-driven/ticket.yaml and examples/strict-spec-driven/tickets-index.yaml that parse and validate against the new schemas.
      status: complete
    add-scaffold-template:
      text: Add a tickets directory scaffold template (tickets/INDEX.yaml) under templates/strict-spec-driven/scaffold/ so init exposes the tickets location.
      status: complete
  Testing:
    cover-ticket-examples:
      text: Extend test/suites/foundation-and-fixtures.ts so the ticket and tickets-index examples are validated through the shared validation layer and the registry is asserted to include both new entries with primary examples.
      status: complete
    run-project-regression:
      text: Run the complete project regression command; when the workflow config declares a coverage contract, this command enforces the minimum coverage threshold by exiting non-zero below it.
      status: complete
      command: bun scripts/coverage-gate.ts --threshold 78
  Verification:
    verify-scope:
      text: Verify implementation matches proposal scope (contract and registry only; no CLI behavior, skills, roadmap wiring, or docs).
      status: complete
testing_gates:
  validation_task: cover-ticket-examples
  unit_test_task: run-project-regression

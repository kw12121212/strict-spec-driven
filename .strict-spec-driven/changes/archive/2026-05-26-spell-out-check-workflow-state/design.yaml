schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: spell-out-check-workflow-state
approach:
  - >-
    Update the affected skill command reference blocks so check-workflow-state entries include the
    full node {{SKILL_DIR}}/scripts/strict-spec-driven.js check-workflow-state command. Keep
    surrounding prose and command semantics unchanged.
  - >-
    Update skill packaging validation and regression assertions to require the same full command
    form anywhere strict workflow precheck guidance is validated.
decisions:
  spell-out-command-entry:
    decision: >-
      Represent check-workflow-state using the same complete command form as other script-backed
      skill commands.
    rationale: >-
      A full command is directly executable by agents and avoids ambiguity when a skill says the
      workflow-state check must run before other work.
alternatives: []
risks: []

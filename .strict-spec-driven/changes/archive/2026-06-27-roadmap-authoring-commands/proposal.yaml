schema: strict-spec-driven/change-proposal/v1
schema_version: 1
artifact_type: change_proposal
schema_file: templates/strict-spec-driven/schemas/change-proposal.yaml
change:
  id: roadmap-authoring-commands
  status: proposed
summary:
  what:
    - Add deterministic roadmap milestone authoring CLI support so agents can create and update roadmap milestone artifacts through commands instead of hand-writing milestone YAML shape.
  why:
    - Roadmap planning and review currently require skills to edit milestone YAML structure directly, even though this repository requires scripts to own filesystem mechanics, parsing, validation, and deterministic format enforcement for strict YAML artifacts.
scope:
  in:
    - Add a roadmap-generate milestone command that creates or safely updates roadmap milestone YAML by named parameters and reuses roadmap validation and sync mechanics.
    - Update roadmap planning and review skill guidance to use the new milestone authoring command for script-owned milestone artifact shape while keeping AI judgment in the skills.
    - Add regression coverage for milestone create, update, conflict, validation, sync, and skill guidance behavior touched by the new command.
  out:
    - Do not add CLI generation or update support for standalone planned-change artifacts; those remain authored by the existing roadmap skill workflows.
    - Do not change roadmap recommendation, proposal handoff, archive, reopen, or materialization selection semantics except where they consume milestones authored by the new command.
    - Do not add a UI or external roadmap tracker integration.
    - Do not let commands mark roadmap work complete by operator input; completion remains derived from strict workflow state and archive/sync behavior.
unchanged_behavior:
  - Existing roadmap-status, roadmap-overview, roadmap-sync, roadmap-recommend, roadmap-reopen, and roadmap-archive behavior remains compatible with manually authored valid roadmap YAML and existing standalone planned-change files.

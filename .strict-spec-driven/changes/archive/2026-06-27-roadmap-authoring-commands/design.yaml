schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: roadmap-authoring-commands
approach:
  - Introduce a roadmap-generate milestone CLI command. The command accepts named arguments that map to existing strict roadmap milestone schema fields, parses existing milestone artifacts through structured YAML helpers, writes canonical YAML with validation before and after mutation, and invokes the existing roadmap sync path after successful writes so INDEX.yaml and derived milestone statuses stay canonical. Skills retain responsibility for deciding goal, scope, done criteria, dependencies, risks, notes, details, and review quality. The new command owns milestone file layout, schema shape, idempotent upsert, conflict detection, and diagnostics. Standalone planned-change artifacts intentionally stay on the existing roadmap skill editing path in this change.
decisions:
  milestone-only-roadmap-generate:
    decision: Expose roadmap milestone authoring through roadmap-generate milestone and do not add planned-change generation in this change.
    rationale: The user's requested boundary is that CLI should own milestone generation and modification only. Planned-change authoring remains unchanged, which keeps this change smaller and avoids altering the split-file team workflow surface.
  safe-upsert-with-reset:
    decision: Default milestone authoring updates are safe upserts by stable milestone ID, while --reset is required to replace existing list-like planning fields wholesale.
    rationale: This keeps repeated agent invocations idempotent, prevents accidental duplication, and makes destructive replacement explicit without requiring commands to infer planning intent.
  sync-after-successful-write:
    decision: Successful milestone authoring commands run the existing roadmap sync reconciliation before reporting updated files.
    rationale: The roadmap index and derived status are already owned by sync. Reusing that path avoids a second implementation of canonical ordering and status derivation.
alternatives: []
risks: []

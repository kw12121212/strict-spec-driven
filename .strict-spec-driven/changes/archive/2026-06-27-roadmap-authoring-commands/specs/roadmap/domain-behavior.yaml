schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: roadmap-domain-behavior
mapping:
  implementation:
    - src/cli/cmd-roadmap.ts
    - src/roadmap.ts
    - src/roadmap/author.ts
    - src/roadmap/model.ts
    - src/roadmap/load.ts
    - src/roadmap/sync.ts
    - src/yaml.ts
    - skills/strict-roadmap-plan/SKILL.md
    - skills/strict-roadmap-review/SKILL.md
  tests:
    - test/suites/roadmap-and-migration.ts
    - test/suites/entrypoint-and-skills.ts
operations:
  ADDED:
    roadmap-milestone-authoring-command-contract:
      strength: MUST
      statement: The system MUST make roadmap-generate milestone create and safely update strict roadmap milestone artifacts using structured YAML fields, preserve source-ticket metadata unless explicitly addressed by milestone arguments, reject conflicting edits before writing, run roadmap synchronization after successful writes, and report updated files deterministically without adding CLI authoring support for standalone planned-change artifacts.
      scenarios:
        milestone-command-creates-canonical-roadmap-state:
          - GIVEN: a strict workflow project has roadmap state and no milestone with a requested milestone id
          - WHEN: strict-spec-driven roadmap-generate milestone is invoked with valid milestone title, goal, scope, done criteria, dependency, risk, note, and optional details arguments
          - THEN: the command writes a valid roadmap milestone artifact with empty planned_changes, synchronizes the roadmap index, exits zero, and reports the updated milestone and index files
    roadmap-milestone-update-preserves-work-items:
      strength: MUST
      statement: The system MUST make roadmap-generate milestone update milestone planning fields without creating, modifying, deleting, or moving standalone planned-change artifacts, MUST preserve source_ticket metadata unless an explicitly supported milestone-field operation addresses it, and MUST reject legacy inline planned_changes without partially rewriting the milestone because inline planned-change migration remains on the existing materialization workflow.
      scenarios:
        milestone-command-updates-without-planned-change-authoring:
          - GIVEN: a strict roadmap milestone exists and standalone planned-change files reference the same milestone
          - WHEN: strict-spec-driven roadmap-generate milestone updates the milestone goal, scope, done criteria, dependencies, risks, notes, or details
          - THEN: the milestone planning fields are updated, source_ticket metadata is preserved, standalone planned-change files are not rewritten by the milestone authoring command, and roadmap-sync remains valid afterward
        milestone-command-rejects-inline-legacy-work-items:
          - GIVEN: a strict roadmap milestone still contains legacy inline planned_changes
          - WHEN: strict-spec-driven roadmap-generate milestone tries to update that milestone
          - THEN: the command exits non-zero, reports the existing roadmap-sync materialization workflow, leaves the milestone file unchanged, and does not generate planned-change artifacts
        milestone-command-rejects-standalone-planned-change-rewrite:
          - GIVEN: a strict roadmap milestone references a standalone planned-change file that would be rewritten by roadmap synchronization
          - WHEN: strict-spec-driven roadmap-generate milestone tries to update the milestone
          - THEN: the command exits non-zero, reports that the standalone planned-change must be reconciled through the existing roadmap workflow, and leaves the milestone and planned-change files unchanged
  MODIFIED: {}
  REMOVED: {}

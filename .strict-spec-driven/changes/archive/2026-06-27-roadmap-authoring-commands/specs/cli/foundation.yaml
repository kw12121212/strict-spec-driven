schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: cli-foundation
mapping:
  implementation:
    - src/cli/cmd-roadmap.ts
    - src/cli/registry.ts
    - src/cli/usage.ts
    - src/strict-spec-cli.ts
    - skills/strict-roadmap-plan/SKILL.md
    - skills/strict-roadmap-review/SKILL.md
  tests:
    - test/suites/entrypoint-and-skills.ts
    - test/suites/roadmap-and-migration.ts
operations:
  ADDED:
    cli-roadmap-generate-milestone-command:
      strength: MUST
      statement: The system MUST expose a roadmap-generate milestone CLI command with help and usage handling, named-argument validation, deterministic diagnostics, safe milestone create or update behavior, and no mutation when required arguments are missing, invalid, or conflicting with existing milestone artifact content.
      scenarios:
        roadmap-generate-milestone-validates-before-write:
          - GIVEN: a strict workflow project has existing roadmap state
          - WHEN: strict-spec-driven roadmap-generate milestone is invoked with missing, invalid, or conflicting named arguments
          - THEN: the command exits non-zero, prints usage or deterministic diagnostics, and leaves existing roadmap artifacts unchanged
    cli-roadmap-skills-use-milestone-authoring-command:
      strength: MUST
      statement: The system MUST update strict roadmap planning and review skill guidance so milestone artifact creation and milestone-field modification use the roadmap-generate milestone command for script-owned YAML shape, while standalone planned-change files remain on the existing direct roadmap skill editing path.
      scenarios:
        roadmap-skills-route-milestone-shape-through-cli:
          - GIVEN: strict roadmap planning or review skill guidance needs to create a milestone or modify milestone goal, scope, done criteria, dependencies, risks, notes, or details
          - WHEN: the bundled skill guidance is inspected by automated skill-content validation
          - THEN: the guidance references roadmap-generate milestone for milestone artifact shape and does not require planned-change artifacts to be generated by CLI
  MODIFIED: {}
  REMOVED: {}

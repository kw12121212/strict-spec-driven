resolved:
  - id: design-system-snapshot-mapping
    question: Should component entries in design-system.yaml carry visual-regression snapshot paths, or do snapshot references stay in main-spec mappings?
    context: 'Context: config.yaml rules.ui states that pixel-level visual fidelity is governed by visual-regression snapshots referenced from mappings, but it does not say which artifact''s mappings hold those references. The design-system artifact is the first artifact where component-level visual identity is recorded, so the ambiguity becomes concrete here. Impact: this decides the component sub-schema of strict-spec-driven/design-system/v1 and the output contract of design-status. Option A, snapshot paths on design-system components: design-status can report snapshot drift alongside implementation-mapping drift in one place, and a component''s tokens sit next to the snapshot that proves them; it adds an optional snapshot array to the component sub-schema. Option B, snapshot paths stay in main-spec mappings: keeps every spec-to-evidence link in the existing spec mapping fields that verify-spec-mappings already audits, and leaves the design-system schema smaller, but design-status can then report only implementation drift and visual evidence lives away from the tokens it verifies. Recommendation: Option A, because design-status is the only command that will read the component entries and the existing architecture design-status already reports implementation-mapping drift, so an optional snapshot array extends a proven pattern rather than inventing a second evidence channel. Option B is the safer choice if snapshot references should remain auditable by verify-spec-mappings, which does not read the design-system artifact. Implementation must stop until this is answered because both the schema and the design-status output contract depend on it.'
    answer: 'Option A: component entries in design-system.yaml carry visual-regression snapshot paths. The component sub-schema gains an optional snapshot path array alongside mapping.implementation, and design-status reports missing snapshot paths as mapping drift together with the component that declares them, extending the drift-reporting pattern architecture-status already proves rather than opening a second evidence channel. Snapshot references therefore sit next to the tokens they verify. Accepted trade-off: verify-spec-mappings does not read the design-system artifact, so these snapshot paths are audited by design-status only.'
    status: resolved

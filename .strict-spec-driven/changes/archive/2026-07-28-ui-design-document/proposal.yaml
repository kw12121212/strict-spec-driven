schema: strict-spec-driven/change-proposal/v1
schema_version: 1
artifact_type: change_proposal
schema_file: templates/strict-spec-driven/schemas/change-proposal.yaml
change:
  id: ui-design-document
  status: proposed
summary:
  what:
    - Free the DESIGN.md name for visual identity and add a strict YAML design-token source of truth. The existing generated architecture document renames to ARCHITECTURE.md, its commands rename to architecture-generate and architecture-status, its skill renames to /strict-spec-architecture, and its main spec area moves to specs/architecture/domain-behavior.yaml as architecture-domain-behavior. A new registered schema strict-spec-driven/design-system/v1 backs an optional .strict-spec-driven/design-system.yaml holding design tokens, component token mappings, and design guidance. The design-generate and design-status commands and the /strict-spec-design skill are re-pointed at that artifact, rendering DESIGN.md in the google-labs-code/design.md format.
  why:
    - 'The workflow already routes UI three ways through the ui classification policy recorded in config.yaml rules.ui, the contracts-yaml-artifacts spec, and the ui tech category: observable UI behavior becomes main spec requirements, UI engineering rules become ui-category technical standards, and pixel fidelity is governed by visual-regression snapshots. Visual identity itself has no home. The architecture artifact schema states it carries only the architectural narrative no other strict artifact holds, and technical standards are MUST and SHOULD prose statements that cannot sensibly hold a palette or a type scale. A UI project therefore has no strict source of truth for its design tokens and DESIGN.md renders no design-system content. Naming DESIGN.md after the architecture narrative also takes the name the design.md format expects for visual identity; design-doc-generation archived on 2026-07-28 so no downstream project has adopted the current meaning and the rename is at its cheapest.'
scope:
  in:
    - 'Rename side: DESIGN.md to ARCHITECTURE.md including DEFAULT_DESIGN_DOCUMENT_PATH in src/design.ts; design-generate and design-status to architecture-generate and architecture-status including command-metadata registry summaries, usage strings, and --output help text; skills/strict-spec-design to skills/strict-spec-architecture; DESIGN_QUICKSTART.md and DESIGN_QUICKSTART.zh.md to ARCHITECTURE_QUICKSTART.md and ARCHITECTURE_QUICKSTART.zh.md; README.md and README.zh.md navigation links; main spec area specs/design/domain-behavior.yaml to specs/architecture/domain-behavior.yaml with spec id architecture-domain-behavior and re-prefixed requirement ids.'
    - 'New UI side: registered schema strict-spec-driven/design-system/v1 discoverable through schema-list and schema-show; optional artifact .strict-spec-driven/design-system.yaml carrying token groups for colors, typography, layout, elevation, and shapes, component token mappings, and guidance covering overview and do''s and don''ts; design-generate and design-status re-pointed at that artifact; DESIGN.md rendered in the google-labs-code/design.md format as YAML front-matter tokens followed by the canonical Overview, Colors, Typography, Layout, Elevation and Depth, Shapes, Components, and Do''s and Don''ts sections; --check drift detection and --output override mirroring the architecture family; /strict-spec-design re-pointed to author design tokens; examples/strict-spec-driven/design-system.yaml reference artifact.'
  out:
    - Authoring a live design-system.yaml for this repository, which is a CLI with no user interface, following the precedent set by formalize-ui-classification which scoped out adding a live UI standard here.
    - init scaffolding design-system.yaml; unlike architecture.yaml the design-system artifact stays optional and absent for backend and CLI projects.
    - A new UI-side DESIGN_QUICKSTART document, a bilingual DESIGN.zh.md rendering, and wiring either generated document's freshness into verify, ready, or archive as a blocking gate.
unchanged_behavior:
  - .strict-spec-driven/architecture.yaml keeps its filename, schema id, and content model; only its rendered document, its commands, its skill, and its main spec area are renamed. Every other CLI command family including roadmap, sop, harness, migrate, verify, ready, and archive is unchanged, as are all existing registered schemas, the semantics of existing .strict-spec-driven/ directories, change-level design.yaml under changes/<name>/, and all root documentation other than the renamed quickstart pair and the README navigation links.

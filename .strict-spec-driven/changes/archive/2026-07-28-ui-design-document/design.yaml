schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: ui-design-document
approach:
  - 'Split the single design document family into two parallel families that share the existing renderer machinery. src/design.ts is factored so its generic pieces — schema-validated artifact loading, block assembly, banner rendering, deterministic output, check-mode comparison, and output-path override — serve both an architecture renderer and a design-system renderer, rather than duplicating them. The architecture family keeps every behavior it has today and only changes name: artifact path unchanged, document ARCHITECTURE.md, commands architecture-generate and architecture-status, skill /strict-spec-architecture, spec area architecture-domain-behavior. The design-system family is new: a registered strict-spec-driven/design-system/v1 schema backs an optional .strict-spec-driven/design-system.yaml, and design-generate renders DESIGN.md as YAML front-matter tokens followed by the canonical design.md section sequence, with design-status validating the artifact and reporting counts and mapping drift the way architecture-status does. The main spec rename is carried by two delta specs merged in one archive pass: a new_spec delta that creates specs/architecture/domain-behavior.yaml with the six renamed architecture requirements, and a delta on the existing design-domain-behavior area whose ADDED design-system requirements and REMOVED architecture requirements are applied in archive''s ADDED-then-REMOVED order so the file never passes through a zero-requirement state that main-spec minProperties would reject.'
decisions:
  separate-design-system-artifact:
    decision: Design tokens live in a new optional .strict-spec-driven/design-system.yaml under its own registered schema rather than in a block added to architecture.yaml or in a ui-category technical standard.
    rationale: The architecture schema's own description states it carries only the architectural narrative that no other strict artifact holds, so widening it with visual identity contradicts the contract it publishes. Technical standards are MUST and SHOULD prose rule statements whose shape suits engineering rules, not a palette, a type scale, or component token mappings. A separate optional artifact also lets non-UI projects such as this repository simply not have one, which neither alternative allows cleanly.
  design-md-format-compatibility:
    decision: 'DESIGN.md is rendered in the google-labs-code/design.md format: YAML front matter carrying the machine-readable tokens first, then the generated banner, then the canonical Overview, Colors, Typography, Layout, Elevation and Depth, Shapes, Components, and Do''s and Don''ts sections.'
    rationale: Emitting the format other coding agents already parse makes the rendered document directly consumable outside this workflow instead of being a workflow-private dialect. Placing the banner after the front matter keeps the document parseable by front-matter readers that require it to lead the file, and the yaml-first-artifacts rule generated-documents-are-not-hand-edited requires only that a banner identify the file as generated and name its source artifacts, not that it appear first, so no technical standard needs to change.
  rename-carried-by-two-deltas:
    decision: The spec-area rename is carried by a new_spec delta creating architecture-domain-behavior plus an ADDED and REMOVED delta on design-domain-behavior in the same change, rather than by retiring the old spec file.
    rationale: The main-spec schema sets requirements minProperties to 1 and archive merges requirements without ever pruning an emptied spec file or its INDEX entry, so removing every architecture requirement on its own would archive an invalid zero-requirement spec. Because archive applies ADDED before REMOVED within one file, adding the design-system requirements in the same delta keeps design-domain-behavior continuously valid, which is also why this work is one combined change rather than a rename followed by a separate feature.
  fixed-token-groups-open-entries:
    decision: The design-system schema pins the known token groups colors, typography, layout, elevation, and shapes as structured fields while leaving the entries inside each group open-ended.
    rationale: 'Fixed groups give validators, the renderer, and design-status a stable shape to project deterministic sections from, while open entries avoid dictating a design language: no schema should decide what a project''s palette or spacing scale is named. This mirrors how the architecture schema fixes components, data_flows, and decisions as groups but leaves their keys free.'
  design-system-artifact-stays-optional:
    decision: init does not scaffold design-system.yaml, and design-generate exits non-zero naming the missing artifact and the authoring entry point when it is absent, mirroring missing-architecture-artifact-error.
    rationale: Unlike architecture.yaml, which every project has something to say about, a design-system artifact is meaningless for backend, library, and CLI projects; scaffolding an empty one into every init would leave a permanently vacant file that design-status must then treat as a normal state. Failing loudly with a pointer to /strict-spec-design is more useful than rendering an empty design document.
  component-snapshot-paths-in-design-system:
    decision: Component entries in design-system.yaml carry an optional visual-regression snapshot path array alongside mapping.implementation, and design-status reports missing snapshot paths as mapping drift naming the declaring component.
    rationale: 'config.yaml rules.ui requires that pixel fidelity be governed by visual-regression snapshots referenced from mappings without naming the artifact that holds the references; the design-system artifact is the first place component-level visual identity is recorded, so the reference belongs next to the tokens the snapshot proves. design-status already reports implementation-mapping drift for architecture components, so extending that one drift channel is cheaper than inventing a second evidence path. Accepted trade-off: verify-spec-mappings does not read the design-system artifact, so these snapshot paths are audited by design-status alone.'
  delta-tech-repairs-renamed-command-references:
    decision: The change carries a delta-tech MODIFIED operation on the yaml-first-artifacts rule generated-documents-are-not-hand-edited, updating its enforcement detail and examples to name architecture-generate and design-generate and both generated documents, and extending its rationale to state that the required banner need not occupy the first line.
    rationale: The rule's normative statement is unchanged and still correct, but its enforcement detail and examples named design-generate as the command that renders DESIGN.md from the architecture artifact — a pairing this change retires, which would leave the live standard describing a workflow that no longer exists. Renaming those references is in scope because the command rename is, and a standard may only be altered through a delta-tech artifact that merges on archive, never by editing the live standard during a change. The rationale sentence about banner position records what the statement already permitted, so the design.md front matter leading DESIGN.md is compliant by the rule as written rather than by an exception.
  record-relocated-mapping-cleanup-as-a-standard:
    decision: The change adds a MUST rule relocated-mappings-declare-their-cleanup to the workflow-scope-discipline standard, requiring any change that renames or deletes a mapped file to record the stale mapping entries archive's additive merge leaves behind together with the standalone command that removes them.
    rationale: This change hit the hazard twice, in the design-domain-behavior spec mapping and the yaml-first-artifacts standard mapping. Archive unions delta mapping arrays and never removes entries, so a relocated file stays listed after merge and becomes mapping drift that the audits report indefinitely with no owner. The behavior was documented only in archive.ts comments, which do not bind a change author. Recording it as a reviewable MUST keeps the cleanup attributable to the change that caused it instead of leaving the next rename to rediscover the same trap.
alternatives: []
risks: []

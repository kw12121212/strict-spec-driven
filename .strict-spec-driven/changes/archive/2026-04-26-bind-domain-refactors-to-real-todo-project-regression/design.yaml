schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: bind-domain-refactors-to-real-todo-project-regression
approach:
  - >-
    Add new test sections to `test/suites/roadmap-and-migration.ts` (and
    `test/suites/entrypoint-and-skills.ts` if skill-validation coverage needs a copied-project
    context) that use the existing `createCopiedProjectWorkspace("todo-app")` harness. Each section
    will:
  - Copy the todo-project fixture into a temp workspace.
  - Run migrate to produce strict workflow state.
  - >-
    Exercise `validate-skills`, `roadmap-status`, `roadmap-sync`, `verify`, `list`, `review`, and
    `archive` against the migrated workspace.
  - Assert deterministic outputs, report shapes, and diagnostic ordering.
  - Run each scenario twice to confirm repeatability.
  - >-
    Assert the committed fixture baseline is unchanged on disk. This approach reuses the existing
    harness and fixture rather than introducing new test infrastructure.
decisions:
  - id: >-
      reuse-createcopiedprojectworkspace-rather-than-creating-a-new-fixture-or-test-helper-since-the-copy-and-cleanup-pattern-already-exists-and-is-proven-in-sections-17b-and-18a
    decision: >-
      Reuse `createCopiedProjectWorkspace` rather than creating a new fixture or test helper, since
      the copy-and-cleanup pattern already exists and is proven in sections 17b and 18a.
    rationale: >-
      Reuse `createCopiedProjectWorkspace` rather than creating a new fixture or test helper, since
      the copy-and-cleanup pattern already exists and is proven in sections 17b and 18a.
  - id: >-
      add-scenarios-to-existing-test-suite-files-rather-than-creating-a-new-suite-file-to-keep-the-regression-surface-consolidated-where-domain-coverage-already-lives
    decision: >-
      Add scenarios to existing test suite files rather than creating a new suite file, to keep the
      regression surface consolidated where domain coverage already lives.
    rationale: >-
      Add scenarios to existing test suite files rather than creating a new suite file, to keep the
      regression surface consolidated where domain coverage already lives.
  - id: >-
      focus-on-post-migration-command-sequences-verify-list-review-archive-since-sections-17b-and-18a-already-cover-roadmap-and-migrate-flows
    decision: >-
      Focus on post-migration command sequences (verify, list, review, archive) since sections 17b
      and 18a already cover roadmap and migrate flows.
    rationale: >-
      Focus on post-migration command sequences (verify, list, review, archive) since sections 17b
      and 18a already cover roadmap and migrate flows.
alternatives:
  - option: Creating a separate `test/suites/todo-project-regression.ts` suite file
    reason: >-
      rejected because the scenarios are domain-specific extensions of existing test sections rather
      than a new cross-cutting concern.
  - option: Adding more artifact families to the todo-project fixture
    reason: rejected because the current fixture is already sufficient to exercise the decomposed modules.

schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: port-list-modify-cancel-to-yaml
approach:
- 'Add `runList`, `runModify`, and `runCancel` handlers in the strict CLI command router, following the existing command pattern (`runInit`, `runPropose`, `runApply`, `runVerify`, `runArchive`). Each handler
  reads strict change state from `.strict-spec-driven/changes/` and prints deterministic command output. `list` enumerates active change directories and archive directories, and provides status for active
  changes based on strict planning artifacts. `modify` supports two modes:'
- 'No argument: print active changes with status for quick selection.'
- 'Named target: print editable artifact paths for the target change. Active targets use `<name>`. Archived targets must use exact directory name `YYYY-MM-DD-<name>`. `cancel` removes active change directories
  only and rejects archive targets.'
decisions:
  archive-immutability-for-cancellation:
    decision: '`cancel` applies only to active changes.'
    rationale: Archived changes are historical records and must not be deleted by the normal cancel path.
  exact-archived-modify-target:
    decision: archived `modify` requires the exact directory name (`YYYY-MM-DD-<name>`) to avoid ambiguous auto-resolution when multiple archived entries share the same base change name.
    rationale: archived `modify` requires the exact directory name (`YYYY-MM-DD-<name>`) to avoid ambiguous auto-resolution when multiple archived entries share the same base change name.
  reference-aligned-ux-with-strict-paths:
    decision: command behavior mirrors the reference workflow interaction model while operating on strict YAML artifact locations under `.strict-spec-driven/`.
    rationale: command behavior mirrors the reference workflow interaction model while operating on strict YAML artifact locations under `.strict-spec-driven/`.
alternatives:
- option: Allow `cancel` on archived changes
  reason: rejected due to auditability and history-safety risk.
- option: Allow bare `<name>` for archived `modify` with auto-match
  reason: rejected due to ambiguity and non-deterministic behavior with duplicate historical names.

schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: remove-strict-roadmap-propose-skill
approach:
  - 'Treat the removal as a packaging-surface contraction: delete the skill directory and its marketplace entry together so validateStrictSkillPackaging keeps its skill-count-equals-marketplace-count invariant, remove the now-dead expectation entry from ROADMAP_STRICT_SKILL_EXPECTATIONS, and retarget the roadmap-details validation fixture in tests at strict-roadmap-recommend, which carries the same details, split planned-change, and active-conflict snippet requirements. Update the contracts-yaml-artifacts main spec first so the skill-package contract no longer names propose, then align docs and the strict-spec-auto prompt, and rebuild dist so compiled validation matches source.'
decisions:
  retarget-details-fixture-at-recommend:
    decision: Rewrite the invalid-roadmap-details packaging fixture in test/suites/roadmap-and-migration.ts to scaffold a stub strict-roadmap-recommend skill instead of strict-roadmap-propose.
    rationale: strict-roadmap-recommend declares the same ROADMAP_DETAILS_GUIDANCE_SNIPPET, ROADMAP_SPLIT_PLANNED_CHANGE_SNIPPET, and ROADMAP_ACTIVE_CONFLICT_SNIPPET requirements, so the fixture keeps proving that packaging validation rejects roadmap skills missing that guidance without depending on a deleted skill name.
  route-roadmap-proposals-through-recommend:
    decision: Documentation and the strict-spec-auto prompt present strict-roadmap-recommend as the single roadmap-to-change handoff path instead of offering a propose alternative.
    rationale: Recommend already performs scripted planned-change selection plus the same scaffold, populate, checkpoint, and ready handoff, so keeping a second manual-selection skill only duplicates guidance; users who want a specific planned change can still name it when invoking recommend.
  keep-roadmap-history-untouched:
    decision: Archived changes and existing roadmap milestone or planned-change YAML files that mention strict-roadmap-propose are left as-is.
    rationale: They are historical workflow records; rewriting them would falsify archive history without affecting current behavior.
alternatives: []
risks: []

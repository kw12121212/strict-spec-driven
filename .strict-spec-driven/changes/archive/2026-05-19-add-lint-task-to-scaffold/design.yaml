schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: add-lint-task-to-scaffold
approach:
  - >-
    Add the lint step to the canonical tasks.yaml scaffold so all newly proposed strict changes
    receive it without agents hand-authoring it each time.
  - >-
    Regenerate the embedded template bundle after editing the source scaffold so installed CLI
    behavior stays aligned with repository templates.
  - >-
    Keep testing_gates unchanged because the existing schema models validation and unit-test gates
    only; lint remains an ordered Testing task.
decisions:
  lint-as-testing-task:
    decision: Represent lint as a Testing task between build validation and unit tests.
    rationale: >-
      Task-list v2 only permits Implementation, Testing, and Verification sections, and a Testing
      task preserves schema compatibility while giving agents a cheaper command to run before full
      tests.
alternatives: []
risks:
  - >-
    Generated tasks may reference bun run lint in projects without a lint script, so the task text
    and scope must preserve manual editing by agents for project-specific commands.

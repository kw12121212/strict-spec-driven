schema_version: 1
artifact_type: question_list
schema_file: templates/strict-spec-driven/schemas/question-list.yaml
change: migrate-agent-skills-to-cli-only
open: []
resolved:
  - id: requirement-problem
    question: What is concretely going wrong today, and for whom?
    context: 'Why this is asked: the change is planned against a need, and the need lives only with the requester. A "problem" here means what someone does or suffers today — not a feature that is missing. If the answer names a button, a field, a page, or an endpoint, it is a solution, and the underlying problem is still unstated. What a sufficient answer contains: who is affected, what they do today instead, and how often. Worked example: "every Monday one person spends forty minutes copying order rows into a spreadsheet to send the weekly report". What it changes: this becomes the proposal''s why, and it decides whether the change is worth making.'
    answer: 'AI agents driving this workflow learn inconsistent YAML authoring rules from the skills they load. The protocol module and its command exist, but no bundled skill references them: zero of 35 SKILL.md files mention yaml-authoring-protocol or the ''<command> --help --json'' lookup, only 10 mention schema-show and 8 mention sample-show, and the rest carry ad hoc one-line ''never hand-edit'' prose. An agent that hits an unavailable command or an unfamiliar artifact shape therefore has no stated stop rule, so it falls back to editing YAML directly or constructing a payload file. This affects every agent-run workflow in this repository and in any project that installs these skills, on every mutation of a repository-owned YAML artifact.'
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: requirement-outcome
    question: What observable difference proves the problem is solved?
    context: 'Why this is asked: without a success condition, nobody can tell afterwards whether the change worked. "Observable" means someone outside the system can check it without reading the code. What a sufficient answer contains: what a person will see, or no longer have to do, once this is done. Worked example: "the report is in the manager''s inbox on Monday morning without anyone assembling it". What it changes: this becomes the delta spec''s scenarios and the acceptance evidence at review time.'
    answer: Reading any mutation-capable SKILL.md shows the ordered authoring steps, the owning CLI commands for that skill's artifact kinds, the schema-show and sample-show lookups, the validation command, and the no-fallback boundary naming what to report when a step cannot be completed. No such skill contains an instruction to write a repository-owned YAML path by direct editing, shell redirection, a heredoc, a payload file, or an ad hoc writer script. The test suite fails if a mutation-capable skill drops a step title or the boundary statement. The milestone criterion is that all bundled mutation-capable skills use only CLI commands for repository-owned YAML creation, modification, entry removal, and artifact deletion.
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: requirement-trigger
    question: Why now — what forced this?
    context: 'Why this is asked: work that nothing forced is the work most often thrown away later. This question catches a request that sounds reasonable but has no real driver behind it. What a sufficient answer contains: the concrete event, deadline, incident, or cost that made this surface now, or an honest statement that nothing did. Worked example: "the report was missed last month and it was raised with the team". What it changes: a change with no trigger is a candidate for deferral, and the answer is weighed at review before archive.'
    answer: 'The three dependencies are complete as of commit a3caf3a, which landed the protocol module, the yaml-authoring-protocol command, and the MCP surface — the enabling work this migration was waiting on. Nothing else in the roadmap can proceed until it lands: roadmap-recommend reports 2 eligible of 20 planned changes, and enforce-cli-only-skill-policy, update-cli-only-yaml-documentation, complete-cli-only-yaml-regression, and both remove-artifact-file-mappings changes are all dependency-blocked behind it. Scaffolding this change also hit the cost directly: strict-roadmap-recommend documents a ''generate --reset'' flag the CLI has since replaced with ''--delete''.'
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: requirement-non-goals
    question: What must explicitly not change?
    context: 'Why this is asked: the requester knows which nearby behavior other people depend on, and the agent does not. A "non-goal" is something the change must leave alone even though it sits close to the work. What a sufficient answer contains: the behavior, setting, or output that must survive untouched, and who relies on it. Worked example: "do not change the saved filters — several people rely on their own". What it changes: these become the proposal''s unchanged_behavior items, which review checks the finished result against.'
    answer: The seven protocol step ids, their order, and the no-direct-edit-fallback boundary text stay exactly as src/yaml-authoring-protocol.ts renders them — no CLI help text, MCP metadata, or protocol content changes. Each skill keeps its lifecycle steps, human checkpoints, preferred-language handling, requirement-interrogation gate, roadmap provenance rules, and read-only inspection guidance; only the YAML authoring instructions are replaced. Read-only skills are untouched. inventory/yaml-mutation-surfaces.yaml keeps its artifact families and operation states. Human manual YAML editing stays technically unblocked — the milestone states the prohibition targets AI mutation workflows only.
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: requirement-interpretation
    question: Which reading of the request is intended, where more than one is possible?
    context: 'Why this is asked: a short request usually admits several readings, and building the wrong one is indistinguishable from building nothing. What a sufficient answer contains: the reading that is meant, stated plainly enough to rule the others out — or a statement that only one reading exists and what it is. Worked example: "export means the version sent to the manager, not the one I read myself". What it changes: this fixes the scope boundary before any code is written, and settles disputes about what was asked for.'
    answer: '''Migrate skills to CLI-only'' means rewriting the skill prompt text so its authoring instructions are the shared protocol — not adding static enforcement, not rewriting operator documentation, and not running the end-to-end proof. Those are the separate planned changes enforce-cli-only-skill-policy, update-cli-only-yaml-documentation, and complete-cli-only-yaml-regression, each of which depends on this one. The roadmap detail fixes the reading: audit every bundled skill and replace scaffold, write, patch, hand-edit, rebuild, and fallback instructions with the authoring protocol and exact structured command mappings, so the deliverable is edited SKILL.md files plus regression assertions that lock their content.'
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: mutation-capable-skill-boundary
    question: Which of the 35 bundled skills should be treated as mutation-capable and receive the CLI-only YAML authoring protocol section, and which are read-only?
    context: 'The roadmap says ''every mutation-capable Agent Skill'' but does not enumerate them, and inventory/yaml-mutation-surfaces.yaml lists all 35 skill paths as mutation surfaces without separating those that direct a write from those that only inspect. Clear writers include strict-spec-propose, strict-spec-spec-edit, strict-tech-edit, strict-spec-architecture, strict-spec-design, strict-spec-init, strict-spec-sop, and the roadmap mutation skills. Ambiguous cases are strict-spec-verify, strict-spec-review, strict-spec-ship, strict-spec-maintenance, strict-spec-resync-code-mapping, and strict-spec-migrate, which read or validate but may also trigger a write. IMPACT: this decides proposal scope, which SKILL.md files the implementation edits, and which files the new test assertions cover; getting it wrong either leaves an unguided write path or forces protocol text into skills that never mutate YAML. RECOMMENDATION: include a skill when it directs at least one cli-owned create, update, named_remove, or delete operation for an inventoried artifact family, and exclude skills whose only CLI calls are read-only or validation commands. OPTIONS: (a) inventory-derived cli-owned-operation rule as recommended, (b) include all 35 skills uniformly, (c) hand-pick a list confirmed by the user.'
    answer: 'Use the inventory-derived rule: a skill is mutation-capable when it directs at least one cli-owned create, update, named_remove, or delete operation for an artifact family recorded in inventory/yaml-mutation-surfaces.yaml. Skills whose CLI usage is limited to inspection and validation commands are excluded and left unchanged. The migrated set and the protocol the CLI renders therefore share one source and cannot drift apart, and the later enforce-cli-only-skill-policy check can reproduce the set without a hardcoded list.'
    status: resolved
    kind: requirement
    answered_by: human
  - id: protocol-section-verbosity
    question: How much of the seven-step protocol should each SKILL.md restate inline, given that 30-plus skills will each carry the section?
    context: 'src/yaml-authoring-protocol.ts owns the step titles, intents, commands, and the no-direct-edit-fallback boundary. Restating all of it in every skill adds substantial repeated text to each prompt and duplicates content the CLI already renders; restating too little risks dropping the boundary rule the protocol exists to carry. IMPACT: this affects implementation file content across every migrated skill, the shape of the test assertions that lock the section, and how much drift the later enforce-cli-only-skill-policy change must detect. RECOMMENDATION: restate the seven step titles, each step''s bound command for that skill''s artifact kinds, and the full boundary statement with what to report when a step cannot be completed, and defer step intent text to ''strict-spec-cli yaml-authoring-protocol <artifact-kind>''. OPTIONS: (a) titles plus bound commands plus full boundary as recommended, (b) full verbatim protocol including every intent paragraph, (c) boundary statement plus a command reference only.'
    answer: 'Restate in each mutation-capable SKILL.md: the seven ordered step titles, that skill''s bound owning mutation commands, its schema-show and sample-show lookups, its family validation command, and the full verbatim no-fallback boundary statement including what to report when a step cannot be completed. Defer each step''s intent paragraph to ''strict-spec-cli yaml-authoring-protocol <artifact-kind>''. This keeps the boundary present in the static text an agent reads before running anything, and keeps the restatement small enough that 30-plus copies stay maintainable and statically checkable.'
    status: resolved
    kind: technical
    answered_by: human
  - id: stale-command-map-handling
    question: When a migrated skill documents a CLI flag that no longer exists, should the flag be corrected in place or recorded as a separate finding?
    context: 'This change was already interrupted by strict-roadmap-recommend documenting ''generate --reset'', which the CLI has replaced with ''--delete''; other skills likely carry similar drift. Correcting them makes the guidance operable, but a flag whose behavior changed rather than being renamed could hide a real behavioral regression behind a documentation edit. IMPACT: this affects the implementation task reconcile-stale-command-maps, the size of the diff, and whether a behavior change silently enters a documentation-scoped change. RECOMMENDATION: correct pure renames and removals in place as part of this change, and record any flag whose current behavior contradicts the skill''s documented assumption as a new open question instead of editing it. OPTIONS: (a) correct renames in place and question behavior contradictions as recommended, (b) correct every drift in place, (c) record all drift as findings and change nothing.'
    answer: Correct pure renames and removals in place as part of this change, including the 'generate --reset' flag the CLI has replaced with '--delete'. When a flag's current behavior contradicts the skill's documented assumption rather than merely being renamed, record it as a new open question instead of editing it, so a real behavioral regression cannot enter this documentation-scoped change disguised as a documentation fix.
    status: resolved
    kind: technical
    answered_by: human

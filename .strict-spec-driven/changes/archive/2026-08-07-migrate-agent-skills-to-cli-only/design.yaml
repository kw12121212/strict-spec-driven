schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: migrate-agent-skills-to-cli-only
approach:
  - Derive the authoritative mutation-capable skill set from inventory/yaml-mutation-surfaces.yaml rather than from prose judgment, then give each such SKILL.md one uniform CLI-only YAML authoring protocol section that restates the seven ordered steps and the no-direct-edit-fallback boundary bound to that skill's artifact kinds, and points the agent at 'strict-spec-cli yaml-authoring-protocol <artifact-kind>' as the live source. Delete residual per-skill direct-edit prose that the shared section supersedes, while leaving each skill's lifecycle steps, checkpoints, preferred-language handling, roadmap provenance rules, and read-only inspection guidance intact. Lock the result with content assertions in test/suites/entrypoint-and-skills.ts so a skill that drops the boundary or the schema and example lookup fails the suite.
decisions:
  protocol-source-of-truth:
    decision: Each mutation-capable SKILL.md restates the protocol steps and boundary inline and names 'strict-spec-cli yaml-authoring-protocol <artifact-kind>' as the live authority, rather than only linking to the command.
    rationale: An agent reads SKILL.md before it runs any command, so a link-only reference leaves the first mutation attempt unguided; and a command-only reference cannot be checked statically by the later enforce-cli-only-skill-policy change. Inline restatement plus the named command gives the agent the rule immediately and a machine-readable way to resolve the concrete commands, schema_file, and example_ref for its artifact kind.
  mutation-capable-skill-set:
    decision: Membership in the migrated set is decided by whether a skill directs a cli-owned mutation operation for an artifact family recorded in inventory/yaml-mutation-surfaces.yaml; read-only skills that only inspect or run validators are left unchanged.
    rationale: The inventory is the same source the yaml-authoring-protocol command reads, so the migrated set and the protocol it teaches cannot drift apart. Judging membership by reading prose would produce a set that no later static check could reproduce.
  command-map-freshness:
    decision: 'Audit every repo skill''s documented flags against current ''<command> --help --json'' output, and correct only genuine repo drift. The audit found none: all 80 commands'' 306 declared flags cover every strict CLI flag the repo skills mention, so no command map was edited.'
    rationale: The stale 'generate --reset' flag that interrupted this change is in the installed skill copies under ~/.claude/skills/ (59 occurrences across 12 skills), not in the repository sources, which the earlier remove-reset-flags change already cleaned to zero. Correcting repo files on that evidence would have edited text that was already right, so the audit had to distinguish the installed copy from the source before changing anything.
  static-surface-rule-scoping:
    decision: Scope the existing cli-command-metadata rule authoring-protocol-has-one-source to surfaces that resolve the protocol at request time, and add a separate static-surface rule requiring a checked restatement, rather than leaving the original rule untouched.
    rationale: The original rule bound every AI-facing protocol surface to rendering the typed module, which a statically packaged SKILL.md cannot do at load time, so leaving it untouched would produce one rule forbidding exactly what the new rule requires. Splitting by whether the surface executes at request time keeps the module authoritative for both kinds without a contradiction a reviewer would have to adjudicate.
  migrate-skill-included-despite-inventory-gap:
    decision: Include strict-spec-migrate in the migrated set even though the inventory-derived rule excludes it, and leave inventory/yaml-mutation-surfaces.yaml unchanged in this change.
    rationale: The migrate command creates .strict-spec-driven/ YAML from a legacy Markdown workflow, so the skill directs a real creation of repository-owned YAML and needs the protocol; it falls outside the derived set only because the inventory registers migrate as an owner of legacy-migration-input, the one family it reads rather than writes. Correcting the inventory would widen this change into the enforcement work that owns it, so the gap is recorded rather than fixed here.
alternatives:
  - option: Add a single shared protocol document under skills/ and have each SKILL.md link to it.
    reason: Agent Skills are packaged and loaded per skill directory, so a cross-skill link is not guaranteed to resolve in an installed environment and the boundary rule could silently fail to load.
  - option: Have each skill call 'yaml-authoring-protocol' at runtime and carry no inline protocol text.
    reason: It leaves the pre-command instructions empty, so an agent that never runs the command never learns the no-fallback boundary, and no static check could detect the omission.
risks:
  - Rewriting 30-plus SKILL.md files can accidentally drop lifecycle steps, preferred-language handling, or human checkpoints that the proposal marks unchanged; each rewrite must be diffed against the original rather than regenerated wholesale.
  - Restating protocol steps inline duplicates text that src/yaml-authoring-protocol.ts owns, so a future protocol edit could leave skills stale; the regression assertions must key on the step ids and boundary statement so drift fails the suite.
  - Correcting stale command maps could surface flags whose current behavior differs from what the skill assumed, expanding the diff beyond the protocol section; any such finding that implies behavior change belongs in questions.yaml rather than an in-place fix.
  - 'inventory/yaml-mutation-surfaces.yaml registers the migrate command only against legacy-migration-input, whose operations are all human-only or not-applicable, so migrate''s help reports ''Artifacts written: legacy-migration-input'' while it actually creates workflow-config, spec-state, and roadmap-state artifacts. Any static check that derives AI-facing write paths from cli_owners will miss migrate until enforce-cli-only-skill-policy corrects the inventory.'
  - The cli_owners field conflates writers with inspectors — lessons-state lists lesson-list, lesson-show, and lesson-status alongside lesson-create and lesson-edit — so a derived mutation-capable set is only sound while every candidate skill also invokes a genuine writer. That held here and was verified by re-deriving with inspectors excluded, but the later static check needs a real writer/reader split rather than relying on that coincidence.
  - Installed skill copies under ~/.claude/skills/ drift from the repository sources and are what an agent actually loads, so this migration's protocol sections do not reach a running agent until the skills are reinstalled. The repo-versus-installed gap is invisible to every check in this repository.
  - The maintenance command seeds a strict change and writes change-planning and change-delta artifacts, but the inventory registers it nowhere as a cli_owner — only src/maintenance.ts appears as a direct_write_path. Together with the migrate gap this means at least two AI-facing commands create repository-owned YAML while the inventory's cli_owners field cannot name them, so enforce-cli-only-skill-policy must close both before deriving write paths from that field.

schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: installable-path-cli-command
approach:
  - Add a first-class installed command contract around a Bun-compiled native executable. The Unix and Windows installers should compile the CLI with Bun executable compilation during installation, copy the platform-appropriate strict-spec-driven executable into a user-level bin directory, validate or report PATH availability, and keep the skill package text independent of machine-specific install paths. Update the skill packaging validator constants and skill prompts together so validation enforces the new command form.
decisions:
  bare-path-command:
    decision: Strict skill prompts should invoke strict-spec-driven <subcommand> rather than node {{SKILL_DIR}}/scripts/strict-spec-driven.js <subcommand> or an absolute ~/.local/bin path.
    rationale: The bare command keeps skill text short and lets installation own platform-specific path setup. It avoids hard-coding Unix-only paths in distributed skill text.
  install-time-native-binary:
    decision: The change should compile a native strict-spec-driven executable inside the installation scripts instead of relying on a Node script wrapper for normal skill invocations.
    rationale: The operator explicitly wants native binary compilation, including Windows support, handled by the installer. Keeping compilation in the installer avoids introducing a prebuilt release matrix while still producing a PATH-visible executable for the local platform.
  path-warning-not-shell-profile-edit:
    decision: Installation should detect when the target user bin directory is not on PATH and report an actionable warning instead of silently assuming shell profile changes are effective.
    rationale: Agents and non-interactive shells may not load shell profiles consistently, so deterministic diagnostics are safer than hidden environment mutation.
alternatives: []
risks:
  - Cross-platform native compilation depends on the installed Bun version supporting the host target; installer diagnostics must fail clearly when Bun is missing or compilation fails.
  - The native executable still needs the bundled schema and template assets to remain resolvable, so implementation must preserve existing dist/template behavior or explicitly validate native executable behavior against it.

schema: strict-spec-driven/change-proposal/v1
schema_version: 1
artifact_type: change_proposal
schema_file: templates/strict-spec-driven/schemas/change-proposal.yaml
change:
  id: harness-shared-port-confirmation
  status: proposed
summary:
  what:
    - >-
      Add cross-environment shared-port detection to the harness toolchain: harness-doctor reports a
      safety diagnostic when the same port is declared by components in two or more environments,
      and the strict-spec-harness-init skill requires explicit human confirmation of a
      cross-environment shared port (notably development and production) before writing
      harness.yaml.
  why:
    - >-
      harness-doctor currently only detects duplicate ports within a single environment, so a port
      reused across development and production passes unnoticed even though it is a likely conflict,
      and the harness-init skill has no checkpoint that surfaces it for human confirmation.
scope:
  in:
    - >-
      Add a deterministic cross-environment shared-port check to doctorHarness in src/harness.ts
      that emits a source:safety diagnostic with no auto-fix recovery.
    - >-
      Update skills/strict-spec-harness-init/SKILL.md to require explicit human confirmation when a
      port is shared across environments before writing harness.yaml, and note that this safety
      diagnostic is confirm-required rather than silently resolved.
    - >-
      Add test coverage in test/suites/harness-infer-doctor.ts for the cross-environment shared-port
      diagnostic.
  out:
    - Changing or removing the existing same-environment duplicate-port diagnostic.
    - Runtime port-availability probing or automatically rewriting declared ports.
    - Changing production lifecycle confirmation policy or the harness.yaml schema.
unchanged_behavior:
  - The existing same-environment duplicate-port diagnostic continues to fire as today.
  - >-
    harness-doctor --fix recovery behavior for other diagnostics, the harness.yaml schema, and all
    other harness plan, doctor, status, logs, and lifecycle behavior remain unchanged.

schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: harness-shared-port-confirmation
approach:
  - >-
    Extend doctorHarness in src/harness.ts with a cross-environment port aggregation pass that
    records, for each declared port, the set of environments and components declaring it. After the
    existing per-environment checks, any port declared in two or more environments produces a
    source:safety diagnostic that names the involved environments and components, has no auto-fix
    recovery, and makes harness-doctor report ok:false alongside other diagnostics. The
    strict-spec-harness-init skill prompt is updated so the agent must explicitly surface a
    cross-environment shared port and obtain human confirmation before writing harness.yaml,
    treating the diagnostic as confirm-required rather than auto-resolved.
decisions:
  deterministic-detection-plus-skill-confirmation:
    decision: >-
      Detect cross-environment shared ports deterministically in harness-doctor (source:safety, no
      auto-fix) and require human confirmation in the harness-init skill prompt.
    rationale: >-
      Matches the repository principle that scripts perform deterministic detection while skills
      carry human judgment, so the conflict is caught reliably and resolved by an explicit human
      decision.
  any-cross-environment-overlap:
    decision: >-
      Flag the same port declared in any two or more environments, not only development-kind versus
      production-kind pairs.
    rationale: >-
      The dev-prod case is the motivating example, but a general cross-environment rule covers
      additional declared environments without special-casing environment kinds.
  confirm-required-not-hard-reject:
    decision: >-
      Treat a cross-environment shared port as a confirm-required safety diagnostic without
      automatic port rewriting.
    rationale: >-
      Development and production commonly run on separate hosts where reusing a port number is
      legitimate, so the human confirms intent rather than the tool forcing distinct ports.
alternatives: []
risks: []

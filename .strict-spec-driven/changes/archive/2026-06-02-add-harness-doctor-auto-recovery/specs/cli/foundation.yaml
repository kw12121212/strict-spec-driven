schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: cli-foundation
mapping:
  implementation:
    - src/harness.ts
  tests:
    - test/suites/harness-infer-doctor.ts
operations:
  ADDED:
    cli-harness-doctor-auto-recovery:
      strength: MUST
      statement: >-
        The system MUST support generating structured recovery actions for doctor diagnostics and
        executing them non-interactively using the --fix flag.
      scenarios:
        doctor-performs-non-interactive-auto-recovery:
          - GIVEN: >-
              a harness declaration contains missing local wrapper scripts or template environment
              configurations
          - WHEN: an operator or AI agent runs strict-spec-driven harness-doctor with the --fix flag
          - THEN: >-
              the command automatically resolves all autofixable diagnostics, regenerates missing
              files, and exits zero after validation succeeds
  MODIFIED: {}
  REMOVED: {}

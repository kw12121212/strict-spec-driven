schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: roadmap-domain-behavior
mapping:
  implementation:
    - src/cli/cmd-roadmap.ts
    - src/cli/registry.ts
    - src/strict-spec-cli.ts
    - src/roadmap.ts
    - src/roadmap/model.ts
    - src/roadmap/validate.ts
    - src/roadmap/status.ts
    - src/roadmap/sync.ts
    - src/roadmap/pause.ts
    - templates/strict-spec-driven/schemas/roadmap-milestone.yaml
    - src/embedded-templates.ts
    - skills/strict-roadmap-pause/SKILL.md
    - skills/strict-roadmap-resume/SKILL.md
    - skills/marketplace.json
  tests:
    - test/suites/roadmap-and-migration.ts
operations:
  ADDED:
    roadmap-pause-resume-contract:
      strength: MUST
      statement: The system MUST provide roadmap-pause and roadmap-resume commands that mark and clear a sticky paused state on a non-archived strict roadmap milestone. Pausing records an optional reason and a deterministic pause date in a structured top-level paused field on the milestone artifact, forces the milestone effective status to blocked so roadmap-sync canonical rewrite preserves it, appends a dated pause note, and makes roadmap-recommend skip every planned change the milestone owns with a milestone-paused skip reason. Resuming clears the paused field, optionally appends a dated resume note, and lets roadmap-sync re-derive the milestone status from planned-change state. Both commands reject unknown milestone ids with deterministic diagnostics, never modify archived milestones or any planned-change file, and leave the roadmap valid afterward.
      scenarios:
        pause-forces-blocked-status:
          - GIVEN: a valid active roadmap contains a non-archived milestone with an in-progress or pending standalone planned change and no paused field
          - WHEN: strict-spec-cli roadmap-pause runs for that milestone with an optional reason
          - THEN: the command exits zero, reports valid true, writes a paused mapping with status true and paused_on date onto the milestone artifact, sets the milestone status to blocked, appends a Paused-on note recording the reason, and leaves roadmap-status reporting declared and derived status blocked with no mismatch
        pause-survives-sync:
          - GIVEN: a milestone has been paused by roadmap-pause
          - WHEN: strict-spec-cli roadmap-sync runs before any further edit
          - THEN: the milestone stays blocked because the paused field survives canonical rewrite rather than reverting to the planned-change-derived status
        recommend-skips-paused-milestone:
          - GIVEN: a valid roadmap contains a paused milestone whose standalone planned change would otherwise be the next eligible recommendation
          - WHEN: strict-spec-cli roadmap-recommend runs
          - THEN: the command does not recommend the paused milestone planned change and reports a milestone-paused skip reason on that candidate
        resume-clears-pause:
          - GIVEN: a milestone has been paused by roadmap-pause
          - WHEN: strict-spec-cli roadmap-resume runs for that milestone with an optional reason
          - THEN: the command exits zero, deletes the paused field from the milestone artifact, optionally appends a Resumed-on note, and lets roadmap-sync re-derive the milestone status from its planned-change state
        pause-rejects-unknown-milestone:
          - GIVEN: a valid roadmap has no milestone with the requested id
          - WHEN: strict-spec-cli roadmap-pause or roadmap-resume runs for that id
          - THEN: the command exits non-zero with a deterministic diagnostic and writes no milestone file
  MODIFIED: {}
  REMOVED: {}

schema: strict-spec-driven/change-proposal/v1
schema_version: 1
artifact_type: change_proposal
schema_file: templates/strict-spec-driven/schemas/change-proposal.yaml
change:
  id: roadmap-milestone-pause
  status: proposed
summary:
  what:
    - Add a top-level optional 'paused' field on the strict roadmap milestone artifact plus roadmap-pause and roadmap-resume CLI commands that mark and clear a sticky paused state. While paused, the milestone's effective status is forced to 'blocked' (preserved by roadmap-sync canonical rewrite), roadmap-recommend skips every planned change the milestone owns, and roadmap-status reports paused state alongside declared/derived status. The pause records an optional reason and a deterministic pause date; resume clears the field, optionally records a resume note, and re-derives milestone status from planned-change state. New strict-roadmap-pause and strict-roadmap-resume skills wrap the commands.
  why:
    - Operators sometimes need to deliberately hold a milestone out of the recommendation pipeline without unshipping, deleting, or archiving it — waiting on an external decision, dependency, budget, or team capacity. Today the only knobs are 'blocked' status (which roadmap-sync silently overwrites with the derived status because derivation never produces 'blocked') or removing planned changes entirely. A first-class paused state with explicit pause/resume commands gives a reversible, auditable, and sync-stable way to defer a milestone and bring it back when the blocker clears, complementing roadmap-reopen (which re-enters a completed milestone) and roadmap-archive (which relocates a completed milestone).
scope:
  in:
    - Optional paused field added to the roadmap-milestone v2 JSON schema under templates/strict-spec-driven/schemas/roadmap-milestone.yaml and regenerated into src/embedded-templates.ts; new src/roadmap/pause.ts implementing pauseMilestone and resumeMilestone with the same load/rewrite/sync pattern as src/roadmap/reopen.ts; src/roadmap/model.ts types for the paused field and updated RoadmapMilestoneStatus.derivedStatus to admit 'blocked'; src/roadmap/validate.ts validation for the paused mapping; src/roadmap/status.ts to derive 'blocked' when paused.status is true; src/roadmap/sync.ts buildCanonicalMilestoneArtifact to round-trip the paused field; src/roadmap.ts recommendRoadmapChange to skip planned changes whose owning milestone is paused; src/cli/cmd-roadmap.ts runRoadmapPause and runRoadmapResume handlers; src/cli/registry.ts and src/strict-spec-cli.ts command registration; .strict-spec-driven/specs/roadmap/domain-behavior.yaml delta spec for the pause/resume contract; new skills/strict-roadmap-pause and skills/strict-roadmap-resume skill directories; skills/marketplace.json entries; regression coverage in test/suites/roadmap-and-migration.ts.
  out:
    - Archived milestones (roadmap/archive) are never pausable — pause/resume operate only on active roadmap milestones; milestone-level dependencies free-form text, inline planned_changes semantics, planned-change team.blocked metadata, roadmap-reopen seeding behavior, roadmap-archive selection logic, roadmap-reorder ordering, and the strict change lifecycle; no new CLI commands beyond roadmap-pause and roadmap-resume; no change to how proposed/planned/active/complete derive; paused does not propagate to owned planned-change files (their internal status stays planned/complete).
unchanged_behavior:
  - Existing declared statuses (proposed/planned/active/blocked/complete) and their enum stay the same; planned-change state derivation and mismatches are unchanged; roadmap-status output shape only grows a new optional paused field and a derivedStatus that may now report 'blocked' for paused milestones; roadmap-sync continues to rewrite active milestones and standalone planned-change files canonically; roadmap-reopen still appends a dated note and seeds a follow-up; roadmap-archive still selects only milestones whose derived status is complete (so pausing a complete milestone prevents archive until resume); roadmap-reorder never modifies paused state; archived milestone and planned-change files remain immutable.

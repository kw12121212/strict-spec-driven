schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: contracts-yaml-artifacts
mapping:
  implementation: []
  tests: []
operations:
  ADDED:
    - requirement:
        id: strict-workflow-directory
        strength: MUST
        statement: >-
          The system MUST define `.strict-spec-driven/` as the target workflow state directory for
          strict YAML spec-driven artifacts.
        scenarios:
          - id: strict-workflow-directory-is-identifiable
            steps:
              - kind: GIVEN
                text: the strict workflow artifact contract is reviewed
              - kind: WHEN
                text: the target workflow state directory is checked
              - kind: THEN
                text: >-
                  `.strict-spec-driven/` is identified as the directory for strict YAML workflow
                  artifacts
    - requirement:
        id: bootstrap-directory-compatibility
        strength: MUST
        statement: >-
          The system MUST treat `.spec-driven/` as a bootstrap or legacy workflow directory rather
          than the target strict YAML workflow directory.
        scenarios:
          - id: bootstrap-state-remains-distinct-from-strict-state
            steps:
              - kind: GIVEN
                text: a repository still uses `.spec-driven/` before strict migration tooling exists
              - kind: WHEN
                text: the strict workflow directory contract is reviewed
              - kind: THEN
                text: '`.spec-driven/` is not identified as the target strict YAML workflow directory'
              - kind: AND
                text: '`.strict-spec-driven/` remains the target strict YAML workflow directory'
    - requirement:
        id: strict-spec-command-prefix
        strength: MUST
        statement: >-
          The system MUST define `strict-spec-*` as the naming family for strict spec workflow
          skills and slash commands.
        scenarios:
          - id: strict-spec-workflow-commands-are-distinguishable
            steps:
              - kind: GIVEN
                text: a strict spec workflow skill or slash command name is reviewed
              - kind: WHEN
                text: its public prefix is checked
              - kind: THEN
                text: it uses the `strict-spec-*` naming family
    - requirement:
        id: strict-roadmap-command-prefix
        strength: MUST
        statement: >-
          The system MUST define `strict-roadmap-*` as the naming family for strict roadmap workflow
          skills and slash commands.
        scenarios:
          - id: strict-roadmap-workflow-commands-are-distinguishable
            steps:
              - kind: GIVEN
                text: a strict roadmap workflow skill or slash command name is reviewed
              - kind: WHEN
                text: its public prefix is checked
              - kind: THEN
                text: it uses the `strict-roadmap-*` naming family
    - requirement:
        id: cli-naming-remains-separate
        strength: MUST
        statement: >-
          The system MUST distinguish skill and slash-command prefix rules from CLI entrypoint and
          CLI subcommand naming rules.
        scenarios:
          - id: cli-naming-is-not-implied-by-skill-prefixes
            steps:
              - kind: GIVEN
                text: the strict workflow naming contract is reviewed
              - kind: WHEN
                text: CLI entrypoint or CLI subcommand names are considered
              - kind: THEN
                text: >-
                  they are not treated as automatically defined by the `strict-spec-*` or
                  `strict-roadmap-*` skill and slash-command prefixes
  MODIFIED: []
  REMOVED: []

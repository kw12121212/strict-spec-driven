schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: define-strict-directory-and-prefixes
approach:
  - >-
    Add a contract-focused delta spec under `specs/contracts/` that makes the target directory and
    public skill/slash-command prefixes observable requirements of the strict workflow. This remains
    a planning-only change. The repository still has no TypeScript source tree, package manifest,
    strict CLI implementation, or test runner, so implementation mappings would be invented if added
    now. The change will instead make later implementation work accountable to stable directory and
    prefix requirements.
decisions:
  - id: >-
      treat-strict-spec-driven-as-the-product-workflow-state-directory-while-keeping-spec-driven-as-the-temporary-bootstrap-state-used-before-migration-tooling-exists
    decision: >-
      Treat `.strict-spec-driven/` as the product workflow state directory, while keeping
      `.spec-driven/` as the temporary bootstrap state used before migration tooling exists.
    rationale: >-
      Treat `.strict-spec-driven/` as the product workflow state directory, while keeping
      `.spec-driven/` as the temporary bootstrap state used before migration tooling exists.
  - id: >-
      define-skill-and-slash-command-families-as-strict-spec-and-strict-roadmap-so-users-and-agents-can-distinguish-strict-yaml-workflows-from-legacy-markdown-centric-workflows
    decision: >-
      Define skill and slash-command families as `strict-spec-*` and `strict-roadmap-*` so users and
      agents can distinguish strict YAML workflows from legacy Markdown-centric workflows.
    rationale: >-
      Define skill and slash-command families as `strict-spec-*` and `strict-roadmap-*` so users and
      agents can distinguish strict YAML workflows from legacy Markdown-centric workflows.
  - id: leave-cli-binary-and-subcommand-naming-to-define-command-naming-model
    decision: Leave CLI binary and subcommand naming to `define-command-naming-model`.
    rationale: >-
      Skills, slash commands, CLI entrypoints, and installer-facing names have different audiences
      and should not be collapsed into one rule here.
  - id: >-
      keep-this-change-in-the-existing-contracts-yaml-artifacts-spec-area-because-the-directory-and-prefix-names-define-where-strict-yaml-artifacts-live-and-how-users-invoke-workflows-that-create-or-consume-them
    decision: >-
      Keep this change in the existing `contracts/yaml-artifacts` spec area because the directory
      and prefix names define where strict YAML artifacts live and how users invoke workflows that
      create or consume them.
    rationale: >-
      Keep this change in the existing `contracts/yaml-artifacts` spec area because the directory
      and prefix names define where strict YAML artifacts live and how users invoke workflows that
      create or consume them.
alternatives:
  - option: Define directory, skill names, slash commands, and CLI commands in one change
    reason: >-
      rejected because the roadmap has a separate command naming item and the CLI entrypoint needs
      more comparison with `../auto-spec-driven`.
  - option: Start implementation with `bootstrap-typescript-cli`
    reason: >-
      rejected because init and validation behavior should not guess the target directory or public
      naming families.
  - option: Rename the current bootstrap `.spec-driven/` directory immediately
    reason: rejected because migration tooling and strict CLI support do not exist yet.

schema: strict-spec-driven/change-proposal/v1
schema_version: 1
artifact_type: change_proposal
schema_file: templates/strict-spec-driven/schemas/change-proposal.yaml
change:
  id: split-migration-reporting-and-run-orchestration
  status: complete
summary:
  what:
    - >-
      Extract migration reporting types, deferred-artifact classification, deterministic result
      sorting, config preflight, and the top-level `migrateLegacyWorkflow` orchestration from
      `src/migrate.ts` into focused modules under `src/migrate/`.
  why:
    - >-
      After extracting legacy parsers (by artifact family) and builders/converters into
      `src/migrate/parsers/` and `src/migrate/converters/`, `src/migrate.ts` still contains 373
      lines mixing result-envelope types, config normalization, preflight checks, deferred-artifact
      classification, deterministic sorting, scaffold-asset reporting, and the main run
      orchestration in one file. Separating these responsibilities into dedicated modules mirrors
      the decomposition pattern already applied to parsers and converters and keeps each module
      focused on one concern.
scope:
  in: []
  out: []
unchanged_behavior:
  - Migration command output and exit behavior remain identical.
  - >-
    Generated strict YAML artifacts, diagnostic codes, warning messages, and manual follow-up
    entries remain identical.
  - >-
    Deterministic ordering of `converted`, `skipped`, `warnings`, `errors`, and `manualFollowUp`
    entries in `MigrationResult` remains identical.
  - >-
    The public exports from `src/migrate.ts` (including re-exports used by `src/migrate/shared.ts`)
    remain available at the same import paths.

schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: split-migration-reporting-and-run-orchestration
approach:
- 'Create two new focused modules under `src/migrate/` and reduce `src/migrate.ts` to a thin import-and-delegate layer:'
- '**`src/migrate/reporting.ts`** — migration result envelope types, deferred-artifact classification, and deterministic result sorting: `MigrationConvertedArtifact`, `MigrationSkippedArtifact`, `MigrationDiagnostic`,
  `MigrationManualFollowUp`, `MigrationResult` types `describeDeferredLegacyArtifact()` — classifies legacy files that lack dedicated converters `sortMigrationResult()` — deterministic sorting of all result
  collections using `sortByDeterministicKey`'
- '**`src/migrate/preflight.ts`** — config normalization, config loading, and scaffold-asset discovery: `LEGACY_CONFIG_TEXT_REPLACEMENTS`, `normalizeLegacyConfigText()`, `normalizeLegacyConfigValue()` —
  config text normalization `StrictWorkflowConfig`, `LegacyWorkflowConfig` types `loadStrictConfigFromLegacy()` — loads and validates legacy config, builds strict config `getReportedStrictScaffoldAssets()`
  — lists scaffold assets to report in migration results'
- '**`src/migrate.ts`** — thin orchestration layer: Re-exports public types from `reporting.ts` (maintaining backward compatibility for `src/migrate/shared.ts` which imports `MigrationResult` etc.) Contains
  only `migrateLegacyWorkflow()`, the main entry function that composes preflight, conversion, deferred-artifact handling, and result sorting The constant paths (`LEGACY_CONFIG_PATH`, `STRICT_CONFIG_PATH`)
  move to `preflight.ts` alongside the config logic that uses them.'
decisions:
  result-types-live-in-reporting-ts-not-in-shared-ts-shared-ts:
    decision: '**Result types live in `reporting.ts`**, not in `shared.ts` — `shared.ts` already contains shared helpers (path normalization, directory walking, YAML I/O) and deferred-artifact recording.'
    rationale: The result envelope types describe the migration report shape rather than shared conversion helpers, so they belong with reporting.
  src-migrate-shared-ts-imports-from-reporting-ts-shared-ts:
    decision: '**`src/migrate/shared.ts` imports from `reporting.ts`** — `shared.ts` already imports `MigrationDiagnostic`, `MigrationResult`, and `MigrationSkippedArtifact` from `../migrate.js`.'
    rationale: After this change those imports will resolve through the re-export in `src/migrate.ts`, preserving the existing dependency direction.
  describedeferredlegacyartifact-moves-to-reporting-ts:
    decision: '**`describeDeferredLegacyArtifact` moves to `reporting.ts`**'
    rationale: it classifies artifacts for the result envelope (skipped/manual-follow-up), which is a reporting concern rather than a conversion or orchestration concern.
  config-normalization-stays-together-with-config-loading:
    decision: '**Config normalization stays together with config loading**'
    rationale: '`normalizeLegacyConfigText`, `normalizeLegacyConfigValue`, and `LEGACY_CONFIG_TEXT_REPLACEMENTS` are only used by `loadStrictConfigFromLegacy`, so they move as a unit to `preflight.ts`.'
alternatives:
- option: '**Keep all reporting types in `src/migrate.ts` and only extract preflight** — rejected because the 373-line file would remain mixed, defeating the decomposition goal.'
  reason: The result types and sorting logic are a cohesive unit that deserves its own module.
- option: '**Create `src/migrate/orchestrate.ts` instead of keeping orchestration in `src/migrate.ts`** — rejected because the main function is the module''s primary export and only about 60 lines after
    extraction.'
  reason: An extra indirection layer adds import complexity without reducing file size meaningfully.
- option: '**Merge result types into `src/migrate/shared.ts`** — rejected because `shared.ts` is already 166 lines of utility helpers.'
  reason: Adding result-envelope types and classification logic would make it a second catch-all rather than a focused module.

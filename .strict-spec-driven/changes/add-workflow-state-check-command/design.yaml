schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: add-workflow-state-check-command
approach:
  - >-
    Introduce a small strict CLI subcommand that performs the filesystem existence check once, then
    update strict skill prompts to call that command as their first prerequisite action. Keep the
    helper intentionally narrow: it reports only whether .strict-spec-driven/ exists as a directory
    and delegates all initialization or artifact validation to existing commands.
decisions:
  script-owned-directory-check:
    decision: Use a strict CLI command for the .strict-spec-driven/ directory existence check.
    rationale: >-
      A command that calls filesystem APIs is deterministic even when the directory is hidden from
      initial agent file listings, and it keeps filesystem mechanics out of prompt-only
      instructions.
  no-init-fallback:
    decision: >-
      Keep missing-directory behavior as a stop condition that directs the user to
      /strict-spec-init.
    rationale: >-
      Non-init skills must not create workflow state implicitly, and existing specs already reserve
      initialization ownership for strict-spec-init.
  narrow-existence-only-semantics:
    decision: Limit the command to checking that .strict-spec-driven/ exists as a directory.
    rationale: >-
      The user asked only for directory existence; broader artifact validation would change workflow
      semantics and duplicate existing validation commands.
alternatives: []
risks: []

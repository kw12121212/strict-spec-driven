schema: strict-spec-driven/roadmap-milestone/v2
schema_version: 2
artifact_type: roadmap_milestone
schema_file: templates/strict-spec-driven/schemas/roadmap-milestone.yaml
milestone:
  0007-cli-command-surface-decomposition:
    title: 07 CLI Command Surface Decomposition
goal: Reduce the size and coordination burden of the CLI entrypoint layer by splitting command dispatch and CLI-facing helper logic into smaller modules without changing observable command behavior.
scope:
  in:
    - Split `src/strict-spec-cli.ts` into a thin entrypoint plus focused modules for argv normalization, usage text, command registration, dispatch, and top-level error handling.
    - Isolate change discovery, archive lookup, path normalization, and CLI-facing status helpers that are currently embedded in the entrypoint.
    - Move spec-mapping audit collection, mapping normalization, evidence discovery, and diagnostic sorting out of the entrypoint into dedicated modules with clear ownership.
    - Split command handlers into domain-oriented files such as scaffold, change, roadmap, migration, and operations surfaces instead of keeping them inline in one script.
    - Preserve command names, flags, exit codes, human-readable output, and machine-readable JSON behavior while the code is reorganized.
    - Add or update regression coverage needed to prove the modularized command surface still behaves the same, including scenarios that run against the shared real todo project fixture defined by milestone 09.
  out:
    - Changing workflow semantics, command names, or artifact formats.
    - Deep refactors of roadmap, migration, or skill-validation internals beyond helper moves required to support the CLI split.
    - Replacing the single-package repository structure with a multi-package workspace.
done_criteria:
  - '`src/strict-spec-cli.ts` is reduced to a thin entrypoint and orchestration layer that owns only top-level argv handling, usage fallback, dispatch invocation, and final process exit behavior.'
  - Command registration and dispatch live in dedicated modules with explicit ownership boundaries instead of being mixed into a long command script.
  - Shared CLI helpers for change discovery, archive resolution, path normalization, output shaping, and spec-mapping audit are no longer mixed into the entrypoint.
  - Automated coverage confirms list, modify, cancel, archive lookup, roadmap-status, roadmap-sync, and spec-mapping commands keep their existing observable behavior after the split.
  - The shared real todo project regression suite from milestone 09 exercises command-surface scenarios against a freshly copied project fixture so CLI decomposition is validated in a repeatable end-to-end environment.
intake_questions:
  - id: objective
    question: What observable outcome should this milestone deliver?
    context: Milestone goal text can be broad; this question keeps the outcome testable before work is decomposed.
    impact: Unclear objective affects milestone scope, planned-change summaries, and proposal scope for every child change.
    recommendation: Answer with one user- or operator-observable outcome that can be checked after the milestone is complete.
  - id: scope-boundary
    question: What is included in this milestone, and what is explicitly out of scope?
    context: The roadmap already has scope.in and scope.out fields, but the boundary decision must be called out as a required clarification.
    impact: Unclear scope affects planned-change ownership, milestone splitting, and whether later changes silently expand scope.
    recommendation: Use the milestone scope fields as evidence and keep unrelated work out of this milestone.
  - id: done-criteria
    question: What concrete evidence proves this milestone is done?
    context: Done criteria need to be verifiable rather than aspirational.
    impact: Weak done criteria affect roadmap review, archive readiness, and follow-up change prioritization.
    recommendation: Name the observable behavior, validation command, documentation, or archived planned changes that prove completion.
  - id: work-decomposition
    question: What standalone planned changes are needed to deliver this milestone?
    context: Roadmap recommendation works from planned-change artifacts, not from hidden prose inside the milestone.
    impact: Missing decomposition affects proposal generation and can block roadmap-backed automatic implementation.
    recommendation: Create focused standalone planned-change files with actionable summary, details, dependencies, and status.
  - id: dependencies-and-blockers
    question: What dependencies or blockers must be resolved before this milestone can progress?
    context: Dependencies may come from other milestones, active changes, tickets, services, credentials, or external decisions.
    impact: Unknown blockers affect ordering, roadmap recommendation eligibility, and implementation handoff.
    recommendation: Record known dependencies in dependencies and preserve unresolved blockers in milestone notes or planned-change detail.
  - id: risks
    question: What compatibility, data, security, privacy, performance, release, or rollback risks could change the plan?
    context: Roadmap milestones often establish the risk surface before individual strict changes are proposed.
    impact: Unidentified risks affect scope, technical standards, tests, release sequencing, and rollback planning.
    recommendation: Record concrete risks in risks and keep mitigations small enough to map into planned changes.
  - id: verification-evidence
    question: How will milestone work be verified across implementation, tests, docs, and workflow artifacts?
    context: The change-intake gate requires a proof plan before implementation begins.
    impact: Missing verification affects planned-change testing tasks and archive confidence.
    recommendation: Identify the relevant test suite, validation command, documentation check, or manual evidence expected for child changes.
  - id: technical-standards
    question: Which existing technical standards apply, or does this milestone require a new standard?
    context: Technical rules live under .strict-spec-driven/tech/ and must be known before changes are implemented.
    impact: Unclear standards affect implementation files, tests, and whether a child change needs a delta-tech artifact.
    recommendation: List applicable standards or record a follow-up to add or update a technical standard when the milestone needs one.
planned_changes: {}
dependencies:
  - '`03-core-strict-workflow` and `06-operations-and-documentation` must remain the behavioral baseline for command outputs and operational surfaces while the entrypoint is decomposed.'
  - Existing CLI tests and fixture conventions should be preserved so the refactor can prove behavior stability rather than rely on manual inspection.
  - The shared real-project regression harness in milestone 09 should exist before this milestone is marked complete, even if some command-surface coverage lands incrementally before that milestone finishes.
risks:
  - Command refactors can accidentally change output text, exit codes, or JSON shapes even when the logic still works.
  - Moving shared helpers too early can create circular dependencies between command modules if boundaries are not chosen carefully.
  - A superficial file split without cleaner ownership could spread the same complexity across more files instead of reducing it.
status: complete
notes:
  - 'Current hotspot evidence: `src/strict-spec-cli.ts` is about 1093 lines and mixes entrypoint setup, command handlers, shared filesystem utilities, and spec-mapping audit logic in one file.'
  - 'Current test evidence: `test/run.ts` is about 5949 lines and today relies mostly on temporary-directory and single-fixture assertions, so command-surface decomposition needs a stronger shared project-level regression layer.'
  - This milestone intentionally focuses on the CLI command surface first so later domain-specific decompositions can happen behind clearer entry boundaries.

schema: strict-spec-driven/roadmap-milestone/v2
schema_version: 2
artifact_type: roadmap_milestone
schema_file: templates/strict-spec-driven/schemas/roadmap-milestone.yaml
milestone:
  0008-workflow-domain-module-decomposition:
    title: 08 Workflow Domain Module Decomposition
goal: Split oversized workflow-domain scripts into smaller modules so roadmap, skill validation, and migration behavior can continue evolving without concentrating unrelated responsibilities in single files.
scope:
  in:
    - Split `src/roadmap.ts` into focused modules for artifact loading, schema or semantic validation, status derivation, canonical index generation, and sync rewrites.
    - Split `src/skills.ts` into focused modules for frontmatter parsing, command-snippet validation, symlink checks, marketplace metadata checks, and diagnostic aggregation.
    - Split `src/migrate.ts` into focused modules for legacy Markdown parsing, strict artifact building, roadmap and index conversion, reporting, and orchestration.
    - Extract shared deterministic helpers such as path normalization, ordered directory walking, and diagnostic sorting only where the same semantics are truly shared across modules.
    - Preserve current `.strict-spec-driven/` behavior, schema expectations, diagnostics, generated artifact ordering, and command outputs while the code is reorganized.
    - Add or update regression coverage needed to prove roadmap, skill-validation, and migration behavior remains stable after decomposition, including real-project scenarios from milestone 09.
  out:
    - Changing roadmap schema rules, skill packaging rules, migration policy, or strict artifact semantics.
    - Reworking product behavior solely to justify a refactor.
    - Collapsing unrelated command-surface work back into this milestone when it belongs to milestone 07.
done_criteria:
  - '`src/roadmap.ts`, `src/skills.ts`, and `src/migrate.ts` are reduced to thinner orchestration layers or small index modules instead of single large implementation files.'
  - Roadmap loading, validation, status derivation, canonical rewrite generation, and sync writing are separated into modules with clear interfaces.
  - Skill packaging checks are separated by responsibility rather than concentrated in one validator file.
  - Migration parsing, conversion, reporting, and orchestration responsibilities are separated into dedicated modules with behavior-preserving tests.
  - Deterministic diagnostics, generated artifact ordering, and path normalization behavior remain stable after the split.
  - Automated coverage confirms roadmap status and sync, skill validation, and migration outputs remain observably stable after the split, including regression runs against the shared real todo project fixture from milestone 09.
intake_questions:
  - id: objective
    question: What observable outcome should this milestone deliver?
    context: Milestone goal text can be broad; this question keeps the outcome testable before work is decomposed.
    impact: Unclear objective affects milestone scope, planned-change summaries, and proposal scope for every child change.
    recommendation: Answer with one user- or operator-observable outcome that can be checked after the milestone is complete.
  - id: scope-boundary
    question: What is included in this milestone, and what is explicitly out of scope?
    context: The roadmap already has scope.in and scope.out fields, but the boundary decision must be called out as a required clarification.
    impact: Unclear scope affects planned-change ownership, milestone splitting, and whether later changes silently expand scope.
    recommendation: Use the milestone scope fields as evidence and keep unrelated work out of this milestone.
  - id: done-criteria
    question: What concrete evidence proves this milestone is done?
    context: Done criteria need to be verifiable rather than aspirational.
    impact: Weak done criteria affect roadmap review, archive readiness, and follow-up change prioritization.
    recommendation: Name the observable behavior, validation command, documentation, or archived planned changes that prove completion.
  - id: work-decomposition
    question: What standalone planned changes are needed to deliver this milestone?
    context: Roadmap recommendation works from planned-change artifacts, not from hidden prose inside the milestone.
    impact: Missing decomposition affects proposal generation and can block roadmap-backed automatic implementation.
    recommendation: Create focused standalone planned-change files with actionable summary, details, dependencies, and status.
  - id: dependencies-and-blockers
    question: What dependencies or blockers must be resolved before this milestone can progress?
    context: Dependencies may come from other milestones, active changes, tickets, services, credentials, or external decisions.
    impact: Unknown blockers affect ordering, roadmap recommendation eligibility, and implementation handoff.
    recommendation: Record known dependencies in dependencies and preserve unresolved blockers in milestone notes or planned-change detail.
  - id: risks
    question: What compatibility, data, security, privacy, performance, release, or rollback risks could change the plan?
    context: Roadmap milestones often establish the risk surface before individual strict changes are proposed.
    impact: Unidentified risks affect scope, technical standards, tests, release sequencing, and rollback planning.
    recommendation: Record concrete risks in risks and keep mitigations small enough to map into planned changes.
  - id: verification-evidence
    question: How will milestone work be verified across implementation, tests, docs, and workflow artifacts?
    context: The change-intake gate requires a proof plan before implementation begins.
    impact: Missing verification affects planned-change testing tasks and archive confidence.
    recommendation: Identify the relevant test suite, validation command, documentation check, or manual evidence expected for child changes.
  - id: technical-standards
    question: Which existing technical standards apply, or does this milestone require a new standard?
    context: Technical rules live under .strict-spec-driven/tech/ and must be known before changes are implemented.
    impact: Unclear standards affect implementation files, tests, and whether a child change needs a delta-tech artifact.
    recommendation: List applicable standards or record a follow-up to add or update a technical standard when the milestone needs one.
planned_changes: {}
dependencies:
  - '`07-cli-command-surface-decomposition` should establish clearer command-surface boundaries first so domain-module splits do not duplicate CLI orchestration concerns.'
  - Current strict workflow specs and archived changes remain the baseline evidence for expected roadmap, skill, and migration behavior during this refactor.
  - The shared real-project regression harness in milestone 09 should exist before this milestone is marked complete so behavior-preserving claims are proven in a reusable project fixture rather than only in isolated temp-dir assertions.
risks:
  - Migration refactors can subtly change generated artifact contents or diagnostic ordering if converters and reporting are separated without strong regression coverage.
  - Roadmap and skill-validation code both depend on deterministic diagnostics, so careless module extraction can change user-visible error ordering.
  - If the split is done only by file count instead of responsibility boundaries, the resulting modules may still be hard to extend safely.
status: complete
notes:
  - 'Current hotspot evidence: `src/migrate.ts` is about 2034 lines, `src/roadmap.ts` about 1046 lines, and `src/skills.ts` about 984 lines.'
  - 'Current test evidence: `test/run.ts` is about 5949 lines, so part of the decomposition safety story is to stop relying on one monolithic runner as the only integration surface.'
  - This milestone follows milestone 07 so CLI dispatch concerns stay separate from deeper domain-logic decomposition.

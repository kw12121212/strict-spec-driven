schema: strict-spec-driven/roadmap-milestone/v2
schema_version: 2
artifact_type: roadmap_milestone
schema_file: templates/strict-spec-driven/schemas/roadmap-milestone.yaml
milestone:
  0011-team-roadmap-collaboration:
    title: 11 Conflict Resistant Team Roadmap
goal: Redesign strict roadmap storage so multiple people can plan and claim work with fewer Git merge conflicts by keeping the shared roadmap index simple, keeping milestone files mostly stable, and moving planned changes into independent YAML files.
scope:
  in:
    - Define a low-conflict roadmap layout where milestone files hold durable milestone metadata and each planned change lives in its own YAML artifact under the roadmap directory.
    - Preserve compatibility with current inline `planned_changes` milestone files during migration and sync.
    - Add validation that detects duplicate planned change IDs, malformed milestone references, dependency problems across planned-change files, and active work conflicts.
    - Add team metadata such as owner, reviewers, blocked state, and external references on planned change files after the split-file contract is stable.
  out:
    - Building a hosted locking service, realtime collaboration UI, or account and permission model for the first team roadmap milestone.
    - Making GitHub Issues, Linear, Jira, or any external tracker the required source of truth.
    - Treating local YAML owner fields as hard locks that can prevent divergent Git branches.
    - Replacing the strict change archive as the authoritative record of completed work.
done_criteria:
  - The roadmap contract defines a standalone planned-change artifact shape that references exactly one owning milestone.
  - Roadmap loading, status, sync, recommendation, and proposal handoff work with standalone planned change files while preserving existing inline milestone compatibility where required.
  - Roadmap sync preserves the shared roadmap index and, where appropriate, canonical planned-change projections without requiring users to hand-edit aggregate planned-change maps.
  - Validation reports cross-file dependency errors, duplicate planned change identities, missing milestone references, and conflicts with active strict changes deterministically.
  - 'Documentation explains the Git-native team workflow and gives clear conflict recovery guidance: keep planned changes file-scoped, keep milestone edits deliberate, and rerun sync after merges.'
intake_questions:
  - id: objective
    question: What observable outcome should this milestone deliver?
    context: Milestone goal text can be broad; this question keeps the outcome testable before work is decomposed.
    impact: Unclear objective affects milestone scope, planned-change summaries, and proposal scope for every child change.
    recommendation: Answer with one user- or operator-observable outcome that can be checked after the milestone is complete.
  - id: scope-boundary
    question: What is included in this milestone, and what is explicitly out of scope?
    context: The roadmap already has scope.in and scope.out fields, but the boundary decision must be called out as a required clarification.
    impact: Unclear scope affects planned-change ownership, milestone splitting, and whether later changes silently expand scope.
    recommendation: Use the milestone scope fields as evidence and keep unrelated work out of this milestone.
  - id: done-criteria
    question: What concrete evidence proves this milestone is done?
    context: Done criteria need to be verifiable rather than aspirational.
    impact: Weak done criteria affect roadmap review, archive readiness, and follow-up change prioritization.
    recommendation: Name the observable behavior, validation command, documentation, or archived planned changes that prove completion.
  - id: work-decomposition
    question: What standalone planned changes are needed to deliver this milestone?
    context: Roadmap recommendation works from planned-change artifacts, not from hidden prose inside the milestone.
    impact: Missing decomposition affects proposal generation and can block roadmap-backed automatic implementation.
    recommendation: Create focused standalone planned-change files with actionable summary, details, dependencies, and status.
  - id: dependencies-and-blockers
    question: What dependencies or blockers must be resolved before this milestone can progress?
    context: Dependencies may come from other milestones, active changes, tickets, services, credentials, or external decisions.
    impact: Unknown blockers affect ordering, roadmap recommendation eligibility, and implementation handoff.
    recommendation: Record known dependencies in dependencies and preserve unresolved blockers in milestone notes or planned-change detail.
  - id: risks
    question: What compatibility, data, security, privacy, performance, release, or rollback risks could change the plan?
    context: Roadmap milestones often establish the risk surface before individual strict changes are proposed.
    impact: Unidentified risks affect scope, technical standards, tests, release sequencing, and rollback planning.
    recommendation: Record concrete risks in risks and keep mitigations small enough to map into planned changes.
  - id: verification-evidence
    question: How will milestone work be verified across implementation, tests, docs, and workflow artifacts?
    context: The change-intake gate requires a proof plan before implementation begins.
    impact: Missing verification affects planned-change testing tasks and archive confidence.
    recommendation: Identify the relevant test suite, validation command, documentation check, or manual evidence expected for child changes.
  - id: technical-standards
    question: Which existing technical standards apply, or does this milestone require a new standard?
    context: Technical rules live under .strict-spec-driven/tech/ and must be known before changes are implemented.
    impact: Unclear standards affect implementation files, tests, and whether a child change needs a delta-tech artifact.
    recommendation: List applicable standards or record a follow-up to add or update a technical standard when the milestone needs one.
planned_changes: {}
dependencies:
  - Existing roadmap v2 milestone files and inline planned changes must remain understandable until a migration path is available.
  - Current strict change active and archive state remains the source used to derive planned change progress and conflict diagnostics.
  - Roadmap details support from milestone 0010 remains available for long milestone-level planning context, while standalone planned-change files carry executable planning and team metadata.
risks:
  - Splitting planned changes into many files can increase directory noise if naming and index organization rules are not simple.
  - Backward compatibility with inline planned changes can make loader behavior ambiguous unless the preferred layout and migration rules are explicit.
  - Shared indexes can still appear in Git conflicts, so the design should avoid making the index a high-churn work item registry.
  - Owner and reviewer fields could be mistaken for hard locks even though Git branches can still diverge.
status: complete
notes:
  - 'Accepted direction: solve team roadmap merge conflicts primarily through file layout and independent planned-change files, not through locks, index ownership changes, or external services.'
  - The desired target layout is milestone metadata files plus standalone planned-change files under `.strict-spec-driven/roadmap/`, with `INDEX.yaml` remaining a shared milestone index.
details: |-
  Compared options: process-only rules are cheap but leave milestone files as conflict hot spots. Changing roadmap index ownership is unnecessary for the expected team workflow because teams rarely modify the milestone index concurrently. External issue trackers provide mature collaboration but introduce authentication, provider coupling, sync failures, and weaker local-first guarantees. Hosted realtime collaboration is powerful but much larger than the current YAML-first CLI product.
  The accepted approach is to reduce conflict probability through artifact granularity. Milestone files should change rarely. Each planned change should have its own file, so most contributors edit only the work item they own. The shared roadmap index remains a simple milestone list rather than becoming the work-item coordination surface. Team fields come after the split because owner and reviewer metadata is most useful when attached to a file with a narrow review surface.

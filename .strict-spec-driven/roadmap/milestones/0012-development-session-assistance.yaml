schema: strict-spec-driven/roadmap-milestone/v2
schema_version: 2
artifact_type: roadmap_milestone
schema_file: templates/strict-spec-driven/schemas/roadmap-milestone.yaml
milestone:
  0012-development-session-assistance:
    title: 12 Development Session Assistance
goal: Make strict projects describe local development sessions in structured YAML so agents can start dev services, wait for readiness, open browser targets, gather trial evidence, and clean up without relying on ad hoc project memory.
scope:
  in:
    - Define strict YAML metadata for local development services, including commands, working directories, environment variable names, ports, URLs, readiness checks, browser targets, and cleanup behavior.
    - Establish `.strict-spec-driven/dev-session.yaml` as the project-local declaration file and bundled `dev-session` schema, example, and scaffold assets as the reusable contract surface.
    - Add deterministic CLI support for validating the metadata and rendering an actionable session plan before any long-running command is started.
    - Add optional lifecycle support that can start declared services, wait for readiness, report session state, stream or print logs, and stop the services it started.
    - Add an agent skill that reads the declared development session and creates standard human-operated project scripts for start, stop, status, and logs without requiring users to remember strict CLI subcommands.
    - Connect browser-based trial guidance to the same metadata so agents know which local URL to open, what minimal smoke paths to exercise, and what evidence to report.
    - Update agent-facing skills and user documentation so development-session assistance becomes a normal part of strict change implementation and review when a project declares it.
    - Keep local runtime state for started processes in an ignored runtime location so session lifecycle commands do not dirty strict workflow artifacts.
  out:
    - Provisioning hosted development environments, remote workspaces, containers, virtual machines, or cloud services.
    - Storing secrets, credentials, API tokens, browser login state, or personal environment values in strict workflow artifacts.
    - Replacing project-owned package-manager scripts, framework CLIs, test runners, or browser automation tools.
    - Guessing undeclared startup commands from package scripts, framework fingerprints, open ports, README prose, or previous agent actions.
    - Guaranteeing that browser trial evidence can replace the configured project regression command required by strict review evidence.
    - Automating authenticated third-party product flows unless the consuming agent already has explicit user permission and the project declares safe local targets.
done_criteria:
  - A strict YAML contract exists for declared development sessions and validates service commands, readiness checks, browser targets, cleanup rules, and unavailable-condition notes.
  - The contract is backed by bundled schema, registry, example, and scaffold assets, and the project-local declaration path is documented.
  - The CLI can inspect a project and emit a deterministic development-session plan without starting processes.
  - Optional lifecycle commands can start declared local services, wait for readiness, expose session state, expose logs, and clean up only the processes they created.
  - A script-generation skill can create or update standard development helper scripts from the declared session metadata using non-clobbering rules and clear managed sections.
  - Browser trial guidance can be derived from structured YAML so agents can open the expected local URLs and report reproducible evidence.
  - Strict skills and documentation instruct agents to use declared development sessions when available and to report blockers when required commands, dependencies, or credentials are unavailable.
  - User documentation explains how to declare a session, run the dry plan, start and stop services, inspect logs, capture browser trial evidence, generate manual helper scripts, and keep secrets out of strict artifacts.
intake_questions:
  - id: objective
    question: What observable outcome should this milestone deliver?
    context: Milestone goal text can be broad; this question keeps the outcome testable before work is decomposed.
    impact: Unclear objective affects milestone scope, planned-change summaries, and proposal scope for every child change.
    recommendation: Answer with one user- or operator-observable outcome that can be checked after the milestone is complete.
  - id: scope-boundary
    question: What is included in this milestone, and what is explicitly out of scope?
    context: The roadmap already has scope.in and scope.out fields, but the boundary decision must be called out as a required clarification.
    impact: Unclear scope affects planned-change ownership, milestone splitting, and whether later changes silently expand scope.
    recommendation: Use the milestone scope fields as evidence and keep unrelated work out of this milestone.
  - id: done-criteria
    question: What concrete evidence proves this milestone is done?
    context: Done criteria need to be verifiable rather than aspirational.
    impact: Weak done criteria affect roadmap review, archive readiness, and follow-up change prioritization.
    recommendation: Name the observable behavior, validation command, documentation, or archived planned changes that prove completion.
  - id: work-decomposition
    question: What standalone planned changes are needed to deliver this milestone?
    context: Roadmap recommendation works from planned-change artifacts, not from hidden prose inside the milestone.
    impact: Missing decomposition affects proposal generation and can block roadmap-backed automatic implementation.
    recommendation: Create focused standalone planned-change files with actionable summary, details, dependencies, and status.
  - id: dependencies-and-blockers
    question: What dependencies or blockers must be resolved before this milestone can progress?
    context: Dependencies may come from other milestones, active changes, tickets, services, credentials, or external decisions.
    impact: Unknown blockers affect ordering, roadmap recommendation eligibility, and implementation handoff.
    recommendation: Record known dependencies in dependencies and preserve unresolved blockers in milestone notes or planned-change detail.
  - id: risks
    question: What compatibility, data, security, privacy, performance, release, or rollback risks could change the plan?
    context: Roadmap milestones often establish the risk surface before individual strict changes are proposed.
    impact: Unidentified risks affect scope, technical standards, tests, release sequencing, and rollback planning.
    recommendation: Record concrete risks in risks and keep mitigations small enough to map into planned changes.
  - id: verification-evidence
    question: How will milestone work be verified across implementation, tests, docs, and workflow artifacts?
    context: The change-intake gate requires a proof plan before implementation begins.
    impact: Missing verification affects planned-change testing tasks and archive confidence.
    recommendation: Identify the relevant test suite, validation command, documentation check, or manual evidence expected for child changes.
  - id: technical-standards
    question: Which existing technical standards apply, or does this milestone require a new standard?
    context: Technical rules live under .strict-spec-driven/tech/ and must be known before changes are implemented.
    impact: Unclear standards affect implementation files, tests, and whether a child change needs a delta-tech artifact.
    recommendation: List applicable standards or record a follow-up to add or update a technical standard when the milestone needs one.
planned_changes: {}
dependencies:
  - Existing strict YAML schema and validation tooling must remain the source of truth for new artifact contracts.
  - The existing `review_evidence.project_regression` command remains the authoritative regression requirement unless a future strict change explicitly modifies that contract.
  - Agent browser and shell capabilities remain external execution tools; strict workflow artifacts describe how to use them but do not embed their implementations.
  - Project-owned package scripts and framework CLIs remain responsible for the actual dev server behavior; strict session commands orchestrate only declared local commands.
risks:
  - Development commands can be long-running or flaky, so lifecycle behavior must make readiness, timeout, and cleanup semantics explicit.
  - Environment setup metadata can accidentally encourage secret leakage unless the contract records variable names and unavailable conditions without storing values.
  - Browser guidance can become stale quickly if applications change routes without updating the strict session metadata.
  - Starting project services from an agent can surprise users if commands are not clearly declared and scoped to local development.
  - Runtime process-state files can become stale after crashes, so status and stop behavior must distinguish live child processes from stale records.
  - Generated helper scripts can drift from the declaration unless they include clear provenance and can be regenerated deterministically.
status: complete
notes:
  - This milestone is about local-first coordination between strict workflow state and agent tools. It should make development setup discoverable and reproducible without turning the strict CLI into a hosted environment manager.
  - 'The intended user experience is: read the strict session plan, start declared services when appropriate, open declared browser targets, gather evidence, stop created processes, and report any unavailable prerequisites.'
details: |-
  In normal implementation work, agents often need to run a development server, wait for it to be ready, open a browser, exercise a page, capture screenshots or observations, and then clean up. Today that knowledge is usually implicit in README prose, package scripts, or user memory. Strict workflow can help by making the local development loop explicit, validated, and easy for agents to consume.
  The accepted direction is a structured declaration plus deterministic CLI support. The declaration should say what can be started, how readiness is detected, where browser smoke checks begin, and what evidence should be reported. The strict CLI should first provide a dry inspection path so an agent can explain what it is about to do. Lifecycle execution can follow, but it must be scoped to local commands declared by the project and must clean up only processes it created.
  Proposed command names for the implementation changes are `dev-session-plan`, `dev-session-start`, `dev-session-status`, `dev-session-logs`, and `dev-session-stop`. The first command is the required inspection path. The lifecycle commands are optional behavior layered on top of the same declaration. The declaration file should avoid secrets by storing only environment variable names, not values, and runtime process bookkeeping should live outside committed strict artifacts.
  Manual command-line use should not require users to remember the strict command names. A dedicated skill should be able to generate project-local helper scripts from the declaration, such as `scripts/dev-start`, `scripts/dev-stop`, `scripts/dev-status`, and `scripts/dev-logs`, or a project-configured equivalent. Those scripts should call the strict lifecycle commands or the declared project commands consistently, include provenance comments, avoid embedding secrets, and refuse to overwrite user-authored scripts unless a managed section or explicit confirmation exists.

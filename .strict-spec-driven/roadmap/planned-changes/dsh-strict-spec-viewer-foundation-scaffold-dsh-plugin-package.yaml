planned_change:
  id: scaffold-dsh-plugin-package
  milestone: dsh-strict-spec-viewer-foundation
status: planned
summary: Scaffold the plugin sub-package and prove the install-to-load path against the pinned dsh release before feature code.
details: 'The dsh-version-target, plugin-test-wiring, and plugin-package-name intake questions are settled: pin engines.dsh and the @deepseek-ai/dsh-client-* dev dependencies to the patch line of the newest next-tag dsh release available when this change starts, register plugin tests as a suite in test/run.ts without changing the src/** coverage scope or config.yaml, and name the package dsh-plugin-strict-spec. Create plugins/dsh-strict-spec/ with its own package.json declaring: that name, version, engines.dsh, exports for the client entry, dsh.bundle pointing at a cordis.patch.yml that inserts the plugin, and dsh.client with platform web. Mark the package private, because the project is not distributed externally. Add an empty host apply entry and the pinned dsh client dev dependencies for types. Add a Bun-based client build that emits a CJS bundle wrapped in the window.__ModuleLoader__ closure-factory form. That build keeps these modules external: react, react-dom, cordis, zod, @tanstack/react-virtual, and the dsh client-store, ui-slots, ui-primitives, and ui-dockkit modules. Register a placeholder left-sidebar icon so loading is observable; register-left-panel-page later replaces it with the real panel icon. Wire the plugin build so the root bun run build and the native CLI build keep working and never bundle React into the strict CLI. Add the plugin suite to test/run.ts, including a bundle-shape test asserting the wrapper is present and shared modules are not inlined. Record a manual smoke check that dsh plugin add with a link: spec loads the bundle in the web client and in the desktop profile. Exit when the smoke check passes and bun scripts/coverage-gate.ts --threshold 78 passes.'
depends_on:
  - define-dsh-viewer-contract

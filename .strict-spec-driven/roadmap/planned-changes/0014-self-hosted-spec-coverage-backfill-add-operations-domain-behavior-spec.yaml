summary: add a behavior-contract main spec for the operations command domain (maintenance, ship, list, modify, cancel) and re-point its implementation and test mappings onto the new spec.
details: 'The operations commands — maintenance, ship, list, modify, and cancel — govern repository upkeep and change-lifecycle edges but have no dedicated behavior spec. Add a main spec under .strict-spec-driven/specs/operations/ describing observable behavior: how maintenance runs configured checks and seeds a maintenance change, how ship reads an archived change summary and hands off git commit and push, how list reports active and archived changes, how modify lists editable artifact paths while preserving completed task state, and how cancel removes an active change while protecting archived changes, including the relevant guardrails, exit codes, and diagnostics. Keep requirements observable with verifiable scenarios. Register the spec in specs/INDEX.yaml, move the operations implementation and test mapping entries from cli-foundation to this spec, and confirm verify-spec-mappings reports zero unmapped files.'

planned_change:
  id: route-requirements-through-scenes
  milestone: scene-driven-requirements
status: complete
summary: Route requirement authoring through scenes in the bundled skills and the operator documentation.
details: 'This is the planned change that delivers the reported need; the three before it only make it possible. Create the standalone bundled scene-editing skill decided in the milestone intake questions, and make the proposal and brainstorm skills interrogate the scene first, asking for actors, preconditions, main flow, and exception flows before any requirement is drafted, then author the scene before the delta spec so the requirement set is derived from the scene rather than recalled. Make the apply, review, sync-specs, archive, and auto skills recognize scenes and their coverage state. No scene renderer is built and no generated-document registration is added, per the recorded decision. Every skill edit is constrained by the shipped skill checks: a delegating skill must not restate a delegated procedure, a mutation-capable skill must name its artifact kind, its authoring-protocol command, its validation command, and the no-fallback boundary, guidance must not name an unpackaged skill or a specific AI product, and per-skill line budgets apply. Register the new skill wherever the repository install and uninstall surfaces enumerate packaged skills. Update the external-facing documentation for both languages, README, QUICKSTART, AGENTS.md, and regenerate ARCHITECTURE.md. Confirm legacy migration produces no empty scenes directory. Tests cover the skill validation command over the new and edited skills and the documentation scans.'
depends_on:
  - merge-and-gate-scene-coverage

planned_change:
  id: author-sequence-entries-in-bundled-assets
  milestone: cli-yaml-artifact-coverage
status: complete
summary: Let addressed-path bundled-asset edits create a new mapping entry in a sequence, and validate every appended entry against the asset's registered schema.
details: 'Two defects in the same surface block registering any new bundled schema family through the CLI. First, no supported argument creates a new mapping entry inside a sequence: applyFieldEdits in src/bundled-asset-mutation.ts auto-creates missing intermediate mappings but rejects a new sequence index with field-path-out-of-range, and --append/--item coerces its value to a scalar, so templates/strict-spec-driven/schemas/registry.yaml cannot gain an entries item through schema-edit. Second, the registry participant check asserts only that entries is an array, so appending a bare scalar to entries committed and reported valid with committed true, leaving a registry whose entry is a string rather than a mapping with schema_id, artifact_type, artifact_name, schema_file, primary_example, and compatibility. Both contradict this milestone''s done criteria on tested CLI create behavior for every inventoried artifact and on generated registries staying valid after every supported mutation, and the second also contradicts the artifact-writes-validate-and-commit-atomically standard. In scope: a structured way to author one new sequence entry through the addressed-path edit surface shared by schema-edit, template-edit, sample-edit, fixture-edit, and inventory-edit; validating a created or appended sequence entry against the asset''s registered schema so an invalid entry is rejected before commit rather than committed; command metadata and machine-readable help for the new argument; and regression tests covering entry creation, rejection of a malformed entry, rejection of a scalar appended to a sequence of mappings, and idempotency. Out of scope: any change to the scene artifact contract, and any change to which families the inventory declares. Proven by: a committed negative case in which a scalar appended to registry entries is rejected, and a positive case in which a new registry entry is authored through the CLI and read back through schema-list.'
depends_on: []

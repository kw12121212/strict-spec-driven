schema: strict-spec-driven/planned-change/v1
schema_version: 1
artifact_type: planned_change
schema_file: ../../templates/strict-spec-driven/schemas/planned-change.yaml
planned_change:
  id: add-browser-trial-evidence-workflow
  milestone: 0012-development-session-assistance
status: planned
summary: >-
  define how browser-based local trial evidence is derived from development-session metadata and
  reported during strict implementation, verification, and review.
details: >-
  The workflow should tell agents which local URLs to open, which smoke paths to exercise, and which
  evidence labels to report, such as screenshot paths, console errors, network failures, or manual
  observations. It should treat browser trial evidence as supplemental unless the strict project
  explicitly changes its review evidence contract. Browser targets should be derived from
  `dev-session-plan` output so an agent does not guess ports or routes, and the evidence report
  should include whether services were already running or started by the strict lifecycle command.
depends_on:
  - add-dev-session-validation-and-plan-output

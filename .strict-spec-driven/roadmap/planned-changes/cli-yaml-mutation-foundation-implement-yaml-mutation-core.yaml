summary: Implement the shared schema-aware and atomic YAML mutation boundary.
details: Create reusable CLI-owned mutation services that load current artifacts, apply only explicit structured operations, preserve unspecified content, validate the complete candidate plus affected cross-file relationships, compute index or generated-asset side effects, and commit atomically. Return deterministic machine-readable change sets and restore the original state on every validation or write failure. Migrate existing mutation helpers without changing their public behavior.

summary: Drop the mapping field from the spec and tech schemas and from every live artifact.
details: Remove the mapping property from the main-spec, delta-spec, main-tech, and delta-tech schemas in templates, in the embedded template copies, and in the reference examples, applying the tolerance decision so a residual mapping field in an external artifact is accepted and ignored rather than rejected. Strip the recorded mapping fields from the twelve live main specs and from every technical standard that carries one. Cover schema validation, tolerance of legacy artifacts, and scaffold output with regression.
depends_on:

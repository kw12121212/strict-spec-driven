summary: Remove mapping handling from archive, generation, and migration.
details: Remove the additive mapping union from applyDeltaToMainSpec and applyDeltaToMainTech in archive, delete mapping arguments and defaults from proposal generation and artifact generation, and stop the legacy migration parsers from emitting mapping fields when converting a .spec-driven project. Ensure archiving a change and migrating a legacy project both produce artifacts with no mapping field, and update the affected regression suites.

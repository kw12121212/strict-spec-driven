schema: strict-spec-driven/planned-change/v1
schema_version: 1
artifact_type: planned_change
schema_file: ../../templates/strict-spec-driven/schemas/planned-change.yaml
planned_change:
  id: expose-scene-cli-surface
  milestone: scene-driven-requirements
status: planned
summary: Expose scene authoring, scene status, and delta scene generation on the CLI and MCP surfaces.
details: Add the scene authoring command that creates and updates a scene, removes a named step or scene entry, and deletes a whole scene, plus a read-only scene status command that reports scenes, steps, and coverage state and supports narrowing its output, because a project is expected to hold many scenes and an unnarrowable listing stops being usable well before that. Add change-level delta scene generation so a change carries scene operations the way it carries delta specs and delta tech. Every command needs an entry in src/cli/command-metadata-entries.ts documenting flag meaning, repeatable, removal, and delete semantics, output keys, and exit-code meaning, and naming the artifact kind, schema key, and example key it writes. The scene-state kind must appear in yaml-surface-list, yaml-surface-show, and yaml-authoring-protocol, and the MCP tool inventory must expose the same mutation coverage, because the mutation-coverage registry requires a cell for every family on every agent-facing surface. Author this repository's own first real scene through the new command as dogfooding evidence, covering an end-to-end workflow run that crosses more than one spec area; this is the first point in the milestone where a real scene can exist, because CLI-only authoring forbids hand-writing one before the command ships, and the scene is expected to reveal contract gaps the minimal example cannot. Carry the spec impact as a delta spec against cli-foundation. Tests cover each operation, the non-destructive write semantics, the refusal paths, the narrowing selector, and the surface projections.
depends_on:
  - define-scene-contract

planned_change:
  id: define-dsh-viewer-contract
  milestone: dsh-strict-spec-viewer-foundation
status: complete
summary: Define the dsh viewer behavior contract, its operator scene, and the plugin client technical standard before any plugin code exists.
details: 'Add a new main spec area for the dsh strict document viewer through a delta spec. It pins the tree taxonomy and order with the source paths of each group: config (config.yaml), architecture (architecture.yaml), roadmap (roadmap/INDEX.yaml, milestones/, planned-changes/, and archive/ holding archived milestones and planned changes), changes (active change directories and archive/), scenes (scenes/INDEX.yaml and scene subdirectories), specs (specs/INDEX.yaml and spec area subdirectories), tech (tech/INDEX.yaml and standards), lessons (lessons/INDEX.yaml and category subdirectories), SOPs (sops/INDEX.yaml, categories/, and SOP files), and design system (design-system.yaml), all under .strict-spec-driven/. A family absent from the workspace is omitted, not shown empty. It also pins display labels derived from artifact fields with filename fallback, where archived changes and archived roadmap items are labeled from their directory or file names so an archive can be listed without reading its files; archived groups collapsed by default and unread until expanded; an explicit truncation marker when a directory listing is cut; the read-only guarantee; declared field values shown as written, with no derived roadmap status or validation result; generic structured rendering of any strict document; located parse-error rendering; the empty state for a workspace without .strict-spec-driven/; live refresh for loaded directories and the open document; and the behavior of both entry points, including the Session picker of the left page. Author a delta scene for an operator browsing strict documents in dsh. Its main flow covers opening each entry point, expanding a group, expanding an archive, and opening a document. Its exception flows cover a missing workflow directory, a malformed YAML file, a file removed while open, a truncated directory listing, and a dsh release outside the compatibility pin. Every step names covering requirements. Add a delta technical standard in the ui category for plugin client conventions: React 18 components with dsh shared modules kept external; CSS Modules with --dsw-alias tokens and no literal colors; radius tokens; zh and en locale registration; data reaching components only through props and stores; a narrow engines.dsh pin; and component tests that render without a running dsh, for example through react-dom/server static rendering, so no browser or DOM test dependency is required unless the scaffold change justifies one. Exit when ready reports no scene coverage gap and the delta artifacts validate.'

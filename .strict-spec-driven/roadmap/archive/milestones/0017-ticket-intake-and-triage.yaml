schema: strict-spec-driven/roadmap-milestone/v2
schema_version: 2
artifact_type: roadmap_milestone
schema_file: templates/strict-spec-driven/schemas/roadmap-milestone.yaml
milestone:
  0017-ticket-intake-and-triage:
    title: 17 Ticket Intake And Triage
goal: Add a ticket intake layer in front of the roadmap so a pure requirement can be captured as a strict YAML ticket, triaged against existing specs, code, and docs to decide whether it is already implemented, and — when it is not — automatically promoted into a new roadmap milestone, completing a ticket -> roadmap milestone -> change -> spec/tech/code development path without losing requirement provenance.
scope:
  in:
    - Define a strict YAML ticket artifact contract (schema, example, bundled template, schema-registry entry, and a tickets index) for capturing a pure requirement — problem statement, desired observable outcome, and intent — separate from any solution, with conflict-resistant ticket ids, a lifecycle status enum, provenance links, an optional external-tracker reference, and an embedded triage-decision record that the CLI consumes.
    - Add deterministic CLI lifecycle support for tickets (create with conflict-resistant id generation, list, show, and validate) that creates, parses, validates, and maintains ticket YAML and the tickets index through structured APIs, keeping all filesystem mechanics and format enforcement in scripts and remaining idempotent on rerun.
    - Add a CLI triage-resolution command that accepts a supplied decision (outcome plus evidence and rationale), records it as the ticket's triage-decision record, and performs the deterministic state transition only, supporting three outcomes — not-implemented promotes the ticket into a new roadmap milestone skeleton and links ticket and milestone in both directions; implemented closes the ticket with evidence links; not-wanted rejects/defers the ticket with rationale — without itself judging whether the requirement is implemented.
    - Add a ticket command-domain behavior spec and spec-to-code mappings (carried as delta specs in the implementing changes) so the new command surface keeps this repository's self-hosted per-domain spec coverage consistent with the existing domain behavior specs and the coverage gate.
    - Add a ticket-creation skill that captures a requirement as pure intent (no solutioning) and scaffolds the ticket through the CLI.
    - Add a ticket-triage skill that reads a ticket, analyzes existing strict specs, implementation code, and documentation to judge whether the requirement is already implemented, drives the CLI to close, promote, or reject the ticket, defers to the user when evidence is ambiguous, and after a promotion hands off to milestone scope refinement, with the AI judgment confined to the skill prompt.
    - Carry ticket provenance through the roadmap by adding a milestone source-ticket back-reference that roadmap status and sync preserve, having roadmap-status surface the originating ticket and flag a freshly promoted milestone as needing scope refinement, and document the ticket -> milestone -> change -> spec/tech/code pipeline in user documentation including the Chinese equivalents.
    - Add regression coverage for ticket schema validation, lifecycle commands, all three triage outcomes (promote, close, reject), promotion idempotency (a rerun must not create a second milestone), bidirectional linking, behavior-spec mapping validity, and packaging validation for the two new skills, exercised against the repeatable real-project fixture.
  out:
    - Building an external ticket tracker, web UI, issue-sync integration (GitHub Issues, Jira, Linear), or notification system; tickets are local strict YAML artifacts, and external tracker references stay an optional link field rather than a live integration.
    - Promoting a triaged ticket into anything other than a new roadmap milestone; per the accepted direction every not-yet-implemented ticket becomes its own milestone, and milestone decomposition into planned changes remains the job of the existing roadmap milestone and plan workflows.
    - Moving the implemented-vs-not judgment into the CLI or making it a deterministic scripted heuristic; the determination is AI judgment recorded as a triage decision, and the CLI only performs the resulting state transition.
    - Auto-proposing or implementing strict changes directly from a ticket; the milestone is the handoff point, and existing roadmap-recommend, propose-from-roadmap, and apply workflows continue to own change creation and implementation.
    - Exposing the ticket commands as MCP tools or resources in this milestone; the integrated MCP server (M15) would logically gain ticket read and mutating tools, but that exposure is deliberately deferred to a focused follow-up so this milestone stays scoped to the CLI, skills, and roadmap wiring rather than re-opening the MCP contract.
    - Reworking unrelated roadmap milestones, spec contracts, or command domains beyond the minimum wiring and documentation needed to thread ticket provenance through the roadmap.
done_criteria:
  - A ticket artifact contract exists with a bundled schema, example, template, and schema-registry entry, plus a tickets index, ticket ids are conflict-resistant rather than drawn from a shared sequential counter, and the CLI rejects malformed tickets with actionable, path-aware diagnostics the same way other strict artifacts are validated.
  - The CLI can create a ticket with a conflict-resistant generated id, list tickets, show a ticket, and validate tickets, maintaining the tickets index deterministically and without clobbering existing ticket state on rerun.
  - The triage-resolution command consumes a supplied decision (outcome, evidence, rationale), records it as the ticket's triage-decision record, and deterministically applies one of three outcomes — promote, close-implemented, or reject/defer — with promotion being idempotent so a rerun never creates a second milestone.
  - Given a "not implemented" decision, the CLI materializes a new roadmap milestone skeleton seeded from the ticket (goal copied from the ticket's desired outcome; scope and done_criteria left as an explicitly marked refinement stub), allocates the next milestone number deterministically and refuses rather than overwrites on collision, registers it in the roadmap index, sets the ticket status to promoted, and links ticket.promoted_to and the milestone source-ticket back-reference so provenance is recoverable from either side.
  - Given an "implemented" decision the CLI closes the ticket and records evidence links to the implementing specs, code, or docs; given a "not wanted" decision the CLI marks the ticket rejected/deferred with the recorded rationale — both leaving an auditable trail rather than silently discarding the ticket.
  - The new ticket command domain is described by a behavior-contract main spec with valid spec-to-code mappings, so it matches the per-domain spec coverage the rest of the CLI surface already has and stays within the declared coverage gate.
  - A ticket-creation skill captures pure requirement intent without solutioning and scaffolds the ticket through the CLI, and a ticket-triage skill performs the implemented-vs-not analysis against specs, code, and docs, drives the CLI to close, promote, or reject, defers to the user on ambiguous evidence, and after a promotion hands off to /strict-roadmap-milestone for scope refinement, with all AI judgment confined to the skill prompts.
  - roadmap-status and roadmap-sync preserve the milestone source-ticket back-reference without dropping or duplicating it, roadmap-status surfaces the originating ticket and flags a freshly promoted milestone as needing scope refinement, and user documentation (including Chinese equivalents) explains the ticket -> milestone -> change -> spec/tech/code pipeline and the boundary between AI judgment and CLI state transitions.
  - Regression tests cover ticket schema validation, lifecycle commands, all three triage outcomes, promotion idempotency and bidirectional linking, behavior-spec mapping validity, and skill packaging validation, exercised against the repeatable real-project fixture so future edits cannot silently break the ticket layer.
intake_questions:
  - id: objective
    question: What observable outcome should this milestone deliver?
    context: Milestone goal text can be broad; this question keeps the outcome testable before work is decomposed.
    impact: Unclear objective affects milestone scope, planned-change summaries, and proposal scope for every child change.
    recommendation: Answer with one user- or operator-observable outcome that can be checked after the milestone is complete.
  - id: scope-boundary
    question: What is included in this milestone, and what is explicitly out of scope?
    context: The roadmap already has scope.in and scope.out fields, but the boundary decision must be called out as a required clarification.
    impact: Unclear scope affects planned-change ownership, milestone splitting, and whether later changes silently expand scope.
    recommendation: Use the milestone scope fields as evidence and keep unrelated work out of this milestone.
  - id: done-criteria
    question: What concrete evidence proves this milestone is done?
    context: Done criteria need to be verifiable rather than aspirational.
    impact: Weak done criteria affect roadmap review, archive readiness, and follow-up change prioritization.
    recommendation: Name the observable behavior, validation command, documentation, or archived planned changes that prove completion.
  - id: work-decomposition
    question: What standalone planned changes are needed to deliver this milestone?
    context: Roadmap recommendation works from planned-change artifacts, not from hidden prose inside the milestone.
    impact: Missing decomposition affects proposal generation and can block roadmap-backed automatic implementation.
    recommendation: Create focused standalone planned-change files with actionable summary, details, dependencies, and status.
  - id: dependencies-and-blockers
    question: What dependencies or blockers must be resolved before this milestone can progress?
    context: Dependencies may come from other milestones, active changes, tickets, services, credentials, or external decisions.
    impact: Unknown blockers affect ordering, roadmap recommendation eligibility, and implementation handoff.
    recommendation: Record known dependencies in dependencies and preserve unresolved blockers in milestone notes or planned-change detail.
  - id: risks
    question: What compatibility, data, security, privacy, performance, release, or rollback risks could change the plan?
    context: Roadmap milestones often establish the risk surface before individual strict changes are proposed.
    impact: Unidentified risks affect scope, technical standards, tests, release sequencing, and rollback planning.
    recommendation: Record concrete risks in risks and keep mitigations small enough to map into planned changes.
  - id: verification-evidence
    question: How will milestone work be verified across implementation, tests, docs, and workflow artifacts?
    context: The change-intake gate requires a proof plan before implementation begins.
    impact: Missing verification affects planned-change testing tasks and archive confidence.
    recommendation: Identify the relevant test suite, validation command, documentation check, or manual evidence expected for child changes.
  - id: technical-standards
    question: Which existing technical standards apply, or does this milestone require a new standard?
    context: Technical rules live under .strict-spec-driven/tech/ and must be known before changes are implemented.
    impact: Unclear standards affect implementation files, tests, and whether a child change needs a delta-tech artifact.
    recommendation: List applicable standards or record a follow-up to add or update a technical standard when the milestone needs one.
planned_changes: {}
dependencies:
  - The roadmap milestone and roadmap index v2 contracts are the integration surface; the ticket layer adds a milestone source-ticket back-reference and reuses milestone materialization rather than introducing a parallel planning structure.
  - The conflict-resistant team roadmap model (M11) is the precedent for ticket id design and shared-index discipline; ticket intake is a high-churn multi-author surface, so it must not reintroduce the shared sequential counter that M11 removed.
  - The self-hosted per-command-domain behavior specs and mappings (M14) and the coverage gate (M16) are the precedent the ticket command domain must match, so the ticket surface ships with its own behavior spec and mappings rather than landing as uncovered code.
  - The integrated MCP server (M15) is the surface a later follow-up would extend to expose ticket tools; this milestone records that deferral so the boundary is explicit rather than an accidental omission.
  - The standalone planned-change model and existing roadmap-recommend / propose-from-roadmap / apply workflows remain the path from milestone to change; this milestone stops at producing a milestone and must not duplicate or bypass that downstream pipeline.
  - The triage skill depends on the existing strict spec index, spec-to-code mappings, and repository docs being the evidence base for the implemented-vs-not judgment; the quality of that judgment is bounded by current spec coverage.
  - Skill packaging, frontmatter, command-reference, and symlink validation rules apply to the two new skills, so they must follow the established strict-spec-* / strict-ticket-* packaging conventions.
risks:
  - Always promoting a ticket to a full milestone (the accepted direction) can produce thin single-change milestones for small requirements; the triage and milestone workflows must guide reasonable scoping and allow later milestone refinement so the roadmap does not fill with near-empty milestones.
  - Milestone ids are sequential and stable, so two tickets promoted concurrently would both target the next number; materialization must allocate the milestone number deterministically and detect and refuse a collision rather than overwrite an existing milestone, and this race must be covered by tests.
  - A shared sequential ticket counter would reintroduce the Git merge conflicts that M11 eliminated for planned changes; the ticket id scheme must stay conflict-resistant (slug- or content-derived, not a global counter), or the intake surface becomes a conflict hotspot precisely because many people file tickets.
  - The implemented-vs-not judgment is only as reliable as current spec, mapping, and documentation coverage; a triage skill that over-trusts incomplete specs could wrongly close a ticket, so the skill must record the evidence it relied on and defer to the user when evidence is ambiguous.
  - Splitting responsibilities so the CLI performs the state transition while the skill makes the judgment is essential; if any implemented-vs-not heuristic leaks into the CLI, the contract becomes an unverifiable scripted guess and the human checkpoint is lost.
  - The CLI cannot derive milestone scope from requirement prose without making judgments; if promotion fabricates scope or done_criteria, the roadmap fills with misleading planning text, so the CLI must seed only the goal and leave scope as an explicit refinement stub handed off to the milestone workflow.
status: complete
notes:
  - Pure-requirement capture means the ticket records problem, desired observable outcome, and intent only; solutioning belongs in the milestone, change, and spec artifacts downstream, mirroring the spec rule that specs describe observable behavior rather than implementation.
  - Ticket ids should be conflict-resistant (slug- or content-derived, mirroring the standalone planned-change file model from M11) rather than drawn from a shared sequential counter, because ticket intake is the highest-churn multi-author surface in the workflow; finalize the exact scheme in the contract change.
  - The triage decision is passed to the CLI as command arguments (outcome plus repeatable evidence references plus rationale); the CLI records the structured triage-decision record onto the ticket and performs the transition, so skills never hand-write ticket YAML — they always go through the command.
  - On promotion the CLI seeds the new milestone goal by copying the ticket's desired outcome and leaves scope and done_criteria as a clearly marked refinement stub; the triage skill then runs roadmap-sync and hands off to /strict-roadmap-milestone (or /strict-roadmap-plan) for real scope definition rather than fabricating it.
  - The natural implementation order is contract first, then lifecycle CLI (carrying the ticket behavior spec and mappings), then triage/promotion CLI, then the two skills (creation depends on lifecycle, triage depends on promotion), then roadmap provenance wiring plus docs, then regression coverage; the standalone planned changes encode these dependencies.
  - Suggested command naming follows the existing surface — ticket-create, ticket-list, ticket-show, ticket-validate, and a ticket-resolve transition command — and skill naming follows strict-spec-ticket for creation and strict-ticket-triage for assessment; finalize exact names in the contract change.
  - Exposing ticket commands through the M15 MCP server (read tools for list/show, mutating tools for create/resolve, and a tickets resource) is a coherent follow-up but is intentionally out of scope here to keep the MCP contract closed; the deferral is recorded so it is a decision, not an oversight.
  - External tracker ids (GitHub/Jira/Linear) are accommodated only as an optional reference field on the ticket, reusing the team-metadata pattern already established for planned changes; no live sync is in scope.
details: |-
  This milestone adds the missing front door to the strict workflow. Today the earliest formal artifact is a roadmap milestone or a standalone change proposal, both of which already assume someone has decided the work is worth doing and is not already built. Raw requests have nowhere to live as first-class, validated state, and the "is this already implemented?" question is answered ad hoc. The accepted direction introduces a ticket as a strict YAML artifact that captures a pure requirement — problem, desired observable outcome, and intent — with no solution, then formalizes a two-step intake: capture, then triage.

  Triage is where the value concentrates. A ticket-triage skill reads the ticket and analyzes the existing strict specs, spec-to-code mappings, implementation code, and documentation to judge whether the requirement is already satisfied. That judgment is AI work and stays entirely in the skill prompt. The CLI exposes only a deterministic transition: the skill passes the decision (outcome, evidence, rationale) as command arguments, the CLI records it as the ticket's triage-decision record, and applies one of three outcomes. An "implemented" outcome closes the ticket and records evidence links to the satisfying specs/code/docs; a "not wanted" outcome rejects or defers the ticket with rationale; a "not implemented" outcome materializes a new roadmap milestone skeleton seeded from the requirement. Because the CLI cannot judge scope from prose, promotion copies only the ticket's desired outcome into the milestone goal and leaves scope and done_criteria as an explicitly marked refinement stub — the skill then runs roadmap-sync and hands off to /strict-roadmap-milestone for real scope work. Promotion registers the milestone in the roadmap index, marks the ticket promoted, and links ticket.promoted_to to the milestone and a milestone source-ticket back-reference to the ticket, so provenance is recoverable from either end and is preserved by roadmap status and sync.

  Two structural concerns shaped the design. First, tickets are the highest-churn multi-author surface in the workflow, so ticket ids must be conflict-resistant — slug- or content-derived in the spirit of M11's standalone planned-change files — not drawn from a shared sequential counter that would reintroduce the merge conflicts M11 removed. Milestone ids, by contrast, are sequential and stable, so concurrent promotion can race for the next number; materialization must allocate deterministically and refuse a collision rather than overwrite, and tests must cover both the race and promotion idempotency. Second, to keep faith with the repository's self-hosting discipline (every command domain has a behavior spec since M14, under the M16 coverage gate), the ticket command surface ships with its own behavior-contract spec and spec-to-code mappings carried as delta specs in the implementing changes, rather than landing as uncovered code.

  The work is sequenced as: define the ticket contract and tickets index; add the lifecycle CLI (create/list/show/validate) that owns all filesystem mechanics, validation, and the ticket behavior spec; add the triage-resolution CLI transition that records the decision and promotes, closes, or rejects; add the ticket-creation skill (pure intent, no solutioning) and the ticket-triage skill (judgment plus CLI drive plus milestone-refinement handoff); thread the source-ticket back-reference through roadmap status, sync, and user documentation including the Chinese equivalents; and pin the whole flow with regression coverage against the repeatable real-project fixture. Exposing the ticket commands through the M15 MCP server is recorded as a deliberate follow-up rather than folded in here.

summary: add a behavior-contract main spec for the harness command domain that records the hardened lifecycle behavior as durable requirements and re-points harness mappings onto the new spec.
details: 'The harness domain (harness-infer, harness-doctor, harness-plan, harness-start, harness-stop, harness-status, harness-logs, harness-scripts, and harness-session) received substantial behavior hardening in milestone 0013 but that behavior lives in tests and HARNESS.md rather than in a main spec. Add a main spec under .strict-spec-driven/specs/harness/ capturing the reconciled observable contract: the declarative status and logs operation model, the harness-logs output bound and its default, the missing-environment diagnostic and name-only secret policy, harness-infer runtime detection and its explicit no-inference evidence, and partial-start reporting of still-running components with recovery commands. Keep requirements observable and aligned with the 0013 done_criteria. Register the spec in specs/INDEX.yaml, move harness implementation and test mapping entries from cli-foundation to this spec, and confirm verify-spec-mappings reports zero unmapped files.'

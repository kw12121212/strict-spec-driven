planned_change:
  id: add-ticket-triage-skill
  milestone: 0017-ticket-intake-and-triage
status: complete
summary: Add a ticket-triage skill that analyzes existing strict specs, code, and docs to judge whether a ticket is already implemented, then drives the CLI to close it with evidence, promote it into a new milestone, or reject/defer it.
details: |-
  Create a strict skill package (suggested name strict-ticket-triage) following established skill packaging conventions. The skill performs the implemented-vs-not judgment that the CLI deliberately does not: it reads the target ticket, then inspects the strict spec index, spec-to-code mappings, implementation code, and repository documentation to determine whether the requirement's desired observable outcome is already satisfied.

  Flow: run the workflow-state check and stop with an init instruction if .strict-spec-driven/ is missing; select or accept the ticket to triage; gather evidence and form a judgment; then drive the triage-resolution CLI command with the decided outcome, the evidence references, and a rationale. On an implemented judgment, close the ticket and record the concrete evidence links the judgment relied on. On a not-implemented judgment, promote the ticket via the CLI (which materializes a milestone skeleton with the goal seeded from the requirement), then run roadmap-sync and hand off to /strict-roadmap-milestone (or /strict-roadmap-plan) to define real scope, done criteria, and dependencies — the skill must not fabricate that scope itself or decompose into changes. On a not-wanted judgment, reject/defer the ticket with a rationale.

  The skill must record the evidence it relied on in the triage-decision record and must defer to the user — leaving the ticket open or in the deferred/needs-input state — when the evidence is ambiguous or spec coverage is too thin to decide confidently, rather than guessing. All judgment stays in the prompt; all state transitions, milestone creation, and linking go through the CLI.
depends_on:
  - add-ticket-triage-and-promotion-cli
  - add-ticket-create-skill
team:
  blocked:
    status: false
  labels:
    - ticket
    - skill
    - triage

schema: strict-spec-driven/planned-change/v1
schema_version: 1
artifact_type: planned_change
schema_file: ../../templates/strict-spec-driven/schemas/planned-change.yaml
planned_change:
  id: align-roadmap-backed-intake-flows
  milestone: 0018-change-intake-question-gates
status: complete
summary: Apply the same plain checklist to roadmap-backed, ticket-promoted, and recommendation-driven proposal flows without losing roadmap detail as evidence.
details: |-
  Update the roadmap-backed and ticket-backed proposal entry points: strict-roadmap-recommend, strict-roadmap-propose, strict-spec-propose-from-roadmap, strict-spec-auto when resuming a roadmap-backed scaffold, and strict-ticket-dispatch after it promotes a ticket into a milestone. These flows must use planned-change and ticket provenance details as evidence for the plain checklist while rendering any human-facing unresolved questions in .strict-spec-driven/config.yaml preferred_human_language.

  Required behavior:
  - Treat the selected standalone planned-change summary, details, depends_on, labels, source ticket, and milestone details as valid evidence.
  - Preserve the existing rule that roadmap recommendation chooses exactly one eligible planned change without manual selection.
  - When roadmap detail answers a checklist question, carry that answer into proposal/design/task artifacts instead of re-asking.
  - When roadmap detail is thin or a code/spec search fails to identify affected behavior, create questions.yaml.open entries before implementation.
  - Make the open-question impact mention, in preferred_human_language, whether the uncertainty affects proposal scope, spec delta, implementation files, tests, dependencies, or technical standards.
  - Avoid mutating roadmap planned-change files during proposal creation except through the existing roadmap workflows.

  Add regression cases for a roadmap item with complete details that proceeds without open questions and a roadmap item with missing implementation/test/spec impact that creates blocking questions.
depends_on:
  - define-change-intake-question-contract
  - update-proposal-skills-for-question-gate
team:
  blocked:
    status: false
  labels:
    - change-intake
    - roadmap
    - tickets

schema: strict-spec-driven/task-list/v1
schema_version: 1
artifact_type: task_list
schema_file: templates/strict-spec-driven/schemas/task-list.yaml
change: compact-spec-format
sections:
  - name: Implementation
    tasks:
      - id: implement-change
        text: Implement the scoped workflow behavior.
        status: complete
  - name: Testing
    tasks:
      - id: run-build
        text: Run build validation.
        status: complete
        command: bun run build
      - id: run-tests
        text: Run unit tests.
        status: complete
        command: bun test/run.ts
  - name: Verification
    tasks:
      - id: verify-scope
        text: Verify implementation matches proposal scope.
        status: complete
testing_gates:
  validation_task: run-build
  unit_test_task: run-tests

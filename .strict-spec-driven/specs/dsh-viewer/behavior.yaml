schema: strict-spec-driven/main-spec/v1
schema_version: 1
artifact_type: main_spec
schema_file: templates/strict-spec-driven/schemas/main-spec.yaml
spec:
  id: dsh-viewer-behavior
  title: DSH Strict Document Viewer Behavior
requirements:
  tree-family-order:
    strength: MUST
    statement: 'The document tree presents the strict artifact families of the shown Session workspace in the fixed order config, architecture, roadmap, changes, scenes, specs, tech, lessons, SOPs, and design system, populating each family from its canonical locations under .strict-spec-driven/: config.yaml for config, architecture.yaml for architecture, roadmap/INDEX.yaml with milestones/, planned-changes/, and archive/ for roadmap, the active change directories with archive/ for changes, scenes/INDEX.yaml with the scene subdirectories for scenes, specs/INDEX.yaml with the spec area subdirectories for specs, tech/INDEX.yaml with the standards for tech, lessons/INDEX.yaml with the category subdirectories for lessons, sops/INDEX.yaml with categories/ and the SOP files for SOPs, and design-system.yaml for the design system.'
    scenarios:
      families-in-fixed-order:
        - GIVEN: the shown Session workspace is a strict-spec-driven repository containing config, architecture, roadmap, changes, scenes, specs, tech, and lessons artifacts
        - WHEN: the document tree is rendered
        - THEN: the families appear in the fixed order config, architecture, roadmap, changes, scenes, specs, tech, lessons, SOPs, design system, each populated from its canonical locations under .strict-spec-driven/
      family-source-paths:
        - GIVEN: the workspace holds a roadmap index, milestone files, planned-change files, and an archived roadmap directory
        - WHEN: the roadmap family is listed
        - THEN: it presents the recorded milestones, planned changes, and archived items sourced from roadmap/INDEX.yaml, roadmap/milestones/, roadmap/planned-changes/, and roadmap/archive/
  absent-family-omitted:
    strength: MUST
    statement: A strict artifact family whose canonical locations are absent from the workspace is omitted from the document tree rather than shown as an empty group.
    scenarios:
      absent-family-omitted:
        - GIVEN: the workspace holds no sops directory and no design-system.yaml
        - WHEN: the document tree is rendered
        - THEN: the SOPs and design-system families are omitted entirely rather than shown as empty groups
  document-labels:
    strength: MUST
    statement: Each tree node carries a display label derived from the document's declared artifact fields, falling back to the file name when no declaring field is available, and archived changes and archived roadmap items are labeled from their directory or file names alone so an archive can be listed without reading its files.
    scenarios:
      label-from-artifact-fields:
        - GIVEN: a listed document declares identifying artifact fields such as an id or title
        - WHEN: its tree node renders
        - THEN: the label is derived from those declared fields, with the file name used only when no declaring field is available
      archived-labels-without-reading:
        - GIVEN: the change archive holds dated change directories and the roadmap archive holds archived milestone and planned-change files
        - WHEN: the archived groups are listed
        - THEN: every archived entry is labeled from its directory or file name alone, without the viewer reading the archived files' contents
  archive-groups-collapsed:
    strength: MUST
    statement: Archived groups render collapsed by default, and the entries of a collapsed archived group are not read from the workspace until the operator expands it.
    scenarios:
      collapsed-unread-by-default:
        - GIVEN: the workspace holds a change archive and a roadmap archive
        - WHEN: the document tree first renders
        - THEN: both archived groups are collapsed and their entries have not been read from the workspace
      read-on-expand:
        - GIVEN: an archived group is collapsed and its entries unread
        - WHEN: the operator expands the group
        - THEN: its entries are listed after being read on expansion
  truncated-listing-marker:
    strength: MUST
    statement: When the entries available for a directory are cut short by the host's directory-listing limit, the tree shows an explicit truncation marker for that directory rather than implying the listing is complete.
    scenarios:
      marker-when-cut:
        - GIVEN: the entries available for a listed directory are cut short by the host's directory-listing limit
        - WHEN: the directory's group renders
        - THEN: the tree shows an explicit truncation marker identifying the directory as incompletely listed
  read-only-viewing:
    strength: MUST
    statement: The viewer offers no control that writes, edits, or deletes strict workflow files, and viewing interactions leave the contents of every listed file unchanged.
    scenarios:
      no-mutation-controls:
        - GIVEN: the viewer is open on a workspace
        - WHEN: its tree and document views are inspected and their controls exercised
        - THEN: no control writes, edits, or deletes strict workflow files, and the contents of every listed file are unchanged after viewing
  declared-values-only:
    strength: MUST
    statement: Document views show declared field values exactly as written in the file, and never present a derived roadmap status, validation result, or any other value not written in the file.
    scenarios:
      values-as-written:
        - GIVEN: an open strict document declares field values such as a status or an order
        - WHEN: the document view renders
        - THEN: it shows the declared values exactly as written and presents no derived roadmap status, validation result, or other value not written in the file
  generic-structured-rendering:
    strength: MUST
    statement: Opening any strict document from the tree renders it as a structured view of its YAML fields, uniformly for every artifact type.
    scenarios:
      any-document-structured:
        - GIVEN: any strict document in the tree, including artifact types without a dedicated renderer
        - WHEN: the operator opens it
        - THEN: it renders as a structured view of its YAML fields, uniformly for every artifact type
  located-parse-error:
    strength: MUST
    statement: Opening a strict document whose YAML cannot be parsed renders a parse-error view naming the error's location alongside the document's raw text, while the tree and the open view keep working.
    scenarios:
      parse-error-located:
        - GIVEN: a strict document in the tree contains YAML that cannot be parsed
        - WHEN: the operator opens it
        - THEN: the view renders a parse error naming the error's location instead of failing the tree or the open view
      parse-error-shows-raw-text:
        - GIVEN: an open strict document failed to parse
        - WHEN: the parse-error view renders
        - THEN: it shows the raw document text beside the located message
  empty-state:
    strength: MUST
    statement: When the shown workspace has no .strict-spec-driven/ directory, both entry points show an explicit empty state instead of a document tree.
    scenarios:
      no-workflow-directory:
        - GIVEN: the shown workspace has no .strict-spec-driven/ directory
        - WHEN: either entry point opens
        - THEN: it shows an explicit empty state instead of a document tree
  live-refresh:
    strength: MUST
    statement: Loaded tree directories and the open document refresh automatically when their files change on disk without a manual reload, and an open document removed from disk is reflected as no longer present.
    scenarios:
      loaded-directory-refresh:
        - GIVEN: a tree directory has been loaded
        - WHEN: a strict file inside that directory changes on disk
        - THEN: the tree refreshes that directory without a manual reload
      open-document-refresh:
        - GIVEN: a strict document is open in the view
        - WHEN: the open file changes on disk
        - THEN: the open view refreshes to the new content without a manual reload
      removed-document-reflected:
        - GIVEN: a strict document is open in the view
        - WHEN: the open file is deleted from disk
        - THEN: the view and the loaded tree update to reflect that the document is no longer present
  right-sidebar-tab:
    strength: MUST
    statement: The strict documents right-sidebar tab is discoverable from the right sidebar's guide, follows the active Session, shows that Session's workspace through the shared document tree and document view within the pane width, and closes the previous Session's workspace watches when the active Session switches.
    scenarios:
      tab-follows-active-session:
        - GIVEN: the operator switches the active Session in the dsh client while the strict documents right-sidebar tab is open
        - WHEN: the tab renders
        - THEN: it shows the active Session's workspace through the shared document tree and document view within the pane width
      guide-entry-opens-tab:
        - GIVEN: the right sidebar's guide lists the strict documents entry
        - WHEN: the operator picks the entry
        - THEN: the strict documents tab opens for the active Session and shows that Session's workspace through the shared document tree and document view
      previous-session-watches-closed:
        - GIVEN: the strict documents tab shows one Session's workspace
        - WHEN: the operator switches the active Session
        - THEN: the previous Session's directory and document watches close, so changes under the previous Session no longer refresh any open view
  left-page-session-picker:
    strength: MUST
    statement: The plugin registers a left-sidebar panel row in sidebar.panellist and a main keyed page under the same panel id, and the page offers an explicit Session picker that groups the Sessions of each workspace under that workspace, remembers the last chosen Session across openings, and shows the chosen Session's workspace through the same tree behavior and document rendering as the right-sidebar tab.
    scenarios:
      picker-chooses-session:
        - GIVEN: the left-sidebar page is open
        - WHEN: the operator picks a Session in the Session picker
        - THEN: the page shows that Session's workspace through the same tree behavior and document rendering as the right-sidebar tab
      sessions-grouped-by-workspace:
        - GIVEN: the host holds Sessions belonging to several workspaces
        - WHEN: the Session picker renders
        - THEN: every Session is offered under the workspace it belongs to, grouped by workspace
      last-choice-remembered:
        - GIVEN: a Session was chosen in the page on a previous opening
        - WHEN: the page is opened again
        - THEN: that Session is the chosen one without the operator re-picking it
  host-compatibility-gate:
    strength: MUST
    statement: The viewer declares a dsh release compatibility range and registers no document UI when the running dsh release falls outside that range, so no partially working tree or document view is shown.
    scenarios:
      outside-pin-no-ui:
        - GIVEN: the viewer plugin declares a dsh release compatibility range
        - WHEN: a dsh release outside that range loads the plugin
        - THEN: no viewer document UI registers and no partially working tree or document view is shown
  tree-node-presentation:
    strength: MUST
    statement: Each document tree node presents a file-type glyph, each group whose entries are loaded presents its entry count, milestone and planned-change nodes present a badge of the status declared in their file, and nesting depth renders as one consistent indentation step per level.
    scenarios:
      loaded-presentation:
        - GIVEN: the tree shows families, loaded groups, and non-archived milestone and planned-change documents
        - WHEN: the tree renders
        - THEN: every document node presents a file-type glyph, every loaded group presents its entry count, milestone and planned-change nodes present their declared status as a badge, and each nesting level indents one consistent step deeper
      unloaded-group-no-count:
        - GIVEN: a collapsed group whose entries have not been listed
        - WHEN: its row renders
        - THEN: it presents no entry count rather than an assumed one
  tree-keyboard-navigation:
    strength: MUST
    statement: The operator can move between visible tree nodes, expand and collapse the focused group, and open the focused document using only the keyboard, with the focused node kept visible.
    scenarios:
      keyboard-moves-focus:
        - GIVEN: the document tree is focused
        - WHEN: the operator moves focus with the keyboard
        - THEN: focus moves node by node through the visible rows and the focused row is kept visible
      keyboard-expands-and-opens:
        - GIVEN: a group row or a document row is focused
        - WHEN: the operator triggers the expand or open action from the keyboard
        - THEN: the focused group expands or collapses, and the focused document opens in the document view
  tree-expand-persistence:
    strength: MUST
    statement: Expand and collapse choices are kept per workspace, so a workspace shown again restores its previous expand choices, and an archived group whose expansion is restored still has its entries read only through that expansion.
    scenarios:
      workspace-expand-restored:
        - GIVEN: the operator expanded and collapsed groups of one workspace and the viewer moved to another workspace
        - WHEN: the first workspace is shown again
        - THEN: its previous expand choices are restored
      restored-archive-still-read-on-expand:
        - GIVEN: an archived group expansion is restored for a re-shown workspace
        - WHEN: the group renders expanded
        - THEN: its entries are read for that rendering and were not read while it was collapsed
  generic-renderer-structure:
    strength: MUST
    statement: The structured document view renders top-level scalar fields as a header, mapping fields as titled sections, sequence fields as lists, multiline text as wrapped paragraphs, and deeply nested structures as collapsible blocks, uniformly for every artifact type.
    scenarios:
      yaml-shapes-to-presentation:
        - GIVEN: an open strict document mixes top-level scalars, mappings, sequences, and multiline text
        - WHEN: the document view renders
        - THEN: scalars appear in the header, mappings as titled sections, sequences as lists, multiline text as wrapped paragraphs, and deep nesting as collapsible blocks
      deep-nesting-collapsible:
        - GIVEN: an open strict document nests mappings beyond the top level
        - WHEN: the view renders
        - THEN: the nested mappings render as collapsible blocks the operator can expand and collapse
  viewer-status-conditions:
    strength: MUST
    statement: Each viewer surface shows a loading condition while its data is loading and an explicit error condition naming the failure when a load fails, instead of an empty or frozen presentation.
    scenarios:
      loading-condition:
        - GIVEN: a workspace tree load or a document load is in flight
        - WHEN: the surface renders
        - THEN: a loading condition shows until the load settles
      listing-error-condition:
        - GIVEN: the workflow root listing fails
        - WHEN: the tree renders
        - THEN: an explicit error condition names the failure rather than presenting an empty tree
  left-page-two-pane-layout:
    strength: MUST
    statement: The left-sidebar page lays the document tree out in a left pane and the open document in a wide right pane, so a selected strict document can be read at width.
    scenarios:
      two-pane-reading:
        - GIVEN: a Session is chosen in the left-sidebar page and one of its strict documents is open
        - WHEN: the page renders
        - THEN: the document tree occupies the left pane and the open document renders in a wide right pane beside it
  left-page-no-session-prompt:
    strength: MUST
    statement: When the workspace the operator wants to read holds no Session, the left-sidebar page shows a prompt to open a Session for that workspace instead of reading its files.
    scenarios:
      no-session-prompt:
        - GIVEN: the workspace wanted in the left-sidebar page holds no Session
        - WHEN: the page renders for that workspace
        - THEN: it shows an explicit prompt to open a Session for that workspace and reads none of its workflow files
  left-page-selection-restore:
    strength: MUST
    statement: The left-sidebar page keeps the chosen Session and the selected document in page state, so opening the page again restores both.
    scenarios:
      reopen-restores-selection:
        - GIVEN: the operator chose a Session and opened a strict document in the left-sidebar page
        - WHEN: the page is opened again
        - THEN: the same Session is chosen and the same document is selected without the operator re-choosing either

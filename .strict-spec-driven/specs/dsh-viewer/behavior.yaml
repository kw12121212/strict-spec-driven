schema: strict-spec-driven/main-spec/v1
schema_version: 1
artifact_type: main_spec
schema_file: templates/strict-spec-driven/schemas/main-spec.yaml
spec:
  id: dsh-viewer-behavior
  title: DSH Strict Document Viewer Behavior
requirements:
  tree-family-order:
    strength: MUST
    statement: 'The document tree presents the strict artifact families of the shown Session workspace in the fixed order config, architecture, roadmap, changes, scenes, specs, tech, lessons, SOPs, and design system, populating each family from its canonical locations under .strict-spec-driven/: config.yaml for config, architecture.yaml for architecture, roadmap/INDEX.yaml with milestones/, planned-changes/, and archive/ for roadmap, the active change directories with archive/ for changes, scenes/INDEX.yaml with the scene subdirectories for scenes, specs/INDEX.yaml with the spec area subdirectories for specs, tech/INDEX.yaml with the standards for tech, lessons/INDEX.yaml with the category subdirectories for lessons, sops/INDEX.yaml with categories/ and the SOP files for SOPs, and design-system.yaml for the design system.'
    scenarios:
      families-in-fixed-order:
        - GIVEN: the shown Session workspace is a strict-spec-driven repository containing config, architecture, roadmap, changes, scenes, specs, tech, and lessons artifacts
        - WHEN: the document tree is rendered
        - THEN: the families appear in the fixed order config, architecture, roadmap, changes, scenes, specs, tech, lessons, SOPs, design system, each populated from its canonical locations under .strict-spec-driven/
      family-source-paths:
        - GIVEN: the workspace holds a roadmap index, milestone files, planned-change files, and an archived roadmap directory
        - WHEN: the roadmap family is listed
        - THEN: it presents the recorded milestones, planned changes, and archived items sourced from roadmap/INDEX.yaml, roadmap/milestones/, roadmap/planned-changes/, and roadmap/archive/
  absent-family-omitted:
    strength: MUST
    statement: A strict artifact family whose canonical locations are absent from the workspace is omitted from the document tree rather than shown as an empty group.
    scenarios:
      absent-family-omitted:
        - GIVEN: the workspace holds no sops directory and no design-system.yaml
        - WHEN: the document tree is rendered
        - THEN: the SOPs and design-system families are omitted entirely rather than shown as empty groups
  document-labels:
    strength: MUST
    statement: Each tree node carries a display label derived from the document's declared artifact fields, falling back to the file name when no declaring field is available, and archived changes and archived roadmap items are labeled from their directory or file names alone so an archive can be listed without reading its files.
    scenarios:
      label-from-artifact-fields:
        - GIVEN: a listed document declares identifying artifact fields such as an id or title
        - WHEN: its tree node renders
        - THEN: the label is derived from those declared fields, with the file name used only when no declaring field is available
      archived-labels-without-reading:
        - GIVEN: the change archive holds dated change directories and the roadmap archive holds archived milestone and planned-change files
        - WHEN: the archived groups are listed
        - THEN: every archived entry is labeled from its directory or file name alone, without the viewer reading the archived files' contents
  archive-groups-collapsed:
    strength: MUST
    statement: Archived groups render collapsed by default, and the entries of a collapsed archived group are not read from the workspace until the operator expands it or opens a document inside it.
    scenarios:
      collapsed-unread-by-default:
        - GIVEN: the workspace holds a change archive and a roadmap archive
        - WHEN: the document tree first renders
        - THEN: both archived groups are collapsed and their entries have not been read from the workspace
      read-on-expand:
        - GIVEN: an archived group is collapsed and its entries unread
        - WHEN: the operator expands the group
        - THEN: its entries are listed after being read on expansion
      read-on-navigation:
        - GIVEN: an archived group is collapsed and its entries unread
        - WHEN: the operator opens a document inside it through a link in a view or a restored page selection
        - THEN: the group expands and its entries are listed after being read, and no other archived group is read
  truncated-listing-marker:
    strength: MUST
    statement: When the entries available for a directory are cut short by the host's directory-listing limit, the tree shows an explicit truncation marker for that directory rather than implying the listing is complete.
    scenarios:
      marker-when-cut:
        - GIVEN: the entries available for a listed directory are cut short by the host's directory-listing limit
        - WHEN: the directory's group renders
        - THEN: the tree shows an explicit truncation marker identifying the directory as incompletely listed
  read-only-viewing:
    strength: MUST
    statement: The viewer offers no control that writes, edits, or deletes strict workflow files, and viewing interactions leave the contents of every listed file unchanged; the single control that hands work to a Session is the confirmed milestone goal launch control of the roadmap index view, which submits a goal to the bound Session's agent and itself writes no file.
    scenarios:
      no-mutation-controls:
        - GIVEN: the viewer is open on a workspace
        - WHEN: its tree and document views are inspected and their controls exercised
        - THEN: no control writes, edits, or deletes strict workflow files, and the contents of every listed file are unchanged after viewing
      goal-launch-writes-no-file:
        - GIVEN: the roadmap index view is open in a Session-bound surface
        - WHEN: the operator activates and then cancels or confirms the milestone goal launch control
        - THEN: the viewer itself writes no strict workflow file, and any file change afterwards comes only from the Session agent running the submitted goal
  declared-values-only:
    strength: MUST
    statement: Document views show declared field values exactly as written in the file, and never present a derived roadmap status, validation result, or any other value not written in the file, with the single exception of task completion counts, which summarize the declared status fields of a change's tasks.
    scenarios:
      values-as-written:
        - GIVEN: an open strict document declares field values such as a status or an order
        - WHEN: the document view renders
        - THEN: it shows the declared values exactly as written and presents no derived roadmap status, validation result, or other value not written in the file
      completion-summarizes-declared-statuses:
        - GIVEN: an open change tasks document declares task statuses across its sections
        - WHEN: the tasks view renders
        - THEN: its per-section and overall completion counts count exactly the declared statuses, complete against all, and the view presents no other computed value
  generic-structured-rendering:
    strength: MUST
    statement: Opening any strict document whose artifact type has no dedicated renderer renders it as a structured view of its YAML fields, uniformly for every such type, and a document whose type has a dedicated renderer renders that renderer's layout with every top-level field the layout does not present appended through the same structured view under an additional-fields section.
    scenarios:
      fallback-types-stay-generic:
        - GIVEN: An open strict document declares an artifact type no dedicated renderer serves, such as an artifact type the strict vocabulary does not define or a document that declares none
        - WHEN: the document view renders
        - THEN: it renders as the structured view of its YAML fields exactly as before, with no dedicated layout applied
      additional-fields-appended:
        - GIVEN: An open document of a served artifact type declares a top-level field its dedicated layout does not present
        - WHEN: the document view renders
        - THEN: that field appears under an additional-fields section rendered through the generic structured view rather than being hidden
  located-parse-error:
    strength: MUST
    statement: Opening a strict document whose YAML cannot be parsed renders a parse-error view naming the error's location alongside the document's raw text, while the tree and the open view keep working.
    scenarios:
      parse-error-located:
        - GIVEN: a strict document in the tree contains YAML that cannot be parsed
        - WHEN: the operator opens it
        - THEN: the view renders a parse error naming the error's location instead of failing the tree or the open view
      parse-error-shows-raw-text:
        - GIVEN: an open strict document failed to parse
        - WHEN: the parse-error view renders
        - THEN: it shows the raw document text beside the located message
  empty-state:
    strength: MUST
    statement: When the shown workspace has no .strict-spec-driven/ directory, both entry points show an explicit empty state instead of a document tree.
    scenarios:
      no-workflow-directory:
        - GIVEN: the shown workspace has no .strict-spec-driven/ directory
        - WHEN: either entry point opens
        - THEN: it shows an explicit empty state instead of a document tree
  live-refresh:
    strength: MUST
    statement: Loaded tree directories and the open document refresh automatically when their files change on disk without a manual reload, and an open document removed from disk is reflected as no longer present.
    scenarios:
      loaded-directory-refresh:
        - GIVEN: a tree directory has been loaded
        - WHEN: a strict file inside that directory changes on disk
        - THEN: the tree refreshes that directory without a manual reload
      open-document-refresh:
        - GIVEN: a strict document is open in the view
        - WHEN: the open file changes on disk
        - THEN: the open view refreshes to the new content without a manual reload
      removed-document-reflected:
        - GIVEN: a strict document is open in the view
        - WHEN: the open file is deleted from disk
        - THEN: the view and the loaded tree update to reflect that the document is no longer present
  right-sidebar-tab:
    strength: MUST
    statement: The strict documents right-sidebar tab is discoverable from the right sidebar's guide, follows the active Session, shows that Session's workspace through the shared document tree and document view within the pane width, and closes the previous Session's workspace watches when the active Session switches.
    scenarios:
      tab-follows-active-session:
        - GIVEN: the operator switches the active Session in the dsh client while the strict documents right-sidebar tab is open
        - WHEN: the tab renders
        - THEN: it shows the active Session's workspace through the shared document tree and document view within the pane width
      guide-entry-opens-tab:
        - GIVEN: the right sidebar's guide lists the strict documents entry
        - WHEN: the operator picks the entry
        - THEN: the strict documents tab opens for the active Session and shows that Session's workspace through the shared document tree and document view
      previous-session-watches-closed:
        - GIVEN: the strict documents tab shows one Session's workspace
        - WHEN: the operator switches the active Session
        - THEN: the previous Session's directory and document watches close, so changes under the previous Session no longer refresh any open view
  left-page-session-picker:
    strength: MUST
    statement: The plugin registers a left-sidebar panel row in sidebar.panellist and a main keyed page under the same panel id, and the page offers an explicit Session picker that groups the Sessions of each workspace under that workspace, remembers the last chosen Session across openings, and shows the chosen Session's workspace through the same tree behavior and document rendering as the right-sidebar tab.
    scenarios:
      picker-chooses-session:
        - GIVEN: the left-sidebar page is open
        - WHEN: the operator picks a Session in the Session picker
        - THEN: the page shows that Session's workspace through the same tree behavior and document rendering as the right-sidebar tab
      sessions-grouped-by-workspace:
        - GIVEN: the host holds Sessions belonging to several workspaces
        - WHEN: the Session picker renders
        - THEN: every Session is offered under the workspace it belongs to, grouped by workspace
      last-choice-remembered:
        - GIVEN: a Session was chosen in the page on a previous opening
        - WHEN: the page is opened again
        - THEN: that Session is the chosen one without the operator re-picking it
  host-compatibility-gate:
    strength: MUST
    statement: The viewer declares a dsh release compatibility range and registers no document UI when the running dsh release falls outside that range, so no partially working tree or document view is shown.
    scenarios:
      outside-pin-no-ui:
        - GIVEN: the viewer plugin declares a dsh release compatibility range
        - WHEN: a dsh release outside that range loads the plugin
        - THEN: no viewer document UI registers and no partially working tree or document view is shown
  tree-node-presentation:
    strength: MUST
    statement: Each document tree node presents a file-type glyph, each group whose entries are loaded presents its entry count, milestone and planned-change nodes present a badge of the status declared in their file, each non-archived change group node whose tasks file was read presents a badge of its task completion counted from the declared statuses, and nesting depth renders as one consistent indentation step per level.
    scenarios:
      loaded-presentation:
        - GIVEN: the tree shows families, loaded groups, and non-archived milestone, planned-change, and change documents
        - WHEN: the tree renders
        - THEN: every document node presents a file-type glyph, every loaded group presents its entry count, milestone and planned-change nodes present their declared status as a badge, each non-archived change group node whose tasks were read presents its completed-over-total task count as a badge, and each nesting level indents one consistent step deeper
      unloaded-group-no-count:
        - GIVEN: a collapsed group whose entries have not been listed
        - WHEN: its row renders
        - THEN: it presents no entry count rather than an assumed one
      completion-badge-updates-on-change:
        - GIVEN: a non-archived change group node presents its task completion badge and the change's tasks file changes on disk
        - WHEN: the tree refreshes that change directory
        - THEN: the badge presents the completion recomputed from the new declared statuses without a manual reload
      archived-change-no-completion-badge:
        - GIVEN: the change archive is expanded and its entries listed
        - WHEN: the archived change rows render
        - THEN: they present no completion badge, because archived files stay unread while they are only listed
  tree-keyboard-navigation:
    strength: MUST
    statement: The operator can move between visible tree nodes, expand and collapse the focused group, and open the focused document using only the keyboard, with the focused node kept visible.
    scenarios:
      keyboard-moves-focus:
        - GIVEN: the document tree is focused
        - WHEN: the operator moves focus with the keyboard
        - THEN: focus moves node by node through the visible rows and the focused row is kept visible
      keyboard-expands-and-opens:
        - GIVEN: a group row or a document row is focused
        - WHEN: the operator triggers the expand or open action from the keyboard
        - THEN: the focused group expands or collapses, and the focused document opens in the document view
  tree-expand-persistence:
    strength: MUST
    statement: Expand and collapse choices are kept per workspace, so a workspace shown again restores its previous expand choices, and an archived group whose expansion is restored still has its entries read only through that expansion.
    scenarios:
      workspace-expand-restored:
        - GIVEN: the operator expanded and collapsed groups of one workspace and the viewer moved to another workspace
        - WHEN: the first workspace is shown again
        - THEN: its previous expand choices are restored
      restored-archive-still-read-on-expand:
        - GIVEN: an archived group expansion is restored for a re-shown workspace
        - WHEN: the group renders expanded
        - THEN: its entries are read for that rendering and were not read while it was collapsed
  generic-renderer-structure:
    strength: MUST
    statement: The structured document view renders top-level scalar fields as a header, mapping fields as titled sections, sequence fields as lists, multiline text as wrapped paragraphs, and deeply nested structures as collapsible blocks, uniformly for every artifact type.
    scenarios:
      yaml-shapes-to-presentation:
        - GIVEN: an open strict document mixes top-level scalars, mappings, sequences, and multiline text
        - WHEN: the document view renders
        - THEN: scalars appear in the header, mappings as titled sections, sequences as lists, multiline text as wrapped paragraphs, and deep nesting as collapsible blocks
      deep-nesting-collapsible:
        - GIVEN: an open strict document nests mappings beyond the top level
        - WHEN: the view renders
        - THEN: the nested mappings render as collapsible blocks the operator can expand and collapse
  viewer-status-conditions:
    strength: MUST
    statement: Each viewer surface shows a loading condition while its data is loading and an explicit error condition naming the failure when a load fails, instead of an empty or frozen presentation.
    scenarios:
      loading-condition:
        - GIVEN: a workspace tree load or a document load is in flight
        - WHEN: the surface renders
        - THEN: a loading condition shows until the load settles
      listing-error-condition:
        - GIVEN: the workflow root listing fails
        - WHEN: the tree renders
        - THEN: an explicit error condition names the failure rather than presenting an empty tree
  left-page-two-pane-layout:
    strength: MUST
    statement: The left-sidebar page lays the document tree out in a left pane and the open document in a wide right pane, so a selected strict document can be read at width.
    scenarios:
      two-pane-reading:
        - GIVEN: a Session is chosen in the left-sidebar page and one of its strict documents is open
        - WHEN: the page renders
        - THEN: the document tree occupies the left pane and the open document renders in a wide right pane beside it
  left-page-no-session-prompt:
    strength: MUST
    statement: When the workspace the operator wants to read holds no Session, the left-sidebar page shows a prompt to open a Session for that workspace instead of reading its files.
    scenarios:
      no-session-prompt:
        - GIVEN: the workspace wanted in the left-sidebar page holds no Session
        - WHEN: the page renders for that workspace
        - THEN: it shows an explicit prompt to open a Session for that workspace and reads none of its workflow files
  left-page-selection-restore:
    strength: MUST
    statement: The left-sidebar page keeps the chosen Session and the selected document in page state, so opening the page again — including after the operator has left it for another view during the same client session — loads the chosen Session's workspace tree and restores both.
    scenarios:
      reopen-restores-selection:
        - GIVEN: the operator chose a Session and opened a strict document in the left-sidebar page
        - WHEN: the page is opened again
        - THEN: the same Session is chosen and the same document is selected without the operator re-choosing either
      return-after-leaving-loads-tree:
        - GIVEN: the operator chose a Session and opened a strict document in the left-sidebar page, then left the page for another view such as a Session's conversation
        - WHEN: the operator opens the left-sidebar page again without reloading the client
        - THEN: the chosen Session's workspace tree loads instead of remaining in its loading condition, and the previously selected document is restored
  change-artifact-renderers:
    strength: MUST
    statement: Opening a change's proposal, design, tasks, or questions document renders its dedicated view — the proposal view with its summary what and why, scope in and out, unchanged behavior, and roadmap link; the design view with its approach, decisions and their rationale, alternatives, and risks; the tasks view with per-section grouping, a done or pending marker per task, and per-section and overall completion; the questions view separating open questions from resolved ones with their answers — and opening a change-scoped delta spec, delta scene, or delta tech file renders each operation group labeled with its declared operation, laying out requirement bodies, scene flow steps, and rule bodies through the same layouts their main counterparts use, with the same dedicated views serving archived change documents.
    scenarios:
      proposal-view:
        - GIVEN: an open change proposal declares summary what and why, scope in and out, unchanged behavior, and a roadmap link
        - WHEN: the proposal view renders
        - THEN: each group appears as its own section presenting its declared entries in declaration order
      tasks-view-completion:
        - GIVEN: an open change tasks document declares sections whose tasks carry pending and complete statuses
        - WHEN: the tasks view renders
        - THEN: each section lists its tasks with a done or pending marker from the declared status, each section presents its completed-over-total count, and the view presents the overall completed-over-total count
      questions-open-separated-resolved:
        - GIVEN: an open change questions document declares open questions and resolved questions with answers
        - WHEN: the questions view renders
        - THEN: the open questions appear separated from the resolved ones, and each resolved entry presents its recorded answer
      delta-operations-labeled:
        - GIVEN: an open change-scoped delta spec, delta scene, or delta tech file declares operation groups
        - WHEN: its view renders
        - THEN: each operation group presents its declared operation label, and the requirement bodies, scene flow steps, and rule bodies inside render through the same layouts their main counterparts use
      archived-change-dedicated-views:
        - GIVEN: the operator expanded the change archive and opened one of its proposal, design, tasks, questions, or delta documents
        - WHEN: the document view renders
        - THEN: it renders through the same dedicated view an active change's document of that type uses
  project-context-renderers:
    strength: MUST
    statement: Opening a project-context document renders its dedicated view — the config view presenting preferred human language, project context, rules grouped by their declared categories, review evidence with its command and coverage threshold, and maintenance checks when declared; the architecture view presenting components, data flows, and decisions as structured sections; the technical standard view presenting the standard's category with each rule's declared strength emphasized, and the tech index view listing its standards; the lesson view presenting its status and obsolete marking, and the lessons index view grouping its lessons by category; the SOP, SOP category, and SOPs index views, with the SOP view presenting purpose, trigger, roles, ordered steps, exceptions, and success criteria; and the design system view presenting its tokens, components, and guidance.
    scenarios:
      config-view-sections:
        - GIVEN: an open workflow config declares preferred human language, context, rules grouped by category, review evidence with its command and coverage threshold, and maintenance checks
        - WHEN: the config view renders
        - THEN: each group appears as its own section, the review evidence presents its command and coverage threshold, and the rules appear grouped by their declared categories
      architecture-view-sections:
        - GIVEN: an open architecture document declares components, data flows, and decisions
        - WHEN: the architecture view renders
        - THEN: components, data flows, and decisions appear as structured sections presenting their declared titles, responsibilities, boundaries, dependencies, triggers, steps, statements, rationale, and statuses
      tech-standard-strength-emphasized:
        - GIVEN: an open technical standard declares its category and rules carrying MUST and SHOULD strengths
        - WHEN: the standard view renders
        - THEN: the category presents and each rule presents its statement with its declared strength emphasized, beside a tech index view that lists its recorded standards with their categories
      lesson-status-and-index-grouping:
        - GIVEN: an open lesson declares its status with an obsolete marking and the lessons index groups lessons by category
        - WHEN: the lesson and lessons index views render
        - THEN: the lesson view presents its status and obsolete marking and the index groups its entries by their declared categories with their statuses
      sop-ordered-steps:
        - GIVEN: an open SOP declares purpose, trigger, roles, steps carrying order values, exceptions, and success criteria
        - WHEN: the SOP view renders
        - THEN: the steps list in the order their declared order values assign, each presenting its actor, action, and expected result, and the exceptions and success criteria present as their own sections
      design-system-tokens:
        - GIVEN: an open design system declares tokens, components, and guidance
        - WHEN: the design system view renders
        - THEN: the tokens present grouped by their declared token families, the components with their token references, and the guidance with its overview, do, and don't entries
  roadmap-artifact-renderers:
    strength: MUST
    statement: Opening a roadmap index, milestone, or planned-change document renders its dedicated view — the roadmap index view listing milestones in the sequence their order fields assign, each with its declared status; the milestone view presenting its title, declared status badge, goal, scope in and out side by side, done criteria as a checklist, dependencies, risks, notes, details, and intake questions as cards showing question, context, impact, and recommendation, plus the planned changes the milestone owns with their declared statuses, selectable to open; the planned-change view presenting its summary, details, declared status, owning milestone, and depends_on entries that navigate the tree to the target planned change and show a visible unresolved marker when the target is not found — with the same dedicated views serving archived roadmap documents, and an archived milestone owned planned-change entries resolved by reading the archived planned-change files.
    scenarios:
      roadmap-index-view:
        - GIVEN: An open roadmap index lists milestones whose files declare order values and the index declares a status for each
        - WHEN: the roadmap index view renders
        - THEN: the milestones appear in the sequence their order fields assign, each presenting its declared status, and no derived roadmap status is shown
      milestone-view-sections:
        - GIVEN: An open milestone declares its title, status, goal, scope in and out, done criteria, dependencies, risks, notes, details, and intake questions
        - WHEN: the milestone view renders
        - THEN: the title and declared status badge present, scope in and out appear side by side, done criteria render as a checklist, and each intake question renders as a card showing its question, context, impact, and recommendation
      milestone-owned-planned-changes:
        - GIVEN: A milestone document is open and the loaded tree holds non-archived planned-change documents whose declared milestone names it
        - WHEN: the milestone view renders and one owned planned change is selected
        - THEN: the owned planned changes list with their declared statuses and the selected one opens in the document view
      planned-change-dependency-navigation:
        - GIVEN: An open planned change declares depends_on entries and the loaded tree holds target planned-change documents for some of them
        - WHEN: the planned-change view renders and a resolvable dependency is selected
        - THEN: the tree navigates to and opens the target planned change, while each entry whose target is not found presents a visible unresolved marker
      archived-milestone-owned-entries:
        - GIVEN: The operator expanded the roadmap archive and opened an archived milestone whose planned changes are archived
        - WHEN: the milestone view renders
        - THEN: its owned planned-change entries are resolved by reading the archived planned-change files and present their declared statuses
  spec-and-scene-artifact-renderers:
    strength: MUST
    statement: Opening a main spec, specs index, scene, or scenes index document renders its dedicated view — the spec view presenting the spec's declared identity and each requirement with its declared RFC keyword strength emphasized beside its statement and its scenarios, every requirement carrying a stable anchor; the specs index view grouping its entries by the spec areas their declared paths name; the scene view presenting actors with their responsibilities, preconditions, the ordered main flow, and exception flows each under its declared trigger with its steps, where every step presents its covering requirements as links that open the covering requirement's anchor in its spec, presents its explicit no-coverage reason, visibly flags a step that declares neither, and presents a visible unresolved marker for a covering reference whose spec the loaded tree does not hold; and the scenes index view grouping its entries by their declared scene areas with their titles and statuses.
    scenarios:
      spec-view-keyword-emphasis:
        - GIVEN: An open main spec declares its id and title and requirements carrying MUST, SHOULD, and MAY strengths with scenarios
        - WHEN: the spec view renders
        - THEN: the declared identity presents, each requirement renders with its strength emphasized beside its statement and its scenario steps under their declared keywords, and each requirement carries a stable anchor
      spec-index-grouped-by-area:
        - GIVEN: An open specs index declares entries whose paths name spec area subdirectories under specs/
        - WHEN: the specs index view renders
        - THEN: the entries group under their spec areas with their declared ids and titles, and an entry whose path names no area subdirectory presents in a stable fallback group rather than disappearing
      scene-view-sections:
        - GIVEN: An open scene declares actors with roles, preconditions, an ordered main flow, and exception flows with triggers and steps
        - WHEN: the scene view renders
        - THEN: the actors present with their responsibilities, the preconditions present as their own section, the main flow steps present in their declared order, and each exception flow presents under its declared trigger with its steps
      scene-step-coverage-navigation:
        - GIVEN: An open scene step declares covering requirements naming spec ids and requirement ids, and the loaded tree holds non-archived main spec documents declaring some of those spec ids
        - WHEN: the scene view renders and a resolvable coverage link is selected
        - THEN: the covering spec opens with its named requirement anchored through the same open action a tree row uses, while a reference whose spec resolves to no held document presents a visible unresolved marker
      scene-step-coverage-waived-and-flagged:
        - GIVEN: An open scene declares one step carrying an explicit no-coverage reason and another step declaring neither covered_by nor no_coverage_reason
        - WHEN: the scene view renders
        - THEN: the waived step presents its declared reason and the step declaring neither is visibly flagged as uncovered
      scenes-index-grouped-by-area:
        - GIVEN: An open scenes index declares areas holding scene entries with titles and statuses
        - WHEN: the scenes index view renders
        - THEN: the entries group under their declared areas, each presenting its declared title and status
  tree-pointer-activation:
    strength: MUST
    statement: A pointer click anywhere on a document row of the document tree opens that document and moves the tree's keyboard focus to that row, and a click anywhere on a group row expands a collapsed group or collapses an expanded one, through the same activation keyboard Enter performs.
    scenarios:
      click-opens-document:
        - GIVEN: the document tree shows a document row
        - WHEN: the operator clicks anywhere on that row
        - THEN: the document opens in the document view and the clicked row becomes the tree's focused row
      click-toggles-group:
        - GIVEN: the document tree shows a collapsed group row
        - WHEN: the operator clicks anywhere on that row
        - THEN: the group expands, and a further click on the row collapses it again
      icon-click-toggles-once:
        - GIVEN: the document tree shows a group row
        - WHEN: the operator clicks the group's leading icon
        - THEN: the group toggles exactly once
  collapsed-group-reexpands:
    strength: MUST
    statement: Every group the operator collapses in the document tree, family roots included, expands again to its current entries on the next expand activation, whether the family's content is a directory or a single canonical file.
    scenarios:
      single-file-family-reexpands:
        - GIVEN: the operator collapsed a family whose only content is a single canonical file, such as Config or Architecture
        - WHEN: the operator expands that family again by clicking its row or through the keyboard
        - THEN: the family expands and lists its document again without a reload
      directory-family-reexpands:
        - GIVEN: the operator collapsed a family whose content is a directory, such as Specs
        - WHEN: the operator expands that family again
        - THEN: the family expands and lists its current entries
  tree-follows-open-document:
    strength: MUST
    statement: Whenever a document opens in a viewer surface — from a tree row, from a cross-document link in a document view, or from a restored page selection — the document tree of that surface expands every collapsed group above the document, archived groups included, as an expansion the operator's navigation requested, then moves its keyboard focus to the document's row and scrolls that row into view, while a link whose target the tree cannot hold changes nothing in the tree.
    scenarios:
      dependency-link-reveals-target:
        - GIVEN: an open planned change declares a depends_on entry whose target planned change sits inside a collapsed group, such as the collapsed roadmap archive
        - WHEN: the operator selects that dependency
        - THEN: the target opens, the groups above it expand, and the target's row becomes the tree's focused row scrolled into view
      visible-target-gains-focus:
        - GIVEN: the tree already lists the row of a document a view links to
        - WHEN: the operator follows that link
        - THEN: the document opens and its row becomes the tree's focused row without any group changing state
      unresolvable-target-leaves-tree:
        - GIVEN: a view links to a path the tree cannot hold
        - WHEN: that path is opened
        - THEN: the tree's groups keep their expand state
  roadmap-index-milestone-goal-control:
    strength: MUST
    statement: The roadmap index view offers one milestone goal launch control whenever its viewer surface is bound to a Session — the right-sidebar tab to the Session rendering it and the left-sidebar page to the Session chosen in its picker — and offers no such control when no Session is bound or in any other document view.
    scenarios:
      control-offered-when-bound:
        - GIVEN: the roadmap index document is open in the right-sidebar tab of an active Session
        - WHEN: the operator looks at the roadmap index view
        - THEN: one milestone goal launch control is shown in the view
      control-absent-without-session:
        - GIVEN: the left-sidebar page shows a roadmap index with no Session chosen
        - WHEN: the roadmap index view renders
        - THEN: no milestone goal launch control is shown
      control-only-on-index:
        - GIVEN: a milestone or planned-change document is open in a viewer surface bound to a Session
        - WHEN: its document view renders
        - THEN: no milestone goal launch control is shown
  milestone-goal-confirmation:
    strength: MUST
    statement: Activating the milestone goal launch control submits nothing; it shows an inline confirmation presenting the exact goal objective that will be submitted and the target Session, and cancelling that confirmation closes it without submitting anything to the Session.
    scenarios:
      confirmation-shows-objective:
        - GIVEN: the roadmap index view offers the launch control in a Session-bound surface
        - WHEN: the operator activates the control
        - THEN: an inline confirmation shows the full objective text and the target Session, and the Session has received no command
      cancel-submits-nothing:
        - GIVEN: the inline confirmation is shown
        - WHEN: the operator cancels it
        - THEN: the confirmation closes, the Session receives no command, and the launch control is offered again
  milestone-goal-submission:
    strength: MUST
    statement: Confirming submits exactly one /goal command, carrying the fixed English objective, to the bound Session, and the launch control is unavailable while that submission is pending; the objective instructs the agent to repeatedly run the strict-roadmap-recommend skill, to treat the milestone owning the first recommended planned change as the target milestone and select it on every later round, to complete the goal once every planned change of that milestone is complete, and to block the goal when the recommendation reports a roadmap error, a milestone awaiting refinement, or no eligible candidate before the milestone is complete, or when a created change has open questions that need a human answer.
    scenarios:
      confirm-submits-goal-command:
        - GIVEN: the inline confirmation is shown for a Session-bound roadmap index view
        - WHEN: the operator confirms
        - THEN: the bound Session receives one /goal command whose objective is the text the confirmation showed
      objective-states-loop-and-stops:
        - GIVEN: the operator has opened the inline confirmation
        - WHEN: the operator reads the presented objective
        - THEN: it names the strict-roadmap-recommend skill, the lock onto the first recommendation's milestone, the completion condition for that milestone, and each block condition
      single-flight-while-pending:
        - GIVEN: a confirmed submission has not yet settled
        - WHEN: the operator tries to activate the launch control again
        - THEN: the control is unavailable and no second command is submitted
      accepted-submission-acknowledged:
        - GIVEN: a confirmed submission is pending
        - WHEN: the bound Session accepts the /goal command
        - THEN: the view shows an inline notice that the goal was submitted and the launch control is usable again
  milestone-goal-refusal-shown:
    strength: MUST
    statement: When the bound Session refuses or fails the /goal submission, the roadmap index view shows the refusal inline with the reason the Session reported, leaves any existing goal of that Session unchanged, and makes the launch control usable again.
    scenarios:
      existing-goal-refused:
        - GIVEN: the bound Session already holds an unfinished goal
        - WHEN: the operator confirms a milestone goal launch
        - THEN: the view shows the Session's refusal reason inline, the existing goal keeps its objective and phase, and the launch control is usable again
      command-unavailable-refused:
        - GIVEN: the bound Session offers no /goal command
        - WHEN: the operator confirms a milestone goal launch
        - THEN: the view shows the failure reason inline and the launch control is usable again

schema: strict-spec-driven/main-spec/v1
schema_version: 1
artifact_type: main_spec
schema_file: templates/strict-spec-driven/schemas/main-spec.yaml
spec:
  id: lessons-domain-behavior
  title: Lessons Domain Behavior
mapping:
  implementation:
    - src/lessons.ts
    - src/cli/cmd-lessons.ts
    - src/cli/registry.ts
    - src/cli/command-metadata-entries.ts
    - skills/strict-spec-review/SKILL.md
    - skills/strict-spec-brainstorm/SKILL.md
    - skills/strict-tech-edit/SKILL.md
    - src/cli/command-metadata.ts
    - src/strict-spec-cli.ts
    - src/scaffold.ts
    - templates/strict-spec-driven/scaffold/lessons/INDEX.yaml
    - skills/strict-spec-archive/SKILL.md
    - skills/strict-spec-auto/SKILL.md
    - skills/strict-spec-bugfix/SKILL.md
    - skills/strict-spec-harness-session/SKILL.md
    - skills/strict-spec-propose/SKILL.md
    - skills/strict-spec-apply/SKILL.md
    - skills/strict-tech-sync/SKILL.md
    - templates/strict-spec-driven/schemas/lessons-index.yaml
    - templates/strict-spec-driven/schemas/registry.yaml
    - examples/strict-spec-driven/lessons-index.yaml
    - inventory/yaml-mutation-surfaces.yaml
    - src/embedded-templates.ts
    - src/yaml-mutation.ts
  tests:
    - test/suites/lessons.ts
requirements:
  lesson-create-contract:
    strength: MUST
    statement: The system MUST provide a lesson-create command that records a reusable engineering lesson with a content-derived conflict-resistant id, active status, a category drawn from the technical-standard category set, the context, observation, takeaway, and applies_when content, and one initial occurrence naming its origin, maintains the lessons index, emits the created file path, and is idempotent so rerunning with identical content neither clobbers nor duplicates existing lesson state.
    scenarios:
      create-records-a-retrievable-lesson:
        - GIVEN: a strict workflow with the lessons contract is present
        - WHEN: lesson-create runs with a category, context, observation, takeaway, applies_when, and an origin
        - THEN: a lesson file is written under the lessons location with a content-derived id and active status, one occurrence records the origin, the lessons index is updated, and the created path is reported
      create-is-idempotent-on-rerun:
        - GIVEN: a lesson already exists for identical content
        - WHEN: lesson-create runs again with the same content
        - THEN: the existing lesson file is left unchanged, no second lesson is created, and the command reports the existing lesson as not newly created
      create-rejects-incomplete-or-unknown-category:
        - GIVEN: a strict workflow with the lessons contract is present
        - WHEN: lesson-create runs with an unknown category or omits a required content field
        - THEN: no lesson file is written and the command exits non-zero with path-aware diagnostics naming the unknown category or the missing required field
  lesson-discovery-contract:
    strength: MUST
    statement: The system MUST provide lesson-list, lesson-show, and lesson-status commands where lesson-list and lesson-status omit lessons in promoted or obsolete status unless an --all flag is supplied, lesson-status reports active lessons ordered so that the highest-recurrence lessons that have not yet been promoted appear first, lesson-show prints a single lesson including its occurrences regardless of status, and an unknown lesson id produces a deterministic not-found error.
    scenarios:
      list-hides-promoted-and-obsolete-by-default:
        - GIVEN: lessons exist in active, promoted, and obsolete status
        - WHEN: lesson-list runs without --all
        - THEN: only the active lessons are reported
      list-all-reveals-every-status:
        - GIVEN: lessons exist in active, promoted, and obsolete status
        - WHEN: lesson-list runs with --all
        - THEN: lessons in every status are reported together with their status
      status-ranks-unpromoted-recurrence-first:
        - GIVEN: several active lessons exist with differing occurrence counts and none is promoted
        - WHEN: lesson-status runs
        - THEN: the lessons are reported in deterministic order with the highest occurrence count first
      show-reports-unknown-lesson:
        - GIVEN: no lesson exists for a given id
        - WHEN: lesson-show runs with that id
        - THEN: the command exits non-zero with a deterministic not-found diagnostic
  lesson-recurrence-contract:
    strength: MUST
    statement: The system MUST provide a lesson-edit command that appends a new occurrence to an existing lesson when the same lesson is encountered again, so that recurrence is recorded on the existing lesson rather than as a duplicate lesson, and that refreshes the lesson's updated_at while leaving earlier occurrences intact.
    scenarios:
      edit-appends-a-recurrence:
        - GIVEN: an active lesson with one occurrence exists
        - WHEN: lesson-edit runs adding an occurrence naming a second origin
        - THEN: the lesson carries both occurrences in recorded order, the earlier occurrence is unchanged, and updated_at is refreshed
      recurrence-does-not-duplicate-the-lesson:
        - GIVEN: an active lesson exists for a given applies_when condition
        - WHEN: a recurrence of the same condition is recorded through lesson-edit
        - THEN: no second lesson file is created and the lessons index still lists exactly one lesson for that condition
  lesson-promotion-contract:
    strength: MUST
    statement: The system MUST allow a lesson to be marked promoted only together with a promoted_to reference naming the technical standard and rule identifier it became, MUST preserve the promoted lesson's original context, observation, takeaway, and occurrences unchanged, and MUST reject a promoted status that carries no promoted_to reference.
    scenarios:
      promotion-links-the-resulting-rule:
        - GIVEN: an active lesson has been turned into a technical-standard rule
        - WHEN: the lesson is marked promoted with a promoted_to reference naming that standard and rule
        - THEN: the lesson reports promoted status, the promoted_to reference resolves to the named standard and rule, and its original content and occurrences are unchanged
      promotion-without-a-reference-is-rejected:
        - GIVEN: a lesson is set to promoted status with no promoted_to reference
        - WHEN: the lesson is validated
        - THEN: validation exits non-zero with a path-aware diagnostic naming the missing promoted_to reference
  lesson-obsolescence-contract:
    strength: MUST
    statement: The system MUST provide a lesson-obsolete command that retires a lesson by setting obsolete status with a required obsoleted_reason and obsoleted_at, MUST NOT delete the lesson file or any of its recorded content, and MUST reject an obsolete status that carries no obsoleted_reason.
    scenarios:
      obsoleting-retires-without-deleting:
        - GIVEN: an active lesson exists whose premise no longer holds
        - WHEN: lesson-obsolete runs with a reason
        - THEN: the lesson reports obsolete status with the recorded reason and timestamp, the file still exists, and its original content and occurrences remain readable
      obsoleting-requires-a-reason:
        - GIVEN: a strict workflow with the lessons contract is present
        - WHEN: lesson-obsolete runs without a reason
        - THEN: no lesson is modified and the command exits non-zero with a diagnostic naming the missing reason
  lesson-categorized-storage-contract:
    strength: MUST
    statement: The system MUST store each lesson at .strict-spec-driven/lessons/<category>/<lesson-id>.yaml and maintain exactly one .strict-spec-driven/lessons/INDEX.yaml using the lessons-index/v2 contract, where populated categories group their lesson entries and each entry reports its canonical nested path.
    scenarios:
      create-uses-category-directory:
        - GIVEN: a strict workflow with no recorded lessons
        - WHEN: lesson-create records a lesson in the testing category
        - THEN: the lesson is written under .strict-spec-driven/lessons/testing with its derived id, the reported path names that file, and no root-level lesson file is created
      root-index-groups-populated-categories:
        - GIVEN: lessons exist in more than one category
        - WHEN: the lessons index is rebuilt
        - THEN: the sole root INDEX.yaml validates as lessons-index/v2, groups each lesson under its category, and points every entry to its nested category path without creating category-local indexes
  lesson-automatic-layout-migration-contract:
    strength: MUST
    statement: Before every valid lesson command operates in any project, the system MUST detect legacy lesson YAML files stored directly under .strict-spec-driven/lessons, transactionally migrate all of them into their declared category directories, replace the legacy index with a grouped lessons-index/v2 index, and either preserve the complete original store on failure or complete the whole migration before the requested command continues.
    scenarios:
      every-command-upgrades-legacy-projects:
        - GIVEN: an external strict project has valid active, promoted, or obsolete lesson files in the legacy flat lessons directory
        - WHEN: any registered lesson command is invoked with otherwise valid arguments
        - THEN: all legacy lessons are moved to their declared category directories with content and lifecycle data preserved, the v2 root index is rebuilt, no legacy root lesson files remain, and the requested command completes against the migrated store
      migration-failure-leaves-store-untouched:
        - GIVEN: a legacy lesson store contains a malformed lesson, an unknown category, or a destination collision
        - WHEN: a lesson command attempts automatic migration
        - THEN: the command exits non-zero with deterministic path-aware diagnostics and the original files and index remain byte-for-byte in their pre-migration locations with no staged or partially migrated store left behind
      migrated-layout-is-idempotent:
        - GIVEN: a project lesson store has already been migrated successfully
        - WHEN: another lesson command runs
        - THEN: no files are moved or rewritten solely for migration and the command operates normally on the categorized layout
  lesson-category-filter-contract:
    strength: MUST
    statement: The system MUST allow lesson-list and lesson-status to accept one --category value from the lesson category vocabulary so their visible lesson collection is limited to that category, and lesson-status lessonCount, statusCounts, categoryCounts, and lessons all describe the selected category while existing --all visibility and recurrence ordering semantics remain in force.
    scenarios:
      list-filters-one-category:
        - GIVEN: active lessons exist in testing and tooling categories
        - WHEN: lesson-list runs with --category testing
        - THEN: only testing lessons are returned and every reported path resolves under the testing directory
      status-counts-selected-category:
        - GIVEN: active, promoted, and obsolete lessons exist across multiple categories
        - WHEN: lesson-status runs with --category tooling and --all
        - THEN: lessonCount, statusCounts, categoryCounts, and the recurrence-ranked lesson list count only tooling lessons while including every tooling status
      invalid-category-is-rejected:
        - GIVEN: a strict workflow with categorized lessons
        - WHEN: lesson-list or lesson-status receives a category outside the schema vocabulary
        - THEN: the command exits non-zero with a deterministic diagnostic naming the unsupported category and the accepted category values
  lesson-complete-cli-mutation-coverage:
    strength: MUST
    statement: The system MUST route lesson creation, narrative updates, occurrence append, promotion, obsolescence, categorized-layout migration, and lessons-index rebuilding through artifact-aware transactions that accept structured semantic arguments, validate lifecycle and index relationships before commit, preserve immutable identity and prior evidence, and represent retirement as obsolescence rather than deletion with deterministic rejection of unsupported mutation.
    scenarios:
      lesson-mutations-commit-with-index:
        - GIVEN: A categorized lesson store contains an active lesson and a valid grouped index
        - WHEN: A lesson command creates a lesson, updates narrative content, appends a recurrence, promotes it, or marks it obsolete
        - THEN: The lesson and affected index state commit together, immutable identity and earlier occurrences remain unchanged, and the command reports valid canonical paths
      lesson-history-is-never-deleted:
        - GIVEN: A lesson has been promoted or its premise no longer holds
        - WHEN: A caller performs the supported lifecycle transition or attempts unsupported deletion
        - THEN: The lesson remains readable with its promotion or obsolescence evidence, while unsupported deletion is rejected deterministically and leaves the store unchanged
      lesson-migration-or-validation-failure-rolls-back:
        - GIVEN: A legacy or categorized lesson mutation contains malformed content, an unknown category, a destination collision, or an invalid lifecycle transition
        - WHEN: Any lesson command prepares and validates the store transaction
        - THEN: The command exits non-zero with path-aware diagnostics and the lesson files, categorized layout, and index remain in their complete pre-command state

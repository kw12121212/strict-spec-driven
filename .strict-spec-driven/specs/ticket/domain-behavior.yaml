schema: strict-spec-driven/main-spec/v1
schema_version: 1
artifact_type: main_spec
schema_file: templates/strict-spec-driven/schemas/main-spec.yaml
spec:
  id: ticket-domain-behavior
  title: Ticket Domain Behavior
mapping:
  implementation:
    - src/tickets.ts
    - src/ticket-dispatch.ts
    - src/cli/cmd-tickets.ts
    - src/cli/registry.ts
    - src/strict-spec-cli.ts
  tests:
    - test/suites/tickets.ts
requirements:
  ticket-create-contract:
    strength: MUST
    statement: The system MUST provide a ticket-create command that scaffolds a new ticket from a pure requirement with a conflict-resistant content-derived id and initial open status, maintains the tickets index, emits the created file path, and is idempotent so rerunning with the same requirement does not clobber or duplicate existing ticket state.
    scenarios:
      create-generates-conflict-resistant-ticket:
        - GIVEN: a strict workflow with the ticket contract is present
        - WHEN: ticket-create runs with a title, problem, and desired outcome
        - THEN: a ticket file is written under the tickets location with a content-derived id and open status, the tickets index is updated, and the created path is reported
      create-is-idempotent-on-rerun:
        - GIVEN: a ticket already exists for a given requirement
        - WHEN: ticket-create runs again with the same title, problem, and desired outcome
        - THEN: the existing ticket file is left unchanged, no second ticket is created, and the command reports the existing ticket as not newly created
      create-rejects-incomplete-requirement:
        - GIVEN: a strict workflow with the ticket contract is present
        - WHEN: ticket-create runs without a problem or desired outcome
        - THEN: no ticket file is written and the command exits non-zero with path-aware diagnostics naming the missing requirement field
  ticket-list-contract:
    strength: MUST
    statement: The system MUST provide a ticket-list command that enumerates existing tickets with their id, title, status, and file path as deterministic structured output.
    scenarios:
      list-enumerates-tickets-deterministically:
        - GIVEN: one or more tickets exist under the tickets location
        - WHEN: ticket-list runs
        - THEN: every ticket is reported with id, title, status, and path in a deterministic order
      list-on-empty-state-succeeds:
        - GIVEN: no tickets exist yet
        - WHEN: ticket-list runs
        - THEN: the command exits zero and reports an empty ticket collection
  ticket-show-contract:
    strength: MUST
    statement: The system MUST provide a ticket-show command that prints a single ticket and its file path for an existing id and reports a deterministic not-found error for an unknown id.
    scenarios:
      show-prints-existing-ticket:
        - GIVEN: a ticket with a known id exists
        - WHEN: ticket-show runs with that id
        - THEN: the ticket contents and its file path are reported
      show-reports-missing-ticket:
        - GIVEN: no ticket exists for a given id
        - WHEN: ticket-show runs with that id
        - THEN: the command exits non-zero with a deterministic not-found diagnostic
  ticket-validate-contract:
    strength: MUST
    statement: The system MUST provide a ticket-validate command that validates one ticket or all tickets and the tickets index against the bundled ticket schemas, exiting non-zero with path-aware diagnostics when an artifact is malformed.
    scenarios:
      validate-passes-for-valid-tickets:
        - GIVEN: the tickets and tickets index are schema-valid
        - WHEN: ticket-validate runs
        - THEN: the command exits zero and reports no diagnostics
      validate-fails-for-malformed-ticket:
        - GIVEN: a ticket artifact violates the ticket schema
        - WHEN: ticket-validate runs
        - THEN: the command exits non-zero with path-aware diagnostics identifying the offending artifact and field
  ticket-resolve-transition-contract:
    strength: MUST
    statement: The system MUST provide a ticket-resolve command that records a supplied dispatch decision (outcome, evidence, rationale, timestamp) onto the ticket and performs only the deterministic state transition for that outcome, without itself judging whether the requirement is implemented, then moves the resolved ticket artifact from active tickets into the ticket archived directory while preserving ticket-show and ticket-validate access by id.
    scenarios:
      resolve-records-decision-and-transitions:
        - GIVEN: an open ticket exists
        - WHEN: ticket-resolve runs with an outcome, rationale, and optional evidence
        - THEN: the ticket records a structured dispatch-decision with the outcome, rationale, evidence, and timestamp, the ticket status transitions according to the supplied outcome, and the ticket artifact is moved under .strict-spec-driven/tickets/archived/
      resolved-tickets-remain-auditable:
        - GIVEN: a ticket has been resolved and moved to the ticket archived directory
        - WHEN: ticket-show or ticket-validate is run with that ticket id
        - THEN: the command reads the archived ticket artifact and preserves access to its dispatch decision and provenance
  ticket-promote-on-not-implemented:
    strength: MUST
    statement: The system MUST, on a not-implemented decision, record the promoted dispatch decision on the ticket, set the ticket status to promoted, record provenance.promoted_to as a reference to a strict spec change only when a change reference is supplied, and move the promoted ticket artifact to the ticket archived directory, without materializing a roadmap milestone or writing the roadmap index; the strict spec change is scaffolded and populated by the dispatch skill through the propose command rather than by the CLI.
    scenarios:
      promote-records-decision-and-archives:
        - GIVEN: an open ticket exists
        - WHEN: ticket-resolve runs with the not-implemented outcome and a rationale
        - THEN: the ticket records a structured dispatch-decision with the not-implemented outcome and rationale, the ticket status becomes promoted, no roadmap milestone is created and the roadmap index is not modified, and the promoted ticket is moved under .strict-spec-driven/tickets/archived/
      promote-records-change-link-when-supplied:
        - GIVEN: an open ticket exists and a strict spec change has already been scaffolded for it
        - WHEN: ticket-resolve runs with the not-implemented outcome and a --promoted-to change reference
        - THEN: the archived ticket records provenance.promoted_to pointing at the supplied strict spec change name
      promote-omits-link-without-reference:
        - GIVEN: an open ticket exists
        - WHEN: ticket-resolve runs with the not-implemented outcome and no change reference
        - THEN: the ticket is archived as promoted with no provenance.promoted_to link and the command still succeeds
  ticket-close-and-reject-transitions:
    strength: MUST
    statement: The system MUST, on an implemented decision, close the ticket and record evidence links to the satisfying specs/code/docs, and on a not-wanted decision, mark the ticket rejected/deferred with the recorded rationale, in both cases moving the resolved ticket artifact to the ticket archived directory and leaving an auditable dispatch-decision trail rather than discarding the ticket.
    scenarios:
      implemented-closes-with-evidence:
        - GIVEN: an open ticket
        - WHEN: ticket-resolve runs with the implemented outcome and evidence references
        - THEN: the ticket status becomes implemented, the supplied evidence is recorded on the ticket, and the ticket is moved under .strict-spec-driven/tickets/archived/
      not-wanted-rejects-with-rationale:
        - GIVEN: an open ticket
        - WHEN: ticket-resolve runs with the not-wanted outcome and a rationale
        - THEN: the ticket status becomes rejected, the rationale is preserved in the recorded dispatch-decision, and the ticket is moved under .strict-spec-driven/tickets/archived/
  ticket-edit-contract:
    strength: MUST
    statement: The system MUST provide a ticket-edit command that updates the editable fields (title, problem, desired outcome, intent, labels, external tracker) of an existing active ticket, keeping the ticket id, created_at, status, provenance, and dispatch decision unchanged, refusing to edit a resolved/archived ticket or an unknown id, requiring at least one edit and rejecting conflicting set-and-clear flags for the same field, validating the result against the ticket schema before writing, and rebuilding the tickets index.
    scenarios:
      edit-updates-active-ticket-fields:
        - GIVEN: an active ticket exists
        - WHEN: ticket-edit runs with new values for editable fields such as title, problem, desired outcome, or intent
        - THEN: the ticket file is rewritten with the new field values, its id, created_at, and status are unchanged, the tickets index is refreshed, and the updated ticket is reported
      edit-clears-optional-fields:
        - GIVEN: an active ticket carries optional intent, labels, or an external tracker
        - WHEN: ticket-edit runs with the corresponding value-less clear flag for an optional field
        - THEN: that optional field is removed from the ticket while the remaining fields are preserved
      edit-rejects-resolved-or-unknown-ticket:
        - GIVEN: a ticket id resolves only to the archived tickets directory or to no ticket at all
        - WHEN: ticket-edit runs with that id
        - THEN: no ticket file is modified and the command exits non-zero with a deterministic diagnostic distinguishing a resolved ticket from an unknown id
      edit-rejects-invalid-or-empty-request:
        - GIVEN: an active ticket exists
        - WHEN: ticket-edit runs with no edit flags, with both a set value and a clear flag for the same field, or with a blank value for a required field
        - THEN: the ticket file is left unchanged and the command exits non-zero with a diagnostic naming the offending input
  ticket-lifecycle-updated-at:
    strength: MUST
    statement: The system MUST require ticket artifacts to record both created_at and updated_at, set both fields to the same timestamp when a new ticket is created, preserve created_at after creation, and refresh updated_at whenever ticket-edit or ticket-resolve rewrites the ticket artifact.
    scenarios:
      ticket-create-initializes-lifecycle-timestamps:
        - GIVEN: a strict workflow with the ticket contract is present
        - WHEN: ticket-create creates a new ticket
        - THEN: the ticket artifact includes created_at and updated_at with the same creation timestamp
      ticket-edit-refreshes-updated-at:
        - GIVEN: an active ticket exists with created_at and updated_at
        - WHEN: ticket-edit successfully rewrites editable ticket fields
        - THEN: created_at remains unchanged and updated_at is later than or different from the previous updated_at value
      ticket-resolve-refreshes-updated-at:
        - GIVEN: an active ticket exists with created_at and updated_at
        - WHEN: ticket-resolve records a dispatch decision and archives the ticket
        - THEN: the archived ticket preserves created_at and records an updated_at timestamp for the resolve rewrite
  ticket-created-at-ordering:
    strength: MUST
    statement: The system MUST order active ticket INDEX.yaml entries and ticket-list output by ticket created_at from oldest to newest, using ticket id as the deterministic tie-breaker when created_at values match.
    scenarios:
      index-rebuild-orders-by-created-at:
        - GIVEN: multiple active tickets exist with different created_at values
        - WHEN: the tickets index is rebuilt
        - THEN: INDEX.yaml lists tickets from oldest created_at to newest created_at, with ticket id ordering tickets that share the same created_at
      ticket-list-orders-by-created-at:
        - GIVEN: multiple active tickets exist with different created_at values
        - WHEN: ticket-list runs
        - THEN: the returned ticket collection is ordered from oldest created_at to newest created_at, with ticket id ordering tickets that share the same created_at

schema: strict-spec-driven/main-spec/v1
schema_version: 1
artifact_type: main_spec
schema_file: templates/strict-spec-driven/schemas/main-spec.yaml
spec:
  id: design-domain-behavior
  title: Design System Document Domain Behavior
requirements:
  design-system-document-rendering:
    strength: MUST
    statement: 'The design-generate command MUST write a DESIGN.md in the design.md interchange format: a YAML front-matter block carrying the machine-readable design tokens declared by the project design-system artifact, followed by a banner identifying the file as generated and naming its source artifacts, followed by an Overview section derived from the artifact''s guidance, a Colors section, a Typography section, a Layout section, an Elevation and Depth section, and a Shapes section derived from the corresponding token groups, a Components section listing each declared component with the tokens it maps to, and a Do''s and Don''ts section derived from the artifact''s guidance.'
    scenarios:
      renders-design-md-format:
        - GIVEN: A project has a valid design-system artifact declaring at least one entry in each token group, at least one component, and guidance containing an overview and both do and don't items
        - WHEN: The operator runs design-generate
        - THEN: DESIGN.md is written, its first line opens a YAML front-matter block containing the declared tokens, the generated banner follows the front matter and names the design-system artifact as a source, and the body contains the Overview, Colors, Typography, Layout, Elevation and Depth, Shapes, Components, and Do's and Don'ts sections in that order
      rendering-is-deterministic:
        - GIVEN: A project whose design-system artifact is unchanged between runs
        - WHEN: The operator runs design-generate twice in a row
        - THEN: The second run produces a DESIGN.md byte-identical to the first
      omits-sections-for-absent-token-groups:
        - GIVEN: A project whose design-system artifact declares colors and typography but no elevation or shapes tokens
        - WHEN: The operator runs design-generate
        - THEN: DESIGN.md contains the Colors and Typography sections, omits the Elevation and Depth and Shapes sections rather than rendering them empty, and the front matter carries only the declared token groups
  design-system-document-drift-detection:
    strength: MUST
    statement: The design-generate command MUST support a check mode that renders the design document in memory, compares it against the design document on disk, leaves the file unmodified, and exits non-zero when the two differ or when the file is absent, reporting that the design-system artifact makes the document stale.
    scenarios:
      check-passes-when-current:
        - GIVEN: A project whose DESIGN.md matches what design-generate would render
        - WHEN: The operator runs design-generate in check mode
        - THEN: The command exits zero, reports the document as current, and does not modify DESIGN.md
      check-fails-when-stale:
        - GIVEN: A project whose design-system artifact has been edited since DESIGN.md was last rendered
        - WHEN: The operator runs design-generate in check mode
        - THEN: The command exits non-zero, reports the document as stale, names the design-system artifact as the changed source, and leaves DESIGN.md byte-identical to its prior content
      check-fails-when-document-absent:
        - GIVEN: A project with a valid design-system artifact but no DESIGN.md on disk
        - WHEN: The operator runs design-generate in check mode
        - THEN: The command exits non-zero, reports that the design document is missing, and does not create it
  design-system-document-output-path:
    strength: MUST
    statement: The design-generate command MUST render to DESIGN.md at the repository root by default and MUST render to an operator-supplied repository-relative path instead when an output path is given, applying the same rendering and check semantics to that path.
    scenarios:
      default-output-path:
        - GIVEN: A project with a valid design-system artifact and no output path supplied
        - WHEN: The operator runs design-generate
        - THEN: The rendered document is written to DESIGN.md at the repository root and ARCHITECTURE.md is not created or modified
      overridden-output-path:
        - GIVEN: A project with a valid design-system artifact
        - WHEN: The operator runs design-generate with an output path pointing to a different repository-relative file
        - THEN: The rendered document is written to that path, DESIGN.md at the repository root is not created or modified, and check mode run with the same output path compares against that path
  missing-design-system-artifact-error:
    strength: MUST
    statement: When the project design-system artifact is absent, the design-generate and design-status commands MUST exit non-zero with a message that names the missing artifact path and the workflow entry point that creates it, and MUST NOT write, modify, or partially render a design document.
    scenarios:
      absent-design-system-artifact:
        - GIVEN: A project with a strict workflow directory and an architecture artifact but no design-system artifact
        - WHEN: The operator runs design-generate
        - THEN: The command exits non-zero, the message names the expected design-system artifact path and the design authoring entry point, and no design document is created or modified
      absent-artifact-does-not-fall-back-to-architecture:
        - GIVEN: A project that has an architecture artifact and an ARCHITECTURE.md but no design-system artifact
        - WHEN: The operator runs design-generate
        - THEN: The command exits non-zero naming the missing design-system artifact, and neither ARCHITECTURE.md nor DESIGN.md is created or modified
  design-system-status-reporting:
    strength: MUST
    statement: The design-status command MUST report whether the project design-system artifact validates against its registered schema, report the number of token groups, tokens, and components it declares, and report every component implementation mapping path and every component visual-regression snapshot path that does not exist in the repository as mapping drift, exiting non-zero when the artifact is invalid.
    scenarios:
      reports-counts-for-valid-artifact:
        - GIVEN: A project whose design-system artifact is schema-valid and whose component implementation and snapshot mapping paths all exist
        - WHEN: The operator runs design-status
        - THEN: The command exits zero, reports the artifact as valid, reports the token group, token, and component counts, and reports no mapping drift
      reports-mapping-drift:
        - GIVEN: A project whose design-system artifact is schema-valid but maps a component to an implementation path that no longer exists
        - WHEN: The operator runs design-status
        - THEN: The command reports that path as mapping drift together with the component that declares it
      reports-snapshot-drift:
        - GIVEN: A project whose design-system artifact is schema-valid but declares a component visual-regression snapshot path that no longer exists in the repository
        - WHEN: The operator runs design-status
        - THEN: The command reports that snapshot path as mapping drift together with the component that declares it
      rejects-invalid-artifact:
        - GIVEN: A project whose design-system artifact does not validate against the registered design-system schema
        - WHEN: The operator runs design-status
        - THEN: The command exits non-zero and reports the schema validation diagnostics
  design-system-artifact-availability:
    strength: MUST
    statement: The workflow MUST register a design-system artifact schema that is listed by schema-list and printable by schema-show, and init MUST NOT scaffold a design-system artifact, leaving it optional and absent until a project authors one.
    scenarios:
      schema-is-discoverable:
        - GIVEN: A project with the strict workflow available
        - WHEN: The operator runs schema-list and then schema-show for the design-system schema
        - THEN: schema-list includes the design-system schema and schema-show prints its definition
      init-does-not-scaffold-design-system-artifact:
        - GIVEN: A directory with no strict workflow state
        - WHEN: The operator runs init
        - THEN: The workflow config, spec index, and architecture artifact are created and no design-system artifact is created
  design-system-artifact-initialization:
    strength: MUST
    statement: The design-init command MUST create the project design-system artifact from the bundled design-system scaffold template when the artifact is absent, MUST report the created path, MUST leave an existing artifact byte-identical and report it as skipped rather than overwriting it, and the created artifact MUST validate against the registered design-system schema so design-status and design-generate are usable immediately; init MUST continue to create no design-system artifact.
    scenarios:
      creates-artifact-when-absent:
        - GIVEN: A project with strict workflow state and no design-system artifact
        - WHEN: The operator runs design-init
        - THEN: The command exits zero, reports the created .strict-spec-driven/design-system.yaml path, and the created artifact validates against the registered design-system schema
      created-artifact-is-immediately-usable:
        - GIVEN: A project where design-init has just created the design-system artifact and nothing else has edited it
        - WHEN: The operator runs design-status
        - THEN: The command exits zero, reports the artifact as valid, reports zero tokens and zero components, and reports no mapping drift
      skips-existing-artifact-without-overwriting:
        - GIVEN: A project whose design-system artifact already declares tokens and components
        - WHEN: The operator runs design-init
        - THEN: The command exits zero, reports the artifact as skipped, and the artifact on disk is byte-identical to its prior content
      init-still-does-not-scaffold-the-artifact:
        - GIVEN: A directory with no strict workflow state
        - WHEN: The operator runs init without running design-init
        - THEN: The workflow config, spec index, and architecture artifact are created and no design-system artifact is created
  design-system-cli-authoring-contract:
    strength: MUST
    statement: 'The workflow MUST provide design-edit as an artifact-aware named-argument command for meaningful design-system creation, non-destructive identity, token, component mapping, visual snapshot, and guidance updates, exact named removals, and explicit guarded deletion through the shared atomic mutation boundary; design-init and design synchronization MUST use the same writer, and DESIGN.md MUST remain rendered only by the shared generator: neither command composes the document itself, and after a committed source write each MUST re-render an existing stale DESIGN.md through that generator and name the rewritten path in its result.'
    scenarios:
      design-upsert-and-removal-preserve-siblings:
        - GIVEN: A valid design-system artifact declares multiple token groups, tokens, components, mappings, snapshots, and guidance entries
        - WHEN: The operator upserts one named value or removes one exact named entry through design-edit
        - THEN: Only the named target changes, additive values remain duplicate-free, siblings remain unchanged, and an existing stale DESIGN.md is re-rendered through the shared generator with its path named in the result
      design-init-uses-shared-boundary:
        - GIVEN: Strict workflow state exists without a design-system artifact
        - WHEN: The operator runs design-init
        - THEN: The command creates the schema-valid bundled initial state through the shared mutation boundary, reports an existing artifact as unchanged, leaves no file behind after validation or commit failure, and re-renders an existing stale DESIGN.md through the shared generator
      design-delete-is-explicit-and-safe:
        - GIVEN: A design-system artifact and possibly a rendered DESIGN.md exist
        - WHEN: The operator requests whole-artifact deletion
        - THEN: The command accepts only isolated delete intent under the declared lifecycle constraints, never deletes the generated document implicitly, and preserves all files on rejection

schema: strict-spec-driven/main-spec/v1
schema_version: 1
artifact_type: main_spec
schema_file: templates/strict-spec-driven/schemas/main-spec.yaml
spec:
  id: cli-foundation
  title: CLI Foundation
mapping:
  implementation:
    - package.json
    - install.sh
    - tsconfig.json
    - src/converters/roadmap.ts
    - src/migrate.ts
    - src/strict-spec-cli.ts
    - src/roadmap.ts
    - src/archive.ts
    - src/scaffold.ts
    - src/validation.ts
    - src/yaml.ts
    - src/apply.ts
    - src/verify.ts
    - src/review.ts
    - src/skills.ts
    - skills/strict-spec-ship/SKILL.md
    - templates/strict-spec-driven/scaffold/config.yaml
    - templates/strict-spec-driven/scaffold/changes/proposal.yaml
    - templates/strict-spec-driven/scaffold/changes/design.yaml
    - templates/strict-spec-driven/scaffold/changes/tasks.yaml
    - templates/strict-spec-driven/scaffold/changes/questions.yaml
    - templates/strict-spec-driven/scaffold/specs/INDEX.yaml
    - templates/strict-spec-driven/scaffold/specs/README.md
    - templates/strict-spec-driven/scaffold/roadmap/INDEX.yaml
    - templates/strict-spec-driven/scaffold/changes/STATE.yaml
  tests:
    - test/run.ts
requirements:
  - id: cli-build-and-test-commands
    strength: MUST
    statement: >-
      The system MUST provide `build` and `test` package scripts that compile TypeScript sources to
      `dist/` and run the test suite using bun.
    scenarios:
      - id: build-compiles-without-errors
        steps:
          - kind: GIVEN
            text: the TypeScript sources under `src/` are syntactically valid
          - kind: WHEN
            text: '`bun run build` is executed'
          - kind: THEN
            text: the TypeScript compiler produces compiled output under `dist/` with zero errors
      - id: test-suite-is-executable
        steps:
          - kind: GIVEN
            text: the `dist/` output exists
          - kind: WHEN
            text: '`bun test/run.ts` is executed'
          - kind: THEN
            text: the test suite runs and reports pass or fail status
  - id: cli-unknown-subcommand-rejection
    strength: MUST
    statement: >-
      The system MUST exit non-zero and write a usage hint to stderr when invoked with an unknown
      subcommand or no arguments.
    scenarios:
      - id: unknown-subcommand-exits-non-zero
        steps:
          - kind: GIVEN
            text: the `strict-spec-driven` CLI is invoked with an unrecognized subcommand
          - kind: WHEN
            text: the command router processes the argument
          - kind: THEN
            text: the process exits with a non-zero exit code
          - kind: AND
            text: a usage hint is written to stderr
      - id: no-arg-invocation-exits-non-zero
        steps:
          - kind: GIVEN
            text: the `strict-spec-driven` CLI is invoked with no arguments
          - kind: WHEN
            text: the command router processes the argument
          - kind: THEN
            text: the process exits with a non-zero exit code
          - kind: AND
            text: a usage hint is written to stderr
  - id: cli-shared-yaml-validation-layer
    strength: MUST
    statement: >-
      The system MUST provide shared strict-CLI validation utilities for YAML parse/stringify,
      schema compilation, bundled schema loading, and deterministic diagnostics so multiple commands
      can validate artifacts through one consistent pipeline.
    scenarios:
      - id: bundled-schemas-are-loadable-for-command-validation
        steps:
          - kind: GIVEN
            text: a strict CLI command needs to validate an artifact
          - kind: WHEN
            text: it requests a schema through the shared validation utilities
          - kind: THEN
            text: >-
              the schema is loaded from bundled strict schema assets under
              `templates/strict-spec-driven/schemas/`
      - id: validation-diagnostics-are-deterministic
        steps:
          - kind: GIVEN
            text: the same invalid artifact is validated multiple times against the same schema
          - kind: WHEN
            text: diagnostics are emitted by the shared validation utilities
          - kind: THEN
            text: diagnostic entries are stable in structure and ordering
          - kind: AND
            text: each diagnostic includes artifact path and field-path context
  - id: cli-strict-scaffold-template-assets
    strength: MUST
    statement: >-
      The system MUST provide bundled strict scaffold template assets that can seed initial
      `.strict-spec-driven/` project state for init and fixture-driven tests.
    scenarios:
      - id: required-scaffold-template-asset-families-are-present
        steps:
          - kind: GIVEN
            text: the strict CLI bundled templates are inspected
          - kind: WHEN
            text: scaffold template assets are enumerated
          - kind: THEN
            text: >-
              template assets exist for strict config, specs index, roadmap index, empty changes
              state, and seed README guidance
      - id: scaffold-templates-remain-separate-from-contract-schemas-and-examples
        steps:
          - kind: GIVEN
            text: strict template directories are inspected
          - kind: WHEN
            text: scaffold template assets are compared to schema and example assets
          - kind: THEN
            text: scaffold assets are stored as a distinct template bundle
          - kind: AND
            text: schema and example files remain dedicated to validation contracts and examples
  - id: cli-init-creates-strict-workflow-scaffold
    strength: MUST
    statement: >-
      The system MUST provide an `init` subcommand that creates strict workflow state under
      `.strict-spec-driven/` using bundled scaffold template assets.
    scenarios:
      - id: init-creates-missing-strict-scaffold-artifacts
        steps:
          - kind: GIVEN
            text: a repository with bundled strict scaffold template assets
          - kind: AND
            text: '`.strict-spec-driven/` does not yet exist'
          - kind: WHEN
            text: '`strict-spec-driven init` is executed'
          - kind: THEN
            text: '`.strict-spec-driven/` is created'
          - kind: AND
            text: >-
              strict config, specs index, roadmap index, changes state, and seed README guidance
              artifacts are created from bundled templates
  - id: cli-init-is-idempotent-and-non-clobbering
    strength: MUST
    statement: >-
      The system MUST make `init` idempotent and MUST NOT overwrite existing strict workflow
      artifacts.
    scenarios:
      - id: existing-strict-artifacts-are-preserved-on-rerun
        steps:
          - kind: GIVEN
            text: '`.strict-spec-driven/` already exists with user-authored artifact content'
          - kind: WHEN
            text: '`strict-spec-driven init` is executed again'
          - kind: THEN
            text: existing strict workflow artifacts are left unchanged
          - kind: AND
            text: only missing required scaffold artifacts are created
  - id: cli-init-handles-bootstrap-coexistence
    strength: MUST
    statement: >-
      The system MUST allow strict scaffold initialization to proceed when a legacy `.spec-driven/`
      directory is present and MUST emit a warning about coexistence.
    scenarios:
      - id: init-warns-and-continues-when-bootstrap-directory-exists
        steps:
          - kind: GIVEN
            text: a repository contains `.spec-driven/`
          - kind: WHEN
            text: '`strict-spec-driven init` is executed'
          - kind: THEN
            text: >-
              the command emits one warning indicating `.spec-driven/` is bootstrap or legacy
              workflow state
          - kind: AND
            text: >-
              strict scaffold initialization continues without failing solely due to that
              directory's presence
  - id: cli-propose-creates-strict-change-scaffold
    strength: MUST
    statement: >-
      The system MUST provide a `propose` subcommand that creates strict change planning artifacts
      under `.strict-spec-driven/changes/<name>/`.
    scenarios:
      - id: propose-scaffolds-strict-yaml-artifacts
        steps:
          - kind: GIVEN
            text: a valid kebab-case change name that does not already exist
          - kind: WHEN
            text: '`strict-spec-driven propose <name>` is executed'
          - kind: THEN
            text: the change directory is created under `.strict-spec-driven/changes/`
          - kind: AND
            text: >-
              `proposal.yaml`, `design.yaml`, `tasks.yaml`, and `questions.yaml` are created from
              strict templates
          - kind: AND
            text: a `specs/` directory is created for delta specs
  - id: cli-propose-validates-change-name-and-collision
    strength: MUST
    statement: >-
      The system MUST reject invalid strict change names and existing strict change collisions
      before writing scaffold files.
    scenarios:
      - id: propose-rejects-invalid-name
        steps:
          - kind: GIVEN
            text: a requested change name that is not kebab-case
          - kind: WHEN
            text: '`strict-spec-driven propose <name>` is executed'
          - kind: THEN
            text: the command exits non-zero
          - kind: AND
            text: no strict change directory is created
      - id: propose-rejects-duplicate-change
        steps:
          - kind: GIVEN
            text: '`.strict-spec-driven/changes/<name>/` already exists'
          - kind: WHEN
            text: '`strict-spec-driven propose <name>` is executed'
          - kind: THEN
            text: the command exits non-zero
          - kind: AND
            text: existing change artifacts are left unchanged
  - id: cli-propose-reports-created-artifacts
    strength: MUST
    statement: >-
      The system MUST emit deterministic output listing the strict change artifacts created by
      `propose`.
    scenarios:
      - id: propose-output-includes-artifact-paths
        steps:
          - kind: GIVEN
            text: '`strict-spec-driven propose <name>` completes successfully'
          - kind: WHEN
            text: command output is reviewed
          - kind: THEN
            text: output identifies the created strict change directory
          - kind: AND
            text: output lists the created planning artifact paths for follow-up editing
  - id: cli-build-bundles-templates
    strength: MUST
    statement: >-
      The system MUST copy the `templates/` directory into `dist/templates/` as part of the build
      step so compiled scripts can resolve scaffold and schema assets without depending on the
      source tree.
    scenarios:
      - id: templates-appear-in-dist-after-build
        steps:
          - kind: GIVEN
            text: the TypeScript sources compile successfully
          - kind: WHEN
            text: '`bun run build` completes'
          - kind: THEN
            text: >-
              `dist/templates/strict-spec-driven/scaffold/` contains all required scaffold template
              assets
          - kind: AND
            text: '`dist/templates/strict-spec-driven/schemas/` contains all schema and registry assets'
  - id: cli-template-resolution-from-dist
    strength: MUST
    statement: >-
      The system MUST resolve bundled template directories relative to `import.meta.url` so that
      compiled scripts in `dist/` find templates under `dist/templates/` without depending on the
      source tree.
    scenarios:
      - id: compiled-scripts-find-scaffold-templates
        steps:
          - kind: GIVEN
            text: '`dist/` contains compiled JS and `dist/templates/` contains copied template assets'
          - kind: WHEN
            text: a compiled script resolves a scaffold template path
          - kind: THEN
            text: the template is found under `dist/templates/strict-spec-driven/scaffold/`
      - id: compiled-scripts-find-schema-assets
        steps:
          - kind: GIVEN
            text: '`dist/` contains compiled JS and `dist/templates/` contains copied template assets'
          - kind: WHEN
            text: a compiled script resolves a schema path
          - kind: THEN
            text: the schema is found under `dist/templates/strict-spec-driven/schemas/`
  - id: cli-template-resolution-fallback
    strength: MUST
    statement: >-
      The system MUST fall back to `../templates/` relative to the module file when
      `dist/templates/` does not exist, so template resolution works during development before the
      copy step runs.
    scenarios:
      - id: source-tree-fallback-when-dist-templates-missing
        steps:
          - kind: GIVEN
            text: '`dist/templates/` does not exist'
          - kind: WHEN
            text: a script resolves a bundled template path
          - kind: THEN
            text: >-
              the template is found under `../templates/strict-spec-driven/` relative to the module
              file
  - id: cli-init-works-from-dist-only
    strength: MUST
    statement: >-
      The system MUST allow `strict-spec-driven init` to create scaffold files correctly when run
      from the compiled `dist/` output without the source tree present.
    scenarios:
      - id: init-succeeds-from-dist-only-environment
        steps:
          - kind: GIVEN
            text: only the `dist/` directory exists with compiled JS and bundled templates
          - kind: WHEN
            text: '`strict-spec-driven init` is executed'
          - kind: THEN
            text: it creates `.strict-spec-driven/` with all required scaffold artifacts
  - id: cli-propose-works-from-dist-only
    strength: MUST
    statement: >-
      The system MUST allow `strict-spec-driven propose` to create change scaffolds correctly when
      run from the compiled `dist/` output without the source tree present.
    scenarios:
      - id: propose-succeeds-from-dist-only-environment
        steps:
          - kind: GIVEN
            text: only the `dist/` directory exists with compiled JS and bundled templates
          - kind: WHEN
            text: '`strict-spec-driven propose <name>` is executed'
          - kind: THEN
            text: it creates the change directory with all planning artifacts
  - id: cli-apply-reads-tasks-yaml
    strength: MUST
    statement: >-
      The system MUST provide an `apply` subcommand that reads `tasks.yaml` from a named active
      strict change directory under `.strict-spec-driven/changes/<name>/`.
    scenarios:
      - id: apply-locates-tasks-for-an-existing-change
        steps:
          - kind: GIVEN
            text: '`.strict-spec-driven/changes/<name>/tasks.yaml` exists with at least one pending task'
          - kind: WHEN
            text: '`strict-spec-driven apply <name>` is executed'
          - kind: THEN
            text: the command reads and parses the tasks artifact from the change directory
      - id: apply-rejects-missing-change
        steps:
          - kind: GIVEN
            text: '`.strict-spec-driven/changes/<name>/` does not exist'
          - kind: WHEN
            text: '`strict-spec-driven apply <name>` is executed'
          - kind: THEN
            text: the command exits non-zero
          - kind: AND
            text: an error message is written to stderr indicating the change was not found
  - id: cli-apply-completes-next-pending-task
    strength: MUST
    statement: >-
      The system MUST complete exactly one pending task per `apply` invocation by locating the first
      task with `status: pending` across all task sections, setting its status to `complete`, and
      writing the updated `tasks.yaml` back to disk.
    scenarios:
      - id: apply-completes-first-pending-task
        steps:
          - kind: GIVEN
            text: a strict change has `tasks.yaml` with multiple pending tasks across sections
          - kind: WHEN
            text: '`strict-spec-driven apply <name>` is executed'
          - kind: THEN
            text: 'the first task with `status: pending` across sections is set to `complete`'
          - kind: AND
            text: the updated `tasks.yaml` is written back to the change directory
          - kind: AND
            text: no other task statuses are modified
      - id: apply-preserves-tasks-yaml-structure
        steps:
          - kind: GIVEN
            text: a strict change has `tasks.yaml` with sections, task fields, and testing gates
          - kind: WHEN
            text: '`strict-spec-driven apply <name>` is executed'
          - kind: THEN
            text: >-
              the `tasks.yaml` sections, task identifiers, task text, commands, and testing gates
              remain unchanged
          - kind: AND
            text: only the target task `status` field is modified
  - id: cli-apply-rejects-all-complete
    strength: MUST
    statement: The system MUST exit non-zero when no pending tasks remain in the change.
    scenarios:
      - id: apply-rejects-when-all-tasks-complete
        steps:
          - kind: GIVEN
            text: 'a strict change has `tasks.yaml` with all tasks having `status: complete`'
          - kind: WHEN
            text: '`strict-spec-driven apply <name>` is executed'
          - kind: THEN
            text: the command exits non-zero
          - kind: AND
            text: an error message is written to stderr indicating no pending tasks remain
  - id: cli-apply-emits-task-status-json
    strength: MUST
    statement: >-
      The system MUST emit a deterministic JSON object to stdout describing the completed task and
      remaining task summary.
    scenarios:
      - id: apply-output-is-parseable-json
        steps:
          - kind: GIVEN
            text: '`strict-spec-driven apply <name>` completes a task successfully'
          - kind: WHEN
            text: command stdout is parsed as JSON
          - kind: THEN
            text: the JSON includes the completed task section name, task id, and task text
          - kind: AND
            text: the JSON includes the total task count and remaining pending count
      - id: apply-status-output-is-deterministic
        steps:
          - kind: GIVEN
            text: the same change tasks state is applied twice in sequence
          - kind: WHEN
            text: each JSON output is compared
          - kind: THEN
            text: each output reflects only the task completed in that invocation
  - id: cli-verify-reads-active-change-artifacts
    strength: MUST
    statement: >-
      The system MUST provide a `verify` subcommand that reads all planning artifacts
      (proposal.yaml, design.yaml, tasks.yaml, questions.yaml) and any delta spec files under
      `specs/` from a named active strict change directory under
      `.strict-spec-driven/changes/<name>/`.
    scenarios:
      - id: verify-locates-artifacts-for-an-existing-change
        steps:
          - kind: GIVEN
            text: '`.strict-spec-driven/changes/<name>/` exists with planning artifacts'
          - kind: WHEN
            text: '`strict-spec-driven verify <name>` is executed'
          - kind: THEN
            text: the command reads and parses each planning artifact from the change directory
      - id: verify-rejects-missing-change
        steps:
          - kind: GIVEN
            text: '`.strict-spec-driven/changes/<name>/` does not exist'
          - kind: WHEN
            text: '`strict-spec-driven verify <name>` is executed'
          - kind: THEN
            text: the command exits non-zero
          - kind: AND
            text: an error message is written to stderr indicating the change was not found
  - id: cli-verify-validates-artifacts-against-schemas
    strength: MUST
    statement: >-
      The system MUST validate each change planning artifact against its registered strict YAML
      schema and include any schema violations in the verification diagnostics.
    scenarios:
      - id: valid-artifacts-produce-no-schema-diagnostics
        steps:
          - kind: GIVEN
            text: a strict change has valid proposal.yaml, design.yaml, tasks.yaml, and questions.yaml
          - kind: WHEN
            text: '`strict-spec-driven verify <name>` is executed'
          - kind: THEN
            text: no schema validation diagnostics are emitted for those artifacts
      - id: invalid-artifact-produces-schema-diagnostics
        steps:
          - kind: GIVEN
            text: a strict change has a tasks.yaml missing a required field
          - kind: WHEN
            text: '`strict-spec-driven verify <name>` is executed'
          - kind: THEN
            text: a schema validation diagnostic is emitted identifying the artifact path and field path
  - id: cli-verify-checks-task-completion
    strength: MUST
    statement: >-
      The system MUST report a verification diagnostic when any task in the change has a status
      other than `complete`.
    scenarios:
      - id: all-tasks-complete-produces-no-task-diagnostics
        steps:
          - kind: GIVEN
            text: 'a strict change has tasks.yaml with all tasks having `status: complete`'
          - kind: WHEN
            text: '`strict-spec-driven verify <name>` is executed'
          - kind: THEN
            text: no task-completion diagnostics are emitted
      - id: pending-task-produces-diagnostic
        steps:
          - kind: GIVEN
            text: 'a strict change has tasks.yaml with at least one task having `status: pending`'
          - kind: WHEN
            text: '`strict-spec-driven verify <name>` is executed'
          - kind: THEN
            text: a diagnostic is emitted identifying the incomplete task
  - id: cli-verify-checks-open-questions
    strength: MUST
    statement: >-
      The system MUST report a verification diagnostic when the questions artifact contains any open
      questions.
    scenarios:
      - id: no-open-questions-produces-no-question-diagnostics
        steps:
          - kind: GIVEN
            text: a strict change has questions.yaml with an empty `open` list
          - kind: WHEN
            text: '`strict-spec-driven verify <name>` is executed'
          - kind: THEN
            text: no open-question diagnostics are emitted
      - id: open-questions-produce-diagnostics
        steps:
          - kind: GIVEN
            text: a strict change has questions.yaml with at least one entry in the `open` list
          - kind: WHEN
            text: '`strict-spec-driven verify <name>` is executed'
          - kind: THEN
            text: a diagnostic is emitted for each open question
  - id: cli-verify-validates-testing-gates
    strength: MUST
    statement: >-
      The system MUST validate that `tasks.yaml` testing gates reference existing task IDs within
      the Testing section and report a diagnostic when a referenced task ID is missing or outside
      the Testing section.
    scenarios:
      - id: valid-testing-gates-produce-no-diagnostics
        steps:
          - kind: GIVEN
            text: >-
              a strict change has tasks.yaml where `testing_gates.validation_task` and
              `testing_gates.unit_test_task` reference existing task IDs in the Testing section
          - kind: WHEN
            text: '`strict-spec-driven verify <name>` is executed'
          - kind: THEN
            text: no testing-gate diagnostics are emitted
      - id: missing-testing-gate-target-produces-diagnostic
        steps:
          - kind: GIVEN
            text: >-
              a strict change has tasks.yaml where `testing_gates.validation_task` references a task
              ID that does not exist in the Testing section
          - kind: WHEN
            text: '`strict-spec-driven verify <name>` is executed'
          - kind: THEN
            text: a diagnostic is emitted identifying the invalid testing gate reference
  - id: cli-verify-validates-delta-specs
    strength: MUST
    statement: >-
      The system MUST validate each YAML file under the change `specs/` directory against the
      registered delta-spec schema and include any violations in the verification diagnostics.
    scenarios:
      - id: valid-delta-specs-produce-no-diagnostics
        steps:
          - kind: GIVEN
            text: >-
              a strict change has delta spec files under `specs/` that conform to the delta-spec
              schema
          - kind: WHEN
            text: '`strict-spec-driven verify <name>` is executed'
          - kind: THEN
            text: no delta-spec diagnostics are emitted
      - id: malformed-delta-spec-produces-diagnostics
        steps:
          - kind: GIVEN
            text: >-
              a strict change has a delta spec file under `specs/` that violates the delta-spec
              schema
          - kind: WHEN
            text: '`strict-spec-driven verify <name>` is executed'
          - kind: THEN
            text: a diagnostic is emitted identifying the delta spec path and violation
  - id: cli-verify-enforces-exclusive-active-targets
    strength: MUST
    statement: >-
      The system MUST report a verification diagnostic when two or more active changes have delta
      specs that target the same requirement ID with MODIFIED or REMOVED operations.
    scenarios:
      - id: no-target-overlap-produces-no-conflict-diagnostics
        steps:
          - kind: GIVEN
            text: >-
              active changes have delta specs with disjoint MODIFIED and REMOVED target_requirement
              values
          - kind: WHEN
            text: '`strict-spec-driven verify <name>` is executed'
          - kind: THEN
            text: no exclusive-active-target diagnostics are emitted
      - id: overlapping-targets-produce-conflict-diagnostics
        steps:
          - kind: GIVEN
            text: >-
              two active changes each have a delta spec with a MODIFIED entry targeting the same
              requirement ID
          - kind: WHEN
            text: '`strict-spec-driven verify <name>` is executed'
          - kind: THEN
            text: >-
              a diagnostic is emitted identifying the conflicting requirement ID and the competing
              change names
  - id: cli-verify-emits-deterministic-json-output
    strength: MUST
    statement: >-
      The system MUST emit a deterministic JSON object to stdout containing `valid`, `diagnostics`,
      `changeName`, `totalTasks`, `completeTasks`, `remainingPending`, and `openQuestionCount`.
    scenarios:
      - id: verify-output-is-parseable-json
        steps:
          - kind: GIVEN
            text: '`strict-spec-driven verify <name>` completes'
          - kind: WHEN
            text: command stdout is parsed as JSON
          - kind: THEN
            text: the JSON includes `valid` as a boolean
          - kind: AND
            text: the JSON includes `diagnostics` as an array
          - kind: AND
            text: >-
              the JSON includes `changeName`, `totalTasks`, `completeTasks`, `remainingPending`, and
              `openQuestionCount`
      - id: verify-exits-non-zero-when-invalid
        steps:
          - kind: GIVEN
            text: a strict change has verification diagnostics
          - kind: WHEN
            text: '`strict-spec-driven verify <name>` is executed'
          - kind: THEN
            text: the command exits with a non-zero exit code
      - id: verify-exits-zero-when-valid
        steps:
          - kind: GIVEN
            text: a strict change has no verification diagnostics
          - kind: WHEN
            text: '`strict-spec-driven verify <name>` is executed'
          - kind: THEN
            text: the command exits with exit code zero
  - id: cli-verify-works-from-dist-only
    strength: MUST
    statement: >-
      The system MUST allow `strict-spec-driven verify` to validate change artifacts correctly when
      run from the compiled `dist/` output without the source tree present.
    scenarios:
      - id: verify-succeeds-from-dist-only-environment
        steps:
          - kind: GIVEN
            text: only the `dist/` directory exists with compiled JS and bundled templates
          - kind: WHEN
            text: '`strict-spec-driven verify <name>` is executed against an active change'
          - kind: THEN
            text: it validates the change and emits correct diagnostics
  - id: cli-roadmap-status-reports-strict-roadmap-state
    strength: MUST
    statement: >-
      The system MUST provide a `roadmap-status` subcommand that validates
      `.strict-spec-driven/roadmap/` artifacts and reports milestone and planned change state using
      strict roadmap declared-status rules and derived completion semantics.
    scenarios:
      - id: roadmap-status-reports-ordered-milestone-state
        steps:
          - kind: GIVEN
            text: a valid strict roadmap exists under `.strict-spec-driven/roadmap/`
          - kind: WHEN
            text: '`strict-spec-driven roadmap-status` is executed'
          - kind: THEN
            text: the output includes milestone entries in roadmap order
          - kind: AND
            text: each milestone reports its declared status and derived status
          - kind: AND
            text: each planned change reports its declared roadmap status and workflow-backed state

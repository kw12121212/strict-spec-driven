    statement: The system MUST provide a shared `src/cli/output.ts` module with typed helpers for writing JSON, human-readable text, usage hints, and error messages to stdout and stderr so command modules do not call `process.stdout.write` or `process.stderr.write` directly.
    scenarios:
      json-output-is-written-through-shared-helper:
        - GIVEN: a CLI command produces a structured result
        - WHEN: the command writes its result
        - THEN: the JSON is written via the shared `writeJson` helper
        - AND: the output format is identical to the pre-centralization behavior
      error-output-is-written-through-shared-helpers:
        - GIVEN: a CLI command encounters a usage or runtime error
        - WHEN: the command writes its error or usage hint
        - THEN: the message is written via `writeUsage` or `writeError` as appropriate
        - AND: the stderr format is identical to the pre-centralization behavior
  cli-propose-populates-artifacts-from-structured-input:
    strength: MUST
    statement: The system MUST provide CLI behavior that populates existing strict change planning artifacts from explicit structured command input without requiring an AI agent to write the YAML artifact directly.
    scenarios:
      proposal-artifact-is-generated-from-command-input:
        - GIVEN: a strict change scaffold already exists
        - AND: valid command input describes one supported planning artifact
        - WHEN: the corresponding artifact population command is executed for that change
        - THEN: the target planning artifact is written under the existing change directory
        - AND: the written artifact validates against its strict YAML artifact schema
  cli-propose-generation-is-artifact-scoped:
    strength: MUST
    statement: The system MUST expose proposal population as artifact-level operations so proposal, design, questions, tasks, and individual delta specs can be generated through separate CLI invocations.
    scenarios:
      tasks-artifact-can-be-generated-through-generate:
        - GIVEN: a strict change scaffold exists
        - WHEN: a user or agent runs the generate command with the tasks artifact and named task arguments
        - THEN: the command writes only the tasks.yaml artifact
        - AND: unrelated planning artifacts in the same change are left unchanged
  cli-propose-generation-uses-named-arguments:
    strength: MUST
    statement: The system MUST provide proposal population commands that accept supported artifact content only through named CLI arguments, including repeated grouped question, scenario, and requirement arguments in a single invocation for artifacts that contain keyed collections.
    scenarios:
      named-argument-generation-does-not-use-payload-files:
        - GIVEN: a strict change scaffold exists
        - WHEN: an agent populates supported generated artifacts
        - THEN: the generated CLI commands use named arguments directly
        - AND: no JSON payload file is required
  cli-propose-generation-uses-direct-invocations:
    strength: MUST
    statement: The system MUST support direct agent-generated CLI invocations with named arguments as the only orchestration form for strict proposal population.
    scenarios:
      generated-cli-invocations-populate-change:
        - GIVEN: a strict change scaffold exists
        - AND: an agent produces one or more strict CLI proposal population commands with named arguments
        - WHEN: those commands are executed from the repository root
        - THEN: the requested strict change artifacts are populated
        - AND: no command constructs or consumes an AI-authored JSON payload file
  cli-propose-generation-reports-argument-errors:
    strength: MUST
    statement: The system MUST report invalid, incomplete, or positional proposal population arguments as deterministic CLI failures before writing target YAML artifacts.
    scenarios:
      missing-required-flag-fails-before-write:
        - GIVEN: a strict change scaffold exists
        - AND: a proposal population command omits a required named argument
        - WHEN: the command is executed
        - THEN: the command exits non-zero
        - AND: stderr identifies the missing argument name
        - AND: the existing target artifact is left unchanged
      positional-input-fails-before-write:
        - GIVEN: a strict change scaffold exists
        - AND: a proposal population command supplies a positional file argument
        - WHEN: the command is executed
        - THEN: the command exits non-zero
        - AND: stderr prints named-argument usage
        - AND: the existing target artifact is left unchanged
  cli-propose-generation-prevents-duplicates:
    strength: MUST
    statement: The system MUST prevent duplicate YAML content when equivalent proposal population commands are executed more than once, MUST merge compatible incremental scenario additions for an existing delta-spec requirement without rebuilding the artifact or editing YAML directly, and MUST treat a later invocation that restates a keyed item with different content as an edit that overwrites only that item, while a single invocation that names one identifier twice with conflicting content fails before writing.
    scenarios:
      repeated-list-values-are-deduplicated:
        - GIVEN: a strict change artifact already contains a generated list entry
        - WHEN: the same population command supplies the same list entry again
        - THEN: the resulting YAML artifact contains that list entry only once
        - THEN: the original list order is preserved
      keyed-items-are-upserted-by-identifier:
        - GIVEN: a generated artifact contains a keyed item such as a task, question, decision, or requirement
        - WHEN: a later population command targets the same item identifier with equivalent content
        - THEN: the resulting YAML artifact contains one item for that identifier
        - THEN: no duplicate keyed entry is written
      a-later-restatement-overwrites-only-that-item:
        - GIVEN: a generated artifact contains a keyed item such as a decision, question, requirement, or rule
        - WHEN: a later population command targets the same identifier with different content
        - THEN: that item's content is replaced, every other item and list entry in the artifact is preserved unchanged, and the command exits zero
      conflicting-keyed-items-in-one-invocation-fail-before-write:
        - GIVEN: a single population invocation names the same keyed identifier twice with conflicting content
        - WHEN: the command runs
        - THEN: the command exits non-zero before writing the artifact
        - THEN: stderr identifies the duplicate identifier conflict
      compatible-delta-requirement-scenarios-are-merged:
        - GIVEN: a generated delta spec contains a requirement with stable strength, statement, and scenario ids
        - WHEN: a later generation call targets the same operation and requirement with matching metadata and a new scenario id
        - THEN: the new scenario is appended after existing scenarios while unrelated artifact content is preserved
        - THEN: repeating an equivalent scenario remains idempotent
      conflicting-delta-requirement-content-in-one-invocation-fails-before-write:
        - GIVEN: a single generation invocation supplies different steps for the same scenario id of one requirement
        - WHEN: the command runs
        - THEN: the command exits non-zero before rewriting the artifact
        - THEN: stderr identifies the conflicting requirement field or scenario id
  cli-subcommands-support-help:
    strength: MUST
    statement: The system MUST support exact `--help` and `-h` help requests for the root CLI and every registered subcommand, printing help to stdout and exiting zero without performing the command's normal mutation or validation behavior; root help MUST list every registered command grouped by area with a one-line summary, and subcommand help MUST state the command summary, its positional arguments, a description of every accepted flag including whether it is required, repeatable, removal-scoped, or delete-scoped, the keys the command writes to its output, and the meaning of its exit codes.
    scenarios:
      repeatable-and-removal-flag-semantics-are-documented:
        - GIVEN: a subcommand accepts a repeatable list flag, a removal flag, or a delete flag
        - WHEN: its help is requested
        - THEN: stdout states whether repeated values append or overwrite, which entry a removal flag targets, and that the delete flag removes the whole artifact and cannot be combined with other flags, without the caller needing an external skill prompt
      root-help-lists-commands-with-summaries:
        - GIVEN: the strict CLI is available
        - WHEN: the root CLI is invoked with `--help`
        - THEN: the command exits zero, stdout lists every registered command grouped by area with a one-line summary, canonical registration order is preserved within each group, and stderr is empty
      subcommand-help-describes-full-surface:
        - GIVEN: a registered strict CLI subcommand exists
        - WHEN: that subcommand is invoked with `--help`
        - THEN: the command exits zero, stdout contains the command summary, its positional arguments, a description for every accepted flag, the command's output keys, and its exit-code meaning, and stderr is empty
      subcommand-help-skips-cache-sync:
        - GIVEN: the shared cache root is empty
        - WHEN: a registered subcommand is invoked with `--help`
        - THEN: help is printed without creating or writing the shared schema or sample cache
  cli-roadmap-loads-split-planned-change-files:
    strength: MUST
    statement: The system MUST load roadmap planned-change state from standalone planned-change artifacts as well as inline milestone planned_changes entries, associating every standalone planned change with exactly one owning milestone and preserving deterministic roadmap order.
    scenarios:
      split-planned-change-files-load-with-owning-milestone:
        - GIVEN: a strict roadmap contains milestone metadata and a standalone planned-change artifact that references one owning milestone
        - WHEN: strict roadmap state is loaded for roadmap-status or roadmap-sync
        - THEN: the standalone planned change is reported under its owning milestone in deterministic roadmap order
        - AND: existing inline milestone planned_changes entries remain valid during the compatibility window
  cli-roadmap-sync-preserves-split-planned-change-state:
    strength: MUST
    statement: The system MUST make roadmap-status and roadmap-sync derive and rewrite planned-change completion state consistently for inline and standalone planned-change representations without adding duplicate planned-change entries or moving data between representations implicitly.
    scenarios:
      sync-keeps-split-and-inline-state-deterministic:
        - GIVEN: a strict roadmap includes standalone planned-change files and inline milestone planned_changes entries
        - WHEN: roadmap-status or roadmap-sync reconciles planned-change state against active and archived strict changes
        - THEN: declared and derived planned-change statuses are computed consistently for both representations
        - AND: sync output preserves deterministic ordering and does not create duplicate planned-change entries
  cli-roadmap-materializes-inline-planned-changes:
    strength: MUST
    statement: The system MUST provide an explicit operator-selected roadmap conversion path that materializes inline milestone planned_changes entries as standalone planned-change YAML artifacts without losing planned-change identity, owning milestone, status, summary, details, or dependency data.
    scenarios:
      inline-planned-changes-materialize-as-standalone-files:
        - GIVEN: a strict roadmap milestone contains inline planned_changes entries
        - WHEN: the explicit inline-to-standalone roadmap conversion path is executed
        - THEN: standalone planned-change YAML artifacts are written for the converted planned changes
        - AND: each standalone artifact preserves the planned change id, owning milestone reference, status, summary, details, and depends_on values
      ordinary-sync-does-not-move-representation:
        - GIVEN: a strict roadmap still contains inline planned_changes entries
        - WHEN: ordinary roadmap-status or roadmap-sync behavior runs without the explicit conversion trigger
        - THEN: planned changes are not silently moved between inline and standalone representations
  cli-roadmap-cross-file-conflict-validation:
    strength: MUST
    statement: The system MUST make roadmap-status reject invalid split-file roadmap state with deterministic diagnostics for duplicate planned change identities, missing milestone references, invalid cross-file dependency references, ambiguous advisory ownership metadata, and conflicts with active strict changes for the same planned change identity.
    scenarios:
      roadmap-status-rejects-cross-file-conflicts:
        - GIVEN: a strict roadmap contains milestone metadata plus standalone planned-change files
        - WHEN: strict-spec-driven roadmap-status is executed
        - THEN: the command exits non-zero for duplicate planned change identities, missing milestone references, invalid dependency references, ambiguous advisory ownership metadata, or active strict change conflicts
  cli-roadmap-handoff-uses-split-planned-change-sources:
    strength: MUST
    statement: The system MUST make roadmap recommendation and roadmap-to-change proposal handoff treat standalone planned-change artifacts as eligible roadmap-backed work sources, using dependency readiness and active strict change conflicts when selecting or scaffolding exactly one planned change.
    scenarios:
      split-planned-change-is-selected-for-handoff:
        - GIVEN: a strict roadmap contains milestone metadata and standalone planned-change artifacts with complete dependencies
        - WHEN: strict roadmap recommendation or proposal handoff evaluates roadmap-backed work
        - THEN: one eligible standalone planned change can be selected and scaffolded as a normal strict change with its planned-change identity and owning milestone reference
  cli-roadmap-team-metadata-validation:
    strength: MUST
    statement: The system MUST accept valid optional team metadata on standalone planned-change files and reject malformed team metadata through deterministic roadmap validation diagnostics.
    scenarios:
      roadmap-status-validates-planned-change-team-metadata:
        - GIVEN: a strict roadmap contains standalone planned-change files with optional team metadata
        - WHEN: strict-spec-driven roadmap-status is executed
        - THEN: valid owner, reviewer, blocked-state, label, and external-reference metadata is accepted
  cli-split-roadmap-regression-coverage:
    strength: MUST
    statement: The system MUST include copied-project regression coverage for split-file roadmap workflows, covering standalone planned-change loading, inline planned-change materialization, cross-file validation, recommendation and proposal handoff, team metadata validation, and shared roadmap index preservation.
    scenarios:
      copied-project-split-roadmap-regressions-cover-team-workflow:
        - GIVEN: a copied project fixture contains strict roadmap milestone metadata, standalone planned-change artifacts, and inline planned_changes entries where compatibility or migration behavior is required
        - WHEN: the repository roadmap regression tests execute roadmap status, sync, materialization, validation, recommendation, and proposal-handoff flows
        - THEN: the tests verify deterministic CLI behavior, preserved planned-change metadata, stable shared index output, accepted valid team metadata, rejected invalid cross-file state, and exactly-one eligible planned-change handoff
  cli-embedded-template-inspection:
    strength: MUST
    statement: The system MUST provide read-only CLI commands that list bundled template asset keys and print a selected embedded schema or scaffold template asset so agents can inspect artifact contracts without per-skill template directories.
    scenarios:
      embedded-template-listing-is-deterministic:
        - GIVEN: the strict CLI has embedded template assets available
        - WHEN: a template listing command is executed
        - THEN: the command exits zero and emits deterministic asset keys
      embedded-template-show-prints-selected-asset:
        - GIVEN: the strict CLI has an embedded schema or scaffold asset matching a requested key
        - WHEN: a template show command is executed for that key
        - THEN: the command exits zero and writes the selected asset content
  cli-skills-templates-symlink-optional:
    strength: MUST
    statement: The system MUST validate strict skill packaging without requiring every skill directory to include a templates symlink, while continuing to require executable script access for documented skill commands.
    scenarios:
      skills-without-template-symlink-validate:
        - GIVEN: a strict skill package includes valid skill metadata, SKILL.md content, and the required scripts symlink
        - WHEN: skill packaging validation runs
        - THEN: the package is not rejected solely because a templates symlink is absent
      script-symlink-remains-required:
        - GIVEN: a strict skill package is missing the scripts symlink required by documented commands
        - WHEN: skill packaging validation runs
        - THEN: the missing scripts symlink remains a validation failure
  cli-skill-yaml-rules-schema-lookup-reminder:
    strength: SHOULD
    statement: Core strict skills that supply semantic intent for strict YAML mutations SHOULD direct agents to the applicable command's machine-readable help, schema-show, and sample-show when inputs or artifact fields are unclear, while requiring the mutation itself to remain CLI-owned.
    scenarios:
      yaml-rules-route-lookup-and-mutation-safely:
        - GIVEN: A core strict skill needs to explain or perform a strict YAML mutation
        - WHEN: An agent reads the skill's YAML authoring rules
        - THEN: The rules identify CLI help, schema-show, and sample-show as supported contract lookup surfaces
        - THEN: The rules require named semantic mutation commands and do not instruct direct YAML editing
  cli-archive-rejects-added-requirement-collisions:
    strength: MUST
    statement: The system MUST block archive when a strict delta spec ADDED operation would overwrite an existing requirement in the target main spec.
    scenarios:
      added-collision-blocks-archive-before-main-spec-write:
        - GIVEN: a complete strict change contains a delta spec whose ADDED keyed map includes a requirement id already present in the target main spec
        - WHEN: '`strict-spec-driven archive <name>` is executed'
        - THEN: the command exits non-zero before rewriting the target main spec
        - AND: the active change remains in the active changes directory
        - AND: the error output identifies the duplicate ADDED requirement id and target spec
      verify-reports-added-collision:
        - GIVEN: a strict change contains a delta spec whose ADDED keyed map includes a requirement id already present in the target main spec
        - WHEN: '`strict-spec-driven verify <name>` is executed'
        - THEN: verification reports a deterministic validation diagnostic for the ADDED collision
        - AND: the diagnostic identifies the delta spec path, target spec, and requirement id
  cli-reports-deterministic-change-next-steps:
    strength: MUST
    statement: The system MUST provide CLI behavior that reports a named active change's deterministic workflow state, blocking conditions, and scriptable next-step command suggestions without inventing product or implementation decisions.
    scenarios:
      next-step-output-reports-blocking-state:
        - GIVEN: an active strict change exists with planning artifacts, tasks, questions, and delta specs
        - WHEN: the deterministic workflow-state CLI behavior is executed for that change
        - THEN: the output identifies blocking conditions such as pending tasks, open questions, missing delta specs, or validation diagnostics
        - AND: the output includes concrete command suggestions only for script-owned workflow mechanics
        - AND: the output does not decide product scope, requirement content, or user checkpoint answers
  cli-checks-proposal-readiness:
    strength: MUST
    statement: The system MUST provide deterministic proposal-readiness checks that can be run before implementation to identify missing or incomplete strict planning artifacts.
    scenarios:
      readiness-check-finds-incomplete-planning-artifacts:
        - GIVEN: a strict change has been scaffolded and partially populated
        - WHEN: proposal-readiness CLI behavior is executed for that change
        - THEN: the output reports missing proposal, design, task-list, question-list, or delta-spec structure that prevents a decision-ready handoff
        - AND: the diagnostics are deterministic and identify the affected artifact path and field or workflow condition
  cli-updates-question-state-deterministically:
    strength: MUST
    statement: The system MUST provide CLI behavior for adding, preserving, and resolving strict change questions while maintaining the question-list schema and refusing conflicting duplicate question content.
    scenarios:
      question-resolution-preserves-structured-state:
        - GIVEN: a strict change has a questions.yaml artifact with an open question
        - WHEN: the CLI resolves that question with an explicit answer
        - THEN: the question is moved or represented as resolved according to the question-list schema
        - AND: the updated artifact validates against the registered question-list schema
        - AND: conflicting duplicate question identifiers are rejected deterministically
  cli-commit-and-push-auto-commits-latest-archive:
    strength: MUST
    statement: 'The system MUST provide a commit-and-push subcommand that finds the most recently archived change by date prefix, stages all project changes with git add ., commits with message ''feat: <change-name>'', and pushes to remote.'
    scenarios:
      no-archived-changes-exits-non-zero:
        - GIVEN: no archived changes exist under .strict-spec-driven/changes/archive/
        - WHEN: strict-spec-driven commit-and-push is executed
        - THEN: the command exits non-zero and an error message indicates no archived changes were found
      latest-archive-commits-and-pushes:
        - GIVEN: one or more date-prefixed archived change directories exist
        - WHEN: strict-spec-driven commit-and-push is executed
        - THEN: 'the command resolves the latest archived change by date prefix, runs git add ., commits with ''feat: <change-name>'', and pushes to remote'
      no-changes-to-commit-exits-non-zero:
        - GIVEN: no unstaged or untracked changes exist in the working tree
        - WHEN: strict-spec-driven commit-and-push is executed
        - THEN: the command exits non-zero and an error message indicates nothing to commit
      push-failure-does-not-rollback:
        - GIVEN: git commit succeeds but git push fails
        - WHEN: strict-spec-driven commit-and-push is executed
        - THEN: the command exits non-zero with a push error and the commit is preserved in the local repository
  cli-review-command-is-removed:
    strength: MUST
    statement: The system MUST remove the deterministic review subcommand from the strict CLI lifecycle so review is not represented as a script-completed code audit.
    scenarios:
      review-command-is-not-registered:
        - GIVEN: the strict CLI command registry is inspected
        - WHEN: available lifecycle commands are enumerated
        - THEN: review is not registered as a CLI subcommand
      review-command-is-not-suggested-after-verify:
        - GIVEN: a strict change verifies without diagnostics
        - WHEN: workflow-state next-step suggestions are produced
        - THEN: the suggestions do not include strict-spec-driven review
        - AND: any review handoff is represented as skill guidance rather than a CLI command
  cli-review-auto-fixes-and-retests:
    strength: MUST
    statement: The system MUST require strict review workflow guidance to automatically fix safe in-scope review findings, rerun strict verification and the configured complete project regression after review-time code changes, and block archive recommendation or execution unless that regression evidence passes.
    scenarios:
      review-findings-are-fixed-and-retested:
        - GIVEN: a completed strict change has passed strict verification and enters review
        - WHEN: the AI review finds issues that are safe to fix within the current change scope
        - THEN: the review workflow guidance requires the AI to apply those fixes automatically
        - AND: the workflow requires strict verification and the configured complete project regression command to be rerun after the review-time code changes
        - AND: archive recommendation or execution remains blocked unless the rerun regression evidence passes
  cli-propose-scaffolds-lint-testing-task:
    strength: MUST
    statement: The system MUST scaffold new strict change tasks.yaml artifacts with an explicit lint Testing task ordered before the unit test task.
    scenarios:
      propose-scaffold-includes-lint-before-tests:
        - GIVEN: a valid kebab-case change name that does not already exist
        - WHEN: strict-spec-driven propose <name> is executed
        - THEN: the scaffolded tasks.yaml includes a run-lint task in the Testing section
        - AND: the run-lint task appears before the run-tests task
        - AND: the existing validation_task and unit_test_task testing gates continue to reference build validation and unit tests
  cli-roadmap-overview-renders-human-readable-roadmap-state:
    strength: MUST
    statement: The system MUST provide a roadmap-overview subcommand that validates strict roadmap artifacts and renders a human-readable milestone overview plus grouped planned-change detail using the same roadmap ordering and derived-status semantics as roadmap-status.
    scenarios:
      roadmap-overview-renders-milestone-summary-and-detail:
        - GIVEN: a valid strict roadmap exists under .strict-spec-driven/roadmap/
        - WHEN: strict-spec-driven roadmap-overview is executed
        - THEN: the output shows milestone rows in roadmap order and grouped planned-change detail for each milestone
      roadmap-overview-surfaces-invalid-roadmap-diagnostics:
        - GIVEN: a strict roadmap artifact violates the roadmap contract
        - WHEN: strict-spec-driven roadmap-overview is executed
        - THEN: the command exits non-zero and prints actionable diagnostics for human review
  cli-roadmap-recommend-command:
    strength: MUST
    statement: The system MUST provide a roadmap-recommend subcommand that emits a deterministic JSON recommendation including a top-level status field with values recommended, no-candidate, or roadmap-error to distinguish successful recommendation from valid-but-empty and invalid-roadmap conditions.
    scenarios:
      recommend-status-is-recommended:
        - GIVEN: strict roadmap status is valid and at least one eligible standalone planned change exists
        - WHEN: the roadmap-recommend command is executed
        - THEN: the command exits zero and the JSON output includes status with value recommended and a non-null recommendation
      recommend-status-is-no-candidate:
        - GIVEN: strict roadmap status is valid and no standalone planned change is missing with complete dependencies and no conflicts
        - WHEN: the roadmap-recommend command is executed
        - THEN: the command exits non-zero and the JSON output includes status with value no-candidate and recommendation is null
      recommend-status-is-roadmap-error:
        - GIVEN: strict roadmap status is invalid or legacy inline planned changes remain
        - WHEN: the roadmap-recommend command is executed
        - THEN: the command exits non-zero and the JSON output includes status with value roadmap-error and diagnostics are present
  cli-auto-skill-efficient-resume-guidance:
    strength: MUST
    statement: The system MUST require strict-spec-auto guidance to resume existing populated strict change scaffolds without regenerating planning artifacts, narrow context reset to current change artifacts and mapped files, and avoid rerunning an identical complete project regression command when unchanged passing evidence already satisfies the configured archive gate.
    scenarios:
      auto-resumes-populated-scaffold:
        - GIVEN: a strict change directory already contains populated proposal, design, tasks, questions, and delta spec artifacts
        - WHEN: strict-spec-auto guidance is used for that change
        - THEN: the guidance instructs the agent to resume the existing artifacts instead of running propose or generate again
        - THEN: ready or next remains available to surface blockers before implementation
      auto-uses-targeted-context-reset:
        - GIVEN: strict-spec-auto resumes or proposes a strict change
        - WHEN: the context reset step is followed
        - THEN: the guidance limits required rereads to current change artifacts, relevant main specs, mapped implementation and test files, repository status, and regression configuration when needed
      auto-reuses-unchanged-regression-evidence:
        - GIVEN: a Testing task command has passed and exactly matches the configured complete project regression command
        - GIVEN: no implementation, test, strict artifact, or configuration files relevant to the change have changed since that command passed
        - WHEN: strict-spec-auto evaluates archive readiness
        - THEN: the guidance allows that passing command result to satisfy the complete project regression evidence requirement without rerunning the identical command
        - THEN: review-time changes still require strict verification and complete project regression evidence to be refreshed
  cli-roadmap-plan-guidance-validation:
    strength: MUST
    statement: The system MUST include automated skill-content checks that fail when strict-roadmap-plan guidance omits roadmap detail elaboration or the post-sync roadmap planning review checkpoint.
    scenarios:
      validate-skills-requires-roadmap-plan-detail-guidance:
        - GIVEN: strict skill content validation inspects strict-roadmap-plan/SKILL.md
        - WHEN: the skill omits required guidance for elaborating milestone and planned-change detail
        - THEN: validate-skills reports deterministic diagnostics for the missing roadmap plan guidance
      validate-skills-requires-roadmap-plan-review-guidance:
        - GIVEN: strict skill content validation inspects strict-roadmap-plan/SKILL.md
        - WHEN: the skill omits the post-sync roadmap planning review checkpoint
        - THEN: validate-skills reports deterministic diagnostics for the missing roadmap review guidance
  cli-workflow-state-check-command:
    strength: MUST
    statement: The system MUST provide a check-workflow-state subcommand that checks whether .strict-spec-driven/ exists as a directory in the current project root and reports the result deterministically without creating or validating workflow artifacts.
    scenarios:
      workflow-state-check-succeeds-when-directory-exists:
        - GIVEN: a repository contains a .strict-spec-driven/ directory
        - WHEN: strict-spec-driven check-workflow-state is executed from that repository root
        - THEN: the command exits with status 0
        - THEN: the command reports that strict workflow state exists
      workflow-state-check-fails-when-directory-is-missing:
        - GIVEN: a repository does not contain a .strict-spec-driven/ directory
        - WHEN: strict-spec-driven check-workflow-state is executed from that repository root
        - THEN: the command exits with a non-zero status
        - THEN: the command reports that strict workflow state is missing
        - THEN: the command directs the user to run /strict-spec-init
  cli-harness-script-managed-workflow:
    strength: MUST
    statement: The system MUST provide a script-first harness workflow that validates harness declarations, generates or verifies thin project-local scripts under the scripts/harness-* namespace, manages declared environment components through those scripts, and creates, validates, and archives harness sessions as the replacement for dev-session and debug-session commands without backward-compatible command aliases.
    scenarios:
      harness-scripts-manage-selected-environment-components:
        - GIVEN: a strict project contains a valid harness declaration with development and production environments and generated project-local harness scripts
        - WHEN: an operator invokes the harness scripts with an environment and optional component selection
        - THEN: the workflow plans or runs only the selected declared components in dependency order, reports deterministic status/log evidence, enforces declared operation capabilities and safety policy, and records session evidence when a harness session is active
  cli-harness-infer-and-doctor:
    strength: MUST
    statement: The system MUST provide deterministic harness inference and doctor commands that help agents draft and repair .strict-spec-driven/harness.yaml from repository metadata without executing lifecycle commands, while preserving explicit human control over production and stateful lifecycle operations.
    scenarios:
      ai-assisted-harness-draft-is-safe:
        - GIVEN: a repository contains common project metadata such as package scripts, sample environment variable files, or service declarations
        - WHEN: an operator or AI agent runs strict-spec-driven harness-infer
        - THEN: the command emits a valid harness declaration draft that identifies likely development components, environment variable names, URLs or ports when discoverable, and manual or disabled defaults for uncertain, production, or stateful lifecycle operations
      doctor-reports-repairable-diagnostics:
        - GIVEN: a strict project contains a harness declaration and project-local wrapper expectations
        - WHEN: an operator or AI agent runs strict-spec-driven harness-doctor
        - THEN: the command reports deterministic diagnostics for missing working directories, missing script commands, wrapper drift, undeclared environment samples, schema or planning failures, and safety policy issues without starting or stopping services
  cli-harness-logs-bounded-output:
    strength: MUST
    statement: The system MUST return a conservative tail-line slice from harness-logs by default, support --tail <n> for explicit line selection, and document --all as the explicit full-output override so agents can inspect long-running managed component logs without flooding their context window.
    scenarios:
      default-tail-bound-limits-output:
        - GIVEN: a managed component has a captured log file larger than the documented default tail-line bound
        - WHEN: an operator or AI agent runs strict-spec-driven harness-logs for that component without flags
        - THEN: the command returns only the most recent lines up to the documented default bound
      explicit-tail-count-overrides-default:
        - GIVEN: a managed component has a captured log file larger than the default tail-line bound
        - WHEN: an operator or AI agent runs strict-spec-driven harness-logs --tail <n> for that component
        - THEN: the command returns the most recent requested number of lines
      all-override-returns-full-captured-log:
        - GIVEN: a managed component has a captured log file larger than the documented default tail-line bound
        - WHEN: an operator or AI agent runs strict-spec-driven harness-logs --all for that component
        - THEN: the command returns the full captured log content and the command usage or HARNESS.md documents the override
  cli-harness-status-logs-follow-runtime-model:
    strength: MUST
    statement: The system MUST have harness-plan, harness-doctor, harness-status, harness-logs, and harness-infer follow the runtime status/log model so agents are not asked to author executable status or logs commands that the lifecycle never runs.
    scenarios:
      planning-and-doctor-respect-descriptive-status-logs:
        - GIVEN: a strict project uses a harness declaration where status/logs are omitted or declared with descriptive readonly metadata
        - WHEN: an operator or AI agent runs strict-spec-driven harness-plan, harness-doctor, or harness-infer
        - THEN: planning and diagnostics do not require executable status/logs commands and the resulting behavior keeps status runtime-derived and logs sourced from the captured log file
  cli-harness-infer-detects-runtime-signals-beyond-node:
    strength: MUST
    statement: The system MUST let harness-infer detect supported non-Node runtime signals with a deterministic precedence order, preserve manual and disabled safety defaults in inferred drafts, and report explicit evidence when no lifecycle command can be inferred.
    scenarios:
      package-scripts-stay-highest-precedence:
        - GIVEN: a repository exposes both package.json dev/start/serve scripts and other supported runtime signals such as compose, Procfile, or Makefile metadata
        - WHEN: an operator or AI agent runs strict-spec-driven harness-infer
        - THEN: the draft uses the package-script-derived command and records evidence for the selected signal without mixing multiple runtime sources
      supported-non-node-signal-produces-safe-draft:
        - GIVEN: a repository lacks package dev/start/serve scripts but contains a supported compose, Procfile, or Makefile runtime signal
        - WHEN: an operator or AI agent runs strict-spec-driven harness-infer
        - THEN: the draft includes a manual development start command derived from the first supported non-Node signal, keeps production disabled, and records which signal was used
      unsupported-repository-explains-no-detection:
        - GIVEN: a repository lacks package dev/start/serve scripts and other supported runtime signals
        - WHEN: an operator or AI agent runs strict-spec-driven harness-infer
        - THEN: the draft remains manual and reports explicit evidence and an unavailable condition explaining that no lifecycle command could be inferred
  cli-harness-start-env-guidance-aligns-with-doctor:
    strength: MUST
    statement: The system MUST make harness-start missing-required-environment failures explicitly explain that harness-doctor verifies env-sample documentation only, the harness does not load .env files, and required values must be exported or sourced before retrying.
    scenarios:
      documented-env-sample-still-requires-exported-values:
        - GIVEN: a harness component requires an environment variable and that variable name is documented in an env sample file
        - WHEN: an operator or AI agent runs strict-spec-driven harness-start without exporting or sourcing that required value into the current process environment
        - THEN: harness-start fails with a diagnostic that says the variable is missing from the current environment, explains that documented env sample entries do not satisfy runtime requirements, notes that the harness does not load .env files, and tells the operator to export or source the value before retrying
  cli-harness-start-reports-partial-failure-recovery:
    strength: MUST
    statement: The system MUST make harness-start partial-start failures explicitly report which already-started components remain running and direct operators to run harness-stop for recovery while preserving those components for inspection.
    scenarios:
      later-readiness-failure-names-running-components-and-recovery:
        - GIVEN: a harness environment starts components in dependency order and a later component fails readiness after an earlier component is already running
        - WHEN: an operator or AI agent runs strict-spec-driven harness-start for that environment
        - THEN: the command fails, keeps the earlier component marked running in the component snapshot, and includes a dedicated recovery signal naming the running component together with the harness-stop cleanup instruction
  cli-harness-doctor-auto-recovery:
    strength: MUST
    statement: The system MUST support generating structured recovery actions for doctor diagnostics and executing them non-interactively using the --fix flag.
    scenarios:
      doctor-performs-non-interactive-auto-recovery:
        - GIVEN: a harness declaration contains missing local wrapper scripts or template environment configurations
        - WHEN: an operator or AI agent runs strict-spec-driven harness-doctor with the --fix flag
        - THEN: the command automatically resolves all autofixable diagnostics, regenerates missing files, and exits zero after validation succeeds
  cli-harness-doctor-flags-cross-environment-shared-ports:
    strength: MUST
    statement: The system MUST report a deterministic harness-doctor safety diagnostic when the same port is declared by components in two or more environments, identifying the shared port and the involved environments and components, without automatically rewriting ports, so that a likely cross-environment port conflict between development and production is surfaced for explicit human confirmation in the harness-init skill before the harness declaration is accepted.
    scenarios:
      cross-environment-shared-port-is-reported:
        - GIVEN: a harness declaration in which a port is declared by components in two or more environments, such as development and production
        - WHEN: an operator or AI agent runs strict-spec-driven harness-doctor
        - THEN: the command reports a deterministic safety diagnostic that identifies the shared port and the involved environments and components and offers no automatic port-rewriting recovery
      distinct-environment-ports-do-not-trigger-the-diagnostic:
        - GIVEN: a harness declaration in which every environment declares distinct port numbers
        - WHEN: an operator or AI agent runs strict-spec-driven harness-doctor
        - THEN: no cross-environment shared-port diagnostic is reported while existing same-environment duplicate-port detection is unaffected
  cli-mcp-server-contract:
    strength: MUST
    statement: The system MUST define one integrated local MCP server contract that uses stdio transport, accepts an explicit project root from MCP client configuration, and preserves the existing strict CLI and Agent Skills as authoritative workflow surfaces.
    scenarios:
      mcp-contract-defines-local-stdio-launch:
        - GIVEN: the MCP server contract is reviewed
        - WHEN: the launch and release boundary is inspected
        - THEN: the contract identifies a local stdio server entrypoint for MCP-compatible clients
        - AND: the contract requires explicit project root selection
        - AND: the contract does not define hosted HTTP transport, authentication, or multi-tenant routing for the first integration
      mcp-contract-preserves-existing-workflow-authority:
        - GIVEN: an MCP client invokes strict workflow capabilities
        - WHEN: the contract describes the relationship to existing strict workflow behavior
        - THEN: the CLI command surface, strict YAML artifacts, Agent Skills, verification, review, and archive gates remain authoritative
  cli-mcp-resource-contract:
    strength: MUST
    statement: The MCP server contract MUST define stable strict-resource URI conventions for workflow config, active and archived changes, change artifacts, specs, roadmap artifacts, tech standards, harness declaration, and selected command summaries.
    scenarios:
      mcp-contract-lists-resource-uri-families:
        - GIVEN: the MCP resource contract is reviewed
        - WHEN: resource URI templates are inspected
        - THEN: the contract includes stable URI families for config, changes, specs, roadmap, tech standards, harness declaration, and command summaries
        - AND: each URI family identifies deterministic content for valid strict workflow projects
  cli-mcp-tool-inventory-contract:
    strength: MUST
    statement: The MCP server contract MUST define a server-owned tool inventory covering read-only diagnostics and guarded mutating workflow actions with names, input schema fields, delegated CLI or domain operation, success output shape, and representative failure diagnostics.
    scenarios:
      mcp-contract-lists-read-and-mutating-tool-inventory:
        - GIVEN: the MCP tool inventory is reviewed
        - WHEN: tool entries are inspected
        - THEN: read-only diagnostics and mutating workflow actions are both represented in one inventory
        - AND: each entry identifies its delegated strict CLI or domain operation
        - AND: each entry identifies input schema fields, success output shape, and representative failure diagnostics
  cli-mcp-tool-safety-contract:
    strength: MUST
    statement: The MCP server contract MUST classify every MCP tool as read, write, lifecycle, release, or destructive and MUST describe mutation behavior so MCP hosts can present appropriate confirmation boundaries.
    scenarios:
      mcp-contract-classifies-tool-safety:
        - GIVEN: the MCP tool inventory is reviewed
        - WHEN: tool safety metadata is inspected
        - THEN: each tool has one of the read, write, lifecycle, release, or destructive safety classes
        - AND: mutating, lifecycle, release, and destructive tools describe their project-state mutation behavior
  cli-mcp-prompt-contract:
    strength: MUST
    statement: The MCP server contract MUST define MCP prompt inventory for proposal, apply or review, archive, roadmap recommendation, and harness investigation workflows, with prompt text derived from existing strict skill guidance or covered by drift tests.
    scenarios:
      mcp-contract-lists-skill-backed-prompts:
        - GIVEN: the MCP prompt contract is reviewed
        - WHEN: prompt inventory entries are inspected
        - THEN: proposal, apply or review, archive, roadmap recommendation, and harness investigation workflows are represented
        - AND: the contract requires prompt content to reuse existing strict skill guidance or be protected by drift tests
  cli-mcp-sdk-package-contract:
    strength: MUST
    statement: The MCP server contract MUST identify the official server-side MCP TypeScript SDK package as `@modelcontextprotocol/server`, record the selected initial version range as `^2.0.0-alpha.2`, and define local stdio registration in terms of `McpServer` and `StdioServerTransport` without adding the runtime dependency in the contract-only change.
    scenarios:
      mcp-contract-pins-sdk-package-and-version-range:
        - GIVEN: the MCP server contract is reviewed before runtime implementation
        - WHEN: SDK package and transport guidance are inspected
        - THEN: the contract identifies `@modelcontextprotocol/server` as the server-side MCP TypeScript SDK package
        - AND: the contract records `^2.0.0-alpha.2` as the selected initial version range
        - AND: the contract names `McpServer` and `StdioServerTransport` as the local stdio server registration APIs
  cli-mcp-entrypoint-build-output:
    strength: MUST
    statement: The system MUST build a dedicated local MCP server entrypoint at `dist/scripts/strict-spec-driven-mcp.js` without removing or renaming the existing strict CLI bundle.
    scenarios:
      mcp-build-emits-dedicated-entrypoint:
        - GIVEN: the repository build command is executed
        - WHEN: build output under dist/scripts is inspected
        - THEN: '`strict-spec-driven-mcp.js` exists as a Node-executable bundled server entrypoint'
        - AND: the existing `strict-spec-driven.js` CLI bundle remains available
  cli-mcp-entrypoint-project-root:
    strength: MUST
    statement: The MCP server entrypoint MUST require an explicit `--project <path>` argument, resolve it to a directory, and reject missing or non-directory project roots before connecting the stdio transport.
    scenarios:
      mcp-entrypoint-rejects-missing-project-root:
        - GIVEN: an MCP client or operator starts the server without `--project`
        - WHEN: the entrypoint validates startup arguments
        - THEN: startup fails before stdio transport connection
        - AND: stderr reports that `--project <path>` is required
      mcp-entrypoint-rejects-invalid-project-root:
        - GIVEN: an MCP client or operator starts the server with `--project` pointing at a missing path or file
        - WHEN: the entrypoint validates startup arguments
        - THEN: startup fails before stdio transport connection
        - AND: stderr identifies the invalid project root
  cli-mcp-entrypoint-stdio-server:
    strength: MUST
    statement: The MCP server entrypoint MUST create an SDK `McpServer` using strict-spec-driven server metadata, connect it with `StdioServerTransport`, and expose startup code that tests can exercise without a real MCP host.
    scenarios:
      mcp-entrypoint-creates-stdio-server:
        - GIVEN: a valid project root is supplied
        - WHEN: the entrypoint constructs the MCP server
        - THEN: the server metadata identifies strict-spec-driven and the package version
        - AND: the stdio transport connection path is available for the process entrypoint
  cli-mcp-inventory-foundation:
    strength: MUST
    statement: The MCP server entrypoint MUST load server metadata and initial capability registration from a server-owned MCP inventory module so later resources, tools, and prompts can extend one registry.
    scenarios:
      mcp-entrypoint-uses-inventory-module:
        - GIVEN: the MCP server factory is exercised in tests
        - WHEN: inventory-backed registration runs
        - THEN: server metadata comes from the MCP inventory
        - AND: the initial inventory contains no workflow resources, tools, or prompts before their planned changes implement them
  cli-mcp-sdk-runtime-dependency:
    strength: MUST
    statement: The package MUST include the official `@modelcontextprotocol/server` runtime dependency at the selected `^2.0.0-alpha.2` range when the MCP entrypoint is implemented.
    scenarios:
      mcp-entrypoint-declares-sdk-dependency:
        - GIVEN: package metadata is inspected after the entrypoint change
        - WHEN: dependencies are reviewed
        - THEN: '`@modelcontextprotocol/server` is declared with version range `^2.0.0-alpha.2`'
  cli-mcp-read-tool-inventory:
    strength: MUST
    statement: The MCP server MUST expose a read-only tool inventory for strict workflow diagnostics, change guidance, verification, roadmap status and recommendation, tech status, harness plan, harness status, and bounded harness logs.
    scenarios:
      mcp-read-tools-are-discoverable:
        - GIVEN: the MCP server registers its tool inventory
        - WHEN: read-only tool definitions are inspected
        - THEN: the expected workflow, change, roadmap, tech, and harness diagnostic tools are present
        - AND: every read-only tool reports safety class read
  cli-mcp-read-tool-delegation:
    strength: MUST
    statement: Each read-only MCP tool MUST delegate to the existing strict CLI command surface under the configured project root instead of reimplementing strict workflow behavior.
    scenarios:
      mcp-read-tools-delegate-to-strict-cli:
        - GIVEN: a read-only MCP tool is called with valid typed arguments
        - WHEN: the tool handler runs
        - THEN: it invokes the mapped strict CLI command with repo-relative arguments
        - AND: it uses the MCP server project root as the command working directory
  cli-mcp-read-tool-output-envelope:
    strength: MUST
    statement: Read-only MCP tools MUST return a deterministic JSON text envelope containing command name, exit status, stdout, stderr, parsed JSON when stdout is parseable, and safety metadata.
    scenarios:
      mcp-read-tool-wraps-success-and-failure:
        - GIVEN: a delegated strict command succeeds or fails
        - WHEN: the MCP tool handler formats the result
        - THEN: the returned text is parseable JSON
        - AND: the JSON includes command, status, stdout, stderr, safety, and parsedJson fields
  cli-mcp-read-tools-do-not-mutate:
    strength: MUST
    statement: Read-only MCP tool calls MUST NOT mutate repository files and tests MUST prove representative read tool calls preserve the workspace diff.
    scenarios:
      mcp-read-tool-preserves-workspace-diff:
        - GIVEN: a strict workflow project has a captured workspace diff
        - WHEN: representative read-only MCP tools are called
        - THEN: the workspace diff after the calls matches the captured diff
  cli-mcp-mutating-tool-inventory:
    strength: MUST
    statement: The MCP server MUST expose guarded mutating tools for init, proposal creation, artifact generation, task-state completion, roadmap sync, archive, harness lifecycle, and harness session creation with explicit safety and mutation metadata.
    scenarios:
      mcp-mutating-tools-are-discoverable:
        - GIVEN: the MCP tool inventory is inspected
        - WHEN: mutating tool definitions are enumerated
        - THEN: init, propose, generate, apply-backed task completion, roadmap sync, archive, harness lifecycle, and harness session creation tools are present
        - THEN: each mutating tool reports mutates true and a conservative safety class
  cli-mcp-mutating-tool-delegation:
    strength: MUST
    statement: Each mutating MCP tool MUST delegate to the existing strict CLI command surface under the configured project root and MUST preserve strict CLI preconditions and failure diagnostics.
    scenarios:
      mcp-mutating-tools-delegate-to-existing-cli:
        - GIVEN: a mutating MCP tool is called with valid typed arguments
        - WHEN: the tool handler runs
        - THEN: it invokes the mapped strict CLI command in the MCP server project root
        - THEN: success and failure results preserve the delegated command exit status, stdout, and stderr
  cli-mcp-mutating-tool-input-validation:
    strength: MUST
    statement: Mutating MCP tools MUST use typed input schemas and reject invalid inputs before invoking delegated strict CLI commands.
    scenarios:
      mcp-mutating-tools-reject-invalid-input-before-delegation:
        - GIVEN: a mutating MCP tool is called with invalid input
        - WHEN: the MCP SDK validates the registered input schema
        - THEN: the tool call is rejected before the strict CLI delegate runs
        - AND: no project mutation is attempted by the MCP handler
  cli-mcp-mutating-tool-safety-boundaries:
    strength: MUST
    statement: Mutating MCP tool descriptions and envelopes MUST make project-state mutation explicit, including write, lifecycle, and release safety classes, and the apply-backed tool MUST be worded as task-state completion rather than implementation work.
    scenarios:
      mcp-mutating-tools-report-confirmation-metadata:
        - GIVEN: MCP clients inspect mutating tool metadata and call results
        - WHEN: mutating tools are registered or executed
        - THEN: descriptions identify project-state mutation or lifecycle effects
        - AND: returned envelopes include the tool safety class and mutates true
        - AND: the apply-backed tool is named and described as marking the next task complete
  cli-mcp-resource-inventory:
    strength: MUST
    statement: The MCP server MUST expose bounded strict workflow resources for config, workflow state, changes, change artifacts, specs, roadmap, tech standards, and harness declaration using stable strict:// URI conventions.
    scenarios:
      mcp-resources-are-discoverable:
        - GIVEN: the MCP resource inventory is inspected
        - WHEN: resource definitions are enumerated
        - THEN: the expected strict workflow resource URIs and URI templates are present
        - THEN: resources are listed in stable order
  cli-mcp-resource-reading:
    strength: MUST
    statement: MCP resource reads MUST return deterministic text content for valid strict workflow artifacts and generated strict summaries.
    scenarios:
      mcp-resources-return-deterministic-content:
        - GIVEN: a valid strict workflow project
        - WHEN: a known MCP resource URI is read
        - THEN: the returned content includes the requested URI and deterministic text
        - AND: repeated reads of the same resource produce stable content
  cli-mcp-resource-bounds:
    strength: MUST
    statement: MCP resource reads MUST reject unknown identifiers, missing artifacts, and parent-directory traversal before exposing project files.
    scenarios:
      mcp-resources-reject-unbounded-file-access:
        - GIVEN: a resource URI contains an unknown identifier or traversal segment
        - WHEN: the MCP resource reader resolves the URI
        - THEN: the read fails with a deterministic diagnostic
        - AND: no arbitrary repository file is exposed
  cli-mcp-prompt-inventory:
    strength: MUST
    statement: The MCP server MUST expose stable prompt inventory entries for strict proposal, application, review, archive, roadmap recommendation, and harness investigation workflows, including typed argument schemas and user-facing descriptions.
    scenarios:
      mcp-prompts-are-discoverable:
        - GIVEN: the MCP server prompt inventory is inspected
        - WHEN: prompt entries are enumerated
        - THEN: strict_propose_change, strict_apply_change, strict_review_change, strict_archive_change, strict_roadmap_recommend, and strict_harness_investigation are present
        - AND: each prompt declares its expected typed arguments and description
  cli-mcp-prompt-rendering:
    strength: MUST
    statement: MCP prompts MUST render deterministic user messages derived from existing strict skill workflow guidance and MUST preserve strict verification, review, archive, and safety boundaries.
    scenarios:
      mcp-prompts-render-skill-backed-guidance:
        - GIVEN: an MCP client requests a strict workflow prompt
        - WHEN: the prompt is rendered with valid arguments
        - THEN: the returned prompt message references the relevant strict workflow command or skill guidance
        - AND: the message preserves strict verification, code review, archive, and mutating-tool confirmation expectations
  cli-mcp-user-documentation:
    strength: MUST
    statement: User documentation MUST describe local MCP server configuration, explicit project-root launch arguments, representative resources, tools, prompts, read-only requests, and mutating confirmation boundaries.
    scenarios:
      mcp-docs-cover-local-client-setup:
        - GIVEN: a user reads the MCP documentation
        - WHEN: setup and usage examples are inspected
        - THEN: the docs include a local stdio MCP client JSON configuration
        - AND: the docs include read-only status, resource, prompt, and guarded mutating workflow examples
  cli-mcp-protocol-regression:
    strength: MUST
    statement: The regression suite MUST cover MCP protocol smoke flows for listing tools, calling tools, listing resources, reading resources, listing prompts, getting prompts, built-output launch availability, and prompt drift against strict skill guidance.
    scenarios:
      mcp-protocol-smoke-coverage-exists:
        - GIVEN: the project test suite is executed after build
        - WHEN: MCP server regression tests run
        - THEN: tools/list, tools/call, resources/list, resources/read, prompts/list, and prompts/get are exercised through the MCP protocol
        - AND: built-output launch and skill-prompt drift checks are covered
  cli-mcp-mutating-tool-confirmation:
    strength: MUST
    statement: Mutating MCP tools MUST require an explicit confirm flag at the server boundary and MUST refuse the call with a confirmation diagnostic, without invoking the delegated strict CLI command, when confirm is not true.
    scenarios:
      mcp-mutating-tool-refuses-without-confirmation:
        - GIVEN: a mutating MCP tool is called with valid typed arguments but without confirm set to true
        - WHEN: the MCP server processes the call
        - THEN: the server returns a confirmation-required diagnostic and does not invoke the delegated strict CLI command
      mcp-mutating-tool-proceeds-with-confirmation:
        - GIVEN: a mutating MCP tool is called with valid typed arguments and confirm set to true
        - WHEN: the MCP server processes the call
        - THEN: the delegated strict CLI command runs under the configured project root
        - AND: the confirm flag is forwarded to the CLI only for harness lifecycle commands
  cli-mcp-tool-error-signaling:
    strength: MUST
    statement: MCP tool results MUST set the protocol isError flag when input validation fails, a required confirmation is missing, or the delegated strict CLI command exits non-zero, while still returning the deterministic JSON envelope as the result content.
    scenarios:
      mcp-tool-failure-sets-protocol-error:
        - GIVEN: an MCP tool call fails input validation, lacks required confirmation, or its delegated command exits non-zero
        - WHEN: the MCP server formats the tool result
        - THEN: the result is marked as a protocol error and still contains the JSON envelope reporting command, status, stdout, stderr, and safety
  cli-mcp-destructive-tool:
    strength: MUST
    statement: The MCP server MUST expose the change cancellation command as a destructive mutating tool classified with safety destructive and mutates true that requires confirmation and delegates to the strict cancel CLI command under the configured project root.
    scenarios:
      mcp-exposes-destructive-cancel-tool:
        - GIVEN: the MCP mutating tool inventory is inspected
        - WHEN: the cancellation tool definition is examined
        - THEN: it reports safety destructive with mutates true, requires confirmation, and delegates to the strict cancel command
  cli-mcp-resource-template-enumeration:
    strength: MUST
    statement: MCP template resources MUST provide list callbacks so that existing strict changes, specs, roadmap milestones, roadmap planned changes, and tech standards are enumerable through the MCP resources listing as concrete strict:// URIs.
    scenarios:
      mcp-template-resources-are-enumerable:
        - GIVEN: a strict workflow project contains changes, specs, roadmap, and tech artifacts
        - WHEN: the MCP client lists resources
        - THEN: the listing includes concrete strict:// URIs for the existing change, spec, roadmap, and tech artifacts derived from template resources
  cli-mcp-install-command-surface:
    strength: MUST
    statement: The system MUST provide an mcp-install strict CLI subcommand, registered in canonical command order, that registers the built strict-spec-driven MCP server into selected MCP clients.
    scenarios:
      mcp-install-is-a-registered-subcommand:
        - GIVEN: the strict CLI command listing is inspected
        - WHEN: registered subcommands are enumerated
        - THEN: mcp-install appears in canonical command order alongside the existing strict CLI commands
      mcp-install-registers-the-server:
        - GIVEN: a supported client and a valid project root are provided
        - WHEN: mcp-install runs to completion
        - THEN: the strict-spec-driven MCP server is registered for that client
        - AND: the command reports the client, scope, entry name, and resolved entrypoint path it registered
  cli-mcp-install-builds-and-resolves-entrypoint:
    strength: MUST
    statement: The mcp-install command MUST build the project before registration and resolve the absolute dist MCP server entrypoint path together with a project root that defaults to the current directory.
    scenarios:
      mcp-install-builds-before-registering:
        - GIVEN: mcp-install is invoked
        - WHEN: registration begins
        - THEN: the project build runs first so the dist MCP server entrypoint exists
        - AND: the registered server command uses the absolute resolved entrypoint path
      mcp-install-defaults-project-root-to-cwd:
        - GIVEN: mcp-install is invoked without an explicit project root
        - WHEN: the project root is resolved
        - THEN: the current working directory is used as the registered --project value
  cli-mcp-install-client-selection:
    strength: MUST
    statement: The mcp-install command MUST accept a client selector covering claude-code, codex, opencode, copilot, and a generic json target, delegating to an official client CLI where one exists and writing the client config file directly otherwise.
    scenarios:
      mcp-install-supports-each-client:
        - GIVEN: the mcp-install client selector is inspected
        - WHEN: the accepted client values are enumerated
        - THEN: claude-code, codex, opencode, copilot, and json are accepted client targets
      mcp-install-rejects-unknown-client:
        - GIVEN: mcp-install is invoked with an unsupported client value
        - WHEN: the client selector is validated
        - THEN: the command fails with a diagnostic naming the supported client values
        - AND: no client configuration is modified
  cli-mcp-install-multi-client:
    strength: MUST
    statement: The mcp-install command MUST accept a repeatable client selection and an all value, registering each selected client and reporting a per-client result.
    scenarios:
      mcp-install-targets-multiple-clients:
        - GIVEN: mcp-install is invoked with more than one selected client or the all value
        - WHEN: registration runs
        - THEN: each selected client is registered
        - AND: the command reports an individual result for each client
  cli-mcp-install-missing-cli-skips:
    strength: MUST
    statement: When a selected client requires an official client CLI that is not available, the mcp-install command MUST skip that client with a diagnostic instructing installation of the CLI and MUST NOT write that client's configuration directly.
    scenarios:
      mcp-install-skips-client-without-cli:
        - GIVEN: a CLI-backed client is selected but its official CLI is unavailable
        - WHEN: mcp-install attempts to register that client
        - THEN: that client is reported as skipped with a diagnostic to install its CLI
        - AND: that client's configuration is not modified
  cli-mcp-install-native-format-idempotent:
    strength: MUST
    statement: The mcp-install command MUST register each file-written client entry in that client's native configuration format and merge idempotently, preserving unrelated existing entries and never duplicating the registered entry on repeated runs.
    scenarios:
      mcp-install-preserves-existing-entries:
        - GIVEN: a target client config already contains unrelated server entries
        - WHEN: mcp-install registers the strict-spec-driven server
        - THEN: the unrelated entries remain unchanged
        - AND: the registered entry is present in the client's native format
      mcp-install-is-idempotent:
        - GIVEN: mcp-install has already registered the server for a file-written client
        - WHEN: mcp-install runs again for the same client, scope, and entry name
        - THEN: the client config still contains exactly one entry for that name
  cli-mcp-install-entry-name:
    strength: MUST
    statement: The mcp-install command MUST default the registered MCP server entry name to strict-spec-driven and MUST allow overriding it through a name argument so distinct project roots can register into one client.
    scenarios:
      mcp-install-defaults-entry-name:
        - GIVEN: mcp-install is invoked without a name override
        - WHEN: the server entry is registered
        - THEN: the entry name strict-spec-driven is used
      mcp-install-honors-name-override:
        - GIVEN: mcp-install is invoked with a name override
        - WHEN: the server entry is registered
        - THEN: the overridden name is used as the entry name and idempotency key
  cli-mcp-install-scope-selection:
    strength: MUST
    statement: The mcp-install command MUST accept a scope selector for project and user scopes, defaulting to project scope when none is supplied.
    scenarios:
      mcp-install-defaults-to-project-scope:
        - GIVEN: mcp-install is invoked without a scope selector
        - WHEN: the registration scope is resolved
        - THEN: project scope is used
      mcp-install-honors-user-scope:
        - GIVEN: mcp-install is invoked with the user scope selector
        - WHEN: the registration scope is resolved
        - THEN: the user-level client configuration target is used instead of the project-level target
  init-skill-generates-agents-md-when-missing:
    strength: MUST
    statement: The strict-spec-init skill prompt MUST instruct the agent to generate an AGENTS.md describing the project when the target project has none, and MUST instruct it not to overwrite an existing AGENTS.md; strict skill packaging validation MUST enforce that this guidance is present in the init skill prompt.
    scenarios:
      init-skill-prompt-carries-agents-md-guidance:
        - GIVEN: the packaged strict-spec-init skill prompt is inspected by strict skill packaging validation
        - WHEN: validate-skills runs against the strict skill packages
        - THEN: validation passes and the strict-spec-init prompt contains the AGENTS.md generation and non-overwrite guidance
  cli-review-surfaces-uncaptured-tech-conventions:
    strength: MUST
    statement: The system MUST require strict review workflow guidance in both strict-spec-review and strict-spec-auto to perform an early non-blocking reflection on whether the reviewed change established a reusable engineering convention absent from .strict-spec-driven/tech/, offer immediate delta-tech capture or deferral only to the mandatory final current-change tech sync before archive, and prevent a convention confirmed as reusable from being deferred until after the change is archived.
    scenarios:
      review-prompts-early-tech-convention-reflection:
        - GIVEN: a completed strict change has passed strict verification and enters standalone or automatic review guidance
        - WHEN: the AI reviews the changed implementation, tests, strict artifacts, and applicable technical standards
        - THEN: the guidance requires an early reflection on uncaptured reusable engineering conventions and offers current-change delta-tech capture before archive
      review-deferral-reaches-final-archive-gate:
        - GIVEN: the review reflection surfaces a possible reusable convention that is not captured during review
        - WHEN: review otherwise completes successfully
        - THEN: review may continue without treating the reflection itself as a correctness blocker, but the convention decision is deferred only to the mandatory final current-change tech sync before archive rather than to a post-archive standalone sync
      review-no-finding-remains-non-blocking:
        - GIVEN: the early review reflection finds no uncaptured reusable convention
        - WHEN: review concludes
        - THEN: the reflection adds no review blocker and the final archive workflow still performs its bounded current-change sync checkpoint
  cli-roadmap-review-skill-packaging-validation:
    strength: MUST
    statement: The system MUST validate the strict-roadmap-review skill package through validate-skills, enforcing guidance that reviews every roadmap milestone whose status is not complete, applies direct YAML definition fixes, elaborates planned-change detail, checks milestone intake_questions for answer evidence in milestone fields and owned planned-change details, keeps completed milestones out of scope as historical record, and reports deterministic path-specific diagnostics when required review guidance is missing.
    scenarios:
      validate-skills-requires-roadmap-review-intake-answer-guidance:
        - GIVEN: the strict-roadmap-review package is inspected by validate-skills
        - WHEN: the package omits guidance to check milestone intake_questions for answer evidence
        - THEN: validation rejects the package with a deterministic required-snippet diagnostic
      roadmap-review-skill-documents-intake-answer-review:
        - GIVEN: an operator invokes strict-roadmap-review and at least one milestone is incomplete
        - WHEN: the skill prompt is followed
        - THEN: the agent inspects intake questions, uses milestone planning fields and owned planned-change details as evidence, applies safe fixes, and surfaces unresolved human decisions
  cli-shared-schema-cache-sync-on-startup:
    strength: MUST
    statement: The system MUST synchronize a shared schema cache during strict-spec-driven CLI command and MCP startup, resolving the cache root from the STRICT_SPEC_SCHEMA_CACHE_DIR environment variable when it is set and non-empty and from ~/.strict-spec-schemas/ otherwise; it MUST export the bundled strict schema assets plus a manifest when the cache is missing, records a different export version, or contains any cached schema file that is missing or differs from its bundled content; it MUST perform the refresh by building the new schema tree aside and swapping it into place with renames so concurrent readers never observe a partially written schemas directory; it MUST skip rewriting when the recorded version matches and all cached contents are intact; it MUST NOT synchronize the cache for CLI help requests; and when synchronization fails it MUST continue startup using bundled schemas and emit a warning that names the resolved cache path.
    scenarios:
      cli-startup-populates-shared-schema-cache:
        - GIVEN: the bundled strict schema assets are available and the resolved cache root is missing
        - WHEN: a strict-spec-driven CLI command starts
        - THEN: the shared cache is created under <cache-root>/templates/strict-spec-driven/schemas/ together with a manifest describing the exported schema version and exported schema files
      env-override-redirects-cache-root:
        - GIVEN: STRICT_SPEC_SCHEMA_CACHE_DIR is set to a writable directory
        - WHEN: a strict-spec-driven CLI or MCP process starts
        - THEN: the shared schema cache and manifest are written under that directory
        - AND: no ~/.strict-spec-schemas/ directory is created in the user's home directory
      unchanged-version-skips-cache-rewrite:
        - GIVEN: the resolved cache root already contains a manifest whose export version matches the current bundled schema export version and every cached schema file matches its bundled content
        - WHEN: a strict-spec-driven CLI or MCP process starts
        - THEN: the process skips rewriting unchanged shared schema files
      changed-version-refreshes-shared-cache:
        - GIVEN: the resolved cache root is missing, corrupted, or records a different export version than the current bundled schema export version
        - WHEN: a strict-spec-driven CLI or MCP process starts
        - THEN: the process rewrites the shared schema cache from the current bundled schema assets
      corrupted-cache-content-self-heals:
        - GIVEN: the manifest export version matches but a cached schema file was edited or corrupted on disk
        - WHEN: a strict-spec-driven CLI or MCP process starts
        - THEN: the process detects the content mismatch and rewrites the shared schema cache from the current bundled schema assets
      refresh-swaps-directories-atomically:
        - GIVEN: a cache refresh is required
        - WHEN: the shared schema cache synchronizes
        - THEN: the new schema tree is fully written to a temporary sibling directory before being swapped into place with renames
        - AND: the manifest is replaced through a temp-file-plus-rename write after the schema tree swap
      help-request-skips-cache-sync:
        - GIVEN: the resolved cache root is missing
        - WHEN: the strict-spec-driven CLI runs with --help or -h
        - THEN: usage is printed without creating or writing the shared schema cache
      cache-write-failure-warns-without-blocking-startup:
        - GIVEN: the current process cannot write the resolved cache root
        - WHEN: a strict-spec-driven CLI or MCP process starts
        - THEN: the command or MCP startup continues using bundled schemas
        - AND: an explicit warning reports that the shared schema cache could not be synchronized and names the resolved cache path
  cli-skills-remind-shared-schema-cache-location:
    strength: MUST
    statement: Core strict skills that supply semantic inputs for strict YAML operations MUST identify the shared schema cache root and schema_file lookup behavior for contract inspection, while making clear that cached schema access is read-only guidance and artifact mutation remains owned by the applicable CLI command.
    scenarios:
      validate-skills-requires-read-only-cache-guidance:
        - GIVEN: A core strict skill supplies semantic inputs for strict YAML operations
        - WHEN: Skill packaging validation inspects the prompt
        - THEN: The prompt explains shared cache and schema_file lookup for read-only inspection
        - THEN: The prompt routes every supported repository-owned YAML mutation through artifact-aware CLI commands
  cli-propose-roadmap-backed-guidance:
    strength: MUST
    statement: The system MUST let strict-spec-propose guidance enter a roadmap-backed proposal mode that obtains the next eligible standalone planned change through roadmap-recommend before proposal scaffolding, reads only the targeted roadmap context for the selected planned change, and still stops at proposal validation instead of auto-implementing the change.
    scenarios:
      roadmap-backed-propose-uses-scripted-recommendation:
        - GIVEN: a user requests roadmap-backed proposal flow through strict-spec-propose
        - WHEN: the skill guidance is followed
        - THEN: the guidance requires roadmap-recommend as the authoritative selector, scaffolds exactly one recommended planned change as a normal strict proposal with milestone and planned_change links, and hands off after ready and verify
  cli-propose-mcp-roadmap-backed-prompt:
    strength: MUST
    statement: The system MUST expose roadmap-backed proposal mode through the strict_propose_change MCP prompt with an optional roadmapItem argument and prompt text that switches from generic proposal guidance to roadmap-recommend-first guidance when that argument is supplied.
    scenarios:
      roadmap-backed-propose-prompt-renders-roadmap-guidance:
        - GIVEN: an MCP client requests strict_propose_change with roadmapItem input
        - WHEN: the prompt inventory and rendered message are inspected
        - THEN: the inventory declares the optional roadmapItem argument and the rendered prompt instructs the agent to use roadmap-recommend while keeping the workflow in proposal stage
  config-preferred-human-language:
    strength: MUST
    statement: The workflow config contract MUST support an optional top-level preferred_human_language string that records the user's common human language, scaffolded configs MUST default it to English, and initialization guidance MUST tell AI agents to treat it as a human-language preference rather than a programming language.
    scenarios:
      scaffold-defaults-to-english:
        - GIVEN: a project is initialized from the bundled strict scaffold
        - WHEN: the generated .strict-spec-driven/config.yaml is read
        - THEN: preferred_human_language is present with the value English
      init-guidance-reminds-human-language:
        - GIVEN: an agent follows the strict-spec-init skill
        - WHEN: it drafts or updates .strict-spec-driven/config.yaml
        - THEN: the guidance tells the agent to preserve or set preferred_human_language and reminds it this field is for the user's human language, not computer languages
  all-skills-preferred-human-language-guidance:
    strength: MUST
    statement: Every bundled strict skill MUST carry a Preferred Human Language section whose guidance names `.strict-spec-driven/config.yaml`, the `preferred_human_language` field, the fact that it records the user's common human language rather than a programming language, and the requirement to comply with it for user-facing natural-language interaction unless the active user instruction says otherwise; that guidance MUST be stated once as a single sentence rather than a restated paragraph, skill packaging validation MUST report a diagnostic naming the offending skill when any of those elements is absent, and the single-sentence check MUST NOT count an ordinary prose abbreviation as a sentence end.
    scenarios:
      every-skill-states-the-guidance-in-one-sentence:
        - GIVEN: the bundled strict skill directory
        - WHEN: skill packaging validation inspects each SKILL.md
        - THEN: every skill's Preferred Human Language section names .strict-spec-driven/config.yaml, preferred_human_language, the human-language rather than programming-language distinction, and the compliance requirement, in a single sentence
      validation-reports-a-skill-missing-an-element:
        - GIVEN: a bundled strict skill whose Preferred Human Language section omits one of the required elements
        - WHEN: the strict skill validation command runs
        - THEN: the command exits non-zero and reports a diagnostic naming the offending skill path and the missing element
      every-skill-requires-compliance:
        - GIVEN: an agent follows any bundled strict skill
        - WHEN: the skill describes preferred human language handling
        - THEN: the guidance requires complying with the configured common human language and distinguishes it from programming languages
      an-abbreviation-does-not-end-a-sentence:
        - GIVEN: a bundled strict skill whose Preferred Human Language guidance is one sentence containing an ordinary prose abbreviation such as e.g. or i.e.
        - WHEN: the strict skill validation command runs
        - THEN: the command reports no single-sentence diagnostic for that skill
      a-second-sentence-is-still-reported:
        - GIVEN: a bundled strict skill whose Preferred Human Language section states the guidance and then adds a second sentence
        - WHEN: the strict skill validation command runs
        - THEN: the command exits non-zero and reports the single-sentence diagnostic naming that skill path
  cli-roadmap-archive-command-and-skill:
    strength: MUST
    statement: The system MUST expose roadmap-archive as a canonical strict CLI subcommand with help and usage handling, and MUST package the roadmap state-transition skill's archive operation with a documented command mapping that matches the bundled CLI command.
    scenarios:
      cli-lists-roadmap-archive:
        - GIVEN: the strict CLI command table is inspected or root help is rendered
        - WHEN: available commands are listed
        - THEN: roadmap-archive is included as a canonical command
      roadmap-archive-help-and-usage:
        - GIVEN: the roadmap-archive command is invoked with --help or invalid extra arguments
        - WHEN: the command router handles the invocation
        - THEN: help exits zero with command usage and invalid arguments exit non-zero with usage
      transition-skill-documents-roadmap-archive:
        - GIVEN: skill packaging validation reads bundled strict skills
        - WHEN: validate-skills runs
        - THEN: the bundled roadmap state-transition skill is validated with a roadmap-archive command mapping and the required roadmap archive guidance
      no-standalone-archive-skill-is-required:
        - GIVEN: the bundled skill set contains no skill package named strict-roadmap-archive
        - WHEN: validate-skills runs
        - THEN: validation reports no diagnostic about a missing strict-roadmap-archive package, because the archive operation's mapping and guidance are carried by the roadmap state-transition skill
  cli-roadmap-generate-milestone-command:
    strength: MUST
    statement: The system MUST expose a roadmap-generate milestone CLI command with help and usage handling, named-argument validation, deterministic diagnostics, safe milestone create or update behavior, and no mutation when required arguments are missing, invalid, or conflicting with existing milestone artifact content.
    scenarios:
      roadmap-generate-milestone-validates-before-write:
        - GIVEN: a strict workflow project has existing roadmap state
        - WHEN: strict-spec-driven roadmap-generate milestone is invoked with missing, invalid, or conflicting named arguments
        - THEN: the command exits non-zero, prints usage or deterministic diagnostics, and leaves existing roadmap artifacts unchanged
  cli-roadmap-skills-use-milestone-authoring-command:
    strength: MUST
    statement: The system MUST require strict roadmap planning and review skill guidance to route milestone and standalone planned-change creation and field-level modification through roadmap-generate with named semantic arguments, preserving roadmap artifacts as canonical planning state without a direct YAML editing path.
    scenarios:
      roadmap-skills-route-all-roadmap-shape-through-cli:
        - GIVEN: Strict roadmap planning or review guidance needs to create or modify a milestone or standalone planned change
        - WHEN: The bundled skill guidance is inspected
        - THEN: The guidance invokes roadmap-generate for the matching artifact kind and names only semantic fields
        - THEN: The guidance does not instruct the agent to write roadmap YAML directly
  cli-validate-skills-enforces-detailed-proposal-checkpoint:
    strength: MUST
    statement: The system MUST validate bundled proposal-generating and proposal-handoff skill packages through validate-skills, enforcing guidance that the proposal checkpoint checks change documents for decision-ready detail while preserving the planning-stage name proposal checkpoint and rejecting stale guidance that calls the gate proposal review.
    scenarios:
      validate-skills-requires-detailed-checkpoint-guidance:
        - GIVEN: validate-skills inspects bundled proposal-generating and proposal-handoff skill packages
        - WHEN: a required skill omits concrete decision-ready proposal checkpoint criteria for change planning artifacts
        - THEN: validate-skills reports deterministic path-specific diagnostics for the missing checkpoint detail guidance
      validate-skills-rejects-proposal-review-wording:
        - GIVEN: validate-skills inspects bundled proposal-generating and proposal-handoff skill packages
        - WHEN: a required skill names the planning-stage gate proposal review or points agents to a strict-spec-driven review command
        - THEN: validate-skills reports deterministic diagnostics that preserve proposal checkpoint as the planning-stage terminology
  cli-bugfix-skill-packaging-validation:
    strength: MUST
    statement: The system MUST package a strict-spec-bugfix skill and validate that its guidance is limited to known bugs with reproduction evidence, regression coverage, minimal fixes, strict verification, direct review, and handoff to strict-spec-brainstorm when an issue is unclear or unreproduced.
    scenarios:
      validate-skills-requires-bugfix-boundaries:
        - GIVEN: validate-skills inspects the bundled strict-spec-bugfix skill
        - WHEN: the skill omits known-bug, reproduce-before-fixing, failing-regression, minimal-fix, or unclear-issue handoff guidance
        - THEN: validate-skills reports deterministic diagnostics for the missing bugfix guidance
      bugfix-skill-documents-narrow-fix-workflow:
        - GIVEN: an agent follows the strict-spec-bugfix skill for a known defect
        - WHEN: the workflow creates or resumes a strict change
        - THEN: the skill requires narrow strict artifacts, a regression-oriented task flow, strict verification, direct review, and complete regression evidence before archive
      handoff-target-is-a-packaged-skill:
        - GIVEN: the strict-spec-bugfix skill names the skill it hands an unclear or unreproduced issue to
        - WHEN: validate-skills inspects the bundled skill set
        - THEN: the named handoff target is a skill package that exists under skills/, so the routing guidance cannot name a retired workflow
  cli-installer-compiles-native-executable:
    strength: MUST
    statement: The system MUST install the strict-spec-driven command through npm global bin via npm install -g . when npm is available and the global prefix is writable, and MUST fall back to compiling a native strict-spec-driven executable with Bun only when npm is unavailable or the npm-global install fails on permissions, for both Unix and Windows installer flows.
    scenarios:
      unix-installer-prefers-npm-global:
        - GIVEN: the Unix installer is run on a supported host with Bun and npm available and a writable npm global prefix
        - WHEN: installation prepares the strict-spec-driven command
        - THEN: the installer builds the dist bundle and runs npm install -g .
        - AND: the strict-spec-driven command is installed into the npm global bin directory
      unix-installer-compiles-native-command:
        - GIVEN: the Unix installer is run on a supported host with Bun available but npm is not on PATH or the npm-global install failed on permissions
        - WHEN: installation prepares the strict-spec-driven command
        - THEN: the installer invokes Bun executable compilation for the strict CLI entrypoint
        - AND: installs the resulting native executable for the strict-spec-driven command
      windows-installer-prefers-npm-global:
        - GIVEN: the Windows PowerShell installer is run on a supported Windows host with Bun and npm available
        - WHEN: installation prepares the strict-spec-driven command
        - THEN: the installer builds the dist bundle and runs npm install -g .
        - AND: the strict-spec-driven command is installed into the npm global bin directory
      windows-installer-compiles-native-command:
        - GIVEN: the Windows PowerShell installer is run with Bun available but npm is not on PATH
        - WHEN: installation prepares the strict-spec-driven command
        - THEN: the installer invokes Bun executable compilation for the strict CLI entrypoint
        - AND: installs the resulting native executable for the strict-spec-driven command
  cli-installed-path-command:
    strength: MUST
    statement: The system MUST provide an installation path that makes the strict-spec-driven command invocable from PATH for strict workflow subcommands, whether installed into the npm global bin via npm install -g . or as a native executable in a user bin directory.
    scenarios:
      installed-command-runs-subcommand:
        - GIVEN: the strict skills package has been installed by the repository installer
        - WHEN: strict-spec-driven check-workflow-state is invoked from a repository with .strict-spec-driven/
        - THEN: the command routes to the existing strict workflow CLI behavior
        - AND: the command exits with the same status and diagnostics as the equivalent compiled CLI invocation
  cli-installer-user-bin-path-diagnostics:
    strength: MUST
    statement: When the installer falls back to a native executable it MUST target a user-level bin directory for the strict-spec-driven command and report deterministic diagnostics when that directory is not available on PATH; the npm-global install path targets npm global bin instead and requires no user bin directory.
    scenarios:
      native-fallback-targets-user-bin-directory:
        - GIVEN: the installer falls back to the native executable because npm is unavailable or the npm-global install failed
        - WHEN: installation selects the install location for the native executable
        - THEN: the installer targets a user-level bin directory for the strict-spec-driven command
      native-fallback-reports-missing-path-entry:
        - GIVEN: the native fallback selects a user-level bin directory that is not present on PATH
        - WHEN: installation completes
        - THEN: installation reports an actionable warning naming the selected bin directory
        - AND: installation does not claim that the command is available from PATH
      npm-global-requires-no-user-bin:
        - GIVEN: the installer installs via npm install -g . into the npm global bin
        - WHEN: installation completes
        - THEN: the installer does not require or create a user-level bin directory
        - AND: does not emit a missing-PATH warning for a user bin directory
  cli-skills-use-bare-command:
    strength: MUST
    statement: Bundled strict skill prompts MUST document strict CLI invocations with the bare strict-spec-driven command instead of {{SKILL_DIR}}-relative Node script paths or hard-coded user bin paths.
    scenarios:
      skill-command-snippets-are-path-independent:
        - GIVEN: bundled strict skill SKILL.md files are validated
        - WHEN: their command snippets and workflow prerequisite snippets are inspected
        - THEN: strict CLI subcommands are expressed as strict-spec-driven <subcommand>
        - THEN: the snippets do not contain node {{SKILL_DIR}}/scripts/strict-spec-driven.js or ~/.local/bin/strict-spec-driven
  cli-windows-installer-user-path-update:
    strength: MUST
    statement: When the Windows installer falls back to a native executable it MUST add the resolved native strict-spec-driven bin directory to the current user PATH during installation when PATH updates are not disabled, and MUST remove that directory during uninstall unless removal is disabled; the npm-global install path does not modify the user PATH because npm global bin is already on PATH.
    scenarios:
      native-fallback-adds-user-path:
        - GIVEN: the Windows installer falls back to a native executable and resolves a bin directory absent from the current user PATH
        - WHEN: installation completes with PATH updates enabled
        - THEN: the installer appends that directory to the current user PATH and reports that a new shell may be required
      native-fallback-can-skip-path-update:
        - GIVEN: the Windows native fallback is run with PATH updates disabled
        - WHEN: installation or uninstallation completes
        - THEN: the current user PATH value is left unchanged
      native-uninstall-removes-user-path:
        - GIVEN: the resolved native strict-spec-driven bin directory is present in the current user PATH after a fallback install
        - WHEN: uninstallation completes with PATH cleanup enabled
        - THEN: the installer removes that directory from the current user PATH
      npm-global-leaves-user-path-untouched:
        - GIVEN: the Windows installer installs via npm install -g .
        - WHEN: installation or uninstallation completes
        - THEN: the installer does not add or remove a user-level bin directory from the current user PATH
  cli-sample-inspection-commands:
    strength: MUST
    statement: The system MUST provide read-only CLI commands that list bundled strict YAML sample asset keys and print a selected sample asset, with deterministic output and diagnostics parallel to schema inspection commands.
    scenarios:
      sample-list-emits-deterministic-keys:
        - GIVEN: bundled strict YAML sample assets are available
        - WHEN: strict-spec-cli sample-list is executed
        - THEN: the command exits zero and emits deterministic sample asset keys
      sample-show-prints-selected-sample:
        - GIVEN: a bundled strict YAML sample asset matches a requested sample name or key
        - WHEN: strict-spec-cli sample-show is executed for that sample
        - THEN: the command exits zero and writes the selected sample YAML content
      sample-show-rejects-unknown-sample:
        - GIVEN: no bundled sample asset matches a requested sample name or key
        - WHEN: strict-spec-cli sample-show is executed
        - THEN: the command exits non-zero with a deterministic not-found diagnostic and usage hint
  cli-shared-cache-syncs-samples-on-startup:
    strength: MUST
    statement: The system MUST synchronize bundled strict YAML sample assets together with schema assets during strict CLI command and MCP startup, skip synchronization for help requests, and continue startup with a warning when cache synchronization fails.
    scenarios:
      startup-populates-shared-cache-with-samples:
        - GIVEN: a CLI command that is not a help request starts with an empty shared cache root
        - WHEN: startup synchronization runs
        - THEN: schema assets, sample assets, and a manifest covering both asset families are written under the shared cache root
      help-skips-sample-cache-sync:
        - GIVEN: a CLI help request is executed
        - WHEN: startup dispatch handles the request
        - THEN: usage is printed without creating or writing the shared cache
  cli-skills-remind-sample-lookup:
    strength: SHOULD
    statement: Core strict skills that supply semantic inputs for strict YAML operations SHOULD mention sample-show and shared cached samples as read-only examples, and MUST NOT use sample access as a reason to copy, hand-author, or directly edit repository-owned YAML.
    scenarios:
      yaml-rules-use-samples-without-owning-shape:
        - GIVEN: A core strict skill includes YAML authoring guidance
        - WHEN: An agent reads the rules before supplying mutation intent
        - THEN: The rules identify sample-show as the supported example lookup
        - THEN: The rules require the applicable CLI operation to own the resulting artifact shape and write
  cli-change-intake-question-gate-contract:
    strength: MUST
    statement: Strict proposal creation guidance MUST answer a short evidence-backed change-intake checklist from the active request and available project context before implementation, ask only required unanswered checklist items in preferred_human_language, record unresolved required answers in questions.yaml.open with impact and recommended answers or options, stop implementation handoff while required open questions remain, and keep stable technical identifiers distinct from localized human-facing question, context, recommendation, and summary text.
    scenarios:
      change-intake-uses-evidence-before-asking:
        - GIVEN: a strict proposal workflow has an active request, optional roadmap planned-change provenance, main specs, technical standards, existing change artifacts, repository search results, and deterministic CLI output available for discovery
        - WHEN: the workflow prepares a strict change proposal
        - THEN: the workflow answers the checklist from available evidence, asks only for missing answers, and records still-missing required answers with impact and recommendations in the configured language
      open-required-questions-block-implementation:
        - GIVEN: a generated strict change has unresolved required checklist answers in questions.yaml.open
        - WHEN: implementation handoff or automatic implementation is considered
        - THEN: the workflow stops until required open questions are resolved while preserving stable technical identifiers
  cli-question-gate-readiness-validation:
    strength: MUST
    statement: The ready proposal-handoff command MUST emit deterministic proposal_readiness diagnostics when machine-checkable change-intake evidence is missing from existing proposal, design, question, or delta-spec artifacts, including empty included scope, empty out-of-scope scope, empty unchanged behavior, missing design decisions, or missing delta specs when no explicit no-delta-spec design decision is present, while leaving semantic product judgment outside CLI validation.
    scenarios:
      readiness-rejects-missing-checklist-evidence:
        - GIVEN: a strict change has valid YAML planning artifacts but missing deterministic change-intake evidence such as empty scope lists, no unchanged behavior, no design decisions, or no delta spec and no explicit no-delta-spec design decision
        - WHEN: strict-spec-driven ready <change-name> runs
        - THEN: the command exits non-zero and emits proposal_readiness diagnostics that point to the missing artifact field
      readiness-allows-explicit-empty-spec-decision:
        - GIVEN: a strict change has no open questions and records included scope, out-of-scope scope, unchanged behavior, at least one design decision whose stable id explicitly declares no delta spec is needed, and no delta spec files
        - WHEN: strict-spec-driven ready <change-name> runs
        - THEN: the command exits zero without a missing-delta-spec proposal_readiness diagnostic
  cli-change-intake-docs-and-regression-coverage:
    strength: MUST
    statement: The system MUST document and regress the change-intake question gate across user documentation, packaged skill guidance, self-hosted workflow artifacts, and at least one copied real-project fixture, covering evidence-sufficient no-question paths, evidence-insufficient blocking-question paths in preferred_human_language, roadmap-backed planned-change evidence, roadmap-backed thin-detail blockers, and question resolution before implementation proceeds.
    scenarios:
      documented-question-gate-user-surface:
        - GIVEN: a user reads the repository README, localized README, roadmap guide, or localized roadmap guide
        - WHEN: the change-intake question gate is described
        - THEN: the documentation explains the plain checklist, accepted evidence sources, when the agent asks, why questions.yaml.open blocks implementation, preferred_human_language for human-facing questions, and stable language-neutral technical identifiers
      fixture-and-self-hosted-regression-covers-gate:
        - GIVEN: the self-hosted repository and a copied real-project fixture both contain strict workflow artifacts
        - WHEN: regression tests exercise ready, roadmap-backed guidance, blocked questions, and question resolution
        - THEN: the tests prove that complete evidence proceeds without duplicate questions, missing evidence records a localized open question, roadmap planned-change detail can answer checklist items, thin roadmap detail blocks implementation, and resolved answers allow readiness to proceed
  cli-verify-reports-unresolvable-delta-target:
    strength: MUST
    statement: 'The system MUST report a deterministic verify diagnostic when a strict change contains a delta spec that carries no new-spec seed block and whose target_spec resolves to neither an existing main spec nor a sibling delta introducing that spec, and MUST keep archive blocking such a change non-destructively. Both the verify diagnostic and the archive error MUST carry remediation concrete enough to apply without guessing: the repo-relative delta spec file path, the failing field path, the unresolvable target_spec id, and two labeled remedies — (A) add a new-spec seed block, quoting the exact generate delta-spec command with the change name and a convention-derived .strict-spec-driven/specs/<id>.yaml path filled in; (B) correct the target_spec in that delta file, naming .strict-spec-driven/specs/INDEX.yaml as the source of valid ids.'
    scenarios:
      verify-diagnostic-names-file-field-and-both-remedies:
        - GIVEN: a strict change contains a delta spec with no new-spec seed block whose target_spec matches no existing main spec and no sibling new-spec delta in the same change
        - WHEN: '`strict-spec-driven verify <name>` is executed'
        - THEN: a deterministic diagnostic is emitted naming the repo-relative delta spec file path, the failing field path, and the unresolvable target_spec id
        - AND: the diagnostic states remedy A with the exact generate delta-spec command carrying the change name and a .strict-spec-driven/specs/<id>.yaml path, and remedy B naming .strict-spec-driven/specs/INDEX.yaml as the source of valid target ids
      archive-error-names-file-field-and-both-remedies:
        - GIVEN: the same unresolvable-target delta spec in an otherwise complete strict change
        - WHEN: '`strict-spec-driven archive <name>` is executed'
        - THEN: the command exits non-zero before rewriting any main spec and the active change remains in the active changes directory
        - AND: 'the error output carries the same concrete remediation as the verify diagnostic: delta file path, failing field path, target id, remedy A command, and remedy B index path'
      sibling-new-spec-delta-resolves-target:
        - GIVEN: a delta spec with no seed block targets an id that a sibling delta in the same change introduces with a valid new-spec seed block
        - WHEN: '`strict-spec-driven verify <name>` is executed'
        - THEN: no unresolvable-target diagnostic is emitted for that delta because the target resolves through its sibling
  cli-installer-avoids-duplicate-command:
    strength: MUST
    statement: When npm-global install succeeds the installer MUST remove any strict-spec-driven native executable left by a prior fallback install from the resolved user bin directory, so that a single strict-spec-driven command resolves on PATH on both Unix and Windows.
    scenarios:
      npm-success-removes-prior-unix-native-executable:
        - GIVEN: a prior native-fallback install left a strict-spec-driven native executable in the Unix installer resolved user bin directory
        - WHEN: npm install -g . succeeds
        - THEN: the installer removes that stale native executable
        - AND: only the npm-global strict-spec-driven command resolves on PATH
      npm-success-removes-prior-windows-native-executable:
        - GIVEN: a prior native-fallback install left a strict-spec-driven native executable in the Windows installer resolved user bin directory
        - WHEN: npm install -g . succeeds
        - THEN: the installer removes that stale native executable
        - AND: only the npm-global strict-spec-driven command resolves on PATH
  cli-tech-sync-supports-active-change-mode:
    strength: MUST
    statement: The system MUST require strict-tech-sync guidance to scope active-change evidence to attributable artifacts, capture confirmed active-change findings as delta-tech, and route confirmed standalone main-standard mutations through an artifact-aware CLI operation rather than direct live-standard editing.
    scenarios:
      active-change-sync-uses-bounded-evidence:
        - GIVEN: An active strict change is selected for current-change tech sync
        - WHEN: The AI determines the scan scope
        - THEN: The scope is derived from that change's planning artifacts, delta artifacts, task evidence, attributable repository changes, and applicable standards
      active-change-sync-routes-through-delta-tech:
        - GIVEN: A bounded scan finds a reusable convention gap and the operator confirms its rule content
        - WHEN: The synchronization applies the finding
        - THEN: The finding is generated or updated as delta-tech under the selected active change and no live main standard is directly edited
      standalone-sync-uses-cli-owned-main-standard-mutation:
        - GIVEN: Strict-tech-sync runs as standalone repository maintenance and the operator confirms a main-standard edit
        - WHEN: The synchronization applies the confirmed mutation
        - THEN: The skill invokes the artifact-aware main-standard CLI operation with named semantic arguments
        - AND: The skill does not edit the live YAML document directly
  cli-archive-runs-current-change-tech-sync:
    strength: MUST
    statement: The system MUST require every supported AI-guided strict change archive surface, including strict-spec-archive, strict-spec-auto, and the strict archive MCP prompt, to complete a final current-change-scoped tech sync before invoking the raw archive command; continue immediately when existing standards and delta-tech cover the change; pause unresolved reusable convention findings for confirmed delta-tech capture or explicit non-reusable classification; forbid post-archive deferral of a convention confirmed as reusable; and rerun strict verification and delta-tech review after archive-time delta-tech edits while treating a change-local workflow record that the configured complete regression command neither compiles nor reads, currently a change-local delta-tech artifact or a lesson, as a write that does not invalidate previously passed complete regression evidence, so any other implementation, test, strict artifact, or configuration file written after that evidence passed, including a delta spec and a planning artifact, still requires a regression rerun before archive. Every AI-guided surface that directs a lesson or delta-tech write after complete regression evidence has passed, including strict-spec-review and strict-spec-bugfix, MUST state that evidence rule at the step where the rerun decision is made.
    scenarios:
      archive-continues-when-tech-state-is-covered:
        - GIVEN: a verified active change reaches final AI-guided archive preparation and its bounded scan finds no uncaptured reusable convention or confirms that existing delta-tech already covers each finding
        - WHEN: the current-change tech sync checkpoint completes
        - THEN: archive preparation continues without creating unnecessary tech artifacts
      archive-pauses-for-reusable-convention-gap:
        - GIVEN: the final bounded scan finds a possible reusable convention absent from the applicable main standards and current delta-tech
        - WHEN: archive preparation evaluates the finding
        - THEN: archive does not invoke strict-spec-cli archive until the operator confirms delta-tech capture or explicitly classifies the pattern as not reusable, and a convention the operator confirms as reusable cannot be deferred until after archive
      archive-revalidates-after-delta-tech-capture:
        - GIVEN: the operator confirms a reusable convention and archive preparation generates or updates current-change delta-tech, with complete regression evidence already passing for the change
        - WHEN: the delta-tech artifact is the only file written since that evidence passed
        - THEN: strict verification and delta-tech artifact review are rerun before archive, and the previously passed complete regression evidence stands without a rerun
      lesson-write-preserves-regression-evidence:
        - GIVEN: complete regression evidence has passed for a change and the agent then records the change's lesson through the lesson store
        - WHEN: the surface evaluates its regression evidence before archive and the lesson is the only file written since that evidence passed
        - THEN: the previously passed complete regression evidence stands and the configured regression command is not rerun for that write
      code-edit-still-invalidates-regression-evidence:
        - GIVEN: archive preparation writes any file outside the carve-out after complete regression evidence passed, such as a source file, a test, a delta spec, a planning artifact, or the workflow config
        - WHEN: the archive surface evaluates its regression evidence before invoking archive
        - THEN: the configured complete project regression command is rerun and must pass before archive proceeds
      lesson-writing-surfaces-state-the-evidence-rule:
        - GIVEN: a bundled skill package whose steps direct a lesson write after the complete regression evidence step, such as strict-spec-review or strict-spec-bugfix
        - WHEN: bundled skill packaging is validated and that package omits the evidence rule
        - THEN: validation fails and the diagnostic names the package path and the missing statement
      raw-archive-remains-deterministic-merge-primitive:
        - GIVEN: the final sync checkpoint is complete under an AI-guided archive surface
        - WHEN: that surface invokes strict-spec-cli archive for the selected change
        - THEN: the raw command retains its deterministic verification, delta merge, index regeneration, roadmap reconciliation, and change-move responsibilities without requiring an AI sync receipt
  cli-propose-enforces-two-active-change-limit:
    strength: MUST
    statement: 'The system MUST allow at most two active change directories under .strict-spec-driven/changes/: propose MUST create a second active change normally, but MUST reject a third with a non-zero exit before writing any scaffold file or directory, naming the blocking active changes and directing the operator to archive or cancel one first.'
    scenarios:
      propose-allows-second-active-change:
        - GIVEN: exactly one active strict change directory already exists under .strict-spec-driven/changes/
        - WHEN: strict-spec-driven propose <second-name> is executed with a valid kebab-case name
        - THEN: the second change scaffold is created normally with all strict planning artifacts
      propose-rejects-third-active-change:
        - GIVEN: two active strict change directories already exist under .strict-spec-driven/changes/
        - WHEN: strict-spec-driven propose <third-name> is executed with a valid kebab-case name
        - THEN: the command exits non-zero before any scaffold file or directory is written, and the error names the two blocking active changes and directs the operator to archive or cancel one first
  cli-generate-tasks-upserts-single-tasks:
    strength: MUST
    statement: The system MUST populate the strict task list through a generate tasks artifact that merges one task at a time by section and task id into the existing tasks.yaml, preserves task fields the invocation does not supply, sets testing gates from named arguments, removes a named task on request, offers no flag that discards completed work as part of an edit, and reports write success separately from task list completeness.
    scenarios:
      restatement-preserves-unsupplied-fields:
        - GIVEN: a strict change tasks.yaml contains a task whose status is complete and which carries a command value
        - WHEN: an agent runs generate tasks for that same section and task id supplying only new text
        - THEN: the task text is updated while its completed status and command value are preserved
      no-edit-flag-discards-completed-work:
        - GIVEN: a strict change tasks.yaml contains at least one task whose status is complete
        - WHEN: any generate tasks invocation that edits the list is run
        - THEN: the completed task survives unless it is named by a removal flag, and no flag rebuilds the list in place
      removal-deletes-a-named-task:
        - GIVEN: a strict change tasks.yaml contains a task in a known section
        - WHEN: an agent runs generate tasks with a remove argument naming that task id
        - THEN: the task is deleted from the artifact
        - THEN: repeating the same removal for an id that is no longer present succeeds and reports the removal as a no-op
      values-may-begin-with-a-dash:
        - GIVEN: a strict change scaffold exists
        - WHEN: an agent supplies a task text or command whose value begins with a dash using the inline argument syntax
        - THEN: the value is stored verbatim in the task entry
  cli-verify-checks-task-list-completeness:
    strength: MUST
    statement: The system MUST report a verification diagnostic when a change task list leaves the Implementation, Testing, or Verification section empty, or when a task still carries scaffold placeholder content.
    scenarios:
      empty-section-produces-diagnostic:
        - GIVEN: a strict change has tasks.yaml where one of the Implementation, Testing, or Verification sections contains no task
        - WHEN: the verify command is executed for that change
        - THEN: a diagnostic is emitted identifying the empty section
      scaffold-placeholder-produces-diagnostic:
        - GIVEN: a strict change has tasks.yaml where a task text or command still matches the scaffold placeholder content created by propose
        - WHEN: the verify command is executed for that change
        - THEN: a diagnostic is emitted identifying the task that retains placeholder content
      complete-task-list-produces-no-completeness-diagnostics:
        - GIVEN: a strict change has tasks.yaml with at least one task in each of the three sections and no placeholder content
        - WHEN: the verify command is executed for that change
        - THEN: no task list completeness diagnostics are emitted
  cli-help-supports-machine-readable-json:
    strength: MUST
    statement: The system MUST support `--help --json` for the root CLI and every registered subcommand, writing a single parseable JSON payload to stdout, exiting zero, leaving stderr empty, performing no mutation or validation, and skipping shared schema and sample cache synchronization; the payload MUST carry the command name, summary, positional arguments, flags with their descriptions and their required, repeatable, removal, and delete semantics, the command's output keys, and its exit-code meaning.
    scenarios:
      json-help-carries-write-semantics:
        - GIVEN: any registered subcommand
        - WHEN: help is requested in machine-readable form
        - THEN: the command exits zero, stdout is a single parseable JSON payload carrying that command's name, summary, positional arguments, flag descriptions with required, repeatable, removal, and delete semantics, output keys, and exit-code meaning, and stderr is empty
      root-json-help-describes-every-command:
        - GIVEN: the strict CLI is available
        - WHEN: the root CLI is invoked with `--help --json`
        - THEN: the command exits zero, stdout is a single parseable JSON payload describing every registered command with its group and summary, and stderr is empty
      json-help-skips-cache-sync:
        - GIVEN: the shared cache root is empty
        - WHEN: any strict CLI command is invoked with `--help --json`
        - THEN: the payload is printed without creating or writing the shared schema or sample cache
  cli-help-covers-every-registered-command:
    strength: MUST
    statement: The system MUST describe every command in the canonical registration order through the same command-metadata source that renders root help, subcommand help, JSON help, and MCP tool descriptions, so no registered command can present help without a summary and a description for each flag it accepts, and MCP tool descriptions for mutating commands continue to state project-state mutation explicitly.
    scenarios:
      every-registered-command-is-described:
        - GIVEN: the strict CLI command table is enumerated
        - WHEN: help is requested for each registered command in turn
        - THEN: every command reports a non-empty summary and a description for each flag it accepts, with no command falling back to a bare usage line
      mcp-descriptions-match-command-metadata:
        - GIVEN: the MCP capability inventory is inspected
        - WHEN: each tool description is compared with its mapped command-metadata entry
        - THEN: the descriptions are identical and every mutating tool description still states project-state mutation explicitly
  cli-generation-documents-every-accepted-argument:
    strength: MUST
    statement: 'The system MUST document every named argument the generate command accepts for an artifact in the shared command-metadata registry, including the argument''s meaning and its required, repeatable, and pairing semantics, so that help output and the accepted argument set cannot diverge. An argument that the generator accepts but the metadata registry omits is a defect: an undocumented argument is indistinguishable from an unsupported one, so a caller who guesses a wrong name reads the resulting rejection as evidence that the capability is missing.'
    scenarios:
      every-accepted-generate-argument-is-documented:
        - GIVEN: the generate command's accepted named arguments and the command-metadata entry that describes them
        - WHEN: the accepted argument set is compared against the documented argument set
        - THEN: every accepted argument appears in the metadata entry with its meaning and its required, repeatable, and pairing semantics
      undocumented-argument-is-reported:
        - GIVEN: the generate command accepts a named argument that the command-metadata entry does not list
        - WHEN: argument documentation coverage is checked
        - THEN: the gap is reported as a deterministic diagnostic naming the undocumented argument
      design-alternative-and-risk-arguments-are-discoverable:
        - GIVEN: a caller reading generate help to learn how to record a rejected alternative or a risk on a design artifact
        - WHEN: the design artifact's documented arguments are inspected
        - THEN: the alternative, reason, and risk arguments are listed with their meanings, and the pairing requirement between an alternative and its reason is stated
  cli-propose-seeds-requirement-questions:
    strength: MUST
    statement: The propose command MUST seed questions.yaml with exactly five canonical open requirement questions carrying the language-neutral ids requirement-problem, requirement-outcome, requirement-trigger, requirement-non-goals, and requirement-interpretation, each with kind requirement and each carrying self-explanatory context that states why the question is asked, what a sufficient answer contains, a concrete worked example of one, and what the answer changes downstream; a seeded entry whose context is only a restatement of the question does not satisfy this requirement. The seeded text is the canonical English baseline, and proposal-oriented skills restate it in the configured preferred_human_language when asking the requester.
    scenarios:
      propose-seeds-five-canonical-open-requirement-questions:
        - GIVEN: a strict workflow project with no active change of the requested name
        - WHEN: strict-spec-driven propose <name> runs
        - THEN: the scaffolded questions.yaml contains the five canonical requirement ids as open entries with kind requirement
      seeded-questions-carry-self-explanatory-context:
        - GIVEN: a change scaffolded by propose and read by a requester unfamiliar with the strict workflow
        - WHEN: the seeded requirement questions are inspected
        - THEN: each entry's context states why the question is asked, what a sufficient answer contains, a worked example, and what the answer changes, rather than restating the question
      seeded-questions-block-a-fresh-scaffold:
        - GIVEN: a change scaffolded by propose whose seeded requirement questions are still open
        - WHEN: strict-spec-driven ready <name> runs
        - THEN: the command exits non-zero and reports the unanswered requirement questions rather than reporting the fresh scaffold as ready
  cli-questions-generator-requirement-attribution:
    strength: MUST
    statement: The questions generator MUST accept --kind and --answered-by so requirement entries can be created and resolved with attribution, MUST carry an existing entry's kind forward when --resolve moves it from open to resolved, MUST reject a removal flag that names a requirement-kind entry, MUST NOT accept a delete flag for the questions artifact, MUST offer no flag or flag combination that removes or clears a requirement-kind entry, and MUST document these flags in the shared command-metadata registry.
    scenarios:
      removal-flag-refuses-a-requirement-entry:
        - GIVEN: a change's questions artifact holds the seeded requirement-kind entries
        - WHEN: an authoring command supplies a removal flag naming one of those requirement entries
        - THEN: the command exits non-zero, reports that requirement entries cannot be removed, and leaves the questions artifact byte-identical
      questions-artifact-rejects-delete:
        - GIVEN: a change's questions artifact holds the seeded requirement-kind entries
        - WHEN: an authoring command supplies the delete flag for the questions artifact
        - THEN: the command exits non-zero, reports that the questions artifact cannot be deleted, and the artifact file remains present and unchanged
      resolve-records-answer-attribution:
        - GIVEN: an open requirement-kind question and a human-supplied answer
        - WHEN: the questions generator resolves that id with an answer attributed to a human
        - THEN: the entry moves to resolved carrying kind requirement and answered_by human
      rejects-out-of-set-attribution-values:
        - GIVEN: a questions generator invocation supplying a --kind or --answered-by value outside the permitted sets
        - WHEN: the command runs
        - THEN: the command exits non-zero naming the flag and its permitted values
  cli-ready-requirement-intake-diagnostics:
    strength: MUST
    statement: The ready proposal-handoff command MUST emit requirement_intake diagnostics and exit non-zero while any canonical requirement question is absent from questions.yaml, still open, resolved with answered_by assumption, or resolved without an answered_by attribution, and each diagnostic MUST name the canonical requirement id, the artifact field path, what the unanswered question is asking for, and the command that resolves it.
    scenarios:
      ready-blocks-on-assumption-answered-requirements:
        - GIVEN: a change whose canonical requirement questions are resolved but at least one carries answered_by assumption
        - WHEN: strict-spec-driven ready <name> runs
        - THEN: the command exits non-zero with a requirement_intake diagnostic naming the assumed requirement id and the resolving command
      ready-blocks-on-unattributed-requirement-answer:
        - GIVEN: a change whose canonical requirement question is resolved but carries no answered_by field
        - WHEN: strict-spec-driven ready <name> runs
        - THEN: the command exits non-zero with a requirement_intake diagnostic reporting the missing attribution
      ready-blocks-on-missing-canonical-requirement-id:
        - GIVEN: a change whose questions.yaml omits one of the five canonical requirement ids entirely
        - WHEN: strict-spec-driven ready <name> runs
        - THEN: the command exits non-zero with a requirement_intake diagnostic naming the missing canonical id and what it asks for
      ready-proceeds-on-human-answered-requirements:
        - GIVEN: a change whose five canonical requirement questions are all resolved with answered_by human or roadmap and whose other proposal readiness evidence is present
        - WHEN: strict-spec-driven ready <name> runs
        - THEN: the command exits zero without requirement_intake diagnostics
  cli-validate-skills-requires-interrogation-guidance:
    strength: MUST
    statement: The validate-skills command MUST reject a strict skill package for brainstorm, propose, bugfix, or auto whose guidance omits the requirement-interrogation section, the rule that requirement items are never answered from repository evidence, the five canonical requirement ids, the prescribed asking technique of one question at a time each carrying a concrete guess and rejecting answers that name a solution, the duty to explain why a question matters and what a sufficient answer contains before posing it, or the duty to state the reason for pushback instead of silently re-asking, reporting deterministic path-specific diagnostics for each missing element.
    scenarios:
      validate-skills-rejects-missing-interrogation-guidance:
        - GIVEN: a proposal-oriented strict skill package whose guidance omits the requirement-interrogation section
        - WHEN: strict-spec-driven validate-skills runs
        - THEN: the command exits non-zero with a diagnostic naming the skill path and the missing guidance element
      validate-skills-rejects-missing-asking-technique:
        - GIVEN: a proposal-oriented strict skill package that documents the requirement-interrogation section and canonical ids but omits the one-question-at-a-time rule, the concrete-guess rule, or the reject-solution-shaped-answers rule
        - WHEN: strict-spec-driven validate-skills runs
        - THEN: the command exits non-zero with a diagnostic naming the skill path and the missing asking-technique rule
      validate-skills-rejects-missing-explanation-duty:
        - GIVEN: a proposal-oriented strict skill package that documents the asking technique but omits the duty to explain a question before posing it or the duty to state the reason for pushback
        - WHEN: strict-spec-driven validate-skills runs
        - THEN: the command exits non-zero with a diagnostic naming the skill path and the missing explanation duty
      validate-skills-accepts-complete-interrogation-guidance:
        - GIVEN: all four proposal-oriented strict skill packages document the requirement-interrogation section, the evidence rule, the five canonical ids, the asking technique, and both explanation duties
        - WHEN: strict-spec-driven validate-skills runs
        - THEN: the command exits zero without interrogation-guidance diagnostics
  cli-requirement-interrogation-docs-coverage:
    strength: MUST
    statement: The system MUST document the requirement-interrogation stage in both README.md and README.zh.md, explaining why it runs before the change-intake checklist, why repository evidence cannot answer requirement items, what each of the five canonical ids asks and what a sufficient answer to it contains, how seeded questions block a fresh scaffold, the prescribed asking technique and explanation duties, and the three-layer split in which the CLI enforces question existence and attribution, the skills govern asking technique, and answer honesty stays an unenforceable obligation made visible through answered_by assumption.
    scenarios:
      documented-requirement-interrogation-stage:
        - GIVEN: a user reads the repository README or its localized counterpart
        - WHEN: the requirement-interrogation stage is described
        - THEN: the documentation explains the stage ordering, the evidence restriction, what each canonical id asks and what answers it, the seeded blocking behavior, the asking technique and explanation duties, and the three-layer enforcement split
  cli-artifact-writes-affect-only-named-fields:
    strength: MUST
    statement: 'The system MUST confine every artifact-authoring write to the fields named in that invocation: restating an existing scalar or keyed item MUST overwrite it without requiring a confirming flag, repeated list values MUST append, and no flag MUST cause a list the caller did not name to be replaced or cleared. Discarding a single recorded entry MUST require a removal flag that names that entry, and the CLI MUST offer no flag that rebuilds an artifact in place as a side effect of an edit.'
    scenarios:
      restating-a-keyed-item-overwrites-only-that-item:
        - GIVEN: a change artifact records several keyed items and several list entries
        - WHEN: an authoring command restates one keyed item with new content
        - THEN: that item's content is replaced, every other keyed item and every list entry is preserved unchanged, and the command exits zero
      an-edit-never-widens-into-unnamed-lists:
        - GIVEN: a roadmap milestone records multiple risks, scope entries, done criteria, dependencies, and notes
        - WHEN: an authoring command changes the milestone goal while also supplying one additional risk
        - THEN: the goal is replaced, the new risk is appended to the existing risks, and every previously recorded risk, scope entry, done criterion, dependency, and note remains present
      removing-an-entry-requires-naming-it:
        - GIVEN: an artifact list records several entries
        - WHEN: an authoring command supplies a removal flag naming exactly one entry
        - THEN: only the named entry is removed, the remaining entries are preserved in order, and the command exits zero
  cli-artifact-delete-is-an-isolated-act:
    strength: MUST
    statement: 'The system MUST support deleting a change planning artifact as a separate deliberate act rather than as a mode of an editing command: the delete flag MUST remove the target artifact file, MUST be accepted only alongside the flags that identify which artifact to delete, and the command MUST exit non-zero without writing or deleting anything when the delete flag is combined with any editing flag. The questions artifact MUST NOT accept the delete flag because its requirement entries are the interrogation gate, the proposal artifact MUST NOT accept it because it is required for every change and is merged rather than rebuilt, and the task list MUST refuse it while any task is recorded complete so no single invocation can discard completed work.'
    scenarios:
      delete-removes-the-artifact-file:
        - GIVEN: a change has a populated planning artifact
        - WHEN: an authoring command runs with the delete flag as its only flag
        - THEN: the artifact file is removed, the removal is reported, and the command exits zero
      delete-is-rejected-alongside-any-edit-flag:
        - GIVEN: a change has a populated planning artifact
        - WHEN: an authoring command supplies the delete flag together with any editing flag
        - THEN: the command exits non-zero, reports the conflict, and leaves the artifact byte-identical
      delete-is-refused-over-completed-tasks:
        - GIVEN: a change whose task list records at least one completed task
        - WHEN: an authoring command supplies the delete flag for the task list
        - THEN: the command exits non-zero naming the completed tasks, and the task list remains in place
      delete-is-refused-for-required-merged-artifacts:
        - GIVEN: a change with a populated questions or proposal artifact
        - WHEN: an authoring command supplies the delete flag for either artifact
        - THEN: the command exits non-zero explaining why that artifact cannot be deleted, and the artifact remains present and unchanged
  cli-verify-detects-scaffold-placeholder-content:
    strength: MUST
    statement: The proposal-readiness and verify commands MUST report leftover bundled scaffold placeholder content in every change planning artifact that carries placeholders, covering the task text and command placeholders in tasks.yaml, the approach, decision, alternative, and risk placeholders in design.yaml, and the scope and unchanged-behavior placeholders in proposal.yaml, so seeded placeholder content blocks proposal handoff and can never reach an archived change.
    scenarios:
      design-placeholders-block-archive:
        - GIVEN: a change whose design.yaml still carries bundled scaffold placeholder approach, decision, alternative, or risk content
        - WHEN: verify runs for that change
        - THEN: verify reports a diagnostic naming the placeholder field and instructing that it be replaced before archiving, and the change is not reported valid
      authored-content-is-not-reported-as-placeholder:
        - GIVEN: a change whose design.yaml content has been fully authored
        - WHEN: verify runs for that change
        - THEN: no placeholder diagnostic is reported for design.yaml
      placeholders-block-proposal-handoff:
        - GIVEN: a change whose design.yaml or proposal.yaml still carries bundled scaffold placeholder content
        - WHEN: the proposal-readiness check runs for that change
        - THEN: the change is not reported ready and a diagnostic names the placeholder field
  cli-proposal-generator-merges-existing-content:
    strength: MUST
    statement: The proposal generator MUST read the existing proposal.yaml and merge supplied values into it rather than rebuilding the artifact from the invocation's arguments alone, so scope, out-of-scope, and unchanged-behavior entries recorded by an earlier invocation survive a later one that does not restate them.
    scenarios:
      adding-one-scope-entry-preserves-the-others:
        - GIVEN: a proposal.yaml recording several in-scope, out-of-scope, and unchanged-behavior entries
        - WHEN: a later proposal generation supplies the required summary arguments and one additional in-scope entry
        - THEN: the new entry is appended and every previously recorded in-scope, out-of-scope, and unchanged-behavior entry remains present
  cli-yaml-mutations-use-artifact-aware-intent:
    strength: MUST
    statement: The system MUST expose supported mutations of repository-owned YAML through artifact-aware CLI operations that accept named semantic arguments, resolve targets only within the declared artifact-family locations, and reject raw YAML payloads and arbitrary output paths.
    scenarios:
      named-intent-resolves-a-confined-target:
        - GIVEN: A caller names an artifact family, stable artifact identity, and semantic fields through a supported CLI operation
        - WHEN: The CLI resolves the mutation target
        - THEN: The target is derived within the repository-declared locations for that artifact family
        - THEN: The caller does not supply document shape or an arbitrary filesystem output path
      raw-payload-or-path-is-rejected:
        - GIVEN: A mutation request supplies raw YAML content or an arbitrary target path instead of the operation's named semantic inputs
        - WHEN: The CLI validates the request
        - THEN: The command exits non-zero with a deterministic diagnostic before changing the filesystem
  cli-yaml-mutations-have-uniform-safe-semantics:
    strength: MUST
    statement: The system MUST give every CLI-owned YAML family uniform creation, field-level scalar and keyed-item upsert, additive list, named single-entry removal, and isolated whole-artifact deletion semantics that preserve every field, keyed item, and list entry not named by the invocation.
    scenarios:
      updates-preserve-unnamed-content:
        - GIVEN: An existing valid YAML artifact contains fields, keyed items, and list entries beyond the mutation request
        - WHEN: A caller restates one scalar or keyed item or adds list values
        - THEN: Only the named scalar or keyed item is overwritten, list values are appended without duplicates, and all unnamed content remains unchanged
      removal-and-deletion-are-explicitly-separated:
        - GIVEN: An existing artifact contains multiple named entries
        - WHEN: A caller requests removal
        - THEN: A named-entry removal deletes only the identified entry, while whole-artifact deletion requires a separate delete-only invocation that cannot be combined with edits
      creation-persists-meaningful-state-only:
        - GIVEN: A caller requests creation of a YAML artifact
        - WHEN: The required caller-supplied or workflow-required state is absent or invalid
        - THEN: No blank or placeholder artifact and no empty artifact container is persisted
  cli-yaml-mutations-validate-before-atomic-commit:
    strength: MUST
    statement: The system MUST build and validate the complete candidate YAML artifact, applicable schema relationships, path confinement, and declared reference side effects before committing a mutation atomically, and MUST leave the prior filesystem state unchanged when any check or write fails.
    scenarios:
      valid-candidate-commits-once:
        - GIVEN: A mutation request produces a complete candidate artifact whose schema, relationships, paths, and reference effects are valid
        - WHEN: The CLI commits the mutation
        - THEN: The complete candidate and required reference updates become visible as one successful operation
      invalid-or-failed-write-rolls-back:
        - GIVEN: A candidate artifact, relationship, path, reference update, or filesystem write is invalid or fails
        - WHEN: The CLI processes the mutation
        - THEN: The command exits non-zero and every pre-existing file remains byte-for-byte unchanged
        - THEN: A failed creation leaves no new artifact file or empty container
  cli-yaml-mutations-report-deterministic-contracts:
    strength: MUST
    statement: The system MUST provide deterministic machine-readable results and diagnostics for YAML mutations and machine-readable help that identifies required named inputs, append versus overwrite behavior, named removal semantics, isolated deletion semantics, output fields, and exit codes.
    scenarios:
      help-describes-the-complete-mutation-effect:
        - GIVEN: A caller requests machine-readable help for a YAML mutation command
        - WHEN: The CLI renders the command contract
        - THEN: The output identifies every named input and whether it creates, overwrites, appends, removes one named entry, or deletes the whole artifact
      results-identify-success-or-failure:
        - GIVEN: A YAML mutation succeeds or fails validation
        - WHEN: The CLI reports the outcome
        - THEN: The result deterministically identifies the artifact, changed operation, validation status, diagnostics, and exit status without requiring prose parsing
  cli-skills-route-repository-yaml-mutations-through-cli:
    strength: MUST
    statement: The system MUST require AI-facing skills to express repository-owned YAML mutation intent through the applicable artifact-aware CLI operation whenever that family supports mutation, while retaining direct access only for inventory-classified read-only or human-only exceptions.
    scenarios:
      skills-never-hand-author-cli-owned-yaml:
        - GIVEN: A skill needs to create, modify, remove an entry from, or delete a repository-owned YAML artifact
        - WHEN: Its workflow guidance is followed
        - THEN: The agent invokes the applicable CLI operation with named semantic arguments instead of editing YAML text or constructing a payload file
        - THEN: Any direct-access exception is explicitly classified as read-only or human-only in the mutation inventory
  cli-yaml-mutations-preserve-established-domain-interfaces:
    strength: MUST
    statement: The system MUST preserve established domain-specific CLI commands as compatible interfaces for the YAML artifact operations they already own while shared mutation mechanics are introduced beneath those commands.
    scenarios:
      existing-domain-command-remains-compatible:
        - GIVEN: A domain-specific CLI command already owns a supported YAML artifact operation
        - WHEN: The shared mutation boundary is adopted for that operation
        - THEN: Existing callers can continue to use the established command name and semantic inputs
        - THEN: The command applies the uniform validation, preservation, diagnostic, and atomic-write contract without requiring callers to switch to a raw generic editor
  cli-exposes-yaml-mutation-surface:
    strength: MUST
    statement: The system MUST expose a machine-readable YAML mutation surface that reports every repository-owned YAML artifact family in the checked-in mutation inventory together with its ownership class, its state for each of create, update, named removal, and whole-artifact deletion, the CLI commands that own each supported operation, its bundled schema key, its declared schema_file path, and its bundled example key, and MUST report an inventoried operation state verbatim rather than claiming CLI ownership the repository does not yet provide.
    scenarios:
      surface-lists-every-inventoried-family:
        - GIVEN: The repository mutation inventory declares a set of YAML artifact families with ownership classes and per-operation states
        - WHEN: A caller requests the YAML mutation surface listing
        - THEN: Every inventoried family appears exactly once with its ownership class, its four operation states, and its schema and example references
      surface-detail-identifies-assets-and-routing:
        - GIVEN: A caller requests the surface detail for an inventoried artifact kind
        - WHEN: The system reports that artifact kind
        - THEN: The result names the owning CLI commands for each supported operation, the bundled schema key, the resolved schema_file path, the bundled example key, and the schema-show and sample-show commands that print them
      surface-does-not-overstate-ownership:
        - GIVEN: The mutation inventory records an operation for a family as direct-write rather than cli-owned
        - WHEN: The system reports that family through the mutation surface
        - THEN: The operation is reported with its inventoried state and no owning CLI command is claimed for it
      unknown-artifact-kind-is-rejected-deterministically:
        - GIVEN: A caller requests surface detail for an artifact kind that is absent from the mutation inventory
        - WHEN: The system resolves the request
        - THEN: The request fails with a deterministic diagnostic naming the unknown artifact kind and no partial surface result is reported
  cli-authoring-help-identifies-schema-and-example:
    strength: MUST
    statement: The system MUST make every CLI command that authors repository-owned YAML identify the artifact kinds it writes, and for each kind its bundled schema key, declared schema_file path, and bundled example key together with the schema-list, schema-show, sample-list, and sample-show commands that discover and print them, through the same command-metadata source that renders text help, JSON help, and MCP tool descriptions; text help and MCP tool descriptions MUST render those asset references rather than naming artifact kinds alone, and every surface MUST state the shared schema cache root the declared paths resolve beneath and MUST keep reporting bundled asset keys when that cache is unavailable.
    scenarios:
      text-help-carries-artifact-assets:
        - GIVEN: A caller requests text help for a command that authors a repository-owned YAML artifact
        - WHEN: The system prints the help
        - THEN: The help names each artifact kind with its bundled schema key, declared schema_file path, and bundled example key, and the discovery and inspection commands that print them
      json-help-carries-artifact-assets:
        - GIVEN: A caller requests machine-readable help for a command that authors a repository-owned YAML artifact
        - WHEN: The system emits the help payload
        - THEN: The payload names the artifact kinds the command writes with their bundled schema key, schema_file path, bundled example key, and the asset discovery and inspection commands
      mcp-descriptions-carry-artifact-assets:
        - GIVEN: An MCP host reads the tool description for a mutating strict command
        - WHEN: The system builds the capability inventory
        - THEN: The description names the artifact kinds written with their bundled schema and example keys and the commands that print them, reporting the same kinds and asset references as text help and machine-readable help
      surfaces-state-cache-resolution:
        - GIVEN: A command that authors repository-owned YAML is described on any help surface
        - WHEN: The system reports the artifact's declared schema_file path and bundled example
        - THEN: The surface states the shared schema cache root those paths resolve beneath, and when that cache is unavailable the bundled schema and example keys are still reported with no cache-derived path presented as resolved
  cli-mutation-results-identify-recovery-assets:
    strength: MUST
    statement: The system MUST report the affected artifact kind, its bundled schema key, its resolved schema_file path, and its bundled example key in both successful YAML mutation results and mutation failure diagnostics, resolving the schema_file path beneath the shared schema cache root and the example beneath the cached examples tree, and falling back to the bundled asset key when that cache is unavailable rather than failing the mutation or reporting an unusable path.
    scenarios:
      failed-mutation-names-its-recovery-assets:
        - GIVEN: A YAML mutation is rejected because the candidate artifact fails validation
        - WHEN: The system emits the failure diagnostics
        - THEN: The diagnostics identify the artifact kind, bundled schema key, schema_file path, and bundled example key needed to correct the request, and no file is written
      successful-mutation-reports-the-same-identifiers:
        - GIVEN: A YAML mutation commits successfully
        - WHEN: The system emits the mutation result
        - THEN: The result identifies the same artifact kind, bundled schema key, schema_file path, and bundled example key as the corresponding failure diagnostics would
      missing-cache-falls-back-to-bundled-keys:
        - GIVEN: The shared schema cache root is absent or unreadable
        - WHEN: The system reports schema and example references for a YAML mutation
        - THEN: The bundled schema and example keys are still reported, no cache-derived path is presented as resolved, and the mutation outcome is unaffected
  cli-main-spec-and-tech-authoring:
    strength: MUST
    statement: The system MUST provide artifact-aware spec-edit and tech-edit CLI commands that create and incrementally mutate live main specs and technical standards from named semantic inputs, preserve unnamed content, add and remove keyed requirement or rule content, enforce stable identity and confined canonical paths, isolate and safeguard whole-artifact deletion, reconcile the corresponding spec or tech index in the same validated atomic operation, and report deterministic mutation and recovery metadata while preserving delta archive compatibility.
    scenarios:
      structured-create-and-update-reconciles-index:
        - GIVEN: A caller supplies a stable spec or standard id and named semantic fields to spec-edit or tech-edit
        - WHEN: The authoring command creates or updates the live main artifact
        - THEN: Only the named content changes and the corresponding canonical index entry is created or reconciled atomically
      named-removal-preserves-siblings:
        - GIVEN: An existing main spec or standard contains multiple requirements or rules, scenarios, examples, exceptions, and unrelated fields
        - WHEN: The caller names one supported keyed entry for removal
        - THEN: Only that named entry is removed and all unnamed sibling content and index entries remain unchanged
      unsafe-delete-or-identity-change-is-rejected:
        - GIVEN: A delete request is mixed with edits, targets an artifact with active delta references, or conflicts with the artifact stable identity or canonical path
        - WHEN: The live-document authoring command validates the request
        - THEN: The command exits non-zero with deterministic conflict and recovery metadata and leaves the artifact and index unchanged
      valid-delete-removes-artifact-and-index:
        - GIVEN: A caller issues an isolated delete for a canonically resolved main spec or standard with no blocking references
        - WHEN: The authoring command commits the deletion
        - THEN: The main artifact and only its corresponding index entry are removed together without changing sibling artifacts
      archive-merge-remains-compatible:
        - GIVEN: A strict change contains a valid delta spec or delta tech targeting a live artifact managed by the new authoring commands
        - WHEN: The existing archive workflow merges and reconciles the delta
        - THEN: The merged main artifact and regenerated index remain valid and observable through the same live authoring and status surfaces
  cli-change-authoring-creates-artifacts-lazily:
    strength: MUST
    statement: The system MUST create strict change planning artifacts only from real authored content, so that no supported command writes a placeholder proposal, design, questions, or tasks artifact, and a change directory contains only artifacts that an authoring invocation has actually populated.
    scenarios:
      propose-creates-container-without-planning-artifacts:
        - GIVEN: a valid kebab-case change name that does not already exist
        - WHEN: the propose command is executed for that name
        - THEN: the command creates the change directory and its specs directory
        - AND: no proposal, design, tasks, or questions artifact exists in that change directory
      generate-creates-only-the-authored-artifact:
        - GIVEN: a change directory that contains no planning artifacts
        - WHEN: an authoring command is executed for one planning artifact with valid named arguments
        - THEN: that artifact is created from typed defaults merged with the supplied named arguments
        - AND: the other planning artifacts remain absent
  cli-first-authoring-invocation-is-atomic:
    strength: MUST
    statement: The system MUST treat the first successful authoring invocation for a change, whether it is the propose command or an artifact authoring command, as one atomic operation that validates the change name, the existing-change collision rule, and the active-change limit before creating the change container together with any artifact content that invocation supplies, and MUST remove every path it created when that invocation is rejected or fails.
    scenarios:
      failed-first-authoring-leaves-no-change-behind:
        - GIVEN: a change name that does not yet exist
        - WHEN: an authoring command for that change is executed with arguments that fail validation or schema checking
        - THEN: the command exits non-zero
        - AND: no change directory exists for that name afterwards
      first-authoring-validates-before-creating-anything:
        - GIVEN: a requested change name that is not kebab-case, or an active-change limit that is already filled
        - WHEN: an authoring command is executed for that change
        - THEN: the command exits non-zero and reports the violated rule
        - AND: no change directory and no artifact are created
      failed-write-into-existing-change-preserves-it:
        - GIVEN: an existing change directory that already contains at least one authored artifact
        - WHEN: an authoring command for that change is rejected
        - THEN: the change directory and its existing artifacts remain unchanged
  cli-missing-change-artifacts-are-reported-as-diagnostics:
    strength: MUST
    statement: The system MUST report a required change planning artifact that has not been authored as an explicit readiness and verification diagnostic that names the absent artifact and the authoring command that would create it, rather than relying on detecting placeholder content inside a written artifact.
    scenarios:
      absent-required-artifact-blocks-readiness:
        - GIVEN: a change whose planning artifacts have not all been authored
        - WHEN: the readiness or verification command is executed for that change
        - THEN: the command reports one diagnostic per absent required artifact
        - AND: each diagnostic names the absent artifact and the authoring command that creates it
      absent-questions-artifact-blocks-readiness:
        - GIVEN: a change whose questions artifact has never been authored
        - WHEN: the readiness command is executed for that change
        - THEN: the command reports the questions artifact as absent and does not report the change ready
        - AND: the requirement-interrogation gate cannot be bypassed by never authoring the questions artifact
  cli-requirement-questions-remain-enforceable-workflow-state:
    strength: MUST
    statement: The system MUST preserve the canonical requirement questions as enforceable workflow state created through structured command input, so that removing placeholder change artifacts does not remove the requirement-interrogation gate and those questions remain unremovable and continue to block implementation handoff until they are answered.
    scenarios:
      requirement-questions-exist-after-structured-authoring:
        - GIVEN: a change whose questions artifact has been authored through the supported command
        - WHEN: the questions artifact is read
        - THEN: the canonical requirement questions are present as open workflow state
        - AND: no supported flag removes a requirement-kind question
  cli-authors-bundled-repository-assets:
    strength: MUST
    statement: The system MUST provide CLI-owned creation, update, named-entry removal, and whole-artifact deletion for every repository-bundled YAML asset family — bundled schema documents and the schema registry, initialization scaffolds and SOP category templates, minimal reference examples, validation test fixtures, and the YAML mutation inventory — through commands that accept named semantic arguments and resolve a confined asset destination from the command's own family rather than from a caller-supplied output path.
    scenarios:
      bundled-asset-families-report-cli-ownership:
        - GIVEN: The mutation inventory declares the bundled schema, scaffold, reference example, validation fixture, and mutation inventory families
        - WHEN: A caller requests the YAML mutation surface listing
        - THEN: Each of those families is reported as CLI-owned for create, update, named removal, and deletion, and each supported operation names the CLI command that owns it
      named-removal-affects-only-the-named-entry:
        - GIVEN: A bundled asset containing several named entries
        - WHEN: A caller removes one entry by name through its family's editing command
        - THEN: Only that entry is gone and every sibling entry, unnamed field, and unrelated bundled asset is unchanged
      caller-supplied-destinations-are-rejected:
        - GIVEN: A caller invokes a bundled-asset editing command with an asset name that resolves outside its family's confined location
        - WHEN: The system resolves the request
        - THEN: The request is rejected with a deterministic diagnostic naming the confinement rule and no file is created or modified
  bundled-asset-writes-are-reference-complete:
    strength: MUST
    statement: 'The system MUST treat a bundled asset''s dependent references and regenerated bundles as participants of the same write: an accepted bundled-asset mutation MUST leave the schema registry, primary-example references, scaffold consumers, mutation inventory, and embedded asset bundle mutually consistent, MUST refuse a deletion while any of those still reference the asset, and MUST leave every pre-existing file unchanged when any part of that set fails.'
    scenarios:
      embedded-bundle-is-regenerated-with-the-asset:
        - GIVEN: A bundled schema, scaffold, example, or inventory asset is edited through its CLI command
        - WHEN: The write is accepted
        - THEN: The embedded asset bundle reflects the edited content, so no state exists in which the asset and the bundle disagree
      failed-regeneration-rolls-back-the-write:
        - GIVEN: A bundled-asset write is accepted for content but regenerating the embedded bundle fails
        - WHEN: The system resolves the mutation
        - THEN: The mutation fails with a deterministic diagnostic and both the asset and the embedded bundle are byte-identical to their pre-write content
      deletion-is-refused-while-referenced:
        - GIVEN: A bundled asset is still named by the schema registry, a primary-example reference, a scaffold consumer, the mutation inventory, or an asserting test suite
        - WHEN: A caller requests deletion of that asset
        - THEN: The deletion is refused with a diagnostic naming each referencing path and nothing is deleted
      dangling-references-are-rejected-at-write-time:
        - GIVEN: A bundled schema is created without the registry entry and primary example that make it reachable
        - WHEN: The system validates the candidate mutation
        - THEN: The write is rejected with a diagnostic naming the missing reference, rather than producing an asset that validates alone but is unreachable
  fixture-and-inventory-writes-preserve-their-purpose:
    strength: MUST
    statement: 'The system MUST validate each bundled asset against the contract that asset actually serves: a validation fixture MUST be checked for parseability and its declared fixture intent rather than against the schema it names, so an intentionally invalid fixture stays invalid, and a mutation-inventory write MUST be gated on the repository inventory coverage check rather than on schema validation alone.'
    scenarios:
      invalid-fixtures-stay-invalid:
        - GIVEN: A validation fixture that intentionally violates the schema it names
        - WHEN: A caller edits that fixture through its CLI command
        - THEN: The write is accepted, the fixture remains schema-invalid, and it still produces the diagnostics its test suite asserts
      inventory-writes-are-gated-on-coverage:
        - GIVEN: A caller edits the YAML mutation inventory in a way that leaves a tracked repository YAML path uncovered or a declared pattern stale
        - WHEN: The system validates the candidate inventory
        - THEN: The write is rejected with the inventory coverage diagnostics and the recorded inventory is unchanged
      field-edits-to-an-unparseable-fixture-are-refused:
        - GIVEN: A validation fixture whose declared intent is to be unparseable YAML
        - WHEN: A caller attempts to edit one of its fields
        - THEN: The edit is refused with a deterministic diagnostic naming the fixture's declared intent, the fixture is unchanged, and deletion remains the only supported mutation for it
  bundled-asset-commands-are-checkout-scoped:
    strength: MUST
    statement: The system MUST confine the bundled-asset editing commands to the repository checkout that contains the bundled source tree, and MUST refuse each of them with a deterministic diagnostic naming the absent source tree when invoked where that tree does not exist, rather than creating the tree or writing a partial asset.
    scenarios:
      refusal-outside-the-bundled-source-tree:
        - GIVEN: A bundled-asset editing command is invoked from a project that has no bundled source tree
        - WHEN: The system resolves the request
        - THEN: The command exits non-zero with a diagnostic naming the absent bundled source tree and creates no file or directory
  cli-owns-workflow-config-and-change-yaml-mutations:
    strength: MUST
    statement: The system MUST expose artifact-aware CLI operations for workflow configuration and active change proposal, design, question, task, delta-spec, and delta-tech YAML that create or update only named semantic content, remove only named entries, permit whole-artifact or lifecycle deletion only where policy allows, preserve every unnamed field and related artifact, validate each complete resulting YAML artifact, atomically commit each changed artifact without requiring direct YAML editing, and preserve existing verified apply, cancel, verify, and archive lifecycle behavior.
    scenarios:
      config-named-mutation-preserves-unrelated-content:
        - GIVEN: a valid workflow config contains review evidence, maintenance checks, rules, and unrelated optional content
        - WHEN: a caller uses the config authoring command to update one named value or remove one named entry
        - THEN: the confined config artifact is schema-valid, only the named content changes, every unrelated value remains unchanged, and deletion remains deterministically unavailable
      planning-artifact-operations-are-intent-scoped:
        - GIVEN: an active change contains valid proposal, design, questions, tasks, delta specs, or delta tech with content beyond the requested mutation
        - WHEN: the corresponding domain CLI operation creates or updates a named field, keyed item, list value, mapping, requirement, rule, scenario, or testing gate, or requests a permitted named removal
        - THEN: the command changes only the named semantic content, preserves change and target identity plus every unnamed value and sibling artifact, and emits deterministic machine-readable results
      lifecycle-safeguards-govern-deletion:
        - GIVEN: an active change contains proposal provenance, canonical requirement questions, completed tasks, delta targets, or archived-state relationships protected by lifecycle policy
        - WHEN: a caller requests removal, whole-artifact deletion, cancellation, apply, verification, or archive
        - THEN: the command preserves proposal and requirement-question gates, completed-task safeguards, active/archive identity, delta merge rules, indexes, and roadmap reconciliation, rejecting any forbidden transition before mutation
      failed-artifact-mutation-rolls-back:
        - GIVEN: a config, generated change artifact, artifact deletion, or apply task-status mutation would fail schema, confinement, relationship, or filesystem validation after its candidate has been prepared
        - WHEN: the shared YAML mutation boundary attempts to commit the requested artifact operation
        - THEN: the command exits non-zero with stable diagnostics and every pre-existing target and sibling artifact remains unchanged
  cli-yaml-operation-matrix-regression:
    strength: MUST
    statement: The repository regression suite MUST prove, for every artifact family recorded in the YAML mutation inventory, the operations that family's lifecycle permits — creation, scalar and keyed updates, additive list updates, exact named removal, allowed deletion or deterministic deletion rejection, invalid-input rejection that leaves the artifact unchanged, rollback, index and reference reconciliation, deterministic repeated output, installed CLI behavior, and copied-project workflows — and MUST fail when an inventoried family has no declared operation-matrix coverage.
    scenarios:
      every-inventoried-family-has-matrix-coverage:
        - GIVEN: The YAML mutation inventory declares a set of artifact families
        - WHEN: The regression suite runs
        - THEN: Each inventoried family is exercised through its declared CLI mutation owner across the operations its lifecycle permits
      new-family-without-coverage-fails:
        - GIVEN: An artifact family is added to the mutation inventory without operation-matrix coverage
        - WHEN: The regression suite runs
        - THEN: It fails with a diagnostic naming the family that has no declared operation-matrix coverage
      invalid-input-leaves-artifact-unchanged:
        - GIVEN: A matrix case supplies invalid input to a family's CLI mutation owner
        - WHEN: The command is rejected
        - THEN: The target artifact and every dependent index or reference are unchanged from before the attempt
      lifecycle-rejection-is-proven:
        - GIVEN: A family whose deletion is recorded as human-only or not-applicable
        - WHEN: Deletion is attempted through that family's CLI mutation owner
        - THEN: The command exits non-zero with a deterministic diagnostic explaining the lifecycle rule and the artifact remains present
  cli-inventory-coverage-requires-registered-mutation-owner:
    strength: MUST
    statement: The repository YAML mutation coverage check MUST fail when a repository-owned artifact family declares an operation as CLI-owned without naming at least one CLI mutation owner, when a named owner is not a command the CLI registers, when a family declares direct-write paths while naming no registered CLI mutation owner at all, or when a declared direct-write path is covered only by mutation surfaces that classify it as something other than a writing surface, reporting each case as a distinct diagnostic identifying the family and the offending operation or path while leaving the existing path, surface, and evidence diagnostics unchanged.
    scenarios:
      cli-owned-operation-without-owner-fails:
        - GIVEN: A family in the mutation inventory records an operation state of CLI-owned and declares no CLI mutation owners
        - WHEN: The repository YAML mutation coverage check runs
        - THEN: It exits non-zero with a diagnostic naming the family and the operation that has no declared CLI mutation owner
      unregistered-owner-command-fails:
        - GIVEN: A family names a CLI mutation owner that the CLI does not register as a command
        - WHEN: The repository YAML mutation coverage check runs
        - THEN: It exits non-zero with a diagnostic naming the family and the unregistered command
      direct-write-path-without-any-owner-fails:
        - GIVEN: A family declares direct-write paths while naming no registered CLI mutation owner
        - WHEN: The repository YAML mutation coverage check runs
        - THEN: It exits non-zero with a diagnostic naming the family and the direct-write path that no CLI command owns
      direct-write-path-contradicted-by-its-surface-fails:
        - GIVEN: A declared direct-write path is covered only by mutation surfaces classified as read-only, external, legacy-input, or human-only
        - WHEN: The repository YAML mutation coverage check runs
        - THEN: It exits non-zero with a diagnostic naming the family and the path its surfaces do not agree is a writing surface
      current-inventory-passes:
        - GIVEN: The checked-in mutation inventory in which every repository-owned family names registered CLI owners for its CLI-owned operations
        - WHEN: The repository YAML mutation coverage check runs
        - THEN: It exits zero and reports no completeness diagnostics
  cli-help-states-artifact-operations-and-cross-file-effects:
    strength: MUST
    statement: For every CLI command that authors repository-owned YAML, the system MUST state, from the same command-metadata source that renders text help, JSON help, and MCP surfaces, which of create, update, named removal, and whole-artifact deletion each written artifact family supports, the CLI command that owns each supported operation, each operation the inventory records as not CLI-owned reported with its inventoried state rather than as an owned operation, the deletions that are refused, and the declared cross-file effects a write to that family also produces; root help MUST name the commands that discover this contract.
    scenarios:
      help-states-operations-and-owners:
        - GIVEN: A caller requests help for a command that authors a repository-owned YAML artifact family
        - WHEN: The system describes that command
        - THEN: The description states which of create, update, named removal, and whole-artifact deletion the family supports and names the CLI command that owns each supported operation
      help-states-refused-deletions-and-cross-file-effects:
        - GIVEN: An artifact family refuses whole-artifact deletion or declares reference side effects in the mutation inventory
        - WHEN: The system describes a command that writes that family
        - THEN: The description states the refused deletion and names each declared cross-file effect the write also produces
      root-help-names-discovery-commands:
        - GIVEN: A caller requests root help
        - WHEN: The system prints the command list
        - THEN: The output directs the caller to the commands that list bundled schemas, list bundled samples, and report the YAML mutation surface
      help-does-not-claim-unowned-operations:
        - GIVEN: The mutation inventory records an operation for a written family with a state other than cli-owned
        - WHEN: The system describes the command that writes that family
        - THEN: The operation is reported with its inventoried state and no owning CLI command is claimed for it
  cli-mutation-remediation-names-inspection-commands:
    strength: MUST
    statement: The system MUST include, in both successful YAML mutation results and mutation failure diagnostics, the ready-to-run commands that print the affected artifact's bundled schema and example, derived from the same source that supplies the reported artifact kind, schema key, schema_file path, and example key, so a rejected mutation names the exact command that prints the contract it violated.
    scenarios:
      failed-mutation-names-its-inspection-commands:
        - GIVEN: A YAML mutation is rejected because the candidate artifact fails validation
        - WHEN: The system emits the failure diagnostics
        - THEN: The diagnostics name the commands that print the affected artifact's bundled schema and example alongside the artifact kind and asset keys, and no file is written
      successful-mutation-reports-the-same-inspection-commands:
        - GIVEN: A YAML mutation commits successfully
        - WHEN: The system emits the mutation result
        - THEN: The result names the same inspection commands the corresponding failure diagnostics would report
  cli-publishes-ai-yaml-authoring-protocol:
    strength: MUST
    statement: The system MUST publish a single ordered CLI-only YAML authoring protocol that states, for any repository-owned YAML mutation, the order in which a caller reads command help, resolves the artifact schema, inspects the registered minimal example, executes the owning command with named arguments, inspects the structured result and changed paths, and runs the artifact-specific validation command, together with the terminal behavior that a caller whose required command is unavailable MUST stop with an actionable missing-capability report and MUST NOT fall back to editing the YAML directly; the protocol MUST be obtainable without naming an artifact kind, and every surface that presents it MUST present the same step order and the same terminal behavior.
    scenarios:
      protocol-is-obtainable-without-an-artifact-kind:
        - GIVEN: A caller is starting a repository-owned YAML mutation and has not yet chosen an artifact kind
        - WHEN: The caller requests the CLI-only YAML authoring protocol
        - THEN: The ordered steps from help lookup through schema resolution, example inspection, command execution, structured-result inspection, and validation are reported in a fixed order
        - THEN: The report states that an unavailable required command terminates the workflow with a missing-capability report and that direct YAML editing is not an available fallback
      protocol-request-is-read-only:
        - GIVEN: A caller requests the CLI-only YAML authoring protocol
        - WHEN: The system reports the protocol
        - THEN: No repository-owned YAML artifact is created, modified, or deleted
        - THEN: The request succeeds with empty error output
      every-surface-reports-the-same-protocol:
        - GIVEN: The protocol is presented on more than one caller-facing surface
        - WHEN: A caller compares the protocol reported by each surface
        - THEN: Each surface reports the same ordered steps and the same terminal missing-capability behavior
  cli-binds-authoring-protocol-to-artifact-kind:
    strength: MUST
    statement: The system MUST bind the CLI-only YAML authoring protocol to a named inventoried artifact kind on request, reporting for that kind the owning CLI command for each supported operation taken verbatim from the mutation inventory, the target artifact identity, its artifact-specific validation command, and for every artifact type the kind registers the bundled schema key together with the location its declared schema_file resolves to beneath the shared schema cache root, the bundled example key together with the location it resolves to beneath that cache, and the commands that print those assets; when the shared schema cache is unavailable the bundled schema and example keys MUST still be reported with no cache-derived path presented as resolved, and an artifact kind absent from the mutation inventory MUST be rejected with a deterministic diagnostic naming it and no partial protocol result.
    scenarios:
      bound-protocol-names-commands-and-assets:
        - GIVEN: A caller names an artifact kind recorded in the repository mutation inventory
        - WHEN: The caller requests the authoring protocol for that artifact kind
        - THEN: Each protocol step names the owning CLI command, target artifact identity, or asset lookup that applies to that artifact kind
        - THEN: The result reports the bundled schema key with its cache-resolved location, the bundled example key with its cache-resolved location, the commands that print them, and the artifact-specific validation command
      bound-protocol-covers-every-registered-artifact-type:
        - GIVEN: An inventoried artifact kind registers more than one artifact type
        - WHEN: The caller requests the authoring protocol for that artifact kind
        - THEN: Every registered artifact type is reported with its own bundled schema key, bundled example key, and resolved cache locations
        - THEN: The schema and example steps name one inspection command per registered artifact type and report no absent-asset condition
      bound-protocol-reports-inventoried-ownership-verbatim:
        - GIVEN: The mutation inventory records an operation for an artifact kind as something other than CLI-owned
        - WHEN: The caller requests the authoring protocol for that artifact kind
        - THEN: That operation is reported with its inventoried state and no owning CLI command is claimed for it
      bound-protocol-degrades-without-the-cache:
        - GIVEN: The shared schema cache is unavailable
        - WHEN: A caller requests the authoring protocol for an inventoried artifact kind
        - THEN: The bundled schema key and bundled example key are still reported
        - THEN: No cache-derived schema or example path is presented as resolved
      bound-protocol-rejects-unknown-artifact-kind:
        - GIVEN: A caller names an artifact kind that is absent from the mutation inventory
        - WHEN: The system resolves the request
        - THEN: The request fails with a deterministic diagnostic naming the unknown artifact kind
        - THEN: No partial protocol result is reported
  cli-mutation-capable-skills-carry-authoring-protocol:
    strength: MUST
    statement: Every bundled skill that directs a CLI-owned create, update, named removal, or deletion of a repository-owned YAML artifact MUST present a CLI-only YAML authoring pointer that names the artifact kinds the skill writes, names the command that renders the live artifact-bound authoring protocol, names the artifact family's validation command, and states the terminal boundary forbidding any fallback to editing YAML directly; the skill MUST NOT be required to restate the ordered authoring steps, the owning command's help lookup, or its per-artifact schema and example lookups, because the named command reports all of them bound to the artifact kind.
    scenarios:
      mutation-skill-presents-protocol-pointer:
        - GIVEN: a bundled skill that directs a CLI-owned mutation for an inventoried YAML artifact family
        - WHEN: the skill package is validated
        - THEN: the skill content names its artifact kinds, the command that renders the live authoring protocol, and its validation command
      mutation-skill-states-no-fallback-boundary:
        - GIVEN: a bundled mutation-capable skill and an authoring step that cannot be completed because a required command, schema, or example is unavailable
        - WHEN: the skill's authoring instructions are read
        - THEN: they direct the agent to stop and report the missing capability rather than write the YAML artifact by any other means
      restated-protocol-steps-are-not-required:
        - GIVEN: a bundled mutation-capable skill that carries the pointer, its artifact kinds, its validation command, and the boundary but restates no ordered protocol step
        - WHEN: the skill package is validated
        - THEN: validation reports no diagnostic for the absent step restatement
      read-only-skill-exempt:
        - GIVEN: a bundled skill whose CLI usage is limited to inspection and validation commands
        - WHEN: the skill package is validated
        - THEN: the skill is not required to present the authoring pointer and its existing instructions are unchanged
      no-direct-write-instruction-remains:
        - GIVEN: a bundled mutation-capable skill
        - WHEN: its instructions for mutating a repository-owned YAML path are read
        - THEN: no instruction directs writing that path through direct text editing, shell redirection, a heredoc, a constructed payload file, or an ad hoc writer script
  cli-validate-skills-rejects-direct-yaml-mutation-guidance:
    strength: MUST
    statement: The system MUST make validate-skills report deterministic path-specific diagnostics for a mutation-capable bundled skill package whose guidance directs direct YAML mutation, covering direct file editing or apply_patch of a repository-owned YAML artifact, shell or heredoc YAML construction, a raw YAML payload file supplied to a command, and fallback-to-hand-edit guidance for an unavailable command, while reporting no diagnostic for read-only YAML inspection guidance or illustrative CLI command examples.
    scenarios:
      validate-skills-flags-direct-edit-guidance:
        - GIVEN: a mutation-capable bundled skill package instructs the agent to edit a repository-owned YAML artifact directly
        - WHEN: validate-skills runs
        - THEN: the command reports a deterministic diagnostic naming the skill path and the CLI command that must be used instead
      validate-skills-flags-heredoc-payload-guidance:
        - GIVEN: a mutation-capable bundled skill package instructs the agent to build YAML through a heredoc or a raw payload file passed to a command
        - WHEN: validate-skills runs
        - THEN: the command reports a deterministic path-specific diagnostic for the payload-construction guidance
      validate-skills-flags-hand-edit-fallback:
        - GIVEN: a mutation-capable bundled skill package tells the agent to edit the artifact by hand when a required command is unavailable
        - WHEN: validate-skills runs
        - THEN: the command reports a deterministic path-specific diagnostic for the fallback guidance
      validate-skills-allows-read-only-inspection:
        - GIVEN: a bundled skill package documents read-only YAML inspection and illustrative CLI command examples only
        - WHEN: validate-skills runs
        - THEN: the command reports no direct-YAML-mutation diagnostic for that package
  cli-validate-skills-requires-mutation-command-mappings:
    strength: MUST
    statement: The system MUST make validate-skills report a deterministic path-specific diagnostic when a bundled skill package describes a repository-owned YAML mutation without declaring the owning CLI command in its commands block, or names a mutation flag in prose that the command metadata registry does not declare, and MUST determine which packages are mutation-capable from the mutation surface inventory and the command metadata registry rather than from the guidance text under inspection.
    scenarios:
      validate-skills-flags-missing-command-mapping:
        - GIVEN: a bundled skill package describes a repository-owned YAML mutation but its commands block declares no owning CLI command for it
        - WHEN: validate-skills runs
        - THEN: the command reports a deterministic diagnostic naming the skill path and the missing command mapping
      validate-skills-flags-undeclared-mutation-flag:
        - GIVEN: a bundled skill package names a mutation flag that the owning command's metadata does not declare
        - WHEN: validate-skills runs
        - THEN: the command reports a deterministic diagnostic naming the skill path, the command, and the undeclared flag
      validate-skills-scope-survives-guidance-deletion:
        - GIVEN: a mutation-capable bundled skill package has its CLI-only authoring guidance removed entirely
        - WHEN: validate-skills runs
        - THEN: the package is still classified as mutation-capable and the command reports diagnostics for the missing guidance rather than treating the package as exempt
  cli-generate-tasks-supports-positional-placement:
    strength: MUST
    statement: 'The system MUST let a generate tasks invocation state where a task belongs within its section, through two positional arguments that name an anchor task and place the subject task immediately before or immediately after it. Positional placement MUST apply both to a task the invocation creates and to a task already recorded in that section, and moving a recorded task MUST preserve its status, its command, and any field the invocation does not supply. The anchor MUST live in the same section as the subject task, and the command MUST exit non-zero without writing anything when the anchor is absent from that section, when the anchor names a different section, when the anchor names the subject task itself, when both positional arguments are supplied for one task, or when the anchor names a task that only a later task group in the same invocation creates. Task status MUST NOT constrain placement: an anchor is validated on identity and section membership only. An invocation that supplies neither positional argument MUST behave exactly as before, appending a new task to the end of its section and leaving a recorded task in place.'
    scenarios:
      positioned-insert-places-new-task-ahead-of-anchor:
        - GIVEN: a change task list records several pending tasks in a section, and an agent discovers work that must run before one of them
        - WHEN: the agent runs generate tasks naming that section, a new task id, its text, and the positional argument that places it before the existing task
        - THEN: the new task is written immediately ahead of the named anchor rather than at the end of the section, and the next apply invocation returns the newly placed task id
      positioned-move-preserves-recorded-task-state:
        - GIVEN: a change task list records a task whose status is complete and which carries a command value
        - WHEN: an agent runs generate tasks naming that task id with a positional argument anchoring it to another task in the same section, and supplies no other field
        - THEN: the task is relocated to the requested position while its complete status, its command value, and its existing text are preserved, and every sibling task keeps its own status, command, and relative position
      absent-positional-arguments-keep-existing-placement:
        - GIVEN: a change task list records tasks in a section
        - WHEN: an agent runs generate tasks supplying neither positional argument, both for a new task id and for a task already recorded
        - THEN: the new task is appended to the end of its section and the recorded task keeps its current position, exactly as before the positional arguments existed
      anchor-outside-the-named-section-is-refused:
        - GIVEN: a change task list records tasks in more than one section
        - WHEN: an agent runs generate tasks placing a task with an anchor that lives in a different section than the one named
        - THEN: the command exits non-zero naming both the anchor and the two sections, the task list is left unchanged, and the caller is directed to the existing removal and restatement path for moving a task between sections
      conflicting-or-self-referential-anchors-are-refused:
        - GIVEN: a change task list records tasks in a section
        - WHEN: an agent supplies both positional arguments for one task, or supplies an anchor naming that same task
        - THEN: the command exits non-zero naming the offending task id and leaves the task list unchanged
      an-anchor-created-later-in-the-same-invocation-is-refused:
        - GIVEN: a single generate tasks invocation names several task groups in one section
        - WHEN: an earlier group anchors to a task id that only a later group in the same invocation creates
        - THEN: the command exits non-zero reporting that the anchor is not yet present, and leaves the task list unchanged
      an-anchor-created-earlier-in-the-same-invocation-resolves:
        - GIVEN: a single generate tasks invocation names several task groups in one section
        - WHEN: a later group anchors to a task id that an earlier group in the same invocation created
        - THEN: the anchor resolves against the section state as that group is applied, and both tasks are written in the requested order
      task-status-does-not-constrain-placement:
        - GIVEN: a change task list records a completed task followed by pending tasks in the same section
        - WHEN: an agent places a pending task immediately ahead of the completed one
        - THEN: the command exits zero with no diagnostic, the pending task is written ahead of the completed task, and the completed task keeps its status and position relative to its other siblings
  cli-skills-document-task-order-adjustment:
    strength: MUST
    statement: Every bundled skill that directs an agent to author or extend a change task list MUST document how to adjust task order, stating that a task which must run before existing pending work is placed with a positional anchor rather than appended, and the apply skill MUST additionally document that work finished out of list order is recorded by addressing the task by id rather than by repeating the positional apply command. The set of skills governed by this requirement MUST be discovered by scanning bundled skill content for task-list authoring usage rather than from an enumerated list, and an automated skill-validation check MUST fail, naming the offending skill file, when a governed skill omits the guidance.
    scenarios:
      task-authoring-skills-state-how-to-place-a-task:
        - GIVEN: a bundled skill directs an agent to populate or extend a change task list
        - WHEN: an agent reads that skill before writing tasks
        - THEN: the skill states that a task which must run before existing pending work is placed with a positional anchor rather than appended, and names the arguments that express it
      apply-skill-states-how-to-record-out-of-order-work:
        - GIVEN: an agent implementing a change finishes work in a different order than the task list records
        - WHEN: the agent reads the apply skill for how to record that completion
        - THEN: the skill states that the completed task is addressed by id rather than by repeating the positional apply command, and explains that repeating apply completes whichever task is next in list order
      skill-validation-fails-when-guidance-is-missing:
        - GIVEN: a bundled skill that directs task-list authoring has had its task-ordering guidance removed
        - WHEN: the skill-validation command runs
        - THEN: the command exits non-zero with a diagnostic naming that skill file and the missing guidance
      governed-skill-set-is-discovered-by-scanning:
        - GIVEN: a bundled skill that directs task-list authoring is added without being listed anywhere in the validation code
        - WHEN: the skill-validation command runs against it while it carries no task-ordering guidance
        - THEN: the scan discovers the skill as governed and the check fails for it, so no task-authoring skill escapes the requirement by being absent from a hand-maintained list
  cli-ready-names-empty-spec-remediation:
    strength: MUST
    statement: 'When the ready proposal-handoff command reports that a change has no delta spec files and no explicit empty-spec design decision, the resulting proposal_readiness diagnostic MUST carry remediation concrete enough to apply without consulting CLI source or external documentation: the repo-relative specs directory of the change, and two labeled remedies -- (A) author a delta spec, quoting the generate delta-spec command with the change name filled in and naming .strict-spec-driven/specs/INDEX.yaml as the source of valid target ids; (B) record an explicit empty-spec decision, quoting the generate design command with the change name and a decision id filled in, and naming every decision id the readiness check accepts as such evidence. The suggested-command list MUST offer both invocations. The accepted decision ids named by the diagnostic MUST be exactly the ids the readiness check treats as an explicit empty-spec decision.'
    scenarios:
      diagnostic-names-both-remedies-with-runnable-commands:
        - GIVEN: a strict change has no delta spec files and records no design decision that the readiness check accepts as an explicit empty-spec decision
        - WHEN: strict-spec-cli ready <change-name> is executed
        - THEN: the proposal_readiness diagnostic names the change's repo-relative specs directory and states remedy A with the generate delta-spec command carrying the change name and .strict-spec-driven/specs/INDEX.yaml as the source of valid target ids
        - THEN: the same diagnostic states remedy B with the generate design command carrying the change name and a decision id, and names every decision id the readiness check accepts as an explicit empty-spec decision
      suggestions-offer-both-remedy-commands:
        - GIVEN: the same change with no delta spec files and no accepted empty-spec decision
        - WHEN: strict-spec-cli ready <change-name> is executed
        - THEN: the returned suggestions include both the delta-spec authoring invocation and the design invocation that records an empty-spec decision
      named-ids-match-the-ids-readiness-accepts:
        - GIVEN: the set of decision ids the readiness check treats as an explicit empty-spec decision
        - WHEN: the missing-delta-spec diagnostic is produced
        - THEN: the decision ids named in the diagnostic are exactly that set, so an id the check accepts is never omitted from the guidance and an id it rejects is never advertised
  cli-mutation-capable-skill-classification-regression:
    strength: MUST
    statement: The regression suite MUST assert the exact set of bundled skills classified as mutation-capable, so a change to bundled skill guidance that reclassifies a skill fails the suite rather than passing because the classification was checked only by inspection, and MUST prove the classifier still distinguishes the two cases rather than trusting a pinned list that a broken classifier would also satisfy.
    scenarios:
      classification-set-is-pinned-by-a-test:
        - GIVEN: the bundled skill packages and the mutation inventory
        - WHEN: the regression suite runs
        - THEN: the suite asserts the named set of mutation-capable skills and the named read-only skills, and asserts that the two named sets together account for every skill package on disk
      classifier-distinguishes-both-cases:
        - GIVEN: guidance naming an inventory-registered mutation command and guidance naming only inspection commands
        - WHEN: the regression suite runs
        - THEN: the first is classified mutation-capable and the second is not, so a classifier that answered the same way for every input would fail the suite
  cli-roadmap-transition-skill-covers-every-transition-operation:
    strength: MUST
    statement: The system MUST provide a bundled roadmap state-transition skill that selects its transition from an explicit operation naming exactly one of pause, resume, defer, refine, move, reopen, archive, and sync, and MUST make strict skill content validation require, for that skill, the owning CLI command mapping and the guidance content of every one of those eight operations rather than an arbitrary subset. The reorder operation MUST NOT be one of them, because it is owned by its own bundled skill package.
    scenarios:
      transition-skill-declares-every-operation-command:
        - GIVEN: the bundled roadmap state-transition skill package declares one owning strict roadmap CLI command for each of its eight operations and carries the guidance for each
        - WHEN: strict skill content validation is executed
        - THEN: the roadmap skill content checks pass
      missing-operation-guidance-is-rejected:
        - GIVEN: the bundled roadmap state-transition skill package omits the command mapping or the guidance content for any one of the eight operations
        - WHEN: strict skill content validation is executed
        - THEN: the roadmap skill content checks fail and the diagnostics identify the failing skill package deterministically
      unnamed-operation-stops-for-a-human-answer:
        - GIVEN: a roadmap state-transition request that names none of the eight operations
        - WHEN: the bundled roadmap state-transition skill's instructions are read
        - THEN: they direct the agent to stop and ask which operation is intended rather than infer one from the request
      reorder-is-not-a-transition-operation:
        - GIVEN: the bundled roadmap state-transition skill package is inspected for the reorder operation
        - WHEN: strict skill content validation is executed
        - THEN: the skill declares no roadmap-reorder command mapping and no reorder operation row, and its reorder cross-reference names the standalone roadmap reorder skill, so exactly one bundled package owns the operation
  cli-skills-state-workflow-state-precondition-once:
    strength: MUST
    statement: 'A bundled strict skill MUST state the `check-workflow-state` precondition, the init guidance, and the do-not-run-init statement at most once per skill file; when any two sections of the same skill file both state them, skill packaging validation MUST report a diagnostic naming the offending skill, regardless of which sections those are. The requirement constrains repetition, not placement: a skill that states the guidance in exactly one section satisfies it regardless of which section that is, a Prerequisites section carrying a skill-specific precondition remains valid, and the section that declares the skill''s commands is not a restatement because every skill keeps it by design.'
    scenarios:
      validation-rejects-a-restated-precondition:
        - GIVEN: a bundled strict skill whose Steps section carries the check-workflow-state precondition and whose Prerequisites section restates it
        - WHEN: the strict skill validation command runs
        - THEN: the command exits non-zero and reports a diagnostic naming that skill path
      validation-rejects-a-restatement-between-any-two-sections:
        - GIVEN: a bundled strict skill that carries no Prerequisites section and states the check-workflow-state precondition in two other sections of the same file
        - WHEN: the strict skill validation command runs
        - THEN: the command exits non-zero and reports a diagnostic naming that skill path, because the rule is about repetition rather than about the Prerequisites section
      validation-accepts-guidance-stated-in-one-section:
        - GIVEN: a bundled strict skill that states the check-workflow-state precondition, the init guidance, and the do-not-run-init statement in exactly one section, whether that is Steps or Prerequisites
        - WHEN: the strict skill validation command runs
        - THEN: the command reports no repetition diagnostic for that skill
      validation-accepts-a-skill-specific-precondition:
        - GIVEN: a bundled strict skill whose Prerequisites section states only a precondition specific to that skill, such as an already-archived change or an existing legacy workflow directory
        - WHEN: the strict skill validation command runs
        - THEN: the command reports no diagnostic for that skill
      existing-workflow-state-guidance-check-is-unaffected:
        - GIVEN: a bundled strict skill that requires existing strict workflow state and carries no Prerequisites section
        - WHEN: the strict skill validation command runs
        - THEN: the existing workflow-state guidance check still passes because the Steps section carries the precondition, the init guidance, and the do-not-run-init statement
      the-command-declaration-section-is-not-a-restatement:
        - GIVEN: a bundled strict skill whose commands section names the check-workflow-state command and whose Steps section states the precondition once
        - WHEN: the strict skill validation command runs
        - THEN: the command reports no repetition diagnostic, because the declared command mapping is a reference rather than a second statement of the instruction
  cli-validate-skills-rejects-guidance-naming-an-absent-skill:
    strength: MUST
    statement: Skill packaging validation MUST report a diagnostic when a bundled skill's guidance names a strict skill package that does not exist under skills/, and the diagnostic MUST name the offending SKILL.md path, the line the reference appears on, and the missing skill name; the validation command MUST exit non-zero when any such reference is present, so a project that runs only the shipped command observes the failure without depending on this repository's regression suite.
    scenarios:
      validation-rejects-a-reference-to-an-absent-skill:
        - GIVEN: a bundled strict skill whose guidance names a strict skill package that has no directory under skills/
        - WHEN: the strict skill validation command runs
        - THEN: the command exits non-zero and reports a diagnostic naming the offending SKILL.md path, the line of the reference, and the missing skill name
      validation-accepts-a-reference-to-a-packaged-skill:
        - GIVEN: a bundled strict skill whose guidance names only strict skill packages that exist under skills/, plus the non-skill strict identifiers that share the prefix
        - WHEN: the strict skill validation command runs
        - THEN: the command reports no absent-skill diagnostic for that skill
      scope-comes-from-the-packaged-skill-directories:
        - GIVEN: the set of skill packages discovered by scanning skills/
        - WHEN: skill packaging validation checks a skill's references against that set
        - THEN: the set of valid names is derived from the discovered directories rather than from a list written inside the guidance being checked, so deleting a skill package makes every reference to it fail
  cli-roadmap-reorder-skill-is-standalone:
    strength: MUST
    statement: The system MUST package a standalone bundled roadmap reorder skill that owns the reorder operation alone, and MUST make strict skill content validation require its roadmap-reorder and roadmap-renumber command mappings together with the guidance that milestone order comes from the optional integer order field rather than an id prefix, that placement is expressed with --before, --after, or --order, that roadmap-renumber is run only when no integer gap remains between the requested neighbours or the user asks for it, and that a reorder contradicting a declared dependency stops for an explicit human answer.
    scenarios:
      reorder-skill-is-packaged-and-validated:
        - GIVEN: the bundled skill set and marketplace metadata are inspected
        - WHEN: validate-skills runs
        - THEN: a strict-roadmap-reorder skill package and its marketplace entry both exist, and its roadmap-reorder and roadmap-renumber command mappings are validated against the bundled CLI commands
      missing-reorder-guidance-is-rejected:
        - GIVEN: the bundled roadmap reorder skill omits the order-field source, the placement flags, the roadmap-renumber fallback, or the dependency-order confirmation guidance
        - WHEN: strict skill content validation is executed
        - THEN: validation fails and the diagnostics name the strict-roadmap-reorder package deterministically
      reorder-has-exactly-one-owning-skill:
        - GIVEN: the bundled skill set is searched for packages declaring a roadmap-reorder command mapping
        - WHEN: strict skill content validation is executed
        - THEN: the standalone roadmap reorder skill is the only such package, so an operator choosing how to reorder a milestone has one entry point rather than two

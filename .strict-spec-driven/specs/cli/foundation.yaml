    strength: MUST
    statement: The system MUST provide deterministic harness inference and doctor commands that help agents draft and repair .strict-spec-driven/harness.yaml from repository metadata without executing lifecycle commands, while preserving explicit human control over production and stateful lifecycle operations.
    scenarios:
      ai-assisted-harness-draft-is-safe:

        - WHEN: an operator or AI agent runs strict-spec-driven harness-infer
        - THEN: the command emits a valid harness declaration draft that identifies likely development components, environment variable names, URLs or ports when discoverable, and manual or disabled defaults for uncertain, production, or stateful lifecycle operations

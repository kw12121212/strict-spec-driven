      workflow-state-check-succeeds-when-directory-exists:
        - GIVEN: a repository contains a .strict-spec-driven/ directory
        - WHEN: strict-spec-driven check-workflow-state is executed from that repository root
        - THEN: the command exits with status 0
        - THEN: the command reports that strict workflow state exists
      workflow-state-check-fails-when-directory-is-missing:

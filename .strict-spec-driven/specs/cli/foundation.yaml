            text: repository automated checks are executed
          - kind: THEN
            text: the migration skill content checks pass
      - id: automated-checks-reject-placeholder-migration-skill-content
        steps:
          - kind: GIVEN
            text: >-
              the strict migration skill keeps a generic placeholder command block or omits required
              migration guidance
          - kind: WHEN
            text: repository automated checks are executed
          - kind: THEN
            text: the migration skill content checks fail
          - kind: AND
            text: diagnostics identify the failing skill package deterministically
  - id: cli-migrate-converts-bootstrap-workflow-state
    strength: MUST
    statement: >-
      The system MUST provide a `migrate` subcommand that reads legacy `.spec-driven/` workflow
      state and migrates supported bootstrap config, main specs, delta specs, active and archived
      change artifacts, roadmap index, roadmap milestones, and the specs index into strict YAML
      output under `.strict-spec-driven/`, initializes any remaining required strict scaffold
      assets, and reports only unsupported or ambiguous legacy artifacts as manual follow-up items.
    scenarios:
      - id: migrate-converts-legacy-specs-and-change-artifacts-into-strict-workflow-state
        steps:
          - kind: GIVEN
            text: >-
              legacy main specs, delta specs, and active or archived changes exist under
              `.spec-driven/`
          - kind: AND
            text: no unsafe strict target conflict blocks execution
          - kind: WHEN
            text: '`strict-spec-driven migrate` is executed'
          - kind: THEN
            text: the command writes strict YAML spec and change artifacts under `.strict-spec-driven/`
          - kind: AND
            text: the command updates the strict spec index to reference the migrated main spec outputs
          - kind: AND
            text: >-
              the migrated artifacts preserve the stable identifiers, mappings, task state, question
              state, and archive-date behavior required by the strict workflow
          - kind: AND
            text: the source `.spec-driven/` artifacts remain unchanged
  - id: cli-migrate-converts-roadmap-and-project-state
    strength: MUST
    statement: >-
      The system MUST convert legacy `.spec-driven/roadmap/` Markdown artifacts and the legacy specs
      index into strict YAML equivalents during a `migrate` run, writing results under
      `.strict-spec-driven/roadmap/` and the strict specs index path.
    scenarios:
      - id: migrate-converts-roadmap-index-and-milestones
        steps:
          - kind: GIVEN
            text: >-
              legacy `roadmap/INDEX.md` and one or more `roadmap/milestones/*.md` files exist under
              `.spec-driven/`
          - kind: WHEN
            text: '`strict-spec-driven migrate` is executed'
          - kind: THEN
            text: >-
              the roadmap index is written as a strict YAML artifact under
              `.strict-spec-driven/roadmap/`
          - kind: AND
            text: >-
              each milestone file is converted to a strict YAML milestone artifact preserving goal,
              scope, done criteria, dependencies, risks, notes, status, and planned change entries
          - kind: AND
            text: the converted artifacts appear in the migration report as converted entries
      - id: migrate-converts-specs-index
        steps:
          - kind: GIVEN
            text: a legacy `specs/INDEX.md` exists under `.spec-driven/`
          - kind: WHEN
            text: '`strict-spec-driven migrate` is executed'
          - kind: THEN
            text: >-
              the specs index is written as a strict YAML artifact under
              `.strict-spec-driven/specs/`
          - kind: AND
            text: the converted artifact appears in the migration report as a converted entry
      - id: unsupported-roadmap-markdown-shape-becomes-manual-follow-up
        steps:
          - kind: GIVEN
            text: >-
              a legacy roadmap artifact has a Markdown structure that cannot be deterministically
              mapped to strict YAML fields
          - kind: WHEN
            text: '`strict-spec-driven migrate` is executed'
          - kind: THEN
            text: the artifact appears in the migration report as a manual follow-up item
          - kind: AND
            text: no strict YAML output is invented for that artifact
  - id: cli-migrate-enforces-preflight-and-overwrite-protection
    strength: MUST
    statement: >-
      The system MUST reject migration runs that cannot proceed safely and report the blocking
      preflight or overwrite-protection reason deterministically.
    scenarios:
      - id: migrate-rejects-unsafe-strict-target-overwrite
        steps:
          - kind: GIVEN
            text: '`.strict-spec-driven/` already contains conflicting workflow state'
          - kind: AND
            text: no explicit safe rerun policy allows overwriting that state
          - kind: WHEN
            text: '`strict-spec-driven migrate` is executed'
          - kind: THEN
            text: the command exits non-zero
          - kind: AND
            text: the result identifies the overwrite-protection conflict
          - kind: AND
            text: existing strict target files are left unchanged
      - id: migrate-rejects-missing-legacy-source-state
        steps:
          - kind: GIVEN
            text: supported legacy workflow artifacts are not present under `.spec-driven/`
          - kind: WHEN
            text: '`strict-spec-driven migrate` is executed'
          - kind: THEN
            text: the command exits non-zero
          - kind: AND
            text: the result identifies the missing bootstrap source state
  - id: cli-migrate-emits-structured-report-output
    strength: MUST
    statement: >-
      The system MUST emit a structured migration report for each migration run so the operator can
      review converted core workflow artifacts, remaining deferred artifacts, failures, warnings,
      and manual follow-up items.
    scenarios:
      - id: migrate-report-distinguishes-converted-core-workflow-artifacts-from-deferred-artifacts
        steps:
          - kind: GIVEN
            text: >-
              `strict-spec-driven migrate` converts supported core workflow artifacts while roadmap
              or project-state converters are still pending
          - kind: WHEN
            text: the migration result is inspected
          - kind: THEN
            text: >-
              converted spec and change artifacts appear in converted entries with their strict
              target paths
          - kind: AND
            text: >-
              unsupported roadmap or project-state artifacts remain identifiable through skipped
              entries or manual follow-up items with source references
  - id: cli-migrate-force-rerun
    strength: MUST
    statement: >-
      The system MUST allow `strict-spec-driven migrate` to rerun into an existing non-empty
      `.strict-spec-driven/` directory only when the operator explicitly passes `--force` or `-f`.
    scenarios:
      - id: rerun-without-force-stays-blocked
        steps:
          - kind: GIVEN
            text: '`strict-spec-driven migrate` already populated `.strict-spec-driven/`'
          - kind: WHEN
            text: the operator runs `strict-spec-driven migrate` again without `--force`
          - kind: THEN
            text: the command exits non-zero
          - kind: AND
            text: the result identifies the strict target conflict
      - id: rerun-with-force-reuses-the-same-structured-output
        steps:
          - kind: GIVEN
            text: '`strict-spec-driven migrate` already populated `.strict-spec-driven/`'
          - kind: WHEN
            text: the operator runs `strict-spec-driven migrate --force`
          - kind: THEN
            text: the command exits zero
          - kind: AND
            text: the result matches the structured migration report from the initial successful run
      - id: short-force-flag-reruns-migration
        steps:
          - kind: GIVEN
            text: '`strict-spec-driven migrate` already populated `.strict-spec-driven/`'
          - kind: WHEN
            text: the operator runs `strict-spec-driven migrate -f`
          - kind: THEN
            text: the command exits zero
          - kind: AND
            text: the result matches the structured migration report from the initial successful run
  - id: cli-migrate-report-collections-are-always-arrays
    strength: MUST
    statement: >-
      The system MUST emit `converted`, `skipped`, `warnings`, `errors`, and `manualFollowUp` as
      top-level array fields in every migration report, including successful, partial, and blocked
      runs.
    scenarios:
      - id: successful-migration-keeps-warning-collections-explicit
        steps:
          - kind: GIVEN
            text: a migration run converts all supported artifacts without deferred legacy spec files
          - kind: WHEN
            text: the migration report is inspected
          - kind: THEN
            text: '`warnings` is present as an array'
          - kind: AND
            text: '`manualFollowUp` is present as an array'
      - id: partial-migration-keeps-deferred-collections-explicit
        steps:
          - kind: GIVEN
            text: >-
              a migration run converts supported artifacts while deferring ambiguous legacy spec
              files
          - kind: WHEN
            text: the migration report is inspected
          - kind: THEN
            text: '`skipped` is present as an array'
          - kind: AND
            text: '`warnings` is present as an array'
          - kind: AND
            text: '`manualFollowUp` is present as an array'
      - id: blocked-migration-keeps-report-collections-explicit
        steps:
          - kind: GIVEN
            text: a migration run is blocked before conversion completes
          - kind: WHEN
            text: the migration report is inspected
          - kind: THEN
            text: '`converted` is present as an array'
          - kind: AND
            text: '`skipped` is present as an array'
          - kind: AND
            text: '`warnings` is present as an array'
          - kind: AND
            text: '`errors` is present as an array'
          - kind: AND
            text: '`manualFollowUp` is present as an array'
  - id: cli-migrate-supports-repository-self-hosting
    strength: MUST
    statement: >-
      The system MUST allow a repository's actual bootstrap `.spec-driven/` workflow state to be
      migrated into `.strict-spec-driven/` output that is usable as the repository's active strict
      workflow state without rewriting the preserved bootstrap source artifacts.
    scenarios:
      - id: self-host-cutover-migrates-repository-workflow-state
        steps:
          - kind: GIVEN
            text: >-
              a repository contains bootstrap specs, roadmap artifacts, and archived or active
              changes under `.spec-driven/`
          - kind: WHEN
            text: '`strict-spec-driven migrate` is executed for the repository cutover'
          - kind: THEN
            text: >-
              the command writes corresponding strict YAML workflow state under
              `.strict-spec-driven/`
          - kind: AND
            text: >-
              the migrated output preserves the identities and relationships needed by strict
              workflow commands
          - kind: AND
            text: the source `.spec-driven/` artifacts remain unchanged
      - id: self-host-cutover-normalizes-blank-legacy-mappings
        steps:
          - kind: GIVEN
            text: >-
              a legacy archived delta leaves `mapping.implementation` or `mapping.tests` blank in
              Markdown frontmatter
          - kind: WHEN
            text: '`strict-spec-driven migrate` is executed for the repository cutover'
          - kind: THEN
            text: >-
              the migrated strict delta keeps those mapping fields as empty structured path
              collections
          - kind: AND
            text: the change is not deferred only because the legacy mapping fields were blank
      - id: roadmap-status-accepts-migrated-roadmap-index-paths
        steps:
          - kind: GIVEN
            text: >-
              `strict-spec-driven migrate` has produced strict roadmap state for the repository
              cutover
          - kind: WHEN
            text: '`strict-spec-driven roadmap-status` reads the migrated strict roadmap'
          - kind: THEN
            text: migrated milestone paths resolve without reference diagnostics
          - kind: AND
            text: roadmap status validation succeeds against the migrated roadmap index
  - id: cli-ship-reads-archived-change
    strength: MUST
    statement: >-
      The system MUST provide a `ship` subcommand that resolves a named archived change under
      `.strict-spec-driven/changes/archive/` and reads its proposal summary, supporting both exact
      archive directory names and bare change names expanded via date-prefix matching.
    scenarios:
      - id: ship-resolves-exact-archive-directory-name
        steps:
          - kind: GIVEN
            text: '`.strict-spec-driven/changes/archive/<YYYY-MM-DD>-<name>/` exists'
          - kind: WHEN
            text: '`strict-spec-driven ship <YYYY-MM-DD>-<name>` is executed'
          - kind: THEN
            text: the command reads the archived change artifacts from that directory
      - id: ship-expands-bare-name-to-date-prefixed-archive-directory
        steps:
          - kind: GIVEN
            text: '`.strict-spec-driven/changes/archive/<YYYY-MM-DD>-<name>/` exists'
          - kind: WHEN
            text: '`strict-spec-driven ship <name>` is executed with the bare change name'
          - kind: THEN
            text: >-
              the command resolves the archived directory by date-prefix expansion and reads its
              artifacts
      - id: ship-reports-ambiguity-when-multiple-date-prefixed-matches-exist
        steps:
          - kind: GIVEN
            text: >-
              multiple archive directories matching `*-<name>` exist under
              `.strict-spec-driven/changes/archive/`
          - kind: WHEN
            text: '`strict-spec-driven ship <name>` is executed with the bare name'
          - kind: THEN
            text: the command exits non-zero
          - kind: AND
            text: >-
              the error message lists the matching archive directories and asks the operator to
              specify the full archive directory name
      - id: ship-rejects-missing-archived-change
        steps:
          - kind: GIVEN
            text: no matching archived directory exists for the given name
          - kind: WHEN
            text: '`strict-spec-driven ship <name>` is executed'
          - kind: THEN
            text: the command exits non-zero
          - kind: AND
            text: an error message is written to stderr indicating the archived change was not found
  - id: cli-ship-emits-deterministic-json-output
    strength: MUST
    statement: >-
      The system MUST emit a deterministic JSON object to stdout from the `ship` subcommand
      containing `changeName`, `archivePath`, `proposalSummary`, and `roadmapSnapshot`.
    scenarios:
      - id: ship-output-is-parseable-json
        steps:
          - kind: GIVEN
            text: '`strict-spec-driven ship <name>` resolves a valid archived change'
          - kind: WHEN
            text: command stdout is parsed as JSON
          - kind: THEN
            text: the JSON includes `changeName` as a string
          - kind: AND
            text: the JSON includes `archivePath` as the resolved archive directory path
          - kind: AND
            text: the JSON includes `proposalSummary` derived from the archived `proposal.yaml`
          - kind: AND
            text: >-
              the JSON includes `roadmapSnapshot` reflecting current roadmap milestone and planned
              change state
      - id: ship-exits-zero-for-a-valid-archived-change
        steps:
          - kind: GIVEN
            text: a named archived change exists and its artifacts are readable
          - kind: WHEN
            text: '`strict-spec-driven ship <name>` is executed'
          - kind: THEN
            text: the command exits with exit code zero
  - id: cli-ship-skill-content-validation-smoke-coverage
    strength: MUST
    statement: >-
      The system MUST include automated checks that exercise strict ship skill content for both
      passing and failing states, not only package-shape validation.
    scenarios:
      - id: automated-checks-accept-aligned-ship-skill-content
        steps:
          - kind: GIVEN
            text: >-
              `strict-spec-ship/SKILL.md` contains an explicit `ship` command reference and
              `.strict-spec-driven/` workflow guidance
          - kind: WHEN
            text: repository automated checks are executed
          - kind: THEN
            text: the ship skill content checks pass
      - id: automated-checks-reject-placeholder-ship-skill-content
        steps:
          - kind: GIVEN
            text: >-
              `strict-spec-ship/SKILL.md` retains a generic placeholder command block or omits
              `.strict-spec-driven/` workflow guidance
          - kind: WHEN
            text: repository automated checks are executed
          - kind: THEN
            text: the ship skill content checks fail
          - kind: AND
            text: diagnostics identify the failing skill package deterministically

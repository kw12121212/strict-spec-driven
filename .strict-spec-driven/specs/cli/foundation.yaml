        - WHEN: proposal-readiness CLI behavior is executed for that change
        - THEN: the output reports missing proposal, design, task-list, question-list, or delta-spec structure that prevents a decision-ready handoff
        - AND: the diagnostics are deterministic and identify the affected artifact path and field or workflow condition

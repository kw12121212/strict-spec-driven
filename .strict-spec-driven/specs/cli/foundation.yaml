        - GIVEN: a strict project contains a harness declaration and project-local wrapper expectations
        - WHEN: an operator or AI agent runs strict-spec-driven harness-doctor
        - THEN: the command reports deterministic diagnostics for missing working directories, missing script commands, wrapper drift, undeclared environment samples, schema or planning failures, and safety policy issues without starting or stopping services
  cli-harness-logs-bounded-output:
    strength: MUST
    statement: The system MUST return a conservative tail-line slice from harness-logs by default, support --tail <n> for explicit line selection, and document --all as the explicit full-output override so agents can inspect long-running managed component logs without flooding their context window.
    scenarios:
      default-tail-bound-limits-output:
        - GIVEN: a managed component has a captured log file larger than the documented default tail-line bound
        - WHEN: an operator or AI agent runs strict-spec-driven harness-logs for that component without flags
        - THEN: the command returns only the most recent lines up to the documented default bound
      explicit-tail-count-overrides-default:
        - GIVEN: a managed component has a captured log file larger than the default tail-line bound
        - WHEN: an operator or AI agent runs strict-spec-driven harness-logs --tail <n> for that component
        - THEN: the command returns the most recent requested number of lines
      all-override-returns-full-captured-log:
        - GIVEN: a managed component has a captured log file larger than the documented default tail-line bound
        - WHEN: an operator or AI agent runs strict-spec-driven harness-logs --all for that component
        - THEN: the command returns the full captured log content and the command usage or HARNESS.md documents the override
  cli-harness-status-logs-follow-runtime-model:
    strength: MUST
    statement: The system MUST have harness-plan, harness-doctor, harness-status, harness-logs, and harness-infer follow the runtime status/log model so agents are not asked to author executable status or logs commands that the lifecycle never runs.
    scenarios:
      planning-and-doctor-respect-descriptive-status-logs:
        - GIVEN: a strict project uses a harness declaration where status/logs are omitted or declared with descriptive readonly metadata
        - WHEN: an operator or AI agent runs strict-spec-driven harness-plan, harness-doctor, or harness-infer
        - THEN: planning and diagnostics do not require executable status/logs commands and the resulting behavior keeps status runtime-derived and logs sourced from the captured log file
  cli-harness-infer-detects-runtime-signals-beyond-node:
    strength: MUST
    statement: The system MUST let harness-infer detect supported non-Node runtime signals with a deterministic precedence order, preserve manual and disabled safety defaults in inferred drafts, and report explicit evidence when no lifecycle command can be inferred.
    scenarios:
      package-scripts-stay-highest-precedence:
        - GIVEN: a repository exposes both package.json dev/start/serve scripts and other supported runtime signals such as compose, Procfile, or Makefile metadata
        - WHEN: an operator or AI agent runs strict-spec-driven harness-infer
        - THEN: the draft uses the package-script-derived command and records evidence for the selected signal without mixing multiple runtime sources
      supported-non-node-signal-produces-safe-draft:
        - GIVEN: a repository lacks package dev/start/serve scripts but contains a supported compose, Procfile, or Makefile runtime signal
        - WHEN: an operator or AI agent runs strict-spec-driven harness-infer
        - THEN: the draft includes a manual development start command derived from the first supported non-Node signal, keeps production disabled, and records which signal was used
      unsupported-repository-explains-no-detection:
        - GIVEN: a repository lacks package dev/start/serve scripts and other supported runtime signals
        - WHEN: an operator or AI agent runs strict-spec-driven harness-infer
        - THEN: the draft remains manual and reports explicit evidence and an unavailable condition explaining that no lifecycle command could be inferred
  cli-harness-start-env-guidance-aligns-with-doctor:
    strength: MUST
    statement: The system MUST make harness-start missing-required-environment failures explicitly explain that harness-doctor verifies env-sample documentation only, the harness does not load .env files, and required values must be exported or sourced before retrying.
    scenarios:
      documented-env-sample-still-requires-exported-values:
        - GIVEN: a harness component requires an environment variable and that variable name is documented in an env sample file
        - WHEN: an operator or AI agent runs strict-spec-driven harness-start without exporting or sourcing that required value into the current process environment
        - THEN: harness-start fails with a diagnostic that says the variable is missing from the current environment, explains that documented env sample entries do not satisfy runtime requirements, notes that the harness does not load .env files, and tells the operator to export or source the value before retrying
  cli-harness-start-reports-partial-failure-recovery:
    strength: MUST
    statement: The system MUST make harness-start partial-start failures explicitly report which already-started components remain running and direct operators to run harness-stop for recovery while preserving those components for inspection.
    scenarios:
      later-readiness-failure-names-running-components-and-recovery:
        - GIVEN: a harness environment starts components in dependency order and a later component fails readiness after an earlier component is already running
        - WHEN: an operator or AI agent runs strict-spec-driven harness-start for that environment
        - THEN: the command fails, keeps the earlier component marked running in the component snapshot, and includes a dedicated recovery signal naming the running component together with the harness-stop cleanup instruction
  cli-harness-doctor-auto-recovery:
    strength: MUST
    statement: The system MUST support generating structured recovery actions for doctor diagnostics and executing them non-interactively using the --fix flag.
    scenarios:
      doctor-performs-non-interactive-auto-recovery:
        - GIVEN: a harness declaration contains missing local wrapper scripts or template environment configurations
        - WHEN: an operator or AI agent runs strict-spec-driven harness-doctor with the --fix flag
        - THEN: the command automatically resolves all autofixable diagnostics, regenerates missing files, and exits zero after validation succeeds
  cli-harness-doctor-flags-cross-environment-shared-ports:
    strength: MUST
    statement: The system MUST report a deterministic harness-doctor safety diagnostic when the same port is declared by components in two or more environments, identifying the shared port and the involved environments and components, without automatically rewriting ports, so that a likely cross-environment port conflict between development and production is surfaced for explicit human confirmation in the harness-init skill before the harness declaration is accepted.
    scenarios:
      cross-environment-shared-port-is-reported:
        - GIVEN: a harness declaration in which a port is declared by components in two or more environments, such as development and production
        - WHEN: an operator or AI agent runs strict-spec-driven harness-doctor
        - THEN: the command reports a deterministic safety diagnostic that identifies the shared port and the involved environments and components and offers no automatic port-rewriting recovery
      distinct-environment-ports-do-not-trigger-the-diagnostic:
        - GIVEN: a harness declaration in which every environment declares distinct port numbers
        - WHEN: an operator or AI agent runs strict-spec-driven harness-doctor
        - THEN: no cross-environment shared-port diagnostic is reported while existing same-environment duplicate-port detection is unaffected
  cli-mcp-server-contract:
    strength: MUST
    statement: The system MUST define one integrated local MCP server contract that uses stdio transport, accepts an explicit project root from MCP client configuration, and preserves the existing strict CLI and Agent Skills as authoritative workflow surfaces.
    scenarios:
      mcp-contract-defines-local-stdio-launch:
        - GIVEN: the MCP server contract is reviewed
        - WHEN: the launch and release boundary is inspected
        - THEN: the contract identifies a local stdio server entrypoint for MCP-compatible clients
        - AND: the contract requires explicit project root selection
        - AND: the contract does not define hosted HTTP transport, authentication, or multi-tenant routing for the first integration
      mcp-contract-preserves-existing-workflow-authority:
        - GIVEN: an MCP client invokes strict workflow capabilities
        - WHEN: the contract describes the relationship to existing strict workflow behavior
        - THEN: the CLI command surface, strict YAML artifacts, Agent Skills, verification, review, and archive gates remain authoritative
  cli-mcp-resource-contract:
    strength: MUST
    statement: The MCP server contract MUST define stable strict-resource URI conventions for workflow config, active and archived changes, change artifacts, specs, roadmap artifacts, tech standards, harness declaration, and selected command summaries.
    scenarios:
      mcp-contract-lists-resource-uri-families:
        - GIVEN: the MCP resource contract is reviewed
        - WHEN: resource URI templates are inspected
        - THEN: the contract includes stable URI families for config, changes, specs, roadmap, tech standards, harness declaration, and command summaries
        - AND: each URI family identifies deterministic content for valid strict workflow projects
  cli-mcp-tool-inventory-contract:
    strength: MUST
    statement: The MCP server contract MUST define a server-owned tool inventory covering read-only diagnostics and guarded mutating workflow actions with names, input schema fields, delegated CLI or domain operation, success output shape, and representative failure diagnostics.
    scenarios:
      mcp-contract-lists-read-and-mutating-tool-inventory:
        - GIVEN: the MCP tool inventory is reviewed
        - WHEN: tool entries are inspected
        - THEN: read-only diagnostics and mutating workflow actions are both represented in one inventory
        - AND: each entry identifies its delegated strict CLI or domain operation
        - AND: each entry identifies input schema fields, success output shape, and representative failure diagnostics
  cli-mcp-tool-safety-contract:
    strength: MUST
    statement: The MCP server contract MUST classify every MCP tool as read, write, lifecycle, release, or destructive and MUST describe mutation behavior so MCP hosts can present appropriate confirmation boundaries.
    scenarios:
      mcp-contract-classifies-tool-safety:
        - GIVEN: the MCP tool inventory is reviewed
        - WHEN: tool safety metadata is inspected
        - THEN: each tool has one of the read, write, lifecycle, release, or destructive safety classes
        - AND: mutating, lifecycle, release, and destructive tools describe their project-state mutation behavior
  cli-mcp-prompt-contract:
    strength: MUST
    statement: The MCP server contract MUST define MCP prompt inventory for proposal, apply or review, archive, roadmap recommendation, and harness investigation workflows, with prompt text derived from existing strict skill guidance or covered by drift tests.
    scenarios:
      mcp-contract-lists-skill-backed-prompts:
        - GIVEN: the MCP prompt contract is reviewed
        - WHEN: prompt inventory entries are inspected
        - THEN: proposal, apply or review, archive, roadmap recommendation, and harness investigation workflows are represented
        - AND: the contract requires prompt content to reuse existing strict skill guidance or be protected by drift tests
  cli-mcp-sdk-package-contract:
    strength: MUST
    statement: The MCP server contract MUST identify the official server-side MCP TypeScript SDK package as `@modelcontextprotocol/server`, record the selected initial version range as `^2.0.0-alpha.2`, and define local stdio registration in terms of `McpServer` and `StdioServerTransport` without adding the runtime dependency in the contract-only change.
    scenarios:
      mcp-contract-pins-sdk-package-and-version-range:
        - GIVEN: the MCP server contract is reviewed before runtime implementation
        - WHEN: SDK package and transport guidance are inspected
        - THEN: the contract identifies `@modelcontextprotocol/server` as the server-side MCP TypeScript SDK package
        - AND: the contract records `^2.0.0-alpha.2` as the selected initial version range
        - AND: the contract names `McpServer` and `StdioServerTransport` as the local stdio server registration APIs
  cli-mcp-entrypoint-build-output:
    strength: MUST
    statement: The system MUST build a dedicated local MCP server entrypoint at `dist/scripts/strict-spec-driven-mcp.js` without removing or renaming the existing strict CLI bundle.
    scenarios:
      mcp-build-emits-dedicated-entrypoint:
        - GIVEN: the repository build command is executed
        - WHEN: build output under dist/scripts is inspected
        - THEN: '`strict-spec-driven-mcp.js` exists as a Node-executable bundled server entrypoint'
        - AND: the existing `strict-spec-driven.js` CLI bundle remains available
  cli-mcp-entrypoint-project-root:
    strength: MUST
    statement: The MCP server entrypoint MUST require an explicit `--project <path>` argument, resolve it to a directory, and reject missing or non-directory project roots before connecting the stdio transport.
    scenarios:
      mcp-entrypoint-rejects-missing-project-root:
        - GIVEN: an MCP client or operator starts the server without `--project`
        - WHEN: the entrypoint validates startup arguments
        - THEN: startup fails before stdio transport connection
        - AND: stderr reports that `--project <path>` is required
      mcp-entrypoint-rejects-invalid-project-root:
        - GIVEN: an MCP client or operator starts the server with `--project` pointing at a missing path or file
        - WHEN: the entrypoint validates startup arguments
        - THEN: startup fails before stdio transport connection
        - AND: stderr identifies the invalid project root
  cli-mcp-entrypoint-stdio-server:
    strength: MUST
    statement: The MCP server entrypoint MUST create an SDK `McpServer` using strict-spec-driven server metadata, connect it with `StdioServerTransport`, and expose startup code that tests can exercise without a real MCP host.
    scenarios:
      mcp-entrypoint-creates-stdio-server:
        - GIVEN: a valid project root is supplied
        - WHEN: the entrypoint constructs the MCP server
        - THEN: the server metadata identifies strict-spec-driven and the package version
        - AND: the stdio transport connection path is available for the process entrypoint
  cli-mcp-inventory-foundation:
    strength: MUST
    statement: The MCP server entrypoint MUST load server metadata and initial capability registration from a server-owned MCP inventory module so later resources, tools, and prompts can extend one registry.
    scenarios:
      mcp-entrypoint-uses-inventory-module:
        - GIVEN: the MCP server factory is exercised in tests
        - WHEN: inventory-backed registration runs
        - THEN: server metadata comes from the MCP inventory
        - AND: the initial inventory contains no workflow resources, tools, or prompts before their planned changes implement them
  cli-mcp-sdk-runtime-dependency:
    strength: MUST
    statement: The package MUST include the official `@modelcontextprotocol/server` runtime dependency at the selected `^2.0.0-alpha.2` range when the MCP entrypoint is implemented.
    scenarios:
      mcp-entrypoint-declares-sdk-dependency:
        - GIVEN: package metadata is inspected after the entrypoint change
        - WHEN: dependencies are reviewed
        - THEN: '`@modelcontextprotocol/server` is declared with version range `^2.0.0-alpha.2`'
  cli-mcp-read-tool-inventory:
    strength: MUST
    statement: The MCP server MUST expose a read-only tool inventory for strict workflow diagnostics, change guidance, verification, roadmap status and recommendation, mapping audits, tech status, harness plan, harness status, and bounded harness logs.
    scenarios:
      mcp-read-tools-are-discoverable:
        - GIVEN: the MCP server registers its tool inventory
        - WHEN: read-only tool definitions are inspected
        - THEN: the expected workflow, change, roadmap, mapping, tech, and harness diagnostic tools are present
        - AND: every read-only tool reports safety class read
  cli-mcp-read-tool-delegation:
    strength: MUST
    statement: Each read-only MCP tool MUST delegate to the existing strict CLI command surface under the configured project root instead of reimplementing strict workflow behavior.
    scenarios:
      mcp-read-tools-delegate-to-strict-cli:
        - GIVEN: a read-only MCP tool is called with valid typed arguments
        - WHEN: the tool handler runs
        - THEN: it invokes the mapped strict CLI command with repo-relative arguments
        - AND: it uses the MCP server project root as the command working directory
  cli-mcp-read-tool-output-envelope:
    strength: MUST
    statement: Read-only MCP tools MUST return a deterministic JSON text envelope containing command name, exit status, stdout, stderr, parsed JSON when stdout is parseable, and safety metadata.
    scenarios:
      mcp-read-tool-wraps-success-and-failure:
        - GIVEN: a delegated strict command succeeds or fails
        - WHEN: the MCP tool handler formats the result
        - THEN: the returned text is parseable JSON
        - AND: the JSON includes command, status, stdout, stderr, safety, and parsedJson fields
  cli-mcp-read-tools-do-not-mutate:
    strength: MUST
    statement: Read-only MCP tool calls MUST NOT mutate repository files and tests MUST prove representative read tool calls preserve the workspace diff.
    scenarios:
      mcp-read-tool-preserves-workspace-diff:
        - GIVEN: a strict workflow project has a captured workspace diff
        - WHEN: representative read-only MCP tools are called
        - THEN: the workspace diff after the calls matches the captured diff
  cli-mcp-mutating-tool-inventory:
    strength: MUST
    statement: The MCP server MUST expose guarded mutating tools for init, proposal creation, artifact generation, task-state completion, roadmap sync, archive, harness lifecycle, and harness session creation with explicit safety and mutation metadata.
    scenarios:
      mcp-mutating-tools-are-discoverable:
        - GIVEN: the MCP tool inventory is inspected
        - WHEN: mutating tool definitions are enumerated
        - THEN: init, propose, generate, apply-backed task completion, roadmap sync, archive, harness lifecycle, and harness session creation tools are present
        - THEN: each mutating tool reports mutates true and a conservative safety class
  cli-mcp-mutating-tool-delegation:
    strength: MUST
    statement: Each mutating MCP tool MUST delegate to the existing strict CLI command surface under the configured project root and MUST preserve strict CLI preconditions and failure diagnostics.
    scenarios:
      mcp-mutating-tools-delegate-to-existing-cli:
        - GIVEN: a mutating MCP tool is called with valid typed arguments
        - WHEN: the tool handler runs
        - THEN: it invokes the mapped strict CLI command in the MCP server project root
        - THEN: success and failure results preserve the delegated command exit status, stdout, and stderr
  cli-mcp-mutating-tool-input-validation:
    strength: MUST
    statement: Mutating MCP tools MUST use typed input schemas and reject invalid inputs before invoking delegated strict CLI commands.
    scenarios:
      mcp-mutating-tools-reject-invalid-input-before-delegation:
        - GIVEN: a mutating MCP tool is called with invalid input
        - WHEN: the MCP SDK validates the registered input schema
        - THEN: the tool call is rejected before the strict CLI delegate runs
        - AND: no project mutation is attempted by the MCP handler
  cli-mcp-mutating-tool-safety-boundaries:
    strength: MUST
    statement: Mutating MCP tool descriptions and envelopes MUST make project-state mutation explicit, including write, lifecycle, and release safety classes, and the apply-backed tool MUST be worded as task-state completion rather than implementation work.
    scenarios:
      mcp-mutating-tools-report-confirmation-metadata:
        - GIVEN: MCP clients inspect mutating tool metadata and call results
        - WHEN: mutating tools are registered or executed
        - THEN: descriptions identify project-state mutation or lifecycle effects
        - AND: returned envelopes include the tool safety class and mutates true
        - AND: the apply-backed tool is named and described as marking the next task complete
  cli-mcp-resource-inventory:
    strength: MUST
    statement: The MCP server MUST expose bounded strict workflow resources for config, workflow state, changes, change artifacts, specs, roadmap, tech standards, and harness declaration using stable strict:// URI conventions.
    scenarios:
      mcp-resources-are-discoverable:
        - GIVEN: the MCP resource inventory is inspected
        - WHEN: resource definitions are enumerated
        - THEN: the expected strict workflow resource URIs and URI templates are present
        - THEN: resources are listed in stable order
  cli-mcp-resource-reading:
    strength: MUST
    statement: MCP resource reads MUST return deterministic text content for valid strict workflow artifacts and generated strict summaries.
    scenarios:
      mcp-resources-return-deterministic-content:
        - GIVEN: a valid strict workflow project
        - WHEN: a known MCP resource URI is read
        - THEN: the returned content includes the requested URI and deterministic text
        - AND: repeated reads of the same resource produce stable content
  cli-mcp-resource-bounds:
    strength: MUST
    statement: MCP resource reads MUST reject unknown identifiers, missing artifacts, and parent-directory traversal before exposing project files.
    scenarios:
      mcp-resources-reject-unbounded-file-access:
        - GIVEN: a resource URI contains an unknown identifier or traversal segment
        - WHEN: the MCP resource reader resolves the URI
        - THEN: the read fails with a deterministic diagnostic
        - AND: no arbitrary repository file is exposed
  cli-mcp-prompt-inventory:
    strength: MUST
    statement: The MCP server MUST expose stable prompt inventory entries for strict proposal, application, review, archive, roadmap recommendation, and harness investigation workflows, including typed argument schemas and user-facing descriptions.
    scenarios:
      mcp-prompts-are-discoverable:
        - GIVEN: the MCP server prompt inventory is inspected
        - WHEN: prompt entries are enumerated
        - THEN: strict_propose_change, strict_apply_change, strict_review_change, strict_archive_change, strict_roadmap_recommend, and strict_harness_investigation are present
        - AND: each prompt declares its expected typed arguments and description
  cli-mcp-prompt-rendering:
    strength: MUST
    statement: MCP prompts MUST render deterministic user messages derived from existing strict skill workflow guidance and MUST preserve strict verification, review, archive, and safety boundaries.
    scenarios:
      mcp-prompts-render-skill-backed-guidance:
        - GIVEN: an MCP client requests a strict workflow prompt
        - WHEN: the prompt is rendered with valid arguments
        - THEN: the returned prompt message references the relevant strict workflow command or skill guidance
        - AND: the message preserves strict verification, code review, archive, and mutating-tool confirmation expectations
  cli-mcp-user-documentation:
    strength: MUST
    statement: User documentation MUST describe local MCP server configuration, explicit project-root launch arguments, representative resources, tools, prompts, read-only requests, and mutating confirmation boundaries.
    scenarios:
      mcp-docs-cover-local-client-setup:
        - GIVEN: a user reads the MCP documentation
        - WHEN: setup and usage examples are inspected
        - THEN: the docs include a local stdio MCP client JSON configuration
        - AND: the docs include read-only status, resource, prompt, and guarded mutating workflow examples
  cli-mcp-protocol-regression:
    strength: MUST
    statement: The regression suite MUST cover MCP protocol smoke flows for listing tools, calling tools, listing resources, reading resources, listing prompts, getting prompts, built-output launch availability, and prompt drift against strict skill guidance.
    scenarios:
      mcp-protocol-smoke-coverage-exists:
        - GIVEN: the project test suite is executed after build
        - WHEN: MCP server regression tests run
        - THEN: tools/list, tools/call, resources/list, resources/read, prompts/list, and prompts/get are exercised through the MCP protocol
        - AND: built-output launch and skill-prompt drift checks are covered
  cli-mcp-mutating-tool-confirmation:
    strength: MUST
    statement: Mutating MCP tools MUST require an explicit confirm flag at the server boundary and MUST refuse the call with a confirmation diagnostic, without invoking the delegated strict CLI command, when confirm is not true.
    scenarios:
      mcp-mutating-tool-refuses-without-confirmation:
        - GIVEN: a mutating MCP tool is called with valid typed arguments but without confirm set to true
        - WHEN: the MCP server processes the call
        - THEN: the server returns a confirmation-required diagnostic and does not invoke the delegated strict CLI command
      mcp-mutating-tool-proceeds-with-confirmation:
        - GIVEN: a mutating MCP tool is called with valid typed arguments and confirm set to true
        - WHEN: the MCP server processes the call
        - THEN: the delegated strict CLI command runs under the configured project root
        - AND: the confirm flag is forwarded to the CLI only for harness lifecycle commands
  cli-mcp-tool-error-signaling:
    strength: MUST
    statement: MCP tool results MUST set the protocol isError flag when input validation fails, a required confirmation is missing, or the delegated strict CLI command exits non-zero, while still returning the deterministic JSON envelope as the result content.
    scenarios:
      mcp-tool-failure-sets-protocol-error:
        - GIVEN: an MCP tool call fails input validation, lacks required confirmation, or its delegated command exits non-zero
        - WHEN: the MCP server formats the tool result
        - THEN: the result is marked as a protocol error and still contains the JSON envelope reporting command, status, stdout, stderr, and safety
  cli-mcp-destructive-tool:
    strength: MUST
    statement: The MCP server MUST expose the change cancellation command as a destructive mutating tool classified with safety destructive and mutates true that requires confirmation and delegates to the strict cancel CLI command under the configured project root.
    scenarios:
      mcp-exposes-destructive-cancel-tool:
        - GIVEN: the MCP mutating tool inventory is inspected
        - WHEN: the cancellation tool definition is examined
        - THEN: it reports safety destructive with mutates true, requires confirmation, and delegates to the strict cancel command
  cli-mcp-resource-template-enumeration:
    strength: MUST
    statement: MCP template resources MUST provide list callbacks so that existing strict changes, specs, roadmap milestones, roadmap planned changes, and tech standards are enumerable through the MCP resources listing as concrete strict:// URIs.
    scenarios:
      mcp-template-resources-are-enumerable:
        - GIVEN: a strict workflow project contains changes, specs, roadmap, and tech artifacts
        - WHEN: the MCP client lists resources
        - THEN: the listing includes concrete strict:// URIs for the existing change, spec, roadmap, and tech artifacts derived from template resources
  cli-mcp-install-command-surface:
    strength: MUST
    statement: The system MUST provide an mcp-install strict CLI subcommand, registered in canonical command order, that registers the built strict-spec-driven MCP server into selected MCP clients.
    scenarios:
      mcp-install-is-a-registered-subcommand:
        - GIVEN: the strict CLI command listing is inspected
        - WHEN: registered subcommands are enumerated
        - THEN: mcp-install appears in canonical command order alongside the existing strict CLI commands
      mcp-install-registers-the-server:
        - GIVEN: a supported client and a valid project root are provided
        - WHEN: mcp-install runs to completion
        - THEN: the strict-spec-driven MCP server is registered for that client
        - AND: the command reports the client, scope, entry name, and resolved entrypoint path it registered
  cli-mcp-install-builds-and-resolves-entrypoint:
    strength: MUST
    statement: The mcp-install command MUST build the project before registration and resolve the absolute dist MCP server entrypoint path together with a project root that defaults to the current directory.
    scenarios:
      mcp-install-builds-before-registering:
        - GIVEN: mcp-install is invoked
        - WHEN: registration begins
        - THEN: the project build runs first so the dist MCP server entrypoint exists
        - AND: the registered server command uses the absolute resolved entrypoint path
      mcp-install-defaults-project-root-to-cwd:
        - GIVEN: mcp-install is invoked without an explicit project root
        - WHEN: the project root is resolved
        - THEN: the current working directory is used as the registered --project value
  cli-mcp-install-client-selection:
    strength: MUST
    statement: The mcp-install command MUST accept a client selector covering claude-code, codex, opencode, copilot, and a generic json target, delegating to an official client CLI where one exists and writing the client config file directly otherwise.
    scenarios:
      mcp-install-supports-each-client:
        - GIVEN: the mcp-install client selector is inspected
        - WHEN: the accepted client values are enumerated
        - THEN: claude-code, codex, opencode, copilot, and json are accepted client targets
      mcp-install-rejects-unknown-client:
        - GIVEN: mcp-install is invoked with an unsupported client value
        - WHEN: the client selector is validated
        - THEN: the command fails with a diagnostic naming the supported client values
        - AND: no client configuration is modified
  cli-mcp-install-multi-client:
    strength: MUST
    statement: The mcp-install command MUST accept a repeatable client selection and an all value, registering each selected client and reporting a per-client result.
    scenarios:
      mcp-install-targets-multiple-clients:
        - GIVEN: mcp-install is invoked with more than one selected client or the all value
        - WHEN: registration runs
        - THEN: each selected client is registered
        - AND: the command reports an individual result for each client
  cli-mcp-install-missing-cli-skips:
    strength: MUST
    statement: When a selected client requires an official client CLI that is not available, the mcp-install command MUST skip that client with a diagnostic instructing installation of the CLI and MUST NOT write that client's configuration directly.
    scenarios:
      mcp-install-skips-client-without-cli:
        - GIVEN: a CLI-backed client is selected but its official CLI is unavailable
        - WHEN: mcp-install attempts to register that client
        - THEN: that client is reported as skipped with a diagnostic to install its CLI
        - AND: that client's configuration is not modified
  cli-mcp-install-native-format-idempotent:
    strength: MUST
    statement: The mcp-install command MUST register each file-written client entry in that client's native configuration format and merge idempotently, preserving unrelated existing entries and never duplicating the registered entry on repeated runs.
    scenarios:
      mcp-install-preserves-existing-entries:
        - GIVEN: a target client config already contains unrelated server entries
        - WHEN: mcp-install registers the strict-spec-driven server
        - THEN: the unrelated entries remain unchanged
        - AND: the registered entry is present in the client's native format
      mcp-install-is-idempotent:
        - GIVEN: mcp-install has already registered the server for a file-written client
        - WHEN: mcp-install runs again for the same client, scope, and entry name
        - THEN: the client config still contains exactly one entry for that name
  cli-mcp-install-entry-name:
    strength: MUST
    statement: The mcp-install command MUST default the registered MCP server entry name to strict-spec-driven and MUST allow overriding it through a name argument so distinct project roots can register into one client.
    scenarios:
      mcp-install-defaults-entry-name:
        - GIVEN: mcp-install is invoked without a name override
        - WHEN: the server entry is registered
        - THEN: the entry name strict-spec-driven is used
      mcp-install-honors-name-override:
        - GIVEN: mcp-install is invoked with a name override
        - WHEN: the server entry is registered
        - THEN: the overridden name is used as the entry name and idempotency key
  cli-mcp-install-scope-selection:
    strength: MUST
    statement: The mcp-install command MUST accept a scope selector for project and user scopes, defaulting to project scope when none is supplied.
    scenarios:
      mcp-install-defaults-to-project-scope:
        - GIVEN: mcp-install is invoked without a scope selector
        - WHEN: the registration scope is resolved
        - THEN: project scope is used
      mcp-install-honors-user-scope:
        - GIVEN: mcp-install is invoked with the user scope selector
        - WHEN: the registration scope is resolved
        - THEN: the user-level client configuration target is used instead of the project-level target
  init-skill-generates-agents-md-when-missing:
    strength: MUST
    statement: The strict-spec-init skill prompt MUST instruct the agent to generate an AGENTS.md describing the project when the target project has none, and MUST instruct it not to overwrite an existing AGENTS.md; strict skill packaging validation MUST enforce that this guidance is present in the init skill prompt.
    scenarios:
      init-skill-prompt-carries-agents-md-guidance:
        - GIVEN: the packaged strict-spec-init skill prompt is inspected by strict skill packaging validation
        - WHEN: validate-skills runs against the strict skill packages
        - THEN: validation passes and the strict-spec-init prompt contains the AGENTS.md generation and non-overwrite guidance
  cli-review-surfaces-uncaptured-tech-conventions:
    strength: MUST
    statement: The system MUST require strict review workflow guidance — in both the strict-spec-review skill and strict-spec-auto's inline review phase — to prompt a non-blocking reflection on whether the reviewed change established a reusable engineering convention not yet captured under .strict-spec-driven/tech/, and when one is found to surface two follow-up options (add a delta-tech to the current change, or defer to /strict-tech-sync) without blocking strict verification or archive when nothing is captured or the operator declines.
    scenarios:
      review-prompts-tech-convention-reflection:
        - GIVEN: a completed strict change has passed strict verification and enters strict review workflow guidance
        - WHEN: the AI performs the review under either strict-spec-review or strict-spec-auto
        - THEN: the review guidance requires reflecting on whether the change introduced a reusable engineering convention absent from .strict-spec-driven/tech/, and when such a convention is found offers adding a delta-tech to the current change or deferring it to /strict-tech-sync
      tech-reflection-is-non-blocking:
        - GIVEN: the review tech-convention reflection finds nothing to capture or the operator declines to capture it
        - WHEN: review concludes
        - THEN: the reflection does not block strict verification or archive recommendation
  cli-roadmap-review-skill-packaging-validation:
    strength: MUST
    statement: The system MUST validate the strict-roadmap-review skill package through validate-skills, enforcing its marketplace registration, scripts symlink, required roadmap-status and roadmap-sync command references, required Steps and Rules headings, and required guidance snippets covering incomplete-milestone scope, direct fix application, and detail elaboration, and MUST report deterministic path-specific diagnostics when any expectation is broken; validate-skills MUST NOT require a strict-roadmap-milestone package after its retirement.
    scenarios:
      validate-skills-accepts-complete-roadmap-review-package:
        - GIVEN: the strict-roadmap-review package is complete with marketplace registration, an intact scripts symlink, and the required command references, headings, and incomplete-scope, direct-fix, and detail-elaboration guidance snippets
        - WHEN: strict-spec-driven validate-skills runs
        - THEN: the command reports the strict-roadmap-review package as valid with no diagnostics
      validate-skills-rejects-broken-roadmap-review-package:
        - GIVEN: the strict-roadmap-review package is missing required guidance snippets, required command references, or its scripts symlink
        - WHEN: strict-spec-driven validate-skills runs
        - THEN: the command exits non-zero with deterministic, path-specific diagnostics identifying the strict-roadmap-review package failures
      validate-skills-does-not-expect-retired-milestone-skill:
        - GIVEN: the strict-roadmap-milestone package has been deleted from the repository
        - WHEN: strict-spec-driven validate-skills runs
        - THEN: the command reports no diagnostics about a missing strict-roadmap-milestone package
  cli-shared-schema-cache-sync-on-startup:
    strength: MUST
    statement: The system MUST check a shared schema cache under ~/.strict-spec-schemas/ during strict-spec-driven CLI and MCP startup, export the bundled strict schema assets plus a manifest when the cache is missing or its recorded export version differs from the current bundled export version, and skip rewriting the cache when the recorded version already matches.
    scenarios:
      cli-startup-populates-shared-schema-cache:
        - GIVEN: the bundled strict schema assets are available and ~/.strict-spec-schemas/ is missing
        - WHEN: a strict-spec-driven CLI command starts
        - THEN: the shared cache is created under ~/.strict-spec-schemas/templates/strict-spec-driven/schemas/
        - AND: a manifest describing the exported schema version and exported schema files is written under ~/.strict-spec-schemas/
      unchanged-version-skips-cache-rewrite:
        - GIVEN: ~/.strict-spec-schemas/ already contains a manifest whose export version matches the current bundled schema export version
        - WHEN: a strict-spec-driven CLI or MCP process starts
        - THEN: the process skips rewriting unchanged shared schema files
      changed-version-refreshes-shared-cache:
        - GIVEN: ~/.strict-spec-schemas/ is missing, corrupted, or records a different export version than the current bundled schema export version
        - WHEN: a strict-spec-driven CLI or MCP process starts
        - THEN: the process rewrites the shared schema cache from the current bundled schema assets
      cache-write-failure-warns-without-blocking-startup:
        - GIVEN: the current process cannot write ~/.strict-spec-schemas/
        - WHEN: a strict-spec-driven CLI or MCP process starts
        - THEN: the command or MCP startup continues using bundled schemas
        - AND: an explicit warning reports that the shared schema cache could not be synchronized
  cli-skills-remind-shared-schema-cache-location:
    strength: MUST
    statement: Core strict skills that guide agents to author or modify strict YAML MUST mention ~/.strict-spec-schemas/ as the shared schema cache root and explain that an artifact's schema_file can be resolved against that root when installed skills do not carry a templates directory.
    scenarios:
      validate-skills-requires-shared-cache-guidance:
        - GIVEN: a core strict skill that instructs agents to create or edit strict YAML artifacts
        - WHEN: strict skill packaging validation inspects the skill prompt
        - THEN: validation requires the prompt to mention ~/.strict-spec-schemas/ and schema_file-based schema lookup guidance alongside the existing schema-show reminder

  cli-ship-skill-content-validation-smoke-coverage:
    strength: MUST
    statement: The system MUST include automated checks that exercise strict ship skill content for both passing and failing states, not only package-shape validation.
    scenarios:
      automated-checks-accept-aligned-ship-skill-content:
        - GIVEN: '`strict-spec-ship/SKILL.md` contains an explicit `ship` command reference and `.strict-spec-driven/` workflow guidance'
        - WHEN: repository automated checks are executed
        - THEN: the ship skill content checks pass
      automated-checks-reject-placeholder-ship-skill-content:
        - GIVEN: '`strict-spec-ship/SKILL.md` retains a generic placeholder command block or omits `.strict-spec-driven/` workflow guidance'
        - WHEN: repository automated checks are executed
        - THEN: the ship skill content checks fail
        - AND: diagnostics identify the failing skill package deterministically
  cli-shared-output-helpers:
    strength: MUST
    statement: The system MUST provide a shared `src/cli/output.ts` module with typed helpers for writing JSON, human-readable text, usage hints, and error messages to stdout and stderr so command modules do not call `process.stdout.write` or `process.stderr.write` directly.
    scenarios:
      json-output-is-written-through-shared-helper:
        - GIVEN: a CLI command produces a structured result
        - WHEN: the command writes its result
        - THEN: the JSON is written via the shared `writeJson` helper
        - AND: the output format is identical to the pre-centralization behavior
      error-output-is-written-through-shared-helpers:
        - GIVEN: a CLI command encounters a usage or runtime error
        - WHEN: the command writes its error or usage hint
        - THEN: the message is written via `writeUsage` or `writeError` as appropriate
        - AND: the stderr format is identical to the pre-centralization behavior
  cli-propose-populates-artifacts-from-structured-input:
    strength: MUST
    statement: The system MUST provide CLI behavior that populates existing strict change planning artifacts from explicit structured command input without requiring an AI agent to write the YAML artifact directly.
    scenarios:
      proposal-artifact-is-generated-from-command-input:
        - GIVEN: a strict change scaffold already exists
        - AND: valid command input describes one supported planning artifact
        - WHEN: the corresponding artifact population command is executed for that change
        - THEN: the target planning artifact is written under the existing change directory
        - AND: the written artifact validates against its strict YAML artifact schema
  cli-propose-generation-is-artifact-scoped:
    strength: MUST
    statement: The system MUST expose proposal population as artifact-level operations so proposal, design, questions, and individual delta specs can be generated through separate CLI invocations.
    scenarios:
      artifacts-can-be-generated-one-at-a-time:
        - GIVEN: a strict change scaffold exists
        - WHEN: a user or agent generates only one supported planning artifact from explicit command input
        - THEN: the command writes only that target artifact
        - AND: unrelated planning artifacts in the same change are left unchanged
  cli-propose-generation-preserves-scaffold-behavior:
    strength: MUST
    statement: The system MUST preserve the existing propose scaffold behavior while adding scripted artifact population as a follow-up workflow step and may reuse an existing change directory tree only when that tree contains no files.
    scenarios:
      existing-propose-command-still-scaffolds:
        - GIVEN: a valid kebab-case change name that does not already exist
        - WHEN: strict-spec-driven propose is executed without a generation input
        - THEN: the command creates the standard strict change scaffold
        - AND: no artifact-specific population input is required
      empty-change-directory-can-be-scaffolded:
        - GIVEN: a valid kebab-case change name whose change directory already exists with only empty subdirectories
        - WHEN: strict-spec-driven propose is executed for that name
        - THEN: the command writes the standard strict change scaffold into that directory
        - AND: pre-existing empty subdirectories remain in place
      populated-change-directory-still-fails:
        - GIVEN: a valid kebab-case change name whose change directory already contains a file
        - WHEN: strict-spec-driven propose is executed for that name
        - THEN: the command exits non-zero with an existing-change collision
        - AND: existing artifacts remain unchanged
  cli-propose-generation-uses-named-arguments:
    strength: MUST
    statement: The system MUST provide proposal population commands that accept supported artifact content only through named CLI arguments, including repeated grouped question, mapping, scenario, and requirement arguments in a single invocation for artifacts that contain keyed collections.
    scenarios:
      named-argument-generation-does-not-use-payload-files:
        - GIVEN: a strict change scaffold exists
        - WHEN: an agent populates supported generated artifacts
        - THEN: the generated CLI commands use named arguments directly
        - AND: no JSON payload file is required
  cli-propose-generation-uses-direct-invocations:
    strength: MUST
    statement: The system MUST support direct agent-generated CLI invocations with named arguments as the only orchestration form for strict proposal population.
    scenarios:
      generated-cli-invocations-populate-change:
        - GIVEN: a strict change scaffold exists
        - AND: an agent produces one or more strict CLI proposal population commands with named arguments
        - WHEN: those commands are executed from the repository root
        - THEN: the requested strict change artifacts are populated
        - AND: no command constructs or consumes an AI-authored JSON payload file
  cli-propose-generation-reports-argument-errors:
    strength: MUST
    statement: The system MUST report invalid, incomplete, or positional proposal population arguments as deterministic CLI failures before writing target YAML artifacts.
    scenarios:
      missing-required-flag-fails-before-write:
        - GIVEN: a strict change scaffold exists
        - AND: a proposal population command omits a required named argument
        - WHEN: the command is executed
        - THEN: the command exits non-zero
        - AND: stderr identifies the missing argument name
        - AND: the existing target artifact is left unchanged
      positional-input-fails-before-write:
        - GIVEN: a strict change scaffold exists
        - AND: a proposal population command supplies a positional file argument
        - WHEN: the command is executed
        - THEN: the command exits non-zero
        - AND: stderr prints named-argument usage
        - AND: the existing target artifact is left unchanged
  cli-propose-generation-prevents-duplicates:
    strength: MUST
    statement: The system MUST prevent duplicate YAML content when equivalent proposal population commands are executed more than once.
    scenarios:
      repeated-list-values-are-deduplicated:
        - GIVEN: a strict change artifact already contains a generated list entry
        - WHEN: the same population command supplies the same list entry again
        - THEN: the resulting YAML artifact contains that list entry only once
        - AND: the original list order is preserved
      keyed-items-are-upserted-by-identifier:
        - GIVEN: a generated artifact contains a keyed item such as a task, question, decision, or requirement
        - WHEN: a later population command targets the same item identifier with equivalent content
        - THEN: the resulting YAML artifact contains one item for that identifier
        - AND: no duplicate keyed entry is written
      conflicting-keyed-items-fail-before-write:
        - GIVEN: a generated artifact contains a keyed item
        - WHEN: a later population command targets the same identifier with conflicting content
        - THEN: the command exits non-zero before writing the artifact
        - AND: stderr identifies the duplicate identifier conflict
  cli-propose-tasks-yaml-remains-scaffold-authored:
    strength: MUST
    statement: The system MUST keep tasks.yaml as a scaffolded change artifact that agents edit directly according to the task-list schema rather than exposing tasks as a generate command artifact.
    scenarios:
      tasks-artifact-is-not-generated-by-command:
        - GIVEN: a strict change scaffold exists
        - WHEN: the generate command is invoked with the tasks artifact selector
        - THEN: the command exits non-zero
        - AND: the scaffolded tasks.yaml remains unchanged
  cli-subcommands-support-help:
    strength: MUST
    statement: The system MUST support exact `--help` and `-h` help requests for the root CLI and every registered subcommand, printing usage to stdout and exiting zero without performing the command's normal mutation or validation behavior.
    scenarios:
      root-help-lists-commands:
        - GIVEN: the strict CLI is available
        - WHEN: the root CLI is invoked with `--help`
        - THEN: the command exits zero
        - AND: stdout lists the registered commands in canonical order
        - AND: stderr is empty
      subcommand-help-shows-usage:
        - GIVEN: a registered strict CLI subcommand exists
        - WHEN: that subcommand is invoked with `--help`
        - THEN: the command exits zero
        - AND: stdout contains the subcommand usage
        - AND: stderr is empty
  cli-roadmap-loads-split-planned-change-files:
    strength: MUST
    statement: The system MUST load roadmap planned-change state from standalone planned-change artifacts as well as inline milestone planned_changes entries, associating every standalone planned change with exactly one owning milestone and preserving deterministic roadmap order.
    scenarios:
      split-planned-change-files-load-with-owning-milestone:
        - GIVEN: a strict roadmap contains milestone metadata and a standalone planned-change artifact that references one owning milestone
        - WHEN: strict roadmap state is loaded for roadmap-status or roadmap-sync
        - THEN: the standalone planned change is reported under its owning milestone in deterministic roadmap order
        - AND: existing inline milestone planned_changes entries remain valid during the compatibility window
  cli-roadmap-sync-preserves-split-planned-change-state:
    strength: MUST
    statement: The system MUST make roadmap-status and roadmap-sync derive and rewrite planned-change completion state consistently for inline and standalone planned-change representations without adding duplicate planned-change entries or moving data between representations implicitly.
    scenarios:
      sync-keeps-split-and-inline-state-deterministic:
        - GIVEN: a strict roadmap includes standalone planned-change files and inline milestone planned_changes entries
        - WHEN: roadmap-status or roadmap-sync reconciles planned-change state against active and archived strict changes
        - THEN: declared and derived planned-change statuses are computed consistently for both representations
        - AND: sync output preserves deterministic ordering and does not create duplicate planned-change entries
  cli-roadmap-materializes-inline-planned-changes:
    strength: MUST
    statement: The system MUST provide an explicit operator-selected roadmap conversion path that materializes inline milestone planned_changes entries as standalone planned-change YAML artifacts without losing planned-change identity, owning milestone, status, summary, details, or dependency data.
    scenarios:
      inline-planned-changes-materialize-as-standalone-files:
        - GIVEN: a strict roadmap milestone contains inline planned_changes entries
        - WHEN: the explicit inline-to-standalone roadmap conversion path is executed
        - THEN: standalone planned-change YAML artifacts are written for the converted planned changes
        - AND: each standalone artifact preserves the planned change id, owning milestone reference, status, summary, details, and depends_on values
      ordinary-sync-does-not-move-representation:
        - GIVEN: a strict roadmap still contains inline planned_changes entries
        - WHEN: ordinary roadmap-status or roadmap-sync behavior runs without the explicit conversion trigger
        - THEN: planned changes are not silently moved between inline and standalone representations
  cli-roadmap-cross-file-conflict-validation:
    strength: MUST
    statement: The system MUST make roadmap-status reject invalid split-file roadmap state with deterministic diagnostics for duplicate planned change identities, missing milestone references, invalid cross-file dependency references, ambiguous advisory ownership metadata, and conflicts with active strict changes for the same planned change identity.
    scenarios:
      roadmap-status-rejects-cross-file-conflicts:
        - GIVEN: a strict roadmap contains milestone metadata plus standalone planned-change files
        - WHEN: strict-spec-driven roadmap-status is executed
        - THEN: the command exits non-zero for duplicate planned change identities, missing milestone references, invalid dependency references, ambiguous advisory ownership metadata, or active strict change conflicts
  cli-roadmap-handoff-uses-split-planned-change-sources:
    strength: MUST
    statement: The system MUST make roadmap recommendation and roadmap-to-change proposal handoff treat standalone planned-change artifacts as eligible roadmap-backed work sources, using dependency readiness and active strict change conflicts when selecting or scaffolding exactly one planned change.
    scenarios:
      split-planned-change-is-selected-for-handoff:
        - GIVEN: a strict roadmap contains milestone metadata and standalone planned-change artifacts with complete dependencies
        - WHEN: strict roadmap recommendation or proposal handoff evaluates roadmap-backed work
        - THEN: one eligible standalone planned change can be selected and scaffolded as a normal strict change with its planned-change identity and owning milestone reference
  cli-roadmap-team-metadata-validation:
    strength: MUST
    statement: The system MUST accept valid optional team metadata on standalone planned-change files and reject malformed team metadata through deterministic roadmap validation diagnostics.
    scenarios:
      roadmap-status-validates-planned-change-team-metadata:
        - GIVEN: a strict roadmap contains standalone planned-change files with optional team metadata
        - WHEN: strict-spec-driven roadmap-status is executed
        - THEN: valid owner, reviewer, blocked-state, label, and external-reference metadata is accepted
  cli-split-roadmap-regression-coverage:
    strength: MUST
    statement: The system MUST include copied-project regression coverage for split-file roadmap workflows, covering standalone planned-change loading, inline planned-change materialization, cross-file validation, recommendation and proposal handoff, team metadata validation, and shared roadmap index preservation.
    scenarios:
      copied-project-split-roadmap-regressions-cover-team-workflow:
        - GIVEN: a copied project fixture contains strict roadmap milestone metadata, standalone planned-change artifacts, and inline planned_changes entries where compatibility or migration behavior is required
        - WHEN: the repository roadmap regression tests execute roadmap status, sync, materialization, validation, recommendation, and proposal-handoff flows
        - THEN: the tests verify deterministic CLI behavior, preserved planned-change metadata, stable shared index output, accepted valid team metadata, rejected invalid cross-file state, and exactly-one eligible planned-change handoff
  cli-embedded-template-inspection:
    strength: MUST
    statement: The system MUST provide read-only CLI commands that list bundled template asset keys and print a selected embedded schema or scaffold template asset so agents can inspect artifact contracts without per-skill template directories.
    scenarios:
      embedded-template-listing-is-deterministic:
        - GIVEN: the strict CLI has embedded template assets available
        - WHEN: a template listing command is executed
        - THEN: the command exits zero and emits deterministic asset keys
      embedded-template-show-prints-selected-asset:
        - GIVEN: the strict CLI has an embedded schema or scaffold asset matching a requested key
        - WHEN: a template show command is executed for that key
        - THEN: the command exits zero and writes the selected asset content
  cli-skills-templates-symlink-optional:
    strength: MUST
    statement: The system MUST validate strict skill packaging without requiring every skill directory to include a templates symlink, while continuing to require executable script access for documented skill commands.
    scenarios:
      skills-without-template-symlink-validate:
        - GIVEN: a strict skill package includes valid skill metadata, SKILL.md content, and the required scripts symlink
        - WHEN: skill packaging validation runs
        - THEN: the package is not rejected solely because a templates symlink is absent
      script-symlink-remains-required:
        - GIVEN: a strict skill package is missing the scripts symlink required by documented commands
        - WHEN: skill packaging validation runs
        - THEN: the missing scripts symlink remains a validation failure
  cli-skill-yaml-rules-schema-lookup-reminder:
    strength: SHOULD
    statement: Core strict skills that directly create or edit strict change YAML SHOULD remind agents in their YAML Writing Rules to use the embedded schema lookup CLI when artifact fields are unclear, because installed skills do not carry per-skill templates directories.
    scenarios:
      yaml-rules-mention-schema-lookup:
        - GIVEN: a core strict skill includes a YAML Writing Rules section
        - WHEN: an agent reads the rules before editing strict YAML
        - THEN: the rules mention schema-show as the supported way to inspect unclear artifact fields
        - THEN: the rules state that installed skills do not carry a templates directory
  cli-archive-rejects-added-requirement-collisions:
    strength: MUST
    statement: The system MUST block archive when a strict delta spec ADDED operation would overwrite an existing requirement in the target main spec.
    scenarios:
      added-collision-blocks-archive-before-main-spec-write:
        - GIVEN: a complete strict change contains a delta spec whose ADDED keyed map includes a requirement id already present in the target main spec
        - WHEN: '`strict-spec-driven archive <name>` is executed'
        - THEN: the command exits non-zero before rewriting the target main spec
        - AND: the active change remains in the active changes directory
        - AND: the error output identifies the duplicate ADDED requirement id and target spec
      verify-reports-added-collision:
        - GIVEN: a strict change contains a delta spec whose ADDED keyed map includes a requirement id already present in the target main spec
        - WHEN: '`strict-spec-driven verify <name>` is executed'
        - THEN: verification reports a deterministic validation diagnostic for the ADDED collision
        - AND: the diagnostic identifies the delta spec path, target spec, and requirement id
  cli-reports-deterministic-change-next-steps:
    strength: MUST
    statement: The system MUST provide CLI behavior that reports a named active change's deterministic workflow state, blocking conditions, and scriptable next-step command suggestions without inventing product or implementation decisions.
    scenarios:
      next-step-output-reports-blocking-state:
        - GIVEN: an active strict change exists with planning artifacts, tasks, questions, and delta specs
        - WHEN: the deterministic workflow-state CLI behavior is executed for that change
        - THEN: the output identifies blocking conditions such as pending tasks, open questions, missing delta specs, or validation diagnostics
        - AND: the output includes concrete command suggestions only for script-owned workflow mechanics
        - AND: the output does not decide product scope, requirement content, or user checkpoint answers

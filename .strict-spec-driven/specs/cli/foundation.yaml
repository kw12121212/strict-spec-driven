      The system MUST provide a `verify-spec-mappings` subcommand for strict spec-mapping audits
      against .strict-spec-driven/specs/.
    scenarios:
      verify-spec-mappings-runs-from-repository-state:
        - GIVEN: '`.strict-spec-driven/specs/` contains one or more main spec YAML files'
        - WHEN: '`strict-spec-driven verify-spec-mappings` is executed'
        - THEN: the command runs mapping audits against available spec mapping fields
        - AND: command output is emitted as parseable JSON
      verify-spec-mappings-reports-missing-specs-directory:
        - GIVEN: '`.strict-spec-driven/specs/` does not exist'
        - WHEN: '`strict-spec-driven verify-spec-mappings` is executed'
        - THEN: the command exits non-zero
        - AND: a diagnostic explains that spec mapping inputs are unavailable
  cli-verify-spec-mappings-audits-mapping-coverage:
    strength: MUST
    statement: >-
      The system MUST audit mapping coverage across main spec mapping fields and report diagnostics
      when mapping coverage is incomplete.
    scenarios:
      mapped-implementation-and-tests-produce-no-coverage-diagnostics:
        - GIVEN: >-
            each main spec has a mapping field with non-empty implementation and test path

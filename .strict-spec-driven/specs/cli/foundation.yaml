        - WHEN: repository automated checks are executed
        - THEN: the migration skill content checks fail
        - AND: diagnostics identify the failing skill package deterministically
  cli-migrate-converts-bootstrap-workflow-state:
    strength: MUST
    statement: >-
      The system MUST provide a `migrate` subcommand that reads legacy `.spec-driven/` workflow
      state and migrates supported bootstrap config, main specs, delta specs, active and archived
      change artifacts, roadmap index, roadmap milestones, and the specs index into strict YAML
      output under `.strict-spec-driven/`, with legacy Markdown parsing for specs and change
      artifacts sourced from focused modules under `src/migrate/parsers/`, initializes any remaining
      required strict scaffold assets, and reports only unsupported or ambiguous legacy artifacts as
      manual follow-up items.
    scenarios:
      migrate-converts-legacy-specs-and-change-artifacts-into-strict-workflow-state:
        - GIVEN: >-
            legacy main specs, delta specs, and active or archived changes exist under
            `.spec-driven/`
        - AND: no unsafe strict target conflict blocks execution
        - WHEN: '`strict-spec-driven migrate` is executed'
        - THEN: the command writes strict YAML spec and change artifacts under `.strict-spec-driven/`
        - AND: the command updates the strict spec index to reference the migrated main spec outputs
        - AND: >-
            the migrated artifacts preserve the stable identifiers, mappings, task state, question
            state, and archive-date behavior required by the strict workflow
        - AND: the source `.spec-driven/` artifacts remain unchanged
  cli-migrate-converts-roadmap-and-project-state:
    strength: MUST
    statement: >-
      The system MUST convert legacy `.spec-driven/roadmap/` Markdown artifacts and the legacy specs
      index into strict YAML equivalents during a `migrate` run, writing results under
      `.strict-spec-driven/roadmap/` and the strict specs index path.
    scenarios:
      migrate-converts-roadmap-index-and-milestones:
        - GIVEN: >-
            legacy `roadmap/INDEX.md` and one or more `roadmap/milestones/*.md` files exist under
            `.spec-driven/`
        - WHEN: '`strict-spec-driven migrate` is executed'
        - THEN: >-
            the roadmap index is written as a strict YAML artifact under
            `.strict-spec-driven/roadmap/`
        - AND: >-
            each milestone file is converted to a strict YAML milestone artifact preserving goal,
            scope, done criteria, dependencies, risks, notes, status, and planned change entries
        - AND: the converted artifacts appear in the migration report as converted entries
      migrate-converts-specs-index:
        - GIVEN: a legacy `specs/INDEX.md` exists under `.spec-driven/`
        - WHEN: '`strict-spec-driven migrate` is executed'
        - THEN: the specs index is written as a strict YAML artifact under `.strict-spec-driven/specs/`
        - AND: the converted artifact appears in the migration report as a converted entry
      unsupported-roadmap-markdown-shape-becomes-manual-follow-up:
        - GIVEN: >-
            a legacy roadmap artifact has a Markdown structure that cannot be deterministically
            mapped to strict YAML fields
        - WHEN: '`strict-spec-driven migrate` is executed'
        - THEN: the artifact appears in the migration report as a manual follow-up item
        - AND: no strict YAML output is invented for that artifact
  cli-migrate-enforces-preflight-and-overwrite-protection:
    strength: MUST
    statement: >-
      The system MUST reject migration runs that cannot proceed safely and report the blocking
      preflight or overwrite-protection reason deterministically.
    scenarios:
      migrate-rejects-unsafe-strict-target-overwrite:
        - GIVEN: '`.strict-spec-driven/` already contains conflicting workflow state'
        - AND: no explicit safe rerun policy allows overwriting that state
        - WHEN: '`strict-spec-driven migrate` is executed'
        - THEN: the command exits non-zero
        - AND: the result identifies the overwrite-protection conflict
        - AND: existing strict target files are left unchanged
      migrate-rejects-missing-legacy-source-state:
        - GIVEN: supported legacy workflow artifacts are not present under `.spec-driven/`
        - WHEN: '`strict-spec-driven migrate` is executed'
        - THEN: the command exits non-zero
        - AND: the result identifies the missing bootstrap source state
  cli-migrate-emits-structured-report-output:
    strength: MUST
    statement: >-
      The system MUST emit a structured migration report for each migration run so the operator can
      review converted core workflow artifacts, remaining deferred artifacts, failures, warnings,
      and manual follow-up items.
    scenarios:
      migrate-report-distinguishes-converted-core-workflow-artifacts-from-deferred-artifacts:
        - GIVEN: >-
            `strict-spec-driven migrate` converts supported core workflow artifacts while roadmap or
            project-state converters are still pending
        - WHEN: the migration result is inspected
        - THEN: >-
            converted spec and change artifacts appear in converted entries with their strict target
            paths
        - AND: >-
            unsupported roadmap or project-state artifacts remain identifiable through skipped
            entries or manual follow-up items with source references
  cli-migrate-force-rerun:
    strength: MUST
    statement: >-
      The system MUST allow `strict-spec-driven migrate` to rerun into an existing non-empty
      `.strict-spec-driven/` directory only when the operator explicitly passes `--force` or `-f`.
    scenarios:
      rerun-without-force-stays-blocked:
        - GIVEN: '`strict-spec-driven migrate` already populated `.strict-spec-driven/`'
        - WHEN: the operator runs `strict-spec-driven migrate` again without `--force`
        - THEN: the command exits non-zero
        - AND: the result identifies the strict target conflict
      rerun-with-force-reuses-the-same-structured-output:
        - GIVEN: '`strict-spec-driven migrate` already populated `.strict-spec-driven/`'
        - WHEN: the operator runs `strict-spec-driven migrate --force`
        - THEN: the command exits zero
        - AND: the result matches the structured migration report from the initial successful run
      short-force-flag-reruns-migration:
        - GIVEN: '`strict-spec-driven migrate` already populated `.strict-spec-driven/`'
        - WHEN: the operator runs `strict-spec-driven migrate -f`
        - THEN: the command exits zero
        - AND: the result matches the structured migration report from the initial successful run
  cli-domain-diagnostic-ordering-stability:
    strength: MUST
    statement: >-
      The system MUST preserve deterministic ordering for roadmap, skill-validation, and migration
      diagnostics or report collections even when their implementation is distributed across focused
      modules under `src/skills/`, `src/migrate/parsers/`, and shared helpers in
      `src/diagnostics.ts`.
    scenarios:
      roadmap-diagnostics-keep-stable-ordering-across-repeated-runs:
        - GIVEN: strict roadmap artifacts produce multiple validation diagnostics
        - WHEN: >-
            `strict-spec-driven roadmap-status` is executed repeatedly against the same repository
            state
        - THEN: the diagnostics appear in the same order each time
        - AND: each diagnostic still identifies the invalid artifact and field context
      skill-validation-diagnostics-keep-stable-ordering-across-repeated-runs:
        - GIVEN: strict skill packaging or content validation produces multiple diagnostics
        - WHEN: >-
            `strict-spec-driven validate-skills` is executed repeatedly against the same repository
            state
        - THEN: the diagnostics appear in the same order each time
        - AND: the JSON result keeps the same diagnostic field shape and summary counts
      migration-report-collections-keep-stable-ordering-across-repeated-runs:
        - GIVEN: >-
            bootstrap migration produces multiple warnings, errors, skipped entries, or manual
            follow-up items
        - WHEN: '`strict-spec-driven migrate` is executed repeatedly against the same repository state'
        - THEN: each report collection keeps deterministic ordering across runs
        - AND: shared diagnostic helpers do not invent, drop, or reorder entries nondeterministically
  cli-migrate-report-collections-are-always-arrays:
    strength: MUST
    statement: >-
      The system MUST emit `converted`, `skipped`, `warnings`, `errors`, and `manualFollowUp` as
      top-level array fields in every migration report, including successful, partial, and blocked
      runs.
    scenarios:
      successful-migration-keeps-warning-collections-explicit:
        - GIVEN: a migration run converts all supported artifacts without deferred legacy spec files
        - WHEN: the migration report is inspected
        - THEN: '`warnings` is present as an array'
        - AND: '`manualFollowUp` is present as an array'
      partial-migration-keeps-deferred-collections-explicit:
        - GIVEN: a migration run converts supported artifacts while deferring ambiguous legacy spec files
        - WHEN: the migration report is inspected
        - THEN: '`skipped` is present as an array'
        - AND: '`warnings` is present as an array'
        - AND: '`manualFollowUp` is present as an array'
      blocked-migration-keeps-report-collections-explicit:
        - GIVEN: a migration run is blocked before conversion completes
        - WHEN: the migration report is inspected
        - THEN: '`converted` is present as an array'
        - AND: '`skipped` is present as an array'
        - AND: '`warnings` is present as an array'
        - AND: '`errors` is present as an array'
        - AND: '`manualFollowUp` is present as an array'
  cli-migrate-supports-repository-self-hosting:
    strength: MUST
    statement: >-
      The system MUST allow a repository's actual bootstrap `.spec-driven/` workflow state to be
      migrated into `.strict-spec-driven/` output that is usable as the repository's active strict
      workflow state without rewriting the preserved bootstrap source artifacts.
    scenarios:
      self-host-cutover-migrates-repository-workflow-state:
        - GIVEN: >-
            a repository contains bootstrap specs, roadmap artifacts, and archived or active changes
            under `.spec-driven/`
        - WHEN: '`strict-spec-driven migrate` is executed for the repository cutover'
        - THEN: the command writes corresponding strict YAML workflow state under `.strict-spec-driven/`
        - AND: >-
            the migrated output preserves the identities and relationships needed by strict workflow
            commands
        - AND: the source `.spec-driven/` artifacts remain unchanged
      self-host-cutover-normalizes-blank-legacy-mappings:
        - GIVEN: >-
            a legacy archived delta leaves `mapping.implementation` or `mapping.tests` blank in
            Markdown frontmatter
        - WHEN: '`strict-spec-driven migrate` is executed for the repository cutover'
        - THEN: >-
            the migrated strict delta keeps those mapping fields as empty structured path
            collections
        - AND: the change is not deferred only because the legacy mapping fields were blank
      roadmap-status-accepts-migrated-roadmap-index-paths:
        - GIVEN: >-
            `strict-spec-driven migrate` has produced strict roadmap state for the repository
            cutover
        - WHEN: '`strict-spec-driven roadmap-status` reads the migrated strict roadmap'
        - THEN: migrated milestone paths resolve without reference diagnostics
        - AND: roadmap status validation succeeds against the migrated roadmap index
  cli-ship-reads-archived-change:
    strength: MUST
    statement: >-
      The system MUST provide a `ship` subcommand that resolves a named archived change under
      `.strict-spec-driven/changes/archive/` and reads its proposal summary, supporting both exact
      archive directory names and bare change names expanded via date-prefix matching.
    scenarios:
      ship-resolves-exact-archive-directory-name:
        - GIVEN: '`.strict-spec-driven/changes/archive/<YYYY-MM-DD>-<name>/` exists'
        - WHEN: '`strict-spec-driven ship <YYYY-MM-DD>-<name>` is executed'
        - THEN: the command reads the archived change artifacts from that directory
      ship-expands-bare-name-to-date-prefixed-archive-directory:
        - GIVEN: '`.strict-spec-driven/changes/archive/<YYYY-MM-DD>-<name>/` exists'
        - WHEN: '`strict-spec-driven ship <name>` is executed with the bare change name'
        - THEN: >-
            the command resolves the archived directory by date-prefix expansion and reads its
            artifacts
      ship-reports-ambiguity-when-multiple-date-prefixed-matches-exist:
        - GIVEN: >-
            multiple archive directories matching `*-<name>` exist under
            `.strict-spec-driven/changes/archive/`
        - WHEN: '`strict-spec-driven ship <name>` is executed with the bare name'
        - THEN: the command exits non-zero
        - AND: >-
            the error message lists the matching archive directories and asks the operator to
            specify the full archive directory name
      ship-rejects-missing-archived-change:
        - GIVEN: no matching archived directory exists for the given name
        - WHEN: '`strict-spec-driven ship <name>` is executed'
        - THEN: the command exits non-zero
        - AND: an error message is written to stderr indicating the archived change was not found
  cli-ship-emits-deterministic-json-output:
    strength: MUST
    statement: >-
      The system MUST emit a deterministic JSON object to stdout from the `ship` subcommand
      containing `changeName`, `archivePath`, `proposalSummary`, and `roadmapSnapshot`.
    scenarios:
      ship-output-is-parseable-json:
        - GIVEN: '`strict-spec-driven ship <name>` resolves a valid archived change'
        - WHEN: command stdout is parsed as JSON
        - THEN: the JSON includes `changeName` as a string
        - AND: the JSON includes `archivePath` as the resolved archive directory path
        - AND: the JSON includes `proposalSummary` derived from the archived `proposal.yaml`
        - AND: >-
            the JSON includes `roadmapSnapshot` reflecting current roadmap milestone and planned
            change state
      ship-exits-zero-for-a-valid-archived-change:
        - GIVEN: a named archived change exists and its artifacts are readable
        - WHEN: '`strict-spec-driven ship <name>` is executed'
        - THEN: the command exits with exit code zero
  cli-ship-skill-content-validation-smoke-coverage:
    strength: MUST
    statement: >-
      The system MUST include automated checks that exercise strict ship skill content for both
      passing and failing states, not only package-shape validation.
    scenarios:
      automated-checks-accept-aligned-ship-skill-content:
        - GIVEN: >-
            `strict-spec-ship/SKILL.md` contains an explicit `ship` command reference and
            `.strict-spec-driven/` workflow guidance
        - WHEN: repository automated checks are executed
        - THEN: the ship skill content checks pass
      automated-checks-reject-placeholder-ship-skill-content:
        - GIVEN: >-
            `strict-spec-ship/SKILL.md` retains a generic placeholder command block or omits
            `.strict-spec-driven/` workflow guidance
        - WHEN: repository automated checks are executed
        - THEN: the ship skill content checks fail
        - AND: diagnostics identify the failing skill package deterministically
  cli-shared-output-helpers:
    strength: MUST
    statement: >-
      The system MUST provide a shared `src/cli/output.ts` module with typed helpers for writing
      JSON, human-readable text, usage hints, and error messages to stdout and stderr so command
      modules do not call `process.stdout.write` or `process.stderr.write` directly.
    scenarios:
      json-output-is-written-through-shared-helper:
        - GIVEN: a CLI command produces a structured result
        - WHEN: the command writes its result
        - THEN: the JSON is written via the shared `writeJson` helper
        - AND: the output format is identical to the pre-centralization behavior
      error-output-is-written-through-shared-helpers:
        - GIVEN: a CLI command encounters a usage or runtime error
        - WHEN: the command writes its error or usage hint
        - THEN: the message is written via `writeUsage` or `writeError` as appropriate
        - AND: the stderr format is identical to the pre-centralization behavior
  cli-propose-populates-artifacts-from-structured-input:
    strength: MUST
    statement: >-
      The system MUST provide CLI behavior that populates existing strict change planning artifacts
      from explicit structured command input without requiring an AI agent to write the YAML
      artifact directly.
    scenarios:
      proposal-artifact-is-generated-from-command-input:
        - GIVEN: a strict change scaffold already exists
        - AND: valid command input describes one supported planning artifact
        - WHEN: the corresponding artifact population command is executed for that change
        - THEN: the target planning artifact is written under the existing change directory
        - AND: the written artifact validates against its strict YAML artifact schema
  cli-propose-generation-is-artifact-scoped:
    strength: MUST
    statement: >-
      The system MUST expose proposal population as artifact-level operations so proposal, design,
      questions, and individual delta specs can be generated through separate CLI invocations.
    scenarios:
      artifacts-can-be-generated-one-at-a-time:
        - GIVEN: a strict change scaffold exists
        - WHEN: >-
            a user or agent generates only one supported planning artifact from explicit command
            input
        - THEN: the command writes only that target artifact
        - AND: unrelated planning artifacts in the same change are left unchanged
  cli-propose-generation-preserves-scaffold-behavior:
    strength: MUST
    statement: >-
      The system MUST preserve the existing propose scaffold behavior while adding scripted artifact
      population as a follow-up workflow step and may reuse an existing change directory tree only
      when that tree contains no files.
    scenarios:
      existing-propose-command-still-scaffolds:
        - GIVEN: a valid kebab-case change name that does not already exist
        - WHEN: strict-spec-driven propose is executed without a generation input
        - THEN: the command creates the standard strict change scaffold
        - AND: no artifact-specific population input is required
      empty-change-directory-can-be-scaffolded:
        - GIVEN: >-
            a valid kebab-case change name whose change directory already exists with only empty
            subdirectories
        - WHEN: strict-spec-driven propose is executed for that name
        - THEN: the command writes the standard strict change scaffold into that directory
        - AND: pre-existing empty subdirectories remain in place
      populated-change-directory-still-fails:
        - GIVEN: a valid kebab-case change name whose change directory already contains a file
        - WHEN: strict-spec-driven propose is executed for that name
        - THEN: the command exits non-zero with an existing-change collision
        - AND: existing artifacts remain unchanged
  cli-propose-generation-uses-named-arguments:
    strength: MUST
    statement: >-
      The system MUST provide proposal population commands that accept supported artifact content
      only through named CLI arguments, including repeated grouped question, mapping, scenario, and
      requirement arguments in a single invocation for artifacts that contain keyed collections.
    scenarios:
      named-argument-generation-does-not-use-payload-files:
        - GIVEN: a strict change scaffold exists
        - WHEN: an agent populates supported generated artifacts
        - THEN: the generated CLI commands use named arguments directly
        - AND: no JSON payload file is required
  cli-propose-generation-uses-direct-invocations:
    strength: MUST
    statement: >-
      The system MUST support direct agent-generated CLI invocations with named arguments as the
      only orchestration form for strict proposal population.
    scenarios:
      generated-cli-invocations-populate-change:
        - GIVEN: a strict change scaffold exists
        - AND: >-
            an agent produces one or more strict CLI proposal population commands with named
            arguments
        - WHEN: those commands are executed from the repository root
        - THEN: the requested strict change artifacts are populated
        - AND: no command constructs or consumes an AI-authored JSON payload file
  cli-propose-generation-reports-argument-errors:
    strength: MUST
    statement: >-
      The system MUST report invalid, incomplete, or positional proposal population arguments as
      deterministic CLI failures before writing target YAML artifacts.
    scenarios:
      missing-required-flag-fails-before-write:
        - GIVEN: a strict change scaffold exists
        - AND: a proposal population command omits a required named argument
        - WHEN: the command is executed
        - THEN: the command exits non-zero
        - AND: stderr identifies the missing argument name
        - AND: the existing target artifact is left unchanged
      positional-input-fails-before-write:
        - GIVEN: a strict change scaffold exists
        - AND: a proposal population command supplies a positional file argument
        - WHEN: the command is executed
        - THEN: the command exits non-zero
        - AND: stderr prints named-argument usage
        - AND: the existing target artifact is left unchanged
  cli-propose-generation-prevents-duplicates:
    strength: MUST
    statement: >-
      The system MUST prevent duplicate YAML content when equivalent proposal population commands
      are executed more than once.
    scenarios:
      repeated-list-values-are-deduplicated:
        - GIVEN: a strict change artifact already contains a generated list entry
        - WHEN: the same population command supplies the same list entry again
        - THEN: the resulting YAML artifact contains that list entry only once
        - AND: the original list order is preserved
      keyed-items-are-upserted-by-identifier:
        - GIVEN: >-
            a generated artifact contains a keyed item such as a task, question, decision, or
            requirement
        - WHEN: a later population command targets the same item identifier with equivalent content
        - THEN: the resulting YAML artifact contains one item for that identifier
        - AND: no duplicate keyed entry is written
      conflicting-keyed-items-fail-before-write:
        - GIVEN: a generated artifact contains a keyed item
        - WHEN: a later population command targets the same identifier with conflicting content
        - THEN: the command exits non-zero before writing the artifact
        - AND: stderr identifies the duplicate identifier conflict
  cli-propose-tasks-yaml-remains-scaffold-authored:
    strength: MUST
    statement: >-
      The system MUST keep tasks.yaml as a scaffolded change artifact that agents edit directly
      according to the task-list schema rather than exposing tasks as a generate command artifact.
    scenarios:
      tasks-artifact-is-not-generated-by-command:
        - GIVEN: a strict change scaffold exists
        - WHEN: the generate command is invoked with the tasks artifact selector
        - THEN: the command exits non-zero
        - AND: the scaffolded tasks.yaml remains unchanged
  cli-subcommands-support-help:
    strength: MUST
    statement: >-
      The system MUST support exact `--help` and `-h` help requests for the root CLI and every
      registered subcommand, printing usage to stdout and exiting zero without performing the
      command's normal mutation or validation behavior.
    scenarios:
      root-help-lists-commands:
        - GIVEN: the strict CLI is available
        - WHEN: the root CLI is invoked with `--help`
        - THEN: the command exits zero
        - AND: stdout lists the registered commands in canonical order
        - AND: stderr is empty
      subcommand-help-shows-usage:
        - GIVEN: a registered strict CLI subcommand exists
        - WHEN: that subcommand is invoked with `--help`
        - THEN: the command exits zero
        - AND: stdout contains the subcommand usage
        - AND: stderr is empty
  cli-roadmap-loads-split-planned-change-files:
    strength: MUST
    statement: >-
      The system MUST load roadmap planned-change state from standalone planned-change artifacts as
      well as inline milestone planned_changes entries, associating every standalone planned change
      with exactly one owning milestone and preserving deterministic roadmap order.
    scenarios:
      split-planned-change-files-load-with-owning-milestone:
        - GIVEN: >-
            a strict roadmap contains milestone metadata and a standalone planned-change artifact
            that references one owning milestone
        - WHEN: strict roadmap state is loaded for roadmap-status or roadmap-sync
        - THEN: >-
            the standalone planned change is reported under its owning milestone in deterministic
            roadmap order
        - AND: >-
            existing inline milestone planned_changes entries remain valid during the compatibility
            window
  cli-roadmap-sync-preserves-split-planned-change-state:
    strength: MUST
    statement: >-
      The system MUST make roadmap-status and roadmap-sync derive and rewrite planned-change
      completion state consistently for inline and standalone planned-change representations without
      adding duplicate planned-change entries or moving data between representations implicitly.
    scenarios:
      sync-keeps-split-and-inline-state-deterministic:
        - GIVEN: >-
            a strict roadmap includes standalone planned-change files and inline milestone
            planned_changes entries
        - WHEN: >-
            roadmap-status or roadmap-sync reconciles planned-change state against active and
            archived strict changes
        - THEN: >-
            declared and derived planned-change statuses are computed consistently for both
            representations
        - AND: >-
            sync output preserves deterministic ordering and does not create duplicate
            planned-change entries
  cli-roadmap-materializes-inline-planned-changes:
    strength: MUST
    statement: >-
      The system MUST provide an explicit operator-selected roadmap conversion path that
      materializes inline milestone planned_changes entries as standalone planned-change YAML
      artifacts without losing planned-change identity, owning milestone, status, summary, details,
      or dependency data.
    scenarios:
      inline-planned-changes-materialize-as-standalone-files:
        - GIVEN: a strict roadmap milestone contains inline planned_changes entries
        - WHEN: the explicit inline-to-standalone roadmap conversion path is executed
        - THEN: standalone planned-change YAML artifacts are written for the converted planned changes
        - AND: >-
            each standalone artifact preserves the planned change id, owning milestone reference,
            status, summary, details, and depends_on values
      ordinary-sync-does-not-move-representation:
        - GIVEN: a strict roadmap still contains inline planned_changes entries
        - WHEN: >-
            ordinary roadmap-status or roadmap-sync behavior runs without the explicit conversion
            trigger
        - THEN: planned changes are not silently moved between inline and standalone representations
  cli-roadmap-cross-file-conflict-validation:
    strength: MUST
    statement: >-
      The system MUST make roadmap-status reject invalid split-file roadmap state with deterministic
      diagnostics for duplicate planned change identities, missing milestone references, invalid
      cross-file dependency references, ambiguous advisory ownership metadata, and conflicts with
      active strict changes for the same planned change identity.
    scenarios:
      roadmap-status-rejects-cross-file-conflicts:
        - GIVEN: a strict roadmap contains milestone metadata plus standalone planned-change files
        - WHEN: strict-spec-driven roadmap-status is executed
        - THEN: >-
            the command exits non-zero for duplicate planned change identities, missing milestone
            references, invalid dependency references, ambiguous advisory ownership metadata, or
            active strict change conflicts
  cli-roadmap-handoff-uses-split-planned-change-sources:
    strength: MUST
    statement: >-
      The system MUST make roadmap recommendation and roadmap-to-change proposal handoff treat
      standalone planned-change artifacts as eligible roadmap-backed work sources, using dependency
      readiness and active strict change conflicts when selecting or scaffolding exactly one planned
      change.
    scenarios:
      split-planned-change-is-selected-for-handoff:
        - GIVEN: >-
            a strict roadmap contains milestone metadata and standalone planned-change artifacts
            with complete dependencies
        - WHEN: strict roadmap recommendation or proposal handoff evaluates roadmap-backed work
        - THEN: >-
            one eligible standalone planned change can be selected and scaffolded as a normal strict
            change with its planned-change identity and owning milestone reference
  cli-roadmap-team-metadata-validation:
    strength: MUST
    statement: >-
      The system MUST accept valid optional team metadata on standalone planned-change files and
      reject malformed team metadata through deterministic roadmap validation diagnostics.
    scenarios:
      roadmap-status-validates-planned-change-team-metadata:
        - GIVEN: a strict roadmap contains standalone planned-change files with optional team metadata
        - WHEN: strict-spec-driven roadmap-status is executed
        - THEN: valid owner, reviewer, blocked-state, label, and external-reference metadata is accepted
  cli-split-roadmap-regression-coverage:
    strength: MUST
    statement: >-
      The system MUST include copied-project regression coverage for split-file roadmap workflows,
      covering standalone planned-change loading, inline planned-change materialization, cross-file
      validation, recommendation and proposal handoff, team metadata validation, and shared roadmap
      index preservation.
    scenarios:
      copied-project-split-roadmap-regressions-cover-team-workflow:
        - GIVEN: >-
            a copied project fixture contains strict roadmap milestone metadata, standalone
            planned-change artifacts, and inline planned_changes entries where compatibility or
            migration behavior is required
        - WHEN: >-
            the repository roadmap regression tests execute roadmap status, sync, materialization,
            validation, recommendation, and proposal-handoff flows
        - THEN: >-
            the tests verify deterministic CLI behavior, preserved planned-change metadata, stable
            shared index output, accepted valid team metadata, rejected invalid cross-file state,
            and exactly-one eligible planned-change handoff
  cli-embedded-template-inspection:
    strength: MUST
    statement: >-
      The system MUST provide read-only CLI commands that list bundled template asset keys and print
      a selected embedded schema or scaffold template asset so agents can inspect artifact contracts
      without per-skill template directories.
    scenarios:
      embedded-template-listing-is-deterministic:
        - GIVEN: the strict CLI has embedded template assets available
        - WHEN: a template listing command is executed
        - THEN: the command exits zero and emits deterministic asset keys
      embedded-template-show-prints-selected-asset:
        - GIVEN: the strict CLI has an embedded schema or scaffold asset matching a requested key
        - WHEN: a template show command is executed for that key
        - THEN: the command exits zero and writes the selected asset content
  cli-skills-templates-symlink-optional:
    strength: MUST
    statement: >-
      The system MUST validate strict skill packaging without requiring every skill directory to
      include a templates symlink, while continuing to require executable script access for
      documented skill commands.
    scenarios:
      skills-without-template-symlink-validate:
        - GIVEN: >-
            a strict skill package includes valid skill metadata, SKILL.md content, and the required
            scripts symlink
        - WHEN: skill packaging validation runs
        - THEN: the package is not rejected solely because a templates symlink is absent
      script-symlink-remains-required:
        - GIVEN: a strict skill package is missing the scripts symlink required by documented commands
        - WHEN: skill packaging validation runs
        - THEN: the missing scripts symlink remains a validation failure
  cli-skill-yaml-rules-schema-lookup-reminder:
    strength: SHOULD
    statement: >-
      Core strict skills that directly create or edit strict change YAML SHOULD remind agents in
      their YAML Writing Rules to use the embedded schema lookup CLI when artifact fields are
      unclear, because installed skills do not carry per-skill templates directories.
    scenarios:
      yaml-rules-mention-schema-lookup:
        - GIVEN: a core strict skill includes a YAML Writing Rules section
        - WHEN: an agent reads the rules before editing strict YAML
        - THEN: the rules mention schema-show as the supported way to inspect unclear artifact fields
        - THEN: the rules state that installed skills do not carry a templates directory
  cli-archive-rejects-added-requirement-collisions:
    strength: MUST
    statement: >-
      The system MUST block archive when a strict delta spec ADDED operation would overwrite an
      existing requirement in the target main spec.
    scenarios:
      added-collision-blocks-archive-before-main-spec-write:
        - GIVEN: >-
            a complete strict change contains a delta spec whose ADDED keyed map includes a
            requirement id already present in the target main spec
        - WHEN: '`strict-spec-driven archive <name>` is executed'
        - THEN: the command exits non-zero before rewriting the target main spec
        - AND: the active change remains in the active changes directory
        - AND: the error output identifies the duplicate ADDED requirement id and target spec
      verify-reports-added-collision:
        - GIVEN: >-
            a strict change contains a delta spec whose ADDED keyed map includes a requirement id
            already present in the target main spec
        - WHEN: '`strict-spec-driven verify <name>` is executed'
        - THEN: verification reports a deterministic validation diagnostic for the ADDED collision
        - AND: the diagnostic identifies the delta spec path, target spec, and requirement id
  cli-reports-deterministic-change-next-steps:
    strength: MUST
    statement: >-
      The system MUST provide CLI behavior that reports a named active change's deterministic
      workflow state, blocking conditions, and scriptable next-step command suggestions without
      inventing product or implementation decisions.
    scenarios:
      next-step-output-reports-blocking-state:
        - GIVEN: >-
            an active strict change exists with planning artifacts, tasks, questions, and delta
            specs
        - WHEN: the deterministic workflow-state CLI behavior is executed for that change
        - THEN: >-
            the output identifies blocking conditions such as pending tasks, open questions, missing
            delta specs, or validation diagnostics
        - AND: >-
            the output includes concrete command suggestions only for script-owned workflow
            mechanics
        - AND: >-
            the output does not decide product scope, requirement content, or user checkpoint
            answers
  cli-checks-proposal-readiness:
    strength: MUST
    statement: >-
      The system MUST provide deterministic proposal-readiness checks that can be run before
      implementation to identify missing or incomplete strict planning artifacts.
    scenarios:
      readiness-check-finds-incomplete-planning-artifacts:
        - GIVEN: a strict change has been scaffolded and partially populated
        - WHEN: proposal-readiness CLI behavior is executed for that change
        - THEN: >-
            the output reports missing proposal, design, task-list, question-list, or delta-spec
            structure that prevents a decision-ready handoff
        - AND: >-
            the diagnostics are deterministic and identify the affected artifact path and field or
            workflow condition
  cli-updates-question-state-deterministically:
    strength: MUST
    statement: >-
      The system MUST provide CLI behavior for adding, preserving, and resolving strict change
      questions while maintaining the question-list schema and refusing conflicting duplicate
      question content.
    scenarios:
      question-resolution-preserves-structured-state:
        - GIVEN: a strict change has a questions.yaml artifact with an open question
        - WHEN: the CLI resolves that question with an explicit answer
        - THEN: the question is moved or represented as resolved according to the question-list schema
        - AND: the updated artifact validates against the registered question-list schema
        - AND: conflicting duplicate question identifiers are rejected deterministically
  cli-commit-and-push-auto-commits-latest-archive:
    strength: MUST
    statement: >-
      The system MUST provide a commit-and-push subcommand that finds the most recently archived
      change by date prefix, stages all project changes with git add ., commits with message 'feat:
      <change-name>', and pushes to remote.
    scenarios:
      no-archived-changes-exits-non-zero:
        - GIVEN: no archived changes exist under .strict-spec-driven/changes/archive/
        - WHEN: strict-spec-driven commit-and-push is executed
        - THEN: the command exits non-zero and an error message indicates no archived changes were found
      latest-archive-commits-and-pushes:
        - GIVEN: one or more date-prefixed archived change directories exist
        - WHEN: strict-spec-driven commit-and-push is executed
        - THEN: >-
            the command resolves the latest archived change by date prefix, runs git add ., commits
            with 'feat: <change-name>', and pushes to remote
      no-changes-to-commit-exits-non-zero:
        - GIVEN: no unstaged or untracked changes exist in the working tree
        - WHEN: strict-spec-driven commit-and-push is executed
        - THEN: the command exits non-zero and an error message indicates nothing to commit
      push-failure-does-not-rollback:
        - GIVEN: git commit succeeds but git push fails
        - WHEN: strict-spec-driven commit-and-push is executed
        - THEN: >-
            the command exits non-zero with a push error and the commit is preserved in the local
            repository
  cli-dev-session-bundled-assets:
    strength: MUST
    statement: >-
      The system MUST bundle dev-session schema and template assets so shared strict CLI validation
      and scaffold utilities can recognize the dev-session declaration without repository-specific
      setup.
    scenarios:
      cli-loads-dev-session-assets:
        - GIVEN: a strict CLI command needs to validate or scaffold the dev-session declaration
        - WHEN: it loads bundled schema or scaffold assets
        - THEN: >-
            the dev-session contract assets are available through the same bundled template and
            validation pipeline used for other strict artifacts
  cli-dev-session-plan-command:
    strength: MUST
    statement: >-
      The system MUST provide a dev-session-plan CLI command that validates
      .strict-spec-driven/dev-session.yaml and emits a deterministic machine-readable dry session
      plan covering declared services, readiness checks, browser targets, cleanup behavior,
      unavailable conditions, and required environment variable names without starting services or
      creating runtime state.
    scenarios:
      cli-prints-dev-session-plan:
        - GIVEN: a strict project contains a valid .strict-spec-driven/dev-session.yaml declaration
        - WHEN: the user runs strict-spec-driven dev-session-plan
        - THEN: >-
            the command emits deterministic machine-readable output describing the declared
            services, readiness metadata, browser targets, cleanup behavior, unavailable conditions,
            and required environment variable names
        - AND: the command does not start services, open browsers, or write runtime state
  cli-dev-session-plan-diagnostics:
    strength: MUST
    statement: >-
      The system MUST fail dev-session-plan with deterministic diagnostics when the dev-session
      declaration is missing or violates the bundled dev-session schema.
    scenarios:
      cli-reports-missing-or-invalid-dev-session:
        - GIVEN: >-
            a strict project is missing .strict-spec-driven/dev-session.yaml or the declaration does
            not satisfy the bundled dev-session schema
        - WHEN: the user runs strict-spec-driven dev-session-plan
        - THEN: >-
            the command exits without starting services and reports deterministic diagnostics that
            identify the blocking declaration problem
  cli-dev-session-start-command:
    strength: MUST
    statement: >-
      The system MUST provide a dev-session-start command that loads the declared dev-session plan,
      starts the declared services, waits for configured readiness checks, and records managed
      runtime state without starting undeclared processes.
    scenarios:
      cli-starts-declared-dev-session-services:
        - GIVEN: a strict project contains a valid dev-session declaration with startable services
        - WHEN: the user runs strict-spec-driven dev-session-start
        - THEN: >-
            the command starts the declared services, waits for readiness, records managed runtime
            state, and exits successfully without guessing undeclared setup
  cli-dev-session-status-command:
    strength: MUST
    statement: >-
      The system MUST provide a dev-session-status command that reports deterministic lifecycle
      state for services previously started by dev-session-start, including running, failed,
      stopped, and stale records.
    scenarios:
      cli-reports-managed-dev-session-state:
        - GIVEN: managed runtime state exists for services started by dev-session-start
        - WHEN: the user runs strict-spec-driven dev-session-status
        - THEN: >-
            the command reports per-service lifecycle state derived from the stored runtime records
            and current process liveness checks
  cli-dev-session-logs-command:
    strength: MUST
    statement: >-
      The system MUST provide a dev-session-logs command that exposes logs for services started by
      dev-session-start using deterministic service selection and stored log locations.
    scenarios:
      cli-prints-managed-dev-session-logs:
        - GIVEN: managed runtime state includes log files for services started by dev-session-start
        - WHEN: the user runs strict-spec-driven dev-session-logs
        - THEN: >-
            the command prints logs for the selected declared service without requiring internal
            process identifiers
  cli-dev-session-stop-command:
    strength: MUST
    statement: >-
      The system MUST provide a dev-session-stop command that stops only the processes recorded by
      dev-session-start, tolerates stale runtime records, and makes cleanup idempotent.
    scenarios:
      cli-stops-managed-dev-session-services:
        - GIVEN: managed runtime state exists for services started by dev-session-start
        - WHEN: the user runs strict-spec-driven dev-session-stop
        - THEN: >-
            the command stops only the recorded managed processes, reports stale records explicitly,
            and leaves unrelated processes untouched
  cli-dev-session-trial-command:
    strength: MUST
    statement: >-
      The system MUST provide a dev-session-trial CLI command that derives deterministic
      browser-trial guidance from declared dev-session browser targets and managed lifecycle state
      so strict workflows can report target URLs, smoke paths, evidence labels, and whether local
      targets are strict-managed, already available, or unavailable without replacing the required
      project regression command.
    scenarios:
      cli-reports-browser-trial-guidance:
        - GIVEN: >-
            a strict project declares browser targets in .strict-spec-driven/dev-session.yaml and
            may or may not have managed lifecycle state for the related services
        - WHEN: the user runs strict-spec-driven dev-session-trial
        - THEN: >-
            the command reports deterministic local URLs, smoke paths, evidence labels, and target
            provenance without guessing undeclared routes or replacing the required project
            regression command
  dev-session-scripts-reads-declaration:
    strength: MUST
    statement: >-
      The script-generation skill MUST read .strict-spec-driven/dev-session.yaml to discover
      declared services, commands, readiness checks, and lifecycle behavior before generating any
      output scripts.
    scenarios:
      skill-reads-dev-session-yaml:
        - GIVEN: >-
            A project has a valid .strict-spec-driven/dev-session.yaml declaring at least one
            service
        - WHEN: The script-generation skill is invoked
        - THEN: >-
            The skill reads the declared metadata and uses it as the sole source of truth for
            generated script content
  req-dev-session-real-project-fixture-regression:
    strength: MUST
    statement: >-
      The system MUST validate dev-session plan output, invalid metadata diagnostics, stale runtime
      state recovery, cleanup idempotency, and browser trial evidence derivation against a committed
      real-project fixture using the copied-project harness so regression scenarios are repeatable
      without external services or credentials.
    scenarios:
      scenario-valid-plan-against-fixture:
        - GIVEN: a strict project fixture with a valid dev-session.yaml copied into a temporary workspace
        - WHEN: dev-session-plan is run against the copied workspace
        - THEN: >-
            the command exits zero, reports valid=true, emits the declared session id and service
            details, and produces no diagnostics
  cli-dev-session-skill-content-validation-smoke-coverage:
    strength: MUST
    statement: >-
      The system MUST include automated checks that verify core lifecycle skill SKILL.md files
      contain dev-session guidance sections, emitting deterministic diagnostics when the guidance is
      absent, and accepting aligned skills that include dev-session inspection, browser target,
      evidence capture, service stop, and unavailable-prerequisite instructions.
    scenarios:
      automated-checks-accept-aligned-dev-session-skill-guidance:
        - GIVEN: >-
            strict core lifecycle skills (strict-spec-apply, strict-spec-auto, strict-spec-verify,
            strict-spec-review) include a dev-session guidance section with dev-session-plan
            inspection, declared browser target, evidence capture, service stop, and
            unavailable-prerequisite instructions
        - WHEN: repository automated checks are executed
        - THEN: the dev-session skill content checks pass
  cli-dev-session-documentation-smoke-coverage:
    strength: MUST
    statement: >-
      The system MUST include automated checks that verify DEV_SESSIONS.md exists and contains the
      required documentation sections (declaration, commands, helper scripts, browser trial
      evidence, secret handling, stale cleanup), emitting deterministic diagnostics when required
      sections are absent.
    scenarios:
      automated-checks-accept-complete-dev-sessions-guide:
        - GIVEN: DEV_SESSIONS.md exists with all required documentation sections
        - WHEN: repository automated checks are executed
        - THEN: the dev-session documentation checks pass
  dev-session-init-skill-bootstrap-and-validation:
    strength: MUST
    statement: >-
      The system MUST provide a dedicated dev-session initialization skill that uses the bundled
      strict init scaffold to create or repair .strict-spec-driven/dev-session.yaml, updates the
      declaration from repository context and any existing declaration content, and validates the
      result with dev-session-plan without starting services.
    scenarios:
      skill-bootstraps-or-updates-dev-session-yaml:
        - GIVEN: >-
            a strict workflow project may or may not already contain
            .strict-spec-driven/dev-session.yaml
        - WHEN: the dev-session initialization skill is invoked
        - THEN: >-
            the skill ensures the declaration exists via the bundled scaffold path and updates the
            declaration in place with project-specific session metadata rather than silently
            replacing it
      skill-validates-generated-declaration:
        - GIVEN: the skill has produced a candidate dev-session declaration
        - WHEN: it reaches the validation step
        - THEN: it runs dev-session-plan and reports the resulting plan or deterministic diagnostics
        - AND: it does not start services, open browsers, or write runtime state
  cli-review-command-is-removed:
    strength: MUST
    statement: >-
      The system MUST remove the deterministic review subcommand from the strict CLI lifecycle so
      review is not represented as a script-completed code audit.
    scenarios:
      review-command-is-not-registered:
        - GIVEN: the strict CLI command registry is inspected
        - WHEN: available lifecycle commands are enumerated
        - THEN: review is not registered as a CLI subcommand
      review-command-is-not-suggested-after-verify:
        - GIVEN: a strict change verifies without diagnostics
        - WHEN: workflow-state next-step suggestions are produced
        - THEN: the suggestions do not include strict-spec-driven review
        - AND: any review handoff is represented as skill guidance rather than a CLI command
  cli-review-auto-fixes-and-retests:
    strength: MUST
    statement: >-
      The system MUST require strict review workflow guidance to automatically fix safe in-scope
      review findings, rerun strict verification and the configured complete project regression
      after review-time code changes, and block archive recommendation or execution unless that
      regression evidence passes.
    scenarios:
      review-findings-are-fixed-and-retested:
        - GIVEN: a completed strict change has passed strict verification and enters review
        - WHEN: the AI review finds issues that are safe to fix within the current change scope
        - THEN: the review workflow guidance requires the AI to apply those fixes automatically
        - AND: >-
            the workflow requires strict verification and the configured complete project regression
            command to be rerun after the review-time code changes
        - AND: >-
            archive recommendation or execution remains blocked unless the rerun regression evidence
            passes
  cli-propose-scaffolds-lint-testing-task:
    strength: MUST
    statement: >-
      The system MUST scaffold new strict change tasks.yaml artifacts with an explicit lint Testing
      task ordered before the unit test task.
    scenarios:
      propose-scaffold-includes-lint-before-tests:
        - GIVEN: a valid kebab-case change name that does not already exist
        - WHEN: strict-spec-driven propose <name> is executed
        - THEN: the scaffolded tasks.yaml includes a run-lint task in the Testing section
        - AND: the run-lint task appears before the run-tests task
        - AND: >-
            the existing validation_task and unit_test_task testing gates continue to reference
            build validation and unit tests

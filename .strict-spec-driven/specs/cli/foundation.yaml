        - WHEN: an operator invokes the harness scripts with an environment and optional component selection
        - THEN: the workflow plans or runs only the selected declared components in dependency order, reports deterministic status/log evidence, enforces declared operation capabilities and safety policy, and records session evidence when a harness session is active

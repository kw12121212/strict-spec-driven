        - WHEN: '`strict-spec-driven verify-spec-mappings` is executed'
        - THEN: mapping-coverage diagnostics are not emitted
      missing-mapping-coverage-produces-diagnostics:
        - GIVEN: >-
            a main spec omits the mapping field or has an empty implementation or test mapping
            collection
        - WHEN: '`strict-spec-driven verify-spec-mappings` is executed'
        - THEN: a diagnostic is emitted identifying the spec path and missing coverage
  cli-verify-spec-mappings-audits-unmapped-evidence:
    strength: MUST
    statement: >-
      The system MUST audit unmapped repository evidence by reporting implementation or test files
      that are not referenced by any spec mapping entry.
    scenarios:
      fully-mapped-repository-evidence-produces-no-unmapped-diagnostics:
        - GIVEN: >-
            relevant implementation and test files are each referenced by at least one spec mapping
            entry
        - WHEN: '`strict-spec-driven verify-spec-mappings` is executed'
        - THEN: unmapped-evidence diagnostics are not emitted
      unmapped-evidence-produces-diagnostics:
        - GIVEN: >-
            at least one relevant implementation or test file is not referenced by any spec mapping
            entry
        - WHEN: '`strict-spec-driven verify-spec-mappings` is executed'
        - THEN: a diagnostic is emitted identifying each unmapped file path
  cli-verify-spec-mappings-emits-deterministic-json-output:
    strength: MUST
    statement: >-

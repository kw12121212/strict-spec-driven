schema: strict-spec-driven/main-spec/v1
schema_version: 1
artifact_type: main_spec
schema_file: templates/strict-spec-driven/schemas/main-spec.yaml
spec:
  id: cli-foundation
  title: CLI Foundation
mapping:
  implementation:
    - package.json
    - install.sh
    - tsconfig.json
    - src/cli/argv.ts
    - src/cli/changes.ts
    - src/cli/cmd-change.ts
    - src/cli/cmd-dev-session.ts
    - src/cli/cmd-generation.ts
    - src/cli/output.ts
    - src/cli/cmd-migration.ts
    - src/cli/cmd-operations.ts
    - src/cli/cmd-roadmap.ts
    - src/cli/cmd-scaffold.ts
    - src/cli/cmd-templates.ts
    - src/cli/cmd-workflow.ts
    - src/cli/entrypoint.ts
    - src/cli/fs.ts
    - src/cli/registry.ts
    - src/cli/spec-mapping.ts
    - src/cli/usage.ts
    - src/converters/roadmap.ts
    - src/diagnostics.ts
    - src/migrate.ts
    - src/migrate/parsers/shared.ts
    - src/migrate/parsers/specs.ts
    - src/migrate/parsers/change-artifacts.ts
    - src/migrate/converters/changes.ts
    - src/migrate/converters/roadmap.ts
    - src/migrate/converters/specs.ts
    - src/migrate/preflight.ts
    - src/migrate/reporting.ts
    - src/migrate/shared.ts
    - src/maintenance.ts
    - src/strict-spec-cli.ts
    - src/roadmap.ts
    - src/roadmap/model.ts
    - src/roadmap/shared.ts
    - src/roadmap/validate.ts
    - src/roadmap/load.ts
    - src/roadmap/status.ts
    - src/roadmap/sync.ts
    - src/archive.ts
    - src/dev-session.ts
    - src/propose-generation.ts
    - src/scaffold.ts
    - src/embedded-templates.ts
    - src/validation.ts
    - src/workflow-state.ts
    - src/yaml.ts
    - src/apply.ts
    - src/verify.ts
    - src/skills.ts
    - src/skills/model.ts
    - src/skills/frontmatter.ts
    - src/skills/content.ts
    - src/skills/fs-checks.ts
    - src/skills/diagnostics.ts
    - skills/strict-spec-ship/SKILL.md
    - templates/strict-spec-driven/scaffold/config.yaml
    - templates/strict-spec-driven/scaffold/changes/proposal.yaml
    - templates/strict-spec-driven/scaffold/changes/design.yaml
    - templates/strict-spec-driven/scaffold/changes/tasks.yaml
    - templates/strict-spec-driven/scaffold/changes/questions.yaml
    - templates/strict-spec-driven/scaffold/specs/INDEX.yaml
    - templates/strict-spec-driven/scaffold/roadmap/INDEX.yaml
  tests:
    - test/run.ts
    - test/support/harness.ts
    - test/suites/entrypoint-and-skills.ts
    - test/suites/dev-session-plan.ts
    - test/suites/dev-session-lifecycle.ts
    - test/suites/dev-session-trial.ts
    - test/suites/dev-session-regression.ts
    - test/suites/foundation-and-fixtures.ts
    - test/suites/change-lifecycle.ts
    - test/suites/roadmap-and-migration.ts
    - test/suites/operations.ts
    - test/fixtures/projects/todo-app/src/index.ts
    - test/fixtures/projects/todo-app/src/todos.ts
    - test/fixtures/projects/todo-app/test/todos.test.ts
requirements:
  cli-build-and-test-commands:
    strength: MUST
    statement: >-
      The system MUST provide `build` and `test` package scripts that compile TypeScript sources to
      `dist/` and run the test suite using bun.
    scenarios:
      build-compiles-without-errors:
        - GIVEN: the TypeScript sources under `src/` are syntactically valid
        - WHEN: '`bun run build` is executed'
        - THEN: the TypeScript compiler produces compiled output under `dist/` with zero errors
      test-suite-is-executable:
        - GIVEN: the `dist/` output exists
        - WHEN: '`bun test/run.ts` is executed'
        - THEN: the test suite runs and reports pass or fail status
  cli-unknown-subcommand-rejection:
    strength: MUST
    statement: >-
      The system MUST exit non-zero and write a usage hint to stderr when invoked with an unknown
      subcommand or no arguments.
    scenarios:
      unknown-subcommand-exits-non-zero:
        - GIVEN: the `strict-spec-driven` CLI is invoked with an unrecognized subcommand
        - WHEN: the command router processes the argument
        - THEN: the process exits with a non-zero exit code
        - AND: a usage hint is written to stderr
      no-arg-invocation-exits-non-zero:
        - GIVEN: the `strict-spec-driven` CLI is invoked with no arguments
        - WHEN: the command router processes the argument
        - THEN: the process exits with a non-zero exit code
        - AND: a usage hint is written to stderr
  cli-shared-yaml-validation-layer:
    strength: MUST
    statement: >-
      The system MUST provide shared strict-CLI validation utilities for YAML parse/stringify,
      schema compilation, bundled schema loading, and deterministic diagnostics so multiple commands
      can validate artifacts through one consistent pipeline.
    scenarios:
      bundled-schemas-are-loadable-for-command-validation:
        - GIVEN: a strict CLI command needs to validate an artifact
        - WHEN: it requests a schema through the shared validation utilities
        - THEN: >-
            the schema is loaded from bundled strict schema assets under
            `templates/strict-spec-driven/schemas/`
      validation-diagnostics-are-deterministic:
        - GIVEN: the same invalid artifact is validated multiple times against the same schema
        - WHEN: diagnostics are emitted by the shared validation utilities
        - THEN: diagnostic entries are stable in structure and ordering
        - AND: each diagnostic includes artifact path and field-path context
  cli-strict-scaffold-template-assets:
    strength: MUST
    statement: >-
      The system MUST provide bundled strict scaffold template assets that can seed initial
      `.strict-spec-driven/` project state for init and fixture-driven tests.
    scenarios:
      required-scaffold-template-asset-families-are-present:
        - GIVEN: the strict CLI bundled templates are inspected
        - WHEN: scaffold template assets are enumerated
        - THEN: >-
            template assets exist for strict config, specs index, roadmap index, and empty changes
            state
      scaffold-templates-remain-separate-from-contract-schemas-and-examples:
        - GIVEN: strict template directories are inspected
        - WHEN: scaffold template assets are compared to schema and example assets
        - THEN: scaffold assets are stored as a distinct template bundle
        - AND: schema and example files remain dedicated to validation contracts and examples
  cli-init-creates-strict-workflow-scaffold:
    strength: MUST
    statement: >-
      The system MUST provide an `init` subcommand that creates strict workflow state under
      `.strict-spec-driven/` using bundled scaffold template assets.
    scenarios:
      init-creates-missing-strict-scaffold-artifacts:
        - GIVEN: a repository with bundled strict scaffold template assets
        - AND: '`.strict-spec-driven/` does not yet exist'
        - WHEN: '`strict-spec-driven init` is executed'
        - THEN: '`.strict-spec-driven/` is created'
        - AND: >-
            strict config, specs index, roadmap index, and changes state artifacts are created from
            bundled templates
        - AND: >-
            the scaffolded strict config documents the complete project-level regression command
            required as review evidence before archive recommendation or execution
  init-scaffold-output-is-yaml-only:
    strength: MUST
    statement: >-
      The system MUST scaffold only YAML files under `.strict-spec-driven/` during init so that the
      initialized workflow state directory contains no Markdown files.
    scenarios:
      init-creates-no-markdown-in-workflow-dir:
        - GIVEN: the init command runs for the first time in a repository
        - WHEN: the created files under `.strict-spec-driven/` are listed
        - THEN: every created file is a YAML file
        - AND: no Markdown files are created under `.strict-spec-driven/`
  cli-init-is-idempotent-and-non-clobbering:
    strength: MUST
    statement: >-
      The system MUST make `init` idempotent and MUST NOT overwrite existing strict workflow
      artifacts.
    scenarios:
      existing-strict-artifacts-are-preserved-on-rerun:
        - GIVEN: '`.strict-spec-driven/` already exists with user-authored artifact content'
        - WHEN: '`strict-spec-driven init` is executed again'
        - THEN: existing strict workflow artifacts are left unchanged
        - AND: only missing required scaffold artifacts are created
  cli-init-handles-bootstrap-coexistence:
    strength: MUST
    statement: >-
      The system MUST allow strict scaffold initialization to proceed when a legacy `.spec-driven/`
      directory is present and MUST emit a warning about coexistence.
    scenarios:
      init-warns-and-continues-when-bootstrap-directory-exists:
        - GIVEN: a repository contains `.spec-driven/`
        - WHEN: '`strict-spec-driven init` is executed'
        - THEN: >-
            the command emits one warning indicating `.spec-driven/` is bootstrap or legacy workflow
            state
        - AND: >-
            strict scaffold initialization continues without failing solely due to that directory's
            presence
  cli-propose-creates-strict-change-scaffold:
    strength: MUST
    statement: >-
      The system MUST provide a `propose` subcommand that creates strict change planning artifacts
      under `.strict-spec-driven/changes/<name>/`.
    scenarios:
      propose-scaffolds-strict-yaml-artifacts:
        - GIVEN: a valid kebab-case change name that does not already exist
        - WHEN: '`strict-spec-driven propose <name>` is executed'
        - THEN: the change directory is created under `.strict-spec-driven/changes/`
        - AND: >-
            `proposal.yaml`, `design.yaml`, `tasks.yaml`, and `questions.yaml` are created from
            strict templates
        - AND: a `specs/` directory is created for delta specs
  cli-propose-validates-change-name-and-collision:
    strength: MUST
    statement: >-
      The system MUST reject invalid strict change names and existing strict change collisions
      before writing scaffold files.
    scenarios:
      propose-rejects-invalid-name:
        - GIVEN: a requested change name that is not kebab-case
        - WHEN: '`strict-spec-driven propose <name>` is executed'
        - THEN: the command exits non-zero
        - AND: no strict change directory is created
      propose-rejects-duplicate-change:
        - GIVEN: '`.strict-spec-driven/changes/<name>/` already exists'
        - WHEN: '`strict-spec-driven propose <name>` is executed'
        - THEN: the command exits non-zero
        - AND: existing change artifacts are left unchanged
  cli-propose-reports-created-artifacts:
    strength: MUST
    statement: >-
      The system MUST emit deterministic output listing the strict change artifacts created by
      `propose`.
    scenarios:
      propose-output-includes-artifact-paths:
        - GIVEN: '`strict-spec-driven propose <name>` completes successfully'
        - WHEN: command output is reviewed
        - THEN: output identifies the created strict change directory
        - AND: output lists the created planning artifact paths for follow-up editing
  cli-build-bundles-templates:
    strength: MUST
    statement: >-
      The system MUST copy the `templates/` directory into `dist/templates/` as part of the build
      step so compiled scripts can resolve scaffold and schema assets without depending on the
      source tree.
    scenarios:
      templates-appear-in-dist-after-build:
        - GIVEN: the TypeScript sources compile successfully
        - WHEN: '`bun run build` completes'
        - THEN: >-
            `dist/templates/strict-spec-driven/scaffold/` contains all required scaffold template
            assets
        - AND: '`dist/templates/strict-spec-driven/schemas/` contains all schema and registry assets'
  cli-template-resolution-from-dist:
    strength: MUST
    statement: >-
      The system MUST resolve bundled template directories relative to `import.meta.url` so that
      compiled scripts in `dist/` find templates under `dist/templates/` without depending on the
      source tree.
    scenarios:
      compiled-scripts-find-scaffold-templates:
        - GIVEN: '`dist/` contains compiled JS and `dist/templates/` contains copied template assets'
        - WHEN: a compiled script resolves a scaffold template path
        - THEN: the template is found under `dist/templates/strict-spec-driven/scaffold/`
      compiled-scripts-find-schema-assets:
        - GIVEN: '`dist/` contains compiled JS and `dist/templates/` contains copied template assets'
        - WHEN: a compiled script resolves a schema path
        - THEN: the schema is found under `dist/templates/strict-spec-driven/schemas/`
  cli-template-resolution-fallback:
    strength: MUST
    statement: >-
      The system MUST fall back to `../templates/` relative to the module file when
      `dist/templates/` does not exist, so template resolution works during development before the
      copy step runs.
    scenarios:
      source-tree-fallback-when-dist-templates-missing:
        - GIVEN: '`dist/templates/` does not exist'
        - WHEN: a script resolves a bundled template path
        - THEN: >-
            the template is found under `../templates/strict-spec-driven/` relative to the module
            file
  cli-init-works-from-dist-only:
    strength: MUST
    statement: >-
      The system MUST allow `strict-spec-driven init` to create scaffold files correctly when run
      from the compiled `dist/` output without the source tree present.
    scenarios:
      init-succeeds-from-dist-only-environment:
        - GIVEN: only the `dist/` directory exists with compiled JS and bundled templates
        - WHEN: '`strict-spec-driven init` is executed'
        - THEN: it creates `.strict-spec-driven/` with all required scaffold artifacts
  cli-propose-works-from-dist-only:
    strength: MUST
    statement: >-
      The system MUST allow `strict-spec-driven propose` to create change scaffolds correctly when
      run from the compiled `dist/` output without the source tree present.
    scenarios:
      propose-succeeds-from-dist-only-environment:
        - GIVEN: only the `dist/` directory exists with compiled JS and bundled templates
        - WHEN: '`strict-spec-driven propose <name>` is executed'
        - THEN: it creates the change directory with all planning artifacts
  cli-apply-reads-tasks-yaml:
    strength: MUST
    statement: >-
      The system MUST provide an `apply` subcommand that reads `tasks.yaml` from a named active
      strict change directory under `.strict-spec-driven/changes/<name>/`.
    scenarios:
      apply-locates-tasks-for-an-existing-change:
        - GIVEN: '`.strict-spec-driven/changes/<name>/tasks.yaml` exists with at least one pending task'
        - WHEN: '`strict-spec-driven apply <name>` is executed'
        - THEN: the command reads and parses the tasks artifact from the change directory
      apply-rejects-missing-change:
        - GIVEN: '`.strict-spec-driven/changes/<name>/` does not exist'
        - WHEN: '`strict-spec-driven apply <name>` is executed'
        - THEN: the command exits non-zero
        - AND: an error message is written to stderr indicating the change was not found
  cli-apply-completes-next-pending-task:
    strength: MUST
    statement: >-
      The system MUST complete exactly one pending task per `apply` invocation by locating the first
      task with `status: pending` across all task sections, setting its status to `complete`, and
      writing the updated `tasks.yaml` back to disk.
    scenarios:
      apply-completes-first-pending-task:
        - GIVEN: a strict change has `tasks.yaml` with multiple pending tasks across sections
        - WHEN: '`strict-spec-driven apply <name>` is executed'
        - THEN: 'the first task with `status: pending` across sections is set to `complete`'
        - AND: the updated `tasks.yaml` is written back to the change directory
        - AND: no other task statuses are modified
      apply-preserves-tasks-yaml-structure:
        - GIVEN: a strict change has `tasks.yaml` with sections, task fields, and testing gates
        - WHEN: '`strict-spec-driven apply <name>` is executed'
        - THEN: >-
            the `tasks.yaml` sections, task identifiers, task text, commands, and testing gates
            remain unchanged
        - AND: only the target task `status` field is modified
  cli-apply-rejects-all-complete:
    strength: MUST
    statement: The system MUST exit non-zero when no pending tasks remain in the change.
    scenarios:
      apply-rejects-when-all-tasks-complete:
        - GIVEN: 'a strict change has `tasks.yaml` with all tasks having `status: complete`'
        - WHEN: '`strict-spec-driven apply <name>` is executed'
        - THEN: the command exits non-zero
        - AND: an error message is written to stderr indicating no pending tasks remain
  cli-apply-emits-task-status-json:
    strength: MUST
    statement: >-
      The system MUST emit a deterministic JSON object to stdout describing the completed task and
      remaining task summary.
    scenarios:
      apply-output-is-parseable-json:
        - GIVEN: '`strict-spec-driven apply <name>` completes a task successfully'
        - WHEN: command stdout is parsed as JSON
        - THEN: the JSON includes the completed task section name, task id, and task text
        - AND: the JSON includes the total task count and remaining pending count
      apply-status-output-is-deterministic:
        - GIVEN: the same change tasks state is applied twice in sequence
        - WHEN: each JSON output is compared
        - THEN: each output reflects only the task completed in that invocation
  cli-verify-reads-active-change-artifacts:
    strength: MUST
    statement: >-
      The system MUST provide a `verify` subcommand that reads all planning artifacts
      (proposal.yaml, design.yaml, tasks.yaml, questions.yaml) and any delta spec files under
      `specs/` from a named active strict change directory under
      `.strict-spec-driven/changes/<name>/`.
    scenarios:
      verify-locates-artifacts-for-an-existing-change:
        - GIVEN: '`.strict-spec-driven/changes/<name>/` exists with planning artifacts'
        - WHEN: '`strict-spec-driven verify <name>` is executed'
        - THEN: the command reads and parses each planning artifact from the change directory
      verify-rejects-missing-change:
        - GIVEN: '`.strict-spec-driven/changes/<name>/` does not exist'
        - WHEN: '`strict-spec-driven verify <name>` is executed'
        - THEN: the command exits non-zero
        - AND: an error message is written to stderr indicating the change was not found
  cli-verify-validates-artifacts-against-schemas:
    strength: MUST
    statement: >-
      The system MUST validate each change planning artifact against its registered strict YAML
      schema and include any schema violations in the verification diagnostics.
    scenarios:
      valid-artifacts-produce-no-schema-diagnostics:
        - GIVEN: a strict change has valid proposal.yaml, design.yaml, tasks.yaml, and questions.yaml
        - WHEN: '`strict-spec-driven verify <name>` is executed'
        - THEN: no schema validation diagnostics are emitted for those artifacts
      invalid-artifact-produces-schema-diagnostics:
        - GIVEN: a strict change has a tasks.yaml missing a required field
        - WHEN: '`strict-spec-driven verify <name>` is executed'
        - THEN: a schema validation diagnostic is emitted identifying the artifact path and field path
  cli-verify-checks-task-completion:
    strength: MUST
    statement: >-
      The system MUST report a verification diagnostic when any task in the change has a status
      other than `complete`.
    scenarios:
      all-tasks-complete-produce-no-task-diagnostics:
        - GIVEN: 'a strict change has tasks.yaml with all tasks having `status: complete`'
        - WHEN: '`strict-spec-driven verify <name>` is executed'
        - THEN: no task-completion diagnostics are emitted
      pending-task-produces-diagnostic:
        - GIVEN: 'a strict change has tasks.yaml with at least one task having `status: pending`'
        - WHEN: '`strict-spec-driven verify <name>` is executed'
        - THEN: a diagnostic is emitted identifying the incomplete task
  cli-verify-checks-open-questions:
    strength: MUST
    statement: >-
      The system MUST report a verification diagnostic when the questions artifact contains any open
      questions.
    scenarios:
      no-open-questions-produce-no-question-diagnostics:
        - GIVEN: a strict change has questions.yaml with an empty `open` list
        - WHEN: '`strict-spec-driven verify <name>` is executed'
        - THEN: no open-question diagnostics are emitted
      open-questions-produce-diagnostics:
        - GIVEN: a strict change has questions.yaml with at least one entry in the `open` list
        - WHEN: '`strict-spec-driven verify <name>` is executed'
        - THEN: a diagnostic is emitted for each open question
  cli-verify-validates-testing-gates:
    strength: MUST
    statement: >-
      The system MUST validate that `tasks.yaml` testing gates reference existing task IDs within
      the Testing section and report a diagnostic when a referenced task ID is missing or outside
      the Testing section.
    scenarios:
      valid-testing-gates-produce-no-diagnostics:
        - GIVEN: >-
            a strict change has tasks.yaml where `testing_gates.validation_task` and
            `testing_gates.unit_test_task` reference existing task IDs in the Testing section
        - WHEN: '`strict-spec-driven verify <name>` is executed'
        - THEN: no testing-gate diagnostics are emitted
      missing-testing-gate-target-produces-diagnostic:
        - GIVEN: >-
            a strict change has tasks.yaml where `testing_gates.validation_task` references a task
            ID that does not exist in the Testing section
        - WHEN: '`strict-spec-driven verify <name>` is executed'
        - THEN: a diagnostic is emitted identifying the invalid testing gate reference
  cli-verify-validates-delta-specs:
    strength: MUST
    statement: >-
      The system MUST validate each YAML file under the change `specs/` directory against the
      registered delta-spec schema and include any violations in the verification diagnostics.
    scenarios:
      valid-delta-specs-produce-no-diagnostics:
        - GIVEN: >-
            a strict change has delta spec files under `specs/` that conform to the delta-spec
            schema
        - WHEN: '`strict-spec-driven verify <name>` is executed'
        - THEN: no delta-spec diagnostics are emitted
      malformed-delta-spec-produces-diagnostics:
        - GIVEN: a strict change has a delta spec file under `specs/` that violates the delta-spec schema
        - WHEN: '`strict-spec-driven verify <name>` is executed'
        - THEN: a diagnostic is emitted identifying the delta spec path and violation
  cli-verify-enforces-exclusive-active-targets:
    strength: MUST
    statement: >-
      The system MUST report a verification diagnostic when two or more active changes have delta
      specs that target the same requirement ID with MODIFIED or REMOVED operations.
    scenarios:
      no-target-overlap-produces-no-conflict-diagnostics:
        - GIVEN: >-
            active changes have delta specs with disjoint MODIFIED and REMOVED target_requirement
            values
        - WHEN: '`strict-spec-driven verify <name>` is executed'
        - THEN: no exclusive-active-target diagnostics are emitted
      overlapping-targets-produce-conflict-diagnostics:
        - GIVEN: >-
            two active changes each have a delta spec with a MODIFIED entry targeting the same
            requirement ID
        - WHEN: '`strict-spec-driven verify <name>` is executed'
        - THEN: >-
            a diagnostic is emitted identifying the conflicting requirement ID and the competing
            change names
  cli-verify-emits-deterministic-json-output:
    strength: MUST
    statement: >-
      The system MUST emit a deterministic JSON object to stdout containing `valid`, `diagnostics`,
      `changeName`, `totalTasks`, `completeTasks`, `remainingPending`, and `openQuestionCount`.
    scenarios:
      verify-output-is-parseable-json:
        - GIVEN: '`strict-spec-driven verify <name>` completes'
        - WHEN: command stdout is parsed as JSON
        - THEN: the JSON includes `valid` as a boolean
        - AND: the JSON includes `diagnostics` as an array
        - AND: >-
            the JSON includes `changeName`, `totalTasks`, `completeTasks`, `remainingPending`, and
            `openQuestionCount`
      verify-exits-non-zero-when-invalid:
        - GIVEN: a strict change has verification diagnostics
        - WHEN: '`strict-spec-driven verify <name>` is executed'
        - THEN: the command exits with a non-zero exit code
      verify-exits-zero-when-valid:
        - GIVEN: a strict change has no verification diagnostics
        - WHEN: '`strict-spec-driven verify <name>` is executed'
        - THEN: the command exits with exit code zero
  cli-verify-works-from-dist-only:
    strength: MUST
    statement: >-
      The system MUST allow `strict-spec-driven verify` to validate change artifacts correctly when
      run from the compiled `dist/` output without the source tree present.
    scenarios:
      verify-succeeds-from-dist-only-environment:
        - GIVEN: only the `dist/` directory exists with compiled JS and bundled templates
        - WHEN: '`strict-spec-driven verify <name>` is executed against an active change'
        - THEN: it validates the change and emits correct diagnostics
  cli-roadmap-status-reports-strict-roadmap-state:
    strength: MUST
    statement: >-
      The system MUST provide a `roadmap-status` subcommand that validates
      `.strict-spec-driven/roadmap/` artifacts and reports milestone and planned change state using
      strict roadmap declared-status rules and derived completion semantics.
    scenarios:
      roadmap-status-reports-ordered-milestone-state:
        - GIVEN: a valid strict roadmap exists under `.strict-spec-driven/roadmap/`
        - WHEN: '`strict-spec-driven roadmap-status` is executed'
        - THEN: the output includes milestone entries in roadmap order
        - AND: each milestone reports its declared status and derived status
        - AND: each planned change reports its declared roadmap status and workflow-backed state
      roadmap-status-rejects-invalid-roadmap-artifacts:
        - GIVEN: a strict roadmap artifact violates the roadmap contract
        - WHEN: '`strict-spec-driven roadmap-status` is executed'
        - THEN: the command exits non-zero
        - AND: the diagnostics identify the invalid artifact and field context
  cli-roadmap-sync-reconciles-strict-roadmap-state:
    strength: MUST
    statement: >-
      The system MUST provide a `roadmap-sync` subcommand that regenerates or repairs strict roadmap
      index state and reconciles milestone and planned change completion against active and archived
      strict changes without inventing new roadmap items.
    scenarios:
      roadmap-sync-regenerates-canonical-roadmap-index-state:
        - GIVEN: strict roadmap milestone files exist under `.strict-spec-driven/roadmap/milestones/`
        - WHEN: '`strict-spec-driven roadmap-sync` is executed'
        - THEN: the roadmap index reflects the canonical milestone ordering and file paths
        - AND: milestone entries keep their declared status values within the strict roadmap enums
      roadmap-sync-reconciles-planned-change-completion-from-workflow-state:
        - GIVEN: a roadmap planned change has moved into archived strict change state
        - WHEN: '`strict-spec-driven roadmap-sync` is executed'
        - THEN: the planned change is reconciled as complete in roadmap state
        - AND: no duplicate planned change entry is created
        - AND: unrelated milestone notes and scope content remain unchanged
  cli-roadmap-validation-and-skill-smoke-coverage:
    strength: MUST
    statement: >-
      The system MUST include automated checks that exercise strict roadmap command behavior and
      strict roadmap skill content for both aligned and failing states, including regression
      coverage for milestones that use the optional `details` field across roadmap validation, sync,
      and proposal-handoff flows.
    scenarios:
      automated-checks-accept-details-bearing-roadmap-workflow-surfaces:
        - GIVEN: >-
            strict roadmap commands and `strict-roadmap-*` skill packages are aligned with
            `.strict-spec-driven/roadmap/`
        - AND: a milestone includes a valid `details` field
        - WHEN: repository automated checks are executed
        - THEN: the roadmap workflow checks pass
      automated-checks-accept-milestones-without-details:
        - GIVEN: >-
            strict roadmap commands and `strict-roadmap-*` skill packages are aligned with
            `.strict-spec-driven/roadmap/`
        - AND: a milestone omits the optional `details` field
        - WHEN: repository automated checks are executed
        - THEN: the roadmap workflow checks pass
        - AND: no placeholder or synthetic `details` value is required
      automated-checks-reject-placeholder-or-stale-roadmap-surfaces:
        - GIVEN: >-
            a strict roadmap skill keeps a generic placeholder command block or a roadmap command
            ignores strict roadmap status rules
        - WHEN: repository automated checks are executed
        - THEN: the roadmap workflow checks fail
        - AND: diagnostics identify the failing skill or roadmap surface deterministically
  cli-verify-spec-mappings-subcommand:
    strength: MUST
    statement: >-
      The system MUST provide a `verify-spec-mappings` subcommand for strict spec-mapping audits
      against .strict-spec-driven/specs/.
    scenarios:
      verify-spec-mappings-runs-from-repository-state:
        - GIVEN: '`.strict-spec-driven/specs/` contains one or more main spec YAML files'
        - WHEN: '`strict-spec-driven verify-spec-mappings` is executed'
        - THEN: the command runs mapping audits against available spec mapping fields
        - AND: command output is emitted as parseable JSON
      verify-spec-mappings-reports-missing-specs-directory:
        - GIVEN: '`.strict-spec-driven/specs/` does not exist'
        - WHEN: '`strict-spec-driven verify-spec-mappings` is executed'
        - THEN: the command exits non-zero
        - AND: a diagnostic explains that spec mapping inputs are unavailable
  cli-verify-spec-mappings-audits-mapping-coverage:
    strength: MUST
    statement: >-
      The system MUST audit mapping coverage across main spec mapping fields and report diagnostics
      when mapping coverage is incomplete.
    scenarios:
      mapped-implementation-and-tests-produce-no-coverage-diagnostics:
        - GIVEN: >-
            each main spec has a mapping field with non-empty implementation and test path
            collections
        - WHEN: '`strict-spec-driven verify-spec-mappings` is executed'
        - THEN: mapping-coverage diagnostics are not emitted
      missing-mapping-coverage-produces-diagnostics:
        - GIVEN: >-
            a main spec omits the mapping field or has an empty implementation or test mapping
            collection
        - WHEN: '`strict-spec-driven verify-spec-mappings` is executed'
        - THEN: a diagnostic is emitted identifying the spec path and missing coverage
  cli-verify-spec-mappings-audits-unmapped-evidence:
    strength: MUST
    statement: >-
      The system MUST audit unmapped repository evidence by reporting implementation or test files
      that are not referenced by any spec mapping entry.
    scenarios:
      fully-mapped-repository-evidence-produces-no-unmapped-diagnostics:
        - GIVEN: >-
            relevant implementation and test files are each referenced by at least one spec mapping
            entry
        - WHEN: '`strict-spec-driven verify-spec-mappings` is executed'
        - THEN: unmapped-evidence diagnostics are not emitted
      unmapped-evidence-produces-diagnostics:
        - GIVEN: >-
            at least one relevant implementation or test file is not referenced by any spec mapping
            entry
        - WHEN: '`strict-spec-driven verify-spec-mappings` is executed'
        - THEN: a diagnostic is emitted identifying each unmapped file path
  cli-verify-spec-mappings-emits-deterministic-json-output:
    strength: MUST
    statement: >-
      The system MUST emit deterministic JSON output for mapping audit results, including validity,
      diagnostics, and mapping summary counts.
    scenarios:
      output-is-parseable-json:
        - GIVEN: '`strict-spec-driven verify-spec-mappings` completes'
        - WHEN: command stdout is parsed as JSON
        - THEN: the JSON includes `valid` as a boolean
        - AND: the JSON includes `diagnostics` as an array
        - AND: the JSON includes summary counts for mapped and unmapped evidence
      exit-status-reflects-diagnostic-validity:
        - GIVEN: mapping diagnostics are present
        - WHEN: '`strict-spec-driven verify-spec-mappings` is executed'
        - THEN: the command exits non-zero
      successful-audit-exits-zero:
        - GIVEN: no mapping diagnostics are present
        - WHEN: '`strict-spec-driven verify-spec-mappings` is executed'
        - THEN: the command exits with exit code zero
  cli-archive-reads-active-change-artifacts:
    strength: MUST
    statement: >-
      The system MUST provide an `archive` subcommand that reads planning artifacts and delta specs
      from a named active strict change directory under `.strict-spec-driven/changes/<name>/`.
    scenarios:
      archive-locates-artifacts-for-an-existing-change:
        - GIVEN: >-
            `.strict-spec-driven/changes/<name>/` exists with proposal, design, tasks, questions,
            and delta spec files
        - WHEN: '`strict-spec-driven archive <name>` is executed'
        - THEN: the command reads the change artifacts needed for archive processing
      archive-rejects-missing-change:
        - GIVEN: '`.strict-spec-driven/changes/<name>/` does not exist'
        - WHEN: '`strict-spec-driven archive <name>` is executed'
        - THEN: the command exits non-zero
        - AND: an error message is written to stderr indicating the change was not found
  cli-archive-requires-verified-change-state:
    strength: MUST
    statement: >-
      The system MUST block archive when the named active change has incomplete tasks, open
      questions, or validation diagnostics.
    scenarios:
      archive-rejects-incomplete-or-unresolved-change-state:
        - GIVEN: a strict change has at least one pending task or at least one open question
        - WHEN: '`strict-spec-driven archive <name>` is executed'
        - THEN: the command exits non-zero
        - AND: the change remains in the active changes directory
      archive-rejects-schema-invalid-change-artifacts:
        - GIVEN: a strict change contains an artifact that fails strict schema validation
        - WHEN: '`strict-spec-driven archive <name>` is executed'
        - THEN: the command exits non-zero
        - AND: the archive move is not performed
  cli-archive-merges-delta-specs-into-main-specs:
    strength: MUST
    statement: >-
      The system MUST merge delta specs from the archived change into their corresponding main
      strict specs using stable requirement identifiers and explicit ADDED, MODIFIED, and REMOVED
      operations.
    scenarios:
      archive-applies-added-and-modified-operations:
        - GIVEN: >-
            a strict change includes delta specs with ADDED and MODIFIED entries targeting existing
            strict main specs
        - WHEN: '`strict-spec-driven archive <name>` is executed'
        - THEN: ADDED requirements are appended to the target specs
        - AND: MODIFIED requirements replace the targeted requirements by stable requirement identifier
      archive-applies-removed-operations:
        - GIVEN: >-
            a strict change includes delta specs with REMOVED entries targeting existing
            requirements
        - WHEN: '`strict-spec-driven archive <name>` is executed'
        - THEN: targeted requirements are removed from the target main specs
  cli-archive-applies-missing-target-merge-rules:
    strength: MUST
    statement: The system MUST apply deterministic missing-target merge rules during archive processing.
    scenarios:
      missing-modified-target-is-treated-as-added:
        - GIVEN: >-
            a delta MODIFIED entry targets a requirement ID missing from the target main spec at
            archive time
        - WHEN: '`strict-spec-driven archive <name>` is executed'
        - THEN: the replacement requirement is merged as an added requirement
        - AND: the fallback outcome is recorded in the archive merge report
      missing-removed-target-is-skipped:
        - GIVEN: >-
            a delta REMOVED entry targets a requirement ID missing from the target main spec at
            archive time
        - WHEN: '`strict-spec-driven archive <name>` is executed'
        - THEN: the removal is skipped
        - AND: the skipped removal is recorded in the archive merge report
  cli-archive-moves-change-to-date-prefixed-archive:
    strength: MUST
    statement: >-
      The system MUST move a successfully archived change from the active changes directory to
      `.strict-spec-driven/changes/archive/<YYYY-MM-DD>-<name>/` using local date naming.
    scenarios:
      successful-archive-move-uses-date-prefixed-destination:
        - GIVEN: '`strict-spec-driven archive <name>` completes merge successfully'
        - WHEN: archive move behavior is evaluated
        - THEN: the active change directory is removed from `.strict-spec-driven/changes/`
        - AND: the change is present at `.strict-spec-driven/changes/archive/<YYYY-MM-DD>-<name>/`
      archive-destination-collisions-use-deterministic-suffixes:
        - GIVEN: '`.strict-spec-driven/changes/archive/<YYYY-MM-DD>-<name>/` already exists'
        - WHEN: '`strict-spec-driven archive <name>` completes merge successfully'
        - THEN: the archived change uses the next available destination suffix
        - AND: the existing archive directory is preserved
  cli-archive-regenerates-spec-index-after-merge:
    strength: MUST
    statement: >-
      The system MUST regenerate strict specs index artifacts after archive merge writes updated
      main strict specs.
    scenarios:
      specs-index-reflects-merged-spec-state:
        - GIVEN: archive merges one or more delta specs into main strict specs
        - WHEN: '`strict-spec-driven archive <name>` completes'
        - THEN: the strict specs index is regenerated from the resulting spec state
        - AND: index entries remain aligned with the available main strict spec files
  cli-archive-emits-deterministic-json-output:
    strength: MUST
    statement: >-
      The system MUST emit deterministic JSON to stdout describing archive validity, merge outcomes,
      and archive destination details.
    scenarios:
      archive-output-is-parseable-json:
        - GIVEN: '`strict-spec-driven archive <name>` completes'
        - WHEN: command stdout is parsed as JSON
        - THEN: the output includes archive validity state
        - AND: >-
            the output includes merged, skipped, and conflict/fallback outcome summaries when
            present
        - AND: the output includes the archive destination path
  cli-list-reports-active-and-archived-strict-changes:
    strength: MUST
    statement: >-
      The system MUST provide a `list` subcommand that reports active and archived strict changes
      from `.strict-spec-driven/changes/`.
    scenarios:
      list-reports-active-changes:
        - GIVEN: one or more active strict change directories exist under `.strict-spec-driven/changes/`
        - WHEN: '`strict-spec-driven list` is executed'
        - THEN: the command output includes active change names
        - AND: each active change includes a status summary derived from strict planning artifacts
      list-reports-archived-changes:
        - GIVEN: >-
            one or more archived strict change directories exist under
            `.strict-spec-driven/changes/archive/`
        - WHEN: '`strict-spec-driven list` is executed'
        - THEN: the command output includes archived directory names
      list-handles-empty-state:
        - GIVEN: no active and no archived strict changes exist
        - WHEN: '`strict-spec-driven list` is executed'
        - THEN: the command reports that no changes are present
  cli-modify-reports-strict-artifact-paths:
    strength: MUST
    statement: >-
      The system MUST provide a `modify` subcommand that reports editable strict artifact paths for
      the selected change.
    scenarios:
      modify-with-no-argument-lists-active-changes:
        - GIVEN: one or more active strict changes exist
        - WHEN: '`strict-spec-driven modify` is executed without a change target'
        - THEN: the command lists active changes with status summaries
      modify-reports-active-change-artifacts:
        - GIVEN: '`.strict-spec-driven/changes/<name>/` exists'
        - WHEN: '`strict-spec-driven modify <name>` is executed'
        - THEN: >-
            the command output lists `proposal.yaml`, `design.yaml`, `tasks.yaml`, `questions.yaml`,
            and the `specs/` delta spec paths for that change
      modify-reports-archived-change-artifacts-by-exact-directory-name:
        - GIVEN: '`.strict-spec-driven/changes/archive/<archive-dir>/` exists'
        - WHEN: >-
            `strict-spec-driven modify <archive-dir>` is executed with the exact archive directory
            name
        - THEN: >-
            the command output lists the strict planning artifact and delta spec paths for the
            archived change
      modify-rejects-archived-bare-name-ambiguity:
        - GIVEN: archived changes exist whose directories use `YYYY-MM-DD-<name>`
        - WHEN: '`strict-spec-driven modify <name>` is executed without the date prefix'
        - THEN: the command exits non-zero
        - AND: the error explains that archived targets require exact archive directory names
  cli-cancel-removes-active-strict-changes-only:
    strength: MUST
    statement: >-
      The system MUST provide a `cancel` subcommand that removes active strict changes and rejects
      archived change targets.
    scenarios:
      cancel-removes-an-active-change:
        - GIVEN: '`.strict-spec-driven/changes/<name>/` exists'
        - WHEN: '`strict-spec-driven cancel <name>` is executed'
        - THEN: the active change directory is removed
        - AND: command output confirms cancellation
      cancel-rejects-archived-target:
        - GIVEN: '`.strict-spec-driven/changes/archive/<archive-dir>/` exists'
        - WHEN: '`strict-spec-driven cancel <archive-dir>` is executed'
        - THEN: the command exits non-zero
        - AND: the archived directory remains unchanged
        - AND: the error explains that cancel is limited to active changes

        - GIVEN: >-
            the strict migration skill contains explicit strict command mappings and
            `.strict-spec-driven/` migration guidance
        - WHEN: repository automated checks are executed
        - THEN: the migration skill content checks pass
      automated-checks-reject-placeholder-migration-skill-content:
        - GIVEN: >-
            the strict migration skill keeps a generic placeholder command block or omits required

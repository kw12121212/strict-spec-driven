schema: strict-spec-driven/main-spec/v1
schema_version: 1
artifact_type: main_spec
schema_file: templates/strict-spec-driven/schemas/main-spec.yaml
spec:
  id: roadmap-domain-behavior
  title: Roadmap Domain Behavior
mapping:
  implementation:
    - src/cli/cmd-roadmap.ts
    - src/converters/roadmap.ts
    - src/roadmap.ts
    - src/roadmap/author.ts
    - src/roadmap/model.ts
    - src/roadmap/shared.ts
    - src/roadmap/validate.ts
    - src/roadmap/load.ts
    - src/roadmap/status.ts
    - src/roadmap/sync.ts
    - src/roadmap/archive.ts
    - src/roadmap/reopen.ts
    - src/cli/registry.ts
    - src/strict-spec-cli.ts
    - src/skills/model.ts
    - skills/strict-roadmap-archive/SKILL.md
    - src/yaml.ts
    - skills/strict-roadmap-plan/SKILL.md
    - skills/strict-roadmap-review/SKILL.md
    - src/ticket-dispatch.ts
    - src/cli/cmd-generation.ts
  tests:
    - test/suites/roadmap-and-migration.ts
    - test/suites/entrypoint-and-skills.ts
requirements:
  roadmap-status-contract:
    strength: MUST
    statement: The system MUST make roadmap-status validate roadmap artifacts, report compact declared and derived milestone and planned-change state, expose standalone planned-change source paths, omit bulky descriptive and redundant milestone or planned-change fields from default status output, and surface mismatches or diagnostics deterministically.
    scenarios:
      status-reports-compact-valid-roadmap-state:
        - GIVEN: a structurally valid roadmap exists with milestone goals and planned-change summaries
        - WHEN: strict-spec-driven roadmap-status runs
        - THEN: the command exits zero and reports valid=true, milestone order, declared status, derived status, planned changes, source paths, and state without emitting milestone goal, milestone file, or planned-change summary text
      status-reports-invalid-artifacts:
        - GIVEN: roadmap artifacts are malformed or contain cross-file conflicts
        - WHEN: strict-spec-driven roadmap-status runs
        - THEN: the command exits non-zero with deterministic diagnostics including artifact path and field path context
  roadmap-overview-contract:
    strength: MUST
    statement: The system MUST make roadmap-overview render a deterministic compact human-readable milestone and planned-change summary for valid roadmap state without emitting bulky milestone goal or planned-change summary text, and emit actionable diagnostics for invalid roadmap artifacts.
    scenarios:
      overview-renders-compact-valid-roadmap:
        - GIVEN: a valid roadmap has milestones and planned changes with goals and summaries
        - WHEN: strict-spec-driven roadmap-overview runs
        - THEN: the command exits zero and prints milestone table content plus compact planned-change detail in deterministic order without milestone goal or planned-change summary text
      overview-rejects-invalid-roadmap:
        - GIVEN: roadmap artifacts are invalid
        - WHEN: strict-spec-driven roadmap-overview runs
        - THEN: the command exits non-zero and prints actionable diagnostics
  roadmap-sync-contract:
    strength: MUST
    statement: The system MUST make roadmap-sync reconcile declared roadmap statuses with active and archived strict workflow state, regenerate canonical roadmap index entries, preserve details fields, update standalone planned-change files when reconciliation is valid, and report compact sync result status without bulky milestone goal or planned-change summary text.
    scenarios:
      sync-reconciles-valid-roadmap:
        - GIVEN: roadmap artifacts are structurally valid and have reconcilable mismatch state with milestone goals and planned-change summaries
        - WHEN: strict-spec-driven roadmap-sync runs
        - THEN: the command exits zero, reports updated files, rewrites derived statuses, omits milestone goal, milestone file, and planned-change summary text from output status, and leaves roadmap-status valid afterward
      sync-preserves-details:
        - GIVEN: a milestone or standalone planned change contains details
        - WHEN: roadmap-sync rewrites the artifact
        - THEN: the details field is preserved in the roadmap file
  roadmap-split-file-contract:
    strength: MUST
    statement: The system MUST handle standalone planned-change files as the source of planned-change identity and report legacy inline planned changes, cross-file conflicts, dependency errors, duplicate identities, active-change conflicts, and dependency cycles with deterministic diagnostics.
    scenarios:
      inline-planned-changes-require-materialization:
        - GIVEN: a milestone still contains legacy inline planned_changes
        - WHEN: roadmap-status or roadmap-sync runs without explicit materialization
        - THEN: the command exits non-zero or blocks rewrites and reports the materialization command
      cross-file-conflicts-are-reported:
        - GIVEN: standalone planned-change files contain duplicate IDs, missing milestone references, invalid dependencies, or cycles
        - WHEN: roadmap-status runs
        - THEN: the command exits non-zero with deterministic cross-file diagnostics
  roadmap-recommend-contract:
    strength: MUST
    statement: The system MUST make roadmap-recommend optionally restrict recommendation to a specified milestone, select the first eligible standalone planned change within that milestone's roadmap order, return compact deterministic default output scoped to the selected milestone, preserve full scoped candidate detail behind --details, preserve existing global recommendation behavior when no milestone is specified, and report no-candidate or roadmap-error states without manual selection.
    scenarios:
      recommend-selects-first-eligible-within-milestone:
        - GIVEN: The roadmap contains multiple milestones with eligible and ineligible standalone planned changes.
        - WHEN: roadmap-recommend runs with a milestone selector for one milestone.
        - THEN: The command exits zero only when that milestone has an eligible candidate, returns the first eligible planned change within the selected milestone, scopes candidate counts and blockers to that milestone, and does not select eligible work from other milestones.
  roadmap-milestone-source-ticket-provenance:
    strength: MUST
    statement: The system MUST preserve a milestone source-ticket back-reference through roadmap loading, status derivation, and sync without dropping it, surface the originating ticket id in roadmap-status for ticket-promoted milestones, and flag a freshly promoted milestone whose scope and done criteria are still the promotion refinement stub as needing scope refinement.
    scenarios:
      roadmap-surfaces-and-preserves-source-ticket:
        - GIVEN: a milestone was promoted from a ticket and carries a source-ticket back-reference and refinement-stub scope
        - WHEN: roadmap-status and roadmap-sync run
        - THEN: roadmap-status reports the originating ticket id and flags the milestone as needing scope refinement, and roadmap-sync rewrites the milestone without dropping the source-ticket back-reference
  roadmap-reopen-contract:
    strength: MUST
    statement: The system MUST make roadmap-reopen append a dated reopen note to a completed milestone, leave already-archived planned changes immutable, seed a pending follow-up standalone planned change linked to the milestone under the canonical milestone-prefixed filename convention, and rewrite the milestone to the status derived from its planned-change state (proposed when only not-yet-started follow-up work exists), which a subsequent roadmap-sync preserves because the seeded follow-up is pending non-archived work; roadmap-sync MUST re-derive a milestone whose planned changes are all archived back to complete rather than preserving a declared active status.
    scenarios:
      reopen-seeds-pending-followup:
        - GIVEN: a completed milestone whose only planned change is archived
        - WHEN: strict-spec-driven roadmap-reopen runs for that milestone
        - THEN: the command exits zero, the milestone file becomes proposed with a dated reopen note, the archived planned change is byte-identical, and a new pending follow-up standalone planned change linked to the milestone is created
      reopened-milestone-survives-sync:
        - GIVEN: a milestone reopened by roadmap-reopen with its seeded pending follow-up planned change present
        - WHEN: strict-spec-driven roadmap-sync runs before any further edits
        - THEN: the milestone stays proposed because it has pending non-archived planned work rather than reverting to complete
      sync-rederives-complete-from-fully-archived:
        - GIVEN: a milestone declared active whose planned changes are all archived and that has no pending planned work
        - WHEN: strict-spec-driven roadmap-sync or archive-triggered sync runs
        - THEN: the canonical milestone and index status are rewritten to complete
      reopen-seeds-canonically-named-follow-up:
        - GIVEN: a completed milestone whose only planned change is archived
        - WHEN: roadmap-reopen runs for that milestone
        - THEN: the seeded follow-up standalone planned-change file uses the canonical milestone-prefixed basename and roadmap-status is valid afterward
  roadmap-archive-contract:
    strength: MUST
    statement: The system MUST make roadmap-archive validate roadmap artifacts, default to inspecting all unarchived milestones when no milestone id is supplied, archive only milestones whose derived status is complete, move each archived milestone and its completed standalone planned-change YAML files into the roadmap archive area, leave incomplete roadmap work in active locations, rewrite the active roadmap index, and report archived and skipped items deterministically.
    scenarios:
      archive-defaults-to-all-complete-milestones:
        - GIVEN: a valid roadmap contains multiple unarchived milestones, some with all planned changes archived and some with pending or active planned changes
        - WHEN: strict-spec-driven roadmap-archive runs without a milestone id
        - THEN: the command exits zero, archives every complete milestone and its completed standalone planned-change files, leaves incomplete milestones and planned changes active, rewrites the roadmap index without archived milestones, and reports archived plus skipped items in deterministic order
      archive-explicit-complete-milestone:
        - GIVEN: a valid roadmap contains an explicit unarchived milestone whose derived status is complete
        - WHEN: strict-spec-driven roadmap-archive <milestone-id> runs
        - THEN: the command exits zero, archives that milestone and completed standalone planned-change files for that milestone only, and reports the archived milestone
      archive-skips-incomplete-work:
        - GIVEN: a valid roadmap contains a selected milestone with pending or active planned changes
        - WHEN: strict-spec-driven roadmap-archive runs
        - THEN: the command leaves the milestone and its planned changes in active roadmap locations and reports the milestone as skipped because it is not complete
      archive-rejects-invalid-roadmap:
        - GIVEN: roadmap artifacts are malformed or contain cross-file conflicts
        - WHEN: strict-spec-driven roadmap-archive runs
        - THEN: the command exits non-zero with deterministic diagnostics and does not move milestone or planned-change files
  roadmap-milestone-authoring-command-contract:
    strength: MUST
    statement: The system MUST make roadmap-generate milestone create and safely update strict roadmap milestone artifacts using structured YAML fields, require explicit structured milestone intake questions when creating a milestone, preserve source-ticket metadata unless explicitly addressed by milestone arguments, reject conflicting edits before writing, run roadmap synchronization after successful writes, and report updated files deterministically, while standalone planned-change authoring remains on the dedicated roadmap-generate planned-change command; the global --reset flag MUST NOT remove or replace existing intake_questions entries, replacing the intake-question list MUST require the dedicated --reset-intake-questions flag together with at least one supplied intake question, and without that flag supplied intake questions MUST merge additively with same-id content conflicts reported as blocking diagnostics.
    scenarios:
      global-reset-preserves-intake-questions:
        - GIVEN: a strict roadmap milestone exists with multiple intake_questions entries
        - WHEN: strict-spec-driven roadmap-generate milestone updates the milestone with --reset and one additional --intake-question argument but without --reset-intake-questions
        - THEN: the command merges the supplied intake question additively, every previously existing intake question remains in the milestone artifact, and same-id content conflicts exit non-zero with blocking diagnostics instead of being replaced
      explicit-flag-replaces-intake-questions:
        - GIVEN: a strict roadmap milestone exists with multiple intake_questions entries
        - WHEN: strict-spec-driven roadmap-generate milestone is invoked with --reset-intake-questions and one or more --intake-question arguments
        - THEN: the milestone artifact's intake_questions list is replaced with exactly the supplied entries, the roadmap index is synchronized, and the command exits zero reporting the updated files
      reset-intake-questions-requires-entries:
        - GIVEN: a strict roadmap milestone exists with intake_questions entries
        - WHEN: strict-spec-driven roadmap-generate milestone is invoked with --reset-intake-questions but no --intake-question argument
        - THEN: the command exits non-zero with a diagnostic requiring at least one intake question and leaves the milestone file unchanged
  roadmap-milestone-update-preserves-work-items:
    strength: MUST
    statement: The system MUST make roadmap-generate milestone update milestone planning fields without creating, modifying, deleting, or moving standalone planned-change artifacts, MUST preserve source_ticket metadata unless an explicitly supported milestone-field operation addresses it, and MUST reject legacy inline planned_changes without partially rewriting the milestone because inline planned-change migration remains on the existing materialization workflow.
    scenarios:
      milestone-command-updates-without-planned-change-authoring:
        - GIVEN: a strict roadmap milestone exists and standalone planned-change files reference the same milestone
        - WHEN: strict-spec-driven roadmap-generate milestone updates the milestone goal, scope, done criteria, dependencies, risks, notes, or details
        - THEN: the milestone planning fields are updated, source_ticket metadata is preserved, standalone planned-change files are not rewritten by the milestone authoring command, and roadmap-sync remains valid afterward
      milestone-command-rejects-inline-legacy-work-items:
        - GIVEN: a strict roadmap milestone still contains legacy inline planned_changes
        - WHEN: strict-spec-driven roadmap-generate milestone tries to update that milestone
        - THEN: the command exits non-zero, reports the existing roadmap-sync materialization workflow, leaves the milestone file unchanged, and does not generate planned-change artifacts
      milestone-command-rejects-standalone-planned-change-rewrite:
        - GIVEN: a strict roadmap milestone references a standalone planned-change file that would be rewritten by roadmap synchronization
        - WHEN: strict-spec-driven roadmap-generate milestone tries to update the milestone
        - THEN: the command exits non-zero, reports that the standalone planned-change must be reconciled through the existing roadmap workflow, and leaves the milestone and planned-change files unchanged
  roadmap-sync-archive-boundary:
    strength: MUST
    statement: The system MUST make roadmap-sync preserve the active roadmap boundary after roadmap-archive has moved completed milestones and completed standalone planned-change files into roadmap/archive, excluding archived roadmap milestone and planned-change artifacts from active index regeneration, active status output, and active planned-change reconciliation.
    scenarios:
      sync-after-archive-keeps-archived-milestones-out-of-active-roadmap:
        - GIVEN: roadmap-archive has archived a complete milestone and its completed standalone planned-change files while leaving other incomplete milestones active
        - WHEN: strict-spec-driven roadmap-sync runs in the same workspace after the archive
        - THEN: the command exits zero, keeps the archived milestone and archived planned-change files under roadmap/archive, leaves the active roadmap index without the archived milestone, and roadmap-status continues to report only active unarchived milestones
  roadmap-planned-change-authoring-command-contract:
    strength: MUST
    statement: The system MUST provide a roadmap-generate planned-change command that creates and safely updates standalone planned-change artifacts using structured YAML fields, requires an existing declared milestone, computes the canonical milestone-prefixed filename itself so callers never choose filenames, rejects conflicting edits before writing, runs roadmap synchronization after successful writes, and reports updated files deterministically.
    scenarios:
      authoring-command-creates-canonical-file:
        - GIVEN: a valid roadmap milestone exists and no planned change with the requested id exists
        - WHEN: roadmap-generate planned-change runs with milestone, id, summary, details, and status arguments
        - THEN: the command writes a valid standalone planned-change artifact at the canonical milestone-prefixed path, synchronizes the roadmap, exits zero, and reports the updated files
      authoring-command-rejects-unknown-milestone:
        - GIVEN: no roadmap milestone with the requested milestone id exists
        - WHEN: roadmap-generate planned-change runs referencing that milestone
        - THEN: the command exits non-zero with a deterministic diagnostic and writes no planned-change file
  roadmap-planned-change-canonical-filename-contract:
    strength: MUST
    statement: The system MUST treat an active standalone planned-change file whose basename does not match the canonical filename for its declared milestone (milestone id prefix plus planned-change id, collapsing the duplicate prefix when the id already starts with the milestone id) as a blocking validation diagnostic while leaving archived planned-change files exempt, and MUST make roadmap-sync rename misnamed active planned-change files to their canonical names deterministically only when the explicit fix-names flag is supplied.
    scenarios:
      misnamed-active-file-blocks-validation:
        - GIVEN: an active standalone planned-change file exists whose basename lacks its declared milestone id prefix
        - WHEN: roadmap-status runs
        - THEN: the command reports invalid roadmap state with a deterministic diagnostic naming the expected canonical filename
      fix-names-repairs-misnamed-files:
        - GIVEN: an active standalone planned-change file exists under a non-canonical basename
        - WHEN: roadmap-sync runs with the fix-names flag
        - THEN: the file is renamed to its canonical basename, the rename is reported deterministically, and roadmap-status is valid afterward
      default-sync-does-not-rename:
        - GIVEN: an active standalone planned-change file exists under a non-canonical basename
        - WHEN: roadmap-sync runs without the fix-names flag
        - THEN: the file is not renamed and the misnaming is surfaced as a diagnostic

schema: strict-spec-driven/main-spec/v1
schema_version: 1
artifact_type: main_spec
schema_file: templates/strict-spec-driven/schemas/main-spec.yaml
spec:
  id: roadmap-domain-behavior
  title: Roadmap Domain Behavior
requirements:
  roadmap-status-contract:
    strength: MUST
    statement: The system MUST make roadmap-status validate roadmap artifacts, report compact declared and derived milestone and planned-change state, expose standalone planned-change source paths together with each planned change's summary and dependency ids, omit bulky or redundant milestone fields plus planned-change details and team metadata from default status output, and surface mismatches or diagnostics deterministically.
    scenarios:
      status-reports-compact-valid-roadmap-state:
        - GIVEN: A structurally valid roadmap exists with milestone goals and planned changes containing summaries, details, dependencies, and optional team metadata.
        - WHEN: strict-spec-driven roadmap-status runs.
        - THEN: The command exits zero and reports valid=true, milestone order, declared status, derived status, planned changes, source paths, state, each planned change's exact summary, and its dependency ids as dependsOn, without emitting milestone goal, milestone file, planned-change details, or team metadata.
      status-reports-invalid-artifacts:
        - GIVEN: Roadmap artifacts are malformed or contain cross-file conflicts.
        - WHEN: strict-spec-driven roadmap-status runs.
        - THEN: The command exits non-zero with deterministic diagnostics including artifact path and field path context.
  roadmap-overview-contract:
    strength: MUST
    statement: The system MUST make roadmap-overview render a deterministic compact human-readable milestone and planned-change summary for valid roadmap state without emitting bulky milestone goal or planned-change summary text, and emit actionable diagnostics for invalid roadmap artifacts.
    scenarios:
      overview-renders-compact-valid-roadmap:
        - GIVEN: a valid roadmap has milestones and planned changes with goals and summaries
        - WHEN: strict-spec-driven roadmap-overview runs
        - THEN: the command exits zero and prints milestone table content plus compact planned-change detail in deterministic order without milestone goal or planned-change summary text
      overview-rejects-invalid-roadmap:
        - GIVEN: roadmap artifacts are invalid
        - WHEN: strict-spec-driven roadmap-overview runs
        - THEN: the command exits non-zero and prints actionable diagnostics
  roadmap-sync-contract:
    strength: MUST
    statement: The system MUST make roadmap-sync reconcile declared roadmap statuses with active and archived strict workflow state, regenerate canonical roadmap index entries, preserve details fields, update standalone planned-change files when reconciliation is valid, and report compact sync result status without bulky milestone goal or planned-change summary text.
    scenarios:
      sync-reconciles-valid-roadmap:
        - GIVEN: roadmap artifacts are structurally valid and have reconcilable mismatch state with milestone goals and planned-change summaries
        - WHEN: strict-spec-driven roadmap-sync runs
        - THEN: the command exits zero, reports updated files, rewrites derived statuses, omits milestone goal, milestone file, and planned-change summary text from output status, and leaves roadmap-status valid afterward
      sync-preserves-details:
        - GIVEN: a milestone or standalone planned change contains details
        - WHEN: roadmap-sync rewrites the artifact
        - THEN: the details field is preserved in the roadmap file
  roadmap-split-file-contract:
    strength: MUST
    statement: The system MUST handle standalone planned-change files as the source of planned-change identity and report legacy inline planned changes, cross-file conflicts, dependency errors, duplicate identities, active-change conflicts, and dependency cycles with deterministic diagnostics.
    scenarios:
      inline-planned-changes-require-materialization:
        - GIVEN: a milestone still contains legacy inline planned_changes
        - WHEN: roadmap-status or roadmap-sync runs without explicit materialization
        - THEN: the command exits non-zero or blocks rewrites and reports the materialization command
      cross-file-conflicts-are-reported:
        - GIVEN: standalone planned-change files contain duplicate IDs, missing milestone references, invalid dependencies, or cycles
        - WHEN: roadmap-status runs
        - THEN: the command exits non-zero with deterministic cross-file diagnostics
  roadmap-recommend-contract:
    strength: MUST
    statement: The system MUST make roadmap-recommend optionally restrict recommendation to a specified milestone, select the first eligible standalone planned change within that milestone's roadmap order, return compact deterministic default output scoped to the selected milestone, preserve full scoped candidate detail behind --details, preserve existing global recommendation behavior when no milestone is specified, and report no-candidate or roadmap-error states without manual selection.
    scenarios:
      recommend-selects-first-eligible-within-milestone:
        - GIVEN: The roadmap contains multiple milestones with eligible and ineligible standalone planned changes.
        - WHEN: roadmap-recommend runs with a milestone selector for one milestone.
        - THEN: The command exits zero only when that milestone has an eligible candidate, returns the first eligible planned change within the selected milestone, scopes candidate counts and blockers to that milestone, and does not select eligible work from other milestones.
  roadmap-reopen-contract:
    strength: MUST
    statement: The system MUST make roadmap-reopen append a dated reopen note to a completed milestone, leave already-archived planned changes immutable, seed a pending follow-up standalone planned change linked to the milestone under the canonical milestone-prefixed filename convention, and rewrite the milestone to the status derived from its planned-change state (proposed when only not-yet-started follow-up work exists), which a subsequent roadmap-sync preserves because the seeded follow-up is pending non-archived work; roadmap-sync MUST re-derive a milestone whose planned changes are all archived back to complete rather than preserving a stale declared status.
    scenarios:
      reopen-seeds-pending-followup:
        - GIVEN: a completed milestone whose only planned change is archived
        - WHEN: strict-spec-cli roadmap-reopen runs for that milestone
        - THEN: the command exits zero, the milestone file becomes proposed with a dated reopen note, the archived planned change is byte-identical, and a new pending follow-up standalone planned change linked to the milestone is created
      reopened-milestone-survives-sync:
        - GIVEN: a milestone reopened by roadmap-reopen with its seeded pending follow-up planned change present
        - WHEN: strict-spec-cli roadmap-sync runs before any further edits
        - THEN: the milestone stays proposed because it has pending non-archived planned work rather than reverting to complete
      sync-rederives-complete-from-fully-archived:
        - GIVEN: a milestone declared proposed whose planned changes are all archived and that has no pending planned work
        - WHEN: strict-spec-cli roadmap-sync or archive-triggered sync runs
        - THEN: the canonical milestone and index status are rewritten to complete
      reopen-seeds-canonically-named-follow-up:
        - GIVEN: a completed milestone whose only planned change is archived
        - WHEN: roadmap-reopen runs for that milestone
        - THEN: the seeded follow-up standalone planned-change file uses the canonical milestone-prefixed basename and roadmap-status is valid afterward
  roadmap-archive-contract:
    strength: MUST
    statement: The system MUST make roadmap-archive validate roadmap artifacts, default to inspecting all unarchived milestones when no milestone id is supplied, archive only milestones whose derived status is complete, move each archived milestone and its completed standalone planned-change YAML files into the roadmap archive area, leave incomplete roadmap work in active locations, rewrite the active roadmap index, and report archived and skipped items deterministically.
    scenarios:
      archive-defaults-to-all-complete-milestones:
        - GIVEN: a valid roadmap contains multiple unarchived milestones, some with all planned changes archived and some with pending or active planned changes
        - WHEN: strict-spec-driven roadmap-archive runs without a milestone id
        - THEN: the command exits zero, archives every complete milestone and its completed standalone planned-change files, leaves incomplete milestones and planned changes active, rewrites the roadmap index without archived milestones, and reports archived plus skipped items in deterministic order
      archive-explicit-complete-milestone:
        - GIVEN: a valid roadmap contains an explicit unarchived milestone whose derived status is complete
        - WHEN: strict-spec-driven roadmap-archive <milestone-id> runs
        - THEN: the command exits zero, archives that milestone and completed standalone planned-change files for that milestone only, and reports the archived milestone
      archive-skips-incomplete-work:
        - GIVEN: a valid roadmap contains a selected milestone with pending or active planned changes
        - WHEN: strict-spec-driven roadmap-archive runs
        - THEN: the command leaves the milestone and its planned changes in active roadmap locations and reports the milestone as skipped because it is not complete
      archive-rejects-invalid-roadmap:
        - GIVEN: roadmap artifacts are malformed or contain cross-file conflicts
        - WHEN: strict-spec-driven roadmap-archive runs
        - THEN: the command exits non-zero with deterministic diagnostics and does not move milestone or planned-change files
  roadmap-milestone-authoring-command-contract:
    strength: MUST
    statement: The system MUST make roadmap-generate milestone create and safely update strict roadmap milestone artifacts using structured YAML fields, require explicit structured milestone intake questions when creating a milestone, run roadmap synchronization after successful writes, and report updated files deterministically, while standalone planned-change authoring remains on the dedicated roadmap-generate planned-change command. A supplied scalar field MUST overwrite the recorded value without any confirming flag; supplied list values and intake questions MUST merge additively, with a restated intake question id overwriting only that question; and the command MUST offer no flag that replaces or clears a list the invocation did not name, so editing one field can never discard unrelated recorded content, including an existing awaiting_refinement mapping.
    scenarios:
      editing-a-scalar-preserves-every-list:
        - GIVEN: A strict roadmap milestone records a goal together with multiple scope entries, done criteria, dependencies, risks, notes, and intake questions.
        - WHEN: roadmap-generate milestone supplies a new goal and one additional risk.
        - THEN: The goal is replaced, the new risk is appended, and every previously recorded scope entry, done criterion, dependency, risk, note, and intake question remains present unchanged.
      restating-an-intake-question-overwrites-only-that-question:
        - GIVEN: A strict roadmap milestone records multiple intake_questions entries.
        - WHEN: roadmap-generate milestone restates one intake question id with new content.
        - THEN: That question's content is replaced, every other intake question is preserved unchanged, and the roadmap index is synchronized.
      no-flag-replaces-an-unnamed-list:
        - GIVEN: A strict roadmap milestone records multiple risks.
        - WHEN: Any roadmap-generate milestone invocation runs without a removal flag naming a risk.
        - THEN: No recorded risk is removed, and the command offers no flag that would replace the risk list wholesale.
      editing-an-unrelated-field-preserves-awaiting-refinement:
        - GIVEN: A strict roadmap milestone has a complete awaiting_refinement mapping recorded by roadmap-defer.
        - WHEN: roadmap-generate milestone edits an unrelated scalar field.
        - THEN: The command preserves the complete awaiting_refinement mapping unchanged while applying the requested scalar edit.
  roadmap-milestone-update-preserves-work-items:
    strength: MUST
    statement: The system MUST make roadmap-generate milestone update milestone planning fields without creating, modifying, deleting, or moving standalone planned-change artifacts, and MUST reject legacy inline planned_changes without partially rewriting the milestone because inline planned-change migration remains on the existing materialization workflow.
    scenarios:
      milestone-command-updates-without-planned-change-authoring:
        - GIVEN: a strict roadmap milestone exists and standalone planned-change files reference it
        - WHEN: roadmap-generate milestone updates planning fields
        - THEN: the planning fields are updated, standalone planned-change files are not rewritten, and roadmap-sync remains valid
      milestone-command-rejects-inline-legacy-work-items:
        - GIVEN: a milestone still contains legacy inline planned_changes
        - WHEN: roadmap-generate milestone tries to update it
        - THEN: the command reports the materialization workflow and leaves files unchanged
      milestone-command-rejects-standalone-planned-change-rewrite:
        - GIVEN: a milestone references a standalone planned-change file that synchronization would rewrite
        - WHEN: roadmap-generate milestone tries to update it
        - THEN: the command reports that the planned change must be reconciled through the roadmap workflow and leaves files unchanged
  roadmap-sync-archive-boundary:
    strength: MUST
    statement: The system MUST make roadmap-sync preserve the active roadmap boundary after roadmap-archive has moved completed milestones and completed standalone planned-change files into roadmap/archive, excluding archived roadmap milestone and planned-change artifacts from active index regeneration, active status output, and active planned-change reconciliation.
    scenarios:
      sync-after-archive-keeps-archived-milestones-out-of-active-roadmap:
        - GIVEN: roadmap-archive has archived a complete milestone and its completed standalone planned-change files while leaving other incomplete milestones active
        - WHEN: strict-spec-driven roadmap-sync runs in the same workspace after the archive
        - THEN: the command exits zero, keeps the archived milestone and archived planned-change files under roadmap/archive, leaves the active roadmap index without the archived milestone, and roadmap-status continues to report only active unarchived milestones
  roadmap-planned-change-authoring-command-contract:
    strength: MUST
    statement: The system MUST provide a roadmap-generate planned-change command that creates and safely updates standalone planned-change artifacts using structured YAML fields, requires an existing declared milestone, computes the canonical milestone-prefixed filename itself so callers never choose filenames, rejects conflicting edits before writing, runs roadmap synchronization after successful writes, and reports updated files deterministically. The command MUST continue to refuse reassigning an existing planned change to a different milestone, and its refusal diagnostic MUST name roadmap-move-planned-change as the supported command for that operation.
    scenarios:
      authoring-command-creates-canonical-file:
        - GIVEN: a valid roadmap milestone exists and no planned change with the requested id exists
        - WHEN: roadmap-generate planned-change runs with milestone, id, summary, details, and status arguments
        - THEN: the command writes a valid standalone planned-change artifact at the canonical milestone-prefixed path, synchronizes the roadmap, exits zero, and reports the updated files
      authoring-command-rejects-unknown-milestone:
        - GIVEN: no roadmap milestone with the requested milestone id exists
        - WHEN: roadmap-generate planned-change runs referencing that milestone
        - THEN: the command exits non-zero with a deterministic diagnostic and writes no planned-change file
      authoring-command-refers-milestone-reassignment-to-move-command:
        - GIVEN: an existing standalone planned change declares one milestone
        - WHEN: roadmap-generate planned-change runs for that planned change id with a different milestone id
        - THEN: the command exits non-zero, writes no file, and its diagnostic names roadmap-move-planned-change as the supported command for milestone reassignment
  roadmap-planned-change-canonical-filename-contract:
    strength: MUST
    statement: The system MUST treat an active standalone planned-change file whose basename does not match the canonical filename for its declared milestone (milestone id prefix plus planned-change id, collapsing the duplicate prefix when the id already starts with the milestone id) as a blocking validation diagnostic while leaving archived planned-change files exempt, and MUST make roadmap-sync rename misnamed active planned-change files to their canonical names deterministically only when the explicit fix-names flag is supplied.
    scenarios:
      misnamed-active-file-blocks-validation:
        - GIVEN: an active standalone planned-change file exists whose basename lacks its declared milestone id prefix
        - WHEN: roadmap-status runs
        - THEN: the command reports invalid roadmap state with a deterministic diagnostic naming the expected canonical filename
      fix-names-repairs-misnamed-files:
        - GIVEN: an active standalone planned-change file exists under a non-canonical basename
        - WHEN: roadmap-sync runs with the fix-names flag
        - THEN: the file is renamed to its canonical basename, the rename is reported deterministically, and roadmap-status is valid afterward
      default-sync-does-not-rename:
        - GIVEN: an active standalone planned-change file exists under a non-canonical basename
        - WHEN: roadmap-sync runs without the fix-names flag
        - THEN: the file is not renamed and the misnaming is surfaced as a diagnostic
  roadmap-order-sort-key-contract:
    strength: MUST
    statement: The system MUST treat a milestone order as an optional integer sort key rather than deriving order from the milestone id prefix, derive the human-facing display ordinal by sorting active milestones on order (breaking ties by slug), assign a newly authored milestone a slug-only identity with no minted sequential prefix and an initial order appended after the current maximum active order, and accept both slug-only and legacy NNNN- prefixed milestone ids as valid identities.
    scenarios:
      new-milestone-gets-slug-id-and-appended-order:
        - GIVEN: an active roadmap exists with milestones carrying order values
        - WHEN: a new milestone is authored without an explicit order
        - THEN: the milestone receives a slug-only id with no minted sequential number and an order value appended after the current maximum active order, and roadmap-status reports it last in roadmap order
      missing-order-is-valid-and-derived:
        - GIVEN: a milestone artifact has no order field
        - WHEN: roadmap-status or roadmap-sync runs
        - THEN: the artifact validates without an order field and the milestone is placed deterministically in derived roadmap order without being rewritten solely to add order
  roadmap-reorder-contract:
    strength: MUST
    statement: The system MUST provide a roadmap-reorder command that repositions exactly one active milestone by editing only its order field to a value between the requested before/after neighbors or to an explicit order, run roadmap synchronization after the write, reject unknown, self-referential, or archived targets and neighbors, and never modify any other milestone or any archived artifact.
    scenarios:
      reorder-moves-single-milestone:
        - GIVEN: an active roadmap has milestones ordered by sparse order values
        - WHEN: roadmap-reorder runs with --before or --after naming another active milestone
        - THEN: only the target milestone's order field is rewritten to fall between its new neighbors, the index is re-synced into the new order, and no other milestone file changes
      reorder-rejects-archived-or-unknown-target:
        - GIVEN: a reorder targets an archived milestone, a non-existent milestone, or itself as neighbor
        - WHEN: roadmap-reorder runs
        - THEN: the command exits non-zero with a deterministic diagnostic and writes no file
  roadmap-renumber-contract:
    strength: MUST
    statement: The system MUST provide a roadmap-renumber command that respreads active milestone order values to canonical gap spacing in existing relative order deterministically, run roadmap synchronization after the write, and leave archived milestones and planned-change files untouched.
    scenarios:
      renumber-respreads-active-order:
        - GIVEN: active milestones have order values whose gaps are exhausted or irregular
        - WHEN: roadmap-renumber runs
        - THEN: active milestone order values are rewritten to canonical gap spacing preserving their existing relative order, archived artifacts are untouched, and roadmap-status remains valid
  roadmap-sync-order-collision-contract:
    strength: MUST
    statement: The system MUST make roadmap-sync regenerate the roadmap index sorted by active milestone order and resolve an exact order-value collision between two active milestones by deterministically nudging the milestone selected by slug lexicographic order while leaving every distinct order value unchanged and excluding archived milestones from ordering reconciliation.
    scenarios:
      sync-resolves-exact-order-collision:
        - GIVEN: two active milestones share an identical order value after a merge
        - WHEN: roadmap-sync runs
        - THEN: the milestone chosen by slug lexicographic order is nudged to a distinct order value, all milestones with distinct order values keep their order, and roadmap-status is valid afterward
      sync-sorts-index-by-order:
        - GIVEN: active milestones carry order values that differ from id-prefix order
        - WHEN: roadmap-sync runs
        - THEN: the regenerated index lists milestones in order-field order rather than id-prefix order
  roadmap-archived-dependency-resolution-contract:
    strength: MUST
    statement: The system MUST treat a planned-change depends_on entry whose target planned-change id has been moved into the roadmap archive by a prior roadmap-archive as a satisfied dependency target rather than a missing dependency, so roadmap-status, roadmap-sync, roadmap-archive, roadmap-reorder, and roadmap-reopen remain valid for active milestones whose planned changes depend on completed-and-archived planned changes, while archived planned-change artifacts continue to be excluded from active roadmap index regeneration, active status output, active duplicate-id detection, and active dependency-cycle detection.
    scenarios:
      archived-dependency-target-resolves-after-milestone-archive:
        - GIVEN: a valid roadmap has two milestones where an active milestone's standalone planned change depends_on a planned change owned by another milestone, and the owning milestone and its standalone planned changes are complete and have been moved into roadmap/archive by roadmap-archive
        - WHEN: strict-spec-driven roadmap-status and roadmap-sync run afterward against the active roadmap
        - THEN: both commands exit zero, report valid roadmap state, and do not emit a 'planned change dependency is missing from roadmap planned-change sources' diagnostic for the archived dependency target
  roadmap-pause-resume-contract:
    strength: MUST
    statement: The system MUST provide roadmap-pause and roadmap-resume commands that mark and clear a sticky paused state on a non-archived strict roadmap milestone. Pausing records an optional reason and a deterministic pause date in a structured top-level paused field on the milestone artifact, forces the milestone effective status to blocked so roadmap-sync canonical rewrite preserves it, appends a dated pause note, and makes roadmap-recommend skip every planned change the milestone owns with a milestone-paused skip reason. Resuming clears the paused field, optionally appends a dated resume note, and lets roadmap-sync re-derive the milestone status from planned-change state. Both commands reject unknown milestone ids with deterministic diagnostics, never modify archived milestones or any planned-change file, and leave the roadmap valid afterward.
    scenarios:
      pause-forces-blocked-status:
        - GIVEN: a valid active roadmap contains a non-archived milestone with an in-progress or pending standalone planned change and no paused field
        - WHEN: strict-spec-cli roadmap-pause runs for that milestone with an optional reason
        - THEN: the command exits zero, reports valid true, writes a paused mapping with status true and paused_on date onto the milestone artifact, sets the milestone status to blocked, appends a Paused-on note recording the reason, and leaves roadmap-status reporting declared and derived status blocked with no mismatch
      pause-survives-sync:
        - GIVEN: a milestone has been paused by roadmap-pause
        - WHEN: strict-spec-cli roadmap-sync runs before any further edit
        - THEN: the milestone stays blocked because the paused field survives canonical rewrite rather than reverting to the planned-change-derived status
      recommend-skips-paused-milestone:
        - GIVEN: a valid roadmap contains a paused milestone whose standalone planned change would otherwise be the next eligible recommendation
        - WHEN: strict-spec-cli roadmap-recommend runs
        - THEN: the command does not recommend the paused milestone planned change and reports a milestone-paused skip reason on that candidate
      resume-clears-pause:
        - GIVEN: a milestone has been paused by roadmap-pause
        - WHEN: strict-spec-cli roadmap-resume runs for that milestone with an optional reason
        - THEN: the command exits zero, deletes the paused field from the milestone artifact, optionally appends a Resumed-on note, and lets roadmap-sync re-derive the milestone status from its planned-change state
      pause-rejects-unknown-milestone:
        - GIVEN: a valid roadmap has no milestone with the requested id
        - WHEN: strict-spec-cli roadmap-pause or roadmap-resume runs for that id
        - THEN: the command exits non-zero with a deterministic diagnostic and writes no milestone file
  roadmap-move-planned-change-contract:
    strength: MUST
    statement: The system MUST provide a roadmap-move-planned-change command that reassigns exactly one active standalone planned change to a different active milestone by rewriting its declared milestone and renaming the artifact to the canonical target-milestone-prefixed filename in a single operation, running roadmap synchronization after the write and restoring the original file and path when synchronization is invalid. The command MUST reject an unknown or archived planned change, an unknown or archived target milestone, a destination filename that is already occupied, and a planned change whose derived state is archived unless an explicit allow-complete flag is supplied, each with deterministic diagnostics and no file writes. Moving a planned change into the milestone it already declares MUST be a valid no-op reporting no updated files. The command MUST never modify archived roadmap artifacts, any other planned change, any milestone artifact beyond synchronization-derived status, or any artifact under the changes directory, and MUST report the planned change id, source milestone, target milestone, source path, and target path deterministically.
    scenarios:
      move-reassigns-and-renames:
        - GIVEN: a valid roadmap contains two active milestones and an active standalone planned change owned by the first milestone
        - WHEN: strict-spec-cli roadmap-move-planned-change runs for that planned change with the second milestone as target
        - THEN: the command exits zero, the planned-change artifact declares the second milestone, the file is renamed to the canonical basename for the second milestone, both milestones re-derive status through roadmap synchronization, and roadmap-status is valid afterward
      move-rejects-archived-and-unknown-targets:
        - GIVEN: a move targets an archived milestone, a milestone that does not exist, an archived planned change, a planned change that does not exist, or a destination filename already occupied by another planned change
        - WHEN: strict-spec-cli roadmap-move-planned-change runs
        - THEN: the command exits non-zero with a deterministic diagnostic distinguishing archived from unknown targets and writes no file
      move-blocks-completed-work-without-flag:
        - GIVEN: an active standalone planned change whose derived state is archived because its strict change is archived
        - WHEN: strict-spec-cli roadmap-move-planned-change runs for that planned change without the allow-complete flag
        - THEN: the command exits non-zero with a deterministic diagnostic naming the allow-complete flag and writes no file, and the same command with the flag supplied completes the move and re-derives both milestone statuses
      move-into-declared-milestone-is-a-noop:
        - GIVEN: an active standalone planned change that already declares the requested target milestone
        - WHEN: strict-spec-cli roadmap-move-planned-change runs for that planned change and milestone
        - THEN: the command exits zero, reports valid true with no updated files, and leaves every roadmap artifact byte-identical
      move-that-cannot-complete-leaves-no-partial-state:
        - GIVEN: a move that cannot complete because a guard rejects it or because post-move roadmap synchronization reports invalid roadmap state
        - WHEN: strict-spec-cli roadmap-move-planned-change runs
        - THEN: no file exists at the canonical destination path, the planned-change artifact is byte-identical at its original path, and the command exits non-zero reporting no updated files
      move-warns-without-blocking:
        - GIVEN: a moved planned change that has an active strict change, or a depends_on edge touching the moved planned change that after the move points from an earlier-ordered milestone to a later-ordered milestone
        - WHEN: strict-spec-cli roadmap-move-planned-change runs
        - THEN: the command exits zero, completes the move, and reports non-blocking warnings naming the stale change proposal roadmap linkage and the order-inverting dependency without modifying any artifact under the changes directory
  roadmap-milestone-entries-are-individually-removable:
    strength: MUST
    statement: 'The system MUST let a single recorded roadmap entry be removed by naming it: roadmap-generate milestone MUST accept removal flags targeting one scope entry, done criterion, dependency, risk, note, or intake question, and roadmap-generate planned-change MUST accept a removal flag targeting one depends_on entry. Each removal MUST leave every sibling entry unchanged, MUST be reported, and MUST succeed as a reported no-op when the named entry is already absent.'
    scenarios:
      removing-one-risk-leaves-siblings:
        - GIVEN: a strict roadmap milestone records several risks
        - WHEN: roadmap-generate milestone supplies a removal flag naming exactly one risk
        - THEN: only that risk is removed, the remaining risks are preserved in order, the roadmap index is synchronized, and the command exits zero
      removing-an-absent-entry-is-a-no-op:
        - GIVEN: a strict roadmap milestone does not record a given note
        - WHEN: roadmap-generate milestone supplies a removal flag naming that note
        - THEN: the command exits zero, reports the removal as a no-op, and leaves the milestone unchanged
  roadmap-complete-cli-mutation-coverage:
    strength: MUST
    statement: The system MUST expose every lifecycle-permitted roadmap milestone, standalone planned-change, and roadmap-index creation, scalar update, additive collection update, exact named removal, reorder, move, pause, resume, reopen, canonical rename, reconciliation, and archive operation through structured roadmap CLI arguments; MUST commit each primary artifact together with affected indexes and references atomically; MUST preserve completed historical work through archive rather than physical deletion; and MUST reject invalid or lifecycle-forbidden mutations deterministically without partial writes.
    scenarios:
      roadmap-structured-mutations-preserve-references:
        - GIVEN: A valid active roadmap contains a milestone, standalone planned changes, dependencies, intake questions, and an index
        - WHEN: A roadmap domain command creates or updates one field, removes one named mutable entry, reorders or moves work, or changes pause state
        - THEN: Only the named semantic mutation and required canonical index or reference updates commit, the roadmap remains valid, and unrelated fields and files remain unchanged
      roadmap-lifecycle-removal-preserves-history:
        - GIVEN: Roadmap work is complete or historical and is eligible for lifecycle retirement
        - WHEN: The supported roadmap retirement operation runs
        - THEN: The milestone and completed planned changes move to the roadmap archive with stable identities and auditable content instead of being physically discarded
      roadmap-mutation-failure-is-atomic:
        - GIVEN: A requested roadmap mutation would violate a schema, dependency, canonical-name, archive, or cross-file relationship rule
        - WHEN: The roadmap domain command validates the candidate transaction
        - THEN: The command exits non-zero with path-aware deterministic diagnostics and every active, indexed, and archived roadmap file remains unchanged
  roadmap-delete-planned-change-contract:
    strength: MUST
    statement: The system MUST provide a roadmap-delete-planned-change command that removes exactly one active standalone planned-change artifact and runs roadmap synchronization after the write. The command MUST reject an unknown or archived planned change, and a planned change whose derived state is archived unless an explicit allow-complete flag is supplied, each with deterministic diagnostics and no file writes. When other planned changes declare the target in depends_on, the command MUST refuse by default with a diagnostic naming each dependent artifact and the detach-dependents flag, and when that flag is supplied it MUST remove the deleted id from every dependent depends_on in the same operation so the roadmap is never written through a dangling-reference state. The command MUST never modify archived roadmap artifacts or any artifact under the changes directory, MUST report an active strict change for the deleted planned change as a warning rather than a refusal, and MUST report the deleted planned change id, milestone, path, and detached dependents deterministically.
    scenarios:
      delete-removes-a-planned-change-nothing-depends-on:
        - GIVEN: a valid roadmap contains an active standalone planned change that no other planned change declares in depends_on
        - WHEN: strict-spec-cli roadmap-delete-planned-change runs for that planned change id
        - THEN: the command exits zero, removes the planned-change artifact, synchronizes the roadmap, and reports the deleted planned change id, milestone, and path
      delete-refuses-dependents-without-the-detach-flag:
        - GIVEN: a valid roadmap contains an active standalone planned change that another planned change declares in depends_on
        - WHEN: strict-spec-cli roadmap-delete-planned-change runs for that planned change id without the detach-dependents flag
        - THEN: the command exits non-zero, writes no file, and reports a diagnostic on each dependent artifact naming the detach-dependents flag
      delete-detaches-dependents-atomically:
        - GIVEN: a valid roadmap contains an active standalone planned change that another planned change declares in depends_on
        - WHEN: strict-spec-cli roadmap-delete-planned-change runs for that planned change id with the detach-dependents flag
        - THEN: the command exits zero, removes the planned-change artifact, removes the deleted id from every dependent depends_on without altering other dependent content, reports the detached dependents, and leaves roadmap-status valid
      delete-refuses-archived-and-completed-work:
        - GIVEN: a planned change is archived, or its derived state is archived because its strict change is archived
        - WHEN: strict-spec-cli roadmap-delete-planned-change runs for that planned change id without the allow-complete flag
        - THEN: the command exits non-zero with a deterministic diagnostic, leaves archived planned-change files byte-identical, and writes no file
  roadmap-mutation-repairable-diagnostic-tolerance:
    strength: MUST
    statement: The system MUST let roadmap mutation commands write while the roadmap already reports a dangling depends_on reference, or a milestone status field carrying the retired value 'active', because each is repairable through those same commands and neither can affect which milestones load or what the regenerated index records. The tolerated set MUST be captured before the mutation is staged, so a dangling reference the mutation itself introduces is still refused with no file writes. Tolerance of the retired status value MUST match only a milestone status field whose value is exactly that retired literal; every other schema-invalid milestone state, and every other diagnostic kind, MUST continue to refuse every write. A command that completed its write while a pre-existing repairable diagnostic remains MUST report its updated files and MUST report validity as false until the roadmap is repaired.
    scenarios:
      preexisting-dangling-reference-does-not-refuse-a-write:
        - GIVEN: a roadmap planned change declares a depends_on entry naming a planned change that no roadmap source declares
        - WHEN: strict-spec-cli roadmap-generate planned-change, roadmap-move-planned-change, or roadmap-delete-planned-change runs on any planned change
        - THEN: the command applies its mutation, reports the updated files, and reports validity as false while the dangling reference remains
      dangling-reference-remains-repairable-through-the-cli:
        - GIVEN: a roadmap planned change declares a depends_on entry naming a planned change that no roadmap source declares
        - WHEN: strict-spec-cli roadmap-generate planned-change runs for the dependent planned change with remove-depends-on naming that entry
        - THEN: the command exits zero, removes the entry, and roadmap-status reports the roadmap as valid with no diagnostics
      retired-milestone-status-is-tolerated-and-repaired:
        - GIVEN: a milestone artifact declares the retired status value 'active' and is otherwise schema-valid
        - WHEN: strict-spec-cli roadmap-sync runs with no additional flag
        - THEN: the command applies its write, rewrites the status to 'proposed', reports the updated file, and roadmap-status reports the roadmap as valid afterward
      other-schema-invalid-milestones-still-refuse:
        - GIVEN: a roadmap is valid, or is invalid for a reason other than a tolerated diagnostic such as a milestone that fails to parse, a milestone whose status is an unrecognized value that is not the retired literal, a milestone missing a required field, or a self-dependency
        - WHEN: strict-spec-cli roadmap-generate planned-change runs with a depends_on entry naming no declared planned change, or runs while that other diagnostic is present
        - THEN: the command exits non-zero, writes no file, and leaves every roadmap artifact byte-identical
  roadmap-planned-change-dependency-id-matching:
    strength: MUST
    statement: The system MUST match roadmap-generate planned-change depends_on removals against recorded entries by exact planned-change id rather than by substring, because planned-change ids routinely share prefixes and substring matching makes an edge to the shorter id unremovable. A removal naming an id that is not recorded MUST fail with a deterministic error and write no file.
    scenarios:
      removal-matches-a-prefix-sharing-id-exactly:
        - GIVEN: a planned change records depends_on entries whose ids share a prefix, such as one id that is a prefix of another
        - WHEN: strict-spec-cli roadmap-generate planned-change runs with remove-depends-on naming the shorter id
        - THEN: the command exits zero and removes only the exactly matching entry, leaving the prefix-sharing entry recorded
      removal-of-an-unrecorded-id-is-refused:
        - GIVEN: a planned change records depends_on entries
        - WHEN: strict-spec-cli roadmap-generate planned-change runs with remove-depends-on naming a partial id or an id that is not recorded
        - THEN: the command exits non-zero with a deterministic error and writes no file
  roadmap-milestone-awaiting-refinement-contract:
    strength: MUST
    statement: The system MUST provide roadmap-defer and roadmap-refine commands that set and clear a declared awaiting-refinement state on a non-archived strict roadmap milestone. Deferring records an optional reason naming the unmatured precondition and a deterministic date in a structured top-level awaiting_refinement field on the milestone artifact, which roadmap-sync canonical rewrite MUST preserve without forcing the milestone status to blocked, so the milestone keeps the status derived from its planned-change state. roadmap-status and roadmap-overview MUST report the awaiting-refinement state so a deliberately undecomposed milestone is distinguishable from an incompletely authored one. roadmap-recommend MUST surface a deferred milestone as a refine action and MUST skip every planned change that milestone owns as an implementation candidate with an awaiting-refinement skip reason. Refining MUST clear the field only when the command is run, never by deriving maturity from the presence of planned changes. Both commands MUST reject unknown, archived, and complete milestone ids with deterministic diagnostics, MUST never modify any planned-change file or any artifact under the changes directory, and MUST leave the roadmap valid afterward.
    scenarios:
      defer-records-state-without-blocking:
        - GIVEN: a valid active roadmap contains a non-archived milestone with no planned changes and no awaiting_refinement field
        - WHEN: strict-spec-cli roadmap-defer runs for that milestone with a reason
        - THEN: the command exits zero, reports valid true, writes an awaiting_refinement mapping with status true, the supplied reason, and a deferred_on date onto the milestone artifact, leaves the milestone status as the derived proposed rather than forcing blocked, and leaves roadmap-status reporting no mismatch
      defer-survives-sync:
        - GIVEN: a milestone has been deferred by roadmap-defer
        - WHEN: strict-spec-cli roadmap-sync runs before any further edit
        - THEN: the awaiting_refinement field survives canonical rewrite unchanged and the milestone status is still the status derived from its planned-change state
      status-distinguishes-deferred-from-unauthored:
        - GIVEN: a valid roadmap contains one deferred milestone and one milestone that is merely undetailed with no awaiting_refinement field
        - WHEN: strict-spec-cli roadmap-status and roadmap-overview run
        - THEN: both commands report the awaiting-refinement state on the deferred milestone only, so the deliberately coarse milestone is distinguishable from the incompletely authored one
      recommend-returns-refine-action-and-skips-owned-work:
        - GIVEN: a valid roadmap contains a deferred milestone that owns a planned change whose dependencies are complete and whose strict change state is pending
        - WHEN: strict-spec-cli roadmap-recommend runs
        - THEN: the deferred milestone is surfaced as a refine action, the planned change it owns is not returned as an implementation candidate, and that candidate carries an awaiting-refinement skip reason
      refine-clears-only-on-explicit-command:
        - GIVEN: a deferred milestone gains one or more planned changes through roadmap-generate planned-change
        - WHEN: strict-spec-cli roadmap-status or roadmap-sync runs before roadmap-refine is invoked
        - THEN: the awaiting_refinement field is still present and the milestone is still reported as awaiting refinement, and only a subsequent roadmap-refine invocation removes the field
      defer-and-refine-reject-ineligible-milestones:
        - GIVEN: a valid roadmap has no milestone with the requested id, or the requested milestone is archived, or its derived status is complete
        - WHEN: strict-spec-cli roadmap-defer or roadmap-refine runs for that id
        - THEN: the command exits non-zero with a deterministic diagnostic, writes no milestone file, and leaves every planned-change file and every artifact under the changes directory byte-identical
  roadmap-awaiting-refinement-recommendation-gate:
    strength: MUST
    statement: 'The system MUST make roadmap-recommend treat a milestone awaiting refinement as the recommendation in strict roadmap order: when the earliest-ordered incomplete milestone declares awaiting_refinement, the command MUST return that milestone as a refine action and MUST NOT fall through to implementable planned changes owned by later-ordered milestones. A milestone that is both deferred and paused MUST yield no refine action, so pausing releases downstream candidates. When roadmap-recommend is scoped to a deferred milestone with --milestone, the command MUST refuse by default with a deterministic diagnostic naming both roadmap-refine and the --allow-unrefined override, and MUST return that milestone''s candidates only when --allow-unrefined is supplied.'
    scenarios:
      refine-action-wins-over-later-implementable-work:
        - GIVEN: a valid roadmap contains an earlier-ordered milestone declaring awaiting_refinement and a later-ordered milestone owning a planned change whose dependencies are complete and whose strict change state is pending
        - WHEN: strict-spec-cli roadmap-recommend runs without a milestone selector
        - THEN: the command returns the earlier milestone as a refine action and does not return the later milestone's planned change as an implementation candidate
      pausing-a-deferred-milestone-releases-later-work:
        - GIVEN: the earliest-ordered incomplete milestone declares awaiting_refinement and has also been paused by roadmap-pause, while a later-ordered milestone owns an eligible planned change
        - WHEN: strict-spec-cli roadmap-recommend runs without a milestone selector
        - THEN: no refine action is returned for the paused milestone and the later milestone's eligible planned change becomes the recommendation
      milestone-scoped-recommend-refuses-without-the-override:
        - GIVEN: a valid roadmap contains a deferred milestone owning a planned change whose dependencies are complete
        - WHEN: strict-spec-cli roadmap-recommend runs with --milestone naming that deferred milestone and without --allow-unrefined
        - THEN: the command exits non-zero with a deterministic diagnostic naming roadmap-refine and the --allow-unrefined override, and the same command with --allow-unrefined supplied returns that milestone's eligible planned change
  roadmap-milestone-active-status-retirement:
    strength: MUST
    statement: The system MUST NOT accept or produce the milestone status value 'active'. The declared milestone status enum in the roadmap milestone and roadmap index artifacts MUST NOT include it, and the derived milestone status set MUST be exactly proposed, blocked, and complete, so a milestone owning planned work that is not yet fully archived derives 'proposed' whether or not any of that work has a strict change in progress. A roadmap artifact still declaring the retired value MUST be reported as a blocking diagnostic naming roadmap-sync as the repair, and roadmap-sync MUST rewrite that value to 'proposed' without requiring an additional flag. Legacy migration input declaring 'active' MUST be converted to 'proposed' rather than failing the migration.
    scenarios:
      in-progress-milestone-derives-proposed:
        - GIVEN: a milestone owns a standalone planned change whose strict change exists under .strict-spec-driven/changes/ and is not archived
        - WHEN: strict-spec-cli roadmap-status runs
        - THEN: the milestone reports derivedStatus 'proposed' and no milestone reports 'active' in either declared or derived status
      sync-does-not-rewrite-a-milestone-when-work-starts:
        - GIVEN: a valid roadmap whose milestone declares 'proposed' and owns a planned change whose strict change has just been created under .strict-spec-driven/changes/
        - WHEN: strict-spec-cli roadmap-sync runs
        - THEN: the command exits zero, reports the milestone as valid with no mismatch, and leaves the milestone artifact byte-identical
      retired-status-blocks-and-is-repaired-by-sync:
        - GIVEN: a milestone artifact declares the retired status value 'active'
        - WHEN: strict-spec-cli roadmap-status runs and strict-spec-cli roadmap-sync then runs with no additional flag
        - THEN: roadmap-status reports the roadmap invalid with a deterministic diagnostic naming the milestone status field, the retired value, and roadmap-sync as the repair; roadmap-sync rewrites the value to 'proposed', reports the updated file, and roadmap-status is valid afterward
      milestone-authoring-rejects-the-retired-value:
        - GIVEN: the roadmap milestone schema and the declared roadmap status set
        - WHEN: a milestone artifact carrying status 'active' is validated
        - THEN: the value is not a member of the declared milestone status enum in either the milestone artifact or the roadmap index entry
      legacy-migration-maps-active-to-proposed:
        - GIVEN: a legacy Markdown roadmap milestone whose Status section declares 'active'
        - WHEN: strict-spec-cli migrate runs against that legacy workflow
        - THEN: the converted strict milestone declares 'proposed', the migration succeeds, and the converted roadmap validates against the narrowed status enum

  - id: strict-skill-packaging-layout-contract
    strength: MUST
    statement: >-
      The system MUST provide strict skill packaging surfaces for both `strict-spec-*` and
      `strict-roadmap-*` families with installer-facing metadata that uses strict namespace names in
      non-migration contexts.
    scenarios:

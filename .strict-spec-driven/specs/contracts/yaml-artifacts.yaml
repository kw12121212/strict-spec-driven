  - id: strict-core-skill-command-contract
    strength: MUST
    statement: >-
      The system MUST provide strict core lifecycle skill packages for `init`, `propose`, `apply`,
      `verify`, `review`, `archive`, `auto`, `modify`, and `cancel` with explicit command mappings

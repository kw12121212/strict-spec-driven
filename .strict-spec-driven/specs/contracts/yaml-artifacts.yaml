  yaml-delta-tech-operation-model:
    strength: MUST
    statement: The system MUST represent strict YAML delta tech operations as ADDED, MODIFIED, and REMOVED maps keyed by rule identifier that target a named standard, where REMOVED entries carry a reason.
    scenarios:
      delta-tech-operations-are-structured:
        - GIVEN: a strict YAML delta tech artifact is reviewed
        - WHEN: its operations are inspected
        - THEN: the target standard, the ADDED, MODIFIED, and REMOVED rule maps, and each REMOVED reason are available as structured fields
  yaml-delta-tech-archive-merge:
    strength: MUST
    statement: The system MUST merge a change's delta tech operations into the targeted standard on archive and regenerate the tech index, applying the same active-target exclusivity, added-existing-target, modified-missing-target, and removed-missing-target rules used for delta specs.
    scenarios:
      delta-tech-merges-on-archive:
        - GIVEN: an active change contains delta tech operations targeting a standard
        - WHEN: the change is archived
        - THEN: the targeted standard rules reflect the ADDED, MODIFIED, and REMOVED operations and the tech index is regenerated from the merged state
  yaml-delta-tech-new-standard-creation:
    strength: MUST
    statement: The system MUST create a new technical standard on archive when a delta tech artifact targets a standard identifier that does not yet exist and supplies a standard block with title and category.
    scenarios:
      delta-tech-creates-new-standard:
        - GIVEN: a delta tech artifact targets a missing standard id and supplies a standard block with title and category
        - WHEN: the change is archived
        - THEN: a new strict YAML technical standard file is created from the standard block, mapping, and ADDED rules and is listed in the tech index
  tech-standards-consulted-in-lifecycle:
    strength: SHOULD
    statement: The change workflow SHOULD consult applicable technical standards during proposal, implementation, and review so that standard changes flow through delta tech rather than out-of-band edits.
    scenarios:
      lifecycle-consults-tech-standards:
        - GIVEN: a strict change is proposed, implemented, and reviewed
        - WHEN: applicable technical standards exist
        - THEN: the workflow treats applicable MUST rules as binding and SHOULD rules as defaults and carries any standard change as a delta tech artifact
  ui-classification-policy:
    strength: SHOULD
    statement: User-observable UI behavior SHOULD be recorded as main spec requirements, UI engineering and design rules SHOULD be recorded as technical standards in the ui category, and pixel-level visual fidelity SHOULD be governed by visual-regression snapshots referenced from mappings rather than inlined into YAML artifacts.
    scenarios:
      ui-work-is-classified:
        - GIVEN: a change includes user interface work
        - WHEN: its strict artifacts are authored
        - THEN: user-observable UI behavior is recorded as main spec requirements
        - AND: UI engineering and design rules are recorded as ui-category technical standards
  yaml-tech-category-includes-ui:
    strength: MUST
    statement: The strict YAML technical standard and delta tech schemas MUST accept a ui category for standards that govern user interface engineering and design rules.
    scenarios:
      ui-category-is-accepted:
        - GIVEN: a technical standard or delta tech artifact declares the ui category
        - WHEN: it is validated against its schema
        - THEN: the ui category is accepted as a valid standard category
  serializer-does-not-fold-long-scalars:
    strength: MUST
    statement: The shared strict YAML serializer MUST NOT fold long scalar values across multiple physical lines; each serialized scalar MUST remain on a single line regardless of length.
    scenarios:
      long-scalar-serializes-on-one-line:
        - GIVEN: a strict artifact value whose scalar field is longer than a conventional line-wrap width
        - WHEN: the value is serialized through the shared stringifyYamlDocument writer
        - THEN: the emitted scalar appears on a single physical line with no folded continuation lines
  yaml-schema-file-paths-resolve-in-shared-cache:
    strength: MUST
    statement: The system MUST export bundled strict schema assets into ~/.strict-spec-schemas/ using path segments that preserve each strict YAML artifact's schema_file-relative schema location, so a schema_file value can be resolved against the shared cache root without requiring per-project template directories.
    scenarios:
      shared-cache-mirrors-schema-file-layout:
        - GIVEN: a strict YAML artifact declares a schema_file under templates/strict-spec-driven/schemas/
        - WHEN: the shared schema cache has been synchronized
        - THEN: the corresponding schema file exists under ~/.strict-spec-schemas/ at the same relative schema_file path
      shared-cache-keeps-schema-registry-discoverable:
        - GIVEN: an agent or tool needs to discover supported strict workflow schemas from the shared cache
        - WHEN: it inspects ~/.strict-spec-schemas/
        - THEN: the shared cache includes the exported schema registry and enough metadata to enumerate the exported schema files
  yaml-ticket-artifact-family:
    strength: MUST
    statement: The system MUST define a strict YAML ticket artifact family that captures a pure requirement (problem statement, desired observable outcome, and intent/acceptance notes) separate from any solution, with a conflict-resistant ticket id and title, a lifecycle status enum, creation metadata, optional labels and an optional external-tracker reference, provenance links, and an embedded dispatch-decision record, represented through structured YAML fields.
    scenarios:
      ticket-captures-pure-requirement-and-dispatch-state:
        - GIVEN: the strict YAML ticket schema is reviewed
        - WHEN: the ticket artifact contract is checked
        - THEN: problem statement, desired outcome, and intent are available as structured fields separate from any solution, a conflict-resistant id and lifecycle status enum are present, and an embedded dispatch-decision record with outcome, evidence, rationale, and timestamp is representable
  yaml-ticket-conflict-resistant-ids-and-index:
    strength: MUST
    statement: The system MUST store tickets under a dedicated strict workflow tickets location with a tickets index artifact and per-ticket files identified by conflict-resistant ids derived from ticket content rather than a shared sequential counter.
    scenarios:
      tickets-use-conflict-resistant-ids:
        - GIVEN: the strict YAML ticket and tickets-index contracts are reviewed
        - WHEN: ticket identity and storage are checked
        - THEN: tickets are stored as per-ticket files under a dedicated tickets location with a tickets index
        - AND: ticket ids are derived from ticket content rather than allocated from a shared sequential counter so concurrent intake does not collide on a global number
  yaml-ticket-schema-assets:
    strength: MUST
    statement: The system MUST provide concrete schema, schema registry, and minimal valid example assets for the ticket and tickets-index artifact families alongside the existing strict workflow schema and example assets.
    scenarios:
      ticket-schema-assets-are-discoverable:
        - GIVEN: strict workflow schema assets are reviewed
        - WHEN: the ticket and tickets-index artifact families are checked
        - THEN: concrete ticket and tickets-index schema files are available under templates/strict-spec-driven/schemas/
        - THEN: the schema registry lists the ticket and tickets-index schemas each with a primary example
        - THEN: minimal valid ticket and tickets-index examples are available under examples/strict-spec-driven/
      ticket-schema-assets-validate:
        - GIVEN: the ticket and tickets-index schemas and their primary examples are loaded
        - WHEN: validation is run through the shared strict YAML validation layer
        - THEN: each example parses successfully and matches the schema identity and artifact type declared by its schema
  yaml-milestone-source-ticket-backreference:
    strength: MUST
    statement: The system MUST allow a roadmap milestone artifact to carry an optional source-ticket back-reference identifying the ticket it was promoted from, so ticket-to-milestone provenance is recoverable from the roadmap side.
    scenarios:
      milestone-accepts-source-ticket:
        - GIVEN: the roadmap milestone schema is reviewed
        - WHEN: a milestone carries an optional source-ticket back-reference
        - THEN: the milestone validates with the source-ticket field present and the field identifies the originating ticket by id
  strict-ticket-dispatch-completes-milestones-when-sufficient:
    strength: MUST
    statement: The system MUST ensure the strict-ticket-dispatch skill, after promoting a not-implemented ticket, either completes the promoted roadmap milestone with concrete executable planning fields including milestone details and at least one standalone planned-change artifact with actionable details when ticket intent and gathered evidence are sufficient, or preserves a valid explicit handoff with the human decision needed when the evidence is ambiguous or incomplete.
    scenarios:
      dispatch-completes-sufficient-milestone-with-planned-change-details:
        - GIVEN: a not-implemented ticket is promoted and the ticket intent plus gathered repository evidence provide enough concrete milestone scope, done criteria, dependencies, risks, and planned changes
        - WHEN: strict-ticket-dispatch continues after ticket-resolve and roadmap-sync
        - THEN: the skill guidance directs the agent to replace the promoted milestone refinement stub, write milestone details, create at least one standalone planned-change artifact with actionable summary and details, run roadmap-sync again, and report the completed milestone and planned-change files
      dispatch-defers-insufficient-milestone:
        - GIVEN: a not-yet-built ticket requirement lacks enough evidence to define concrete milestone scope, milestone details, or a standalone planned change
        - WHEN: strict-ticket-dispatch forms its dispatch judgment
        - THEN: the skill guidance directs the agent not to promote yet, to leave the ticket open, and to ask for the concrete missing planning detail instead of inventing scope or planned changes
  strict-ticket-archive-uses-resolve-command:
    strength: MUST
    statement: The system MUST provide a strict-ticket-archive skill that archives tickets only through the existing ticket-resolve CLI transition, preserves existing dispatch evidence, verifies archived ticket readability, and refuses to invent a dispatch outcome for an undecided ticket.
    scenarios:
      archive-skill-uses-existing-cli:
        - GIVEN: a ticket already has a dispatch decision or the user supplies the exact outcome and rationale
        - WHEN: strict-ticket-archive is used
        - THEN: the skill guidance directs the agent to run ticket-resolve, then ticket-show and ticket-validate, rather than manually moving ticket YAML
      archive-skill-defers-undecided-ticket:
        - GIVEN: a ticket is open or needs input and has no explicit dispatch decision
        - WHEN: strict-ticket-archive is used
        - THEN: the skill guidance directs the agent to hand off to strict-ticket-dispatch instead of inventing an outcome

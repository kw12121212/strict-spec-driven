schema: strict-spec-driven/main-spec/v1
schema_version: 1
artifact_type: main_spec
schema_file: templates/strict-spec-driven/schemas/main-spec.yaml
spec:
  id: contracts-yaml-artifacts
  title: Strict YAML Artifact Schemas
mapping:
  implementation:
    - src/migrate.ts
    - src/scaffold.ts
    - templates/strict-spec-driven/schemas/schema-registry.yaml
    - templates/strict-spec-driven/schemas/registry.yaml
    - templates/strict-spec-driven/schemas/roadmap-index.yaml
    - templates/strict-spec-driven/schemas/roadmap-milestone.yaml
    - templates/strict-spec-driven/schemas/planned-change-entry.yaml
    - templates/strict-spec-driven/examples/schema-registry.yaml
    - templates/strict-spec-driven/examples/roadmap-index.yaml
    - templates/strict-spec-driven/examples/roadmap-index.ordering.yaml
    - templates/strict-spec-driven/examples/roadmap-milestone.yaml
    - templates/strict-spec-driven/examples/roadmap-milestone.planning.yaml
    - templates/strict-spec-driven/examples/planned-change-entry.yaml
    - src/validation.ts
    - src/yaml.ts
    - install.sh
    - scripts/strict-spec-driven.js
    - skills/marketplace.json
    - skills/strict-spec-archive/SKILL.md
    - skills/strict-spec-apply/SKILL.md
    - skills/strict-spec-auto/SKILL.md
    - skills/strict-spec-brainstorm/SKILL.md
    - skills/strict-spec-cancel/SKILL.md
    - skills/strict-spec-init/SKILL.md
    - skills/strict-spec-maintenance/SKILL.md
    - skills/strict-spec-modify/SKILL.md
    - skills/strict-spec-propose/SKILL.md
    - skills/strict-spec-resync-code-mapping/SKILL.md
    - skills/strict-spec-review/SKILL.md
    - skills/strict-spec-ship/SKILL.md
    - skills/strict-spec-simple-task/SKILL.md
    - skills/strict-spec-spec-edit/SKILL.md
    - skills/strict-spec-sync-specs/SKILL.md
    - skills/strict-spec-verify/SKILL.md
    - skills/strict-roadmap-milestone/SKILL.md
    - skills/strict-roadmap-plan/SKILL.md
    - skills/strict-roadmap-propose/SKILL.md
    - skills/strict-roadmap-recommend/SKILL.md
    - skills/strict-roadmap-sync/SKILL.md
    - README.md
    - RTK.md
  tests:
    - test/run.ts
requirements:
  - id: yaml-artifact-schema-coverage
    strength: MUST
    statement: >-
      The system MUST define strict YAML schemas for main specs, delta specs, change proposals,
      change designs, task lists, question lists, spec indexes, roadmap indexes, roadmap milestones,
      and planned change entries.
    scenarios:
      - id: required-artifact-families-are-covered
        steps:
          - kind: GIVEN
            text: the strict workflow artifact contract is reviewed
          - kind: WHEN
            text: each required artifact family is checked
          - kind: THEN
            text: every required artifact family has a YAML schema definition
  - id: yaml-schema-field-contracts
    strength: MUST
    statement: >-
      The system MUST define required fields, optional fields, enum values, relationship fields,
      stable identifiers, uniqueness scopes, matching rules, and minimal valid examples for each
      strict YAML artifact schema.
    scenarios:
      - id: schema-fields-are-reviewable
        steps:
          - kind: GIVEN
            text: a strict YAML artifact schema
          - kind: WHEN
            text: a human or script reviews the schema contract
          - kind: THEN
            text: >-
              the required fields, optional fields, enum values, relationships, stable identifiers,
              and minimal valid example are identifiable without relying on unstated convention
  - id: yaml-schema-example-coverage
    strength: MUST
    statement: >-
      The system MUST provide at least one minimal valid YAML example for each required artifact
      family.
    scenarios:
      - id: artifact-examples-cover-the-contract
        steps:
          - kind: GIVEN
            text: strict YAML artifact schema examples are reviewed
          - kind: WHEN
            text: the required artifact families are compared with the available examples
          - kind: THEN
            text: >-
              main specs, delta specs, change proposals, change designs, task lists, question lists,
              spec indexes, roadmap indexes, roadmap milestones, and planned change entries each
              have at least one minimal valid YAML example
  - id: yaml-main-spec-file-model
    strength: MUST
    statement: >-
      The system MUST define strict YAML main spec files as YAML documents with structured schema
      identity, stable spec identity, human-readable title, file-level mappings, and requirement
      collections.
    scenarios:
      - id: main-spec-top-level-fields-are-structured
        steps:
          - kind: GIVEN
            text: a strict YAML main spec file is reviewed
          - kind: WHEN
            text: its top-level data is inspected
          - kind: THEN
            text: the schema identity is available as a structured field
          - kind: AND
            text: the stable spec identifier is available as a structured field
          - kind: AND
            text: the human-readable title is available as a structured field
          - kind: AND
            text: implementation and test mappings are available as structured file-level fields
          - kind: AND
            text: requirements are available as a structured collection
  - id: yaml-main-spec-requirement-model
    strength: MUST
    statement: >-
      The system MUST represent each strict YAML main spec requirement with a stable identifier, RFC
      2119 strength enum, observable behavior statement, and zero or more structured scenarios.
    scenarios:
      - id: main-spec-requirement-fields-are-structured
        steps:
          - kind: GIVEN
            text: a strict YAML main spec requirement is reviewed
          - kind: WHEN
            text: its requirement data is inspected
          - kind: THEN
            text: the requirement identifier is available as a structured field
          - kind: AND
            text: >-
              the RFC 2119 strength is available as a structured field with a valid MUST, SHOULD, or
              MAY value
          - kind: AND
            text: the observable behavior statement is available as a structured field
          - kind: AND
            text: scenarios are available as a structured collection
      - id: requirement-strength-values-are-constrained
        steps:
          - kind: GIVEN
            text: a strict YAML main spec requirement is validated
          - kind: WHEN
            text: the requirement strength is checked
          - kind: THEN
            text: MUST, SHOULD, and MAY are accepted values
          - kind: AND
            text: other strength values can be reported as deterministic validation failures
  - id: yaml-scenario-step-model
    strength: MUST
    statement: >-
      The system MUST represent strict YAML scenarios with stable scenario identifiers and ordered
      structured step entries that preserve GIVEN, WHEN, THEN, and AND semantics without relying on
      Markdown bullet formatting.
    scenarios:
      - id: scenario-steps-are-machine-readable
        steps:
          - kind: GIVEN
            text: a strict YAML scenario is reviewed
          - kind: WHEN
            text: its steps are inspected
          - kind: THEN
            text: the scenario identifier is available as a structured field
          - kind: AND
            text: each step has a structured step kind with a valid GIVEN, WHEN, THEN, or AND value
          - kind: AND
            text: each step has structured step text
          - kind: AND
            text: the step order is preserved
  - id: yaml-requirement-and-scenario-identifiers
    strength: MUST
    statement: >-
      The system MUST require stable identifiers for strict YAML specs, requirements, and scenarios
      that can be validated for uniqueness within their owning scope.
    scenarios:
      - id: spec-identifiers-are-stable
        steps:
          - kind: GIVEN
            text: a strict YAML main spec file is renamed or moved
          - kind: WHEN
            text: archive or validation behavior matches the spec to known workflow state
          - kind: THEN
            text: >-
              the stable spec identifier remains available without deriving identity from the file
              path alone
      - id: duplicate-requirement-identifiers-can-be-rejected
        steps:
          - kind: GIVEN
            text: a strict YAML spec file repeats a requirement identifier
          - kind: WHEN
            text: validation is run against the spec and delta model
          - kind: THEN
            text: >-
              the duplicate requirement identifier can be reported as a deterministic validation
              failure
      - id: duplicate-scenario-identifiers-can-be-rejected
        steps:
          - kind: GIVEN
            text: a strict YAML requirement repeats a scenario identifier within that requirement
          - kind: WHEN
            text: validation is run against the spec and delta model
          - kind: THEN
            text: >-
              the duplicate scenario identifier can be reported as a deterministic validation
              failure
  - id: yaml-spec-file-mapping-model
    strength: MUST
    statement: >-
      The system MUST represent implementation and test mappings for strict YAML spec files as
      structured file-level fields containing normalized repo-relative file path collections.
    scenarios:
      - id: mappings-stay-outside-requirement-prose
        steps:
          - kind: GIVEN
            text: a strict YAML spec file is reviewed
          - kind: WHEN
            text: implementation and test mappings are inspected
          - kind: THEN
            text: the mappings are available in structured file-level fields
          - kind: AND
            text: the mappings are not embedded in requirement or scenario prose
      - id: mapping-paths-are-repo-relative
        steps:
          - kind: GIVEN
            text: a strict YAML spec mapping is validated
          - kind: WHEN
            text: each implementation or test path is checked
          - kind: THEN
            text: normalized repo-relative paths are accepted
          - kind: AND
            text: >-
              absolute paths or parent-directory traversal paths can be reported as deterministic
              validation failures
  - id: yaml-main-spec-minimal-example
    strength: MUST
    statement: >-
      The system MUST provide a minimal valid YAML main spec example that includes schema identity,
      stable spec identity, title, mapping fields, one requirement, one scenario, and ordered
      scenario steps.
    scenarios:
      - id: main-spec-example-is-complete-enough-to-validate
        steps:
          - kind: GIVEN
            text: the strict YAML main spec contract is reviewed
          - kind: WHEN
            text: its minimal valid example is inspected
          - kind: THEN
            text: every required top-level main spec field is present
          - kind: AND
            text: every required requirement field is present
          - kind: AND
            text: every required scenario field is present
      - id: main-spec-example-demonstrates-enum-and-mapping-values
        steps:
          - kind: GIVEN
            text: the strict YAML main spec example is inspected
          - kind: WHEN
            text: requirement strength, scenario step kinds, and mapping fields are reviewed
          - kind: THEN
            text: the example demonstrates a valid MUST, SHOULD, or MAY requirement strength
          - kind: AND
            text: the example demonstrates valid GIVEN, WHEN, THEN, and optional AND step kinds
          - kind: AND
            text: >-
              the example demonstrates implementation and test mapping fields as repo-relative path
              collections
  - id: yaml-delta-operation-model
    strength: MUST
    statement: >-
      The system MUST represent strict YAML delta specs with structured schema identity, target spec
      identity, and explicit ADDED, MODIFIED, and REMOVED operation collections instead of Markdown
      section headings.
    scenarios:
      - id: delta-operation-groups-are-structured
        steps:
          - kind: GIVEN
            text: a strict YAML delta spec is reviewed
          - kind: WHEN
            text: the requested spec changes are inspected
          - kind: THEN
            text: the schema identity is available as a structured field
          - kind: AND
            text: the target spec identity is available as a structured field
          - kind: AND
            text: added requirements are available through a structured ADDED collection
          - kind: AND
            text: modified requirements are available through a structured MODIFIED collection
          - kind: AND
            text: removed requirements are available through a structured REMOVED collection
      - id: empty-operation-groups-remain-explicit
        steps:
          - kind: GIVEN
            text: a strict YAML delta spec has no entries for one operation kind
          - kind: WHEN
            text: the operation groups are inspected
          - kind: THEN
            text: >-
              the empty operation kind remains identifiable without relying on an omitted Markdown
              heading
  - id: yaml-delta-stable-matching
    strength: MUST
    statement: >-
      The system MUST require strict YAML delta modifications and removals to target existing
      requirements by stable requirement identifier.
    scenarios:
      - id: added-requirements-carry-stable-identifiers
        steps:
          - kind: GIVEN
            text: a strict YAML delta spec adds a requirement
          - kind: WHEN
            text: the added requirement is inspected
          - kind: THEN
            text: >-
              the added requirement includes the same stable requirement fields required by a main
              spec requirement
      - id: modified-requirements-target-stable-identifiers
        steps:
          - kind: GIVEN
            text: a strict YAML delta spec modifies a requirement
          - kind: WHEN
            text: the modification target is inspected
          - kind: THEN
            text: the target existing requirement is identified by stable requirement identifier
          - kind: AND
            text: the replacement requirement data is available as structured fields
      - id: removed-requirements-target-stable-identifiers
        steps:
          - kind: GIVEN
            text: a strict YAML delta spec removes a requirement
          - kind: WHEN
            text: the removal target is inspected
          - kind: THEN
            text: the target existing requirement is identified by stable requirement identifier
  - id: yaml-delta-merge-conflict-rules
    strength: MUST
    statement: >-
      The system MUST define deterministic merge conflict rules for archive behavior so that delta
      merge outcomes are predictable without manual resolution.
    scenarios:
      - id: exclusive-active-target-is-enforced-at-verify-time
        steps:
          - kind: GIVEN
            text: >-
              two active changes each have a delta that targets the same requirement ID with
              MODIFIED or REMOVED
          - kind: WHEN
            text: verify is run against either active change
          - kind: THEN
            text: the duplicate active target is reported as a deterministic validation failure
          - kind: AND
            text: archive is blocked until the conflict is resolved
      - id: modified-entry-with-missing-target-is-treated-as-added
        steps:
          - kind: GIVEN
            text: >-
              a MODIFIED delta entry targets a requirement ID that does not exist in the main spec
              at archive time
          - kind: WHEN
            text: archive merge is executed
          - kind: THEN
            text: the entry is treated as ADDED in the merge output
          - kind: AND
            text: the outcome is recorded in the archive merge report
      - id: removed-entry-with-missing-target-is-skipped
        steps:
          - kind: GIVEN
            text: >-
              a REMOVED delta entry targets a requirement ID that does not exist in the main spec at
              archive time
          - kind: WHEN
            text: archive merge is executed
          - kind: THEN
            text: the entry is silently skipped
          - kind: AND
            text: the skipped removal is recorded in the archive merge report
  - id: yaml-delta-removal-reason
    strength: MUST
    statement: >-
      The system MUST require each strict YAML removed requirement delta to include a structured
      removal reason.
    scenarios:
      - id: removal-rationale-is-reviewable
        steps:
          - kind: GIVEN
            text: a strict YAML delta spec removes a requirement
          - kind: WHEN
            text: the removal entry is reviewed
          - kind: THEN
            text: the reason for removal is available as a structured field
  - id: yaml-delta-minimal-example
    strength: MUST
    statement: >-
      The system MUST provide a minimal valid YAML delta spec example that includes schema identity,
      target spec identity, and explicit ADDED, MODIFIED, and REMOVED operation collections.
    scenarios:
      - id: delta-spec-example-is-complete-enough-to-validate
        steps:
          - kind: GIVEN
            text: the strict YAML delta spec contract is reviewed
          - kind: WHEN
            text: its minimal valid example is inspected
          - kind: THEN
            text: every required top-level delta spec field is present
          - kind: AND
            text: each delta operation collection is represented as structured YAML data
          - kind: AND
            text: modification and removal entries demonstrate stable requirement identifier matching
      - id: delta-spec-example-demonstrates-operation-payloads
        steps:
          - kind: GIVEN
            text: the strict YAML delta spec example is inspected
          - kind: WHEN
            text: ADDED, MODIFIED, and REMOVED entries are reviewed
          - kind: THEN
            text: the added entry demonstrates the required main spec requirement fields
          - kind: AND
            text: >-
              the modified entry demonstrates a target requirement identifier and replacement
              requirement fields
          - kind: AND
            text: the removed entry demonstrates a target requirement identifier and removal reason
  - id: yaml-concrete-schema-file-coverage
    strength: MUST
    statement: >-
      The system MUST provide concrete YAML schema files for main specs, delta specs, change
      proposals, change designs, task lists, question lists, spec indexes, roadmap indexes, roadmap
      milestones, and planned change entries.
    scenarios:
      - id: schema-files-cover-every-required-artifact-family
        steps:
          - kind: GIVEN
            text: the strict workflow schema files are reviewed
          - kind: WHEN
            text: the required artifact families are compared with the available schema files
          - kind: THEN
            text: every required artifact family has at least one concrete YAML schema file
  - id: yaml-concrete-schema-file-identity
    strength: MUST
    statement: >-
      The system MUST require each concrete YAML schema file to expose structured artifact type and
      schema version fields.
    scenarios:
      - id: schema-file-identity-is-machine-readable
        steps:
          - kind: GIVEN
            text: a concrete YAML schema file is inspected
          - kind: WHEN
            text: its identity fields are reviewed
          - kind: THEN
            text: the artifact type is available as a structured field
          - kind: AND
            text: the schema version is available as a structured field
  - id: yaml-concrete-schema-file-contract
    strength: MUST
    statement: >-
      The system MUST require concrete YAML schema files to define required fields, optional fields,
      enum values, relationship fields, stable identifier fields, uniqueness scopes, and supported
      top-level shapes as structured YAML data.
    scenarios:
      - id: schema-file-contract-is-structured
        steps:
          - kind: GIVEN
            text: a concrete YAML schema file is inspected
          - kind: WHEN
            text: its validation contract is reviewed
          - kind: THEN
            text: required fields are available as structured data
          - kind: AND
            text: optional fields are available as structured data
          - kind: AND
            text: enum values are available as structured data
          - kind: AND
            text: relationship fields are available as structured data
          - kind: AND
            text: stable identifier and uniqueness rules are available as structured data
          - kind: AND
            text: supported top-level shapes are available as structured data
  - id: yaml-concrete-example-file-coverage
    strength: MUST
    statement: >-
      The system MUST provide minimal valid YAML example files for main specs, delta specs, change
      proposals, change designs, task lists, question lists, spec indexes, roadmap indexes, roadmap
      milestones, and planned change entries.
    scenarios:
      - id: example-files-cover-every-required-artifact-family
        steps:
          - kind: GIVEN
            text: the strict workflow example files are reviewed
          - kind: WHEN
            text: the required artifact families are compared with the available example files
          - kind: THEN
            text: every required artifact family has at least one minimal valid YAML example file
  - id: yaml-example-schema-association
    strength: MUST
    statement: >-
      The system MUST make each minimal valid YAML example file associated with the concrete schema
      file or artifact type it demonstrates.
    scenarios:
      - id: examples-identify-their-schema-target
        steps:
          - kind: GIVEN
            text: a minimal valid YAML example file is inspected
          - kind: WHEN
            text: its schema association is reviewed
          - kind: THEN
            text: >-
              the target schema file or target artifact type is identifiable through structured YAML
              data or repository-defined file organization
  - id: yaml-schema-and-example-parseability
    strength: MUST
    statement: >-
      The system MUST require concrete schema files and minimal valid example files to be parseable
      as YAML documents without relying on Markdown headings, frontmatter, list indentation, or
      prose-only conventions.
    scenarios:
      - id: schema-files-are-parseable-yaml
        steps:
          - kind: GIVEN
            text: a concrete schema file is loaded by a YAML parser
          - kind: WHEN
            text: the file is syntactically valid
          - kind: THEN
            text: the schema contract is available through structured YAML fields
      - id: example-files-are-parseable-yaml
        steps:
          - kind: GIVEN
            text: a minimal valid example file is loaded by a YAML parser
          - kind: WHEN
            text: the file is syntactically valid
          - kind: THEN
            text: the example artifact data is available through structured YAML fields
  - id: strict-schema-file-organization
    strength: MUST
    statement: >-
      The system MUST store repository-bundled strict workflow schema files under
      `templates/strict-spec-driven/schemas/` and minimal valid example files under
      `templates/strict-spec-driven/examples/`, separate from `.strict-spec-driven/` workflow state.
    scenarios:
      - id: schema-and-example-directories-are-discoverable
        steps:
          - kind: GIVEN
            text: the strict workflow repository files are reviewed
          - kind: WHEN
            text: concrete schema and example locations are checked
          - kind: THEN
            text: schema files are available under `templates/strict-spec-driven/schemas/`
          - kind: AND
            text: >-
              minimal valid example files are available under
              `templates/strict-spec-driven/examples/`
          - kind: AND
            text: >-
              `.strict-spec-driven/` is not used to store repository-bundled schema or example
              assets
  - id: strict-schema-example-file-naming
    strength: MUST
    statement: >-
      The system MUST name schema and example files so each required artifact family has a
      corresponding schema file and example file with matching artifact identity.
    scenarios:
      - id: artifact-family-file-pairs-are-identifiable
        steps:
          - kind: GIVEN
            text: the strict workflow schema and example directories are reviewed
          - kind: WHEN
            text: an artifact family is checked
          - kind: THEN
            text: a schema file for that artifact family is identifiable
          - kind: AND
            text: an example file for that artifact family is identifiable
          - kind: AND
            text: >-
              the schema and example expose matching artifact type identity through structured YAML
              fields
  - id: yaml-schema-dialect-is-machine-readable
    strength: MUST
    statement: >-
      The system MUST represent concrete schema file validation rules through machine-readable
      nested fields rather than prose-only shape descriptions.
    scenarios:
      - id: nested-fields-are-inspectable
        steps:
          - kind: GIVEN
            text: a concrete schema file is reviewed
          - kind: WHEN
            text: a nested artifact field is checked
          - kind: THEN
            text: the field type is available through structured YAML data
          - kind: AND
            text: required status is available through structured YAML data
          - kind: AND
            text: >-
              enum, const, item, uniqueness, reference, and additional-field rules are available
              through structured YAML data where they apply
  - id: yaml-artifact-schema-identity-consistency
    strength: MUST
    statement: >-
      The system MUST make every strict YAML artifact example identify the schema ID of the schema
      file it demonstrates.
    scenarios:
      - id: examples-match-schema-identity
        steps:
          - kind: GIVEN
            text: a concrete schema file and its primary example are reviewed
          - kind: WHEN
            text: their identity fields are compared
          - kind: THEN
            text: the example `schema` value matches the schema file `schema_id`
          - kind: AND
            text: the example `artifact_type` value matches the schema file `artifact_type`
  - id: yaml-minimal-and-coverage-example-separation
    strength: MUST
    statement: >-
      The system MUST keep minimal valid examples separate from richer coverage examples when
      coverage data would introduce optional operations or blocking workflow state.
    scenarios:
      - id: minimal-examples-remain-minimal
        steps:
          - kind: GIVEN
            text: a strict YAML artifact family has optional operations or blocking workflow state
          - kind: WHEN
            text: its primary minimal example is inspected
          - kind: THEN
            text: the primary example avoids optional operations and blocking workflow state
          - kind: AND
            text: richer coverage examples are identified separately when needed
  - id: yaml-roadmap-index-ordering-contract
    strength: MUST
    statement: >-
      The system MUST represent roadmap index milestone ordering through structured YAML sequence
      data rather than relying on Markdown list formatting or filename sorting alone.
    scenarios:
      - id: roadmap-index-preserves-milestone-order
        steps:
          - kind: GIVEN
            text: a strict roadmap index artifact is reviewed
          - kind: WHEN
            text: the `milestones` field is inspected
          - kind: THEN
            text: milestone entries appear in an ordered YAML sequence
          - kind: AND
            text: each entry exposes structured `id`, `title`, `path`, and `status` fields
          - kind: AND
            text: milestone order remains recoverable from the artifact data alone
  - id: yaml-roadmap-milestone-planning-model
    strength: MUST
    statement: >-
      The system MUST represent roadmap milestone planning state through structured YAML fields for
      goal, scope, done criteria, dependencies, risks, status, notes, and planned change entries.
    scenarios:
      - id: roadmap-milestone-exposes-planning-sections-as-fields
        steps:
          - kind: GIVEN
            text: a strict roadmap milestone artifact is reviewed
          - kind: WHEN
            text: its planning content is inspected
          - kind: THEN
            text: the milestone goal is available as structured YAML data
          - kind: AND
            text: in-scope and out-of-scope items are available through structured YAML fields
          - kind: AND
            text: >-
              done criteria, dependencies, risks, and notes are available through structured YAML
              fields
          - kind: AND
            text: >-
              the milestone status is available as a structured YAML field rather than a prose
              heading
          - kind: AND
            text: planned changes are available as structured YAML entries owned by the milestone
      - id: milestone-declared-status-uses-roadmap-enums
        steps:
          - kind: GIVEN
            text: a strict roadmap milestone artifact is validated
          - kind: WHEN
            text: the milestone status is inspected
          - kind: THEN
            text: the declared status is limited to `proposed`, `active`, `blocked`, or `complete`
  - id: yaml-planned-change-entry-dependency-model
    strength: MUST
    statement: >-
      The system MUST represent each planned change entry with a stable identifier, declared status,
      summary, and structured dependency references.
    scenarios:
      - id: planned-change-entries-expose-roadmap-planning-fields
        steps:
          - kind: GIVEN
            text: a strict planned change entry is reviewed
          - kind: WHEN
            text: its fields are inspected
          - kind: THEN
            text: the entry exposes structured `id`, `status`, `summary`, and `depends_on` fields
          - kind: AND
            text: the entry status is limited to `planned` or `complete`
          - kind: AND
            text: >-
              dependency references are expressed as structured planned change identifiers instead
              of prose-only notes
  - id: yaml-roadmap-example-contract-coverage
    strength: MUST
    statement: >-
      The system MUST provide roadmap example artifacts that demonstrate the roadmap schema contract
      fields needed for validation and review while keeping the primary minimal examples minimal.
    scenarios:
      - id: primary-roadmap-examples-remain-minimal
        steps:
          - kind: GIVEN
            text: the primary strict roadmap examples are reviewed
          - kind: WHEN
            text: minimal example content is inspected
          - kind: THEN
            text: the primary roadmap index example remains a minimal valid artifact
          - kind: AND
            text: the primary roadmap milestone example remains a minimal valid artifact
          - kind: AND
            text: richer workflow-state coverage is kept in separate roadmap example files
      - id: roadmap-coverage-examples-demonstrate-milestone-ordering-fields
        steps:

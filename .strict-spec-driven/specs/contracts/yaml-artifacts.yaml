  yaml-scripted-propose-input-contract:
    strength: MUST
    statement: The system MUST define a structured command-input contract for proposal population so each supported generated artifact can be validated before strict YAML is written.
    scenarios:
      generation-input-is-validated-before-writing:
        - GIVEN: a proposal population command receives named arguments for one supported artifact
        - WHEN: the command processes the input
        - THEN: the input is validated against the expected structured command contract for that artifact
        - AND: validation failures are reported before the target YAML artifact is written
  yaml-scripted-propose-output-contract:
    strength: MUST
    statement: The system MUST ensure scripted proposal population writes strict YAML artifacts that conform to the existing artifact schemas for proposals, designs, task lists, question lists, and delta specs.
    scenarios:
      generated-artifact-conforms-to-existing-schema:
        - GIVEN: a scripted proposal population command successfully writes an artifact
        - WHEN: the generated artifact is validated
        - THEN: the artifact conforms to its existing strict YAML artifact schema
        - AND: the command does not introduce an alternate generated-artifact schema for the output
  yaml-scripted-propose-delta-targeting:
    strength: MUST
    statement: The system MUST generate delta specs as target-spec-scoped artifacts so repeated scripted calls can populate separate delta spec files without combining unrelated spec changes.
    scenarios:
      one-delta-generation-targets-one-spec:
        - GIVEN: structured input describes delta operations for one target spec
        - WHEN: the delta generation command is executed
        - THEN: exactly one delta spec file for that target spec is written
        - AND: delta files for other target specs remain unchanged
  skill-proposal-generation-uses-parameterized-cli:
    strength: MUST
    statement: The system MUST guide proposal-generating skills to create or update every supported strict change artifact, including tasks.yaml, through deterministic strict CLI commands with named semantic arguments, while keeping agents responsible for semantic facts and checkpoint summaries; those skills MUST NOT hand-author YAML shape or create raw YAML or JSON payload files.
    scenarios:
      proposal-skills-delegate-all-supported-mechanics-to-cli:
        - GIVEN: A strict proposal-generating skill needs to populate or update change artifacts
        - WHEN: The skill instructions describe the artifact generation workflow
        - THEN: The instructions invoke strict CLI operations with named arguments for proposals, designs, task lists, questions, delta specs, and delta tech as applicable
        - THEN: The instructions keep semantic decisions and checkpoint summaries in the skill workflow without directing any YAML text edit or payload-file construction
  skill-commands-do-not-own-artifact-shape:
    strength: MUST
    statement: The system MUST preserve the boundary that skills provide semantic intent while CLI code owns strict artifact paths, shape, defaults, YAML serialization, complete-candidate validation, relationship checks, deterministic reporting, and safe mutation for every supported repository-owned YAML artifact, including tasks.yaml.
    scenarios:
      command-invocations-do-not-construct-artifact-shape:
        - GIVEN: A proposal or lifecycle skill instructs an agent to perform a repository-owned YAML mutation
        - WHEN: The generated commands are reviewed
        - THEN: Each command invokes artifact-aware strict CLI behavior with named semantic parameters
        - THEN: The commands do not construct YAML or JSON payload files, choose arbitrary artifact paths, or directly edit tasks.yaml
        - THEN: Judgment-dependent uncertainty remains represented as explicit questions rather than hidden in document mechanics
  yaml-standalone-planned-change-artifact-contract:
    strength: MUST
    statement: The system MUST define a standalone planned-change YAML artifact family with schema identity, artifact type, stable planned change id, exactly one owning milestone reference, declared status, summary, details, dependency references, and optional extension points for future team metadata.
    scenarios:
      standalone-planned-change-artifact-fields-are-structured:
        - GIVEN: a standalone planned-change artifact is reviewed
        - WHEN: its top-level data is inspected
        - THEN: schema identity and artifact type are available as structured fields
        - THEN: the planned change id and owning milestone reference are available as structured fields
        - THEN: status, summary, details, and dependency references are available as structured fields
      standalone-planned-change-artifact-has-extension-space:
        - GIVEN: future team metadata needs to be attached to a roadmap work item
        - WHEN: the standalone planned-change artifact contract is reviewed
        - THEN: the contract provides optional extension space without making owner, reviewer, blocked state, labels, or external references required in this change
  yaml-standalone-planned-change-schema-assets:
    strength: MUST
    statement: The system MUST provide concrete schema, schema registry, and minimal valid example assets for the standalone planned-change artifact family alongside the existing strict workflow schema and example assets.
    scenarios:
      standalone-planned-change-schema-assets-are-discoverable:
        - GIVEN: strict workflow schema assets are reviewed
        - WHEN: the standalone planned-change artifact family is checked
        - THEN: a concrete planned-change schema file is available under templates/strict-spec-driven/schemas/
        - THEN: the schema registry lists the planned-change schema with a primary example
        - THEN: a minimal valid planned-change example is available under examples/strict-spec-driven/
      standalone-planned-change-assets-validate:
        - GIVEN: the standalone planned-change schema and primary example are loaded
        - WHEN: validation is run through the shared strict YAML validation layer
        - THEN: the example parses successfully and matches the schema identity and artifact type declared by the schema
  yaml-roadmap-cross-file-conflict-model:
    strength: MUST
    statement: The system MUST define roadmap planned-change validation semantics across inline milestone entries and standalone planned-change artifacts for unique planned change identities, existing owning milestone references, valid dependency references, advisory ownership ambiguity, and active strict change conflicts.
    scenarios:
      roadmap-planned-change-conflicts-are-defined:
        - GIVEN: strict roadmap planned change data is represented across inline milestone entries and standalone planned-change artifacts
        - WHEN: the roadmap validation contract is reviewed
        - THEN: duplicate planned change identities, missing milestone references, invalid dependency references, ambiguous advisory ownership metadata, and active strict change conflicts are identifiable as deterministic validation conditions
  strict-roadmap-skill-split-planned-change-handoff:
    strength: MUST
    statement: 'The system MUST ensure strict roadmap recommend and propose skill guidance describes split-file planned-change handoff: read standalone planned-change artifacts when present, preserve inline compatibility, keep roadmap artifacts canonical for planning metadata, and copy only targeted guidance into strict change artifacts.'
    scenarios:
      roadmap-skills-describe-split-file-handoff:
        - GIVEN: strict roadmap skill guidance is reviewed for recommendation or proposal handoff
        - WHEN: the guidance describes how to choose and scaffold roadmap-backed work
        - THEN: it identifies standalone planned-change artifacts as supported split-file sources while preserving inline compatibility and canonical roadmap ownership of planning metadata
  yaml-planned-change-team-metadata-contract:
    strength: MUST
    statement: The system MUST define optional structured team metadata for standalone planned-change artifacts, including advisory owner, reviewers, blocked state, labels, and external references without making those fields required.
    scenarios:
      planned-change-team-metadata-fields-are-structured:
        - GIVEN: a standalone planned-change artifact is reviewed
        - WHEN: its optional team metadata is inspected
        - THEN: owner, reviewers, blocked state, labels, and external references are represented as structured fields when present
  roadmap-guidance-documents-conflict-resistant-team-workflow:
    strength: MUST
    statement: The system MUST document a conflict-resistant team roadmap workflow that presents standalone planned-change files as the preferred collaboration surface, keeps milestone files and INDEX.yaml as deliberate low-churn coordination artifacts, and treats inline planned_changes only as compatibility or migration context.
    scenarios:
      roadmap-guidance-prefers-split-file-collaboration:
        - GIVEN: a self-hosted repository's roadmap guidance is reviewed
        - WHEN: its recommended team collaboration workflow is inspected
        - THEN: standalone planned-change files are presented as the default work-item surface
        - AND: milestone files and INDEX.yaml are described as lower-churn shared roadmap context
        - AND: inline milestone planned_changes are described only as compatibility or migration context
  roadmap-guidance-explains-merge-recovery-and-optional-external-tracker-context:
    strength: MUST
    statement: The system MUST document team-roadmap recovery guidance that tells contributors to rerun roadmap-sync after merges or archive handoff and describes external tracker references as optional context rather than the required roadmap source of truth.
    scenarios:
      roadmap-guidance-covers-merge-recovery-and-external-tracker-boundaries:
        - GIVEN: the conflict-resistant team roadmap guidance is reviewed
        - WHEN: its merge recovery and coordination guidance is inspected
        - THEN: contributors are told to rerun roadmap-sync after merges or after archiving roadmap-backed work
        - AND: planned-change completion remains derived from strict workflow state rather than hand-edited roadmap status
        - AND: external tracker references are described as optional supporting metadata rather than required authority
  yaml-delta-added-collision-rules:
    strength: MUST
    statement: The system MUST define deterministic merge conflict behavior for strict YAML delta ADDED entries whose keyed-map requirement identifier already exists in the target main spec at archive time.
    scenarios:
      added-entry-targeting-existing-requirement-is-a-conflict:
        - GIVEN: a strict YAML delta spec contains an ADDED entry keyed by a requirement identifier that already exists in the target main spec
        - WHEN: the delta merge rules are applied during validation or archive processing
        - THEN: the ADDED entry is treated as a merge conflict instead of overwriting the existing main-spec requirement
        - AND: the conflict outcome is reported through deterministic diagnostics or archive failure output
  strict-skills-prefer-scripted-deterministic-workflow:
    strength: MUST
    statement: The system MUST ensure strict skill prompts prefer deterministic CLI behavior over prompt-only procedural instructions whenever the operation is filesystem mechanics, schema validation, artifact serialization, duplicate detection, state reporting, or safe structured artifact updates.
    scenarios:
      skills-reference-scripted-deterministic-operations:
        - GIVEN: a strict skill prompt describes a workflow step that has an implemented deterministic CLI equivalent
        - WHEN: strict skill content validation or human review inspects the prompt
        - THEN: the prompt references the concrete strict CLI command for that operation
        - AND: the prompt does not ask the agent to reproduce the CLI-owned mechanics manually
  strict-skills-preserve-human-judgment-checkpoints:
    strength: MUST
    statement: The system MUST ensure strict skill prompts preserve human or agent judgment checkpoints for intent discovery, scope selection, tradeoff evaluation, unresolved question answers, and irreversible workflow handoffs even when deterministic CLI helpers exist.
    scenarios:
      scripted-helpers-do-not-remove-confirmation-boundaries:
        - GIVEN: a strict skill prompt uses deterministic CLI helpers during planning or lifecycle work
        - WHEN: the prompt reaches a step that changes scope, answers an open question, scaffolds a brainstormed change, archives a change, or hands off git push
        - THEN: the prompt requires the appropriate explicit user or operator checkpoint
        - AND: the CLI helper is treated as a mechanics tool rather than the source of the judgment decision
  non-init-strict-skills-require-existing-workflow-state:
    strength: MUST
    statement: The system MUST require every strict skill except strict-spec-init to run the scripted check-workflow-state command before any other workflow step, and when .strict-spec-driven/ is missing the skill MUST stop and direct the user to run /strict-spec-init instead of invoking init itself.
    scenarios:
      missing-workflow-state-blocks-non-init-skills:
        - GIVEN: a strict non-init skill that operates on .strict-spec-driven/ workflow state is reviewed
        - WHEN: its prerequisites, command mapping, and first workflow step are inspected
        - THEN: the skill exposes the check-workflow-state command in its command mapping, requires running it before any other workflow work, stops with guidance to run /strict-spec-init when the directory is missing, and does not tell the agent to run the bundled init command as a fallback
      only-init-is-exempt:
        - GIVEN: the bundled skill set is inspected for skills exempt from the check-workflow-state precondition
        - WHEN: strict skill content validation runs
        - THEN: strict-spec-init is the only exempt package, because the strict-spec-migrate skill that previously required the exemption for a repository without strict workflow state is no longer packaged
  strict-review-skills-require-code-review-evidence:
    strength: MUST
    statement: The strict review and automatic workflow skills MUST require direct code review evidence before archive recommendation or execution, including changed implementation and test file review plus a concrete review checklist. A skill MAY satisfy this by stating the requirement itself or by declaring a checked delegation to the skill that owns the review procedure; the obligation that direct code review evidence is produced before archive is unaffected by which form is used.
    scenarios:
      auto-delegating-review-still-requires-code-review-evidence:
        - GIVEN: the automatic workflow skill delegates the review procedure to the skill that owns it rather than restating it
        - WHEN: the automatic workflow reaches the archive decision
        - THEN: direct code review evidence is still required before archive, and the delegation is resolved by the delegation-target check
      review-skill-cannot-delegate-code-review-to-cli:
        - GIVEN: a strict change is being reviewed by strict-spec-review or strict-spec-auto
        - WHEN: the review step reaches archive recommendation or execution
        - THEN: the skill has read changed implementation and test files directly
      review-report-includes-evidence-and-categories:
        - GIVEN: a strict review skill reports review results
        - WHEN: the final review report is inspected
        - THEN: the report identifies reviewed files and executed validation or regression commands
      auto-review-blocks-archive-without-code-review:
        - GIVEN: strict-spec-auto is preparing to archive a completed change
        - WHEN: direct code review evidence has not been gathered
        - THEN: the skill blocks archive instead of inferring review success from deterministic validation
  strict-roadmap-scripted-selection:
    strength: MUST
    statement: The strict-roadmap-recommend skill MUST obtain the planned-change recommendation from the scripted roadmap-recommend command before scaffolding a strict change, and when a user provides a roadmap hint it MUST resolve exact milestone ids or unambiguous numeric milestone-prefix shorthand to an exact milestone id before passing it to roadmap-recommend with --milestone.
    scenarios:
      skill-resolves-fuzzy-milestone-hint:
        - GIVEN: a user invokes the roadmap-backed recommendation skill with a milestone hint such as an exact milestone id or a standalone number
        - WHEN: the skill obtains the scripted recommendation
        - THEN: the skill resolves the hint to exactly one milestone id, runs roadmap-recommend --milestone with the resolved id, treats the returned recommendation as authoritative, and stops with a clear blocker if the hint matches no milestone or several instead of manually selecting a planned change
  strict-roadmap-plan-detail-and-review-guidance:
    strength: MUST
    statement: The system MUST ensure strict-roadmap-plan skill guidance requires agents to elaborate roadmap milestones and standalone planned changes into executable, reviewable planning detail and to perform a roadmap planning review after roadmap synchronization before handoff.
    scenarios:
      roadmap-plan-skill-elaborates-roadmap-detail:
        - GIVEN: a user asks the strict-roadmap-plan skill to create or restructure the roadmap
        - WHEN: the skill workflow reaches roadmap YAML editing
        - THEN: the prompt requires the agent to refine milestone goal, scope, done criteria, dependencies, risks, notes, details, and standalone planned-change summary, details, dependencies, and status into actionable planning content
      roadmap-plan-skill-reviews-before-handoff:
        - GIVEN: the strict-roadmap-plan skill has edited roadmap artifacts and run roadmap-sync
        - WHEN: the skill reaches final handoff
        - THEN: the prompt requires a roadmap planning review for placeholders, overbroad milestones, unclear dependencies, unverifiable done criteria, weak planned-change detail, and current roadmap diagnostics before reporting completion
  skill-check-workflow-state-command-references:
    strength: MUST
    statement: Skill command reference blocks and strict skill packaging validation MUST require the check-workflow-state command as a full node invocation so agents can execute it directly before workflow work.
    scenarios:
      check-workflow-state-reference-is-copyable:
        - GIVEN: a bundled strict workflow skill documents a check-workflow-state command reference
        - WHEN: an agent reads that command reference before starting workflow work
        - THEN: the command text includes the full node {{SKILL_DIR}}/scripts/strict-spec-driven.js check-workflow-state invocation
      check-workflow-state-validation-expects-full-command:
        - GIVEN: skill packaging validation checks strict workflow precheck guidance
        - WHEN: the precheck snippet is validated for a non-init strict skill
        - THEN: the expected snippet includes the full node {{SKILL_DIR}}/scripts/strict-spec-driven.js check-workflow-state invocation
  yaml-harness-artifact-contract:
    strength: MUST
    statement: The system MUST define strict YAML harness declaration and harness session contracts that replace dev-session and debug-session artifacts with one script-managed model for environments, mixed components, explicit operation capabilities, lifecycle safety, evidence, human checkpoints, replay, and verification, without requiring backward-compatible dev-session or debug-session artifact migration.
    scenarios:
      harness-contract-models-mixed-environments:
        - GIVEN: a strict project needs to describe development and production operation for frontend, backend, database, cache, worker, external resource, browser, Electron, or CDP components
        - WHEN: the harness declaration and harness session contracts are reviewed
        - THEN: the contracts expose structured fields for environments, components, dependencies, operation modes, lifecycle scripts, readiness, status, logs, safety policy, secret-safe environment variable names, evidence, human checkpoints, replay, and verification
  yaml-harness-status-logs-are-descriptive:
    strength: MUST
    statement: The system MUST let harness declarations treat operations.status and operations.logs as optional descriptive metadata, keep readonly as a valid never-executed marker, and document that status comes from runtime state while logs come from the captured runtime log file.
    scenarios:
      optional-status-logs-remain-valid:
        - GIVEN: a strict harness declaration omits operations.status and operations.logs or keeps readonly markers without script commands
        - WHEN: the declaration schema, bundled example, and harness contract guidance are validated
        - THEN: the artifact remains valid and the contract describes status as runtime-derived and logs as captured-file output rather than executable lifecycle commands
  proposal-generating-skills-run-proposal-checkpoint:
    strength: MUST
    statement: Proposal-generating and proposal-handoff skills MUST guide agents to run a proposal checkpoint over generated planning artifacts after population and before ready/verify validation, ready handoff, auto implementation, or handoff to another strict workflow skill so semantic quality issues and insufficient change-document detail are corrected without naming the planning-stage gate a review.
    scenarios:
      proposal-checkpoint-requires-decision-ready-detail:
        - GIVEN: strict-spec-brainstorm, strict-spec-propose, a strict roadmap handoff skill, or the creation path of strict-spec-auto has populated proposal, design, task, question, and delta artifacts for a change
        - WHEN: the skill workflow proceeds toward proposal handoff, ready validation, verify validation, auto implementation, or another strict workflow skill
        - THEN: the skill requires a proposal checkpoint over generated artifacts against the confirmed request or brainstorm summary, relevant main specs, technical standards, and project constraints before that handoff
        - THEN: the checkpoint criteria require decision-ready detail in scope, unchanged behavior, design decisions, task coverage, unresolved-question impact, delta spec scenarios, and delta tech use when applicable
        - THEN: the checkpoint criteria name no file-mapping field, because the spec and technical-standard mapping fields have been removed from the artifact model
        - THEN: the checkpoint guidance tells agents to fix safe, in-scope documentation gaps without expanding scope or answering unresolved human questions
        - THEN: unresolved ambiguity remains recorded in questions.yaml with enough context and impact to block implementation deliberately
  yaml-tech-artifact-schema-coverage:
    strength: MUST
    statement: The system MUST define strict YAML schemas for technical standards (main_tech), delta tech standards (delta_tech), and tech standard indexes (tech_index).
    scenarios:
      tech-artifact-families-are-covered:
        - GIVEN: the strict workflow artifact contract is reviewed
        - WHEN: the technical-standard artifact families are checked
        - THEN: main_tech, delta_tech, and tech_index each have a registered strict YAML schema definition and a minimal valid example
  yaml-tech-standard-rule-model:
    strength: MUST
    statement: The system MUST represent each strict YAML technical standard rule with a stable identifier, an RFC 2119 strength enum, an enforceable statement, a rationale, and an enforcement contract with a method enum, plus optional examples and exceptions.
    scenarios:
      tech-rule-fields-are-structured:
        - GIVEN: a strict YAML technical standard rule is reviewed
        - WHEN: its rule data is inspected
        - THEN: the strength, statement, rationale, and enforcement method are available as structured fields and examples and exceptions are optional structured fields
  yaml-delta-tech-operation-model:
    strength: MUST
    statement: The system MUST represent strict YAML delta tech operations as ADDED, MODIFIED, and REMOVED maps keyed by rule identifier that target a named standard, where REMOVED entries carry a reason.
    scenarios:
      delta-tech-operations-are-structured:
        - GIVEN: a strict YAML delta tech artifact is reviewed
        - WHEN: its operations are inspected
        - THEN: the target standard, the ADDED, MODIFIED, and REMOVED rule maps, and each REMOVED reason are available as structured fields
  yaml-delta-tech-archive-merge:
    strength: MUST
    statement: The system MUST merge a change's delta tech operations into the targeted standard on archive and regenerate the tech index, applying the same active-target exclusivity, added-existing-target, modified-missing-target, and removed-missing-target rules used for delta specs.
    scenarios:
      delta-tech-merges-on-archive:
        - GIVEN: an active change contains delta tech operations targeting a standard
        - WHEN: the change is archived
        - THEN: the targeted standard rules reflect the ADDED, MODIFIED, and REMOVED operations and the tech index is regenerated from the merged state
  yaml-delta-tech-new-standard-creation:
    strength: MUST
    statement: The system MUST create a new technical standard on archive when a delta tech artifact targets a standard identifier that does not yet exist and supplies a standard block with title and category.
    scenarios:
      delta-tech-creates-new-standard:
        - GIVEN: a delta tech artifact targets a missing standard id and supplies a standard block with title and category
        - WHEN: the change is archived
        - THEN: a new strict YAML technical standard file is created from the standard block, mapping, and ADDED rules and is listed in the tech index
  tech-standards-consulted-in-lifecycle:
    strength: SHOULD
    statement: The change workflow SHOULD consult applicable technical standards during proposal, implementation, and review so that standard changes flow through delta tech rather than out-of-band edits.
    scenarios:
      lifecycle-consults-tech-standards:
        - GIVEN: a strict change is proposed, implemented, and reviewed
        - WHEN: applicable technical standards exist
        - THEN: the workflow treats applicable MUST rules as binding and SHOULD rules as defaults and carries any standard change as a delta tech artifact
  ui-classification-policy:
    strength: SHOULD
    statement: User-observable UI behavior SHOULD be recorded as main spec requirements, UI engineering and design rules SHOULD be recorded as technical standards in the ui category, and pixel-level visual fidelity SHOULD be governed by visual-regression snapshots referenced from mappings rather than inlined into YAML artifacts.
    scenarios:
      ui-work-is-classified:
        - GIVEN: a change includes user interface work
        - WHEN: its strict artifacts are authored
        - THEN: user-observable UI behavior is recorded as main spec requirements
        - AND: UI engineering and design rules are recorded as ui-category technical standards
  yaml-tech-category-includes-ui:
    strength: MUST
    statement: The strict YAML technical standard and delta tech schemas MUST accept a ui category for standards that govern user interface engineering and design rules.
    scenarios:
      ui-category-is-accepted:
        - GIVEN: a technical standard or delta tech artifact declares the ui category
        - WHEN: it is validated against its schema
        - THEN: the ui category is accepted as a valid standard category
  serializer-does-not-fold-long-scalars:
    strength: MUST
    statement: The shared strict YAML serializer MUST NOT fold long scalar values across multiple physical lines; each serialized scalar MUST remain on a single line regardless of length.
    scenarios:
      long-scalar-serializes-on-one-line:
        - GIVEN: a strict artifact value whose scalar field is longer than a conventional line-wrap width
        - WHEN: the value is serialized through the shared stringifyYamlDocument writer
        - THEN: the emitted scalar appears on a single physical line with no folded continuation lines
  yaml-schema-file-paths-resolve-in-shared-cache:
    strength: MUST
    statement: The system MUST export bundled strict schema assets into ~/.strict-spec-schemas/ using path segments that preserve each strict YAML artifact's schema_file-relative schema location, so a schema_file value can be resolved against the shared cache root without requiring per-project template directories.
    scenarios:
      shared-cache-mirrors-schema-file-layout:
        - GIVEN: a strict YAML artifact declares a schema_file under templates/strict-spec-driven/schemas/
        - WHEN: the shared schema cache has been synchronized
        - THEN: the corresponding schema file exists under ~/.strict-spec-schemas/ at the same relative schema_file path
      shared-cache-keeps-schema-registry-discoverable:
        - GIVEN: an agent or tool needs to discover supported strict workflow schemas from the shared cache
        - WHEN: it inspects ~/.strict-spec-schemas/
        - THEN: the shared cache includes the exported schema registry and enough metadata to enumerate the exported schema files
  yaml-delta-new-spec-creation:
    strength: MUST
    statement: The system MUST create a new strict YAML main spec on archive when a delta spec targets a spec identifier that does not match any existing main spec and supplies an explicit new-spec block with a title and a repo-relative target path under the specs directory; when the target spec identifier is missing and no new-spec block is supplied, archive MUST still fail with the existing missing-target error.
    scenarios:
      delta-creates-new-main-spec:
        - GIVEN: a delta spec targets a spec id that matches no existing main spec and supplies a new-spec block with a title and a repo-relative target path under the specs directory, with ADDED requirements and empty MODIFIED and REMOVED maps
        - WHEN: the change is archived
        - THEN: a new strict YAML main spec file is created at the target path from the target spec id, the block title, the delta mapping, and the ADDED requirements
        - AND: the created spec is listed in the regenerated spec index
      missing-target-without-new-spec-block-still-fails:
        - GIVEN: a delta spec targets a spec id that matches no existing main spec and supplies no new-spec block
        - WHEN: the change is archived
        - THEN: archive fails with the existing missing-target main spec error rather than creating a spec
      new-spec-block-with-modified-or-removed-is-rejected:
        - GIVEN: a delta spec supplies a new-spec block but its MODIFIED or REMOVED operation map is non-empty
        - WHEN: verify is run against the change
        - THEN: the non-empty modify or remove operation on a new-spec delta is reported as a deterministic validation failure
      new-spec-block-colliding-with-existing-spec-is-rejected:
        - GIVEN: a delta spec supplies a new-spec block whose target spec id or target path matches an existing main spec
        - WHEN: verify is run against the change
        - THEN: the colliding new-spec id or path is reported as a deterministic validation failure before archive writes any file
  yaml-sample-assets-shared-cache-export:
    strength: MUST
    statement: The system MUST export bundled strict YAML sample assets into the shared cache using path segments that preserve each sample asset's repository-relative location, so schema example references and agent sample lookups can resolve without requiring per-skill examples directories.
    scenarios:
      shared-cache-contains-sample-assets:
        - GIVEN: bundled strict YAML sample assets exist under examples/strict-spec-driven/
        - WHEN: the shared cache has been synchronized
        - THEN: the corresponding sample files exist under the shared cache at their preserved repository-relative paths
        - AND: the shared cache manifest includes the exported sample file paths
      sample-cache-refreshes-on-sample-change:
        - GIVEN: a cached sample file is missing or differs from the bundled sample asset
        - WHEN: the shared cache synchronizes
        - THEN: the process refreshes the exported sample files from bundled assets
  yaml-sample-assets-schema-association:
    strength: MUST
    statement: The system MUST keep bundled strict YAML sample assets associated with their demonstrated schemas through structured schema example references, coverage example references, or schema registry primary example paths.
    scenarios:
      sample-association-is-machine-readable:
        - GIVEN: a strict YAML schema, schema registry entry, or sample asset is reviewed
        - WHEN: its sample relationship is inspected
        - THEN: the primary or coverage sample path is available through structured YAML data or repository-defined sample organization
        - AND: the referenced sample is parseable as YAML and identifies the schema or artifact type it demonstrates
  proposal-skills-change-intake-question-gate:
    strength: MUST
    statement: Proposal-oriented skill guidance MUST run a required evidence-backed change-intake pass before implementation or proposal handoff, answer recoverable checklist items from project evidence, write missing required answers to questions.yaml.open with stable language-neutral ids and preferred_human_language human-facing text, stop while open questions remain, and resolve answered items into questions.yaml.resolved before implementation continues.
    scenarios:
      proposal-skills-answer-before-asking:
        - GIVEN: a standalone, automatic, bugfix, or brainstorm proposal skill has enough request or repository evidence to answer a required intake checklist item
        - WHEN: the skill prepares proposal artifacts or implementation handoff
        - THEN: the guidance tells the agent to use the evidence instead of asking the human for that item
      proposal-skills-block-on-open-questions:
        - GIVEN: a required intake checklist answer remains absent after focused discovery
        - WHEN: the skill records the missing answer
        - THEN: the guidance tells the agent to write it to questions.yaml.open with context, impact, and a recommendation or options, and to stop before implementation until it is resolved
  roadmap-backed-intake-question-gate:
    strength: MUST
    statement: Roadmap-backed proposal guidance MUST treat selected standalone planned-change summary, details, dependencies, labels, and milestone details as valid change-intake evidence, carry answered checklist items into generated proposal artifacts instead of re-asking, create preferred_human_language questions.yaml.open blockers when affected scope, spec delta, implementation, test, dependency, or technical-standard impact remains unknown, and preserve existing roadmap selection and mutation boundaries.
    scenarios:
      complete-roadmap-detail-avoids-open-questions:
        - GIVEN: a roadmap-backed planned change includes enough summary, details, dependency, label, milestone, spec, code, and test evidence to answer the intake checklist
        - WHEN: a roadmap-backed proposal skill creates strict change artifacts
        - THEN: the guidance carries that evidence into proposal, design, task, question, and delta artifacts without re-asking the human
      thin-roadmap-detail-creates-blocking-questions:
        - GIVEN: a roadmap-backed item lacks implementation, test, spec, dependency, or technical-standard impact after focused discovery
        - WHEN: the proposal handoff reaches the question gate
        - THEN: the guidance writes questions.yaml.open entries whose impact identifies the affected proposal scope, spec delta, implementation files, tests, dependencies, or technical standards before implementation
  yaml-lesson-artifact-model:
    strength: MUST
    statement: The system MUST define a strict YAML lesson artifact with structured schema identity, a stable lesson identifier and human-readable title, a category constrained to the same category set as technical standards, the context, observation, takeaway, and applies_when content fields, a structured occurrences collection whose entries each carry an origin, a date, and evidence, a status constrained to active, promoted, or obsolete, and the conditional promoted_to, obsoleted_reason, and obsoleted_at fields required by the promoted and obsolete statuses.
    scenarios:
      lesson-fields-are-structured:
        - GIVEN: a strict YAML lesson artifact is reviewed
        - WHEN: its lesson data is inspected
        - THEN: the lesson identifier, title, category, status, and each content field are available as structured fields, and the occurrences collection is available as a structured list rather than free-text prose
      lesson-status-values-are-constrained:
        - GIVEN: a strict YAML lesson artifact is validated
        - WHEN: the lesson status is checked
        - THEN: only active, promoted, and obsolete are accepted and any other value is reported as a deterministic validation failure
      lesson-carries-no-requirement-strength:
        - GIVEN: a strict YAML lesson artifact is validated
        - WHEN: the artifact is checked against the lesson schema
        - THEN: the schema defines no RFC 2119 strength field and no enforcement mapping, keeping lessons distinct from the technical standards that carry binding rules
  yaml-lesson-index-model:
    strength: MUST
    statement: The system MUST define a strict YAML lessons index that lists every lesson by identifier, title, category, status, and repo-relative path so lessons are discoverable without reading each lesson file, and MUST register the lesson and lessons-index schemas in the schema registry with current compatibility status.
    scenarios:
      lessons-index-lists-every-lesson:
        - GIVEN: several lesson artifacts exist
        - WHEN: the lessons index is inspected
        - THEN: each lesson appears with its identifier, title, category, status, and repo-relative path in a deterministic order
      lesson-schemas-are-registered:
        - GIVEN: the schema registry is inspected
        - WHEN: the lesson and lessons-index entries are checked
        - THEN: both entries are present with current compatibility status and resolvable primary example references
  yaml-lesson-minimal-example:
    strength: MUST
    statement: The system MUST provide a minimal valid YAML lesson example that includes schema identity, stable lesson identity, title, category, every required content field, one occurrence entry, and active status.
    scenarios:
      lesson-example-validates-against-its-schema:
        - GIVEN: the bundled minimal lesson example is present
        - WHEN: the example is validated against the registered lesson schema
        - THEN: validation succeeds and every required lesson field is present
  question-list-requirement-entry-fields:
    strength: MUST
    statement: The system MUST allow every strict question-list entry to carry an optional kind field constrained to requirement or technical and an optional answered_by field constrained to human, roadmap, or assumption, MUST treat an entry without kind as technical, and MUST keep question-list artifacts that omit both fields schema-valid.
    scenarios:
      requirement-entry-accepts-kind-and-attribution:
        - GIVEN: a strict question-list artifact whose resolved entry declares kind requirement and answered_by human
        - WHEN: the artifact is validated against the question-list schema
        - THEN: validation succeeds and both fields are preserved on the entry
      legacy-entries-without-new-fields-stay-valid:
        - GIVEN: a strict question-list artifact whose entries declare only id, question, context, status, and answer
        - WHEN: the artifact is validated against the question-list schema
        - THEN: validation succeeds and every entry is treated as kind technical
      rejects-unknown-kind-or-attribution-values:
        - GIVEN: a strict question-list entry whose kind or answered_by carries a value outside the permitted sets
        - WHEN: the artifact is validated against the question-list schema
        - THEN: validation fails with a diagnostic naming the offending field and its permitted values
  proposal-skills-requirement-interrogation-pass:
    strength: MUST
    statement: Proposal-oriented skill guidance MUST run a requirement-interrogation pass before the change-intake checklist on every path that starts from a human request, MUST answer requirement-kind items only from the active human request or replayed roadmap planned-change detail and never from repository evidence, MUST explain why each question matters and what a sufficient answer contains before posing it rather than assuming the requester knows how to answer, MUST explain the reason when an answer cannot be used yet instead of silently re-asking, and MUST record each canonical requirement answer in questions.yaml with its answered_by attribution before implementation continues.
    scenarios:
      requirement-items-are-never-answered-from-code:
        - GIVEN: a proposal-oriented skill has repository evidence that suggests a plausible answer to a canonical requirement question
        - WHEN: the skill performs the requirement-interrogation pass
        - THEN: the skill asks the human rather than resolving the item from repository evidence, because code shows what the system does and not what a person wants
      questions-are-explained-before-they-are-asked:
        - GIVEN: a requester who has not used the strict workflow and does not know what distinguishes a problem from a solution or what an observable outcome is
        - WHEN: the skill poses a canonical requirement question
        - THEN: the question is accompanied by why it is asked, what a sufficient answer contains, a concrete worked example, and what the answer will change, with any workflow vocabulary defined in plain terms
      pushback-states-its-reason:
        - GIVEN: a requester answers a canonical requirement question with a restated solution or an answer too thin to use
        - WHEN: the skill declines to record that answer
        - THEN: the skill names why the answer cannot be used yet and supplies the missing criterion rather than repeating the same question unchanged
      roadmap-detail-may-answer-requirement-items:
        - GIVEN: a roadmap-backed proposal whose planned change and milestone detail already state the problem, outcome, trigger, non-goals, and intended reading
        - WHEN: the skill performs the requirement-interrogation pass
        - THEN: the skill resolves the canonical requirement questions with answered_by roadmap and does not re-ask the human
      auto-stops-once-at-the-interrogation-checkpoint:
        - GIVEN: strict-spec-auto is started from a human request whose canonical requirement questions are unanswered
        - WHEN: the automatic workflow reaches the requirement-interrogation checkpoint
        - THEN: the workflow stops for human answers before proposing and resumes unattended through archive once the canonical requirement questions are resolved

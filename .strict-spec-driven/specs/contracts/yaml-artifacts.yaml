requirements:
  yaml-artifact-schema-coverage:
    strength: MUST
    statement: The system MUST define strict YAML schemas for main specs, delta specs, change proposals, change designs, task lists, question lists, spec indexes, roadmap indexes, and roadmap milestones.
    scenarios:
      required-artifact-families-are-covered:
        - GIVEN: the strict workflow artifact contract is reviewed
        - WHEN: each required artifact family is checked
        - THEN: every required artifact family has a YAML schema definition
  yaml-schema-field-contracts:
    strength: MUST
    statement: The system MUST define required fields, optional fields, enum values, relationship fields, stable identifiers, uniqueness scopes, matching rules, and minimal valid examples for each strict YAML artifact schema.
    scenarios:
      schema-fields-are-reviewable:
        - GIVEN: a strict YAML artifact schema
        - WHEN: a human or script reviews the schema contract
        - THEN: the required fields, optional fields, enum values, relationships, stable identifiers, and minimal valid example are identifiable without relying on unstated convention
  yaml-schema-example-coverage:
    strength: MUST
    statement: The system MUST provide at least one minimal valid YAML example for each required artifact family.
    scenarios:
      artifact-examples-cover-the-contract:
        - GIVEN: strict YAML artifact schema examples are reviewed
        - WHEN: the required artifact families are compared with the available examples
        - THEN: main specs, delta specs, change proposals, change designs, task lists, question lists, spec indexes, roadmap indexes, roadmap milestones, and planned change entries each have at least one minimal valid YAML example
  yaml-main-spec-file-model:
    strength: MUST
    statement: The system MUST define strict YAML main spec files as YAML documents with structured schema identity, stable spec identity, human-readable title, file-level mappings, and requirement collections.
    scenarios:
      main-spec-top-level-fields-are-structured:
        - GIVEN: a strict YAML main spec file is reviewed
        - WHEN: its top-level data is inspected
        - THEN: the schema identity is available as a structured field
        - AND: the stable spec identifier is available as a structured field
        - AND: the human-readable title is available as a structured field
        - AND: implementation and test mappings are available as structured file-level fields
        - AND: requirements are available as a structured collection
  yaml-main-spec-requirement-model:
    strength: MUST
    statement: The system MUST represent each strict YAML main spec requirement with a stable identifier, RFC 2119 strength enum, observable behavior statement, and zero or more structured scenarios.
    scenarios:
      main-spec-requirement-fields-are-structured:
        - GIVEN: a strict YAML main spec requirement is reviewed
        - WHEN: its requirement data is inspected
        - THEN: the requirement identifier is available as a structured field
        - AND: the RFC 2119 strength is available as a structured field with a valid MUST, SHOULD, or MAY value
        - AND: the observable behavior statement is available as a structured field
        - AND: scenarios are available as a structured collection
      requirement-strength-values-are-constrained:
        - GIVEN: a strict YAML main spec requirement is validated
        - WHEN: the requirement strength is checked
        - THEN: MUST, SHOULD, and MAY are accepted values
        - AND: other strength values can be reported as deterministic validation failures
  yaml-scenario-step-model:
    strength: MUST
    statement: The system MUST represent strict YAML scenarios with stable scenario identifiers and ordered structured step entries that preserve GIVEN, WHEN, THEN, and AND semantics without relying on Markdown bullet formatting.
    scenarios:
      scenario-steps-are-machine-readable:
        - GIVEN: a strict YAML scenario is reviewed
        - WHEN: its steps are inspected
        - THEN: the scenario identifier is available as a structured field
        - AND: each step has a structured step kind with a valid GIVEN, WHEN, THEN, or AND value
        - AND: each step has structured step text
        - AND: the step order is preserved
  yaml-requirement-and-scenario-identifiers:
    strength: MUST
    statement: The system MUST require stable identifiers for strict YAML specs, requirements, and scenarios that can be validated for uniqueness within their owning scope.
    scenarios:
      spec-identifiers-are-stable:
        - GIVEN: a strict YAML main spec file is renamed or moved
        - WHEN: archive or validation behavior matches the spec to known workflow state
        - THEN: the stable spec identifier remains available without deriving identity from the file path alone
      duplicate-requirement-identifiers-can-be-rejected:
        - GIVEN: a strict YAML spec file repeats a requirement identifier
        - WHEN: validation is run against the spec and delta model
        - THEN: the duplicate requirement identifier can be reported as a deterministic validation failure
      duplicate-scenario-identifiers-can-be-rejected:
        - GIVEN: a strict YAML requirement repeats a scenario identifier within that requirement
        - WHEN: validation is run against the spec and delta model
        - THEN: the duplicate scenario identifier can be reported as a deterministic validation failure
  yaml-spec-file-mapping-model:
    strength: MUST
    statement: The system MUST represent implementation and test mappings for strict YAML spec files as structured file-level fields containing normalized repo-relative file path collections.
    scenarios:
      mappings-stay-outside-requirement-prose:
        - GIVEN: a strict YAML spec file is reviewed
        - WHEN: implementation and test mappings are inspected
        - THEN: the mappings are available in structured file-level fields
        - AND: the mappings are not embedded in requirement or scenario prose
      mapping-paths-are-repo-relative:
        - GIVEN: a strict YAML spec mapping is validated
        - WHEN: each implementation or test path is checked
        - THEN: normalized repo-relative paths are accepted
        - AND: absolute paths or parent-directory traversal paths can be reported as deterministic validation failures
  yaml-main-spec-minimal-example:
    strength: MUST
    statement: The system MUST provide a minimal valid YAML main spec example that includes schema identity, stable spec identity, title, mapping fields, one requirement, one scenario, and ordered scenario steps.
    scenarios:
      main-spec-example-is-complete-enough-to-validate:
        - GIVEN: the strict YAML main spec contract is reviewed
        - WHEN: its minimal valid example is inspected
        - THEN: every required top-level main spec field is present
        - AND: every required requirement field is present
        - AND: every required scenario field is present
      main-spec-example-demonstrates-enum-and-mapping-values:
        - GIVEN: the strict YAML main spec example is inspected
        - WHEN: requirement strength, scenario step kinds, and mapping fields are reviewed
        - THEN: the example demonstrates a valid MUST, SHOULD, or MAY requirement strength
        - AND: the example demonstrates valid GIVEN, WHEN, THEN, and optional AND step kinds
        - AND: the example demonstrates implementation and test mapping fields as repo-relative path collections
  yaml-delta-operation-model:
    strength: MUST
    statement: The system MUST represent strict YAML delta specs with structured schema identity, target spec identity, and explicit ADDED, MODIFIED, and REMOVED operation keyed-map collections where the map key is the requirement identifier.
    scenarios:
      delta-operation-groups-are-structured:
        - GIVEN: a strict YAML delta spec is reviewed
        - WHEN: the requested spec changes are inspected
        - THEN: the schema identity is available as a structured field
        - AND: the target spec identity is available as a structured field
        - AND: added requirements are available through a structured ADDED keyed map
        - AND: modified requirements are available through a structured MODIFIED keyed map
        - AND: removed requirements are available through a structured REMOVED keyed map
      delta-operation-entries-use-keyed-map-identity:
        - GIVEN: a strict YAML delta spec ADDED or MODIFIED operation is reviewed
        - WHEN: the operation entry is inspected
        - THEN: the entry key is the stable requirement identifier
        - AND: no separate id field exists within the entry value
      empty-operation-groups-remain-explicit:
        - GIVEN: a strict YAML delta spec has no entries for one operation kind
        - WHEN: the operation groups are inspected
        - THEN: the empty operation kind remains identifiable as an empty keyed map without relying on an omitted Markdown heading
  yaml-delta-stable-matching:
    strength: MUST
    statement: The system MUST require strict YAML delta modifications and removals to target existing requirements by stable requirement identifier, using keyed-map keys as identifiers.
    scenarios:
      added-requirements-carry-stable-identifiers:
        - GIVEN: a strict YAML delta spec adds a requirement
        - WHEN: the added requirement is inspected
        - THEN: the keyed-map key is the stable requirement identifier
        - AND: the keyed-map value includes the same requirement fields required by a main spec requirement except the id field
      modified-requirements-target-stable-identifiers:
        - GIVEN: a strict YAML delta spec modifies a requirement
        - WHEN: the modification target is inspected
        - THEN: the keyed-map key identifies the target existing requirement by stable identifier
        - AND: the replacement requirement data is available as the keyed-map value
      removed-requirements-target-stable-identifiers:
        - GIVEN: a strict YAML delta spec removes a requirement
        - WHEN: the removal target is inspected
        - THEN: the keyed-map key identifies the target existing requirement by stable identifier
  yaml-delta-merge-conflict-rules:
    strength: MUST
    statement: The system MUST define deterministic merge conflict rules for archive behavior so that delta merge outcomes are predictable without manual resolution.
    scenarios:
      exclusive-active-target-is-enforced-at-verify-time:
        - GIVEN: two active changes each have a delta whose MODIFIED or REMOVED keyed map contains the same requirement ID as a key
        - WHEN: verify is run against either active change
        - THEN: the duplicate active target is reported as a deterministic validation failure
        - AND: archive is blocked until the conflict is resolved
      modified-entry-with-missing-target-is-treated-as-added:
        - GIVEN: a MODIFIED delta keyed-map entry has a key that does not match any requirement ID in the main spec at archive time
        - WHEN: archive merge is executed
        - THEN: the entry is treated as ADDED in the merge output
        - AND: the outcome is recorded in the archive merge report
      removed-entry-with-missing-target-is-skipped:
        - GIVEN: a REMOVED delta keyed-map entry has a key that does not match any requirement ID in the main spec at archive time
        - WHEN: archive merge is executed
        - THEN: the entry is silently skipped
        - AND: the skipped removal is recorded in the archive merge report
  yaml-delta-removal-reason:
    strength: MUST
    statement: The system MUST require each strict YAML removed requirement delta to include a structured removal reason as the keyed-map value for the target requirement key.
    scenarios:
      removal-rationale-is-reviewable:
        - GIVEN: a strict YAML delta spec removes a requirement
        - WHEN: the removal entry is reviewed
        - THEN: the keyed-map key identifies the removed requirement
        - AND: the keyed-map value contains a structured reason field
  yaml-delta-minimal-example:
    strength: MUST
    statement: The system MUST provide a minimal valid YAML delta spec example that includes schema identity, target spec identity, and explicit ADDED, MODIFIED, and REMOVED operation keyed-map collections.
    scenarios:
      delta-spec-example-is-complete-enough-to-validate:
        - GIVEN: the strict YAML delta spec contract is reviewed
        - WHEN: its minimal valid example is inspected
        - THEN: every required top-level delta spec field is present
        - AND: each delta operation collection is represented as a keyed map
        - AND: modification and removal entries use keyed-map keys as requirement identifiers
      delta-spec-example-demonstrates-operation-payloads:
        - GIVEN: the strict YAML delta spec example is inspected
        - WHEN: ADDED, MODIFIED, and REMOVED entries are reviewed
        - THEN: the added entry uses a keyed-map key as the requirement identifier and a value with strength, statement, and scenarios
        - AND: the modified entry uses a keyed-map key as the target identifier and a value with replacement requirement fields
        - AND: the removed entry uses a keyed-map key as the target identifier and a value with a removal reason
  yaml-concrete-schema-file-coverage:
    strength: MUST
    statement: The system MUST provide concrete YAML schema files for main specs, delta specs, change proposals, change designs, task lists, question lists, spec indexes, roadmap indexes, and roadmap milestones.
    scenarios:
      schema-files-cover-every-required-artifact-family:
        - GIVEN: the strict workflow schema files are reviewed
        - WHEN: the required artifact families are compared with the available schema files
        - THEN: every required artifact family has at least one concrete YAML schema file
  yaml-concrete-schema-file-identity:
    strength: MUST
    statement: The system MUST require each concrete YAML schema file to expose structured artifact type and schema version fields.
    scenarios:
      schema-file-identity-is-machine-readable:
        - GIVEN: a concrete YAML schema file is inspected
        - WHEN: its identity fields are reviewed
        - THEN: the artifact type is available as a structured field
        - AND: the schema version is available as a structured field
  yaml-concrete-schema-file-contract:
    strength: MUST
    statement: The system MUST require concrete YAML schema files to define required fields, optional fields, enum values, relationship fields, stable identifier fields, uniqueness scopes, and supported top-level shapes as structured YAML data.
    scenarios:
      schema-file-contract-is-structured:
        - GIVEN: a concrete YAML schema file is inspected
        - WHEN: its validation contract is reviewed
        - THEN: required fields are available as structured data
        - AND: optional fields are available as structured data
        - AND: enum values are available as structured data
        - AND: relationship fields are available as structured data
        - AND: stable identifier and uniqueness rules are available as structured data
        - AND: supported top-level shapes are available as structured data
  yaml-concrete-example-file-coverage:
    strength: MUST
    statement: The system MUST provide minimal valid YAML example files for main specs, delta specs, change proposals, change designs, task lists, question lists, spec indexes, roadmap indexes, and roadmap milestones.
    scenarios:
      example-files-cover-every-required-artifact-family:
        - GIVEN: the strict workflow example files are reviewed
        - WHEN: the required artifact families are compared with the available example files
        - THEN: every required artifact family has at least one minimal valid YAML example file
  yaml-example-schema-association:
    strength: MUST
    statement: The system MUST make each minimal valid YAML example file associated with the concrete schema file or artifact type it demonstrates.
    scenarios:
      examples-identify-their-schema-target:
        - GIVEN: a minimal valid YAML example file is inspected
        - WHEN: its schema association is reviewed
        - THEN: the target schema file or target artifact type is identifiable through structured YAML data or repository-defined file organization
  yaml-schema-and-example-parseability:
    strength: MUST
    statement: The system MUST require concrete schema files and minimal valid example files to be parseable as YAML documents without relying on Markdown headings, frontmatter, list indentation, or prose-only conventions.
    scenarios:
      schema-files-are-parseable-yaml:
        - GIVEN: a concrete schema file is loaded by a YAML parser
        - WHEN: the file is syntactically valid
        - THEN: the schema contract is available through structured YAML fields
      example-files-are-parseable-yaml:
        - GIVEN: a minimal valid example file is loaded by a YAML parser
        - WHEN: the file is syntactically valid
        - THEN: the example artifact data is available through structured YAML fields
  strict-schema-file-organization:
    strength: MUST
    statement: The system MUST store repository-bundled strict workflow schema files under `templates/strict-spec-driven/schemas/` and repository reference minimal valid example files under `examples/strict-spec-driven/`, separate from `.strict-spec-driven/` workflow state.
    scenarios:
      schema-and-example-directories-are-discoverable:
        - GIVEN: the strict workflow repository files are reviewed
        - WHEN: concrete schema and example locations are checked
        - THEN: schema files are available under `templates/strict-spec-driven/schemas/`
        - AND: minimal valid example files are available under `examples/strict-spec-driven/`
        - AND: '`.strict-spec-driven/` is not used to store repository-bundled schema or example assets'
  strict-schema-example-file-naming:
    strength: MUST
    statement: The system MUST name schema and example files so each required artifact family has a corresponding schema file and example file with matching artifact identity.
    scenarios:
      artifact-family-file-pairs-are-identifiable:
        - GIVEN: the strict workflow schema and example directories are reviewed
        - WHEN: an artifact family is checked
        - THEN: a schema file for that artifact family is identifiable
        - AND: an example file for that artifact family is identifiable
        - AND: the schema and example expose matching artifact type identity through structured YAML fields
  yaml-schema-dialect-is-machine-readable:
    strength: MUST
    statement: The system MUST represent concrete schema file validation rules through machine-readable nested fields rather than prose-only shape descriptions.
    scenarios:
      nested-fields-are-inspectable:
        - GIVEN: a concrete schema file is reviewed
        - WHEN: a nested artifact field is checked
        - THEN: the field type is available through structured YAML data
        - AND: required status is available through structured YAML data
        - AND: enum, const, item, uniqueness, reference, and additional-field rules are available through structured YAML data where they apply
  yaml-artifact-schema-identity-consistency:
    strength: MUST
    statement: The system MUST make every strict YAML artifact example identify the schema ID of the schema file it demonstrates.
    scenarios:
      examples-match-schema-identity:
        - GIVEN: a concrete schema file and its primary example are reviewed
        - WHEN: their identity fields are compared
        - THEN: the example `schema` value matches the schema file `schema_id`
        - AND: the example `artifact_type` value matches the schema file `artifact_type`
  yaml-minimal-and-coverage-example-separation:
    strength: MUST
    statement: The system MUST keep minimal valid examples separate from richer coverage examples when coverage data would introduce optional operations or blocking workflow state.
    scenarios:
      minimal-examples-remain-minimal:
        - GIVEN: a strict YAML artifact family has optional operations or blocking workflow state
        - WHEN: its primary minimal example is inspected
        - THEN: the primary example avoids optional operations and blocking workflow state
        - AND: richer coverage examples are identified separately when needed
  yaml-roadmap-index-ordering-contract:
    strength: MUST
    statement: The system MUST represent roadmap index milestone ordering through a keyed YAML map where each key is a 4-digit numeric-prefixed milestone ID and each value exposes structured title, path, and status fields, preserving milestone order through YAML map key sequence.
    scenarios:
      roadmap-index-uses-keyed-milestone-map:
        - GIVEN: a strict roadmap index artifact is reviewed
        - WHEN: the milestones field is inspected
        - THEN: milestones is a keyed map rather than an array
        - AND: each key matches the pattern for 4-digit numeric prefix
        - AND: each value exposes structured title, path, and status fields
        - AND: no separate id field exists within the entry value
      roadmap-index-milestone-order-is-recoverable:
        - GIVEN: a strict roadmap index artifact is loaded by a YAML parser that preserves map key order
        - WHEN: the milestones keys are iterated
        - THEN: milestone order remains recoverable from the key sequence
  yaml-roadmap-milestone-planning-model:
    strength: MUST
    statement: The system MUST represent roadmap milestone planning state through a keyed map where the key is a 4-digit numeric-prefixed milestone ID, with structured YAML fields for goal, scope, done criteria, dependencies, risks, status, notes, a keyed planned_changes map where each entry requires status, summary, details, and depends_on fields, and an optional top-level details field for long-form planning guidance.
    scenarios:
      roadmap-milestone-uses-keyed-identity:
        - GIVEN: a strict roadmap milestone artifact is reviewed
        - WHEN: its milestone field is inspected
        - THEN: the milestone field is a single-entry keyed map
        - AND: the key matches the pattern for 4-digit numeric prefix
        - AND: the value exposes a title field
        - AND: no separate id field exists within the value
      roadmap-milestone-planned-changes-are-keyed:
        - GIVEN: a strict roadmap milestone artifact is reviewed
        - WHEN: its planned_changes field is inspected
        - THEN: planned_changes is a keyed map
        - AND: each key is a stable change identifier
        - AND: each value exposes status, summary, details, and depends_on fields
        - AND: no separate id field exists within the entry value
      planned-change-details-are-required:
        - GIVEN: a strict roadmap milestone artifact is validated
        - WHEN: a planned change entry is inspected
        - THEN: the entry includes a details field
        - AND: the details field contains technical and design context as a non-empty string
        - AND: the absence of details is reported as a validation failure
      milestone-id-uses-four-digit-prefix:
        - GIVEN: a strict roadmap milestone artifact is validated
        - WHEN: the milestone keyed map key is checked
        - THEN: the key matches the pattern of exactly four digits followed by a hyphen
        - AND: keys not matching this pattern are reported as validation failures
      milestone-declared-status-uses-roadmap-enums:
        - GIVEN: a strict roadmap milestone artifact is validated
        - WHEN: the milestone status is inspected
        - THEN: the declared status is limited to proposed, active, blocked, or complete
      roadmap-milestone-exposes-details-as-optional-long-form-field:
        - GIVEN: a strict roadmap milestone artifact is reviewed
        - WHEN: its details field is inspected
        - THEN: the details content is available as an optional string field
        - AND: the details content is freeform text suitable for YAML block scalar representation
      milestones-without-details-remain-valid:
        - GIVEN: a strict roadmap milestone artifact omits the details field
        - WHEN: the artifact is validated
        - THEN: no validation failure is emitted for the missing details field
      sync-preserves-details-when-present:
        - GIVEN: a strict roadmap milestone artifact includes a details field
        - WHEN: the roadmap sync operation builds the canonical milestone artifact
        - THEN: the output milestone artifact includes the same details content
      sync-omits-details-when-absent:
        - GIVEN: a strict roadmap milestone artifact omits the details field
        - WHEN: the roadmap sync operation builds the canonical milestone artifact
        - THEN: the output milestone artifact omits the details field
  yaml-planned-change-entry-dependency-model:
    strength: MUST
    statement: The system MUST represent roadmap planned changes as stable planned-change identities that remain valid as inline milestone planned_changes entries during compatibility windows and can also be represented as standalone planned-change YAML artifacts under the roadmap directory, with each representation exposing status, summary, details, dependency references, and exactly one owning milestone relationship.
    scenarios:
      planned-change-identity-supports-inline-and-standalone-forms:
        - GIVEN: strict roadmap planned change data is reviewed
        - WHEN: planned changes are represented by either inline milestone entries or standalone planned-change artifacts
        - THEN: each planned change has a stable planned change identifier
        - THEN: each planned change exposes structured status, summary, details, and dependency references
        - THEN: each standalone planned-change artifact identifies exactly one owning milestone
  yaml-roadmap-example-contract-coverage:
    strength: MUST
    statement: The system MUST provide roadmap example artifacts that demonstrate the roadmap v2 schema through both minimal inline planned change data and richer coverage examples with planned change dependencies.
    scenarios:
      roadmap-primary-example-includes-minimal-inline-planned-change:
        - GIVEN: the primary roadmap milestone example is inspected
        - WHEN: its planned_changes field is reviewed
        - THEN: it contains one inline planned change with no dependencies
      roadmap-planning-example-includes-dependent-planned-changes:
        - GIVEN: the roadmap planning coverage example is inspected
        - WHEN: its planned_changes field is reviewed
        - THEN: it contains multiple inline planned changes
        - THEN: at least one planned change depends on an earlier planned change
  strict-roadmap-skill-command-contract:
    strength: MUST
    statement: The system MUST provide strict roadmap skill packages for `plan`, `milestone`, `recommend`, and `sync` with explicit command mappings that reference the strict roadmap command(s) and shared strict change commands those skills depend on, and MUST keep roadmap-backed proposal-only handoff separate as the `strict-spec-propose-from-roadmap` skill rather than packaging a `strict-roadmap-propose` skill.
    scenarios:
      roadmap-skills-expose-concrete-strict-commands:
        - GIVEN: a strict roadmap `SKILL.md` file is reviewed
        - WHEN: its `## This Skill's Commands` section is inspected
        - THEN: the command mapping identifies the specific strict command entry or entries the skill uses
        - THEN: the command mapping is not limited to generic placeholder commands
      roadmap-propose-skill-is-not-packaged:
        - GIVEN: the repository skill packaging surfaces are reviewed
        - WHEN: the skills directory and marketplace metadata are inspected
        - THEN: no strict-roadmap-propose skill package or marketplace entry exists
        - THEN: roadmap proposal-only handoff guidance points to the strict-spec-propose-from-roadmap skill
        - THEN: roadmap recommendation with automatic continuation remains owned by the strict-roadmap-recommend skill
  strict-roadmap-skill-guidance-contract:
    strength: MUST
    statement: The system MUST ensure strict roadmap skill packages describe .strict-spec-driven/roadmap/ YAML artifacts, canonical milestone ordering, declared and derived roadmap status rules, the prompt-vs-script split used by the strict workflow, and efficient handoff behavior that relies on deterministic CLI recommendation output before broad manual context reads.
    scenarios:
      roadmap-recommend-uses-scripted-output-before-targeted-reads:
        - GIVEN: a strict roadmap recommend skill prompt is reviewed
        - WHEN: its recommendation and context-gathering steps are inspected
        - THEN: the skill instructs the agent to run the scripted roadmap-recommend command before choosing work or reading broad roadmap context
        - THEN: the skill uses the recommendation result path to open only the selected planned-change artifact, owning milestone guidance, and target specs needed for proposal generation
  strict-roadmap-proposal-handoff-contract:
    strength: MUST
    statement: The system MUST ensure roadmap recommendation and roadmap proposal-handoff behavior convert exactly one planned change into a normal strict change scaffold without duplicating roadmap-only planning metadata inside the change artifacts, consume relevant details as targeted planning guidance, validate proposal handoff with the proposal readiness gate, and keep proposal-only handoff separate from automatic workflow continuation.
    scenarios:
      roadmap-recommend-validates-handoff-with-ready:
        - GIVEN: a strict roadmap recommendation has scaffolded and populated a strict change
        - WHEN: the roadmap recommendation handoff validates the proposal
        - THEN: the skill runs ready for deterministic proposal-handoff blockers
        - THEN: the skill does not require a separate full verify command at proposal time solely to rediscover expected pending implementation tasks
      roadmap-recommend-hands-populated-change-to-auto:
        - GIVEN: a strict roadmap recommendation has created populated proposal, design, tasks, questions, and delta spec artifacts
        - WHEN: the handoff invokes strict-spec-auto
        - THEN: the automatic workflow resumes the existing populated change instead of regenerating those planning artifacts
      roadmap-propose-from-roadmap-stops-after-proposal-validation:
        - GIVEN: the strict-spec-propose-from-roadmap skill has created populated proposal, design, tasks, questions, and delta spec artifacts
        - WHEN: the handoff completes proposal validation
        - THEN: the skill recommends strict-spec-auto as a next step without invoking it automatically
  yaml-task-testing-gates:
    strength: MUST
    statement: The system MUST represent validation and unit test task gates in task-list artifacts through structured fields, referencing task keys that exist within the Testing section.
    scenarios:
      testing-gates-are-machine-readable:
        - GIVEN: a strict YAML task-list artifact is reviewed
        - WHEN: testing gates are inspected
        - THEN: the validation task reference is available as structured YAML data
        - AND: the unit test task reference is available as structured YAML data
        - AND: testing tasks expose explicit runnable command fields
      testing-gates-reference-existing-task-keys:
        - GIVEN: a strict YAML task-list artifact with testing_gates is validated
        - WHEN: each gate reference is checked
        - THEN: the referenced task key exists within the Testing section
        - AND: the referenced task exposes a command field
  structured-yaml-semantics:
    strength: MUST
    statement: The system MUST represent workflow artifact meaning through structured YAML fields rather than Markdown headings, frontmatter, list indentation, or free-form prose conventions.
    scenarios:
      artifact-meaning-is-structured:
        - GIVEN: a strict YAML workflow artifact
        - WHEN: its workflow meaning is inspected
        - THEN: the meaning is available through named YAML fields
        - AND: the meaning does not depend on Markdown section titles or list formatting
  deterministic-schema-validation:
    strength: MUST
    statement: The system MUST define strict YAML artifact schemas and validation diagnostics precisely enough for scripts to report missing required fields, invalid enum values, invalid references, malformed YAML, duplicate stable identifiers, and unsupported artifact shapes with artifact-path and field-path context.
    scenarios:
      invalid-artifacts-can-be-rejected:
        - GIVEN: a strict YAML workflow artifact with a schema violation
        - WHEN: validation is run against the artifact contract
        - THEN: the violation can be reported as a deterministic validation failure
      duplicate-identifiers-can-be-rejected:
        - GIVEN: a strict YAML workflow artifact repeats a stable identifier where uniqueness is required
        - WHEN: validation is run against the artifact contract
        - THEN: the duplicate identifier can be reported as a deterministic validation failure
      diagnostics-include-actionable-location-context:
        - GIVEN: validation reports an artifact contract failure
        - WHEN: diagnostics are emitted
        - THEN: each diagnostic identifies the artifact path and field path
        - AND: each diagnostic includes expected-versus-actual details when validator data provides those values
  schema-contract-preserves-reference-semantics:
    strength: MUST
    statement: The system MUST preserve the reference workflow semantics from `../auto-spec-driven` unless the YAML schema contract explicitly requires a deliberate difference.
    scenarios:
      reference-behavior-remains-the-baseline:
        - GIVEN: a strict YAML artifact schema is compared with the corresponding reference workflow artifact
        - WHEN: a behavior difference exists
        - THEN: the difference is documented as a deliberate YAML contract decision
  strict-workflow-directory:
    strength: MUST
    statement: The system MUST define `.strict-spec-driven/` as the target workflow state directory for strict YAML spec-driven artifacts.
    scenarios:
      strict-workflow-directory-is-identifiable:
        - GIVEN: the strict workflow artifact contract is reviewed
        - WHEN: the target workflow state directory is checked
        - THEN: '`.strict-spec-driven/` is identified as the directory for strict YAML workflow artifacts'
  bootstrap-directory-compatibility:
    strength: MUST
    statement: The system MUST treat `.spec-driven/` as a bootstrap or legacy workflow directory rather than the target strict YAML workflow directory.
    scenarios:
      bootstrap-state-remains-distinct-from-strict-state:
        - GIVEN: a repository still uses `.spec-driven/` before strict migration tooling exists
        - WHEN: the strict workflow directory contract is reviewed
        - THEN: '`.spec-driven/` is not identified as the target strict YAML workflow directory'
        - AND: '`.strict-spec-driven/` remains the target strict YAML workflow directory'
  markdown-exception-categories:
    strength: MUST
    statement: The system MUST define the Markdown file categories that remain allowed in a strict YAML workflow repository because they are not strict workflow artifacts.
    scenarios:
      packaging-markdown-remains-allowed:
        - GIVEN: the strict YAML artifact contract is reviewed
        - WHEN: Agent Skills packaging files are checked
        - THEN: '`SKILL.md` is identified as an allowed Markdown exception'
        - AND: the exception is limited to the skill packaging container rather than generated or consumed strict workflow state
      repository-documentation-remains-allowed:
        - GIVEN: the strict YAML artifact contract is reviewed
        - WHEN: repository documentation files are checked
        - THEN: '`README.md`, `AGENTS.md`, `RTK.md`, and similar non-workflow documentation are allowed to remain Markdown'
        - AND: repository documentation is not treated as strict workflow state unless a later schema explicitly classifies it that way
  workflow-artifacts-use-yaml:
    strength: MUST
    statement: The system MUST require generated or consumed strict workflow artifacts to use YAML formats rather than Markdown formats.
    scenarios:
      strict-workflow-state-is-yaml:
        - GIVEN: strict workflow artifacts under .strict-spec-driven/ are reviewed
        - WHEN: specs, delta specs, proposals, designs, tasks, questions, indexes, roadmap indexes, and roadmap milestones are checked
        - THEN: each artifact family is required to use YAML structure
        - AND: Markdown headings, list formatting, or frontmatter are not accepted as the authoritative structure for those artifact families
  bootstrap-markdown-is-legacy-input:
    strength: MUST
    statement: The system MUST treat bootstrap or legacy `.spec-driven/` Markdown artifacts as migration input rather than valid target artifacts for strict workflows.
    scenarios:
      bootstrap-artifacts-are-not-strict-targets:
        - GIVEN: a repository still contains `.spec-driven/` Markdown workflow artifacts
        - WHEN: the strict Markdown exception policy is reviewed
        - THEN: those artifacts are identified as bootstrap or legacy workflow state
        - AND: they are not treated as valid `.strict-spec-driven/` target artifacts
      migration-can-read-legacy-markdown:
        - GIVEN: migration tooling reads supported `.spec-driven/` Markdown artifacts
        - WHEN: the Markdown exception policy is applied
        - THEN: reading those legacy artifacts for conversion remains allowed
        - AND: the generated strict workflow output is still required to use YAML artifacts
  markdown-exception-validation-boundary:
    strength: MUST
    statement: The system MUST require validation and migration behavior to distinguish Markdown exceptions from strict workflow artifacts by artifact role.
    scenarios:
      validators-do-not-reject-packaging-documentation:
        - GIVEN: validation checks strict workflow artifact formats
        - WHEN: an allowed Markdown exception such as `SKILL.md`, `README.md`, `AGENTS.md`, or `RTK.md` is encountered outside strict workflow state
        - THEN: the file is not rejected merely because it is Markdown
      validators-reject-strict-workflow-markdown-targets:
        - GIVEN: validation checks strict workflow artifact formats
        - WHEN: a generated or consumed strict workflow artifact is represented only as Markdown
        - THEN: the artifact can be reported as a deterministic validation failure
  command-surface-boundaries:
    strength: MUST
    statement: The system MUST distinguish skill names, slash commands, CLI entrypoints, CLI subcommands, and installer-facing names as separate command naming surfaces.
    scenarios:
      command-naming-surfaces-are-reviewable:
        - GIVEN: the strict workflow naming contract is reviewed
        - WHEN: public command names are categorized
        - THEN: skill names, slash commands, CLI entrypoints, CLI subcommands, and installer-facing names are each identifiable as separate naming surfaces
  strict-spec-command-prefix:
    strength: MUST
    statement: The system MUST define `strict-spec-*` as the naming family for strict spec workflow skills and slash commands.
    scenarios:
      strict-spec-workflow-commands-are-distinguishable:
        - GIVEN: a strict spec workflow skill or slash command name is reviewed
        - WHEN: its public prefix is checked
        - THEN: it uses the `strict-spec-*` naming family
  strict-roadmap-command-prefix:
    strength: MUST
    statement: The system MUST define `strict-roadmap-*` as the naming family for strict roadmap workflow skills and slash commands.
    scenarios:
      strict-roadmap-workflow-commands-are-distinguishable:
        - GIVEN: a strict roadmap workflow skill or slash command name is reviewed
        - WHEN: its public prefix is checked
        - THEN: it uses the `strict-roadmap-*` naming family
  strict-ticket-command-prefix:
    strength: MUST
    statement: The system MUST define `strict-ticket` and `strict-ticket-*` as the naming family for strict ticket intake, archive, and dispatch workflow skills and slash commands, where the bare `strict-ticket` name is the intake capture skill and `strict-ticket-*` names cover ticket archive, dispatch, and related ticket workflow skills.
    scenarios:
      strict-ticket-workflow-commands-are-distinguishable:
        - GIVEN: a strict ticket workflow skill or slash command name is reviewed
        - WHEN: its public prefix is checked
        - THEN: it uses either the bare `strict-ticket` family-root name or the `strict-ticket-*` naming family
  strict-cli-entrypoint:
    strength: MUST
    statement: The system MUST define `strict-spec-driven` as the CLI entrypoint for strict YAML workflow commands.
    scenarios:
      strict-cli-entrypoint-is-explicit:
        - GIVEN: the strict workflow naming contract is reviewed
        - WHEN: the CLI entrypoint for strict YAML workflow commands is checked
        - THEN: '`strict-spec-driven` is identified as the strict CLI entrypoint'
  cli-subcommand-naming-model:
    strength: MUST
    statement: The system MUST define CLI subcommands as stable workflow verb or verb-object names under the `strict-spec-driven` entrypoint rather than as `strict-spec-*` or `strict-roadmap-*` prefixed skill names.
    scenarios:
      cli-subcommands-do-not-duplicate-skill-prefixes:
        - GIVEN: a strict CLI command name is reviewed
        - WHEN: its subcommand is checked
        - THEN: the subcommand is a workflow verb or verb-object name
        - AND: the subcommand does not rely on the `strict-spec-*` or `strict-roadmap-*` skill naming families for its strict namespace
  installer-facing-strict-names:
    strength: MUST
    statement: The system MUST require installer-facing package, skill, command, and install or uninstall entrypoint names for strict workflows to identify the strict workflow namespace explicitly and avoid silent legacy aliases outside migration-defined compatibility behavior.
    scenarios:
      installer-names-preserve-the-strict-namespace:
        - GIVEN: strict workflow installation metadata or install entrypoints are reviewed
        - WHEN: package, skill, command, or install and uninstall names are exposed for installation
        - THEN: the names identify the strict workflow namespace
        - AND: legacy `spec-driven` or `spec-driven-*` names are not treated as strict workflow aliases unless a migration compatibility contract defines that behavior
  strict-skill-installation-script-contract:
    strength: MUST
    statement: The system MUST provide repository install and uninstall surfaces that register strict skill packages from the source repository for both shared/global and project-local use without breaking packaged script and template link assumptions.
    scenarios:
      install-surfaces-support-shared-and-project-local-registration:
        - GIVEN: a user wants to register strict skills from the source repository
        - WHEN: the repository install surface is invoked for the default or project-local scope
        - THEN: strict skill packages are registered for the selected scope
        - AND: the install surface uses strict workflow naming rather than legacy default aliases
      uninstall-surfaces-remove-the-selected-strict-registration:
        - GIVEN: strict skills were previously registered from the source repository
        - WHEN: the repository uninstall surface is invoked for the same selected scope
        - THEN: the strict skill registration is removed for that scope
        - AND: unrelated legacy registrations are not silently targeted as strict aliases
  cli-naming-remains-separate:
    strength: MUST
    statement: The system MUST distinguish skill and slash-command prefix rules from CLI entrypoint, CLI subcommand, and installer-facing naming rules, and MUST apply each rule only to its own naming surface.
    scenarios:
      cli-naming-is-not-implied-by-skill-prefixes:
        - GIVEN: the strict workflow naming contract is reviewed
        - WHEN: CLI entrypoint, CLI subcommand, or installer-facing names are considered
        - THEN: they are not treated as automatically defined by the `strict-spec-*` or `strict-roadmap-*` skill and slash-command prefixes
        - AND: each naming surface is checked against its own strict naming rule
  yaml-schema-registry-location:
    strength: MUST
    statement: The system MUST define a strict YAML schema registry under `templates/strict-spec-driven/schemas/` that lets validators, generators, migration tooling, and skills discover supported strict workflow artifact schemas.
    scenarios:
      registry-location-is-discoverable:
        - GIVEN: strict workflow tooling needs to discover supported schemas
        - WHEN: the schema registry location is checked
        - THEN: the registry location is identified under `templates/strict-spec-driven/schemas/`
        - AND: the registry is separate from roadmap, proposal, and archived change artifacts
      registry-is-structured-yaml:
        - GIVEN: the strict schema registry file is loaded
        - WHEN: the registry is syntactically valid
        - THEN: registry identity and schema entries are available through structured YAML fields
        - AND: registry meaning does not depend on Markdown headings, frontmatter, or prose-only conventions
  yaml-schema-registry-entry-model:
    strength: MUST
    statement: The system MUST represent each schema registry entry with structured schema ID, schema version, artifact type, artifact name, schema file path, primary example file path, and compatibility metadata.
    scenarios:
      registry-entries-expose-schema-identity:
        - GIVEN: a strict YAML schema registry entry is reviewed
        - WHEN: its fields are inspected
        - THEN: the schema ID is available as structured YAML data
        - AND: the schema version is available as structured YAML data
        - AND: the artifact type and artifact name are available as structured YAML data
        - AND: the schema and primary example file paths are available as structured YAML data
      registry-entries-expose-compatibility-data:
        - GIVEN: a strict YAML schema registry entry is reviewed
        - WHEN: compatibility behavior is inspected
        - THEN: compatibility metadata is available as structured YAML data
        - AND: tooling can determine whether the entry is current, deprecated, or superseded without relying on prose-only notes
  yaml-schema-registry-file-coverage:
    strength: MUST
    statement: The system MUST list every supported strict workflow artifact schema in the strict YAML schema registry.
    scenarios:
      supported-schemas-are-registered:
        - GIVEN: the strict YAML schema registry is reviewed
        - WHEN: the concrete schema files for supported artifact families are compared with registry entries
        - THEN: every supported artifact schema has a registry entry
        - AND: each registry entry points to a parseable concrete schema file
        - AND: each registry entry points to a parseable primary example file
  yaml-schema-id-stability:
    strength: MUST
    statement: The system MUST treat schema IDs as stable semantic identifiers for strict workflow artifact schemas rather than deriving identity only from file paths.
    scenarios:
      schema-identity-survives-file-organization-changes:
        - GIVEN: a strict YAML schema file is moved or reorganized
        - WHEN: the schema ID remains unchanged
        - THEN: tooling can still identify the artifact schema by stable semantic identity
  yaml-schema-version-compatibility:
    strength: MUST
    statement: The system MUST define schema version compatibility rules that distinguish compatible contract clarifications from incompatible artifact shape changes.
    scenarios:
      compatible-schema-changes-are-identifiable:
        - GIVEN: a strict YAML schema changes without removing required semantics or changing existing field meanings
        - WHEN: compatibility is evaluated
        - THEN: the change can be identified as compatible according to the versioning contract
      incompatible-schema-changes-require-an-explicit-version-boundary:
        - GIVEN: a strict YAML schema change removes required fields, changes enum meaning, changes identifier matching, or changes artifact relationships
        - WHEN: compatibility is evaluated
        - THEN: the change requires an explicit incompatible version boundary
  yaml-artifact-type-registry:
    strength: MUST
    statement: The system MUST define artifact type names and artifact names as registry-controlled values for all strict workflow artifact families.
    scenarios:
      artifact-type-names-are-not-ad-hoc:
        - GIVEN: a strict YAML artifact is validated
        - WHEN: its artifact type and artifact name are checked
        - THEN: the values can be matched to registry-controlled values
        - AND: unsupported artifact type names can be reported as deterministic validation failures
  yaml-migration-artifact-role-mapping:
    strength: MUST
    statement: The system MUST define migration mapping rules from supported legacy .spec-driven/ Markdown artifact roles to strict .strict-spec-driven/ YAML artifact types.
    scenarios:
      supported-legacy-artifact-roles-map-to-strict-artifact-types:
        - GIVEN: migration tooling reads a supported legacy .spec-driven/ Markdown artifact
        - WHEN: the artifact role is identified
        - THEN: the corresponding strict YAML artifact type is determined from the migration compatibility contract
        - AND: the generated artifact uses a registry-controlled schema ID and artifact type
      core-legacy-artifact-roles-are-supported:
        - GIVEN: migration tooling reads supported legacy .spec-driven/ Markdown workflow state
        - WHEN: main specs, delta specs, proposals, designs, tasks, questions, spec indexes, roadmap indexes, or roadmap milestones are identified by role
        - THEN: each supported role maps to the corresponding strict YAML artifact type defined by the registry
      migration-mappings-are-machine-readable:
        - GIVEN: the strict YAML schema registry is reviewed
        - WHEN: migration role mappings are inspected
        - THEN: each supported legacy role is available as structured YAML data
        - AND: each supported legacy role identifies a registry-controlled strict artifact type
        - AND: each supported legacy role identifies a registry-controlled schema ID
  yaml-migration-relationship-preservation:
    strength: MUST
    statement: The system MUST require migration behavior to preserve supported workflow relationships when converting legacy .spec-driven/ Markdown artifacts into strict YAML artifacts, including the optional details field on roadmap milestones.
    scenarios:
      migration-preserves-change-relationships:
        - GIVEN: a legacy change contains proposal, design, task, question, and delta spec artifacts
        - WHEN: migration converts the change to strict YAML
        - THEN: the generated strict artifacts preserve the change name relationship
        - AND: delta specs remain associated with their target main spec identities
      migration-preserves-roadmap-relationships:
        - GIVEN: a legacy roadmap milestone contains planned change entries
        - WHEN: migration converts the roadmap to strict YAML
        - THEN: planned change entries remain associated with their owning milestone as keyed map entries
        - AND: archived or active change state can still be reconciled by change name
      migration-preserves-milestone-details:
        - GIVEN: a legacy roadmap milestone Markdown artifact contains a Details section
        - WHEN: migration converts the milestone to a strict YAML roadmap milestone artifact
        - THEN: the converted artifact includes the details field with the section content
      migration-omits-details-when-absent-in-legacy-milestone:
        - GIVEN: a legacy roadmap milestone Markdown artifact does not contain a Details section
        - WHEN: migration converts the milestone to a strict YAML roadmap milestone artifact
        - THEN: the converted artifact omits the details field
  yaml-migration-unsupported-shape-reporting:
    strength: MUST
    statement: The system MUST require migration tooling to report unsupported legacy Markdown shapes through structured warnings and manual follow-up entries rather than silently dropping or guessing artifact semantics.
    scenarios:
      unsupported-legacy-shape-is-reported:
        - GIVEN: migration tooling encounters a legacy Markdown artifact shape that cannot be mapped deterministically
        - WHEN: migration reports the result
        - THEN: the unsupported shape is recorded as a structured warning
        - AND: the report identifies the source artifact path
        - AND: the report identifies the manual follow-up needed
      unsupported-shape-warning-fields-are-registered:
        - GIVEN: the strict YAML schema registry is reviewed
        - WHEN: unsupported-shape reporting rules are inspected
        - THEN: the required warning fields are available as structured YAML data
        - AND: the manual follow-up field is available as structured YAML data
  yaml-migration-compatibility-boundary:
    strength: MUST
    statement: The system MUST define migration compatibility as legacy-input support rather than treating legacy `.spec-driven/` Markdown artifacts as valid strict workflow target artifacts.
    scenarios:
      legacy-artifacts-remain-migration-input-only:
        - GIVEN: a repository contains legacy `.spec-driven/` Markdown workflow artifacts
        - WHEN: strict workflow validation and migration compatibility rules are applied
        - THEN: those artifacts are accepted only as migration input
        - AND: generated strict workflow target artifacts still use `.strict-spec-driven/` YAML formats
  yaml-migration-report-envelope:
    strength: MUST
    statement: The system MUST define a structured migration report model for strict migration runs that records converted artifacts, initialized scaffold artifacts, skipped artifacts, warnings, errors, and manual follow-up items, while preserving source-artifact references for legacy inputs that were converted, skipped, or deferred.
    scenarios:
      migration-report-preserves-actionable-source-context-for-legacy-inputs:
        - GIVEN: migration tooling converts supported legacy `.spec-driven/` artifacts
        - WHEN: the migration report is reviewed
        - THEN: each converted legacy artifact entry identifies the relevant source artifact path
        - AND: each skipped artifact entry identifies the relevant source artifact path
        - AND: each warning or error identifies the source artifact path that triggered the outcome
      migration-report-records-initialized-strict-scaffold-assets:
        - GIVEN: migration tooling initializes required strict scaffold artifacts during a migration run
        - WHEN: the migration report is reviewed
        - THEN: each initialized scaffold artifact entry identifies its strict target path
        - AND: the entry does not need to invent a legacy source-artifact mapping when the scaffold asset came from bundled strict templates
      migration-report-captures-manual-follow-up-items:
        - GIVEN: migration tooling encounters an unsupported or ambiguous legacy Markdown shape
        - WHEN: the migration report is emitted
        - THEN: the report records a manual follow-up item for that source artifact
        - AND: the follow-up item explains what could not be converted deterministically
  yaml-migrated-core-spec-preservation:
    strength: MUST
    statement: The system MUST preserve strict workflow identity, ordering, and mapping data when legacy Markdown main specs and delta specs are converted into strict YAML artifacts.
    scenarios:
      migrated-main-specs-preserve-stable-identifiers-and-mappings:
        - GIVEN: migration tooling converts a legacy Markdown main spec
        - WHEN: the generated strict YAML spec artifact is inspected
        - THEN: the migrated artifact preserves the stable spec, requirement, and scenario identifiers represented by the legacy workflow state
        - AND: implementation and test mappings remain represented as structured file-level data rather than requirement prose
        - AND: scenario ordering remains recoverable from the strict YAML artifact data
      migrated-delta-specs-preserve-operation-intent:
        - GIVEN: migration tooling converts a legacy Markdown delta spec
        - WHEN: the generated strict YAML delta artifact is inspected
        - THEN: added, modified, and removed requirement operations remain represented through the strict YAML delta structure
        - AND: any preserved requirement identifiers remain reviewable through structured YAML fields
  yaml-migrated-change-artifact-state-preservation:
    strength: MUST
    statement: The system MUST preserve active and archived change state when legacy Markdown proposal, design, tasks, and questions artifacts are converted into strict YAML change artifacts.
    scenarios:
      migrated-active-changes-preserve-task-and-question-state:
        - GIVEN: migration tooling converts an active legacy change directory
        - WHEN: the generated strict YAML change artifacts are inspected
        - THEN: proposal, design, tasks, and questions content remains represented in the corresponding strict artifact families
        - AND: completed versus pending task state remains reviewable through structured YAML data
        - AND: open versus resolved question state remains reviewable through structured YAML data
      migrated-archived-changes-preserve-archive-date-behavior:
        - GIVEN: migration tooling converts an archived legacy change directory with a date-prefixed folder name
        - WHEN: the generated strict archived change output is inspected
        - THEN: the archive-date prefix remains preserved in the migrated strict archive location or archived change identity
        - AND: the migrated archived change remains distinguishable from active strict changes without reconstructing that state from Markdown headings
  strict-skill-packaging-layout-contract:
    strength: MUST
    statement: The system MUST provide strict skill packaging surfaces for the `strict-spec-*`, `strict-roadmap-*`, `strict-tech-*`, and `strict-ticket-*` families with installer-facing metadata that uses strict namespace names in non-migration contexts.
    scenarios:
      strict-skill-families-are-packaged-with-strict-naming:
        - GIVEN: strict workflow skill packaging metadata is reviewed
        - WHEN: spec, roadmap, tech, and ticket workflow skill entries are checked
        - THEN: skill package names use the `strict-spec-*`, `strict-roadmap-*`, `strict-tech-*`, and `strict-ticket-*` families
        - AND: legacy `spec-driven-*` and `roadmap-*` names are not treated as default strict package names outside explicit migration compatibility behavior
        - AND: marketplace skill entries match strict skill directory names
  strict-skill-packaging-validation-contract:
    strength: MUST
    statement: The system MUST validate strict skill packages for required metadata fields, declared command references, stale legacy-name references, and bundled symlink assumptions.
    scenarios:
      valid-strict-skill-package-passes-validation:
        - GIVEN: a strict skill package includes required frontmatter metadata and command references
        - AND: package symlinks resolve to expected bundled script and template targets
        - WHEN: skill packaging validation runs
        - THEN: no validation error is emitted
      stale-naming-or-broken-symlink-fails-validation:
        - GIVEN: a strict skill package uses stale legacy naming references or a broken bundled symlink target
        - WHEN: skill packaging validation runs
        - THEN: validation fails deterministically
        - AND: diagnostics identify the package path and failing field or link target
  strict-core-skill-command-contract:
    strength: MUST
    statement: 'The system MUST provide strict core lifecycle skill packages for `init`, `propose`, `apply`, `verify`, `review`, `archive`, `auto`, and `modify` with explicit command mappings that reference the strict bundled CLI subcommands those skills depend on, and MUST NOT package a separate `cancel` skill: cancelling an active change is performed through the strict CLI cancel command or the confirm-gated cancel_change MCP tool.'
    scenarios:
      core-skills-expose-concrete-strict-commands:
        - GIVEN: a strict core lifecycle SKILL.md file is reviewed
        - WHEN: its '## This Skill's Commands' section is inspected
        - THEN: the command mapping identifies the specific strict bundled CLI command entry or entries the skill uses
        - THEN: the command mapping is not limited to a generic placeholder command
      cancel-skill-is-not-packaged:
        - GIVEN: the repository skill packaging surfaces are reviewed
        - WHEN: the skills directory and marketplace metadata are inspected
        - THEN: no strict-spec-cancel skill package or marketplace entry exists
        - THEN: the strict CLI cancel command and the cancel_change MCP tool remain the documented cancellation paths
  strict-core-skill-guidance-contract:
    strength: MUST
    statement: The system MUST ensure the strict-spec-apply skill includes a post-task-completion step that automatically detects non-source artifacts generated during task implementation and adds matching entries to .gitignore before suggesting strict-spec-verify.
    scenarios:
      apply-skill-auto-gitignore:
        - GIVEN: the strict-spec-apply skill workflow has completed all tasks
        - WHEN: the post-task-completion step is reached
        - THEN: the agent checks for non-source artifacts using git status and adds matching entries to .gitignore before suggesting strict-spec-verify
  strict-planning-skill-command-contract:
    strength: MUST
    statement: The system MUST provide strict planning and documentation skill packages for `brainstorm`, `spec-edit`, `sync-specs`, and `resync-code-mapping` with explicit command mappings that reference the strict bundled CLI subcommands those skills depend on.
    scenarios:
      planning-skills-expose-concrete-strict-commands:

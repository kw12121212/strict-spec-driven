  - id: strict-skill-packaging-validation-contract
    strength: MUST
    statement: >-
      The system MUST validate strict skill packages for required metadata fields, declared command
      references, stale legacy-name references, and bundled symlink assumptions.
    scenarios:
      - id: valid-strict-skill-package-passes-validation
        steps:

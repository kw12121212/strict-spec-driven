            text: each converted legacy artifact entry identifies the relevant source artifact path
          - kind: AND
            text: each skipped artifact entry identifies the relevant source artifact path
          - kind: AND
            text: each warning or error identifies the source artifact path that triggered the outcome
      - id: migration-report-records-initialized-strict-scaffold-assets
        steps:
          - kind: GIVEN
            text: >-
              migration tooling initializes required strict scaffold artifacts during a migration
              run
          - kind: WHEN
            text: the migration report is reviewed
          - kind: THEN
            text: each initialized scaffold artifact entry identifies its strict target path
          - kind: AND
            text: >-
              the entry does not need to invent a legacy source-artifact mapping when the scaffold
              asset came from bundled strict templates
      - id: migration-report-captures-manual-follow-up-items
        steps:
          - kind: GIVEN
            text: migration tooling encounters an unsupported or ambiguous legacy Markdown shape
          - kind: WHEN
            text: the migration report is emitted
          - kind: THEN
            text: the report records a manual follow-up item for that source artifact
          - kind: AND
            text: the follow-up item explains what could not be converted deterministically
  - id: yaml-migrated-core-spec-preservation
    strength: MUST
    statement: >-
      The system MUST preserve strict workflow identity, ordering, and mapping data when legacy
      Markdown main specs and delta specs are converted into strict YAML artifacts.
    scenarios:
      - id: migrated-main-specs-preserve-stable-identifiers-and-mappings
        steps:
          - kind: GIVEN
            text: migration tooling converts a legacy Markdown main spec
          - kind: WHEN
            text: the generated strict YAML spec artifact is inspected
          - kind: THEN
            text: >-
              the migrated artifact preserves the stable spec, requirement, and scenario identifiers
              represented by the legacy workflow state
          - kind: AND
            text: >-
              implementation and test mappings remain represented as structured file-level data
              rather than requirement prose
          - kind: AND
            text: scenario ordering remains recoverable from the strict YAML artifact data
      - id: migrated-delta-specs-preserve-operation-intent
        steps:
          - kind: GIVEN
            text: migration tooling converts a legacy Markdown delta spec
          - kind: WHEN
            text: the generated strict YAML delta artifact is inspected
          - kind: THEN
            text: >-
              added, modified, and removed requirement operations remain represented through the
              strict YAML delta structure
          - kind: AND
            text: any preserved requirement identifiers remain reviewable through structured YAML fields
  - id: yaml-migrated-change-artifact-state-preservation
    strength: MUST

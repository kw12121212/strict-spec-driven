schema: strict-spec-driven/main-spec/v1
schema_version: 1
artifact_type: main_spec
schema_file: templates/strict-spec-driven/schemas/main-spec.yaml
spec:
  id: sessions-domain-behavior
  title: Sessions Domain Behavior
requirements:
  session-replacement-contract:
    strength: MUST
    statement: The system MUST expose harness declarations and harness sessions as the replacement for development-session and debug-session artifacts without preserving dev-session-* or debug-session-* CLI aliases.
    scenarios:
      replacement-model-is-observable:
        - GIVEN: a strict workflow user inspects session-related commands and skill guidance
        - WHEN: the CLI and bundled skills are validated
        - THEN: harness and harness-session commands are documented and executable while retired dev-session and debug-session commands are not registered aliases
  development-session-bootstrap-contract:
    strength: MUST
    statement: The system MUST make harness inference, declaration review, and generated harness helper scripts provide the observable development-session bootstrap workflow.
    scenarios:
      bootstrap-uses-harness-declaration:
        - GIVEN: a project needs development helper scripts
        - WHEN: harness-infer and harness-scripts generate run through the harness-init workflow
        - THEN: the resulting harness declaration and scripts describe environments, components, operations, safety policy, and project-local helpers
  investigation-session-contract:
    strength: MUST
    statement: The system MUST make harness-session create, validate, and archive provide the observable debug-session investigation workflow with structured evidence and deterministic paths.
    scenarios:
      investigation-session-lifecycle:
        - GIVEN: a valid harness declaration exists
        - WHEN: harness-session create, validate, and archive are run for a session
        - THEN: session.yaml, the evidence directory, validation diagnostics, and archive paths are produced deterministically
  session-secret-and-checkpoint-contract:
    strength: MUST
    statement: The system MUST keep session evidence secret-safe and require human checkpoints in harness-session guidance before closing or archiving investigations.
    scenarios:
      secret-safe-evidence:
        - GIVEN: a harness-session artifact or skill-guided investigation records manual actions
        - WHEN: validation and skill guidance are followed
        - THEN: secret-recording fields are rejected or prohibited and evidence remains tied to explicit checkpoints
  investigation-session-cli-authoring-contract:
    strength: MUST
    statement: The system MUST make harness-session create and structured authoring write session YAML through named semantic arguments and the shared atomic mutation boundary, support exact named removal and explicit lifecycle-safe deletion, and preserve the complete evidence directory when a resolved or blocked session is archived.
    scenarios:
      session-authoring-is-non-destructive:
        - GIVEN: An active harness session contains checkpoints, investigation steps, evidence references, findings, and next actions
        - WHEN: The operator upserts or removes one named session entry
        - THEN: Only the selected entry changes, unrelated evidence and YAML state remain unchanged, and the complete candidate validates before commit
      session-delete-and-archive-are-distinct:
        - GIVEN: An active session has evidence and is either proposed, resolved, or blocked
        - WHEN: The operator requests delete or archive
        - THEN: Delete requires isolated explicit intent and applicable safety preconditions, while archive requires resolved or blocked status and moves the session YAML plus its evidence directory together
      session-failure-preserves-directory:
        - GIVEN: Session creation, editing, deletion, or archive fails validation, confinement, reference, or filesystem checks
        - WHEN: The lifecycle operation exits non-zero
        - THEN: No partial session YAML, evidence move, archive directory, or sibling change remains

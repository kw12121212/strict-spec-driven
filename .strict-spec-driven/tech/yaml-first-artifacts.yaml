schema: strict-spec-driven/main-tech/v1
schema_version: 1
artifact_type: main_tech
schema_file: ../schemas/main-tech.yaml
standard:
  id: yaml-first-artifacts
  title: YAML-First Artifact Authoring
  category: architecture
rules:
  artifacts-are-strict-yaml:
    strength: MUST
    statement: All spec-driven workflow artifacts MUST be authored as strict YAML that validates against a registered schema, not as Markdown prose or ad hoc text.
    rationale: The product constraint is deterministic, machine-validatable workflow state. Markdown prose cannot be validated, parsed, or enforced structurally, which is the whole reason the strict workflow exists.
    enforcement:
      method: ci
      detail: Schemas are registered in registry.yaml and validateArtifact enforces them; the test suite validates every primary example against its schema.
    exceptions:
      - Skill SKILL.md files remain Markdown because Agent Skills require it.
      - Human-facing repository documentation (README, guides) stays Markdown.
  scripts-own-mechanics:
    strength: MUST
    statement: Scripts MUST own filesystem mechanics, parsing, validation, and deterministic format enforcement; AI judgment belongs in skill prompts, not in scripts.
    rationale: Separating deterministic mechanics from probabilistic judgment keeps the workflow reproducible and testable, and keeps skills focused on decisions rather than file plumbing.
    enforcement:
      method: review
      detail: Reviewers reject scripts that embed product judgment or skills that hand-roll YAML mechanics.
  generated-documents-are-not-hand-edited:
    strength: MUST
    statement: A human-readable document rendered from strict YAML MUST be produced only by its generator and carry a banner naming its YAML sources; neither the rendered document nor its repository-owned YAML sources may be hand-edited, so source changes MUST use the applicable artifact-aware CLI operation before re-rendering.
    rationale: Generated output and its strict YAML sources need one attributable mutation path. Routing source intent through the CLI prevents schema drift and unsafe replacements, while generator-only output preserves a single source of truth.
    enforcement:
      method: manual
      detail: Architecture and design check commands detect rendered drift; reviewers require source mutations to use their artifact-aware CLI commands and reject direct edits to generated documents or repository-owned source YAML.
    examples:
      good:
        - Invoke the architecture authoring operation with named component fields, then run architecture-generate to re-render ARCHITECTURE.md.
        - Invoke the design-system authoring operation with named token fields, then run design-generate to re-render DESIGN.md.
      bad:
        - Edit ARCHITECTURE.md or .strict-spec-driven/architecture.yaml directly.
        - Edit DESIGN.md or .strict-spec-driven/design-system.yaml directly.
    exceptions:
      - Hand-authored repository documentation that is not rendered from strict YAML remains human-edited Markdown.
  artifact-writes-are-non-destructive:
    strength: MUST
    statement: 'An artifact-authoring operation MUST affect only fields or named entries supplied in that invocation: scalar and keyed-item restatement overwrites only the named value, repeated list values append without duplicates, named removal deletes only the identified entry, and whole-artifact deletion is an isolated delete-only operation. Every unnamed field, item, list value, and sibling artifact MUST remain unchanged.'
    rationale: Binding effects to explicit semantic intent prevents silent data loss and makes every mutation safe without requiring the caller to reconstruct or reason about unrelated document content.
    enforcement:
      method: test
      detail: Regression tests cover scalar and keyed upsert, additive lists, idempotency, named removal, delete-only isolation, and preservation of unrelated bytes or parsed values.
  yaml-mutation-surfaces-stay-inventoried:
    strength: MUST
    statement: Every repository-owned YAML or YML artifact family and every repository code, CLI, MCP, skill, or documentation mutation surface MUST remain represented in inventory/yaml-mutation-surfaces.yaml with its ownership, supported operations, reference side effects, current CLI ownership or direct-write paths, and repository evidence; the dedicated inventory check MUST fail when coverage is missing, invalid, or stale.
    rationale: The shared mutation contract and later artifact-family migrations depend on a complete evidence baseline; allowing an unclassified YAML family or mutation path would silently recreate the direct-write gaps this roadmap is intended to eliminate.
    enforcement:
      method: test
      detail: bun run check:yaml-inventory validates the matrix directly, and test/suites/foundation-and-fixtures.ts covers repository completeness and deterministic failure diagnostics.
  cli-owns-repository-yaml-mutations:
    strength: MUST
    statement: Every supported creation, update, named-entry removal, or whole-artifact deletion of repository-owned YAML MUST flow through an artifact-aware CLI operation that accepts named semantic arguments, resolves a confined artifact-family path, and owns document shape; AI-facing workflows MUST NOT supply raw YAML payloads, arbitrary output paths, or direct file edits.
    rationale: A generic path or payload writer merely relocates unsafe hand-editing behind a command. Artifact identity and semantic inputs let deterministic code preserve structure, enforce valid destinations, and reconcile references consistently across every YAML family. Stating the rule is not sufficient on its own, because guidance text drifts back toward direct editing whenever nothing fails; the rule is only real once a static check rejects the drift.
    enforcement:
      method: test
      detail: Mutation command and skill regressions assert named-argument behavior, path confinement, and rejection of raw payload or direct-write guidance; validate-skills reports deterministic path-specific diagnostics for direct-edit, heredoc or shell-writer, raw-payload, and hand-edit-fallback guidance in mutation-capable skill packages and for missing CLI command mappings or undeclared mutation flags; the cli-only-yaml-policy maintenance check applies the same policy to strict main specs, technical standards, MCP tool metadata, operator documentation, and repository source code; inventory classifications preserve explicit exceptions.
    exceptions:
      - External and dependency-owned YAML, legacy .spec-driven migration input, generated caches, rendered non-YAML output, and surfaces explicitly classified as read-only or human-only in inventory/yaml-mutation-surfaces.yaml are outside automated mutation ownership.
      - Read-only YAML inspection, illustrative CLI command examples, intentionally invalid test fixtures, and documented human-manual-edit notes are permitted surfaces that the static policy checks must not flag.
  artifact-writes-validate-and-commit-atomically:
    strength: MUST
    statement: A YAML mutation MUST validate the complete candidate document, registered schema, declared relationships, confined path, and reference side effects before an atomic commit; any validation, reference, or filesystem failure MUST leave all pre-existing files unchanged and emit deterministic machine-readable diagnostics.
    rationale: Per-field checks and sequential writes can expose partial or cross-file-invalid state. Complete validation followed by one atomic boundary makes success and rollback observable and reliable.
    enforcement:
      method: test
      detail: Failure-injection and invalid-candidate regressions compare pre-write and post-failure filesystem state and assert stable structured diagnostic fields.
  artifact-creation-persists-meaningful-state-only:
    strength: MUST
    statement: A YAML creation operation MUST persist only real caller-supplied or workflow-required state; blank documents, placeholder values, and empty artifact containers MUST NOT be written, and a rejected or failed first write MUST leave the target absent.
    rationale: Placeholder scaffolds turn absence into misleading invalid state, invite direct follow-up editing, and make recovery from a failed first mutation ambiguous.
    enforcement:
      method: test
      detail: Creation regressions assert valid minimal state on success and target absence after missing input, invalid input, relationship failure, or commit failure.
  runtime-repository-evidence-is-embedded:
    strength: MUST
    statement: Repository-owned evidence a CLI command must read while running inside another project MUST be embedded in the bundled asset set and read embedded-first, with a working-tree read only as a fallback; a command MUST NOT depend on a repository path that exists only in this repository's checkout.
    rationale: The CLI is installed and run inside other projects, where this repository's working tree is absent, but every test and manual check runs from the checkout where such a path resolves. A direct working-tree read therefore passes the whole suite and fails for every installed user, and the failure surfaces only as a runtime ENOENT far from the code that introduced it. Embedding the asset and reading embedded-first makes the runtime and test environments agree.
    enforcement:
      method: test
      detail: Regressions assert embedded-first reads for commands intended to run in installed projects, and assert that a checkout-scoped maintenance command refuses deterministically instead of failing with a filesystem error when the bundled source tree is absent.
    exceptions:
      - A command declared repository-maintenance scoped may require this repository's bundled source tree, provided it is excluded from the installed-project surface and refuses with a deterministic diagnostic naming the absent source tree rather than with a raw filesystem error.
  bundled-asset-writes-regenerate-derived-output:
    strength: MUST
    statement: A mutation of a repository-bundled asset that is embedded, registered, or referenced elsewhere MUST regenerate and revalidate its derived output inside the same transaction as the source write; regeneration MUST NOT be deferred to a separate command, build step, or post-write hook.
    rationale: The embedded bundle is what every installed consumer actually reads, so a committed source edit with a stale bundle is a repository that passes file-level validation while shipping the old content. Deferring regeneration also makes rollback impossible, because the source write has already committed by the time the regeneration fails.
    enforcement:
      method: test
      detail: Regressions assert that an accepted bundled-asset write leaves source and derived output consistent, and that an injected regeneration failure leaves both byte-identical to their pre-write content.
    examples:
      good:
        - Edit a bundled scaffold through its CLI command and have the same mutation regenerate the embedded asset bundle before commit.
      bad:
        - Write the scaffold file, then rely on the caller or a later build step to regenerate the embedded bundle.
  retired-schema-fields-leave-a-tombstone:
    strength: MUST
    statement: Retiring a field from a strict artifact schema MUST remove it from the schema's required list and replace its sub-schema with a description-only permissive allowance, rather than deleting the property, unless the change explicitly decides that artifacts still carrying the field must fail validation.
    rationale: 'Every strict artifact schema sets additionalProperties: false, so deleting a property does not relax the contract — it converts a known field into an unknown key and turns a previously valid artifact into a hard validation error. Because init and migrate ship these schemas to external projects, that failure lands on artifacts this repository never sees, and stripping the field from this repository''s own artifacts in the same change hides it from every local check. A description-only tombstone keeps unknown-key rejection intact for every other key while letting the retired one pass and disappear through normal CLI writes; widening additionalProperties would relax the whole artifact instead.'
    enforcement:
      method: review
      detail: Reviewers check that a change removing a field from an artifact schema either leaves a description-only tombstone property with the field dropped from required, or records an explicit decision that artifacts carrying the field must now fail, and that regression covers an artifact still carrying the retired field.
    examples:
      good:
        - Removing the mapping contract from main-spec by dropping it from required and replacing its object sub-schema with a description naming it deprecated and ignored, plus a test asserting a residual mapping field validates and is stripped on the next CLI write.
      bad:
        - Deleting the mapping property from main-spec entirely, so every external project's specs authored before the upgrade fail schema validation as an unknown key.
  schemas-declare-contracts-in-the-enforced-dialect:
    strength: MUST
    statement: A registered strict YAML artifact schema MUST express its validation contract in the dialect the shared validator executes, so every rule the schema declares is actually checked; a validation path MUST NOT be described as validating a candidate against a declared contract when the schema behind it carries keywords the validator does not interpret.
    rationale: 'A schema of uninterpreted keywords matches every candidate, so the write reports valid while no declared rule was checked. That is strictly worse than having no validation, because the passing result is read as evidence the contract held: it is how a registry entry carrying one field out of seven was accepted by a check whose stated purpose was to reject exactly that. Keeping the declared contract and the executed contract the same document removes the gap in which a rule can be documentation.'
    enforcement:
      method: test
      detail: test/suites/foundation-and-fixtures.ts derives the governed set from the schema registry's entries rather than from the schema directory, asserts that no registered schema's contract is inexecutable, and proves the check fires by running the same predicate over a realistic fields-dialect document and observing it named.
  contract-first-families-declare-no-unshipped-operation:
    strength: MUST
    statement: A repository-owned artifact family whose registered schema ships in a change that ships no command writing it MUST declare every mutation operation as not-applicable, MUST name no CLI owner and no direct-write path, and MUST record a reference side effect naming the later change that will flip the operations a command comes to own.
    rationale: 'Every other classification asserts something the repository has not delivered: cli-owned with no named owner is refused by the inventory check as an unfalsifiable claim, direct-write names code that does not exist, and human-only reads as a deliberate policy that the family''s YAML is hand-edited, which the very next planned change contradicts. The inventory check can refuse the first two but cannot tell a truthful not-applicable from an abandoned one, so naming the change that will flip the state is what stops the classification from outliving the reason for it.'
    enforcement:
      method: review
      detail: bun run check:yaml-inventory already refuses a cli-owned operation with no registered owner and a direct-write path with no owner, and test/suites/yaml-operation-matrix.ts already requires every inventoried family to declare a reason for each not-applicable dimension; what review adds is confirming the reference side effect names the change that will flip the operations.
    examples:
      good:
        - scene-state declares create, update, named_remove, and delete as not-applicable with cli_owners and direct_write_paths empty, and records a reference side effect naming expose-scene-cli-surface as the change that flips create and update to cli-owned.
      bad:
        - A family declaring create as human-only while a named follow-up change is about to make a command own it, which reads to every later reader as a decision that the family's YAML is hand-edited.
  named-removal-prunes-the-container-it-empties:
    strength: MUST
    statement: A named-entry removal MUST also remove any grouping container the removal leaves empty — a keyed map, a nested flow, a category or area subdirectory, or a whole index whose contract requires at least one member — so the store after a removal is a state the family's own schema still accepts and a later write does not have to repair.
    rationale: 'The existing creation rule forbids writing an empty artifact container, but nothing governed the symmetric case, so removal paths were free to produce exactly the state creation is forbidden from writing. That gap is not theoretical: within one change it produced an empty scene area directory left behind after deleting the last scene in it, and a main_flow left as an empty map whose own minProperties contract then refused the next delta write. Both are invisible until a subsequent operation fails, and the failure surfaces against the innocent later write rather than the removal that caused it.'
    enforcement:
      method: test
      detail: For every family whose artifacts nest inside a keyed container or a subdirectory, a test removes the last member and asserts the emptied container is gone rather than present-and-empty, and that the immediately following write against the same family still validates.
    examples:
      good:
        - Deleting the last scene in an area removes the area directory, and deleting the last recorded scene removes the scene index too, because the scenes-index contract requires at least one area holding at least one scene.
      bad:
        - Removing the last step from a delta scene's main_flow leaves main_flow as an empty map, so the next generate call against that delta is refused by the step map's own minimum-one-entry contract.
    exceptions:
      - A container the family's contract explicitly permits to be empty is left in place, because its emptiness is declared rather than residual — the operation groups of a delta artifact are required keys whose empty value is valid and meaningful.

schema: strict-spec-driven/main-tech/v1
schema_version: 1
artifact_type: main_tech
schema_file: ../schemas/main-tech.yaml
standard:
  id: yaml-first-artifacts
  title: YAML-First Artifact Authoring
  category: architecture
mapping:
  implementation:
    - src/yaml.ts
    - src/validation.ts
    - src/scaffold.ts
    - src/architecture.ts
    - src/design-system.ts
    - src/document-render.ts
    - src/cli/cmd-generation.ts
    - src/roadmap/author.ts
    - inventory/yaml-mutation-surfaces.yaml
    - scripts/check-yaml-mutation-inventory.ts
    - package.json
  enforcement:
    - templates/strict-spec-driven/schemas/registry.yaml
    - test/suites/foundation-and-fixtures.ts
    - test/suites/architecture-document.ts
    - test/suites/design-system-document.ts
rules:
  artifacts-are-strict-yaml:
    strength: MUST
    statement: All spec-driven workflow artifacts MUST be authored as strict YAML that validates against a registered schema, not as Markdown prose or ad hoc text.
    rationale: The product constraint is deterministic, machine-validatable workflow state. Markdown prose cannot be validated, parsed, or enforced structurally, which is the whole reason the strict workflow exists.
    enforcement:
      method: ci
      detail: Schemas are registered in registry.yaml and validateArtifact enforces them; the test suite validates every primary example against its schema.
    exceptions:
      - Skill SKILL.md files remain Markdown because Agent Skills require it.
      - Human-facing repository documentation (README, guides) stays Markdown.
  scripts-own-mechanics:
    strength: MUST
    statement: Scripts MUST own filesystem mechanics, parsing, validation, and deterministic format enforcement; AI judgment belongs in skill prompts, not in scripts.
    rationale: Separating deterministic mechanics from probabilistic judgment keeps the workflow reproducible and testable, and keeps skills focused on decisions rather than file plumbing.
    enforcement:
      method: review
      detail: Reviewers reject scripts that embed product judgment or skills that hand-roll YAML mechanics.
  structured-fields-over-prose:
    strength: SHOULD
    statement: Spec-to-code links SHOULD live in structured mapping fields rather than being described in free-text prose.
    rationale: Structured mapping fields can be verified by verify-spec-mappings and verify-tech-mappings; prose cannot.
    enforcement:
      method: ci
      detail: verify-spec-mappings and verify-tech-mappings audit mapping fields.
  generated-documents-are-not-hand-edited:
    strength: MUST
    statement: A human-readable document that the workflow renders from strict YAML MUST be produced only by its generator, MUST carry a banner identifying it as generated and naming its source artifacts, and MUST NOT be edited by hand; content that belongs in such a document is changed by editing the strict YAML source and re-rendering.
    rationale: Once a document is both generated and hand-editable it has two sources of truth, and the next render silently discards the hand edits or the drift check fails for reasons nobody can attribute. Requiring the banner and forbidding hand edits keeps the YAML source authoritative and makes staleness a detectable, attributable condition rather than an invisible one. The banner is required to identify the document and name its sources but not to occupy the first line, so a document rendered in an interchange format that requires leading front matter satisfies the rule with the banner placed directly after it.
    enforcement:
      method: manual
      detail: architecture-generate --check and design-generate --check re-render in memory and exit non-zero when the file on disk differs from what the sources produce; reviewers reject direct edits to a document that carries a generated banner.
    examples:
      good:
        - Adding a component to .strict-spec-driven/architecture.yaml and running architecture-generate to re-render ARCHITECTURE.md.
        - Adding a color token to .strict-spec-driven/design-system.yaml and running design-generate to re-render DESIGN.md.
      bad:
        - Editing the components section of ARCHITECTURE.md directly, which the next architecture-generate run overwrites.
        - Editing the front-matter tokens in DESIGN.md directly instead of the design-system artifact they are rendered from.
    exceptions:
      - Hand-authored repository documentation that is not rendered from a strict YAML source, such as README.md, QUICKSTART.md, and the guide documents, remains hand-edited Markdown and carries no generated banner.
  artifact-writes-are-non-destructive:
    strength: MUST
    statement: 'An artifact-authoring command MUST confine its effect to the fields named in that invocation: restating a scalar or keyed item overwrites only that item, repeated list values append, and discarding a recorded entry MUST require a flag naming that entry. No flag may replace or clear a collection the invocation did not name, and whole-artifact rebuild MUST be a separate isolated operation rather than a mode of an editing command.'
    rationale: A single flag that both permitted a scalar edit and flipped supplied lists from append to replace destroyed recorded roadmap content, because the destructive behavior was reached by an argument combination the caller did not intend and could not see. Binding a write's effect to what the caller named removes that whole class of loss instead of renaming it, and keeps every authoring command safe to run without first reasoning about which other fields it might touch.
    enforcement:
      method: test
  yaml-mutation-surfaces-stay-inventoried:
    strength: MUST
    statement: Every repository-owned YAML or YML artifact family and every repository code, CLI, MCP, skill, or documentation mutation surface MUST remain represented in inventory/yaml-mutation-surfaces.yaml with its ownership, supported operations, reference side effects, current CLI ownership or direct-write paths, and repository evidence; the dedicated inventory check MUST fail when coverage is missing, invalid, or stale.
    rationale: The shared mutation contract and later artifact-family migrations depend on a complete evidence baseline; allowing an unclassified YAML family or mutation path would silently recreate the direct-write gaps this roadmap is intended to eliminate.
    enforcement:
      method: test
      detail: bun run check:yaml-inventory validates the matrix directly, and test/suites/foundation-and-fixtures.ts covers repository completeness and deterministic failure diagnostics.

schema: strict-spec-driven/main-tech/v1
schema_version: 1
artifact_type: main_tech
schema_file: templates/strict-spec-driven/schemas/main-tech.yaml
standard:
  id: cli-command-metadata
  title: CLI Command Metadata
  category: architecture
mapping:
  implementation:
    - src/cli/command-metadata.ts
    - src/cli/usage.ts
    - src/mcp/inventory.ts
    - src/cli/command-metadata-entries.ts
    - src/cli/argv.ts
    - src/cli/entrypoint.ts
    - src/cli/cmd-generation.ts
    - src/yaml-mutation-surface.ts
  enforcement:
    - test/suites/entrypoint-and-skills.ts
    - test/suites/change-lifecycle.ts
rules:
  single-source-command-descriptions:
    strength: MUST
    statement: Every registered strict CLI command MUST have an entry in the shared command-metadata registry, and root help, subcommand help, JSON help, and the MCP capability inventory MUST derive their command descriptions from that registry rather than from inline string literals.
    rationale: Command descriptions were previously duplicated between per-module usage literals and src/mcp/inventory.ts, or absent entirely, so the surfaces drifted and agents could not learn a command's behavior from the CLI itself; a single typed source keeps every surface consistent and lets a completeness test fail when a new command ships without metadata.
    enforcement:
      method: test
  help-describes-argument-semantics:
    strength: MUST
    statement: A command-metadata entry MUST document each accepted flag's meaning together with its required, repeatable, removal, and delete semantics, plus the command's output keys and exit-code meaning; describing operational semantics only in skill prompts instead of the metadata registry is not sufficient.
    rationale: Agents invoke the strict CLI without a skill prompt loaded, and semantics such as whether a repeated list flag appends or a restated scalar overwrites, which single entry a removal flag targets, the fact that the delete flag removes a whole artifact and cannot be combined with other flags, and the fact that a ready:false result is a successful write rather than a failure are exactly the facts that cause incorrect retries when they are undiscoverable from --help.
    enforcement:
      method: test
  authoring-metadata-names-artifact-assets:
    strength: MUST
    statement: The shared command-metadata registry MUST expose, for every CLI command that authors repository-owned YAML, the artifact kinds it writes together with each artifact's bundled schema key, declared schema_file path, and bundled example key, derived from the mutation inventory's declared CLI owners rather than restated per command; text help, machine-readable help, and MCP tool descriptions MUST render that single source, and MUST route callers to schema-show and sample-show instead of inlining schema or example content.
    rationale: An agent that discovers a command from help still has to guess the artifact's field shape, and guessing is exactly what produces invalid candidates and retry loops. Deriving the artifact kinds from the inventory that already owns CLI ownership prevents a metadata entry from claiming coverage the repository does not record and keeps every help surface consistent as families gain or lose owners, while naming only keys avoids duplicating asset content that would drift from the bundled files.
    enforcement:
      method: test
  help-surfaces-render-the-whole-artifact-projection:
    strength: MUST
    statement: Every help surface that describes a YAML-authoring command MUST render the whole derived artifact-surface projection its medium can carry — asset keys and paths, supported operations with owning commands, refused deletions, cross-file effects, discovery and inspection commands, and shared schema cache state — and a surface that can carry only part of it MUST name the command that returns the rest; no surface may silently omit a projection field, and no surface may restate a projection fact from its own literal.
    rationale: 'The registry already prevented divergent command descriptions, but nothing prevented a surface from rendering a subset: text help and MCP tool descriptions printed artifact kinds while the same projection''s schema keys, paths, and example keys reached only JSON help, so what an agent could discover depended on which surface it happened to read. Requiring whole-projection rendering with an explicit named follow-up turns a silent omission into a visible routing decision, and forbidding surface-local literals keeps the completeness test able to prove agreement by comparing every surface against one source.'
    enforcement:
      method: test

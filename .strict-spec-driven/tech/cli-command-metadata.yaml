schema: strict-spec-driven/main-tech/v1
schema_version: 1
artifact_type: main_tech
schema_file: templates/strict-spec-driven/schemas/main-tech.yaml
standard:
  id: cli-command-metadata
  title: CLI Command Metadata
  category: architecture
rules:
  single-source-command-descriptions:
    strength: MUST
    statement: Every registered strict CLI command MUST have an entry in the shared command-metadata registry, and root help, subcommand help, JSON help, and the MCP capability inventory MUST derive their command descriptions from that registry rather than from inline string literals.
    rationale: Command descriptions were previously duplicated between per-module usage literals and src/mcp/inventory.ts, or absent entirely, so the surfaces drifted and agents could not learn a command's behavior from the CLI itself; a single typed source keeps every surface consistent and lets a completeness test fail when a new command ships without metadata.
    enforcement:
      method: test
  help-describes-argument-semantics:
    strength: MUST
    statement: A command-metadata entry MUST document each accepted flag's meaning together with its required, repeatable, removal, and delete semantics, plus the command's output keys and exit-code meaning; describing operational semantics only in skill prompts instead of the metadata registry is not sufficient.
    rationale: Agents invoke the strict CLI without a skill prompt loaded, and semantics such as whether a repeated list flag appends or a restated scalar overwrites, which single entry a removal flag targets, the fact that the delete flag removes a whole artifact and cannot be combined with other flags, and the fact that a ready:false result is a successful write rather than a failure are exactly the facts that cause incorrect retries when they are undiscoverable from --help.
    enforcement:
      method: test
  authoring-metadata-names-artifact-assets:
    strength: MUST
    statement: The shared command-metadata registry MUST expose, for every CLI command that authors repository-owned YAML, the artifact kinds it writes together with each artifact's bundled schema key, declared schema_file path, and bundled example key, derived from the mutation inventory's declared CLI owners rather than restated per command; text help, machine-readable help, and MCP tool descriptions MUST render that single source, and MUST route callers to schema-show and sample-show instead of inlining schema or example content.
    rationale: An agent that discovers a command from help still has to guess the artifact's field shape, and guessing is exactly what produces invalid candidates and retry loops. Deriving the artifact kinds from the inventory that already owns CLI ownership prevents a metadata entry from claiming coverage the repository does not record and keeps every help surface consistent as families gain or lose owners, while naming only keys avoids duplicating asset content that would drift from the bundled files.
    enforcement:
      method: test
  help-surfaces-render-the-whole-artifact-projection:
    strength: MUST
    statement: Every help surface that describes a YAML-authoring command MUST render the whole derived artifact-surface projection its medium can carry — asset keys and paths, supported operations with owning commands, refused deletions, cross-file effects, discovery and inspection commands, and shared schema cache state — and a surface that can carry only part of it MUST name the command that returns the rest; no surface may silently omit a projection field, and no surface may restate a projection fact from its own literal.
    rationale: 'The registry already prevented divergent command descriptions, but nothing prevented a surface from rendering a subset: text help and MCP tool descriptions printed artifact kinds while the same projection''s schema keys, paths, and example keys reached only JSON help, so what an agent could discover depended on which surface it happened to read. Requiring whole-projection rendering with an explicit named follow-up turns a silent omission into a visible routing decision, and forbidding surface-local literals keeps the completeness test able to prove agreement by comparing every surface against one source.'
    enforcement:
      method: test
  authoring-protocol-has-one-source:
    strength: MUST
    statement: The ordered AI YAML authoring protocol steps and their terminal missing-capability behavior MUST be declared in exactly one typed module. Every AI-facing surface that resolves the protocol at request time -- CLI text output, machine-readable output, and the MCP capability surface -- MUST render that module rather than restating a step, its order, or the no-fallback boundary from a surface-local literal. A surface that is delivered as static text and cannot execute at load time is governed instead by the static-surface rule, which requires a checked restatement.
    rationale: The original statement bound every AI-facing surface to runtime rendering, which no statically packaged skill file can satisfy, so a skill either carried no protocol text or violated the rule. Scoping this rule to request-time surfaces and routing static text to its own rule keeps the typed module authoritative for both without leaving one rule that forbids what another requires.
    enforcement:
      method: review
      detail: Request-time surfaces execute code that can call the protocol module; static surfaces are packaged text an agent loads before any command runs.
  skill-packages-are-static-protocol-surfaces:
    strength: MUST
    statement: A bundled skill package that directs a CLI-owned YAML mutation is an AI-facing protocol surface that cannot render the protocol module at load time, so it MUST name the artifact kinds it writes, the 'strict-spec-cli yaml-authoring-protocol <artifact-kind>' command that renders the ordered steps and the bound owning, schema, example, and validation commands, its own artifact validation command, and the verbatim no-fallback boundary statement; it MUST NOT restate the ordered step titles or its per-artifact schema-show and sample-show lookups, and an automated check MUST fail when a mutation-capable skill omits the pointer command, its artifact kind, its validation command, or the boundary statement, or restates a step title.
    rationale: 'The previous form required each skill to restate the seven step titles and its per-kind lookups, which put 1088 lines of hand-copied rendering across 34 skills and made the typed module authoritative only in name: the copies could not carry the cache-resolved schema and example paths the command reports, and a stale copy in strict-spec-bugfix already pointed at a skill that does not exist. Restatement is retained only for the boundary, because that is the one instruction an agent must have before it decides whether to run any command at all; the steps matter only once mutation has begun, which is exactly when the command is available to render them. The drift check therefore moves from step-title equality to pointer presence, which is enforceable against a skill that carries no copy.'
    enforcement:
      method: test
      detail: src/skills/content.ts derives the governed set from the mutation inventory rather than from the guidance text and reports one diagnostic per missing element, with the expected artifact kinds read from inventory/yaml-mutation-surfaces.yaml and the boundary and step titles read from the typed protocol module in src/yaml-authoring-protocol.ts; test/suites/entrypoint-and-skills.ts asserts the pointer form for every mutation-capable skill, sweeps every bundled skill for a surviving step title, and drives each diagnostic through a realistic negative case so a check that has stopped firing fails rather than passing silently.
  blocking-diagnostics-name-how-to-apply-each-remedy:
    strength: MUST
    statement: 'A diagnostic that blocks a workflow gate MUST state how to apply every remedy it names, not merely that the remedy exists: for each remedy, the artifact it writes and a runnable command with the target''s identifiers already filled in, plus the source to consult for any identifier the caller must still supply. When a remedy is accepted only for a fixed set of values, the diagnostic MUST name that set and MUST derive it from the same declaration the check evaluates, never from a surface-local literal. Naming an alternative remedy in an expected, actual, or suggestion field without naming its command does not satisfy this rule.'
    rationale: An agent running the CLI in an installed project cannot read its source, so a remedy named without the means to apply it is not actionable there at all; the observed responses are to skip the gate or to fabricate the artifact the other remedy would have avoided, both of which corrupt state the gate exists to protect. Deriving a fixed accepted-value set from the check's own declaration keeps a later edit from leaving guidance that advertises a value the check rejects, a disagreement that is silent because both sides still validate.
    enforcement:
      method: review
      detail: Reviewing a change that adds or edits a workflow-gating diagnostic, confirm each named remedy carries a runnable command and that any accepted-value set in the text is built from the constant the check reads rather than restated. Prose remedies are not mechanically decidable, so this is a review rule rather than an automated scan; the per-diagnostic regressions that assert message content are the supporting evidence.
    examples:
      good:
        - The missing-delta-spec readiness diagnostic states remedy A with the generate delta-spec command and .strict-spec-driven/specs/INDEX.yaml as the source of valid target ids, states remedy B with the generate design command, and builds its accepted decision id list by iterating EMPTY_SPEC_DECISION_IDS.
      bad:
        - A diagnostic reporting expected 'answered_by human or roadmap' or expected 'resolved or blocked' while naming neither the command nor the flag that sets the field to an accepted value.
    exceptions:
      - A non-gating advisory warning whose resolution is a human judgement about intent rather than an artifact edit, such as the harness doctor cross-environment port warning, which asks for confirmation that a shared port is intentional and has no command to name.
  skill-guidance-states-each-shared-instruction-once:
    strength: MUST
    statement: 'An instruction that every bundled skill must carry MUST appear at most once per skill file and MUST NOT be restated in a second section of the same file; when one of the copies is the section a shipped check reads, that copy is the one retained and the other MUST be removed rather than shortened, and an automated check MUST fail naming the offending skill when a skill restates it. The rule constrains repetition, not placement: a skill stating the instruction in exactly one section complies regardless of which section that is.'
    rationale: 'A second copy of an instruction in the same file is not redundancy that costs only lines: it is a copy no check reads, which is the state the workflow-state precondition was in across 35 of 37 skills while validateStrictWorkflowStateGuidance enforced only the Steps form. An unenforced copy can drift from the enforced one without failing anything, and a reader who trusts the wrong copy gets the stale instruction, the same failure mode that left strict-spec-bugfix pointing at a skill that does not exist. Shortening a duplicate preserves that failure mode at a discount, so the rule requires removal. Placement is deliberately left unconstrained: the four committed policy fixtures under test/fixtures/policy-skills/ state the precondition only under Prerequisites and are driven through the shipped validate-skills asserting their seeded violation and nothing else, so a rule mandating the Steps section would put compliant single-copy files in violation and force unrelated fixture rewrites to satisfy a constraint the defect never required.'
    enforcement:
      method: test
      detail: src/skills/content.ts derives the governed set from a scan of skills/ rather than a hand-enumerated list and reports one diagnostic per skill that restates an instruction another section of the same file already carries; test/suites/entrypoint-and-skills.ts drives the shipped validate-skills command through a committed negative fixture that reintroduces the duplicate and observes the failure naming the offending skill path, through a positive fixture carrying a skill-specific precondition that must pass, and through the four existing policy fixtures to confirm each still reports its seeded violation and nothing else.
  guidance-names-only-packaged-skills:
    strength: MUST
    statement: Guidance that ships to an agent or operator — a bundled skill, operator documentation, or a source-level diagnostic message — MUST NOT name a skill package that does not exist under skills/, and an automated check MUST scan that shipped scope and fail naming both the offending file and the missing skill. A file whose purpose is to assert a deleted skill's absence, such as a removal sweep test, is outside the scanned scope rather than an exception inside it, and the banned name MUST NOT be added to the check's allowlist, because an allowlist entry silences the real finding as well as the fixture.
    rationale: 'A skill name that resolves to nothing fails no check on its own: the slash command is simply missing when someone types it, so the reference rots silently. strict-spec-bugfix routed unclear issues to strict-spec-debug-session across several milestones, and a main spec MUST requirement and a validate-skills expectation both pinned that retired name, so the stale reference had propagated into the contract before anything noticed. Deleting or renaming a skill is routine, and without a standing check every such deletion reopens the same failure mode.'
    enforcement:
      method: test
      detail: A regression test walks skills/, root-level operator documentation, and src/, matching a skill name preceded by a backtick, a slash, or 'skills/', and compares each match against the skill directories discovered on disk and a short allowlist of non-skill identifiers that share the prefix. The check proves a negative case on synthetic input before trusting a clean scan, and asserts that no allowlist entry has outlived the reference that earned it.
    examples:
      good:
        - skills/strict-roadmap-plan/SKILL.md routing a reader to `/strict-roadmap-transition` with the `reorder` operation, a skill package that exists under skills/.
      bad:
        - skills/strict-spec-bugfix/SKILL.md routing unclear investigations to `strict-spec-debug-session`, a skill package that does not exist in this repository.
    exceptions:
      - Test suites that assert a deleted skill's absence, and .strict-spec-driven/ workflow state recording which skills existed when a change was archived, both name retired skills as statements of fact rather than routing instructions and are outside the scanned scope.

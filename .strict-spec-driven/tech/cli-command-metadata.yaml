schema: strict-spec-driven/main-tech/v1
schema_version: 1
artifact_type: main_tech
schema_file: templates/strict-spec-driven/schemas/main-tech.yaml
standard:
  id: cli-command-metadata
  title: CLI Command Metadata
  category: architecture
rules:
  single-source-command-descriptions:
    strength: MUST
    statement: Every registered strict CLI command MUST have an entry in the shared command-metadata registry, and root help, subcommand help, JSON help, and the MCP capability inventory MUST derive their command descriptions from that registry rather than from inline string literals.
    rationale: Command descriptions were previously duplicated between per-module usage literals and src/mcp/inventory.ts, or absent entirely, so the surfaces drifted and agents could not learn a command's behavior from the CLI itself; a single typed source keeps every surface consistent and lets a completeness test fail when a new command ships without metadata.
    enforcement:
      method: test
  help-describes-argument-semantics:
    strength: MUST
    statement: A command-metadata entry MUST document each accepted flag's meaning together with its required, repeatable, removal, and delete semantics, plus the command's output keys and exit-code meaning; describing operational semantics only in skill prompts instead of the metadata registry is not sufficient.
    rationale: Agents invoke the strict CLI without a skill prompt loaded, and semantics such as whether a repeated list flag appends or a restated scalar overwrites, which single entry a removal flag targets, the fact that the delete flag removes a whole artifact and cannot be combined with other flags, and the fact that a ready:false result is a successful write rather than a failure are exactly the facts that cause incorrect retries when they are undiscoverable from --help.
    enforcement:
      method: test
  authoring-metadata-names-artifact-assets:
    strength: MUST
    statement: The shared command-metadata registry MUST expose, for every CLI command that authors repository-owned YAML, the artifact kinds it writes together with each artifact's bundled schema key, declared schema_file path, and bundled example key, derived from the mutation inventory's declared CLI owners rather than restated per command; text help, machine-readable help, and MCP tool descriptions MUST render that single source, and MUST route callers to schema-show and sample-show instead of inlining schema or example content.
    rationale: An agent that discovers a command from help still has to guess the artifact's field shape, and guessing is exactly what produces invalid candidates and retry loops. Deriving the artifact kinds from the inventory that already owns CLI ownership prevents a metadata entry from claiming coverage the repository does not record and keeps every help surface consistent as families gain or lose owners, while naming only keys avoids duplicating asset content that would drift from the bundled files.
    enforcement:
      method: test
  help-surfaces-render-the-whole-artifact-projection:
    strength: MUST
    statement: Every help surface that describes a YAML-authoring command MUST render the whole derived artifact-surface projection its medium can carry — asset keys and paths, supported operations with owning commands, refused deletions, cross-file effects, discovery and inspection commands, and shared schema cache state — and a surface that can carry only part of it MUST name the command that returns the rest; no surface may silently omit a projection field, and no surface may restate a projection fact from its own literal.
    rationale: 'The registry already prevented divergent command descriptions, but nothing prevented a surface from rendering a subset: text help and MCP tool descriptions printed artifact kinds while the same projection''s schema keys, paths, and example keys reached only JSON help, so what an agent could discover depended on which surface it happened to read. Requiring whole-projection rendering with an explicit named follow-up turns a silent omission into a visible routing decision, and forbidding surface-local literals keeps the completeness test able to prove agreement by comparing every surface against one source.'
    enforcement:
      method: test
  authoring-protocol-has-one-source:
    strength: MUST
    statement: The ordered AI YAML authoring protocol steps and their terminal missing-capability behavior MUST be declared in exactly one typed module. Every AI-facing surface that resolves the protocol at request time -- CLI text output, machine-readable output, and the MCP capability surface -- MUST render that module rather than restating a step, its order, or the no-fallback boundary from a surface-local literal. A surface that is delivered as static text and cannot execute at load time is governed instead by the static-surface rule, which requires a checked restatement.
    rationale: The original statement bound every AI-facing surface to runtime rendering, which no statically packaged skill file can satisfy, so a skill either carried no protocol text or violated the rule. Scoping this rule to request-time surfaces and routing static text to its own rule keeps the typed module authoritative for both without leaving one rule that forbids what another requires.
    enforcement:
      method: review
      detail: Request-time surfaces execute code that can call the protocol module; static surfaces are packaged text an agent loads before any command runs.
  skill-packages-are-static-protocol-surfaces:
    strength: MUST
    statement: A bundled skill package that directs a CLI-owned YAML mutation is an AI-facing protocol surface that cannot render the protocol module at load time, so it MUST name the artifact kinds it writes, the 'strict-spec-cli yaml-authoring-protocol <artifact-kind>' command that renders the ordered steps and the bound owning, schema, example, and validation commands, its own artifact validation command, and the verbatim no-fallback boundary statement; it MUST NOT restate the ordered step titles or its per-artifact schema-show and sample-show lookups, and an automated check MUST fail when a mutation-capable skill omits the pointer command, its artifact kind, its validation command, or the boundary statement, or restates a step title.
    rationale: 'The previous form required each skill to restate the seven step titles and its per-kind lookups, which put 1088 lines of hand-copied rendering across 34 skills and made the typed module authoritative only in name: the copies could not carry the cache-resolved schema and example paths the command reports, and a stale copy in strict-spec-bugfix already pointed at a skill that does not exist. Restatement is retained only for the boundary, because that is the one instruction an agent must have before it decides whether to run any command at all; the steps matter only once mutation has begun, which is exactly when the command is available to render them. The drift check therefore moves from step-title equality to pointer presence, which is enforceable against a skill that carries no copy.'
    enforcement:
      method: test
      detail: src/skills/content.ts derives the governed set from the mutation inventory rather than from the guidance text and reports one diagnostic per missing element, with the expected artifact kinds read from inventory/yaml-mutation-surfaces.yaml and the boundary and step titles read from the typed protocol module in src/yaml-authoring-protocol.ts; test/suites/entrypoint-and-skills.ts asserts the pointer form for every mutation-capable skill, sweeps every bundled skill for a surviving step title, and drives each diagnostic through a realistic negative case so a check that has stopped firing fails rather than passing silently.
  blocking-diagnostics-name-how-to-apply-each-remedy:
    strength: MUST
    statement: 'A diagnostic that blocks a workflow gate MUST state how to apply every remedy it names, not merely that the remedy exists: for each remedy, the artifact it writes and a runnable command with the target''s identifiers already filled in, plus the source to consult for any identifier the caller must still supply. When a remedy is accepted only for a fixed set of values, the diagnostic MUST name that set and MUST derive it from the same declaration the check evaluates, never from a surface-local literal. Naming an alternative remedy in an expected, actual, or suggestion field without naming its command does not satisfy this rule.'
    rationale: An agent running the CLI in an installed project cannot read its source, so a remedy named without the means to apply it is not actionable there at all; the observed responses are to skip the gate or to fabricate the artifact the other remedy would have avoided, both of which corrupt state the gate exists to protect. Deriving a fixed accepted-value set from the check's own declaration keeps a later edit from leaving guidance that advertises a value the check rejects, a disagreement that is silent because both sides still validate.
    enforcement:
      method: review
      detail: Reviewing a change that adds or edits a workflow-gating diagnostic, confirm each named remedy carries a runnable command and that any accepted-value set in the text is built from the constant the check reads rather than restated. Prose remedies are not mechanically decidable, so this is a review rule rather than an automated scan; the per-diagnostic regressions that assert message content are the supporting evidence.
    examples:
      good:
        - The missing-delta-spec readiness diagnostic states remedy A with the generate delta-spec command and .strict-spec-driven/specs/INDEX.yaml as the source of valid target ids, states remedy B with the generate design command, and builds its accepted decision id list by iterating EMPTY_SPEC_DECISION_IDS.
      bad:
        - A diagnostic reporting expected 'answered_by human or roadmap' or expected 'resolved or blocked' while naming neither the command nor the flag that sets the field to an accepted value.
    exceptions:
      - A non-gating advisory warning whose resolution is a human judgement about intent rather than an artifact edit, such as the harness doctor cross-environment port warning, which asks for confirmation that a shared port is intentional and has no command to name.
  skill-guidance-states-each-shared-instruction-once:
    strength: MUST
    statement: 'An instruction that every bundled skill must carry MUST appear at most once per skill file and MUST NOT be restated in a second section of the same file, whichever two sections those are; when one of the copies is the section a shipped check reads, that copy is the one retained and the other MUST be removed rather than shortened, and an automated check MUST fail naming the offending skill when a skill restates it. The rule constrains repetition, not placement: a skill stating the instruction in exactly one section complies regardless of which section that is, and the section that declares the skill''s commands is a reference rather than a statement.'
    rationale: 'A second copy of an instruction in the same file is not redundancy that costs only lines: it is a copy no check reads, which is the state the workflow-state precondition was in across 35 of 37 skills while validateStrictWorkflowStateGuidance enforced only the Steps form. An unenforced copy can drift from the enforced one without failing anything, and a reader who trusts the wrong copy gets the stale instruction, the same failure mode that left strict-spec-bugfix pointing at a skill that does not exist. Keying the check to one section name reproduces the defect one level up: it enforces a narrower rule than the one recorded, so a duplicate between any other pair of sections is exactly as invisible as the original duplicate was.'
    enforcement:
      method: test
      detail: src/skills/content.ts splits a skill file into its level-two sections, excludes the declared commands block, and reports one diagnostic per shared instruction stated in more than one of the remaining sections, matching on the distinctive prose of the instruction rather than on a command name that the governed text also references for unrelated reasons; test/suites/entrypoint-and-skills.ts drives the shipped validate-skills command through a committed negative fixture that restates the instruction outside Prerequisites and observes the failure naming the offending skill path, through a positive fixture carrying a skill-specific precondition that must pass, and through the existing policy fixtures to confirm each still reports its seeded violation and nothing else.
  guidance-names-only-packaged-skills:
    strength: MUST
    statement: Guidance that ships to an agent or operator MUST NOT name a skill package that does not exist under skills/. In the routing surfaces — bundled skills and operator documentation — the reference MUST be recognized whether it is written as a slash command, a backticked name, or a bare prose mention, because all three read to the reader as a command they can type. In source files the prefixed forms are the governed ones, since a comment naming a deleted skill while explaining that it was deleted states a fact rather than routing anyone. The bundled-skill portion of that scope MUST be enforced by the shipped skill validation command so a consuming project observes the failure, and the wider scope of operator documentation and source MUST additionally be scanned by an automated check that fails naming both the offending file and the missing skill. Text whose purpose is to state that a name is retired — a removal sweep test, or a marked retirement section of an upgrade note — MUST be placed outside the scanned scope rather than excused inside it, and the banned name MUST NOT be added to the check's allowlist, because an allowlist entry is global and silences the real routing reference as well as the fixture.
    rationale: 'A skill name that resolves to nothing fails no check on its own: the slash command is simply missing when someone types it, so the reference rots silently. Enforcing it only from this repository''s regression suite leaves every consuming project unprotected, which is the same gap the preferred-human-language guidance was in, and it conflicts with policy-enforcement-proven-through-shipped-entry-point, which states that a module-level scan is supporting evidence only for a policy that blocks a class of authored guidance. Requiring the bare-mention form in the routing surfaces closes the second half of the gap, and confining it there keeps the rule aimed at misdirection rather than at prose: the same sentence that would mislead a reader inside a skill is ordinary technical commentary inside a source comment. The retirement carve-out is a scope rule rather than an allowlist for the same reason the rule already prefers scope: it is placed deliberately, reaches only to the next heading, and cannot silence the name anywhere else in the document.'
    enforcement:
      method: test
      detail: The shipped skill validation command derives the valid skill-name set from the package directories it already discovers under skills/ and reports one diagnostic per reference to a name absent from that set, carrying the SKILL.md path, the reference line, and the missing name; a committed negative fixture package under test/fixtures/guidance-skills/ is driven through that shipped command, alongside the seeded bundled set, and observed to exit non-zero, with the paired control run attributing the failure to the one offending line. A regression test additionally walks skills/, root-level operator documentation, and src/ with the matcher form each surface declares, proves both forms fire on synthetic input assembled at runtime before trusting a clean scan, asserts the source form still matches a diagnostic string that routes a reader, proves the retirement marker silences its own section and nothing past the next heading, and asserts that no allowlist entry has outlived the reference that earned it.
    examples:
      good:
        - skills/strict-roadmap-plan/SKILL.md routing a reader to `/strict-roadmap-transition` with the `reorder` operation, a skill package that exists under skills/.
      bad:
        - A bundled skill sentence naming strict-roadmap-reorder without a backtick or slash, which reads to an operator as a live slash command while no such package exists.
    exceptions:
      - Source comments that name a deleted skill while stating that it was deleted, test suites that assert a deleted skill's absence, marked retirement sections of operator upgrade notes, and .strict-spec-driven/ workflow state recording which skills existed when a change was archived, all name retired skills as statements of fact rather than routing instructions.
  delegating-skills-do-not-restate-the-delegated-procedure:
    strength: MUST
    statement: 'A bundled skill that delegates a lifecycle phase to the skill that owns it MUST NOT also restate that phase''s procedure. The delegation MUST name the owning skill in a form the packaged-skill reference check already recognizes, and the shipped skill validation command MUST fail, naming the delegating skill, the restated content, and the owning skill, when a declared delegation coexists with a restatement of the same procedure. The rule''s subject is the delegating skill only: a skill that owns and performs a phase itself is outside the rule, and stating a procedure it owns is never a violation. Content the delegating skill states that its owning skill does not state is an increment rather than a restatement, and MUST be retained in the delegating skill rather than merged into the owner.'
    rationale: strict-spec-auto restated procedure owned by propose, apply, review, and archive. Part of that restatement was verbatim and part had diverged into an independent wording covering the same procedure, so the same instruction acquired several uncoordinated statements with no way to tell a deliberate difference from a missed synchronization. Forbidding restatement only where a delegation is declared leaves each procedure with exactly one statement while keeping every owning skill self-sufficient when invoked directly. Scoping the rule to owners instead would make five existing skills violations at introduction and force either merging entry points or rewriting them, both of which this change excludes.
    enforcement:
      method: test
      detail: The shipped skill validation command resolves each declared delegation and compares whitespace-normalized text, failing when the delegating skill restates content its declared owner also states. The negative case removes the delegation from the real skill file and observes the diagnostic; the positive case observes each matcher category firing on realistic input. The governed set is derived by scanning the bundled skills rather than from a hand-maintained list.
    examples:
      good:
        - 'strict-spec-auto names strict-spec-propose as authoritative for the proposal-phase procedure and states only its own increments: resuming an existing populated scaffold without regenerating planning artifacts, and carrying roadmap planned-change provenance forward as intake evidence.'
      bad:
        - strict-spec-auto names strict-spec-propose as authoritative for the proposal phase and still carries its own copy of the generate tasks CLI usage block that strict-spec-propose states.
    exceptions:
      - 'A skill that owns and performs a lifecycle phase is not governed: strict-spec-propose, strict-spec-brainstorm, strict-spec-bugfix, strict-spec-review, and strict-roadmap-recommend state procedures they own and declare no delegation, so the rule does not reach them.'
      - The committed policy fixtures under the validation test fixtures directory declare no delegation and are therefore outside the rule; this change asserts that rather than assuming it.
  delegable-obligation-checks-accept-a-delegation:
    strength: MUST
    statement: A per-skill content check that governs an obligation the delegation registry declares delegable MUST accept a checked delegation as satisfying it, excusing the delegating skill from stating the guidance inline once the delegation-target check confirms the named owner states every element. The requirement the check enforces MUST carry the same two branches, so the contract and the check agree on what satisfies the obligation. A check that governs a delegable obligation while admitting only inline statement is the defect this rule names, because it forces a delegating skill to restate exactly the procedure the no-restatement rule forbids it from restating.
    rationale: 'The two rules already in force pull in opposite directions unless every governing check has the escape: a delegating skill must not restate a delegated procedure, yet a check without an escape fails that same skill for not restating it. The task-order guidance check sat in that contradiction and was the only reason strict-spec-brainstorm could not delegate task-list authoring, costing 24 lines of pure restatement until the escape was added. Recording the rule keeps the next per-skill check from reintroducing the same block.'
    enforcement:
      method: review
      detail: Review confirms, for each per-skill content check that governs an obligation listed in the delegable-obligation registry, that the check returns early on a parsed delegation declaration and that the requirement behind it states both the inline and the delegated branch.
    examples:
      good:
        - The requirement-interrogation, review-independence, and task-order guidance checks each return early when the skill declares the matching delegation, and each requirement states that a skill may satisfy it by stating the guidance or by a checked delegation.
      bad:
        - A check that fails a skill for omitting placement guidance the skill has delegated to its owner, so the only way to pass is to restate a procedure the delegating-skills rule forbids restating.

schema: strict-spec-driven/main-tech/v1
schema_version: 1
artifact_type: main_tech
schema_file: ../schemas/main-tech.yaml
standard:
  id: workflow-scope-discipline
  title: Workflow Scope Discipline
  category: architecture
rules:
  contract-first-scope-changes:
    strength: MUST
    statement: When a change alters a workflow contract — a registered schema, a main or delta spec, or a technical standard — the corresponding strict artifact MUST be updated first; implementation code MUST NOT silently widen workflow scope ahead of the contract it depends on.
    rationale: The strict workflow's value is that deterministic, machine-validatable artifacts describe the contract before code implements it. Letting code lead the contract reintroduces the ad hoc drift the workflow exists to prevent and breaks the audit trail that verify and archive rely on.
    enforcement:
      method: review
      detail: Reviewers reject code changes that broaden schema, spec, or tech contracts without a matching delta-spec or delta-tech artifact updated in the same strict change.
    examples:
      good:
        - A change that adds a new CLI flag first adds the delta-spec requirement and (if it sets a new convention) a delta-tech rule, then implements the flag to match.
      bad:
        - Editing src/ to support a new artifact field while leaving the schema and specs unchanged.
    exceptions:
      - Non-contract refactors that preserve existing schema, spec, and tech behavior need no artifact update.
  roadmap-commands-do-not-write-change-artifacts:
    strength: MUST
    statement: 'Roadmap commands MUST NOT create, modify, or delete any artifact under .strict-spec-driven/changes/, with one exception: roadmap-recommend --create MAY reserve an empty change container — the change directory and its empty specs directory, holding no file — named exactly the planned change id it recommends, through the same reservation boundary propose uses. No roadmap command may write a planning, delta, or scene artifact. When a roadmap operation leaves a change artifact''s roadmap linkage stale or otherwise inconsistent, the command MUST report the drift as a non-blocking warning naming the command that repairs it rather than writing the change artifact itself.'
    rationale: 'Roadmap state and change state are separate domains reconciled by derivation: change state is derived from change directory names, and roadmap commands own only roadmap artifacts. A roadmap command that wrote change artifacts would let roadmap operations bypass the change workflow''s validation, apply, and verify gates. Reserving an empty container is the one write that serves derivation rather than bypassing it: the directory name is the join key roadmap status matches on, and letting the command that selected the planned change also name the container removes the agent-chosen name that stranded planned changes after archive. The container holds no artifact, so every gate the change workflow owns still applies to everything written into it.'
    enforcement:
      method: review
      detail: Reviewers reject roadmap command implementations that write, rename, or delete files under .strict-spec-driven/changes/, other than roadmap-recommend --create reserving an empty container through reserveChangeContainer, and require a reported warning naming the repair command instead.
    examples:
      good:
        - roadmap-move-planned-change warns that an active strict change still records the previous milestone and names the generate proposal command that refreshes the linkage.
        - roadmap-recommend --create reserves .strict-spec-driven/changes/<recommended-id>/specs/ and reports it, leaving proposal authoring to generate.
      bad:
        - A roadmap command silently rewriting proposal.yaml roadmap.milestone for an active change while moving its planned change.
        - roadmap-recommend --create writing a proposal.yaml seeded from the planned-change summary.
    exceptions:
      - roadmap-recommend --create reserving an empty change container named after the recommended planned change id.
  roadmap-dependency-targets-resolve-against-one-universe:
    strength: MUST
    statement: Every roadmap consumer that decides whether a planned-change depends_on target exists MUST resolve it against the shared universe of active planned-change ids unioned with the ids loaded from the roadmap archive, obtained from the loader that already computes that set. A consumer MUST NOT build its own dependency-target universe from active roadmap state alone, and MUST NOT re-derive archived membership by parsing archived artifacts.
    rationale: roadmap-archive relocates completed work instead of deleting it, so archive membership is part of what it means for a dependency target to exist. Cross-file validation already unioned the archive in, while roadmap-recommend resolved against active state only; the two rules disagreed silently and stalled recommendation for every planned change downstream of an archived milestone. Nothing failed loudly, because each consumer was internally consistent. One shared universe is what makes archiving a milestone a safe operation for the work that depends on it.
    enforcement:
      method: review
      detail: Reviewers reject a roadmap consumer that resolves dependency targets from active planned-change state alone, or that opens archived artifacts to re-derive completion. New consumers take the archived id set as an explicit parameter from a caller that loaded it once per command invocation.
    examples:
      good:
        - recommendRoadmapChange resolves depends_on against the active planned-change status index plus the archived id set that loadRoadmapStatusContext already loaded for cross-file validation.
      bad:
        - A new roadmap command builds a dependency index from the active milestones it just walked, so a target that was archived reads as missing and blocks the dependent work.
    exceptions:
      - Code that reports on archived history itself, rather than deciding whether an active dependency target is satisfied.
  archive-merge-failures-surface-in-verify:
    strength: SHOULD
    statement: A merge that archive performs across more than one artifact family SHOULD be fully evaluated by verify, so a merge archive would refuse is rejected before archive writes any family. Archive applies its family merges in sequence without a transaction spanning them, so a refusal raised inside a later stage leaves the earlier stages already written and the change still active.
    rationale: Archive writes main specs, then technical standards, then scenes. A refusal raised in a later stage cannot undo the earlier writes, so the repository is left holding a partial merge that no command reverses and that the operator must reconcile by hand. Evaluating the merge during verify costs one extra dry run and turns that partial-write hazard into an ordinary blocking diagnostic the author can act on.
    enforcement:
      method: test
      detail: For the scene family this is collectSceneCoverageDiagnostics, which plans the merge, validates each merged scene against the scene schema, and reports the result as a verify diagnostic; archive then performs the same merge knowing it will succeed. The spec and technical-standard merges do not yet do this, which is why the rule is a default rather than an absolute.
    examples:
      good:
        - verify plans the delta scene merge, finds the merged scene would leave a required exception flow empty, and exits non-zero naming the scene and the remedy; archive refuses and the main specs are untouched
      bad:
        - archive merges the delta specs, writes them, then throws inside the scene merge, leaving merged specs on disk with the change still active
  shared-name-classification-registry:
    strength: SHOULD
    statement: When more than one check classifies a name against the same family of allowed values — skill name prefixes, artifact kinds, categories, or status values — those checks SHOULD resolve the family from one exported registry rather than each carrying its own literal copy, and any operator-facing expected value SHOULD render from that registry rather than restating the members.
    rationale: 'A member added to some sites and not others is accepted by some checks and reported as an unrecognized name by the rest, and that diagnostic reads like a typo rather than like a missing registration. Rendering the expected value from the registry also stops the message naming a stale set after the family grows. This generalizes the rule already recorded here for roadmap dependency-target resolution: a consumer resolves from the shared source rather than building its own.'
    enforcement:
      method: review
      detail: Adding the strict-scene- skill family had to touch four independent checks — the skill directory scan, the marketplace entry scan, the workflow-state guidance scope, and the delegated-procedure owner pattern — each holding its own copy of the three existing prefixes.
    examples:
      good:
        - One exported STRICT_SKILL_NAME_PREFIXES constant with a shared predicate and a rendered expectation string, consumed by every check that classifies a skill name.
      bad:
        - Each check repeating name.startsWith("strict-spec-") || name.startsWith("strict-roadmap-") and its own literal "strict-spec-*, strict-roadmap-*, or strict-tech-*" expected value.
    exceptions:
      - A family whose members are classified at exactly one site needs no registry; extract one when the second consumer appears.
  active-change-gates-resolve-against-post-archive-state:
    strength: SHOULD
    statement: A ready, verify, or archive gate that resolves ids or references during an active change SHOULD resolve them against the state archive will produce — the recorded main artifacts overlaid with that change's own delta artifacts, with added and modified entries present and removed entries absent — rather than against the recorded main artifacts alone.
    rationale: 'A change legitimately cites what it introduces: a scene step covered by a requirement its own delta spec adds is the normal scene-first flow. A gate resolving against archived state alone rejects exactly that, and its named remedy of adding the requirement to the change cannot clear it, so the change can never archive. Archive merges specs before scenes, so the overlay is the state the merged artifact is checked against.'
    enforcement:
      method: test
      detail: For scene coverage this is overlayChangeSpecRequirements in src/scenes.ts, proven by test/suites/scenes.ts cases where an added requirement resolves and a removed one does not. A new gate adds the same pair of cases.
    examples:
      good:
        - verify accepts a scene step covered by a requirement the change's delta spec ADDs, and rejects one covered by a requirement the change REMOVEs.
      bad:
        - verify resolves covered_by only against .strict-spec-driven/specs and tells the author to add the missing requirement to the change, which does not clear the diagnostic.
    exceptions:
      - Read-only status commands that run outside any change, such as scene-status, resolve against the recorded main artifacts.
  delta-scene-coverage-retarget-retires-and-readds:
    strength: SHOULD
    statement: 'A change that retargets a scene step''s covering requirements SHOULD retire the step (a REMOVED operation with its reason) and re-add its replacement under a new step id, rather than restating the step with a different covered_by list, because delta-scene coverage merges as a set union on archive: a MODIFIED step keeps every previously recorded covering reference, so the old reference survives the restatement and dangles once the requirement it names is retired.'
    rationale: This change retargeted two steps' coverage from a retired requirement to its replacement and the restatement silently kept the stale references, surfacing only in fresh-context review as dangling coverage once the requirement REMOVED operation landed; retiring and re-adding under a new id is the only delta-scene shape that subtracts coverage, and the step id then also matches the new semantics instead of inverting.
    enforcement:
      method: review
      detail: Review of any change carrying both a REMOVED spec requirement and a delta scene whose steps referenced it checks that the affected steps are retired and re-added rather than restated, and that no post-archive scene step names a retired requirement id.
  delta-tech-modified-restates-the-complete-rule:
    strength: MUST
    statement: A delta-tech MODIFIED operation MUST restate the complete target rule — strength, statement, rationale, and the full enforcement block including detail, together with examples and exceptions when the live rule carries them — because archive replaces the rule wholesale while the main-tech schema makes detail and examples optional, so a partial restatement silently drops every unmentioned field.
    rationale: The scene side merges covering references by set union and already has a rule about what that forbids; the tech side replaces the whole rule, and only author discipline guards the unmentioned fields — this change's own partial restatement of the packed-tarball-allowlist rule would have silently dropped its enforcement detail and examples, caught only in fresh-context review.
    enforcement:
      method: review
      detail: Review of any delta-tech MODIFIED operation compares the replacement's field set against the live rule and treats a live-rule field the replacement omits as a defect; the intended long-term enforcement is a verify-time field-set comparison in the CLI's delta-tech validation, which strict-tech-sync may propose.

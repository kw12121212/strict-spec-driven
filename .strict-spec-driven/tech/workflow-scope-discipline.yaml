schema: strict-spec-driven/main-tech/v1
schema_version: 1
artifact_type: main_tech
schema_file: ../schemas/main-tech.yaml
standard:
  id: workflow-scope-discipline
  title: Workflow Scope Discipline
  category: architecture
rules:
  contract-first-scope-changes:
    strength: MUST
    statement: When a change alters a workflow contract — a registered schema, a main or delta spec, or a technical standard — the corresponding strict artifact MUST be updated first; implementation code MUST NOT silently widen workflow scope ahead of the contract it depends on.
    rationale: The strict workflow's value is that deterministic, machine-validatable artifacts describe the contract before code implements it. Letting code lead the contract reintroduces the ad hoc drift the workflow exists to prevent and breaks the audit trail that verify and archive rely on.
    enforcement:
      method: review
      detail: Reviewers reject code changes that broaden schema, spec, or tech contracts without a matching delta-spec or delta-tech artifact updated in the same strict change.
    examples:
      good:
        - A change that adds a new CLI flag first adds the delta-spec requirement and (if it sets a new convention) a delta-tech rule, then implements the flag to match.
      bad:
        - Editing src/ to support a new artifact field while leaving the schema and specs unchanged.
    exceptions:
      - Non-contract refactors that preserve existing schema, spec, and tech behavior need no artifact update.
  roadmap-commands-do-not-write-change-artifacts:
    strength: MUST
    statement: Roadmap commands MUST NOT create, modify, or delete any artifact under .strict-spec-driven/changes/; when a roadmap operation leaves a change artifact's roadmap linkage stale or otherwise inconsistent, the command MUST report the drift as a non-blocking warning naming the command that repairs it rather than writing the change artifact itself.
    rationale: 'Roadmap state and change state are separate domains reconciled by derivation: change state is derived from change directory names, and roadmap commands own only roadmap artifacts. A roadmap command that reached into a change directory would make roadmap operations partially bypass the change workflow''s own validation, apply, and verify gates, and would let a single command mutate two contracts whose consistency the workflow checks independently. Reporting the drift keeps the repair inside the change workflow that owns it.'
    enforcement:
      method: review
      detail: Reviewers reject roadmap command implementations that write, rename, or delete files under .strict-spec-driven/changes/, and require a reported warning naming the repair command instead.
    examples:
      good:
        - roadmap-move-planned-change warns that an active strict change still records the previous milestone and names the generate proposal command that refreshes the linkage.
      bad:
        - A roadmap command silently rewriting proposal.yaml roadmap.milestone for an active change while moving its planned change.
  roadmap-dependency-targets-resolve-against-one-universe:
    strength: MUST
    statement: Every roadmap consumer that decides whether a planned-change depends_on target exists MUST resolve it against the shared universe of active planned-change ids unioned with the ids loaded from the roadmap archive, obtained from the loader that already computes that set. A consumer MUST NOT build its own dependency-target universe from active roadmap state alone, and MUST NOT re-derive archived membership by parsing archived artifacts.
    rationale: roadmap-archive relocates completed work instead of deleting it, so archive membership is part of what it means for a dependency target to exist. Cross-file validation already unioned the archive in, while roadmap-recommend resolved against active state only; the two rules disagreed silently and stalled recommendation for every planned change downstream of an archived milestone. Nothing failed loudly, because each consumer was internally consistent. One shared universe is what makes archiving a milestone a safe operation for the work that depends on it.
    enforcement:
      method: review
      detail: Reviewers reject a roadmap consumer that resolves dependency targets from active planned-change state alone, or that opens archived artifacts to re-derive completion. New consumers take the archived id set as an explicit parameter from a caller that loaded it once per command invocation.
    examples:
      good:
        - recommendRoadmapChange resolves depends_on against the active planned-change status index plus the archived id set that loadRoadmapStatusContext already loaded for cross-file validation.
      bad:
        - A new roadmap command builds a dependency index from the active milestones it just walked, so a target that was archived reads as missing and blocks the dependent work.
    exceptions:
      - Code that reports on archived history itself, rather than deciding whether an active dependency target is satisfied.
  archive-merge-failures-surface-in-verify:
    strength: SHOULD
    statement: A merge that archive performs across more than one artifact family SHOULD be fully evaluated by verify, so a merge archive would refuse is rejected before archive writes any family. Archive applies its family merges in sequence without a transaction spanning them, so a refusal raised inside a later stage leaves the earlier stages already written and the change still active.
    rationale: Archive writes main specs, then technical standards, then scenes. A refusal raised in a later stage cannot undo the earlier writes, so the repository is left holding a partial merge that no command reverses and that the operator must reconcile by hand. Evaluating the merge during verify costs one extra dry run and turns that partial-write hazard into an ordinary blocking diagnostic the author can act on.
    enforcement:
      method: test
      detail: For the scene family this is collectSceneCoverageDiagnostics, which plans the merge, validates each merged scene against the scene schema, and reports the result as a verify diagnostic; archive then performs the same merge knowing it will succeed. The spec and technical-standard merges do not yet do this, which is why the rule is a default rather than an absolute.
    examples:
      good:
        - verify plans the delta scene merge, finds the merged scene would leave a required exception flow empty, and exits non-zero naming the scene and the remedy; archive refuses and the main specs are untouched
      bad:
        - archive merges the delta specs, writes them, then throws inside the scene merge, leaving merged specs on disk with the change still active

schema: strict-spec-driven/main-tech/v1
schema_version: 1
artifact_type: main_tech
schema_file: ../schemas/main-tech.yaml
standard:
  id: typescript-esm-baseline
  title: TypeScript ESM Baseline
  category: coding
rules:
  esm-typescript-only:
    strength: MUST
    statement: Source modules MUST be authored in strict TypeScript using ESM syntax with NodeNext resolution, compiled from src/ to dist/.
    rationale: A single, strict module system keeps imports, build output, and tooling consistent and avoids dual-package and CommonJS interop hazards.
    enforcement:
      method: ci
      detail: 'tsc with strict and NodeNext settings fails the build on violations; build command: bun run build.'
    examples:
      good:
        - import { parseYamlDocument } from "./yaml.js";
      bad:
        - const yaml = require("./yaml");
    exceptions:
      - Generated bundle output under dist/ is exempt.
  rebuild-after-source-edits:
    strength: MUST
    statement: Compiled output MUST be rebuilt after editing TypeScript sources before relying on dist/ behavior or running the dist-based test suite.
    rationale: Tests and installed skills run against compiled dist/ output, so stale builds produce misleading results.
    enforcement:
      method: test
      detail: bun run build && bun test/run.ts is the complete project regression command.
  tests-verify-observable-behavior:
    strength: SHOULD
    statement: Tests SHOULD verify observable behavior described in specs and prefer real dependencies over mocks for code the project owns.
    rationale: Behavior-facing tests survive refactors and catch real regressions; implementation-coupled tests and mocks of owned code do not.
    enforcement:
      method: review
      detail: Reviewers reject tests that assert internal implementation detail or mock owned modules without cause.
  build-scripts-expose-pure-output-plan:
    strength: SHOULD
    statement: 'A repository build script SHOULD separate pure output planning from materialization: one exported function returns the complete list of output paths and exact texts the build writes, and the write loop only materializes that plan, so a suite can prove the full shipped asset set — including byte-identity against authored sources — in memory without writing build output or adding a build prerequisite.'
    rationale: This change's plugin build exposed planBuildOutputs and the host suite proved the 32-entry shipped asset set byte-identically with zero new build prerequisites, where reading the built dist directory would have forced every suite run to build the plugin first; the pattern keeps the write loop trivially auditable and the asset set testable from sources alone.
    enforcement:
      method: test
      detail: The consuming suite imports the plan function, derives the expected entry set from the authored sources, and asserts the plan's exact entries, their byte-identity, and negative probes for dropped, extra, and mutated entries.

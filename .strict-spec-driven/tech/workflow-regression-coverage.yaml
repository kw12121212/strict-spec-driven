schema: strict-spec-driven/main-tech/v1
schema_version: 1
artifact_type: main_tech
schema_file: ../schemas/main-tech.yaml
standard:
  id: workflow-regression-coverage
  title: Workflow Regression Coverage
  category: testing
mapping:
  implementation:
    - src/validation.ts
    - src/migrate.ts
    - src/archive.ts
    - .strict-spec-driven/config.yaml
    - scripts/coverage-gate.ts
    - test/support/harness.ts
  enforcement:
    - test/suites/foundation-and-fixtures.ts
    - test/suites/roadmap-and-migration.ts
    - test/suites/change-lifecycle.ts
    - test/suites/coverage-gate.ts
    - test/suites/entrypoint-and-skills.ts
    - test/suites/operations.ts
    - test/suites/yaml-operation-matrix.ts
    - inventory/yaml-mutation-surfaces.yaml
rules:
  cover-workflow-critical-behaviors:
    strength: MUST
    statement: 'Changes that implement or alter YAML artifact support MUST add or update tests covering the workflow-critical behaviors they touch: schema validation, migration, archive and delta-merge behavior, and the error messages surfaced on invalid input.'
    rationale: These four behaviors are where a regression silently corrupts workflow state or misleads the operator. Behavior-facing tests in the existing suites are the only deterministic guard, since the project runs no CI and validates on demand.
    enforcement:
      method: test
      detail: bun test/run.ts must exercise the affected behavior; the foundation-and-fixtures, roadmap-and-migration, and change-lifecycle suites hold the schema-validation, migration, and archive/merge cases.
    examples:
      good:
        - Adding an archive delta-merge case to change-lifecycle.ts when changing how delta specs merge into main specs.
      bad:
        - Changing migration conversion logic with no new or updated case in roadmap-and-migration.ts.
    exceptions:
      - Documentation-only or skill-prompt-only changes that touch no artifact mechanics need no new test.
  enforce-minimum-coverage:
    strength: MUST
    statement: The complete project regression command recorded in review_evidence.project_regression MUST enforce the minimum src/** line coverage declared in the workflow config coverage contract, exiting non-zero below the declared threshold; the threshold MUST start at the measured baseline and only be raised deliberately, never silently lowered or removed.
    rationale: Archive safety previously depended on human judgment about test sufficiency; a baseline-derived ratchet makes coverage loss a deterministic review-evidence failure while avoiding aspirational thresholds that invite exceptions or superficial tests.
    enforcement:
      method: test
  test-helpers-isolate-developer-home:
    strength: MUST
    statement: Test helpers that spawn CLI subprocesses or exercise startup paths with home-directory side effects MUST redirect HOME, USERPROFILE, and recognized cache-root environment overrides to per-run temporary directories by default, with explicit per-call environment overrides still taking precedence, so the test suite never writes the developer's real home directory on any platform.
    rationale: Startup-time home-directory side effects silently leak into developer machines through every spawned test subprocess unless isolation is the harness default rather than a per-test opt-in, and HOME-only isolation fails on Windows where os.homedir() reads USERPROFILE.
    enforcement:
      method: review
  static-content-checks-prove-a-negative-case:
    strength: MUST
    statement: A static check over content that the same change generates or inserts MUST derive the set of files or entries it checks from a source independent of that generated content, MUST be proven by running a negative case in which the content is removed and the check is observed to fail, and MUST be proven by a positive case in which each matcher category is observed firing on realistic input, with any hand-enumerated set of governed files replaced by a scan. A green suite over generated content is not coverage evidence until both cases have been run at least once.
    rationale: Independent scope derivation makes a check non-vacuous; it does not make its matcher able to fire. A pattern whose character classes exclude punctuation its targets contain, and a hardcoded file list that omits a file the repository actually has, both report zero findings — the same signal as full compliance — while never having been able to fail. Only observing each category fire on realistic input distinguishes a check that passes from one that cannot run.
    enforcement:
      method: test
      detail: test/suites/entrypoint-and-skills.ts drives every CLI-only YAML policy category through a seeded violation and asserts each fires, then strips a skill's protocol section and asserts the package stays in scope; test/suites/operations.ts seeds one violation per governed maintenance surface and asserts findings, then asserts permitted surfaces produce none.
  policy-enforcement-proven-through-shipped-entry-point:
    strength: MUST
    statement: A repository policy that blocks a class of authored guidance MUST be proven by a committed negative fixture driven through the shipped command an operator or agent actually runs, with the observed failure naming the offending file path, line, and policy category; a module-level scan of inline text is supporting evidence only and MUST NOT be the sole proof.
    rationale: 'The scanner and the command that surfaces its result are separable: the matcher can keep firing while the command stops reporting, stops exiting non-zero, or stops classifying the package as in scope. Only the shipped entry point proves the failure a caller would actually see.'
    enforcement:
      method: test
      detail: test/suites/entrypoint-and-skills.ts runs validate-skills against a negative fixture skill root and asserts non-zero exit plus a path-and-line diagnostic for every CLI-only YAML policy category.
    examples:
      good:
        - Committing a fixture skill whose SKILL.md instructs a heredoc write to a YAML path, then asserting validate-skills exits non-zero and names that file and line.
      bad:
        - Asserting only that scanTextForPolicyViolations returns a match for an inline string, leaving the command's exit status and diagnostic text unproven.
    exceptions:
      - A policy with no shipped command surface, where the module function is itself the entry point, needs only the module-level proof.
  mutation-coverage-spans-every-agent-facing-surface:
    strength: MUST
    statement: The mutation-surface coverage registry MUST declare a cell for every artifact family on every agent-facing entry surface, including both the CLI and the MCP tool surface, and each not-applicable cell MUST record why that family has no entry point on that surface.
    rationale: A family can gain CLI proof and silently skip the MCP path, leaving an agent-reachable mutation route with no regression behind it; deriving the family set from the inventory makes the omission a failure instead of an absence nobody notices.
    enforcement:
      method: test
      detail: test/suites/yaml-operation-matrix.ts derives families from inventory/yaml-mutation-surfaces.yaml and fails when any family lacks a cell for any dimension, including mcp-driven.
    examples:
      good:
        - Adding an artifact family to the inventory and being forced to declare its mcp-driven cell as covered-by, runs-here, or not-applicable with a reason.
      bad:
        - Adding an mcp-driven cell of not-applicable with no reason, or omitting the dimension for a family that has an MCP mutating tool.
  declared-surface-lists-are-checked-against-implementation:
    strength: MUST
    statement: 'When a coverage check derives its scope from a hand-maintained list inside a repository artifact — an inventory of surfaces, a family-to-tool mapping, a registry of owners — that list MUST itself be cross-checked against the implementation it describes, in both directions: an entry naming something the code does not provide, and a thing the code provides that no entry names, MUST both fail.'
    rationale: Deriving scope from a checked-in list is what makes a coverage check non-vacuous, so the list silently becomes the thing nobody checks. An over-claiming entry produces coverage that cannot run; an omitted entry produces a reachable surface with no coverage at all. Both report green, and neither is visible from the check that trusts the list.
    enforcement:
      method: test
      detail: test/suites/yaml-operation-matrix.ts asserts the inventory's mcp-mutating-tools family list and the suite's family-to-tool mapping are equal sets, and that every mapped tool resolves to a mutating tool delegating to an inventory-declared owner of that family.
    examples:
      good:
        - Asserting the inventory's declared MCP family list equals the set of families for which a real MCP mutating tool exists, so a stale claim fails the suite.
      bad:
        - Reading the declared list to decide what to check without ever asking whether the list matches the code, so a family the inventory names but no tool serves is reported as covered.
  subprocess-spawning-code-under-test-receives-the-isolated-runner:
    strength: MUST
    statement: When the code under test spawns a subprocess on the suite's behalf rather than through a test helper, the suite MUST supply the isolated runner through that module's own injection point, and MUST NOT rely on the module's default runner, which inherits the developer's environment.
    rationale: 'Home isolation is applied by the test helper that spawns, so a module that spawns for itself escapes it entirely: the call looks like ordinary test code while the child process reads and writes the developer''s real home and shared caches. The injection point already exists for exactly this substitution, and using it keeps the end-to-end property intact.'
    enforcement:
      method: review
      detail: test/suites/yaml-operation-matrix.ts passes the harness cli runner into callMutatingTool so the MCP end-to-end calls spawn the compiled CLI under the suite's redirected HOME and schema-cache root.
    examples:
      good:
        - 'Calling callMutatingTool with runner: (args, options) => cli(args, { cwd: options.cwd }) so the spawn inherits the suite''s redirected environment.'
      bad:
        - Calling callMutatingTool with only projectRoot, letting the default runner spawn the CLI with the developer's own HOME and schema cache.

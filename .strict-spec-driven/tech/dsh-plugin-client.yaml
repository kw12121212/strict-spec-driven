schema: strict-spec-driven/main-tech/v1
schema_version: 1
artifact_type: main_tech
schema_file: templates/strict-spec-driven/schemas/main-tech.yaml
standard:
  id: dsh-plugin-client
  title: DSH Plugin Client Conventions
  category: ui
rules:
  shared-dsh-modules-external:
    strength: MUST
    statement: Plugin client code compiles to the dsh ModuleLoader closure-factory CommonJS bundle with every dsh shared module, including React and the host's shared client APIs, declared external, so the bundle never inlines a copy of a shared module.
    rationale: The dsh host injects its shared modules at load time; a bundled duplicate would create a second React instance whose hooks and context do not match the host's, breaking slot rendering in ways that surface only at runtime.
    enforcement:
      method: test
      detail: A bundle-shape test inspects the built client bundle and fails when a shared module id resolves to inlined code instead of a runtime require.
    examples:
      bad:
        - a client bundle that contains the full React implementation inline
  css-modules-dsw-tokens:
    strength: MUST
    statement: Plugin styles are written as CSS Modules that consume --dsw-alias design tokens through var() for colors and border radii, and a plugin style sheet declares no literal color value and no literal border-radius.
    rationale: Literal colors and radii drift from the host design system across dsh releases, while tokens keep the plugin visually native and let theme changes propagate without plugin edits.
    enforcement:
      method: test
      detail: The plugin suite scans every plugins/dsh-strict-spec CSS Module file discovered from the filesystem and fails on any literal hex, rgb, or hsl color or any border-radius declaration containing a digit, with synthetic negative and positive probes exercised through the same inspect function each run.
    examples:
      good:
        - 'border-radius: var(--dsw-radius-md);'
      bad:
        - 'border-radius: 8px;'
  zh-en-locale-registration:
    strength: MUST
    statement: Every user-visible string the plugin renders is registered in both the zh and en locale catalogs, and components render text only through those registered entries.
    rationale: dsh clients run in either language, and a string hardcoded in one language is unreadable for the other audience; registered catalogs make a missing translation a checkable defect instead of a silent gap.
    enforcement:
      method: review
      detail: Review compares the strings components render against both locale catalogs and fails any string that bypasses them.
  props-and-stores-data-flow:
    strength: MUST
    statement: Data reaches plugin components only through props or stores, and no component reads the remote workspace API, the filesystem, or module-scope mutable state directly.
    rationale: Keeping remote reads out of components keeps them renderable in dsh-free static tests and keeps the data flow auditable against the read-only viewer contract.
    enforcement:
      method: review
      detail: Review traces each component's inputs to props or store subscriptions and fails any direct remote or filesystem access inside a component.
  narrow-engines-dsh-pin:
    strength: MUST
    statement: The plugin's package.json declares engines.dsh pinned to the patch line of the dsh release the plugin was built against, and widening the pin is its own planned change.
    rationale: dsh is pre-stable and its slot and remote contracts change between releases; a wide pin lets a future host silently load a plugin whose contracts no longer match.
    enforcement:
      method: review
      detail: Review reads engines.dsh at patch-line granularity and treats any widening as an unapproved contract change.
  dsh-free-component-tests:
    strength: MUST
    statement: Component tests render plugin components without a running dsh host, for example through react-dom/server static rendering, and the plugin adds no browser or DOM test dependency unless the change that adds it justifies why static rendering cannot exercise the behavior under test.
    rationale: Static rendering executes the same component code the host mounts while keeping the Bun-based suite hermetic and free of browser toolchain drift.
    enforcement:
      method: test
      detail: Component suites run inside bun test/run.ts without network, browser, or dsh processes.
    exceptions:
      - A change may introduce a DOM or browser test dependency when it records why react-dom/server static rendering cannot exercise the behavior under test.
  declaration-aware-slot-registration:
    strength: MUST
    statement: A dynamic plugin fiber registers into shell-owned slots through the registry's declaration-aware installation path, ctx.slots.inject with the slot key and a callback that performs the registration, never through a bare register call in apply, because the fiber can activate before the shell entries that declare the slot have committed their children tables and a bare registration into an undeclared slot throws.
    rationale: Fiber activation order follows service resolution rather than bundle order, so a plugin with only early-provided services activates before the layout and sidebar entries declare their slots; the declaration-aware path runs the registration the moment the declaration is live and collects disposers on collapse, which a bare register call cannot survive.
    enforcement:
      method: test
      detail: The load smoke check boots the pinned dsh web client with the plugin installed and fails when the plugin entry reports an activation error, which a bare registration into a not-yet-declared slot produces.
  model-modules-behind-owned-remote-port:
    strength: MUST
    statement: 'Plugin model and business modules must not import generated dsh client remote modules or touch the client remote face directly; they close over a plugin-owned port interface that mirrors the pinned wire contract — including parameter requiredness, so a wire-required options object is never forwarded as undefined — with a single adapter at the client entry converting the real remote face, and their tests script a fake that reproduces the pinned wire semantics: the directory-listing entry cap with its truncated flag and no paging, the complete-file cap with its too-large refusal, line pages terminated by eof, non-recursive per-target watches, and the typed workspace-files error codes.'
    rationale: Keeping remote access behind one owned seam keeps model logic runnable under bun test/run.ts with no dsh host and collapses contract drift onto a single typed boundary; the fake encoding the wire's exact shapes is what makes cap, truncation, watch, and error-code behaviors deterministically testable, and a fake looser than the wire hides divergence until the real host runs, which is precisely when it is most expensive to find.
    enforcement:
      method: test
      detail: Model suites import only the port type — a scan fails on any @deepseek-ai remote import under the plugin's model sources — and the fake port rejects shapes the pinned remote rejects, so a call forwarding a wire-required option as undefined fails in the suite instead of in the host.
    examples:
      good:
        - A loader calling port.readBytes(sessionId, path, {}, signal) for a complete-file read, against a fake that throws when options is undefined.
      bad:
        - A model module importing the generated remote client directly, or a fake whose readBytes accepts an undefined options argument the pinned host dereferences without a guard.
  shared-primitives-runtime-devdependencies:
    strength: MUST
    statement: A plugin whose dsh-free component tests or build import a shared dsh UI package must declare that package's own runtime dependencies as plugin devDependencies, because bun resolves the unbundled shared lib's imports from the plugin's node_modules, and the served bundle must inline every module the host does not share.
    rationale: The host shares only the package identity, not its dependency closure; a plugin that skips the declaration fails at test or build time with unresolvable imports, and declaring the closure keeps the single-file bundle self-contained while the shared modules stay external.
    enforcement:
      method: test
      detail: The bundle-shape scan fails when a shared package import cannot resolve, and the served bundle stays free of runtime requires for modules outside the shared externals list.
    examples:
      good:
        - A plugin consuming dsh-client-ui-primitives declares clsx and the package's other runtime dependencies as devDependencies and the bundle inlines them.
      bad:
        - A plugin imports dsh-client-ui-primitives without declaring its closure, so bun test and the client build fail on unresolvable imports.
  identity-stable-adapters-and-effect-free-controllers:
    strength: MUST
    statement: An adapter that feeds a React useSyncExternalStore source returns identity-stable snapshots — memoizing on the identity of the host snapshots it reads, so unchanged sources return the same object — and an effect-driven sequence a component needs at mount or transition (load, restore, teardown) is extracted into a plain controller object the component's effects only delegate to, so suites prove the ordering under bun test/run.ts with no React effect runtime.
    rationale: React throws on a getSnapshot that builds a fresh object per call, so an adapter computing a derived snapshot per read loops the first real render into a blank surface; and restore-then-record orderings that live inside useEffect are invisible to react-dom/server static rendering, which the left page's selection-restore defect proved when its race could not be exercised by any component case.
    enforcement:
      method: test
      detail: 'The model suite drives every store adapter and controller directly: it asserts snapshot identity stability across unchanged sources and new identity after a source change, and it drives the controller''s load, restore, supersede, and dispose paths against the scripted workspace fake.'
    examples:
      good:
        - A picker port whose getCatalog memoizes on the sessions and workspaces snapshot pair; a page controller whose showSession captures the recorded path synchronously and abandons superseded restores by epoch.
      bad:
        - A getCatalog that recomputes its grouping on every call; a restore sequence written inline in a page's useEffect with the recorded path read after an await.
  entry-declares-every-host-face-it-reads:
    strength: MUST
    statement: The client entry's inject export declares every ctx property its apply path and wired components read — service names, the bare remote face, and each remote namespace as a remote-prefixed name — and the package manifest's dsh.client.inject list declares every module the built bundle requires at runtime plus every entry whose fibers provide the declared services.
    rationale: A cordis context throws on reading a service or namespace property the fiber did not declare, and the pinned host's loader resolves module requires only against the manifest inject list and its frozen seed table; the left page's first three real host boots failed as a nameless 'entry did not activate' until remote, remote.workspaceFiles, sessions, and workspaces were declared and the manifest list completed, while local stub-based materialization passed every time because stubs never throw on undeclared reads.
    enforcement:
      method: test
      detail: The bundle-shape suite asserts the manifest inject list names the shared modules and api controllers the bundle consumes, asserts no runtime require appears for a package outside the manifest and seed table, and a real-host manual check exercises the install-to-load path in the pinned release.
    examples:
      good:
        - inject = ["slots","locale","remote","remote.workspaceFiles","sessions","workspaces"] with dsh.client.inject listing the shared client modules and the api controllers.
      bad:
        - Reading ctx.sessions in apply while the entry's inject names only slots and locale; a bundle that requires @tanstack/react-virtual while the host's boot wire declares no shared row for it.
  type-only-dependency-type-closure:
    strength: SHOULD
    statement: A type-only contract devDependency should also declare, as pinned type-only devDependencies, every package whose types its published .d.ts files import, and the bundle-shape suite should list each added package among the type-only runtime-require prohibitions.
    rationale: tsc resolves a contract package's transitive type imports from the plugin's own node_modules, so a type-only dependency whose declaration closure is undeclared fails the entry's contextual type-check even though the bundle never requires it at runtime; naming each addition in the bundle suite keeps the no-runtime-require guarantee checkable per package.
    enforcement:
      method: test
      detail: The bundle-shape suite asserts every type-only package in its list never appears as a runtime require in the built client bundle, with the negative probe firing per entry.
    examples:
      good:
        - Adding @deepseek-ai/dsh-client-ui-sidebar-right as a type-only dependency and declaring @deepseek-ai/dsh-client-shortcuts beside it because the sidebar-right .d.ts imports its client types.
      bad:
        - Adding a type-only contract dependency alone and letting the plugin-local tsc fail on unresolved transitive types, or adding the transitive package silently with no bundle-suite entry.
  renderer-suites-consume-registered-examples:
    strength: MUST
    statement: Every dedicated renderer the plugin adds is covered by a suite case that renders the registered strict example of its artifact type from examples/strict-spec-driven/, so a schema change that breaks a renderer's layout fails the regression suite rather than silently degrading the view.
    rationale: Renderers encode the current shape of each strict schema; a private fixture hides drift between the schema and the renderer, while the registered example is the same sample the schema cache serves, keeping renderer tests in lockstep with schema evolution at zero fixture cost.
    enforcement:
      method: test
      detail: The plugin component suite loads each artifact type's registered example file and statically renders its dedicated renderer; removing or renaming an example, or a schema change that alters fields the renderer reads, fails the case.
    examples:
      good:
        - A question-list renderer case reading examples/strict-spec-driven/question-list.open.yaml and asserting the open and resolved groups render separately.
      bad:
        - A renderer tested only against an inline hand-written object that drifts from the registered example until a real schema change breaks the view silently.
  dedicated-renderers-react-free-view-models:
    strength: MUST
    statement: Every dedicated renderer maps a parsed strict artifact onto its presentation structure through a React-free view-model module — partitioning known and unrecognized top-level fields and computing any presented summary, such as task completion, from declared values — and renders every unrecognized top-level field through the one shared generic blocks implementation.
    rationale: Renderer structure that lives outside React renders is assertable directly under bun test/run.ts without a host, which is what makes example-driven renderer checks meaningful; and one shared generic blocks implementation means the dedicated additional-fields section and the generic view can never diverge about how a YAML shape renders. The remaining renderer changes of the milestone reuse exactly this seam.
    enforcement:
      method: test
      detail: View-model cases assert the field partition, per-artifact body mapping, and computed summaries directly, and component cases render each dedicated view with its additional-fields section drawn through the shared generic blocks, so a renderer that inlines structure mapping or renders additional fields itself fails the suite.
    examples:
      good:
        - The tasks renderer draws its sections, markers, and counts from tasksView's model and its additional fields through GenericBlocksView.
      bad:
        - A renderer that walks its parsed YAML inline in JSX, or renders unrecognized fields with a second private blocks implementation.

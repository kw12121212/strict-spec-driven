schema: strict-spec-driven/main-tech/v1
schema_version: 1
artifact_type: main_tech
schema_file: templates/strict-spec-driven/schemas/main-tech.yaml
standard:
  id: dsh-plugin-host
  title: DSH Plugin Host-Side Tooling Conventions
  category: architecture
rules:
  tooling-assets-live-under-bundle-dir:
    strength: MUST
    statement: Built-in tooling assets a dsh plugin ships — skill bodies, CLI bundles, and any asset its host entry resolves at runtime — MUST be produced into the plugin's built bundle directory by the plugin build and resolved at runtime relative to the host entry's own module URL, so the packed-tarball files allowlist keeps naming only the built bundle directory, the bundle patch, the per-locale READMEs, and the license file, and carrying tooling never adds a top-level tarball entry or ships sources, build scripts, or test support.
    rationale: The packed-tarball-allowlist standard fixes the tarball's shape; tooling assets are build outputs, not sources, so folding them under the existing built bundle directory keeps the standard unchanged while the shipped asset set stays provable.
    enforcement:
      method: test
      detail: The plugin host suite asserts the build plan — the pure in-memory list of every dist file the build writes — carries exactly the client bundle, the host entry, the CLI asset, and one byte-identical body per repository skill package, with negative probes proving a dropped asset, an extra entry, and a mutated body are each caught, and the release suite keeps asserting the files allowlist names exactly the built bundle directory, the bundle patch, the per-locale READMEs, and the license file.
  served-skill-bodies-stay-single-source:
    strength: MUST
    statement: A dsh plugin that serves repository-authored skill packages MUST ship the authored bodies unchanged and apply any environment-specific command adaptation — such as rewriting a globally named CLI token to the bundled invocation through the running host's node executable — only at serve time, so the repository skill packages remain the single authored source, no second authored variant drifts from them, and the adaptation leaves every mandated protocol pointer and validation command a body states runnable.
    rationale: Authoring a plugin-specific skill variant would fork the governed skill text and drift from the repository packages the skill standards govern; serve-time rewriting keeps the shipped copies byte-identical while making the commands runnable without a global install.
    enforcement:
      method: test
      detail: The plugin host suite asserts every shipped skill body is byte-identical to its repository source, that the rewrite leaves no bare CLI token and keeps the yaml-authoring-protocol pointer and artifact validation commands, and that both quoting branches behave.
  host-entry-declares-every-service-it-reads:
    strength: MUST
    statement: A dsh plugin host entry MUST declare in its inject export every ctx service property its apply path reads, mirroring the client entry's declaration rule, because an undeclared read fails the fiber at real-host activation with a terse failure that names no property while stub-based suites stay green.
    rationale: The recorded inject lesson shows host fibers failing as 'entry did not activate' with no console output for undeclared context reads, and only the inject list is checked before activation; the rule keeps host-side service adoption as visible as the client-side rule the dsh-plugin-client standard already states.
    enforcement:
      method: review
      detail: Review checks the host entry's inject export against every ctx property its apply path reads, supported by the plugin host suite's static wiring check over the entry's inject list.
  builtin-fallback-precedence:
    strength: MUST
    statement: 'A dsh plugin that offers built-in copies of skills MUST register them as a fallback: candidates carry the pinned line''s bundled rank band, so an external copy of the same name from a project or user root wins in every resolution shape — across layers, because a preset''s local discovery registers nearer than the plugin''s deployment-level registration, and within a layer, because every filesystem root rank beats the bundled band — and the built-in copies serve only names no external root offers; the plugin MUST NOT ship, or document as required, any preset-composition override that freezes the host''s shipped preset to force built-in precedence.'
    rationale: The pinned dsh line's own composition comments state that deployment-level providers register into the skill registry's global layer while a preset's skill-filesystem registers into that preset's layer, making external-first with built-in fallback the host's designed semantics; forcing built-in precedence instead requires a profile patch that restates the whole shipped preset and silently shadows host preset improvements on every dsh upgrade, a cost the operator rejected on 2026-10-20.
    enforcement:
      method: test
      detail: The plugin host suite asserts the candidate rank sits in the bundled band above every filesystem root rank (project 100 through user 500 of the pinned line) so external copies win same-layer duels, and the recorded real-host evidence observes an external project-root copy winning a same-name resolution while absent names fall through to the built-in copy through the pinned line's real registry.
  builtin-candidates-carry-provenance-marker:
    strength: MUST
    statement: 'A dsh plugin that offers built-in copies of skills MUST distinguish them from external copies in the catalog itself: each built-in candidate''s description carries a serve-time provenance marker naming the plugin and its installed version, applied identically to the listed summary and the loaded definition, leaving the skill names and shipped bodies untouched and staying within the host''s catalog description limit for every offered skill.'
    rationale: Built-in and external copies share a name and a byte-identical body, so neither the catalog text nor the loaded body distinguishes them and provenance is invisible until a resource base is inspected after loading; a description marker makes the distinction visible where the choice is made, reports the version actually serving, and follows the same serve-time-adaptation-only pattern the single-source rule already governs.
    enforcement:
      method: test
      detail: The plugin host suite asserts every built-in candidate's description equals its frontmatter description plus the marker built from the plugin package version, that the loaded definition carries the same marked description, that no shipped body changes, and that every shipped skill's marked description stays within the pinned host's 500-character catalog limit.
  plugin-publishes-only-from-ci-tag:
    strength: MUST
    statement: A dsh plugin distributed publicly — through a package registry or as release assets — MUST ship only from a CI run triggered by a pushed commit on the repository release branch that is named by an existing plugin-v tag pointing at that same commit, with the tag naming exactly the committed plugin version, with registry authentication over OIDC trusted publishing where the registry supports it, with no long-lived registry credential stored in repository secrets, and with provenance enabled where the channel supports it, so no working tree, no version mismatch, and no local machine can produce a public release; a release-asset channel MUST attach exactly the packed tarball that run built, and a run whose version the registry already carries MUST end successfully without republishing.
    rationale: 'The release boundary is now the merge into the release line: gating both public channels on one run at that boundary keeps the discipline uniform while removing the second manual tag-push act and the dormant secret gate that kept the registry channel unshipped; requiring the plugin-v tag to name the same version and commit preserves version identity and the release-asset source, OIDC removes a long-lived write credential, and skipping an already-published version keeps merges that do not bump the version green.'
    enforcement:
      method: ci
      detail: The workflow refuses to run either channel shipping step unless a plugin-v tag exists that names exactly the version committed in plugins/dsh-strict-spec/package.json and points at the pushed commit on the release branch; a version the registry already carries ends the run green with a skip notice; the release job uploads the tarball the same run packed with contents write permission; the registry job holds id-token write, reads no repository secret, and keeps provenance; the release suite asserts the merge trigger, the id-token permission, the skip path, and additionally inspects every workflow file for job-level if conditions reading contexts GitHub does not offer there.

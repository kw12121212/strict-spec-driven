schema: strict-spec-driven-schema
schema_version: 1
artifact_type: task_list
description: Strict YAML task list artifact.
example: ../examples/task-list.yaml
top_level:
  type: mapping
required_fields:
  - name: schema
    type: string
  - name: schema_version
    type: integer
  - name: change
    type: string
  - name: sections
    type: sequence
optional_fields: []
enums:
  task_status:
    - pending
    - complete
  section_name:
    - Implementation
    - Testing
    - Verification
relationships:
  change: Matches change.id from the proposal artifact.
stable_identifiers:
  - sections[].tasks[].id
uniqueness:
  - sections[].tasks[].id is unique within the task list.
supported_shapes:
  sections: sequence of section mappings.
  tasks: sequence of task mappings with id, text, status.

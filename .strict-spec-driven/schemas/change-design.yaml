schema: strict-spec-driven/schema/v1
schema_version: 1
schema_id: strict-spec-driven/change-design/v1
artifact_type: change_design
artifact_name: change-design
description: Strict YAML change design artifact.
example_ref: ../examples/change-design.yaml
additional_fields: false
fields:
  schema:
    type: string
    required: true
    const: strict-spec-driven/change-design/v1
  schema_version:
    type: integer
    required: true
    const: 1
  artifact_type:
    type: string
    required: true
    const: change_design
  schema_file:
    type: string
    required: true
  change:
    type: string
    required: true
    references: change_proposal.change.id
  approach:
    type: sequence
    required: true
    min_items: 1
    items:
      type: string
  decisions:
    type: sequence
    required: true
    items:
      type: mapping
      additional_fields: false
      fields:
        id:
          type: string
          required: true
        decision:
          type: string
          required: true
        rationale:
          type: string
          required: true
  alternatives:
    type: sequence
    required: true
    items:
      type: mapping
      additional_fields: false
      fields:
        option:
          type: string
          required: true
        reason:
          type: string
          required: true
  risks:
    type: sequence
    required: false
    items:
      type: string

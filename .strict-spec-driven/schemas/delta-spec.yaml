schema: strict-spec-driven/schema/v1
schema_version: 1
schema_id: strict-spec-driven/delta-spec/v1
artifact_type: delta_spec
artifact_name: delta-spec
description: Strict YAML delta spec artifact.
example_ref: ../examples/delta-spec.yaml
coverage_examples:
  - ../examples/delta-spec.operations.yaml
additional_fields: false
fields:
  schema:
    type: string
    required: true
    const: strict-spec-driven/delta-spec/v1
  schema_version:
    type: integer
    required: true
    const: 1
  artifact_type:
    type: string
    required: true
    const: delta_spec
  schema_file:
    type: string
    required: true
  target_spec:
    type: string
    required: true
    references: main_spec.spec.id
  mapping:
    type: mapping
    required: true
    additional_fields: false
    fields:
      implementation:
        type: sequence
        required: true
        items:
          type: string
          path: repo-relative
      tests:
        type: sequence
        required: true
        items:
          type: string
          path: repo-relative
  operations:
    type: mapping
    required: true
    additional_fields: false
    fields:
      ADDED:
        type: sequence
        required: true
        unique_by: requirement.id
        items:
          type: mapping
          additional_fields: false
          fields:
            requirement:
              type: requirement
              required: true
      MODIFIED:
        type: sequence
        required: true
        unique_by: target_requirement
        items:
          type: mapping
          additional_fields: false
          fields:
            target_requirement:
              type: string
              required: true
              references: target_spec.requirements.id
            replacement:
              type: requirement
              required: true
      REMOVED:
        type: sequence
        required: true
        unique_by: target_requirement
        items:
          type: mapping
          additional_fields: false
          fields:
            target_requirement:
              type: string
              required: true
              references: target_spec.requirements.id
            reason:
              type: string
              required: true
merge_rules:
  exclusive_active_target: |
    A requirement ID that appears as a MODIFIED or REMOVED target in one active change
    MUST NOT appear as a MODIFIED or REMOVED target in any other active change.
    Verify must enforce this constraint and report it as a deterministic validation failure.
  modified_missing_target: |
    If a MODIFIED entry targets a requirement ID that does not exist in the main spec at
    archive time, the entry is treated as ADDED and recorded in the archive merge report.
  removed_missing_target: |
    If a REMOVED entry targets a requirement ID that does not exist in the main spec at
    archive time, the entry is silently skipped and recorded as a skipped removal in the
    archive merge report.
definitions:
  requirement:
    type: mapping
    additional_fields: false
    fields:
      id:
        type: string
        required: true
      strength:
        type: string
        required: true
        enum:
          - MUST
          - SHOULD
          - MAY
      statement:
        type: string
        required: true
      scenarios:
        type: sequence
        required: true
        items:
          type: mapping

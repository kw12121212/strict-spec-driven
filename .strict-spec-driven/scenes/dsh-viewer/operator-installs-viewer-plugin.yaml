schema: strict-spec-driven/scene/v1
schema_version: 1
artifact_type: scene
schema_file: templates/strict-spec-driven/schemas/scene.yaml
scene:
  id: operator-installs-viewer-plugin
  title: An operator installs the strict document viewer plugin into dsh
area: dsh-viewer
status: draft
actors:
  - name: operator
    role: A person running a pinned dsh release who installs the built strict document viewer plugin and confirms it loads in both client profiles.
preconditions:
  - A dsh release within the plugin's declared compatibility range is installed and runnable.
  - The plugin package dsh-plugin-strict-spec is built, producing its client bundle.
main_flow:
  observe-web-panel:
    action: Open the web client, observe the strict documents left-sidebar icon registered, and open it to the Session picker page.
    covered_by:
      - spec_id: dsh-viewer-behavior
        requirement_id: left-page-session-picker
  observe-desktop-panel:
    action: Open the desktop profile, observe the strict documents left-sidebar icon registered, and open it to the Session picker page.
    covered_by:
      - spec_id: dsh-viewer-behavior
        requirement_id: left-page-session-picker
  install-plugin-with-link-spec:
    action: 'Install the built plugin package into the running dsh release using a link: spec.'
    covered_by:
      - spec_id: dsh-viewer-behavior
        requirement_id: left-page-session-picker
exception_flows:
  dsh-release-outside-pin:
    trigger: The running dsh release falls outside the plugin's declared compatibility range.
    steps:
      observe-no-ui:
        action: Observe that the plugin registers no viewer document UI in that release.
        covered_by:
          - spec_id: dsh-viewer-behavior
            requirement_id: host-compatibility-gate

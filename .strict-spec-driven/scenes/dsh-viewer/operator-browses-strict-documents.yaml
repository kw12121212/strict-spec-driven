schema: strict-spec-driven/scene/v1
schema_version: 1
artifact_type: scene
schema_file: templates/strict-spec-driven/schemas/scene.yaml
scene:
  id: operator-browses-strict-documents
  title: An operator browses strict documents in dsh
area: dsh-viewer
status: draft
actors:
  - name: operator
    role: A person using a dsh client who reads strict workflow documents without editing them.
preconditions:
  - The strict document viewer plugin is installed in a dsh client.
  - The running dsh release is inside the viewer plugin's declared compatibility range.
  - The Session workspace shown to the operator is a repository using the strict-spec-driven workflow.
main_flow:
  open-right-sidebar-tab:
    action: The operator opens the strict documents tab from the right sidebar's guide entry, which binds to the Session whose surface renders it, shows that Session's workspace through the shared tree and renderer within the pane width, and closes the previous Session's watches when the active Session switches.
    covered_by:
      - spec_id: dsh-viewer-behavior
        requirement_id: right-sidebar-tab
  open-left-panel-page:
    action: The operator opens the left-sidebar global page and picks a Session in its Session picker, which groups Sessions by workspace, remembers the last choice, and shows the chosen Session's workspace.
    covered_by:
      - spec_id: dsh-viewer-behavior
        requirement_id: left-page-session-picker
  view-tree:
    action: The operator views the document tree, which lists the strict artifact families present in the workspace in the fixed family order and omits families whose canonical locations are absent.
    covered_by:
      - spec_id: dsh-viewer-behavior
        requirement_id: tree-family-order
      - spec_id: dsh-viewer-behavior
        requirement_id: absent-family-omitted
  expand-family-group:
    action: The operator expands a collapsed family group and its documents are listed with labels derived from their declared fields.
    covered_by:
      - spec_id: dsh-viewer-behavior
        requirement_id: tree-family-order
  expand-archive:
    action: The operator expands an archived group that was collapsed by default and whose entries were unread until this expansion.
    covered_by:
      - spec_id: dsh-viewer-behavior
        requirement_id: archive-groups-collapsed
  open-document:
    action: 'The operator opens a strict document from the tree, which renders in the view its artifact type uses: a dedicated view for change, project-context, roadmap, spec, and scene documents, or the generic structured view for a type without one, showing declared field values exactly as written with unrecognized top-level fields appended under an additional-fields section.'
    covered_by:
      - spec_id: dsh-viewer-behavior
        requirement_id: generic-structured-rendering
      - spec_id: dsh-viewer-behavior
        requirement_id: declared-values-only
  wait-for-loading:
    action: The operator opens an entry point while the workspace loads and sees a loading condition until the families are ready.
    covered_by:
      - spec_id: dsh-viewer-behavior
        requirement_id: viewer-status-conditions
  scan-tree-presentation:
    action: The operator scans the tree, whose document rows carry file-type glyphs, loaded groups carry entry counts, milestone and planned-change rows carry their declared status, and nesting indents one consistent step per level.
    covered_by:
      - spec_id: dsh-viewer-behavior
        requirement_id: tree-node-presentation
  navigate-tree-keyboard:
    action: The operator moves through the tree with the keyboard only, expanding and collapsing the focused group and opening the focused document, with the focused row kept visible.
    covered_by:
      - spec_id: dsh-viewer-behavior
        requirement_id: tree-keyboard-navigation
  return-to-workspace:
    action: The operator returns to a previously shown workspace and its expand choices are restored, with archived entries still unread while collapsed.
    covered_by:
      - spec_id: dsh-viewer-behavior
        requirement_id: tree-expand-persistence
  scan-structured-document:
    action: The operator scans the structured view, whose top-level scalars form the header, mappings render as titled sections, sequences as lists, multiline text as wrapped paragraphs, and deep nesting as collapsible blocks.
    covered_by:
      - spec_id: dsh-viewer-behavior
        requirement_id: generic-renderer-structure
  read-two-pane-layout:
    action: The operator reads the page's two panes, with the document tree in the left pane and the open document in the wide right pane.
    covered_by:
      - spec_id: dsh-viewer-behavior
        requirement_id: left-page-two-pane-layout
  reopen-page-restores-selection:
    action: The operator opens the page again and the previously chosen Session and the selected document are restored without re-choosing either.
    covered_by:
      - spec_id: dsh-viewer-behavior
        requirement_id: left-page-selection-restore
  open-change-tasks:
    action: 'The operator opens an active change''s tasks document and reads its dedicated view: tasks grouped by section, a done or pending marker per task, per-section completion counts, and the overall completion.'
    covered_by:
      - spec_id: dsh-viewer-behavior
        requirement_id: change-artifact-renderers
  open-change-delta:
    action: The operator opens a change-scoped delta spec, delta scene, or delta tech file and reads its operation groups, each labeled with its declared operation, with requirement bodies, scene flow steps, and rule bodies laid out as in their main counterparts.
    covered_by:
      - spec_id: dsh-viewer-behavior
        requirement_id: change-artifact-renderers
  open-archived-change:
    action: The operator expands the change archive and opens one of its documents, which renders through the same dedicated view an active change uses.
    covered_by:
      - spec_id: dsh-viewer-behavior
        requirement_id: change-artifact-renderers
  scan-change-completion-badge:
    action: The operator scans the changes family, where each non-archived change group node carries a completed-over-total task completion badge that refreshes when its tasks file changes, and archived change groups carry none.
    covered_by:
      - spec_id: dsh-viewer-behavior
        requirement_id: tree-node-presentation
  open-config-and-standards:
    action: 'The operator opens the workflow config, a technical standard, and the tech index, and reads their dedicated views: the config''s rules grouped by category with its review evidence command and coverage threshold and maintenance checks, the standard''s category with each rule''s emphasized MUST or SHOULD strength, and the index''s list of standards.'
    covered_by:
      - spec_id: dsh-viewer-behavior
        requirement_id: project-context-renderers
  open-architecture-and-design-system:
    action: 'The operator opens the architecture document and the design system, and reads their dedicated views: components, data flows, and decisions as structured sections, and the design system''s tokens grouped by token family, components, and guidance.'
    covered_by:
      - spec_id: dsh-viewer-behavior
        requirement_id: project-context-renderers
  open-lessons-and-sops:
    action: 'The operator opens the lessons index, a lesson, and an SOP, and reads their dedicated views: the index grouped by category, the lesson''s status with its obsolete marking, and the SOP''s steps in their declared order with roles, exceptions, and success criteria.'
    covered_by:
      - spec_id: dsh-viewer-behavior
        requirement_id: project-context-renderers
  open-roadmap-index:
    action: The operator opens the roadmap index and reads its dedicated view, which lists the milestones in the sequence their order fields assign, each with its declared status and no derived roadmap state.
    covered_by:
      - spec_id: dsh-viewer-behavior
        requirement_id: roadmap-artifact-renderers
  open-milestone-and-owned-changes:
    action: The operator opens a milestone and reads its dedicated view — goal, scope in and out side by side, done criteria as a checklist, intake-question cards, and the planned changes the milestone owns with their declared statuses — and selects an owned planned change, which opens in the document view.
    covered_by:
      - spec_id: dsh-viewer-behavior
        requirement_id: roadmap-artifact-renderers
  open-planned-change-and-follow-dependency:
    action: The operator opens a planned change, reads its summary, status, owning milestone, and depends_on entries, selects one entry whose target the tree holds and is navigated to that planned change, and sees a visible unresolved marker on an entry whose target is not found.
    covered_by:
      - spec_id: dsh-viewer-behavior
        requirement_id: roadmap-artifact-renderers
  open-archived-roadmap-document:
    action: The operator expands the roadmap archive and opens an archived milestone or planned change, which renders through the same dedicated view its active counterpart uses, with the archived milestone owned entries resolved by reading the archived planned-change files.
    covered_by:
      - spec_id: dsh-viewer-behavior
        requirement_id: roadmap-artifact-renderers
  open-main-spec:
    action: 'The operator opens a main spec and reads its dedicated view: the declared spec identity, and each requirement with its declared MUST, SHOULD, or MAY strength emphasized beside its statement, its scenarios under their declared keywords, and a stable anchor every requirement carries.'
    covered_by:
      - spec_id: dsh-viewer-behavior
        requirement_id: spec-and-scene-artifact-renderers
  open-specs-index:
    action: The operator opens the specs index and reads its dedicated view, which groups the entries under the spec areas their declared paths name, each with its id and title.
    covered_by:
      - spec_id: dsh-viewer-behavior
        requirement_id: spec-and-scene-artifact-renderers
  open-scene-and-follow-coverage:
    action: The operator opens a scene and reads its dedicated view — actors with their responsibilities, preconditions, the ordered main flow, and exception flows under their declared triggers — and selects a step's covering requirement, which opens the covering spec anchored at that requirement through the same open action a tree row uses, while a reference whose spec the tree does not hold presents a visible unresolved marker, a waived step presents its declared no-coverage reason, and a step declaring neither is visibly flagged.
    covered_by:
      - spec_id: dsh-viewer-behavior
        requirement_id: spec-and-scene-artifact-renderers
  open-scenes-index:
    action: The operator opens the scenes index and reads its dedicated view, which groups the entries under their declared scene areas, each with its title and status.
    covered_by:
      - spec_id: dsh-viewer-behavior
        requirement_id: spec-and-scene-artifact-renderers
exception_flows:
  missing-workflow-directory:
    trigger: The workspace of the active or chosen Session has no .strict-spec-driven/ directory.
    steps:
      show-empty-state:
        action: The open entry point shows an explicit empty state instead of a document tree.
        covered_by:
          - spec_id: dsh-viewer-behavior
            requirement_id: empty-state
  malformed-yaml-document:
    trigger: The operator opens a strict document whose YAML cannot be parsed.
    steps:
      show-located-parse-error:
        action: The document view renders a parse error naming the error's location beside the raw document text, and the tree remains usable.
        covered_by:
          - spec_id: dsh-viewer-behavior
            requirement_id: located-parse-error
  open-document-removed:
    trigger: The document open in the view is deleted from disk while it is open.
    steps:
      reflect-removal:
        action: The open view and the loaded tree update without a manual reload to reflect that the document is no longer present.
        covered_by:
          - spec_id: dsh-viewer-behavior
            requirement_id: live-refresh
  truncated-directory-listing:
    trigger: A directory listing is cut short by the host workspace-files entry cap.
    steps:
      show-truncation-marker:
        action: The tree shows an explicit truncation marker for the cut directory rather than implying a complete listing.
        covered_by:
          - spec_id: dsh-viewer-behavior
            requirement_id: truncated-listing-marker
  incompatible-dsh-release:
    trigger: The running dsh release falls outside the viewer plugin's declared compatibility range.
    steps:
      withhold-viewer-ui:
        action: No viewer document UI registers, so no partially working tree or document view is shown.
        covered_by:
          - spec_id: dsh-viewer-behavior
            requirement_id: host-compatibility-gate
  workspace-listing-fails:
    trigger: The workflow root listing of the shown workspace fails.
    steps:
      show-error-condition:
        action: The tree shows an explicit error condition naming the failure rather than an empty tree.
        covered_by:
          - spec_id: dsh-viewer-behavior
            requirement_id: viewer-status-conditions
  no-session-for-workspace:
    trigger: The workspace the operator wants to read holds no Session.
    steps:
      prompt-open-session:
        action: The page shows a prompt to open a Session for that workspace and reads none of its files.
        covered_by:
          - spec_id: dsh-viewer-behavior
            requirement_id: left-page-no-session-prompt

lesson:
  id: a-command-named-like-a-check-can-be-a-writer-63db07
  title: A command named like a check can be a writer
category: tooling
status: active
created_at: '2026-08-06T10:05:34.293Z'
updated_at: '2026-08-16T14:33:18.624Z'
context: Verifying that a change had not introduced repository drift, by running strict-spec-cli maintenance expecting it to report findings the way verify-spec-mappings and check-yaml-mutation-inventory do.
observation: The command exited zero reporting {"valid":true,"checksRun":2,"findingsCount":1,"generatedChange":"maintenance-2026-08-06"} — it had seeded a second active change directory from a pre-existing ARCHITECTURE.md drift finding. There is no read-only mode and no confirmation step, and with two active changes already the change limit would have blocked the next propose. Cancelling the generated change restored the prior state, but only because nothing had been authored into it yet.
takeaway: 'Before running a strict CLI command for its report, confirm from the root help groups or the command''s own --help whether it writes: names drawn from inspection vocabulary — maintenance, sync, doctor, status — do not partition into readers and writers, and a writer invoked for its output leaves state behind that the caller then has to undo.'
applies_when: About to run a strict CLI command purely to inspect or confirm repository state, when its name suggests a check but it is not one of the commands already known to be read-only.
occurrences:
  - origin: align-cli-help-and-mcp-mutations
    date: '2026-08-06'
    evidence: strict-spec-cli maintenance created .strict-spec-driven/changes/maintenance-2026-08-06/ with proposal, questions, and tasks artifacts; src/maintenance.ts seeds a change from findings, and strict-spec-cli cancel maintenance-2026-08-06 was needed to undo it.
  - origin: milestone-awaiting-refinement
    date: '2026-08-16'
    evidence: A Verification task whose command was 'strict-spec-cli maintenance' created .strict-spec-driven/changes/maintenance-2026-08-16/ with proposal, questions, and tasks artifacts while the change was being verified; strict-spec-cli cancel maintenance-2026-08-16 was needed to undo it. The finding it seeded (stale ARCHITECTURE.md) was pre-existing drift from commit b92c457, unrelated to the change under verification.

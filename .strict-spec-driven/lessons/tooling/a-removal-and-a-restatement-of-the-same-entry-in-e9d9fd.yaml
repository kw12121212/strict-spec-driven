lesson:
  id: a-removal-and-a-restatement-of-the-same-entry-in-e9d9fd
  title: A removal and a restatement of the same entry in one generate call leaves the entry removed
category: tooling
status: active
created_at: '2026-09-23T07:59:17.608Z'
updated_at: '2026-09-23T07:59:17.608Z'
context: Replacing a design decision by passing --remove-decision <id> and --decision <id> with new text in one generate design invocation.
observation: 'The command exited zero and reported the design as replaced, but the decision was absent afterwards: the removal applies after the restatement, so the call deleted the entry it was meant to rewrite.'
takeaway: Restating an id already overwrites that entry field by field, so rewrite an entry with the restatement alone; when a true remove-then-add is needed, run two separate calls and read the artifact back before relying on it.
applies_when: A single generate or authoring invocation combines a --remove-* flag with a restatement of the same id, or an entry is being replaced rather than merged.
occurrences:
  - origin: create-change-in-the-recommending-call
    date: '2026-09-23'
    evidence: .strict-spec-driven/changes/create-change-in-the-recommending-call/design.yaml lost decision no-scene after 'generate design --remove-decision no-scene --decision no-scene ...' and needed a second call to restore it.

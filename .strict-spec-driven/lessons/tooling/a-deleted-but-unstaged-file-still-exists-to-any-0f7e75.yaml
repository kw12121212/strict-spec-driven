lesson:
  id: a-deleted-but-unstaged-file-still-exists-to-any-0f7e75
  title: A deleted-but-unstaged file still exists to any check that discovers files through git ls-files
category: tooling
status: active
created_at: '2026-08-08T03:46:28.246Z'
updated_at: '2026-09-29T03:56:44.148Z'
context: After deleting src/cli/spec-mapping.ts and src/cli/tech-mapping.ts from the working tree, inventory-edit was run to update the YAML mutation inventory.
observation: 'inventory-edit failed with a discovery-failed diagnostic reading ENOENT: no such file or directory, open ''src/cli/spec-mapping.ts'', which reads as a stale inventory reference even though no inventory entry named that file. The repository coverage check enumerates files with git ls-files -co, and a tracked file deleted from the working tree is still listed until the deletion is staged. Staging just the two deletions made the command succeed with no other change.'
takeaway: When a check that scans repository files fails on a file you just deleted, stage the deletion before hunting for a stale reference. git ls-files reports the index, not the working tree, so an unstaged rm is invisible to the tool and the resulting ENOENT points at the file rather than at the staging state.
applies_when: Deleting tracked source files in a change, then running any repository check, coverage gate, or CLI command that discovers its scope through git ls-files rather than by walking the filesystem.
occurrences:
  - origin: delete-mapping-commands-and-code
    date: '2026-08-08'
    evidence: strict-spec-cli inventory-edit exited 1 with code discovery-failed and message ENOENT ... src/cli/spec-mapping.ts; git add -- src/cli/spec-mapping.ts src/cli/tech-mapping.ts made the identical invocation commit successfully.
  - origin: remove-harness-capability
    date: '2026-09-29'
    evidence: inventory-edit --remove-entry artifact_families.harness-state was refused with uncovered-yaml-path for .strict-spec-driven/harness.yaml right after harness-edit --delete removed it from the worktree, because the inventory coverage check lists files with git ls-files -co; staging the deletion with git rm --cached let the same edit commit.

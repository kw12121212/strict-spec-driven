lesson:
  id: the-skill-you-are-running-is-the-installed-copy-a3b342
  title: The skill you are running is the installed copy, not the repository source
category: tooling
status: active
created_at: '2026-08-07T01:39:54.718Z'
updated_at: '2026-08-07T01:39:54.718Z'
context: Migrating bundled skills to CLI-only YAML authoring. While running /strict-roadmap-recommend, the skill instructed 'generate --reset', a flag the CLI has replaced with --delete, and that stale flag was written into the change's proposal, design, and requirement-trigger answer as evidence of a repository defect.
observation: The repository sources under skills/ contained zero '--reset' references; an earlier remove-reset-flags change had already cleaned them. All 59 occurrences across 12 skills lived in the installed copies under ~/.claude/skills/, which this repository neither tracks nor validates. A full flag audit against 80 commands and 306 declared flags then found no stale flag in any repo skill, so the task premised on fixing repo drift had nothing to fix.
takeaway: Behavior observed while running an installed skill is evidence about the installed copy, not about the source in the working tree. Before recording drift as a repository defect or scoping work to fix it, grep the repo path and the install path separately and compare counts; the two diverge silently because nothing in this repository validates what is installed.
applies_when: About to treat behavior observed while running an installed skill, plugin, or globally installed CLI as evidence about this repository's tracked source files, or scoping work from drift first noticed through such a tool.
occurrences:
  - origin: migrate-agent-skills-to-cli-only
    date: '2026-08-07'
    evidence: skills/ had 0 '--reset' occurrences while ~/.claude/skills/ had 59 across 12 skills; design.yaml decision command-map-freshness records the corrected premise

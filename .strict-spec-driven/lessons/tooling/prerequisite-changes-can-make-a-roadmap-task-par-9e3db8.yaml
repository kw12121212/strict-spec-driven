context: The migrate-workflow-and-change-yaml roadmap item followed mutation-foundation changes that had already moved most archive behavior behind verified domain lifecycle code.
observation: The initial design treated archive as needing a new cross-file transaction refactor, but direct inspection showed the existing verified archive pipeline already owned delta merges, index regeneration, roadmap reconciliation, and movement; only the newly changed apply write required migration.
takeaway: Re-audit the live mutation surface after selecting a roadmap item, then narrow redundant implementation tasks while preserving the planned observable outcome and recording the correction in design and tasks.
applies_when: a roadmap-backed change follows prerequisite milestones that may already implement part of its planned artifact-family or lifecycle scope

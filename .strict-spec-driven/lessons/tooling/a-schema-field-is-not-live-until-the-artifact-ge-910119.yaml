lesson:
  id: a-schema-field-is-not-live-until-the-artifact-ge-910119
  title: A schema field is not live until the artifact generator's normalizer copies it
category: tooling
status: active
created_at: '2026-08-04T10:14:34.830Z'
updated_at: '2026-08-20T17:16:46.017Z'
context: Adding optional kind and answered_by fields to the strict question-list schema, with parser support for the matching --kind and --answered-by flags on generate questions.
observation: 'The schema accepted the fields and the CLI parser read them, but every generated artifact came back without them and the command still exited zero with valid: true. buildQuestionsArtifact in src/propose-generation.ts maps each entry through normalizeOpenQuestion and normalizeResolvedQuestion, which construct a fresh object from a fixed field list, so any field outside that list is dropped between parsing and writing. Nothing reported it: the projection happens before validation, so the written artifact is schema-valid precisely because the new field is gone.'
takeaway: 'Extending a strict YAML artifact means editing four places, not one: the schema, the CLI argument parser, the normalizer in propose-generation.ts that builds the artifact, and the command-metadata entry that documents the flag. A successful write with the field missing is the signature of a normalizer that has not been updated, because normalizers rebuild entries from an explicit field list rather than spreading the input.'
applies_when: Adding or renaming a field on any strict YAML artifact that strict-spec-cli generate writes, or debugging why a generated artifact is missing a field the schema and parser both accept.
occurrences:
  - origin: requirement-interrogation-gate
    date: '2026-08-04'
    evidence: 'generate questions --kind requirement --answered-by human exited zero with valid: true while the written questions.yaml entries carried neither field, until applyQuestionAttribution was added to normalizeOpenQuestion and normalizeResolvedQuestion in src/propose-generation.ts'
  - origin: fix-roadmap-generate-awaiting-refinement
    date: '2026-08-20'
    evidence: src/roadmap/author.ts buildArtifact reconstructed milestone artifacts from a fixed field list and omitted an existing awaiting_refinement mapping; the new end-to-end assertion failed before the preservation copy and passed in the 808-test focused suite after it.

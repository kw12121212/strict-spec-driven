    date: '2026-10-19'
    evidence: 'plugins/dsh-strict-spec/src/model/traversal.ts loadGroupChildren listed the family node path before the fix; test/suites/dsh-plugin-model.ts re-expansion case failed for config and architecture (after: []) and passes after; real-host Architecture and Config collapse and re-expand on dsh 0.2.1-rc.2.'

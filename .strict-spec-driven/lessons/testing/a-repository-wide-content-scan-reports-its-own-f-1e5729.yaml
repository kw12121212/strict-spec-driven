lesson:
  id: a-repository-wide-content-scan-reports-its-own-f-1e5729
  title: A repository-wide content scan reports its own fixtures and its siblings' absence assertions
category: testing
status: active
created_at: '2026-08-18T03:09:36.548Z'
updated_at: '2026-08-18T03:09:36.548Z'
context: Adding a test that scans bundled skills, operator documentation, and source for references to a skill directory that does not exist, after deleting nine roadmap skills. The matcher recognizes a skill name preceded by a backtick, a slash, or 'skills/', and the probes that prove it fires were written as ordinary string literals in the same suite file.
observation: 'The scan reported three findings against its own file: the literal probe strings ''strict-spec-debug-session'', ''/strict-roadmap-sync'', and ''skills/strict-roadmap-archive/SKILL.md'' written to prove the matcher works were themselves matched, because the suite is inside the governed scope. Assembling the probe names at runtime from concatenated fragments cleared that. A second full run then failed on a different file: test/suites/spec-tech-authoring.ts owns the sweep that forbids the deleted strict-spec-resync-code-mapping skill, so it must spell that name out, and it had also been put on the new scan''s allowlist — which the sibling sweep itself forbids. Each discovery cost a full 15-minute suite run.'
takeaway: 'Before adding a repository-wide content scan, ask which files legitimately contain the thing being banned. The scan''s own proof fixtures are the first, and are fixed by building the probe strings at runtime rather than exempting the file, which would blind the scan to real findings in it. Sibling tests that assert a name''s absence are the second, and are a reason to scope the scan to what ships and routes rather than to the whole tree: naming a deleted thing in a test is a statement of fact, while naming it in shipped guidance is a broken instruction. Never silence one by allowlisting the banned name, because the allowlist then covers the real finding too.'
applies_when: Adding a static check that scans repository files for a banned or stale token — a deleted command, skill, flag, or field — where the check's own test file, or another suite that asserts the same token's absence, falls inside the scanned scope.
occurrences:
  - origin: remove-merged-roadmap-skills-and-prove-reduction
    date: '2026-08-18'
    evidence: 'Run one failed with ''test/suites/entrypoint-and-skills.ts: strict-roadmap-archive, strict-roadmap-sync, strict-spec-debug-session'' from its own probe literals. Run two failed the pre-existing mapping sweep with ''test/suites/entrypoint-and-skills.ts:3673 (deleted-repair-skill)'' because strict-spec-resync-code-mapping had been allowlisted. Scoping the walk to skills/, root *.md, and src/ and assembling probe names at runtime produced ''All 4325 tests passed''.'

lesson:
  id: a-content-check-whose-subject-includes-the-text-1f5d78
  title: A content check whose subject includes the text it inserts can pass vacuously
category: testing
status: active
created_at: '2026-08-07T01:40:04.995Z'
updated_at: '2026-08-07T01:40:04.995Z'
context: Adding regression assertions that every mutation-capable skill carries an inserted CLI-only authoring protocol section, where membership in the checked set was derived by scanning each SKILL.md for the owning CLI commands it names.
observation: The inserted section itself names those owning commands, so the classification read text the check had put there. Deleting the section from a skill could remove its only command mention, reclassify it as read-only, and satisfy the 'carries no section' branch instead of failing the 'must carry it' branch. Deriving membership from the file with the section stripped fixed it, and a deliberate deletion of one skill's section then produced 7 failures instead of silence.
takeaway: When a check both inserts content and decides its own scope from file content, exclude the inserted region before computing scope, then prove it by deleting the content and confirming the check fails. A green suite over generated content is not evidence until the negative case has been run once.
applies_when: Adding a static check over content that the same change generates or inserts, especially when the set of files to check is derived by scanning those files rather than from an independent source.
occurrences:
  - origin: migrate-agent-skills-to-cli-only
    date: '2026-08-07'

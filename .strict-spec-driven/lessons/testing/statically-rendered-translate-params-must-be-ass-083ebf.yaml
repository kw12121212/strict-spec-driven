lesson:
  id: statically-rendered-translate-params-must-be-ass-083ebf
  title: Statically rendered translate params must be asserted with HTML escaping
category: testing
status: active
created_at: '2026-10-18T15:56:48.973Z'
updated_at: '2026-10-19T07:02:18.358Z'
context: The dsh plugin component suite renders components through react-dom/server with a deterministic translate stand-in that returns key:JSON.stringify(params), and new dedicated-renderer cases asserted exact strings like tasks.overall:{"done":0,"total":3}.
observation: 'Six newly written renderer assertions failed on the first full-suite run although the components were correct: react-dom/server escapes double quotes in text nodes, so the rendered HTML contains tasks.overall:{&quot;done&quot;:0,&quot;total&quot;4} and every assertion matching the raw JSON form missed it; a second failure came from asserting a count (3) counted by eye from the example instead of from the model.'
takeaway: When asserting a params-carrying translate function's output in statically rendered HTML, assert the escaped form (&quot; for double quotes) or assert the pieces separately, and derive expected counts by running the view model once, not by reading the fixture by eye; a quick one-line bun -e render of the helper settles the exact spelling before a full suite cycle is spent.
applies_when: Writing or reviewing component-suite assertions over strings a translate function interpolates params into, in any react-dom/server static-render test.
occurrences:
  - origin: render-change-artifacts
    date: '2026-10-18'
    evidence: /tmp/rca-suite-1.log recorded 6/5025 failing on the exact-JSON assertions; a direct bun -e render showed tasks.overall:{&quot;done&quot;:0,&quot;total&quot;:1}; the suite passed after switching to the escaped literals (/tmp/rca-suite-2.log, 5027 passed).
  - origin: render-spec-and-scene-artifacts
    date: '2026-10-19'
    evidence: 'bun test/run.ts failed 1/5206 on the new spec renderer case: the assertion expected 3 scenario steps read by eye from examples/strict-spec-driven/main-spec.yaml while the example declares 4 (GIVEN, WHEN, AND, THEN); a direct bun -e run of specView over the example settled the count before the next full-suite cycle, and the suite passed after the assertion derived its count from the model output.'

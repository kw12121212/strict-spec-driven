lesson:
  id: a-snippet-removal-probe-is-defeated-by-a-line-wr-32e95c
  title: A snippet-removal probe is defeated by a line-wrapped occurrence
category: testing
status: active
created_at: '2026-08-18T10:20:15.381Z'
updated_at: '2026-08-18T10:20:15.381Z'
context: 'This change gave the new strict-roadmap-reorder skill the same negative-case harness the transition skill has: strip one piece of required evidence from the real SKILL.md, then assert validate-skills reports the corresponding diagnostic. Six of the seven evidence rows behaved. The ''dependency-order concern'' row failed twice in a row, with the paired ''carries the evidence to remove'' assertion passing each time, so the probe was demonstrably removing text and the validator was demonstrably not complaining.'
observation: The probe removes the snippet with a literal String.split(snippet).join(...), while the shipped required-snippet check compares against content whose whitespace has been collapsed. Two further occurrences of the phrase in the skill were wrapped across a line break, so the literal removal never touched them and the normalized text still satisfied the requirement. The signal is indistinguishable from a missing or misconfigured expectation, which is where the first debugging pass went; the actual fix was to rewrap two prose lines so every occurrence is literal.
takeaway: When a negative-case probe removes text that a normalizing checker will match, count occurrences in the normalized text, not the raw text. A probe that strips literals cannot reach a phrase the author line-wrapped, and the resulting failure reads as a broken expectation rather than a broken probe. Verify with a normalized count before editing the expectation.
applies_when: Writing or debugging a negative-case probe that removes a required phrase from a real file and asserts a validator reports it missing, where the validator collapses whitespace before matching and the phrase appears more than once in wrapped prose.
occurrences:
  - origin: remove-unused-skills-and-split-roadmap-reorder
    date: '2026-08-18'
    evidence: The reorder skill's 'dependency-order concern' probe failed across two full suite runs while its paired removal assertion passed. skills/strict-roadmap-reorder/SKILL.md carried the phrase four times, two of them wrapped as 'dependency-order\nconcern'; a normalized recount after literal removal showed 1 remaining, and rewrapping lines 14 and 175 made the probe fire.

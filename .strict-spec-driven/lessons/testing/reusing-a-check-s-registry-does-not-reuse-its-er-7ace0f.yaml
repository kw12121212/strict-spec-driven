lesson:
  id: reusing-a-check-s-registry-does-not-reuse-its-er-7ace0f
  title: Reusing a check's registry does not reuse its error handling
category: testing
status: active
created_at: '2026-08-18T11:02:09.011Z'
updated_at: '2026-08-18T11:02:09.011Z'
context: This change added a suite test asserting that every generated document committed in this repository still matches its YAML sources. Following the rule that a check must derive its scope from the implementation rather than a hand-maintained list, the test imported GENERATED_DOCUMENT_TARGETS — the same registry the shipped maintenance check walks — and called each target's check function against the repository root.
observation: The test crashed instead of reporting drift. The design-system target throws DocumentSourceError when the artifact is absent, which this repository never authored, and the skip for that case lives in the check's own loop rather than in the registry. Importing the registry brought the targets across but left the error contract behind, so the test inherited the scope and none of the handling that makes the scope safe to walk. The crash surfaced only because the mandatory negative case ran the suite against a deliberately stale document; a first run in the clean state would have crashed the same way and been read as a broken import.
takeaway: 'When a test derives its scope from a registry the implementation also walks, read the caller that walks it, not just the registry: skips, try/catch arms, and filters that make the walk safe usually live in the caller. Copy those into the test, or extract the walk so both share it. Deriving scope from the implementation removes one drift risk and adds another.'
applies_when: Writing a test that imports a list, registry, or target table from source in order to check the repository's own state with it, especially when the shipped consumer of that list wraps each entry in error handling or filtering.
occurrences:
  - origin: refresh-stale-architecture-document
    date: '2026-08-18'
    evidence: test/suites/operations.ts imported GENERATED_DOCUMENT_TARGETS from dist/maintenance.js and called target.check(ROOT) directly; the design-system target threw DocumentSourceError and aborted runOperationsSuite at operations.ts:560. runGeneratedDocCheck in src/maintenance.ts skips that error in its own loop. The fix mirrored the skip with a flatMap and an instanceof guard against DocumentSourceError loaded from dist/document-render.js.

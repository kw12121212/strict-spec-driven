lesson:
  id: markdown-command-fixtures-need-mutation-surface-03e282
  title: Markdown command fixtures need mutation-surface registration
category: testing
status: active
created_at: '2026-09-08T06:10:06.036Z'
updated_at: '2026-09-08T06:10:06.036Z'
context: Replacing the tasks --section argument with fixed selectors and adding a committed Markdown fixture containing a retired CLI invocation to prove shipped skill validation rejects stale guidance.
observation: The task behavior and stale-guidance tests passed, but full regression reported uncovered-mutation-path for test/fixtures/task-guidance/retired-section.md. The inventory scans Markdown command guidance even when a test only reads it. The proposal had not included the fixture registration, so a testing task was added to register it through inventory-edit.
takeaway: When adding a committed command-guidance fixture, check mutation-inventory coverage immediately and register its actual read-only test role and affected artifact family. Do not exempt the retired argument globally or turn the negative fixture into supported operator guidance.
applies_when: Adding a committed Markdown test fixture that contains a strict CLI mutation invocation or YAML-authoring instruction outside an already registered fixture path.
occurrences:
  - origin: explicit-task-section-flags
    date: '2026-09-08'
    evidence: The first bun scripts/coverage-gate.ts --threshold 78 run reported uncovered-mutation-path for test/fixtures/task-guidance/retired-section.md. inventory-edit added mutation_surfaces.task-selector-fixture-guidance with read-only classification and change-planning-state; bun run check:yaml-inventory then exited zero.

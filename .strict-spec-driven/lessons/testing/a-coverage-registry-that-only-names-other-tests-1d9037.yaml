lesson:
  id: a-coverage-registry-that-only-names-other-tests-1d9037
  title: A coverage registry that only names other tests proves nothing until each entry is resolved
category: testing
status: active
created_at: '2026-08-06T01:10:15.710Z'
updated_at: '2026-08-06T01:10:15.710Z'
context: This change built a per-family operation-matrix registry where each cell either references an assertion in another suite or is executed locally. The references and the local-execution claims were both written by hand from a survey of existing suites.
observation: Adding a pass that resolved every reference against the suite file, and a second pass that checked every locally-executed cell against the assertions actually run, immediately caught a cell claiming local execution that had none. The table looked complete and correct before those passes existed.
takeaway: 'When a document claims that coverage exists elsewhere, make the claim machine-resolvable in the same run that reads it: look up each referenced assertion in its source, and record which claims were actually executed so an unbacked claim fails. A registry whose entries are never resolved decays into prose the moment a referenced assertion is renamed.'
applies_when: adding a table, matrix, or manifest that declares coverage or ownership by pointing at tests, commands, or files elsewhere
occurrences:
  - origin: prove-yaml-artifact-operation-coverage
    date: '2026-08-06'
    evidence: test/suites/yaml-operation-matrix.ts

schema: strict-spec-driven/config/v1
schema_version: 1
artifact_type: workflow_config
context: |
  strict-spec-driven is a YAML-first spec-driven development workflow.
  It keeps the existing Agent Skills workflow concept intact, converting all
  spec-driven artifacts and related documentation formats into strict YAML schemas.
  Scripts create, validate, parse, and enforce those YAML schemas deterministically.
  YAML schema enforcement is the primary product constraint.
  Tech stack: Bun (runtime and package manager), TypeScript (strict, ESM,
  NodeNext), compiled from src/ to dist/ via tsc. Tests run with
  `bun test/run.ts` against compiled dist/ output. Build command: bun run build.
  Test command: bun test/run.ts.
rules:
  specs:
    - >-
      Describe observable behavior only — no implementation details, technology choices, or internal
      structure
    - >-
      MUST = required with no exceptions; SHOULD = default unless explicitly justified; MAY =
      genuinely optional
    - Each requirement must be independently verifiable from outside the system
  change:
    - >-
      Implement only what is in scope in proposal.yaml — if scope needs to expand, use
      strict-spec-modify first, never expand silently
    - >-
      When a requirement or task is ambiguous, ask the user before proceeding — do not assume or
      guess
    - Delta specs must reflect what was actually built, not the original plan
    - Mark tasks done immediately upon completion — never batch at the end
    - Every change must include test tasks (validation + unit tests at minimum)
  code:
    - Read existing code before modifying it
    - Implement only what the current task requires — no speculative features
    - No abstractions for hypothetical future needs (YAGNI)
  test:
    - Tests must verify observable behavior described in specs, not internal implementation details
    - Each test must be independent — no shared mutable state between tests
    - Prefer real dependencies over mocks for code the project owns
  tech:
    - >-
      Technical standards under .strict-spec-driven/tech/ capture implementation-facing engineering
      rules that specs deliberately exclude — technology choices, conventions, architecture, and
      security, performance, or API baselines
    - >-
      Treat applicable MUST rules as binding and SHOULD rules as defaults during proposal,
      implementation, and review
    - >-
      When a change must alter a standard, carry it as a delta tech artifact under the change's tech/
      directory so it merges on archive — never edit live standards during a change
    - >-
      Standalone standard maintenance outside an active change may use /strict-tech-edit directly
  ui:
    - >-
      User-observable UI behavior — what is shown, what is interactive, how state changes, and
      loading, error, and empty conditions — is captured as main spec requirements, not as
      implementation detail
    - >-
      UI engineering and design rules — design-system usage, styling conventions, accessibility
      baselines, internationalization — are captured as technical standards in the ui category
    - >-
      Pixel-level visual fidelity is governed by visual-regression snapshots referenced from
      mappings, not inlined into YAML artifacts
review_evidence:
  project_regression:
    method: complete_project_regression
    command: bun scripts/coverage-gate.ts --threshold 78
    meaning: >-
      Passing this command is required review evidence before strict-spec-review recommends archive
      or strict-spec-auto performs archive. The command builds the project, runs the complete
      project-level regression suite with subprocess coverage collection, and exits non-zero when
      measured src/** line coverage falls below the declared threshold, so insufficient coverage is
      a blocking workflow failure rather than advisory output.
    unavailable_behavior: >-
      If the command cannot run because required dependencies, services, credentials, fixtures, or
      other test conditions are unavailable, review or auto archive is blocked until a human
      prepares the environment or explicitly provides the missing evidence.
    coverage:
      threshold: 78
      metric: line
      scope:
        include:
          - src/**
        exclude:
          - src/embedded-templates.ts

            interval_seconds: 5
            notes:
              - Replace manual readiness with HTTP or TCP readiness when known.
          operations:
            start:
              mode: manual
            stop:
              mode: manual
            status:
              mode: manual
            logs:
              mode: manual
          evidence_labels: []
          unavailable_conditions: []

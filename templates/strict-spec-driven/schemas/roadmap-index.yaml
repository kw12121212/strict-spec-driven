schema: strict-spec-driven/schema/v1
schema_version: 1
schema_id: strict-spec-driven/roadmap-index/v1
artifact_type: roadmap_index
artifact_name: roadmap-index
description: Strict YAML roadmap index artifact.
example_ref: ../examples/roadmap-index.yaml
additional_fields: false
fields:
  schema:
    type: string
    required: true
    const: strict-spec-driven/roadmap-index/v1
  schema_version:
    type: integer
    required: true
    const: 1
  artifact_type:
    type: string
    required: true
    const: roadmap_index
  schema_file:
    type: string
    required: true
  milestones:
    type: sequence
    required: true
    unique_by: id
    items:
      type: mapping
      additional_fields: false
      fields:
        id:
          type: string
          required: true
        title:
          type: string
          required: true
        path:
          type: string
          required: true
          path: repo-relative
        status:
          type: string
          required: true
          enum:
            - proposed
            - active
            - blocked
            - complete

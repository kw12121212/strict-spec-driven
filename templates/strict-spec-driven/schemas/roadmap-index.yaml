schema: strict-spec-driven/schema/v1
schema_version: 1
schema_id: strict-spec-driven/roadmap-index/v2
artifact_type: roadmap_index
artifact_name: roadmap-index
description: Strict YAML roadmap index artifact (v2 — keyed milestone map).
example_ref: ../examples/roadmap-index.yaml
json_schema:
  $schema: "http://json-schema.org/draft-07/schema#"
  type: object
  additionalProperties: false
  required:
    - schema
    - schema_version
    - artifact_type
    - schema_file
    - milestones
  properties:
    schema:
      type: string
      const: strict-spec-driven/roadmap-index/v2
    schema_version:
      type: integer
      const: 2
    artifact_type:
      type: string
      const: roadmap_index
    schema_file:
      type: string
    milestones:
      type: object
      additionalProperties: false
      patternProperties:
        "^\\d{4}-":
          type: object
          additionalProperties: false
          required:
            - title
            - path
            - status
          properties:
            title:
              type: string
            path:
              type: string
            status:
              type: string
              enum:
                - proposed
                - active
                - blocked
                - complete

schema: strict-spec-driven/schema/v1
schema_version: 1
schema_id: strict-spec-driven/delta-spec/v1
artifact_type: delta_spec
artifact_name: delta-spec
description: Strict YAML delta spec artifact.
example_ref: ../examples/delta-spec.yaml
coverage_examples:
  - ../examples/delta-spec.operations.yaml
merge_rules:
  exclusive_active_target: |
    A requirement ID that appears as a MODIFIED or REMOVED target in one active change
    MUST NOT appear as a MODIFIED or REMOVED target in any other active change.
    Verify must enforce this constraint and report it as a deterministic validation failure.
  modified_missing_target: |
    If a MODIFIED entry targets a requirement ID that does not exist in the main spec at
    archive time, the entry is treated as ADDED and recorded in the archive merge report.
  removed_missing_target: |
    If a REMOVED entry targets a requirement ID that does not exist in the main spec at
    archive time, the entry is silently skipped and recorded as a skipped removal in the
    archive merge report.
json_schema:
  $schema: "http://json-schema.org/draft-07/schema#"
  definitions:
    requirement:
      type: object
      additionalProperties: false
      required:
        - id
        - strength
        - statement
        - scenarios
      properties:
        id:
          type: string
        strength:
          type: string
          enum:
            - MUST
            - SHOULD
            - MAY
        statement:
          type: string
        scenarios:
          type: array
          items:
            type: object
  type: object
  additionalProperties: false
  required:
    - schema
    - schema_version
    - artifact_type
    - schema_file
    - target_spec
    - mapping
    - operations
  properties:
    schema:
      type: string
      const: strict-spec-driven/delta-spec/v1
    schema_version:
      type: integer
      const: 1
    artifact_type:
      type: string
      const: delta_spec
    schema_file:
      type: string
    target_spec:
      type: string
    mapping:
      type: object
      additionalProperties: false
      required:
        - implementation
        - tests
      properties:
        implementation:
          type: array
          items:
            type: string
        tests:
          type: array
          items:
            type: string
    operations:
      type: object
      additionalProperties: false
      required:
        - ADDED
        - MODIFIED
        - REMOVED
      properties:
        ADDED:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - requirement
            properties:
              requirement:
                "$ref": "#/definitions/requirement"
        MODIFIED:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - target_requirement
              - replacement
            properties:
              target_requirement:
                type: string
              replacement:
                "$ref": "#/definitions/requirement"
        REMOVED:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - target_requirement
              - reason
            properties:
              target_requirement:
                type: string
              reason:
                type: string

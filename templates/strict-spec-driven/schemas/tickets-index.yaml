schema: strict-spec-driven/schema/v1
schema_version: 1
schema_id: strict-spec-driven/tickets-index/v1
artifact_type: tickets_index
artifact_name: tickets-index
description: Strict YAML tickets index artifact (keyed ticket map keyed by conflict-resistant ticket id).
example_ref: ../../../examples/strict-spec-driven/tickets-index.yaml
json_schema:
  $schema: "http://json-schema.org/draft-07/schema#"
  type: object
  additionalProperties: false
  required:
    - schema
    - schema_version
    - artifact_type
    - schema_file
    - tickets
  properties:
    schema:
      type: string
      const: strict-spec-driven/tickets-index/v1
    schema_version:
      type: integer
      const: 1
    artifact_type:
      type: string
      const: tickets_index
    schema_file:
      type: string
    tickets:
      type: object
      additionalProperties: false
      patternProperties:
        "^[a-z0-9][a-z0-9-]*[a-z0-9]$|^[a-z0-9]$":
          type: object
          additionalProperties: false
          required:
            - title
            - path
            - status
          properties:
            title:
              type: string
              minLength: 1
            path:
              type: string
              minLength: 1
            status:
              type: string
              enum:
                - open
                - needs_input
                - promoted
                - implemented
                - rejected

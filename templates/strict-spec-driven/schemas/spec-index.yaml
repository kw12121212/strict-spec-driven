schema: strict-spec-driven/schema/v1
schema_version: 1
schema_id: strict-spec-driven/spec-index/v1
artifact_type: spec_index
artifact_name: spec-index
description: Strict YAML spec index artifact.
example_ref: ../../../examples/strict-spec-driven/spec-index.yaml
json_schema:
  $schema: "http://json-schema.org/draft-07/schema#"
  type: object
  additionalProperties: false
  required:
    - schema
    - schema_version
    - artifact_type
    - schema_file
    - specs
  properties:
    schema:
      type: string
      const: strict-spec-driven/spec-index/v1
    schema_version:
      type: integer
      const: 1
    artifact_type:
      type: string
      const: spec_index
    schema_file:
      type: string
    specs:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
          - id
          - title
          - path
        properties:
          id:
            type: string
          title:
            type: string
          path:
            type: string

schema: strict-spec-driven/schema/v1
schema_version: 1
schema_id: strict-spec-driven/roadmap-milestone/v2
artifact_type: roadmap_milestone
artifact_name: roadmap-milestone
description: Strict YAML roadmap milestone artifact (v2 — keyed milestone identity plus reserved planned_changes mapping for explicit legacy materialization workflows).
example_ref: ../../../examples/strict-spec-driven/roadmap-milestone.yaml
json_schema:
  $schema: http://json-schema.org/draft-07/schema#
  type: object
  additionalProperties: false
  required:
    - schema
    - schema_version
    - artifact_type
    - schema_file
    - milestone
    - goal
    - scope
    - done_criteria
    - intake_questions
    - planned_changes
    - dependencies
    - risks
    - status
    - notes
  properties:
    schema:
      type: string
      const: strict-spec-driven/roadmap-milestone/v2
    schema_version:
      type: integer
      const: 2
    artifact_type:
      type: string
      const: roadmap_milestone
    schema_file:
      type: string
    milestone:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      patternProperties:
        ^(\d{4}-)?([a-z0-9][a-z0-9-]*[a-z0-9]|[a-z0-9])$:
          type: object
          additionalProperties: false
          required:
            - title
          properties:
            title:
              type: string
    order:
      type: integer
    goal:
      type: string
    scope:
      type: object
      additionalProperties: false
      required:
        - in
        - out
      properties:
        in:
          type: array
          items:
            type: string
        out:
          type: array
          items:
            type: string
    done_criteria:
      type: array
      items:
        type: string
    intake_questions:
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required:
          - id
          - question
          - context
          - impact
          - recommendation
        properties:
          id:
            type: string
            pattern: ^[a-z0-9][a-z0-9-]*[a-z0-9]$|^[a-z0-9]$
          question:
            type: string
            minLength: 1
          context:
            type: string
            minLength: 1
          impact:
            type: string
            minLength: 1
          recommendation:
            type: string
            minLength: 1
    planned_changes:
      type: object
      additionalProperties: false
      patternProperties:
        ^[a-z0-9][a-z0-9-]*[a-z0-9]$|^[a-z0-9]$:
          type: object
          additionalProperties: false
          required:
            - status
            - summary
            - details
            - depends_on
          properties:
            status:
              type: string
              enum:
                - planned
                - complete
            summary:
              type: string
            details:
              type: string
              minLength: 1
            depends_on:
              type: array
              items:
                type: string
    dependencies:
      type: array
      items:
        type: string
    risks:
      type: array
      items:
        type: string
    status:
      type: string
      enum:
        - proposed
        - planned
        - blocked
        - complete
    paused:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: boolean
          const: true
        reason:
          type: string
          minLength: 1
        paused_on:
          type: string
          minLength: 1
    notes:
      type: array
      items:
        type: string
    details:
      type: string
    awaiting_refinement:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: boolean
          const: true
        reason:
          type: string
          minLength: 1
        deferred_on:
          type: string
          minLength: 1

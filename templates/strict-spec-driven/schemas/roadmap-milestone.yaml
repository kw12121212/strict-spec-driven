schema: strict-spec-driven/schema/v1
schema_version: 1
schema_id: strict-spec-driven/roadmap-milestone/v1
artifact_type: roadmap_milestone
artifact_name: roadmap-milestone
description: Strict YAML roadmap milestone artifact.
example_ref: ../examples/roadmap-milestone.yaml
additional_fields: false
fields:
  schema:
    type: string
    required: true
    const: strict-spec-driven/roadmap-milestone/v1
  schema_version:
    type: integer
    required: true
    const: 1
  artifact_type:
    type: string
    required: true
    const: roadmap_milestone
  schema_file:
    type: string
    required: true
  milestone:
    type: mapping
    required: true
    additional_fields: false
    fields:
      id:
        type: string
        required: true
      title:
        type: string
        required: true
  goal:
    type: string
    required: true
  scope:
    type: mapping
    required: true
    additional_fields: false
    fields:
      in:
        type: sequence
        required: true
        items:
          type: string
      out:
        type: sequence
        required: true
        items:
          type: string
  done_criteria:
    type: sequence
    required: true
    items:
      type: string
  planned_changes:
    type: sequence
    required: true
    max_items: 10
    unique_by: id
    items:
      type: planned_change_entry
  dependencies:
    type: sequence
    required: true
    items:
      type: string
  risks:
    type: sequence
    required: true
    items:
      type: string
  status:
    type: string
    required: true
    enum:
      - proposed
      - active
      - blocked
      - complete
  notes:
    type: sequence
    required: true
    items:
      type: string
  details:
    type: string
    required: false

schema: strict-spec-driven/schema/v1
schema_version: 1
schema_id: strict-spec-driven/task-list/v1
artifact_type: task_list
artifact_name: task-list
description: Strict YAML task list artifact.
example_ref: ../examples/task-list.yaml
json_schema:
  $schema: "http://json-schema.org/draft-07/schema#"
  type: object
  additionalProperties: false
  required:
    - schema
    - schema_version
    - artifact_type
    - schema_file
    - change
    - sections
    - testing_gates
  properties:
    schema:
      type: string
      const: strict-spec-driven/task-list/v1
    schema_version:
      type: integer
      const: 1
    artifact_type:
      type: string
      const: task_list
    schema_file:
      type: string
    change:
      type: string
    sections:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
          - name
          - tasks
        properties:
          name:
            type: string
            enum:
              - Implementation
              - Testing
              - Verification
          tasks:
            type: array
            minItems: 1
            items:
              type: object
              additionalProperties: false
              required:
                - id
                - text
                - status
              properties:
                id:
                  type: string
                text:
                  type: string
                status:
                  type: string
                  enum:
                    - pending
                    - complete
                command:
                  type: string
    testing_gates:
      type: object
      additionalProperties: false
      required:
        - validation_task
        - unit_test_task
      properties:
        validation_task:
          type: string
        unit_test_task:
          type: string

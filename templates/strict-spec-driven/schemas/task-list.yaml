schema: strict-spec-driven/schema/v1
schema_version: 1
schema_id: strict-spec-driven/task-list/v2
artifact_type: task_list
artifact_name: task-list
description: Strict YAML task list artifact (v2 keyed-map format).
example_ref: ../../../examples/strict-spec-driven/task-list.yaml
json_schema:
  $schema: "http://json-schema.org/draft-07/schema#"
  type: object
  additionalProperties: false
  required:
    - schema
    - schema_version
    - artifact_type
    - schema_file
    - change
    - sections
    - testing_gates
  properties:
    schema:
      type: string
      const: strict-spec-driven/task-list/v2
    schema_version:
      type: integer
      const: 2
    artifact_type:
      type: string
      const: task_list
    schema_file:
      type: string
    change:
      type: string
    sections:
      type: object
      additionalProperties: false
      properties:
        Implementation:
          type: object
          minProperties: 1
          additionalProperties:
            type: object
            additionalProperties: false
            required:
              - text
              - status
            properties:
              text:
                type: string
              status:
                type: string
                enum:
                  - pending
                  - complete
              command:
                type: string
        Testing:
          type: object
          minProperties: 1
          additionalProperties:
            type: object
            additionalProperties: false
            required:
              - text
              - status
            properties:
              text:
                type: string
              status:
                type: string
                enum:
                  - pending
                  - complete
              command:
                type: string
        Verification:
          type: object
          minProperties: 1
          additionalProperties:
            type: object
            additionalProperties: false
            required:
              - text
              - status
            properties:
              text:
                type: string
              status:
                type: string
                enum:
                  - pending
                  - complete
              command:
                type: string
    testing_gates:
      type: object
      additionalProperties: false
      required:
        - validation_task
        - unit_test_task
      properties:
        validation_task:
          type: string
        unit_test_task:
          type: string

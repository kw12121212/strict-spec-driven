schema: strict-spec-driven/schema/v1
schema_version: 1
schema_id: strict-spec-driven/change-proposal/v1
artifact_type: change_proposal
artifact_name: change-proposal
description: Strict YAML change proposal artifact.
example_ref: ../../../examples/strict-spec-driven/change-proposal.yaml
json_schema:
  $schema: "http://json-schema.org/draft-07/schema#"
  type: object
  additionalProperties: false
  required:
    - schema
    - schema_version
    - artifact_type
    - schema_file
    - change
    - summary
    - scope
    - unchanged_behavior
  properties:
    schema:
      type: string
      const: strict-spec-driven/change-proposal/v1
    schema_version:
      type: integer
      const: 1
    artifact_type:
      type: string
      const: change_proposal
    schema_file:
      type: string
    change:
      type: object
      additionalProperties: false
      required:
        - id
        - status
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            - proposed
            - active
            - complete
    summary:
      type: object
      additionalProperties: false
      required:
        - what
        - why
      properties:
        what:
          type: array
          minItems: 1
          items:
            type: string
        why:
          type: array
          minItems: 1
          items:
            type: string
    scope:
      type: object
      additionalProperties: false
      required:
        - in
        - out
      properties:
        in:
          type: array
          items:
            type: string
        out:
          type: array
          items:
            type: string
    unchanged_behavior:
      type: array
      items:
        type: string
    roadmap:
      type: object
      additionalProperties: false
      required:
        - milestone
        - planned_change
      properties:
        milestone:
          type: string
        planned_change:
          type: string

schema: strict-spec-driven/schema/v1
schema_version: 1
schema_id: strict-spec-driven/change-proposal/v1
artifact_type: change_proposal
artifact_name: change-proposal
description: Strict YAML change proposal artifact.
example_ref: ../examples/change-proposal.yaml
additional_fields: false
fields:
  schema:
    type: string
    required: true
    const: strict-spec-driven/change-proposal/v1
  schema_version:
    type: integer
    required: true
    const: 1
  artifact_type:
    type: string
    required: true
    const: change_proposal
  schema_file:
    type: string
    required: true
  change:
    type: mapping
    required: true
    additional_fields: false
    fields:
      id:
        type: string
        required: true
        identifier: change
      status:
        type: string
        required: true
        enum:
          - proposed
          - active
          - complete
  summary:
    type: mapping
    required: true
    additional_fields: false
    fields:
      what:
        type: sequence
        required: true
        min_items: 1
        items:
          type: string
      why:
        type: sequence
        required: true
        min_items: 1
        items:
          type: string
  scope:
    type: mapping
    required: true
    additional_fields: false
    fields:
      in:
        type: sequence
        required: true
        items:
          type: string
      out:
        type: sequence
        required: true
        items:
          type: string
  unchanged_behavior:
    type: sequence
    required: true
    items:
      type: string
  roadmap:
    type: mapping
    required: false
    additional_fields: false
    fields:
      milestone:
        type: string
        required: true
      planned_change:
        type: string
        required: true

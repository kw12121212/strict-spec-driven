schema: strict-spec-driven/schema/v1
schema_version: 1
schema_id: strict-spec-driven/debug-session/v1
artifact_type: debug_session
artifact_name: debug-session
description: Strict YAML debug-session investigation artifact.
example_ref: ../../../examples/strict-spec-driven/debug-session.yaml
json_schema:
  $schema: "http://json-schema.org/draft-07/schema#"
  type: object
  additionalProperties: false
  required:
    - schema
    - schema_version
    - artifact_type
    - schema_file
    - debug_session
    - issue
    - scope
    - targets
    - reproduction
    - evidence
    - hypotheses
    - findings
    - human_checkpoints
    - manual_actions
    - cdp_health
    - replay
    - verification
  properties:
    schema:
      type: string
      const: strict-spec-driven/debug-session/v1
    schema_version:
      type: integer
      const: 1
    artifact_type:
      type: string
      const: debug_session
    schema_file:
      type: string
      minLength: 1
    debug_session:
      type: object
      additionalProperties: false
      required:
        - id
        - status
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$|^[a-z0-9]$"
        status:
          type: string
          enum:
            - proposed
            - reproducing
            - capturing
            - localizing
            - waiting_for_human
            - verifying
            - resolved
            - blocked
        owner:
          type: string
          minLength: 1
        created_at:
          type: string
          format: date-time
    issue:
      type: object
      additionalProperties: false
      required:
        - summary
        - observed_behavior
        - expected_behavior
      properties:
        summary:
          type: string
          minLength: 1
        observed_behavior:
          type: string
          minLength: 1
        expected_behavior:
          type: string
          minLength: 1
    scope:
      type: object
      additionalProperties: false
      required:
        - layers
        - out_of_scope
      properties:
        layers:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - web_api
              - frontend
              - electron
              - cdp_access
        out_of_scope:
          type: array
          items:
            type: string
            minLength: 1
    targets:
      type: object
      additionalProperties: false
      minProperties: 1
      patternProperties:
        "^[a-z0-9][a-z0-9-]*[a-z0-9]$|^[a-z0-9]$":
          type: object
          additionalProperties: false
          required:
            - layer
            - kind
            - label
            - notes
          properties:
            layer:
              type: string
              enum:
                - web_api
                - frontend
                - electron
                - cdp_access
            kind:
              type: string
              enum:
                - http_endpoint
                - browser_page
                - electron_app
                - cdp_target
            label:
              type: string
              minLength: 1
            url:
              type: string
              minLength: 1
            command:
              type: string
              minLength: 1
            cdp_endpoint:
              type: string
              minLength: 1
            notes:
              type: array
              items:
                type: string
                minLength: 1
    reproduction:
      type: object
      additionalProperties: false
      required:
        - preconditions
        - steps
        - expected_failure
      properties:
        preconditions:
          type: array
          items:
            type: string
            minLength: 1
        steps:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - action
            properties:
              id:
                type: string
                pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$|^[a-z0-9]$"
              action:
                type: string
                minLength: 1
              expected:
                type: string
                minLength: 1
              target:
                type: string
                pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$|^[a-z0-9]$"
        expected_failure:
          type: string
          minLength: 1
    evidence:
      type: object
      additionalProperties: false
      required:
        - directory
        - entries
      properties:
        directory:
          type: string
          minLength: 1
        entries:
          type: array
          items:
            $ref: "#/definitions/evidence_entry"
    hypotheses:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
          - id
          - statement
          - layer
          - status
          - evidence
        properties:
          id:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$|^[a-z0-9]$"
          statement:
            type: string
            minLength: 1
          layer:
            $ref: "#/definitions/layer"
          status:
            type: string
            enum:
              - open
              - supported
              - rejected
              - verified
          evidence:
            type: array
            items:
              type: string
              pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$|^[a-z0-9]$"
    findings:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
          - id
          - layer
          - summary
          - status
          - evidence
        properties:
          id:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$|^[a-z0-9]$"
          layer:
            $ref: "#/definitions/layer"
          target:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$|^[a-z0-9]$"
          summary:
            type: string
            minLength: 1
          status:
            type: string
            enum:
              - suspected
              - confirmed
              - fixed
              - wont_fix
          evidence:
            type: array
            items:
              type: string
              pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$|^[a-z0-9]$"
    human_checkpoints:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
          - id
          - reason
          - requested_action
          - sensitive
          - status
          - resume_condition
          - evidence_before
          - evidence_after
        properties:
          id:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$|^[a-z0-9]$"
          reason:
            type: string
            minLength: 1
          requested_action:
            type: string
            minLength: 1
          sensitive:
            type: boolean
          status:
            type: string
            enum:
              - pending
              - completed
              - skipped
          resume_condition:
            type: string
            minLength: 1
          evidence_before:
            type: array
            items:
              type: string
              pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$|^[a-z0-9]$"
          evidence_after:
            type: array
            items:
              type: string
              pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$|^[a-z0-9]$"
    manual_actions:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
          - id
          - checkpoint
          - actor
          - summary
          - secrets_recorded
          - status
          - evidence
        properties:
          id:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$|^[a-z0-9]$"
          checkpoint:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$|^[a-z0-9]$"
          actor:
            type: string
            enum:
              - human
              - agent
          summary:
            type: string
            minLength: 1
          secrets_recorded:
            type: boolean
            const: false
          status:
            type: string
            enum:
              - completed
              - skipped
          evidence:
            type: array
            items:
              type: string
              pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$|^[a-z0-9]$"
    cdp_health:
      type: object
      additionalProperties: false
      required:
        - required
        - checks
      properties:
        required:
          type: boolean
        checks:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - target
              - status
              - notes
            properties:
              id:
                type: string
                pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$|^[a-z0-9]$"
              target:
                type: string
                pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$|^[a-z0-9]$"
              status:
                type: string
                enum:
                  - not_checked
                  - ok
                  - failed
                  - unavailable
              endpoint:
                type: string
                minLength: 1
              selected_target:
                type: string
                minLength: 1
              notes:
                type: array
                items:
                  type: string
                  minLength: 1
    dev_session:
      type: object
      additionalProperties: false
      required:
        - declaration
        - services
        - lifecycle
        - unavailable_conditions
      properties:
        declaration:
          type: string
          minLength: 1
        session_id:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$|^[a-z0-9]$"
        services:
          type: array
          items:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$|^[a-z0-9]$"
        lifecycle:
          type: object
          additionalProperties: false
          required:
            - plan
            - start
            - status
            - logs
            - stop
            - cleanup_status
          properties:
            plan:
              $ref: "#/definitions/lifecycle_command"
            start:
              $ref: "#/definitions/lifecycle_command"
            status:
              $ref: "#/definitions/lifecycle_command"
            logs:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  - service
                  - command
                  - evidence
                properties:
                  service:
                    type: string
                    pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$|^[a-z0-9]$"
                  command:
                    type: string
                    minLength: 1
                  evidence:
                    type: array
                    items:
                      type: string
                      pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$|^[a-z0-9]$"
            stop:
              $ref: "#/definitions/lifecycle_command"
            cleanup_status:
              type: string
              enum:
                - not_started
                - not_needed
                - pending
                - stopped
                - failed
                - blocked
        unavailable_conditions:
          type: array
          items:
            type: string
            minLength: 1
    replay:
      type: object
      additionalProperties: false
      required:
        - commands
      properties:
        commands:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - command
              - working_directory
              - layer
              - expected_result
            properties:
              id:
                type: string
                pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$|^[a-z0-9]$"
              command:
                type: string
                minLength: 1
              working_directory:
                type: string
                minLength: 1
              layer:
                $ref: "#/definitions/layer"
              target:
                type: string
                pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$|^[a-z0-9]$"
              expected_result:
                type: string
                minLength: 1
    verification:
      type: object
      additionalProperties: false
      required:
        - status
        - steps
        - evidence
      properties:
        status:
          type: string
          enum:
            - not_started
            - pending
            - passed
            - failed
            - blocked
        steps:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - action
              - expected
              - status
            properties:
              id:
                type: string
                pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$|^[a-z0-9]$"
              action:
                type: string
                minLength: 1
              expected:
                type: string
                minLength: 1
              status:
                type: string
                enum:
                  - pending
                  - passed
                  - failed
                  - blocked
        evidence:
          type: array
          items:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$|^[a-z0-9]$"
        conclusion:
          type: string
          minLength: 1
  definitions:
    layer:
      type: string
      enum:
        - web_api
        - frontend
        - electron
        - cdp_access
    evidence_entry:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - path
        - layer
        - description
        - redacted
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$|^[a-z0-9]$"
        type:
          type: string
          enum:
            - screenshot
            - network_log
            - console_log
            - api_trace
            - dom_snapshot
            - cdp_snapshot
            - video
            - text_log
            - other
        path:
          type: string
          minLength: 1
        layer:
          $ref: "#/definitions/layer"
        target:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$|^[a-z0-9]$"
        description:
          type: string
          minLength: 1
        redacted:
          type: boolean
        captured_at:
          type: string
          format: date-time
    lifecycle_command:
      type: object
      additionalProperties: false
      required:
        - command
        - status
        - evidence
      properties:
        command:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - not_run
            - passed
            - failed
            - blocked
        evidence:
          type: array
          items:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$|^[a-z0-9]$"
        notes:
          type: array
          items:
            type: string
            minLength: 1

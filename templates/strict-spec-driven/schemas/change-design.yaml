schema: strict-spec-driven/schema/v1
schema_version: 1
schema_id: strict-spec-driven/change-design/v1
artifact_type: change_design
artifact_name: change-design
description: Strict YAML change design artifact.
example_ref: ../examples/change-design.yaml
json_schema:
  $schema: "http://json-schema.org/draft-07/schema#"
  type: object
  additionalProperties: false
  required:
    - schema
    - schema_version
    - artifact_type
    - schema_file
    - change
    - approach
    - decisions
    - alternatives
  properties:
    schema:
      type: string
      const: strict-spec-driven/change-design/v1
    schema_version:
      type: integer
      const: 1
    artifact_type:
      type: string
      const: change_design
    schema_file:
      type: string
    change:
      type: string
    approach:
      type: array
      minItems: 1
      items:
        type: string
    decisions:
      type: array
      items:
        oneOf:
          - type: string
          - type: object
            additionalProperties: false
            required:
              - id
              - decision
              - rationale
            properties:
              id:
                type: string
              decision:
                type: string
              rationale:
                type: string
    alternatives:
      type: array
      items:
        oneOf:
          - type: string
          - type: object
            additionalProperties: false
            required:
              - option
              - reason
            properties:
              option:
                type: string
              reason:
                type: string
    risks:
      type: array
      items:
        type: string

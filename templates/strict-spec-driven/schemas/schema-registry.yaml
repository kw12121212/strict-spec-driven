schema: strict-spec-driven/schema/v1
schema_version: 1
schema_id: strict-spec-driven/schema-registry/v1
artifact_type: schema_registry
artifact_name: schema-registry
description: Strict YAML schema registry artifact.
example_ref: ../../../examples/strict-spec-driven/schema-registry.yaml
json_schema:
  $schema: http://json-schema.org/draft-07/schema#
  type: object
  additionalProperties: false
  required:
    - schema
    - schema_version
    - artifact_type
    - schema_file
    - registry
    - entries
    - migration
  properties:
    schema:
      type: string
      const: strict-spec-driven/schema-registry/v1
    schema_version:
      type: integer
      const: 1
    artifact_type:
      type: string
      const: schema_registry
    schema_file:
      type: string
    registry:
      type: object
      additionalProperties: false
      required:
        - id
        - status
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            - current
            - deprecated
            - superseded
    entries:
      type: array
      minItems: 1
      description: Every registered artifact schema, each entry identified by its schema_id, which is unique across the sequence.
      items:
        type: object
        additionalProperties: false
        required:
          - schema_id
          - schema_version
          - artifact_type
          - artifact_name
          - schema_file
          - primary_example
          - compatibility
        properties:
          schema_id:
            type: string
          artifact_type:
            type: string
          artifact_name:
            type: string
          schema_file:
            type: string
          primary_example:
            type: string
          schema_version:
            type: integer
          compatibility:
            type: object
            additionalProperties: false
            required:
              - status
              - introduced_in
              - supersedes
              - compatible_with
              - notes
            properties:
              status:
                type: string
                enum:
                  - current
                  - deprecated
                  - superseded
              introduced_in:
                type: integer
              supersedes:
                type: array
                items:
                  type: string
              compatible_with:
                type: array
                items:
                  type: string
              notes:
                type: array
                items:
                  type: string
              superseded_by:
                type: string
    migration:
      type: object
      additionalProperties: false
      required:
        - legacy_root
        - strict_root
        - role_mappings
        - unsupported_shape_reporting
      properties:
        legacy_root:
          type: string
        strict_root:
          type: string
        role_mappings:
          type: array
          minItems: 1
          description: Legacy role to strict artifact mappings, each identified by its legacy_role, which is unique across the sequence.
          items:
            type: object
            additionalProperties: false
            required:
              - legacy_role
              - artifact_type
              - schema_id
            properties:
              legacy_role:
                type: string
              artifact_type:
                type: string
              schema_id:
                type: string
                description: Names an entries[].schema_id recorded in this same registry.
        unsupported_shape_reporting:
          type: object
          additionalProperties: false
          required:
            - warning_fields
            - manual_follow_up_field
          properties:
            warning_fields:
              type: array
              minItems: 1
              items:
                type: string
            manual_follow_up_field:
              type: string

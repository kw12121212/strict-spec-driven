schema: strict-spec-driven/schema/v1
schema_version: 1
schema_id: strict-spec-driven/main-spec/v1
artifact_type: main_spec
artifact_name: main-spec
description: Strict YAML main spec artifact.
example_ref: ../../../examples/strict-spec-driven/main-spec.yaml
json_schema:
  $schema: "http://json-schema.org/draft-07/schema#"
  definitions:
    step:
      type: object
      properties:
        GIVEN: { type: string }
        WHEN: { type: string }
        THEN: { type: string }
        AND: { type: string }
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
  type: object
  additionalProperties: false
  required:
    - schema
    - schema_version
    - artifact_type
    - schema_file
    - spec
    - mapping
    - requirements
  properties:
    schema:
      type: string
      const: strict-spec-driven/main-spec/v1
    schema_version:
      type: integer
      const: 1
    artifact_type:
      type: string
      const: main_spec
    schema_file:
      type: string
    spec:
      type: object
      additionalProperties: false
      required:
        - id
        - title
      properties:
        id:
          type: string
        title:
          type: string
    mapping:
      type: object
      additionalProperties: false
      required:
        - implementation
        - tests
      properties:
        implementation:
          type: array
          items:
            type: string
        tests:
          type: array
          items:
            type: string
    requirements:
      type: object
      additionalProperties:
        type: object
        additionalProperties: false
        required:
          - strength
          - statement
          - scenarios
        properties:
          strength:
            type: string
            enum:
              - MUST
              - SHOULD
              - MAY
          statement:
            type: string
          scenarios:
            type: object
            additionalProperties:
              type: array
              items:
                "$ref": "#/definitions/step"
              minItems: 1

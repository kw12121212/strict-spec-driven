schema: strict-spec-driven/schema/v1
schema_version: 1
schema_id: strict-spec-driven/ticket/v1
artifact_type: ticket
artifact_name: ticket
description: Strict YAML ticket artifact capturing a pure requirement (problem, desired outcome, intent) with lifecycle status, provenance links, and an embedded dispatch-decision record.
example_ref: ../../../examples/strict-spec-driven/ticket.yaml
json_schema:
  $schema: "http://json-schema.org/draft-07/schema#"
  type: object
  additionalProperties: false
  required:
    - schema
    - schema_version
    - artifact_type
    - schema_file
    - ticket
    - requirement
    - status
    - created_at
    - updated_at
  properties:
    schema:
      type: string
      const: strict-spec-driven/ticket/v1
    schema_version:
      type: integer
      const: 1
    artifact_type:
      type: string
      const: ticket
    schema_file:
      type: string
    ticket:
      type: object
      additionalProperties: false
      required:
        - id
        - title
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$|^[a-z0-9]$"
        title:
          type: string
          minLength: 1
    requirement:
      type: object
      additionalProperties: false
      required:
        - problem
        - desired_outcome
      properties:
        problem:
          type: string
          minLength: 1
        desired_outcome:
          type: string
          minLength: 1
        intent:
          type: string
          minLength: 1
    status:
      type: string
      enum:
        - open
        - needs_input
        - promoted
        - implemented
        - rejected
    created_at:
      type: string
      minLength: 1
    updated_at:
      type: string
      minLength: 1
    labels:
      type: array
      items:
        type: string
        minLength: 1
    external_tracker:
      type: object
      additionalProperties: false
      required:
        - label
        - target
      properties:
        label:
          type: string
          minLength: 1
        target:
          type: string
          minLength: 1
    provenance:
      type: object
      additionalProperties: false
      properties:
        promoted_to:
          type: string
          pattern: "^\\d{4}-"
        implemented_by:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - label
              - target
            properties:
              label:
                type: string
                minLength: 1
              target:
                type: string
                minLength: 1
    dispatch_decision:
      type: object
      additionalProperties: false
      required:
        - outcome
        - rationale
        - decided_at
      properties:
        outcome:
          type: string
          enum:
            - not_implemented
            - implemented
            - not_wanted
        evidence:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - label
              - target
            properties:
              label:
                type: string
                minLength: 1
              target:
                type: string
                minLength: 1
        rationale:
          type: string
          minLength: 1
        decided_at:
          type: string
          minLength: 1
    extensions:
      type: object
      additionalProperties: true

schema: strict-spec-driven/schema/v1
schema_version: 1
schema_id: strict-spec-driven/planned-change-entry/v1
artifact_type: planned_change_entry
artifact_name: planned-change-entry
description: Strict YAML planned change entry artifact.
example_ref: ../examples/planned-change-entry.yaml
json_schema:
  $schema: "http://json-schema.org/draft-07/schema#"
  type: object
  additionalProperties: false
  required:
    - schema
    - schema_version
    - artifact_type
    - schema_file
    - id
    - status
    - summary
    - depends_on
  properties:
    schema:
      type: string
      const: strict-spec-driven/planned-change-entry/v1
    schema_version:
      type: integer
      const: 1
    artifact_type:
      type: string
      const: planned_change_entry
    schema_file:
      type: string
    id:
      type: string
    status:
      type: string
      enum:
        - planned
        - complete
    summary:
      type: string
    depends_on:
      type: array
      items:
        type: string

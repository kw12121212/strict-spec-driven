schema: strict-spec-driven/schema/v1
schema_version: 1
schema_id: strict-spec-driven/question-list/v1
artifact_type: question_list
artifact_name: question-list
description: Strict YAML question list artifact.
example_ref: ../../../examples/strict-spec-driven/question-list.yaml
coverage_examples:
  - ../../../examples/strict-spec-driven/question-list.open.yaml
json_schema:
  $schema: "http://json-schema.org/draft-07/schema#"
  type: object
  additionalProperties: false
  required:
    - schema
    - schema_version
    - artifact_type
    - schema_file
    - change
    - open
    - resolved
  properties:
    schema:
      type: string
      const: strict-spec-driven/question-list/v1
    schema_version:
      type: integer
      const: 1
    artifact_type:
      type: string
      const: question_list
    schema_file:
      type: string
    change:
      type: string
    open:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
          - id
          - question
          - context
          - status
        properties:
          id:
            type: string
          question:
            type: string
          context:
            type: string
          kind:
            type: string
            enum:
              - requirement
              - technical
          answered_by:
            type: string
            enum:
              - human
              - roadmap
              - assumption
          status:
            type: string
            const: open
    resolved:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
          - id
          - question
          - context
          - answer
          - status
        properties:
          id:
            type: string
          question:
            type: string
          context:
            type: string
          kind:
            type: string
            enum:
              - requirement
              - technical
          answered_by:
            type: string
            enum:
              - human
              - roadmap
              - assumption
          answer:
            type: string
          status:
            type: string
            const: resolved
